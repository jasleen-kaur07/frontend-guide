10: QuantityStepper\n```vue\n<script setup>\nconst props = defineProps({ modelValue: { type: Number, required: true }, min: { type: Number, default: 1 } })\nconst emit = defineEmits(['update:modelValue', 'change'])\nconst set = v => { const n = Math.max(props.min, v); emit('update:modelValue', n); emit('change', n) }\n<\/script>\n<template><button @click=\"set(modelValue - 1)\" :disabled=\"modelValue <= min\">\u2212<\/button> {{ modelValue }} <button @click=\"set(modelValue + 1)\">+<\/button><\/template>\n<!-- parent: <QuantityStepper v-model=\"item.qty\" @change=\"recalc\" /> -->\n```\n**Notice:** the child asks the parent to change the value; it never edits `modelValue` itself.\n\n### V11: BaseInput with `defineModel`\n```vue\n<script setup>\nconst props = defineProps({ label: String, error: String, id: { type: String, default: () => `in-${Math.random().toString(36).slice(2)}` } })\nconst model = defineModel()\n<\/script>\n<template>\n  <div>\n    <label :for=\"id\">{{ label }}<\/label>\n    <input :id=\"id\" v-model=\"model\" :aria-invalid=\"!!error\" :aria-describedby=\"error ? `${id}-e` : undefined\">\n    <p v-if=\"error\" :id=\"`${id}-e`\" role=\"alert\">{{ error }}<\/p>\n  <\/div>\n<\/template>\n```\n**Notice:** `defineModel()` generates the `modelValue` prop + `update:modelValue` emit for you; a unique `id` links label and input.\n\n### V12: BaseCard\n```vue\n<template>\n  <section class=\"card\">\n    <header><slot name=\"header\">Untitled<\/slot><\/header>\n    <slot />\n    <footer v-if=\"$slots.footer\"><slot name=\"footer\" /><\/footer>\n  <\/section>\n<\/template>\n<!-- <BaseCard><template #header>Orders<\/template>Body<template #footer>Footer<\/template><\/BaseCard> -->\n```\n\n### V13: DataList (scoped slot)\n```vue\n<!-- DataList.vue -->\n<script setup>defineProps({ items: { type: Array, default: () => [] } })<\/script>\n<template>\n  <ul><li v-for=\"(item, i) in items\" :key=\"item.id\"><slot :item=\"item\" :index=\"i\">{{ item.name }}<\/slot><\/li><\/ul>\n<\/template>\n<!-- usage -->\n<DataList :items=\"orders\"><template #default=\"{ item }\">#{{ item.id }} \u00b7 \u20b9{{ item.total }}<\/template><\/DataList>\n<DataList :items=\"users\"><template #default=\"{ item, index }\">{{ index + 1 }}. <strong>{{ item.name }}<\/strong> ({{ item.city }})<\/template><\/DataList>\n```\n**Who owns what:** `DataList` owns the **loop and the data**; the parent owns the **markup** for each item. One component, two looks.\n\n### V14: BaseModal (Teleport + a11y)\n```vue\n<script setup>\nimport { ref, watch, nextTick, onUnmounted } from 'vue'\nconst props = defineProps({ open: Boolean, title: String })\nconst emit = defineEmits(['update:open'])\nconst panel = ref(null); let trigger = null\nconst close = () => emit('update:open', false)\nconst onKey = e => e.key === 'Escape' && close()\nwatch(() => props.open, async o => {\n  if (o) { trigger = document.activeElement; document.body.style.overflow = 'hidden'; addEventListener('keydown', onKey); await nextTick(); panel.value?.focus() }\n  else { document.body.style.overflow = ''; removeEventListener('keydown', onKey); trigger?.focus() }\n})\nonUnmounted(() => { document.body.style.overflow = ''; removeEventListener('keydown', onKey) })\n<\/script>\n<template>\n  <Teleport to=\"body\">\n    <div v-if=\"open\" class=\"overlay\" @click.self=\"close\">\n      <div ref=\"panel\" class=\"panel\" role=\"dialog\" aria-modal=\"true\" :aria-label=\"title\" tabindex=\"-1\">\n        <h2>{{ title }}<\/h2><slot />\n        <div class=\"actions\"><slot name=\"actions\"><button @click=\"close\">Close<\/button><\/slot><\/div>\n      <\/div>\n    <\/div>\n  <\/Teleport>\n<\/template>\n```\n**Notice:** `<Teleport to=\"body\">` escapes stacking-context traps (CSS C8); focus moves in and returns to the trigger; scroll lock and listener are cleaned up.  *(A native `<dialog>` version is shorter: see H11.)*\n\n### V15: Lifecycle logger (observed order)\n```\nmount:   parent setup \u2192 parent onBeforeMount \u2192 child setup \u2192 child onBeforeMount \u2192 child onMounted \u2192 parent onMounted\nupdate:  parent onBeforeUpdate \u2192 child onBeforeUpdate \u2192 child onUpdated \u2192 parent onUpdated\nunmount (child removed with v-if): parent onBeforeUpdate \u2192 child onBeforeUnmount \u2192 child onUnmounted \u2192 parent onUpdated\n```\n**Why child mounts first:** a parent can only be \"mounted\" once all its children are in the DOM.\n\n---\n\n## Composables and async\n\n### V16: Fetch on mount with all states\n```vue\n<script setup>\nimport { ref, onMounted, onUnmounted } from 'vue'\nconst posts = ref([]), status = ref('idle'), error = ref(null)\nlet ctrl\nasync function load() {\n  ctrl?.abort(); ctrl = new AbortController(); status.value = 'loading'; error.value = null\n  try {\n    const r = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=10', { signal: ctrl.signal })\n    if (!r.ok) throw new Error(`HTTP ${r.status}`)\n    posts.value = await r.json(); status.value = 'success'\n  } catch (e) { if (e.name !== 'AbortError') { error.value = e.message; status.value = 'error' } }\n}\nonMounted(load); onUnmounted(() => ctrl?.abort())\n<\/script>\n<template>\n  <p v-if=\"status === 'loading'\">Loading\u2026<\/p>\n  <p v-else-if=\"status === 'error'\" role=\"alert\">{{ error }} <button @click=\"load\">Retry<\/button><\/p>\n  <p v-else-if=\"!posts.length\">No posts<\/p>\n  <ul v-else><li v-for=\"p in posts\" :key=\"p.id\">{{ p.title }}<\/li><\/ul>\n<\/template>\n```\n\n### V17: Clock + resize with cleanup\n```vue\n<script setup>\nimport { ref, onMounted, onUnmounted } from 'vue'\nconst now = ref(new Date()), w = ref(innerWidth); let t\nconst onResize = () => (w.value = innerWidth)\nonMounted(() => { t = setInterval(() => (now.value = new Date()), 1000); addEventListener('resize', onResize) })\nonUnmounted(() => { clearInterval(t); removeEventListener('resize', onResize) })\n<\/script>\n<template><p>{{ now.toLocaleTimeString() }} \u00b7 {{ w }}px<\/p><\/template>\n```\n**Leak demo:** delete the `onUnmounted` body, toggle the component 20\u00d7 with `v-if`: DevTools \u2192 Performance Monitor shows **JS event listeners** climbing by one per toggle, and the old intervals keep running (updating refs of destroyed components).\n\n### V18: Composables\n```js\nimport { ref, watch } from 'vue'\nexport const useCounter = (start = 0) => { const n = ref(start); return { n, inc: () => n.value++, dec: () => n.value--, reset: () => (n.value = start) } }\nexport const useToggle = (init = false) => { const on = ref(init); return { on, toggle: () => (on.value = !on.value) } }\nexport function useLocalStorage(key, initial) {\n  let v = initial\n  try { const s = localStorage.getItem(key); if (s !== null) v = JSON.parse(s) } catch {}\n  const r = ref(v)\n  watch(r, nv => { try { localStorage.setItem(key, JSON.stringify(nv)) } catch {} }, { deep: true })\n  return r\n}\n```\n**Notice:** each call creates **its own** state (two components using `useCounter()` don't share it: shared state belongs in Pinia).\n\n### V19: `useFetch`\n```js\nimport { ref, watchEffect, toValue, onUnmounted } from 'vue'\nexport function useFetch(url) {                       // url: string | ref | getter\n  const data = ref(null), error = ref(null), loading = ref(false); let ctrl\n  async function run() {\n    ctrl?.abort(); ctrl = new AbortController(); loading.value = true; error.value = null\n    try {\n      const r = await fetch(toValue(url), { signal: ctrl.signal })\n      if (!r.ok) throw new Error(`HTTP ${r.status}`)\n      data.value = await r.json()\n    } catch (e) { if (e.name !== 'AbortError') error.value = e.message } finally { loading.value = false }\n  }\n  watchEffect(run)                                    // reads toValue(url) \u2192 re-runs when it changes\n  onUnmounted(() => ctrl?.abort())\n  return { data, error, loading, refetch: run }\n}\n// const id = ref(1); const { data } = useFetch(() => `https://jsonplaceholder.typicode.com/posts/${id.value}`)\n```\n**Notice:** `toValue` accepts a plain string, a ref or a getter; `watchEffect` auto-tracks whatever `run` reads *synchronously* (before the first `await`).\n\n### V20: Debounced search\n```js\nimport { ref, watch } from 'vue'\nexport function useDebouncedRef(source, ms = 350) {\n  const out = ref(source.value); let t\n  watch(source, v => { clearTimeout(t); t = setTimeout(() => (out.value = v), ms) })\n  return out\n}\n```\n```vue\n<script setup>\nconst q = ref(''), debouncedQ = useDebouncedRef(q)\nconst { data, loading } = useFetch(() => `https://jsonplaceholder.typicode.com/posts?q=${encodeURIComponent(debouncedQ.value)}`)\n<\/script>\n<template>\n  <input v-model=\"q\" type=\"search\" placeholder=\"Search posts\" aria-label=\"Search posts\">\n  <p v-if=\"loading\">Searching\u2026<\/p><p v-else-if=\"data && !data.length\">No results for \"{{ debouncedQ }}\"<\/p>\n  <ul v-else><li v-for=\"p in data\" :key=\"p.id\">{{ p.title }}<\/li><\/ul>\n<\/template>\n```\n**Notice:** the **input** binds to the fast `q`; the **request** depends on the slow `debouncedQ` \u2192 one request per pause; `useFetch` aborts the previous one.\n\n---\n\n## Forms\n\n### V21: Form validation with server errors\n```vue\n<script setup>\nimport { reactive, ref, computed } from 'vue'\nconst form = reactive({ name: '', email: '', password: '' })\nconst touched = reactive({ name: false, email: false, password: false })\nconst serverErrors = ref({}), submitting = ref(false), done = ref(false)\nconst errors = computed(() => ({\n  name: form.name.trim().length < 2 ? 'At least 2 characters' : '',\n  email: /^\\S+@\\S+\\.\\S+$/.test(form.email) ? '' : 'Enter a valid email',\n  password: form.password.length < 8 ? 'At least 8 characters' : '',\n}))\nconst valid = computed(() => Object.values(errors.value).every(e => !e))\nconst msg = f => (touched[f] && (errors.value[f] || serverErrors.value[f])) || ''\nconst mockApi = async d => { await new Promise(r => setTimeout(r, 500)); if (d.email === 'taken@x.com') throw { status: 400, body: { errors: [{ field: 'email', message: 'Already registered' }] } } }\n\nasync function submit() {\n  Object.keys(touched).forEach(k => (touched[k] = true))\n  if (!valid.value || submitting.value) return\n  submitting.value = true; serverErrors.value = {}\n  try { await mockApi({ ...form }); done.value = true }\n  catch (e) { if (e.status === 400) serverErrors.value = Object.fromEntries(e.body.errors.map(x => [x.field, x.message])) }\n  finally { submitting.value = false }\n}\n<\/script>\n<template>\n  <form @submit.prevent=\"submit\" novalidate>\n    <label for=\"n\">Name<\/label><input id=\"n\" v-model.trim=\"form.name\" @blur=\"touched.name = true\">\n    <p v-if=\"msg('name')\" role=\"alert\">{{ msg('name') }}<\/p>\n    <label for=\"e\">Email<\/label><input id=\"e\" type=\"email\" v-model.trim=\"form.email\" @blur=\"touched.email = true\">\n    <p v-if=\"msg('email')\" role=\"alert\">{{ msg('email') }}<\/p>\n    <label for=\"p\">Password<\/label><input id=\"p\" type=\"password\" v-model=\"form.password\" @blur=\"touched.password = true\">\n    <p v-if=\"msg('password')\" role=\"alert\">{{ msg('password') }}<\/p>\n    <button :disabled=\"submitting\">{{ submitting ? 'Creating\u2026' : 'Create account' }}<\/button>\n    <p v-if=\"done\" role=\"status\">Account created<\/p>\n  <\/form>\n<\/template>\n```\n**Notice:** errors appear after blur (`touched`) or submit; the server's field errors show under the same inputs; `submitting` blocks double submits.\n\n### V22: Dynamic phone rows\n```vue\n<script setup>\nimport { reactive, computed } from 'vue'\nconst form = reactive({ phones: [{ uid: crypto.randomUUID(), value: '' }] })\nconst bad = p => !/^\\d{10}$/.test(p.value)\nconst valid = computed(() => form.phones.every(p => !bad(p)))\nconst add = () => form.phones.push({ uid: crypto.randomUUID(), value: '' })\nconst remove = i => form.phones.length > 1 && form.phones.splice(i, 1)\n<\/script>\n<template>\n  <div v-for=\"(p, i) in form.phones\" :key=\"p.uid\">\n    <input v-model=\"p.value\" inputmode=\"numeric\" :aria-invalid=\"bad(p)\" :aria-label=\"`Phone ${i + 1}`\">\n    <button type=\"button\" @click=\"remove(i)\">Remove<\/button>\n  <\/div>\n  <button type=\"button\" @click=\"add\">Add phone<\/button>\n  <button :disabled=\"!valid\">Submit<\/button>\n  <pre>{{ JSON.stringify(form.phones.map(p => p.value)) }}<\/pre>\n<\/template>\n```\n**Why `uid` keys:** with index keys, removing row 1 makes Vue reuse the DOM nodes, so the typed text appears in the wrong row.\n\n---\n\n## Router, state, API\n\n### V23: Router basics\n```js\n// router/index.js\nimport { createRouter, createWebHistory } from 'vue-router'\nexport default createRouter({\n  history: createWebHistory(),\n  routes: [\n    { path: '/', name: 'home', component: () => import('@/views/HomeView.vue') },\n    { path: '/about', name: 'about', component: () => import('@/views/AboutView.vue') },\n    { path: '/users', name: 'users', component: () => import('@/views/UsersView.vue') },\n    { path: '/:pathMatch(.*)*', name: 'not-found', component: () => import('@/views/NotFoundView.vue') },\n  ],\n})\n```\n```vue\n<nav><RouterLink to=\"/\" active-class=\"on\">Home<\/RouterLink> <RouterLink to=\"/about\" active-class=\"on\">About<\/RouterLink> <RouterLink to=\"/users\" active-class=\"on\">Users<\/RouterLink><\/nav>\n<RouterView />\n```\n**Check lazy loading:** Network tab shows a new JS chunk the first time you open each page.\n\n### V24: `/users/:id` with tabs\n```vue\n<script setup>\nimport { ref, computed, watch } from 'vue'\nimport { useRoute, useRouter } from 'vue-router'\nconst route = useRoute(), router = useRouter(); const user = ref(null), err = ref(null)\nwatch(() => route.params.id, async id => {\n  err.value = null; user.value = null\n  try { const r = await fetch(`https://jsonplaceholder.typicode.com/users/${id}`); if (!r.ok) throw new Error(r.status); user.value = await r.json() }\n  catch (e) { err.value = `Could not load user (${e.message})` }\n}, { immediate: true })\nconst tab = computed(() => route.query.tab ?? 'info')\nconst setTab = t => router.replace({ query: { ...route.query, tab: t } })\n<\/script>\n<template>\n  <p v-if=\"err\" role=\"alert\">{{ err }}<\/p><p v-else-if=\"!user\">Loading\u2026<\/p>\n  <template v-else>\n    <h1>{{ user.name }}<\/h1>\n    <button v-for=\"t in ['info', 'posts']\" :key=\"t\" :aria-pressed=\"tab === t\" @click=\"setTab(t)\">{{ t }}<\/button>\n    <div v-if=\"tab === 'info'\">{{ user.email }}<\/div><div v-else>Posts for {{ user.id }}\u2026<\/div>\n  <\/template>\n<\/template>\n```\n**Notice:** going `/users/1 \u2192 /users/2` **reuses the component**, so `onMounted` wouldn't re-run: the `watch` handles it. Use `router.push` instead of `replace` if you want each tab in Back history.\n\n### V25: Guards with safe redirect\n```js\nrouter.beforeEach(to => {\n  const auth = useAuthStore()\n  if (to.meta.requiresAuth && !auth.isLoggedIn) return { name: 'login', query: { redirect: to.fullPath } }\n  if (to.name === 'login' && auth.isLoggedIn) return { name: 'home' }\n})\n// after login:\nconst r = route.query.redirect\nrouter.replace(typeof r === 'string' && r.startsWith('/') && !r.startsWith('//') ? r : '/')\n```\n**Notice:** the redirect is only accepted if it's a **relative path** (`/\u2026` but not `//evil.com`), preventing open-redirect abuse.\n\n### V26: Cart store\n```js\n// stores/cart.js\nimport { defineStore } from 'pinia'\nimport { ref, computed, watch } from 'vue'\nexport const useCartStore = defineStore('cart', () => {\n  const items = ref(JSON.parse(localStorage.getItem('cart') ?? '[]'))\n  const count = computed(() => items.value.reduce((n, i) => n + i.qty, 0))\n  const total = computed(() => items.value.reduce((s, i) => s + i.price * i.qty, 0))\n  function add(p) { const f = items.value.find(i => i.id === p.id); f ? f.qty++ : items.value.push({ ...p, qty: 1 }) }\n  function remove(id) { items.value = items.value.filter(i => i.id !== id) }\n  function clear() { items.value = [] }\n  watch(items, v => localStorage.setItem('cart', JSON.stringify(v)), { deep: true })\n  return { items, count, total, add, remove, clear }\n})\n```\n```vue\n<script setup>\nimport { storeToRefs } from 'pinia'\nconst cart = useCartStore(); const { count, total } = storeToRefs(cart)    // \u2705 reactive\n// const { count } = cart   \u2190 \u274c BUG: copies the number once; badge never updates\n<\/script>\n```\n\n### V27: Async store with caching\n```js\nexport const useUsersStore = defineStore('users', () => {\n  const items = ref([]), status = ref('idle'), error = ref(null); let loadedAt = 0\n  async function fetchUsers({ force = false } = {}) {\n    if (!force && status.value === 'success' && Date.now() - loadedAt < 60_000) return      // cache for 60s\n    status.value = 'loading'; error.value = null\n    try { items.value = await userApi.list(); loadedAt = Date.now(); status.value = 'success' }\n    catch (e) { error.value = e.message; status.value = 'error' }\n  }\n  return { items, status, error, fetchUsers }\n})\n```\n**Notice:** several components can call `fetchUsers()` on mount; only the first causes a request within 60 s. To avoid two *simultaneous* calls, also keep an in-flight promise.\n\n### V28: API service layer\n```js\n// services/http.js\nimport axios from 'axios'\nexport const http = axios.create({ baseURL: import.meta.env.VITE_API_BASE_URL, timeout: 10000 })\nhttp.interceptors.request.use(cfg => { const t = sessionStorage.getItem('token'); if (t) cfg.headers.Authorization = `Bearer ${t}`; return cfg })\nhttp.interceptors.response.use(r => r.data, e => Promise.reject({\n  status: e.response?.status ?? 0, message: e.response?.data?.message ?? 'Network error', body: e.response?.data, canceled: axios.isCancel(e) }))\n\n// services/userApi.js\nimport { http } from './http'\nimport { userApiMock } from './mock/userApi.mock'\nconst real = { list: (p, cfg) => http.get('/users', { params: p, ...cfg }), get: id => http.get(`/users/${id}`), create: d => http.post('/users', d) }\nexport const userApi = import.meta.env.VITE_USE_MOCK === 'true' ? userApiMock : real\n```\n**Notice:** components import only `userApi`; flipping `VITE_USE_MOCK` needs no component change; the interceptor gives every caller the same error shape.\n\n### V29: Pagination + search page\n```vue\n<script setup>\nimport { ref, watch, onMounted } from 'vue'\nimport { useRoute, useRouter } from 'vue-router'\nconst route = useRoute(), router = useRouter()\nconst q = ref(route.query.q ?? ''), page = ref(Number(route.query.page ?? 0))\nconst rows = ref([]), total = ref(0), loading = ref(false), size = 10; let t, ctrl\nconst mock = async ({ q, page }) => { await new Promise(r => setTimeout(r, 300)); const all = Array.from({ length: 57 }, (_, i) => ({ id: i + 1, name: `User ${i + 1}` })).filter(u => u.name.toLowerCase().includes(q.toLowerCase())); return { content: all.slice(page * size, page * size + size), totalElements: all.length } }\nasync function load() {\n  loading.value = true\n  const res = await mock({ q: q.value, page: page.value }); rows.value = res.content; total.value = res.totalElements; loading.value = false\n  router.replace({ query: { q: q.value || undefined, page: page.value || undefined } })     // URL \u2194 state\n}\nwatch(q, () => { page.value = 0; clearTimeout(t); t = setTimeout(load, 350) })               // new search \u2192 first page\nwatch(page, load); onMounted(load)\nconst pages = () => Math.ceil(total.value / size)\n<\/script>\n<template>\n  <input v-model=\"q\" type=\"search\" aria-label=\"Search users\">\n  <table><tbody>\n    <template v-if=\"loading\"><tr v-for=\"n in size\" :key=\"`s${n}`\" class=\"sk\"><td>&nbsp;<\/td><\/tr><\/template>\n    <template v-else><tr v-for=\"u in rows\" :key=\"u.id\"><td>{{ u.name }}<\/td><\/tr><\/template>\n  <\/tbody><\/table>\n  <button :disabled=\"page === 0\" @click=\"page--\">Prev<\/button> {{ page + 1 }} / {{ pages() || 1 }} <button :disabled=\"page + 1 >= pages()\" @click=\"page++\">Next<\/button>\n<\/template>\n```\n**Notice:** `v-if` wraps a `<template>` and `v-for` sits on the inner row (never both on one element); search resets `page` to 0; the URL keeps state across reloads.\n\n### V30: Communication map (answer key)\n| Need | Mechanism | Why |\n|---|---|---|\n| Show a user in a card | **props** | parent \u2192 child data |\n| Row's \"Delete\" click | **emit** `delete` | child \u2192 parent intent |\n| Search box component | **`v-model`** (`defineModel`) | two-way contract, tiny API |\n| Card with custom body | **slots** | parent supplies markup |\n| Theme/form context for a subtree | **provide/inject** | avoids drilling through layout components |\n| Logged-in user, cart | **Pinia** | global, survives navigation |\n```\nPage \u2500\u2500props\u2193 / events\u2191\u2500\u2500\u25b6 UserTable \u2500\u2500props\u2193 / events\u2191\u2500\u2500\u25b6 UserRow\nPage \u2500\u2500v-model\u2500\u2500\u25b6 SearchBox          Page \u2500\u2500slots\u2500\u2500\u25b6 BaseCard\nApp \u2500\u2500provide(theme)\u2500\u2500\u25b6 (any descendant inject)       Pinia(auth, cart) \u25c0\u2500\u2500\u25b6 any component\n```\n**Anti-pattern to avoid:** pushing *everything* through Pinia: local UI state (open dropdown, draft text) stays in the component.\n\n---\n**Next \u2192 Workbook 4: integrated and company-stack solutions.**\n\n\n# SOLUTIONS WORKBOOK 4: INTEGRATED AND COMPANY-STACK (full code, with explanations)\n\n> Attempt first. These are bigger: each solution shows the **core code and the design decisions**; wire them into a Vite + Vue 3 project. *Code is written carefully but not executed here.*\n\n---\n\n# INTEGRATED SOLUTIONS\n\n### I1: Contact form: vanilla and Vue\n**Vanilla**\n```html\n<form id=\"f\" novalidate>\n  <label for=\"n\">Name<\/label><input id=\"n\" name=\"name\" required>\n  <label for=\"e\">Email<\/label><input id=\"e\" name=\"email\" type=\"email\" required>\n  <label for=\"m\">Message<\/label><textarea id=\"m\" name=\"message\" minlength=\"10\" required><\/textarea>\n  <p id=\"err\" role=\"alert\"><\/p><button id=\"b\">Send<\/button><p id=\"ok\" role=\"status\"><\/p>\n<\/form>\n<script type=\"module\">\n  f.addEventListener('submit', async ev => {\n    ev.preventDefault()\n    const d = Object.fromEntries(new FormData(f))\n    if (!d.name || !/^\\S+@\\S+\\.\\S+$/.test(d.email) || d.message.length < 10) { err.textContent = 'Please check all fields.'; return }\n    err.textContent = ''; b.disabled = true; b.textContent = 'Sending\u2026'\n    try {\n      const r = await fetch('https://jsonplaceholder.typicode.com/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: d.name, body: d.message, userId: 1 }) })\n      if (!r.ok) throw new Error(); const saved = await r.json(); ok.textContent = `Sent! Reference #${saved.id}`; f.reset()   // id 101\n    } catch { err.textContent = 'Could not send. Please retry.' }\n    finally { b.disabled = false; b.textContent = 'Send' }\n  })\n<\/script>\n```\n**Vue**\n```vue\n<script setup>\nimport { reactive, ref } from 'vue'\nconst f = reactive({ name: '', email: '', message: '' }), state = ref('idle'), err = ref(''), ref_ = ref(null)\nasync function submit() {\n  if (!f.name || !/^\\S+@\\S+\\.\\S+$/.test(f.email) || f.message.length < 10) { err.value = 'Please check all fields.'; return }\n  state.value = 'sending'; err.value = ''\n  try {\n    const r = await fetch('https://jsonplaceholder.typicode.com/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: f.name, body: f.message, userId: 1 }) })\n    if (!r.ok) throw new Error(); ref_.value = (await r.json()).id; state.value = 'sent'; Object.assign(f, { name: '', email: '', message: '' })\n  } catch { state.value = 'idle'; err.value = 'Could not send. Please retry.' }\n}\n<\/script>\n<template>\n  <form @submit.prevent=\"submit\" novalidate>\n    <label for=\"n\">Name<\/label><input id=\"n\" v-model.trim=\"f.name\">\n    <label for=\"e\">Email<\/label><input id=\"e\" type=\"email\" v-model.trim=\"f.email\">\n    <label for=\"m\">Message<\/label><textarea id=\"m\" v-model=\"f.message\"><\/textarea>\n    <p v-if=\"err\" role=\"alert\">{{ err }}<\/p><p v-if=\"state === 'sent'\" role=\"status\">Sent! Reference #{{ ref_ }}<\/p>\n    <button :disabled=\"state === 'sending'\">{{ state === 'sending' ? 'Sending\u2026' : 'Send' }}<\/button>\n  <\/form>\n<\/template>\n```\n**Comparison:** vanilla touches the DOM 6 times (`textContent`, `disabled`\u2026); Vue declares *what the UI looks like for each state* and has zero manual DOM code. **Mock a Spring 400:** map `{errors:[{field,message}]}` onto a `serverErrors` object keyed by field (see V21).\n\n### I2: Live search with filters and URL sync\n```vue\n<script setup>\nimport { ref, computed, watch } from 'vue'\nimport { useRoute, useRouter } from 'vue-router'\nconst route = useRoute(), router = useRouter()\nconst q = ref(route.query.q ?? ''), cat = ref(route.query.cat ?? 'all'), sort = ref(route.query.sort ?? 'name')\nconst debouncedQ = useDebouncedRef(q, 300)\nconst all = [{ id: 1, name: 'Red Sneakers', cat: 'shoes', price: 1299 }, { id: 2, name: 'Blue Cap', cat: 'caps', price: 299 }, { id: 3, name: 'Running Socks', cat: 'socks', price: 199 }]\nconst rows = computed(() => all\n  .filter(p => (cat.value === 'all' || p.cat === cat.value) && p.name.toLowerCase().includes(debouncedQ.value.toLowerCase()))\n  .sort((a, b) => sort.value === 'price' ? a.price - b.price : a.name.localeCompare(b.name)))\nwatch([debouncedQ, cat, sort], () => router.push({ query: { q: debouncedQ.value || undefined, cat: cat.value !== 'all' ? cat.value : undefined, sort: sort.value !== 'name' ? sort.value : undefined } }))\nwatch(() => route.query, qq => { q.value = qq.q ?? ''; cat.value = qq.cat ?? 'all'; sort.value = qq.sort ?? 'name' })   // Back/Forward restores filters\nconst parts = computed(() => { const t = debouncedQ.value; return t ? name => name.split(new RegExp(`(${t.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')})`, 'ig')) : null })\n<\/script>\n<template>\n  <input v-model=\"q\" type=\"search\" aria-label=\"Search\"><select v-model=\"cat\"><option>all<\/option><option>shoes<\/option><option>caps<\/option><option>socks<\/option><\/select>\n  <select v-model=\"sort\"><option value=\"name\">Name<\/option><option value=\"price\">Price<\/option><\/select>\n  <p v-if=\"!rows.length\">No products match.<\/p>\n  <ul><li v-for=\"p in rows\" :key=\"p.id\">\n    <template v-if=\"parts\"><template v-for=\"(s, i) in parts(p.name)\" :key=\"i\"><mark v-if=\"s.toLowerCase() === debouncedQ.toLowerCase()\">{{ s }}<\/mark><template v-else>{{ s }}<\/template><\/template><\/template>\n    <template v-else>{{ p.name }}<\/template> \u00b7 \u20b9{{ p.price }}<\/li><\/ul>\n<\/template>\n```\n**Notice:** `push` (not `replace`) so Back walks through filter states; the second watcher feeds URL changes back into state; **highlight is built from text segments + `<mark>`**, never `v-html` (XSS-safe); the regex-escape stops `.` or `(` in the search text from breaking the pattern.\n\n### I3: Accessible dropdown (vanilla core) and modal\n```html\n<button id=\"btn\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-controls=\"lb\">Choose status<\/button>\n<ul id=\"lb\" role=\"listbox\" hidden tabindex=\"-1\">\n  <li role=\"option\" id=\"o1\">All<\/li><li role=\"option\" id=\"o2\">Open<\/li><li role=\"option\" id=\"o3\">Closed<\/li>\n<\/ul>\n<script type=\"module\">\n  const opts = [...lb.querySelectorAll('[role=option]')]; let idx = 0\n  const setOpen = o => { lb.hidden = !o; btn.setAttribute('aria-expanded', o); if (o) { lb.focus(); mark(idx) } else btn.focus() }\n  const mark = i => { idx = (i + opts.length) % opts.length; opts.forEach((el, k) => el.setAttribute('aria-selected', k === idx)); lb.setAttribute('aria-activedescendant', opts[idx].id) }\n  btn.onclick = () => setOpen(lb.hidden)\n  lb.addEventListener('keydown', e => {\n    if (e.key === 'ArrowDown') { e.preventDefault(); mark(idx + 1) }\n    else if (e.key === 'ArrowUp') { e.preventDefault(); mark(idx - 1) }\n    else if (e.key === 'Home') mark(0); else if (e.key === 'End') mark(opts.length - 1)\n    else if (e.key === 'Enter') { btn.textContent = opts[idx].textContent; setOpen(false) }\n    else if (e.key === 'Escape') setOpen(false)\n  })\n  document.addEventListener('click', e => { if (!lb.hidden && !lb.contains(e.target) && e.target !== btn) setOpen(false) })\n<\/script>\n```\n**Modal:** use the Vue `BaseModal` in V14 (or native `<dialog>`: H11). **Notice:** `aria-expanded`, `aria-activedescendant` and arrow-key handling are what make it usable by screen-reader and keyboard users; click-outside closes; Esc returns focus to the button. Check with axe DevTools.\n\n### I4: Data table with sort and pagination\n```vue\n<script setup>\nimport { ref, computed, watch } from 'vue'\nconst rows = ref(Array.from({ length: 87 }, (_, i) => ({ id: i + 1, name: `Employee ${i + 1}`, dept: ['Eng', 'Ops', 'HR'][i % 3], salary: 30000 + (i * 137) % 40000 })))\nconst key = ref('name'), dir = ref(1), page = ref(0), size = ref(10), loading = ref(false)\nconst sorted = computed(() => [...rows.value].sort((a, b) => (typeof a[key.value] === 'number' ? a[key.value] - b[key.value] : String(a[key.value]).localeCompare(b[key.value], undefined, { numeric: true })) * dir.value))\nconst pageRows = computed(() => sorted.value.slice(page.value * size.value, page.value * size.value + size.value))\nconst pages = computed(() => Math.ceil(rows.value.length / size.value))\nconst sortBy = k => { key.value === k ? (dir.value *= -1) : ((key.value = k), (dir.value = 1)); page.value = 0 }\nwatch(size, () => (page.value = 0))\nconst aria = k => (key.value === k ? (dir.value === 1 ? 'ascending' : 'descending') : 'none')\n<\/script>\n<template>\n  <select v-model.number=\"size\"><option>10<\/option><option>25<\/option><\/select>\n  <table>\n    <thead><tr><th v-for=\"c in ['name', 'dept', 'salary']\" :key=\"c\" scope=\"col\" :aria-sort=\"aria(c)\"><button @click=\"sortBy(c)\">{{ c }}<\/button><\/th><\/tr><\/thead>\n    <tbody><tr v-for=\"r in pageRows\" :key=\"r.id\"><td>{{ r.name }}<\/td><td>{{ r.dept }}<\/td><td>{{ r.salary }}<\/td><\/tr><\/tbody>\n  <\/table>\n  <button :disabled=\"page === 0\" @click=\"page--\">Prev<\/button> Page {{ page + 1 }} of {{ pages }} <button :disabled=\"page + 1 >= pages\" @click=\"page++\">Next<\/button>\n<\/template>\n```\n**Notice:** `[...rows].sort` copies (no source mutation); sort/size changes reset the page; `aria-sort` + a real `<button>` in each header makes sorting accessible. **Server-driven:** replace the two computeds with a `fetch` of `?sort=salary,desc&page=0&size=10` and bind `total` from `totalElements`.\n\n### I5: File upload with preview and progress\n```vue\n<script setup>\nimport { ref, onUnmounted } from 'vue'\nconst files = ref([]); const MAX = 2 * 1024 * 1024, OK = ['image/png', 'image/jpeg']\nfunction add(list) {\n  for (const f of list) {\n    const e = !OK.includes(f.type) ? 'Only PNG/JPEG' : f.size > MAX ? 'Over 2 MB' : ''\n    files.value.push({ id: crypto.randomUUID(), f, url: e ? null : URL.createObjectURL(f), pct: 0, status: e ? 'rejected' : 'ready', error: e })\n  }\n}\nfunction upload(item) {\n  item.status = 'uploading'; const x = new XMLHttpRequest(), fd = new FormData(); fd.append('file', item.f)\n  x.upload.onprogress = e => e.lengthComputable && (item.pct = Math.round((e.loaded / e.total) * 100))\n  x.onload = () => (item.status = x.status < 300 ? 'done' : 'failed'); x.onerror = () => (item.status = 'failed'); x.onabort = () => (item.status = 'cancelled')\n  x.open('POST', '/api/upload'); x.send(fd); item.cancel = () => x.abort()\n}\nonUnmounted(() => files.value.forEach(i => i.url && URL.revokeObjectURL(i.url)))      // no memory leak\nconst onDrop = e => add(e.dataTransfer.files)\n<\/script>\n<template>\n  <div class=\"drop\" @dragover.prevent @drop.prevent=\"onDrop\" tabindex=\"0\">Drop images here or <input type=\"file\" multiple accept=\"image/png,image/jpeg\" @change=\"add($event.target.files)\"><\/div>\n  <ul><li v-for=\"i in files\" :key=\"i.id\">\n    <img v-if=\"i.url\" :src=\"i.url\" alt=\"\" width=\"48\"> {{ i.f.name }}\n    <progress v-if=\"i.status === 'uploading'\" :value=\"i.pct\" max=\"100\"><\/progress>\n    <span v-if=\"i.error\" role=\"alert\">{{ i.error }}<\/span><span v-else>{{ i.status }}<\/span>\n    <button v-if=\"i.status === 'ready'\" @click=\"upload(i)\">Upload<\/button><button v-if=\"i.status === 'uploading'\" @click=\"i.cancel()\">Cancel<\/button>\n  <\/li><\/ul>\n<\/template>\n```\n**Notice:** validation happens **before** upload; `createObjectURL` urls are revoked; XHR (not `fetch`) gives `upload.onprogress`; `abort()` cancels the request and the server sees a closed connection. Spring side: `@RequestParam MultipartFile file`, size limit in `spring.servlet.multipart.max-file-size`.\n\n### I6: Login and authentication flow\n```js\n// stores/auth.js\nexport const useAuthStore = defineStore('auth', () => {\n  const token = ref(sessionStorage.getItem('token')), user = ref(JSON.parse(sessionStorage.getItem('user') ?? 'null'))\n  const isLoggedIn = computed(() => !!token.value)\n  async function login(c) { const r = await authApi.login(c); token.value = r.accessToken; user.value = r.user; sessionStorage.setItem('token', r.accessToken); sessionStorage.setItem('user', JSON.stringify(r.user)) }\n  function logout() { token.value = null; user.value = null; sessionStorage.clear(); useChatStore().reset(); useCartStore().clear() }   // every store!\n  return { token, user, isLoggedIn, login, logout }\n})\n// services/http.js\nhttp.interceptors.request.use(cfg => { const t = useAuthStore().token; if (t) cfg.headers.Authorization = `Bearer ${t}`; return cfg })\nhttp.interceptors.response.use(r => r.data, e => {\n  if (e.response?.status === 401 && !e.config.url.includes('/auth/login')) { useAuthStore().logout(); router.replace({ name: 'login', query: { redirect: router.currentRoute.value.fullPath } }) }\n  return Promise.reject({ status: e.response?.status ?? 0, message: e.response?.data?.message ?? 'Network error' })\n})\n```\n**Decisions to document:** `sessionStorage` keeps the session across refresh but dies with the tab; it's readable by XSS (so keep a strict CSP and never `v-html`); the safer production design is a short-lived in-memory access token + `HttpOnly` refresh cookie (Module 45). Don't log the token; don't treat the 401 on the *login* call as \"session expired\".\n\n### I7: Chat message list\nUse the Module 48 Stage 5 code. Add **date separators**:\n```js\nconst withSeparators = computed(() => {\n  const out = []; let last = ''\n  for (const m of messages.value) {\n    const day = new Date(m.createdAt).toDateString()\n    if (day !== last) { out.push({ type: 'sep', id: `sep-${day}`, label: label(m.createdAt) }); last = day }\n    out.push({ type: 'msg', id: m.id, m })\n  }\n  return out\n})\nconst label = iso => { const d = new Date(iso), t = new Date(); const diff = Math.round((new Date(t.toDateString()) - new Date(d.toDateString())) / 864e5); return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) }\n```\n**Auto-scroll only when near bottom** (Stage 5 `nearBottom()`); optimistic send marks `failed` and shows **Retry**; the text is kept so nothing is lost. **Infinite scroll up:** an `IntersectionObserver` on a sentinel at the top calls `loadOlder(before = firstId)`; after prepending, restore scroll with `box.scrollTop += box.scrollHeight - prevHeight` so the view doesn't jump.\n\n### I8: Component library API\n```\nBaseButton   props: variant('primary'|'ghost'|'danger'), size('sm'|'md'), loading, type \u00b7 slot: default\nBaseInput    v-model, label, error, hint, type \u00b7 aria wired (label for, aria-invalid, aria-describedby)\nBaseSelect   v-model, options:[{value,label}], label, error\nBaseModal    v-model:open, title \u00b7 slots: default, actions \u00b7 Teleport, Esc, focus return\nBaseBadge    tone('neutral'|'success'|'warning'|'danger') \u00b7 slot\nBaseToast    driven by a ui store: ui.toast({ tone, message }) \u00b7 role=\"status\"/\"alert\" by tone \u00b7 auto-dismiss with cleanup\n```\n```vue\n<!-- BaseBadge.vue -->\n<script setup>defineProps({ tone: { type: String, default: 'neutral', validator: v => ['neutral', 'success', 'warning', 'danger'].includes(v) } })<\/script>\n<template><span :class=\"['badge', `badge--${tone}`]\"><slot /><\/span><\/template>\n<style scoped>\n.badge{padding:.1rem .5rem;border-radius:999px;font-size:.8rem}\n.badge--success{background:var(--c-success-bg);color:var(--c-success)}\n.badge--danger{background:var(--c-danger-bg);color:var(--c-danger)}\n<\/style>\n```\n**Docs page:** one section per component rendering every variant/state (default, hover via class, disabled, loading, error). **Consistency rules:** same prop names everywhere (`variant`, `size`, `error`, `modelValue`), all colours via tokens.\n\n### I9: Dashboard with per-widget states\n```js\n// composables/useWidget.js\nexport function useWidget(loader) {\n  const data = ref(null), status = ref('loading'), error = ref(null)\n  async function run() { status.value = 'loading'; try { data.value = await loader(); status.value = 'success' } catch (e) { error.value = e.message; status.value = 'error' } }\n  return { data, status, error, run }\n}\nconst stats = useWidget(() => dashApi.stats(range.value)), orders = useWidget(() => dashApi.recentOrders(range.value)), series = useWidget(() => dashApi.revenueSeries(range.value))\nconst widgets = [stats, orders, series]\nasync function loadAll() { await Promise.allSettled(widgets.map(w => w.run())) }       // one failure doesn't blank the page\nwatch(range, loadAll); onMounted(() => { loadAll(); timer = setInterval(loadAll, 60_000) }); onUnmounted(() => clearInterval(timer))\n```\n```vue\n<section aria-label=\"Revenue\"><div v-if=\"series.status.value === 'loading'\" class=\"skeleton\" />\n  <p v-else-if=\"series.status.value === 'error'\" role=\"alert\">{{ series.error.value }} <button @click=\"series.run\">Retry<\/button><\/p>\n  <svg v-else viewBox=\"0 0 300 100\" role=\"img\" aria-label=\"Revenue last 7 days\"><polyline :points=\"points\" fill=\"none\" stroke=\"currentColor\" /><\/svg><\/section>\n```\n`points = computed(() => series.data.value.map((d, i) => \\`${i * (300 / (n - 1))},${100 - (d.v / max) * 100}\\`).join(' '))`. **Notice:** each widget has its own loading/error/retry; `allSettled` (not `all`); the interval is cleaned up.\n\n### I10: Multi-step wizard\n```vue\n<script setup>\nimport { reactive, ref, computed, watch } from 'vue'\nconst data = reactive(JSON.parse(localStorage.getItem('wiz') ?? '{\"account\":{\"email\":\"\"},\"profile\":{\"name\":\"\"}}'))\nconst step = ref(0), steps = ['Account', 'Profile', 'Review']\nconst validators = [() => /^\\S+@\\S+\\.\\S+$/.test(data.account.email), () => data.profile.name.trim().length >= 2, () => true]\nconst canNext = computed(() => validators[step.value]())\nwatch(data, v => localStorage.setItem('wiz', JSON.stringify(v)), { deep: true })            // draft saved\nconst next = () => canNext.value && step.value++ , back = () => step.value--\nconst submit = async () => { await api.submit(JSON.parse(JSON.stringify(data))); localStorage.removeItem('wiz') }\n<\/script>\n<template>\n  <ol aria-label=\"Progress\"><li v-for=\"(s, i) in steps\" :key=\"s\" :aria-current=\"i === step ? 'step' : undefined\">{{ s }}<\/li><\/ol>\n  <section v-if=\"step === 0\"><label for=\"e\">Email<\/label><input id=\"e\" v-model=\"data.account.email\"><\/section>\n  <section v-else-if=\"step === 1\"><label for=\"n\">Name<\/label><input id=\"n\" v-model=\"data.profile.name\"><\/section>\n  <section v-else><pre>{{ data }}<\/pre><\/section>\n  <button v-if=\"step\" @click=\"back\">Back<\/button>\n  <button v-if=\"step < 2\" :disabled=\"!canNext\" @click=\"next\">Next<\/button><button v-else @click=\"submit\">Submit<\/button>\n<\/template>\n```\n**Notice:** a single `data` object preserves values across steps; each step has a validator; `Next` is disabled until valid. **Browser Back:** make each step a route (`/wizard/1`) or `history.pushState` per step.\n\n### I11: Notification center\n```js\n// composables/useSocket.js\nexport function useSocket(url, onMessage) {\n  let ws, tries = 0, stopped = false, timer\n  const status = ref('connecting')\n  function connect() {\n    ws = new WebSocket(url)\n    ws.onopen = () => { status.value = 'open'; tries = 0 }\n    ws.onmessage = e => onMessage(JSON.parse(e.data))\n    ws.onclose = () => { status.value = 'closed'; if (!stopped) timer = setTimeout(connect, Math.min(1000 * 2 ** tries++, 30_000)) }   // backoff\n  }\n  connect()\n  onUnmounted(() => { stopped = true; clearTimeout(timer); ws?.close() })\n  return { status }\n}\n// mock emitter for development: setInterval(() => fire({ id: Date.now(), text: 'New message from Ravi' }), 5000)\n// stores/notifications.js\nexport const useNotificationStore = defineStore('notifications', () => {\n  const items = ref([]); const unread = computed(() => items.value.filter(n => !n.read).length)\n  const push = n => { items.value.unshift({ ...n, read: false }); useUiStore().toast({ tone: 'info', message: n.text }) }\n  const markRead = id => { const n = items.value.find(x => x.id === id); if (n) n.read = true }\n  return { items, unread, push, markRead }\n})\n```\n**Notice:** one socket for the app (open in the layout, not in each component), reconnect with exponential backoff, **closed on unmount**, duplicates avoided because `stopped` prevents reconnect after leaving. **SSE variant:** `new EventSource('/api/notifications/stream')` reconnects automatically.\n\n### I12: Theme switcher + responsive shell\n```js\n// composables/useTheme.js\nimport { ref, watchEffect } from 'vue'\nexport function useTheme() {\n  const mode = useLocalStorage('theme', 'system')                       // 'light' | 'dark' | 'system'\n  watchEffect(() => { const r = document.documentElement; mode.value === 'system' ? r.removeAttribute('data-theme') : (r.dataset.theme = mode.value) })\n  return { mode }\n}\n```\n```vue\n<template>\n  <div class=\"shell\" :class=\"{ 'is-open': open }\">\n    <button class=\"burger\" :aria-expanded=\"open\" aria-controls=\"side\" @click=\"open = !open\">Menu<\/button>\n    <nav id=\"side\" class=\"side\" aria-label=\"Main\"><slot name=\"nav\" /><\/nav>\n    <main><slot /><\/main>\n  <\/div>\n<\/template>\n<style scoped>\n.side{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:transform .2s}\n.is-open .side{transform:none}\n@media (min-width:900px){.side{position:static;transform:none}.burger{display:none}.shell{display:grid;grid-template-columns:260px 1fr}}\n@media (prefers-reduced-motion:reduce){.side{transition:none}}\n<\/style>\n```\n**Notice:** `system` = no attribute (CSS media query decides); explicit choice sets `data-theme`; a tiny inline head script (C5) prevents a flash; the drawer is a real `<nav>` toggled by a button with `aria-expanded`.\n\n### I13: E-commerce cart flow\n**Routes:** `/products` \u2192 `/products/:id` \u2192 `/cart` \u2192 `/checkout` (guard: cart not empty) \u2192 `/order/:id`.\n```js\n// checkout submit\nasync function placeOrder() {\n  if (placing.value) return; placing.value = true\n  try {\n    const order = await orderApi.create({ items: cart.items.map(({ id, qty }) => ({ id, qty })), address: form })    // send ids+qty, NOT prices: the server recomputes\n    cart.clear(); router.replace({ name: 'order', params: { id: order.id } })\n  } catch (e) { e.status === 409 ? (error.value = 'An item just went out of stock. Please review your cart.') : (error.value = 'Could not place the order. Try again.') }\n  finally { placing.value = false }\n}\n```\n**Notice:** `cart tice:** users never see stack traces; each scenario has its own message; `401` triggers logout via the interceptor, `5xx`/offline offer retry; the boundary contains a failure to one section.\n\n### I15: Frontend \u2194 Spring Boot integration: trace answer\n```\nVue handler (onSend) \u2192 chat store action sendMessage \u2192 chatApi.send \u2192 axios instance\n  \u2192 request interceptor (Authorization, X-Request-Id)\n  \u2192 Vite dev proxy /api \u2192 http://localhost:8080\n  \u2192 Spring Security filter (JWT \u2192 Authentication) \u2192 @RestController ChatController.send (@Valid @RequestBody)\n  \u2192 @Service ChatService (does this seller own the chat? 403 if not) \u2192 JpaRepository.save \u2192 PostgreSQL INSERT\n  \u2192 (Kafka event published; consumer pushes to buyer via WebSocket)\n  \u2192 201 ResponseEntity<MessageDto> JSON \u2192 response interceptor (unwrap, normalise errors)\n  \u2192 store replaces the optimistic bubble \u2192 reactive re-render \u2192 nextTick \u2192 scroll to bottom\n```\n**Bug-hunt log (example of what to record):** *Symptom:* messages sent but bubbles show \"Invalid Date\". *Network:* response had `\"createdAt\": 1730278800000` (number). *Backend:* Jackson `WRITE_DATES_AS_TIMESTAMPS` on. *Fix:* set `spring.jackson.serialization.write-dates-as-timestamps=false` \u2192 ISO strings. *Prevention:* a contract test + a TypeScript type (`createdAt: string`) + a frontend guard that treats invalid dates as `null`.\n\n---\n\n# COMPANY-STACK SOLUTIONS\n\n### K1: Reading note for a Vue 2 + Vuex feature (template to fill)\n```\nFeature: chat unread badge does not clear\nEntry: src/main.js \u2192 new Vue({ router, store }) \u2192 Vue 2.6 (package.json)\nRoute: /chats/:chatId \u2192 views/ChatRoom.vue\nComponent: ChatRoom.vue (Options API) mapActions('chat', ['openChat']); watch route.params.chatId \u2192 this.openChat(id)\nVuex: store/modules/chat.js \u2192 action openChat \u2192 commit SET_ACTIVE, commit SET_MESSAGES   (\u2731 no MARK_READ commit)\nAPI: chatApi.messages(id) \u2192 GET /api/chats/{id}/messages  \u2192 backend ChatController#messages\nBadge: TheTopbar.vue mapGetters('chat', ['unreadTotal']) \u2192 reduces chats[].unread\nRoot cause: nothing sets chats[id].unread = 0 after open (no mutation, no API call)\nFix: add mutation MARK_READ and dispatch it (and call PATCH /api/chats/{id}/read)\nMixins: ChatRoom uses scrollMixin \u2192 provides scrollToBottom() (found by searching the name)\n```\n**Diagram:** `ChatRoom (watch) \u2192 dispatch openChat \u2192 commit SET_MESSAGES \u2192 state.chat.messages \u2192 getters \u2192 components`.\n\n### K2: `ChatList` in Composition API + Pinia\n```vue\n<script setup>\nimport { ref, computed, watch, onMounted } from 'vue'\nimport { storeToRefs } from 'pinia'\nimport { useRouter } from 'vue-router'\nimport { useChatStore } from '@/stores/chat'\nimport ChatItem from './ChatItem.vue'\nimport { useSearch } from '@/composables/useSearch'          // replaces searchMixin\n\nconst props = defineProps({ status: { type: String, default: 'all' } })\nconst emit = defineEmits(['selected'])\nconst store = useChatStore(), router = useRouter()\nconst { chats, unreadTotal } = storeToRefs(store)           // mapState / mapGetters\nconst loading = ref(false), search = ref(null)              // data() + $refs.search\nconst { q } = useSearch()                                   // mixin \u2192 composable (explicit!)\nconst visible = computed(() => chats.value.filter(c => c.name.includes(q.value)))\nasync function load() { loading.value = true; try { await store.fetchChats({ status: props.status }) } finally { loading.value = false } }\nwatch(() => props.status, load, { immediate: true })        // watch + immediate\nfunction onSelect(id) { store.select(id); emit('selected', id); router.push({ name: 'chat', params: { chatId: id } }) }\nonMounted(() => search.value?.focus())\n<\/script>\n```\n**Mapping aloud:** `data()` \u2192 `ref`; `computed` \u2192 `computed`; `watch` \u2192 `watch`; `methods` \u2192 functions; `mounted` \u2192 `onMounted`; `mapState/mapGetters/mapActions` \u2192 `storeToRefs`/store actions; `mixins` \u2192 composable; `this.$emit` \u2192 `emit`; `this.$router` \u2192 `useRouter()`; `$refs` \u2192 template ref.\n\n### K3: Vuex \u2192 Pinia (same behaviour)\n```js\n// BEFORE (Vuex module)                                  // AFTER (Pinia)\nstate: () => ({ chats: [], loading: false }),           const chats = ref([]), loading = ref(false)\ngetters: { unreadTotal: s => \u2026 },                       const unreadTotal = computed(() => chats.value.reduce((n, c) => n + c.unread, 0))\nmutations: { SET_CHATS(s, v) { s.chats = v } },         // gone: assign directly\nactions: { async fetchChats({ commit }, p) {            async function fetchChats(p) {\n  commit('SET_LOADING', true)                             loading.value = true\n  try { commit('SET_CHATS', await api.list(p)) }          try { chats.value = await api.list(p) }\n  finally { commit('SET_LOADING', false) } } }            finally { loading.value = false } }\n```\n**Migration steps:** 1) create `stores/chat.js` with the same action names; 2) port the module's tests to the new store (same assertions); 3) migrate components one by one (`mapState` \u2192 `storeToRefs`); 4) keep both stores alive until the last consumer moves; 5) delete the Vuex module. Replace `this.$store.dispatch('chat/fetchChats')` with `useChatStore().fetchChats()`.\n\n### K4: Firestore realtime composable (with emulator test idea)\n```js\nimport { ref, watch, onUnmounted } from 'vue'\nimport { collection, query, orderBy, limit, onSnapshot } from 'firebase/firestore'\nexport function useChatMessages(chatId) {\n  const messages = ref([]), loading = ref(true), error = ref(null); let unsub\n  watch(chatId, id => {\n    unsub?.(); unsub = null; messages.value = []; loading.value = !!id\n    if (!id) return\n    unsub = onSnapshot(query(collection(db, 'chats', id, 'messages'), orderBy('createdAt'), limit(50)),\n      snap => { messages.value = snap.docs.map(d => { const x = d.data(); return { id: d.id, ...x, createdAt: x.createdAt?.toDate?.() ?? new Date() } }); loading.value = false },   // serverTimestamp() is null until confirmed\n      e => { error.value = e; loading.value = false })\n  }, { immediate: true })\n  onUnmounted(() => unsub?.())\n  return { messages, loading, error }\n}\n```\n**Test idea (Vitest):** mock `firebase/firestore`'s `onSnapshot` with `vi.fn()` that returns an unsubscribe spy; change `chatId` twice and assert the first spy was called once; unmount and assert the second spy was called. **Acceptance:** one active listener; unsubscribe on unmount; `createdAt: null` handled.\n\n### K5: Security rules + hybrid design note\n```\nrules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    match /chats/{chatId} {\n      allow read: if request.auth != null && resource.data.sellerId == request.auth.uid;\n      match /messages/{id} {\n        allow read: if request.auth != null && get(/databases/$(db)/documents/chats/$(chatId)).data.sellerId == request.auth.uid;\n        allow write: if false;                       // writes ONLY via the Spring backend (admin SDK bypasses rules)\n      }\n    }\n  }\n}\n```\n**Design note:** *Writes* go through REST (`POST /api/chats/{id}/messages`): Spring validates, authorises, persists, publishes Kafka and writes the Firestore doc using the Admin SDK. *Reads* come from `onSnapshot` for instant updates. **Avoiding duplicates:** the client generates a `clientId` (UUID) sent with the POST and stored on the Firestore document; the optimistic bubble is keyed by `clientId`; when the snapshot delivers a doc with the same `clientId`, **replace** the bubble instead of adding another. **Test in the emulator:** a seller reads their chat (allowed), another seller (denied), any client write (denied).\n\n### K6: TypeScript for contracts\n```ts\n// types/chat.ts\nexport type Sender = 'BUYER' | 'SELLER'\nexport type MessageStatus = 'sending' | 'sent' | 'failed'\nexport interface Order { id: string; title: string; total: number; status: 'PAID' | 'PENDING' | 'CANCELLED' }\nexport interface Message { id: number | string; chatId?: number; sender: Sender; text: string; createdAt: string; order: Order | null; status?: MessageStatus }\nexport interface Chat { id: number; buyerName: string; lastMessage: string; lastMessageAt: string; unread: number; status: 'OPEN' | 'CLOSED' }\nexport interface Page<T> { content: T[]; totalElements: number; totalPages: number; number: number }\n```\n```ts\n// services/chatApi.ts\nimport type { Chat, Message, Page } from '@/types/chat'\nexport const chatApi = {\n  list: (params?: { q?: string; status?: string; page?: number }) => http.get<Page<Chat>>('/chats', { params }),\n  send: (id: number, text: string) => http.post<Message>(`/chats/${id}/messages`, { text }),\n}\n```\n```vue\n<script setup lang=\"ts\">\nimport type { Chat } from '@/types/chat'\nconst props = defineProps<{ chat: Chat; active?: boolean }>()\nconst emit = defineEmits<{ select: [id: number] }>()\nemit('select', props.chat.id)         // emit('select', 'x') \u2192 compile error\n<\/script>\n```\n`tsconfig`: `\"strict\": true`; CI: `vue-tsc --noEmit`. **Optional fields:** `order: Order | null` forces `message.order?.id` or a check. **Runtime safety:** validate critical responses with Zod (`MessageSchema.parse(data)`), because types vanish at runtime.\n\n### K7: Wrapped UI-library table\n```vue\n<!-- components/base/AppButton.vue -->\n<script setup>defineProps({ loading: Boolean })<\/script>\n<template><el-button type=\"primary\" :loading=\"loading\" v-bind=\"$attrs\"><slot /><\/el-button><\/template>\n\n<!-- components/orders/OrdersTable.vue -->\n<script setup>\nimport { ElTable, ElTableColumn, ElTag } from 'element-plus'\ndefineProps({ rows: Array, loading: Boolean }); const emit = defineEmits(['edit', 'sort'])\nconst tone = s => ({ PAID: 'success', PENDING: 'warning', CANCELLED: 'info' }[s] ?? 'info')\n<\/script>\n<template>\n  <el-table :data=\"rows\" v-loading=\"loading\" @sort-change=\"emit('sort', $event)\">\n    <el-table-column prop=\"id\" label=\"Order\" sortable=\"custom\" />\n    <el-table-column prop=\"total\" label=\"Total\" sortable=\"custom\" />\n    <el-table-column label=\"Status\"><template #default=\"{ row }\"><el-tag :type=\"tone(row.status)\">{{ row.status }}<\/el-tag><\/template><\/el-table-column>\n    <el-table-column label=\"Actions\"><template #default=\"{ row }\"><AppButton @click=\"emit('edit', row)\">Edit<\/AppButton><\/template><\/el-table-column>\n  <\/el-table>\n<\/template>\n```\n**Theme:** `:root{--el-color-primary:#0b6e75}` (a token), never `!important`. **Notice:** `#default=\"{ row }\"` is a scoped slot (V13); only the needed components are imported (tree-shaking); the page imports `OrdersTable`, not Element Plus, so replacing the library later touches only this folder. **Storybook:** one story per state (default, loading, empty, long text).\n\n### K8: i18n\n```js\n// i18n.js\nimport { createI18n } from 'vue-i18n'\nconst saved = (() => { try { return localStorage.getItem('lang') } catch { return null } })()\nexport const i18n = createI18n({ legacy: false, locale: saved ?? 'en', fallbackLocale: 'en', messages: {\n  en: { chat: { title: 'Chats', unread: 'No unread | {n} unread message | {n} unread messages', total: 'Total {amount}' } },\n  id: { chat: { title: 'Obrolan', unread: 'Tidak ada | {n} pesan belum dibaca | {n} pesan belum dibaca', total: 'Total {amount}' } },\n} })\n```\n```vue\n<script setup>\nimport { useI18n } from 'vue-i18n'; import { watch, computed } from 'vue'\nconst { t, locale, n, d } = useI18n()\nwatch(locale, l => { try { localStorage.setItem('lang', l) } catch {} ; document.documentElement.lang = l })\nconst money = computed(() => new Intl.NumberFormat(locale.value === 'id' ? 'id-ID' : 'en-IN', { style: 'currency', currency: locale.value === 'id' ? 'IDR' : 'INR' }))\n<\/script>\n<template>\n  <h1>{{ t('chat.title') }}<\/h1><p>{{ t('chat.unread', { n: count }, count) }}<\/p>\n  <p>{{ t('chat.total', { amount: money.format(total) }) }}<\/p>\n  <select v-model=\"locale\"><option value=\"en\">English<\/option><option value=\"id\">Bahasa<\/option><\/select>\n<\/template>\n```\n**Notice:** whole sentences with placeholders (no `t('total') + ': ' + amount`); plural form chosen by the 3rd argument; `<html lang>` updated for screen readers; **layout test:** set a string 30% longer and check buttons wrap instead of overflow (use `min-width` + `flex-wrap`, not fixed widths).\n\n### K9: Date bug + `formatMessageTime`\n```js\n// Reproduce: TZ=America/Los_Angeles node -e \"console.log(new Date('2026-10-30').toLocaleDateString('en-US'))\"   \u2192 10/29/2026\n// Cause: date-only ISO strings are parsed as UTC midnight \u2192 local time is the previous evening.\n// Fix A: keep date-only values as strings and format without Date: '2026-10-30'.split('-').reverse().join('/')\n// Fix B: construct in local time: new Date(2026, 9, 30)   or   new Date('2026-10-30T00:00:00')   (no Z \u2192 local)\n\nexport function formatMessageTime(iso, now = new Date(), locale = 'en-IN') {\n  const d = new Date(iso); if (Number.isNaN(d.getTime())) return ''\n  const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate())\n  const days = Math.round((startOf(now) - startOf(d)) / 864e5)              // calendar days, DST-safe: uses local dates\n  const time = new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', hour12: false }).format(d)\n  if (days === 0) return `Today ${time}`\n  if (days === 1) return 'Yesterday'\n  return new Intl.DateTimeFormat(locale, { day: 'numeric', month: 'short' }).format(d)\n}\n```\n```js\n// formatMessageTime.test.js\nimport { vi, it, expect } from 'vitest'\nit('Today / Yesterday / date', () => {\n  const now = new Date('2026-10-30T10:00:00')\n  expect(formatMessageTime('2026-10-30T09:05:00', now)).toBe('Today 09:05')\n  expect(formatMessageTime('2026-10-29T23:00:00', now)).toBe('Yesterday')\n  expect(formatMessageTime('2026-10-28T10:00:00', now)).toBe('28 Oct')\n  expect(formatMessageTime('garbage', now)).toBe('')\n})\n```\nRun the suite with `TZ=Asia/Kolkata vitest` and `TZ=America/Los_Angeles vitest` (pass `now` explicitly or use `vi.setSystemTime`). **Why not `+ 24*60*60*1000`:** DST days are 23 or 25 hours; compare **calendar dates** instead.\n\n### K10: Dockerfile + nginx (and the break test)\nUse the Dockerfile and `nginx.conf` from Module 63 (multi-stage; `npm ci`; `try_files $uri /index.html`; `/assets/` cached a year; `index.html` `no-store`; `/api/` proxied).\n```bash\ndocker build -t seller-chat-ui:dev . && docker run --rm -p 8081:80 seller-chat-ui:dev\ncurl -I http://localhost:8081/assets/index-abc123.js      # Cache-Control: public, immutable, max-age=31536000\ncurl -I http://localhost:8081/index.html                  # Cache-Control: no-store\ncurl -I http://localhost:8081/chats/1                     # 200 (served index.html by try_files)\ndocker run --rm seller-chat-ui:dev sh -c 'ls /usr/share/nginx/html; which node || echo \"no node in final image\"'\n```\n**Break test:** remove the `try_files` line \u2192 rebuild \u2192 open `/chats/1` directly or refresh \u2192 **404** (nginx looks for a file called `chats/1`). Restore it. **Image check:** final image has no Node and no `node_modules`; `.dockerignore` excludes `.env*` and `.git`.\n\n### K11: CI pipeline + triage\n**Stages:** `checkout \u2192 npm ci \u2192 lint \u2192 unit tests (coverage \u2265 threshold) \u2192 build \u2192 npm audit/Trivy \u2192 SonarQube gate \u2192 build & push image \u2192 deploy dev \u2192 smoke/E2E \u2192 promote`.\n| Failure | Cause | Fix | Prevention |\n|---|---|---|---|\n| `Cannot find module './chatitem.vue'` on Linux only | file is `ChatItem.vue`; macOS/Windows are case-insensitive, Linux is not | fix the import casing | ESLint `import/no-unresolved` with case sensitivity; develop in a case-sensitive container |\n| Trivy HIGH CVE in base image | outdated `node`/`nginx` image or a vulnerable package | bump to a patched tag (`nginx:1.27-alpine`) or update the dependency; rebuild | Renovate/Dependabot, scheduled rebuilds, pin by digest |\n| `JavaScript heap out of memory` | big bundle / low CI memory | `NODE_OPTIONS=--max-old-space-size=4096`; split chunks; check bundle visualizer | bundle-size budget in CI |\n**Triage habit:** scroll to the **first** red error line (later errors are usually fallout), reproduce locally with the same Node version (`.nvmrc`) and `npm ci`.\n\n### K12: Spring contract review\n| Symptom (Network tab) | Cause | Side | Fix |\n|---|---|---|---|\n| `400` body `{\"errors\":[{\"field\":\"buyerName\",\"message\":\"must not be blank\"}]}` but you sent `buyer_name` | wrong JSON key (DTO uses camelCase) | frontend | send `buyerName` |\n| `415 Unsupported Media Type` | request sent as `text/plain`/form-encoded, Spring expects JSON | frontend | `Content-Type: application/json` and `JSON.stringify(body)` (Axios does this when you pass an object) |\n| Console: \"blocked by CORS policy\u2026 No 'Access-Control-Allow-Origin'\" with no status | preflight failed; origin not allowed | **backend** | add the origin to `allowedOrigins` (and `allowCredentials(true)` if cookies); in dev use the Vite proxy |\n**Contract note for Seller Chat (excerpt):**\n```\nGET  /api/chats?q&status&page&size        \u2192 200 Page<ChatSummaryDto>\nGET  /api/chats/{id}/messages?before&limit \u2192 200 MessageDto[]    (cursor: before = id of the oldest loaded message)\nPOST /api/chats/{id}/messages {text\u2264500}   \u2192 201 MessageDto | 400 {errors[]} | 403 not your chat | 404\nPOST /api/chats/{id}/orders {orderId}      \u2192 201 MessageDto(order) | 403 | 404 | 409 already attached\nErrors: { status, message, errors:[{field,message}], traceId }   Dates: ISO-8601 UTC   Ids: number\n```\n**Pagination decision:** chats list = **offset** (`page,size`, small, mostly static); message history = **cursor** (`before`), because new messages arrive constantly and offset pages would shift and show duplicates/skips.\n\n---\n**Capstone:** apply the Module 66 PR checklist to your Seller Chat repo and open a PR for one stage, with screenshots and test steps.\n";
