ctive data changes)\n   \u2193 onBeforeUpdate           before the DOM is patched\n   \u2193 onUpdated                after the DOM is patched (don't change state here: loops)\n   \u2193 onBeforeUnmount          component still works \u2192 start cleanup\n   \u2193 onUnmounted              DOM removed \u2192 timers/listeners/sockets cleaned\nAlso: onErrorCaptured (errors from children), onActivated/onDeactivated (<KeepAlive>)\n```\n| Options API | Composition API | Typical use |\n|---|---|---|\n| `beforeCreate`, `created` | code in `setup` itself | init state; start non-DOM work |\n| `beforeMount` | `onBeforeMount` | rare |\n| `mounted` | **`onMounted`** | **DOM access, API call, focus, global listeners, chart init** |\n| `beforeUpdate` / `updated` | `onBeforeUpdate` / `onUpdated` | read DOM before/after patch |\n| `beforeUnmount` / `unmounted` (Vue 2: `beforeDestroy`/`destroyed`) | `onBeforeUnmount` / **`onUnmounted`** | **cleanup** |\n| `errorCaptured` | `onErrorCaptured` | error boundaries |\n**Parent/child order:** parent `setup` \u2192 parent `beforeMount` \u2192 child `setup` \u2192 child `beforeMount` \u2192 child `mounted` \u2192 parent `mounted` (**children mount first**). On unmount: parent `beforeUnmount` \u2192 child `unmounted` \u2192 parent `unmounted`.\n\n## 36.2 Real example: fetch with cleanup \ud83d\udfe1\n```vue\n<script setup>\nimport { ref, onMounted, onUnmounted } from 'vue'\nconst posts = ref([]); const loading = ref(true); const error = ref(null)\nconst ctrl = new AbortController()\nlet timer\n\nasync function load() {\n  loading.value = true; error.value = null\n  try {\n    const res = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5', { signal: ctrl.signal })\n    if (!res.ok) throw new Error(`HTTP ${res.status}`)\n    posts.value = await res.json()\n  } catch (e) { if (e.name !== 'AbortError') error.value = e.message }\n  finally { loading.value = false }\n}\nonMounted(() => { load(); timer = setInterval(load, 30000); window.addEventListener('online', load) })\nonUnmounted(() => { ctrl.abort(); clearInterval(timer); window.removeEventListener('online', load) })\n<\/script>\n<template>\n  <p v-if=\"loading\">Loading\u2026<\/p>\n  <p v-else-if=\"error\">{{ error }} <button @click=\"load\">Retry<\/button><\/p>\n  <ul v-else><li v-for=\"p in posts\" :key=\"p.id\">{{ p.title }}<\/li><\/ul>\n<\/template>\n```\n**Sequence:** `setup` creates the refs \u2192 the first render shows \"Loading\u2026\" \u2192 `onMounted` runs `load()` \u2192 the request goes out \u2192 `posts` is assigned \u2192 reactivity re-renders the list. When the user navigates away, `onUnmounted` aborts the request and removes the timer and listener (otherwise you'd leak and keep updating a dead component).\n**Rule:** hooks must be called **synchronously during `setup`** (not after an `await`, not inside callbacks).\n`onErrorCaptured((err, instance, info) => { report(err); return false })` handles errors from descendants and stops them propagating.\n\n## 36.3 Mistakes and questions\n**Mistakes:** touching the DOM before `mounted` \u00b7 forgetting cleanup (leaks, duplicate listeners) \u00b7 changing state in `updated` (loop) \u00b7 registering hooks after `await`.\n**Q1. Where do you fetch data?** `setup` or `onMounted` (plus a `watch` for changing params: **when only a route param changes, Vue reuses the component, so `onMounted` does NOT run again**). **Q2. Parent/child mounted order?** children first. **Q3. What is the Composition equivalent of `created`?** the setup code itself. **Q4. What do you clean up on unmount?** timers, listeners, sockets, observers, requests.\n**Exercises:** log all hooks in a parent and child and observe order, toggling the child with `v-if` \u00b7 a live clock with cleanup \u00b7 find a leak with the Memory tab by omitting cleanup.\n\n## \u25b6 VUE STEP 36 \u2014 load chats and messages\n```vue\n<script setup>\nimport { ref, watch, onMounted } from 'vue'\nimport { useRoute } from 'vue-router'\nimport { chatApi } from '@/services/chatApi'\nconst route = useRoute()\nconst chats = ref([]); const messages = ref([]); const status = ref('idle')\nonMounted(async () => { chats.value = (await chatApi.list()).content })\nwatch(() => route.params.chatId, async id => {                // reacts when only the :chatId param changes\n  if (!id) return\n  status.value = 'loading'\n  try { messages.value = await chatApi.messages(id); status.value = 'success' } catch { status.value = 'error' }\n}, { immediate: true })\n<\/script>\n```\n\n---\n\n# MODULE 37 \u2014 VUE COMPOSITION API\n\n## 37.1 The idea \ud83d\udfe1\nThe **Composition API** organises code by **feature/logic** instead of by option type. With the Options API, one feature (say \"search\") was split across `data`, `computed`, `methods` and `watch`, which gets hard to read in big components and hard to reuse (mixins clash). With Composition you group related code together and can **extract it into a function** (a *composable*).\n`<script setup>` is the compile-time shortcut: top-level variables and imports are automatically available in the template; components are auto-registered; less boilerplate; macros `defineProps/defineEmits/defineExpose/defineModel`.\nThe long form `setup()` is equivalent: `export default { setup(props, { emit }) { \u2026; return { count } } }`.\n\n## 37.2 How to organise a component (convention) \ud83d\udfe1\n```vue\n<script setup>\n// 1 imports  2 props/emits  3 composables & stores  4 state  5 computed  6 watchers  7 functions  8 lifecycle hooks\nimport { ref, computed, watch, onMounted } from 'vue'\nimport { useRoute } from 'vue-router'\nimport { useChatStore } from '@/stores/chat'\nimport { useDebouncedRef } from '@/composables/useDebouncedRef'\n\nconst props = defineProps({ chatId: String })\nconst emit = defineEmits(['close'])\nconst route = useRoute(); const store = useChatStore()\nconst draft = ref('')\nconst canSend = computed(() => draft.value.trim().length > 0 && !store.sending)\nwatch(() => props.chatId, id => store.openChat(id), { immediate: true })\nasync function onSend() { await store.sendMessage(draft.value); draft.value = '' }\nonMounted(() => { /* focus the composer */ })\n<\/script>\n```\n\n## 37.3 Composables \ud83d\udfe1\nA **composable** is a function named `useXxx` that uses Vue's reactivity/lifecycle to encapsulate **stateful logic** and returns refs and functions.\n```js\n// composables/useFetch.js\nimport { ref, watchEffect, toValue, onUnmounted } from 'vue'\nexport function useFetch(urlSource) {                    // url can be a string, ref, or getter function\n  const data = ref(null), error = ref(null), loading = ref(false)\n  let ctrl\n  async function execute() {\n    ctrl?.abort(); ctrl = new AbortController()\n    loading.value = true; error.value = null\n    try {\n      const res = await fetch(toValue(urlSource), { signal: ctrl.signal })\n      if (!res.ok) throw new Error(`HTTP ${res.status}`)\n      data.value = await res.json()\n    } catch (e) { if (e.name !== 'AbortError') error.value = e }\n    finally { loading.value = false }\n  }\n  watchEffect(execute)                                   // reruns automatically when the url changes\n  onUnmounted(() => ctrl?.abort())\n  return { data, error, loading, refetch: execute }\n}\n// use\nconst id = ref(1)\nconst { data: post, loading, error } = useFetch(() => `https://jsonplaceholder.typicode.com/posts/${id.value}`)\nid.value = 2                                              // \u2192 refetches by itself\n```\n```js\n// composables/useDebouncedRef.js\nimport { ref, watch, onUnmounted } from 'vue'\nexport function useDebouncedRef(source, delay = 300) {\n  const debounced = ref(source.value); let t\n  watch(source, v => { clearTimeout(t); t = setTimeout(() => (debounced.value = v), delay) })\n  onUnmounted(() => clearTimeout(t))\n  return debounced\n}\n```\nThis is Module 18's **debounce closure** turned into a reactive tool. Other common composables: `useLocalStorage`, `useEventListener(target, event, cb)` (add in `onMounted`, remove in `onUnmounted`), `usePagination`, `useModal`, `useToggle`.\n**Conventions:** name `useX`; return an object of refs (callers can destructure without losing reactivity); accept refs/getters via `toValue`; clean up in `onUnmounted`; call only inside `setup` (or another composable).\n**Composable vs utility vs store:** a utility is a stateless pure function; a composable creates **new state per call**; a Pinia store is a **shared singleton**.\n**Async composables** expose `loading/error/data` instead of `await`-ing at the top of `setup` (that requires `<Suspense>`).\n\n## 37.4 How real projects structure logic \ud83c\udfed\n- **Views/pages:** wire route params, stores and composables; minimal markup.\n- **Presentational components:** props in, events out; no API calls.\n- **Composables:** reusable behaviour (debounced search, pagination, form handling).\n- **Stores:** shared app state and server-data cache.\n- **Services:** HTTP only.\n(Full layout: Module 44.)\n\n## 37.5 Questions and exercises\n**Q1. Why Composition API?** **Q2. What is `<script setup>`?** **Q3. What is a composable? Example?** **Q4. Composable vs mixin vs store?** **Q5. Why return refs?** **Q6. Can setup be async?** only with Suspense.\n**Exercises:** `useCounter`, `useLocalStorage`, `useFetch` with abort, `usePagination`, `useDebouncedRef` \u00b7 refactor a 300-line component into three composables.\n\n## \u25b6 VUE STEP 37 \u2014 the chat search as a composable\n```js\n// composables/useChatSearch.js\nexport function useChatSearch(chats) {\n  const q = ref(''); const status = ref('all')\n  const debouncedQ = useDebouncedRef(q, 300)\n  const visible = computed(() => sortedChats(filterChats(searchChats(chats.value, debouncedQ.value), status.value)))\n  return { q, status, visible }\n}\n```\n```vue\n<script setup>\nconst { q, status, visible } = useChatSearch(chats)    // in any component that needs search\n<\/script>\n<template><input v-model=\"q\"><ChatList :chats=\"visible\" /><\/template>\n```\nNotice it reuses `searchChats`/`filterChats`/`sortedChats` and the debounce idea from Parts 3\u20134.\n\n---\n**Next \u2192 `05-vue-2.md`: Modules 38\u201343 (Forms, Router, Pinia, API integration, Advanced Vue, Testing).**\n\n\n# PART 6 (continued) \u2014 VUE: FORMS, ROUTER, PINIA, API, ADVANCED, TESTING\n\n---\n\n# MODULE 38 \u2014 VUE FORMS AND EVENTS\n\n## 38.1 Why forms in Vue are easier \ud83d\udfe2\nIn plain JS (Module 4/27) you wired `input` listeners, `FormData`, `preventDefault` and manual error `textContent`. In Vue, **form fields are bound to reactive state with `v-model`**, errors are `computed` values, and the template simply shows them.\n**Analogy:** the form is a window onto your data. Whatever you type changes the data; whatever the data says (an error message) shows in the window.\n\n## 38.2 `v-model` on every control \ud83d\udfe2\n```vue\n<script setup>\nimport { reactive } from 'vue'\nconst form = reactive({\n  name: '', email: '', age: null, bio: '',\n  role: 'seller',            // select / radio\n  notify: ['email'],         // several checkboxes \u2192 an array\n  terms: false,              // one checkbox \u2192 boolean\n  file: null,\n})\n<\/script>\n<template>\n  <input v-model.trim=\"form.name\" type=\"text\">\n  <input v-model.number=\"form.age\" type=\"number\">\n  <textarea v-model=\"form.bio\" rows=\"3\"><\/textarea>\n  <select v-model=\"form.role\"><option disabled value=\"\">Choose<\/option><option value=\"seller\">Seller<\/option><option value=\"admin\">Admin<\/option><\/select>\n  <label><input type=\"radio\" v-model=\"form.role\" value=\"seller\"> Seller<\/label>\n  <label><input type=\"checkbox\" v-model=\"form.notify\" value=\"email\"> Email<\/label>      <!-- array binding -->\n  <label><input type=\"checkbox\" v-model=\"form.terms\"> I accept<\/label>                    <!-- boolean binding -->\n  <input type=\"file\" @change=\"form.file = $event.target.files[0]\">                        <!-- v-model doesn't work on file inputs -->\n<\/template>\n```\n`v-model` picks the right property and event for each element (`value`+`input` for text, `checked`+`change` for checkboxes, `value`+`change` for selects). Modifiers: `.trim`, `.number`, `.lazy` (update on `change`).\n\n## 38.3 A complete form with validation, states and server errors \ud83d\udfe1\n```vue\n<script setup>\nimport { reactive, ref, computed } from 'vue'\nimport { userApi } from '@/services/userApi'\n\nconst form = reactive({ name: '', email: '', password: '' })\nconst touched = reactive({ name: false, email: false, password: false })\nconst serverErrors = ref({})            // from Spring: { email: 'Already registered' }\nconst submitting = ref(false)\nconst submitError = ref(null)\nconst success = ref(false)\n\nconst errors = computed(() => ({        // client-side validation (UX only; the server revalidates!)\n  name: form.name.trim().length < 2 ? 'Name must be at least 2 characters' : '',\n  email: /^\\S+@\\S+\\.\\S+$/.test(form.email) ? '' : 'Enter a valid email',\n  password: form.password.length < 8 ? 'At least 8 characters' : '',\n}))\nconst isValid = computed(() => Object.values(errors.value).every(e => !e))\nconst msg = f => (touched[f] && (errors.value[f] || serverErrors.value[f])) || ''     // show after the user left the field\n\nasync function onSubmit() {\n  Object.keys(touched).forEach(k => (touched[k] = true))        // reveal all errors on submit\n  if (!isValid.value || submitting.value) return                // block invalid + double submits\n  submitting.value = true; submitError.value = null; serverErrors.value = {}\n  try {\n    await userApi.create({ ...form })\n    success.value = true\n  } catch (e) {\n    if (e.status === 400 && e.body?.errors)                      // Spring validation errors \u2192 map to fields\n      serverErrors.value = Object.fromEntries(e.body.errors.map(x => [x.field, x.message]))\n    else submitError.value = e.status === 409 ? 'Account already exists' : 'Something went wrong. Please retry.'\n  } finally { submitting.value = false }\n}\n<\/script>\n\n<template>\n  <form @submit.prevent=\"onSubmit\" novalidate>\n    <div class=\"field\">\n      <label for=\"name\">Name<\/label>\n      <input id=\"name\" v-model.trim=\"form.name\" @blur=\"touched.name = true\" :aria-invalid=\"!!msg('name')\" aria-describedby=\"name-err\">\n      <p v-if=\"msg('name')\" id=\"name-err\" class=\"error\" role=\"alert\">{{ msg('name') }}<\/p>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"email\">Email<\/label>\n      <input id=\"email\" type=\"email\" v-model.trim=\"form.email\" @blur=\"touched.email = true\" autocomplete=\"email\">\n      <p v-if=\"msg('email')\" class=\"error\" role=\"alert\">{{ msg('email') }}<\/p>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"pw\">Password<\/label>\n      <input id=\"pw\" type=\"password\" v-model=\"form.password\" @blur=\"touched.password = true\" autocomplete=\"new-password\">\n      <p v-if=\"msg('password')\" class=\"error\" role=\"alert\">{{ msg('password') }}<\/p>\n    <\/div>\n    <p v-if=\"submitError\" class=\"error\" role=\"alert\">{{ submitError }}<\/p>\n    <p v-if=\"success\" class=\"ok\" role=\"status\">Account created!<\/p>\n    <button :disabled=\"submitting\">{{ submitting ? 'Creating\u2026' : 'Create account' }}<\/button>\n  <\/form>\n<\/template>\n```\n**Flow:** typing \u2192 `v-model` updates `form` \u2192 the `errors` computed re-evaluates \u2192 messages show after blur (`touched`). Submit \u2192 `.prevent` stops the reload \u2192 mark all touched \u2192 stop if invalid \u2192 set `submitting` (button disabled and label changes) \u2192 POST \u2192 success or error mapping \u2192 `finally` resets `submitting`.\n**Spring side:** `@Valid @RequestBody` with `@NotBlank/@Email/@Size`; a `@RestControllerAdvice` turns `MethodArgumentNotValidException` into `{ status: 400, errors: [{ field, message }] }`; the frontend shows them inline.\n**Libraries:** VeeValidate, Vuelidate, Zod/Yup schemas; a `useForm` composable that bundles `values/errors/touched/submit`.\n\n## 38.4 Dynamic forms and file uploads \ud83d\udfe1\n```vue\n<div v-for=\"(item, i) in form.items\" :key=\"item.uid\">\n  <input v-model=\"item.sku\"><button type=\"button\" @click=\"form.items.splice(i, 1)\">\u2715<\/button>\n<\/div>\n<button type=\"button\" @click=\"form.items.push({ uid: crypto.randomUUID(), sku: '' })\">Add item<\/button>\n```\nUse a **stable `uid`** as the key (not the index) so inputs keep their own values when rows are removed.\n```js\nasync function upload(file) {\n  const fd = new FormData(); fd.append('file', file); fd.append('chatId', chatId)\n  await fetch('/api/attachments', { method: 'POST', body: fd, headers: { Authorization: `Bearer ${token}` } })   // no Content-Type!\n}\n```\nValidate type and size on the client, preview with `URL.createObjectURL`, show progress with XHR/Axios `onUploadProgress`. Spring: `@RequestParam MultipartFile file`, `spring.servlet.multipart.max-file-size`.\n**Edit forms:** edit a **copy** (`reactive({ ...props.user })`) and apply it on Save; discard on Cancel. Never bind inputs directly to a prop or store object.\n\n## 38.5 Mistakes and questions\n**Mistakes:** validating only on the client \u00b7 binding inputs straight to store state \u00b7 using index as key in dynamic rows \u00b7 no loading/disabled state \u00b7 showing all errors before the user has typed.\n**Q1. How does `v-model` differ on `<input>`, checkbox and component?** **Q2. Where should validation live?** both: client for UX, server for truth. **Q3. How do you prevent double submit?** **Q4. How do you show server validation errors?** **Q5. Why `@submit.prevent`?**\n**Exercises:** registration + login forms with validation \u00b7 an employee form with dynamic phone numbers \u00b7 upload with preview \u00b7 wire to JSONPlaceholder `POST /users` and show success/error.\n\n## \u25b6 VUE STEP 38 \u2014 login form for Seller Chat\nBuild `LoginView.vue` using 38.3 as a template: fields email/password, `auth.login(form)` on submit, 401 \u2192 \"Wrong email or password\", other errors \u2192 generic retry message, success \u2192 `router.replace(route.query.redirect || '/chats')`.\n\n---\n\n# MODULE 39 \u2014 VUE ROUTING\n\n## 39.1 What and why \ud83d\udfe1\n**Vue Router** maps **URLs to components** in a single-page app, using the History API (Module 28) so navigation doesn't reload the page. Each URL = a screen: `/login`, `/chats`, `/chats/5`, `/orders`. It also gives you bookmarkable/shareable links and the browser's back button.\nInstall: `npm install vue-router` (selected by `create-vue`).\n\n## 39.2 Setup and configuration \ud83d\udfe1\n```js\n// router/index.js\nimport { createRouter, createWebHistory } from 'vue-router'\nimport { useAuthStore } from '@/stores/auth'\n\nconst router = createRouter({\n  history: createWebHistory(import.meta.env.BASE_URL),       // clean URLs. createWebHashHistory \u2192 /#/path (no server config)\n  routes: [\n    { path: '/login', name: 'login', component: () => import('@/views/LoginView.vue'), meta: { public: true } },   // lazy-loaded chunk\n    { path: '/', component: () => import('@/layouts/AppLayout.vue'), meta: { requiresAuth: true },\n      children: [                                                        // nested routes render in AppLayout's <RouterView>\n        { path: '', redirect: { name: 'chats' } },\n        { path: 'chats', name: 'chats', component: () => import('@/views/ChatsView.vue'),\n          children: [{ path: ':chatId', name: 'chat', component: () => import('@/views/ChatRoomView.vue'), props: true }] },\n        { path: 'orders', name: 'orders', component: () => import('@/views/OrdersView.vue') },\n      ] },\n    { path: '/:pathMatch(.*)*', name: 'not-found', component: () => import('@/views/NotFoundView.vue') },   // 404 catch-all\n  ],\n  scrollBehavior: () => ({ top: 0 }),\n})\nexport default router\n```\n```vue\n<!-- App.vue -->   <template><RouterView /><\/template>\n<!-- links -->\n<RouterLink to=\"/orders\">Orders<\/RouterLink>\n<RouterLink :to=\"{ name: 'chat', params: { chatId: 5 }, query: { tab: 'orders' } }\" active-class=\"active\">Chat 5<\/RouterLink>\n```\n`<RouterLink>` renders an `<a>` with the correct `href`, intercepts the click (no reload) and adds `router-link-active` classes. `<RouterView>` is the **outlet** where the matched component appears. **Nested routes** render children inside the parent's `<RouterView>`: the parent is a *layout* (sidebar/topbar), children are pages.\n```\nURL /chats/5   \u2192   App \u2192 <RouterView> \u2192 AppLayout \u2192 <RouterView> \u2192 ChatsView \u2192 <RouterView> \u2192 ChatRoomView (chatId = '5')\n```\n\n## 39.3 Params, query, programmatic navigation \ud83d\udfe1\n```js\nimport { useRoute, useRouter } from 'vue-router'\nconst route = useRoute()     // CURRENT route (reactive): route.params.chatId, route.query.q, route.meta, route.name, route.fullPath\nconst router = useRouter()   // NAVIGATION methods\nrouter.push('/orders')                                            // add a history entry\nrouter.push({ name: 'chat', params: { chatId: 7 } })              // by name (safer than strings)\nrouter.push({ path: '/chats', query: { q: 'ravi', status: 'open' } })   // /chats?q=ravi&status=open\nrouter.replace({ name: 'login' })                                 // no history entry (after login/logout)\nrouter.back()\n\n// IMPORTANT: when only :chatId changes (/chats/1 \u2192 /chats/2) Vue REUSES the component instance:\n// onMounted will NOT run again. React to changes with a watcher:\nwatch(() => route.params.chatId, id => store.openChat(id), { immediate: true })\n```\n**Query params = shareable state** (search text, filters, page): `router.replace({ query: { ...route.query, q: q.value } })`, and initialise from `route.query.q` on load. `props: true` passes params as props, decoupling the component from the router. Route `meta` carries custom data (`requiresAuth`, `roles`, `title`). Route patterns: `:id`, optional `:id?`, regex `:id(\\\\d+)`.\n\n## 39.4 Navigation guards \ud83d\udd34\nGuards run **before** a navigation completes.\n```js\nrouter.beforeEach(async (to, from) => {                          // return false to cancel, a route to redirect, or nothing to continue\n  const auth = useAuthStore()\n  if (to.meta.requiresAuth && !auth.isLoggedIn)\n    return { name: 'login', query: { redirect: to.fullPath } }   // remember where to come back to\n  if (to.name === 'login' && auth.isLoggedIn) return { name: 'chats' }\n  if (to.meta.roles && !to.meta.roles.includes(auth.role)) return { name: 'forbidden' }\n})\nrouter.afterEach(to => { document.title = to.meta.title ?? 'Seller Chat' })\n```\nAlso per-route `beforeEnter`, and in components `onBeforeRouteLeave((to, from) => hasUnsavedChanges ? window.confirm('Leave?') : true)` and `onBeforeRouteUpdate`. After login: `router.push(route.query.redirect ?? '/')`.\n**Guards are UX, not security.** A user can change client code; the API must enforce authorisation (401/403). **Lazy routes** (`() => import(...)`) split code so the Orders page downloads only when visited.\n**Deployment:** history mode needs a **server fallback to `index.html`** (Spring: forward non-API, non-file paths to `/index.html`; nginx: `try_files $uri /index.html`), otherwise a refresh on `/chats/5` returns 404.\n\n## 39.5 Multi-page app example\n`/login` \u2192 layout `/` (sidebar + `<RouterView>`) \u2192 `/chats` list \u2192 `/chats/:chatId` room, `/orders`, `/settings`; catch-all 404. Active navigation highlighting comes free from `RouterLink` classes.\n\n## 39.6 Mistakes and questions\n**Mistakes:** `<a href>` instead of `RouterLink` (full reload) \u00b7 reading `route.params` once instead of reactively \u00b7 redirect loops in guards \u00b7 forgetting history-mode server fallback \u00b7 relying on guards for security.\n**Q1. History vs hash mode?** **Q2. `route` vs `router`?** **Q3. How do you react to param changes in the same component?** watch. **Q4. How do guards protect routes; are they secure?** **Q5. How does lazy loading work?** **Q6. `push` vs `replace`?** **Q7. Why does refresh give 404 in production?**\n**Exercises:** a 3-page app with a layout \u00b7 a protected route with redirect-back \u00b7 a `:id` detail page that reacts to id changes \u00b7 filters stored in the query \u00b7 a 404 page.\n\n## \u25b6 VUE STEP 39 \u2014 routes for Seller Chat\nUse the router above. Mobile pane switching (Module 9): `/chats` shows only the list on small screens; `/chats/:chatId` shows only the room, with a back `RouterLink`. On \u2265768px both are visible because `ChatsView` renders the sidebar and a `<RouterView>` side by side.\n\n---\n\n# MODULE 40 \u2014 STATE MANAGEMENT WITH PINIA\n\n## 40.1 Why state management? \ud83d\udfe1\n- **Component state:** `ref`s inside one component: simple and local.\n- **Shared state:** data several **distant** components need (the logged-in user, the chat list *and* the unread badge in the header, the selected order, the cart).\n- **Prop drilling:** passing a prop through many layers that don't use it (`App \u2192 Layout \u2192 Page \u2192 List \u2192 Item`): noisy and fragile.\n- **Solution:** a **store**: a global reactive container components read from and act on. **Pinia** is Vue's official store (it replaced Vuex: simpler, no mutations, great DevTools and TypeScript).\n**Analogy:** a shared whiteboard in an office. Everyone reads it and updates it by agreed procedures (actions), instead of passing notes between desks.\n**Rule:** keep state **as local as possible**. Promote to a store only when it's shared across unrelated components, must survive navigation, or is server data many views use. Over-globalising is a common mistake.\n\n## 40.2 Defining a store \ud83d\udfe1\n```js\n// stores/chat.js (setup-store style: mirrors <script setup>)\nimport { defineStore } from 'pinia'\nimport { ref, computed } from 'vue'\nimport { chatApi } from '@/services/chatApi'\n\nexport const useChatStore = defineStore('chat', () => {\n  // STATE = ref/reactive\n  const chats = ref([]); const activeId = ref(null)\n  const messagesByChat = ref({})                 // { [chatId]: Message[] }\n  const listStatus = ref('idle'); const listError = ref(null)\n\n  // GETTERS = computed\n  const activeChat = computed(() => chats.value.find(c => c.id === activeId.value) ?? null)\n  const unreadTotal = computed(() => chats.value.reduce((n, c) => n + c.unread, 0))\n  const messages = computed(() => messagesByChat.value[activeId.value] ?? [])\n\n  // ACTIONS = functions (sync or async; may call APIs and other stores)\n  async function fetchChats(params) {\n    listStatus.value = 'loading'; listError.value = null\n    try { chats.value = (await chatApi.list(params)).content; listStatus.value = 'success' }\n    catch (e) { listError.value = e.message; listStatus.value = 'error' }\n  }\n  async function sendMessage(text) {\n    const id = activeId.value\n    const temp = reactive({ id: `tmp-${crypto.randomUUID()}`, text, sender: 'SELLER', status: 'sending' })   // optimistic update\n    ;(messagesByChat.value[id] ??= []).push(temp)\n    try { Object.assign(temp, await chatApi.send(id, text), { status: 'sent' }) }\n    catch { temp.status = 'failed' }\n  }\n  function select(id) { activeId.value = id }\n  function reset() { chats.value = []; activeId.value = null; messagesByChat.value = {} }\n\n  return { chats, activeId, listStatus, listError, activeChat, unreadTotal, messages, fetchChats, sendMessage, select, reset }\n})\n```\nOption-store style: `defineStore('chat', { state: () => ({ chats: [] }), getters: { unreadTotal: s => \u2026 }, actions: { async fetchChats() { this.chats = await \u2026 } } })`: equivalent, `this`-based.\n**Mapping:** state \u2194 `ref`, getters \u2194 `computed`, actions \u2194 functions. No mutations layer: change state directly or in actions.\n\n## 40.3 Using a store \ud83d\udfe1\n```vue\n<script setup>\nimport { onMounted } from 'vue'\nimport { storeToRefs } from 'pinia'\nimport { useChatStore } from '@/stores/chat'\nconst store = useChatStore()\nconst { chats, listStatus, unreadTotal } = storeToRefs(store)    // \u2705 keeps reactivity when destructuring state/getters\nconst { fetchChats, select } = store                              // \u2705 actions can be destructured directly\nonMounted(fetchChats)\n// const { chats } = store   \u274c loses reactivity (same bug as destructuring reactive)\n<\/script>\n<template><TheBadge :count=\"unreadTotal\" /><ChatItem v-for=\"c in chats\" :key=\"c.id\" :chat=\"c\" @select=\"select\" /><\/template>\n```\nSetup: `app.use(createPinia())`. Stores are **singletons** created on first use. A store can use another (`const auth = useAuthStore()` inside an action). Helpers: `store.$patch({...})`, `store.$subscribe(cb)`, `store.$onAction(cb)`.\n\n## 40.4 Auth store and persistence\n```js\nexport const useAuthStore = defineStore('auth', () => {\n  const token = ref(sessionStorage.getItem('token')); const user = ref(null)\n  const isLoggedIn = computed(() => !!token.value)\n  async function login(creds) { const r = await authApi.login(creds); token.value = r.accessToken; user.value = r.user; sessionStorage.setItem('token', r.accessToken) }\n  function logout() { token.value = null; user.value = null; sessionStorage.removeItem('token'); useChatStore().reset() }\n  return { token, user, isLoggedIn, login, logout }\n})\n```\nState lives in memory and is **lost on refresh**; persist selectively (`pinia-plugin-persistedstate` or manual storage). Be careful what you persist (Module 45). **On logout reset every store** so the next user never sees old data.\n\n## 40.5 Organisation and mistakes\nOne store per **domain** (`auth`, `chat`, `orders`, `ui`); keep HTTP in services, orchestration in actions; keep stores UI-agnostic; use `storeToRefs`; don't put form drafts or purely local UI state in stores; avoid a \"god store\"; avoid duplicating the same server data in two stores; track loading/error per resource.\n**Mistakes:** destructuring state without `storeToRefs` \u00b7 mutating store state from many random places \u00b7 circular store imports \u00b7 forgetting to reset on logout.\n**Q1. Why Pinia over props/events?** **Q2. Pinia vs Vuex?** **Q3. State/getters/actions mapping?** **Q4. Why `storeToRefs`?** **Q5. Where do you call APIs: component or store?** shared data \u2192 store action via a service; local data \u2192 component/composable. **Q6. How do you persist state?** **Q7. What do you do on logout?**\n**Exercises:** a cart store (add/remove/total) \u00b7 an auth store + guard \u00b7 a chat store with optimistic send \u00b7 two sibling components sharing one store \u00b7 refactor a prop-drilling example.\n\n## \u25b6 VUE STEP 40 \u2014 the chat store\nUse the store in 40.2. Header badge: `const { unreadTotal } = storeToRefs(useChatStore())`. The sidebar calls `fetchChats`, the room calls `sendMessage`: neither component knows about the other, yet both stay in sync through the store.\n\n---\n\n# MODULE 41 \u2014 VUE API INTEGRATION (Spring Boot backend)\n\n## 41.1 Fetch vs Axios \ud83d\udfe1\n| | `fetch` | Axios |\n|---|---|---|\n| Built in | \u2705 | install |\n| JSON handling | manual | automatic |\n| Non-2xx | resolves (check `ok`) | **throws** |\n| Interceptors | write a wrapper | built in |\n| Timeout / upload progress | AbortSignal / no | `timeout`, `onUploadProgress` |\nFollow the project's choice. Axios setup (common in company code):\n```js\n// services/http.js\nimport axios from 'axios'\nimport { useAuthStore } from '@/stores/auth'\nimport router from '@/router'\n\nexport const http = axios.create({ baseURL: import.meta.env.VITE_API_BASE_URL, timeout: 10000 })\nhttp.interceptors.request.use(cfg => { const t = useAuthStore().token; if (t) cfg.headers.Authorization = `Bearer ${t}`; return cfg })\nhttp.interceptors.response.use(r => r.data, err => {                  // unwrap data; normalise errors\n  if (err.response?.status === 401) { useAuthStore().logout(); router.replace({ name: 'login' }) }\n  return Promise.reject({ status: err.response?.status ?? 0, message: err.response?.data?.message ?? 'Network error', body: err.response?.data, canceled: axios.isCancel(err) })\n})\n```\n\n## 41.2 Service files, base URLs, environments \ud83d\udfe1\n```\n.env.development   VITE_API_BASE_URL=http://localhost:8080/api\n.env.production    VITE_API_BASE_URL=/api\nservices/userApi.js\n  export const userApi = {\n    list:   (p, cfg) => http.get('/users', { params: p, ...cfg }),\n    get:    id => http.get(`/users/${id}`),\n    create: d => http.post('/users', d),\n    update: (id, d) => http.put(`/users/${id}`, d),\n    remove: id => http.delete(`/users/${id}`),\n  }\n```\nSpring CORS (only needed if you don't proxy):\n```java\n@Bean WebMvcConfigurer cors() { return new WebMvcConfigurer() { public void addCorsMappings(CorsRegistry r) {\n  r.addMapping(\"/api/**\").allowedOrigins(\"http://localhost:5173\").allowedMethods(\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\").allowCredentials(true); } }; }\n```\n\n## 41.3 A composable for paginated, searchable lists \ud83d\udfe1\n```js\n// composables/useUsers.js\nimport { ref, watch, onUnmounted } from 'vue'\nimport { userApi } from '@/services/userApi'\nexport function useUsers() {\n  const users = ref([]), total = ref(0), loading = ref(false), error = ref(null)\n  const page = ref(0), size = ref(10), q = ref('')\n  let ctrl, t\n  async function load() {\n    ctrl?.abort(); ctrl = new AbortController()\n    loading.value = true; error.value = null\n    try {\n      const res = await userApi.list({ q: q.value, page: page.value, size: size.value }, { signal: ctrl.signal })   // Spring Page<UserDto>\n      users.value = res.content; total.value = res.totalElements\n    } catch (e) { if (!e.canceled) error.value = e.message } finally { loading.value = false }\n  }\n  watch(q, () => { page.value = 0; clearTimeout(t); t = setTimeout(load, 350) })       // debounce + reset page\n  watch([page, size], load)\n  onUnmounted(() => { ctrl?.abort(); clearTimeout(t) })\n  return { users, total, loading, error, page, size, q, load }\n}\n```\n\n## 41.4 A complete user-management feature \ud83d\udfe1\n```\nviews/UsersView.vue            \u2190 page: uses useUsers(), shows table, pagination, modals\ncomponents/UserTable.vue       \u2190 props: users; emits: edit, delete\ncomponents/UserForm.vue        \u2190 props: user (null = create); emits: saved, cancel; local draft + validation\ncomponents/BasePagination.vue  \u2190 props: page, total, size; emits: update:page\nservices/userApi.js  composables/useUsers.js\n```\n```vue\n<!-- UsersView.vue -->\n<script setup>\nimport { ref, onMounted } from 'vue'\nimport { useUsers } from '@/composables/useUsers'\nimport { userApi } from '@/services/userApi'\nconst { users, total, loading, error, page, size, q, load } = useUsers()\nconst editing = ref(null), showForm = ref(false), actionError = ref(null)\nonMounted(load)\nconst openCreate = () => { editing.value = null; showForm.value = true }\nconst openEdit = u => { editing.value = u; showForm.value = true }\nasync function remove(u) {\n  if (!window.confirm(`Delete ${u.name}?`)) return\n  try { await userApi.remove(u.id); await load() } catch (e) { actionError.value = e.message }\n}\nasync function onSaved() { showForm.value = false; await load() }\n<\/script>\n<template>\n  <header><h1>Users<\/h1><button @click=\"openCreate\">Add user<\/button><\/header>\n  <input v-model=\"q\" type=\"search\" placeholder=\"Search users\u2026\" aria-label=\"Search users\">\n  <p v-if=\"actionError\" role=\"alert\">{{ actionError }}<\/p>\n  <p v-if=\"loading\">Loading\u2026<\/p>\n  <p v-else-if=\"error\" role=\"alert\">{{ error }} <button @click=\"load\">Retry<\/button><\/p>\n  <p v-else-if=\"!users.length\">No users found<\/p>\n  <UserTable v-else :users=\"users\" @edit=\"openEdit\" @delete=\"remove\" />\n  <BasePagination v-model:page=\"page\" :total=\"total\" :size=\"size\" />\n  <BaseModal v-model:open=\"showForm\" :title=\"editing ? 'Edit user' : 'New user'\">\n    <UserForm :user=\"editing\" @saved=\"onSaved\" @cancel=\"showForm = false\" />\n  <\/BaseModal>\n<\/template>\n```\n```vue\n<!-- UserForm.vue (create/edit with a local draft) -->\n<script setup>\nimport { reactive, ref, watch } from 'vue'\nimport { userApi } from '@/services/userApi'\nconst props = defineProps({ user: Object }); const emit = defineEmits(['saved', 'cancel'])\nconst draft = reactive({ name: '', email: '', role: 'seller' })\nwatch(() => props.user, u => Object.assign(draft, { name: '', email: '', role: 'seller' }, u ?? {}), { immediate: true })\nconst saving = ref(false), errors = ref({}), error = ref(null)\nasync function save() {\n  saving.value = true; errors.value = {}; error.value = null\n  try { props.user ? await userApi.update(props.user.id, draft) : await userApi.create(draft); emit('saved') }\n  catch (e) { e.body?.errors ? (errors.value = Object.fromEntries(e.body.errors.map(x => [x.field, x.message]))) : (error.value = e.message) }\n  finally { saving.value = false }\n}\n<\/script>\n```\n**Request lifecycle:** typing in the search box \u2192 `q` watcher debounces \u2192 `load()` \u2192 `GET /api/users?q=&page=0&size=10` (+ Bearer) \u2192 Spring `Page<UserDto>` JSON \u2192 `users` and `total` refs set \u2192 the table re-renders. Delete \u2192 `DELETE` \u2192 reload list. Editing happens on a **draft copy**, so Cancel loses nothing.\n**With Pinia:** move `users/total/load` into a `useUserStore` if other views also need the same data; otherwise keep it local in the composable.\n\n## 41.5 Authentication flow\nLogin form \u2192 `authApi.login` \u2192 store token/user \u2192 `router.push(redirect)` \u2192 guard allows \u2192 every request gets `Authorization` \u2192 401 interceptor logs out \u2192 login page. Cookie variant: `axios.create({ withCredentials: true })` plus a CSRF header.\n\n## 41.6 Questions and exercises\n**Q1. Where do API calls live?** **Q2. How do you handle 401 globally?** **Q3. How do you cancel requests when a component unmounts?** **Q4. Debounced server search with pagination: how?** **Q5. How do you avoid race conditions?** **Q6. Why transform responses in the service layer?** UI independent of backend shape.\n**Exercises:** build the user-management app against JSONPlaceholder `/users`, then swap `baseURL` to your Spring app \u00b7 add sorting \u00b7 optimistic delete with rollback.\n\n## \u25b6 VUE STEP 41 \u2014 Seller Chat services\n`services/http.js` (above), `chatApi.js`, `orderApi.js`, and `mock/*.js` with the same interface; switch with `VITE_USE_MOCK`. Components never import axios.\n\n---\n\n# MODULE 42 \u2014 ADVANCED VUE CONCEPTS\n\n## 42.1 `provide` / `inject` \ud83d\udd34\nGive data to **any descendant** without prop drilling.\n```js\n// ancestor\nimport { provide, ref, readonly } from 'vue'\nconst theme = ref('light')\nprovide('theme', readonly(theme)); provide('setTheme', v => (theme.value = v))\n// descendant at any depth\nimport { inject } from 'vue'\nconst theme = inject('theme', 'light')       // second argument = default\n```\nUse `Symbol` keys to avoid clashes; expose changes via functions. Good for subtree context (form groups, tabs, themes). For app-wide data prefer Pinia (better DevTools).\n\n## 42.2 Teleport \ud83d\udfe1\n`<Teleport to=\"body\">\u2026<\/Teleport>` renders part of a component's template **elsewhere in the DOM** (usually `<body>`). Solves stacking-context and `overflow` problems for modals, toasts and dropdowns (Module 8.3). State and events still belong to the original component.\n\n## 42.3 KeepAlive, dynamic and async components \ud83d\udfe1\n```vue\n<component :is=\"currentTab\" />                                       <!-- render a component chosen at runtime -->\n<KeepAlive include=\"ChatList,OrdersTab\"><component :is=\"currentTab\" /><\/KeepAlive>   <!-- cache instances: keeps state/scroll when switching -->\n<script setup>\nimport { defineAsyncComponent } from 'vue'\nconst HeavyChart = defineAsyncComponent(() => import('./HeavyChart.vue'))   // downloaded on first use (code splitting)\n<\/script>\n```\n`onActivated/onDeactivated` run for cached components. `defineAsyncComponent({ loader, loadingComponent, errorComponent, delay, timeout })`. `<Suspense>` (experimental) handles async `setup` with a fallback.\n\n## 42.4 Template refs and `defineExpose` \ud83d\udfe1\n```vue\n<script setup>\nimport { ref, onMounted, nextTick } from 'vue'\nconst inputEl = ref(null)                       // name matches ref=\"inputEl\"\nonMounted(() => inputEl.value.focus())          // available only after mount\nconst listEl = ref(null)\nasync function scrollBottom() { await nextTick(); listEl.value.scrollTop = listEl.value.scrollHeight }\n<\/script>\n<template><input ref=\"inputEl\"><ul ref=\"listEl\"><\/ul><\/template>\n```\nComponent refs: `<Child ref=\"child\">` then `child.value.focus()`: the child must opt in with `defineExpose({ focus, reset })` (`<script setup>` components are closed by default). In `v-for` a ref becomes an array. Use sparingly: prefer props/events.\n\n## 42.5 Custom directives and plugins \ud83d\udd34\n```js\nconst vFocus = { mounted: el => el.focus() }                     // <input v-focus>\napp.directive('click-outside', {\n  mounted(el, binding) { el._h = e => !el.contains(e.target) && binding.value(e); document.addEventListener('click', el._h) },\n  unmounted(el) { document.removeEventListener('click', el._h) },\n})\nexport default { install(app, options) { app.component('BaseButton', BaseButton); app.provide('apiConfig', options) } }     // plugin\napp.use(myPlugin, { baseUrl: '\u2026' })\n```\nDirectives reuse low-level DOM behaviour; stateful logic belongs in composables. `app.config.errorHandler` / `warnHandler` give global hooks.\n\n## 42.6 Render functions and JSX (overview)\nTemplates compile to render functions; you can write them directly: `h('div', { class: 'a' }, [h('span', 'text')])`, or use JSX (`@vitejs/plugin-vue-jsx`) for highly dynamic components. 95% of code should be templates (easier for the compiler to optimise).\n\n## 42.7 Error handling, performance, code splitting \ud83c\udfed\n- `onErrorCaptured` boundary components; `app.config.errorHandler`; report to monitoring.\n- **Performance checklist:** `v-once`, `v-memo=\"[a, b]\"`, `shallowRef` for big data, virtual scrolling for thousands of rows, `computed` instead of methods in templates, avoid needless watchers, `v-show` for frequent toggles, stable keys, lazy-load routes/components, debounce inputs, split big components, avoid creating objects/functions inline for hot-list props, `markRaw` for non-reactive instances, analyse the bundle (`rollup-plugin-visualizer`). **Measure first** (Vue DevTools Performance, Lighthouse).\n\n## 42.8 Questions and exercises\n**Q1. provide/inject vs props vs Pinia?** **Q2. Why Teleport?** **Q3. KeepAlive use?** **Q4. When are template refs available?** **Q5. When write a custom directive?** **Q6. How do async components help?** **Q7. Why `defineExpose`?**\n**Exercises:** a Teleport modal \u00b7 tabs with KeepAlive preserving input \u00b7 a `v-click-outside` directive \u00b7 a lazy `HeavyChart` \u00b7 ref-based autofocus and scroll-to-bottom.\n\n## \u25b6 VUE STEP 42\nUse Teleport in `BaseModal` (the Attach-order dialog), a template ref + `nextTick` to keep `MessageList` scrolled to the bottom, and `defineAsyncComponent` for the Orders view's chart.\n\n---\n\n# MODULE 43 \u2014 VUE TESTING AND DEBUGGING\n\n## 43.1 Vue DevTools \ud83d\udfe1\nA browser extension with panels for **Components** (tree, props, state/refs/computed: editable live), **Pinia** (state, time travel, actions), **Router**, **Timeline** (events, performance) and an Inspector.\n**\"UI doesn't update\" flow:** select the component \u2192 did the state value change? **Yes** \u2192 check the template binds the right variable/`key`. **No** \u2192 was the handler/action called (Console/breakpoint)? \u2192 check the Network response.\nRead Vue warnings in the Console; they name the component: *\"Extraneous non-props attributes\"*, *\"Avoid mutating a prop directly\"*, *\"Property X was accessed during render but is not defined\"*, *\"Missing required prop\"*, *\"Duplicate keys\"*.\n\n## 43.2 The testing pyramid \ud83d\udfe1\n| Level | Tool | What it tests | Speed |\n|---|---|---|---|\n| Unit | **Vitest** | pure functions, composables, store actions | fast |\n| Component | Vitest + **Vue Test Utils** | render a component; props/events/DOM | fast |\n| Integration | same, with router/pinia/mocked API (MSW) | several units together | medium |\n| End-to-end | **Playwright** / Cypress | real browser, full flows (login \u2192 send message) | slow |\n```js\n// utils/format.test.js\nimport { describe, it, expect } from 'vitest'\ndescribe('formatPrice', () => { it('formats INR', () => { expect(formatPrice(1299)).toBe('\u20b91,299.00') }) })\n\n// components/ChatItem.test.js\nimport { mount } from '@vue/test-utils'\nimport ChatItem from './ChatItem.vue'\nit('shows the badge and emits select', async () => {\n  const w = mount(ChatItem, { props: { chat: { id: 1, buyerName: 'Ravi', lastMessage: 'Hi', unread: 2 } } })\n  expect(w.text()).toContain('Ravi')\n  expect(w.find('.chat-item__badge').text()).toBe('2')\n  await w.trigger('click')                                   // waits for Vue's DOM update\n  expect(w.emitted('select')[0]).toEqual([1])                // event name + payload\n})\n\n// store test\nimport { setActivePinia, createPinia } from 'pinia'\nbeforeEach(() => setActivePinia(createPinia()))\nit('computes unread total', () => { const s = useChatStore(); s.chats = [{ unread: 1 }, { unread: 2 }]; expect(s.unreadTotal).toBe(3) })\n\n// mock an API module\nimport { vi } from 'vitest'\nvi.mock('@/services/chatApi', () => ({ chatApi: { list: vi.fn().mockResolvedValue({ content: [{ id: 1 }] }) } }))\n```\nTest **behaviour the user sees** (text, emitted events, loading/error/empty states), not implementation details. Use `flushPromises()` for async. Mock the network, not Vue. Run `npm run test`, coverage with `vitest --coverage`.\n**Playwright:** `await page.goto('/login'); await page.getByLabel('Email').fill('a@b.com'); await page.getByRole('button', { name: 'Log in' }).click(); await expect(page).toHaveURL('/chats')`. Use for critical flows only.\n\n## 43.3 Practical debugging exercises\n1. List renders wrong rows after sorting \u2192 missing or index `key`.\n2. Count doesn't update after destructuring a `reactive` \u2192 `toRefs`.\n3. `Cannot read properties of undefined (reading 'name')` \u2192 data not loaded yet: `v-if`/`?.`.\n4. Component doesn't reload when the route param changes \u2192 `watch` on `route.params`.\n5. Request fires twice \u2192 hook in both `setup` and `watch immediate`, or duplicate listener without cleanup.\n6. Spring returns 400 \u2192 compare the payload in Network with the DTO fields.\n7. CORS error \u2192 check the preflight response headers; configure Spring or use a dev proxy.\n\n## 43.4 Questions and exercises\n**Q1. How do you test a component?** **Q2. Unit vs component vs E2E?** **Q3. How do you mock API calls?** **Q4. What do you test in a Pinia store?** **Q5. How do you debug a non-reactive value?**\n**Exercises:** write five tests for a form component (validation messages, submit emits, disabled while submitting) \u00b7 test `useFetch` with a mocked `fetch` \u00b7 write one Playwright login test.\n\n## \u25b6 VUE STEP 43\nWrite tests for `MessageComposer` (empty text disables Send; Enter emits `send`), the `chat` store (`unreadTotal`, optimistic send marks `failed`), and the `searchChats` utility.\n\n---\n**Next \u2192 Parts 7\u20138: professional engineering and the full Seller Chat build in Vue (Modules 44\u201348).**\n\n\n# PART 6 (continued) \u2014 VUE 3 DEEP DIVE: THE REST OF THE FRAMEWORK\n\n# MODULE 68 \u2014 VUE 3 DEEP DIVE: TRANSITIONS, ATTRS, MACROS, ADVANCED REACTIVITY, PLUGINS, ROUTER AND PINIA INTERNALS, SSR\n\n> Modules 31\u201343 taught you to build apps. This module fills the remaining Vue 3 features that company code uses and interviews ask about. Each section has: **what and why \u2192 code \u2192 how it works \u2192 mistakes \u2192 VUE STEP for Seller Chat.** Version tags (3.3, 3.4, 3.5) tell you when a feature arrived: check your project's Vue version with `npm ls vue`.\n\n---\n\n## 68.1 Transitions and animations \ud83d\udfe1\n### What and why\nWhen elements enter or leave (`v-if`, route change, list add/remove) they just pop. `<Transition>` lets you animate that with CSS classes (or JS hooks) that Vue adds and removes at the right moments. **Analogy:** Vue is the stage manager; it says \"enter now\" and \"leave now\", you decide what the actors do.\n### `<Transition>`: one element or component\n```vue\n<script setup>import { ref } from 'vue'; const open = ref(false)<\/script>\n<template>\n  <button @click=\"open = !open\">Toggle<\/button>\n  <Transition name=\"fade\">\n    <p v-if=\"open\">Hello<\/p>            <!-- exactly ONE root child; must be toggled by v-if / v-show / :is / key -->\n  <\/Transition>\n<\/template>\n<style>\n.fade-enter-active, .fade-leave-active { transition: opacity .2s ease }\n.fade-enter-from, .fade-leave-to { opacity: 0 }\n<\/style>\n```\n**The six classes Vue applies (prefix = `name`):**\n```\nENTER:  fade-enter-from  \u2192 (next frame) fade-enter-to        + fade-enter-active throughout\nLEAVE:  fade-leave-from  \u2192 (next frame) fade-leave-to        + fade-leave-active throughout\n```\n| Class | Meaning | You usually put |\n|---|---|---|\n| `*-enter-from` / `*-leave-to` | the \"hidden\" look | `opacity:0; transform:translateY(8px)` |\n| `*-enter-to` / `*-leave-from` | the \"shown\" look | (defaults are fine) |\n| `*-enter-active` / `*-leave-active` | during the animation | `transition: \u2026 .2s` |\nVue **waits for the CSS transition to end** before removing a leaving element from the DOM: that's the magic.\n**Options:** `mode=\"out-in\"` (old leaves first, then new enters: use for swapping routes/tabs; default is simultaneous) \u00b7 `appear` (animate on first render) \u00b7 `:css=\"false\"` + JS hooks (`@before-enter @enter @leave`, call `done()`) for libraries like GSAP \u00b7 custom class props (`enter-active-class=\"animate__fadeIn\"`) for Animate.css \u00b7 `<Transition>` also works on `<component :is>` and `<RouterView>`.\n```vue\n<RouterView v-slot=\"{ Component, route }\">\n  <Transition name=\"page\" mode=\"out-in\"><component :is=\"Component\" :key=\"route.path\" /><\/Transition>\n<\/RouterView>\n```\n### `<TransitionGroup>`: lists\n```vue\n<TransitionGroup name=\"msg\" tag=\"div\" class=\"messages\">      <!-- renders a real wrapper element (tag); default renders none -->\n  <MessageBubble v-for=\"m in messages\" :key=\"m.id\" :message=\"m\" />   <!-- every child needs a UNIQUE :key -->\n<\/TransitionGroup>\n<style>\n.msg-enter-active, .msg-leave-active { transition: all .25s ease }\n.msg-enter-from { opacity: 0; transform: translateY(12px) }\n.msg-leave-to   { opacity: 0 }\n.msg-move { transition: transform .25s ease }                  /* FLIP animation when siblings shift */\n.msg-leave-active { position: absolute }                        /* take leaving item out of flow so others slide smoothly */\n<\/style>\n```\n**Rules:** children must have keys \u00b7 no `mode` prop \u00b7 the `*-move` class animates reordering.\n### Accessibility and performance\nAnimate **`opacity` and `transform` only** (compositor-friendly: see C20). Respect reduced motion:\n```css\n@media (prefers-reduced-motion: reduce) { .fade-enter-active, .fade-leave-active, .msg-enter-active, .msg-move { transition: none } }\n```\nDon't hide important information behind animation; screen readers aren't affected by CSS transitions but delayed focus can be.\n**Mistakes:** two root children in `<Transition>` \u00b7 missing `:key` in `TransitionGroup` \u00b7 forgetting `mode=\"out-in\"` on route transitions (pages overlap) \u00b7 animating `height: auto` (can't transition; use grid-rows trick or JS) \u00b7 transition classes inside `scoped` CSS not matching (use a global class or `:deep`/non-scoped block).\n**\u25b6 VUE STEP 68.1:** animate new chat bubbles with `TransitionGroup` (fade + slide), fade the `AttachOrderModal`, add a `page` transition between `/chats` and `/orders`, and honour reduced motion.\n\n---\n\n## 68.2 Attribute inheritance: `$attrs`, `inheritAttrs` \ud83d\udfe1\n### The rule\nAttributes and listeners a parent passes that the child **did not declare as props/emits** (\"fallthrough attributes\": `class`, `style`, `id`, `aria-*`, `data-*`, `@click`) are **automatically applied to the child's single root element**.\n```vue\n<!-- BaseButton.vue root is <button> -->\n<BaseButton class=\"wide\" id=\"send\" aria-label=\"Send\" @click=\"onSend\">Send<\/BaseButton>\n<!-- renders: <button class=\"btn wide\" id=\"send\" aria-label=\"Send\">Send<\/button>  with the click listener attached to <button> -->\n```\n`class` and `style` **merge** with the child's own; other attributes override. `v-on` listeners merge too.\n### When the root is NOT the element you want\nA `BaseInput` has a wrapper `<div>`, a `<label>` and an `<input>`. You want `placeholder`, `type`, `@blur` to land on the **input**, not the div:\n```vue\n<script setup>\ndefineOptions({ inheritAttrs: false })          // 3.3+: turn off auto-apply (before: a second plain <script> block)\ndefineProps({ label: String, error: String })\nconst model = defineModel()\n<\/script>\n<template>\n  <div class=\"field\">\n    <label :for=\"$attrs.id\">{{ label }}<\/label>\n    <input v-bind=\"$attrs\" v-model=\"model\" :aria-invalid=\"!!error\">   <!-- ALL fallthrough attrs & listeners go here -->\n    <p v-if=\"error\" role=\"alert\">{{ error }}<\/p>\n  <\/div>\n<\/template>\n```\nSplit when you want class on the wrapper but the rest on the input:\n```vue\n<script setup>\nimport { useAttrs, computed } from 'vue'\ndefineOptions({ inheritAttrs: false })\nconst attrs = useAttrs()\nconst rest = computed(() => { const { class: _c, style: _s, ...r } = attrs; return r })\n<\/script>\n<template><div class=\"field\" :class=\"$attrs.class\" :style=\"$attrs.style\"><input v-bind=\"rest\"><\/div><\/template>\n```\n**Facts:** in Vue 3 `$attrs` includes `class`, `style` and listeners (`onClick`) \u00b7 `$attrs` is **not reactive in `watch`** the way props are (access in templates/computed re-render fine; don't `watch` it) \u00b7 multi-root components do **not** auto-inherit: you must bind `$attrs` explicitly or Vue warns \u00b7 declared props/emits are removed from `$attrs`.\n**Mistakes:** forgetting `inheritAttrs:false` and getting `class` on the wrapper and the input twice \u00b7 passing `id` to the wrapper so the `<label for>` points nowhere \u00b7 expecting a multi-root component to inherit.\n**\u25b6 VUE STEP 68.2:** rebuild `BaseInput` so `type`, `placeholder`, `autocomplete`, `maxlength` and `@keydown.enter` reach the real `<input>`.\n\n---\n\n## 68.3 `<script setup>` compiler macros: the complete set \ud83d\udd34\nMacros are compiler instructions (no import needed; they only work at the top level of `<script setup>`).\n### `defineProps`\n```js\n// runtime declaration\nconst props = defineProps({ title: { type: String, required: true }, size: { type: String, default: 'md', validator: v => ['sm', 'md'].includes(v) } })\n// type-based declaration (TypeScript)\nconst props = defineProps<{ title: string; size?: 'sm' | 'md'; items?: string[] }>()\nconst props = withDefaults(defineProps<{ size?: 'sm' | 'md'; items?: string[] }>(), { size: 'md', items: () => [] })   // object/array defaults are factories\n```\n**Reactive props destructure (3.5):** `const { title, size = 'md' } = defineProps<{ title: string; size?: string }>()`: the compiler rewrites these to `props.title`, so they **stay reactive** and defaults go inline. Before 3.5 destructuring props lost reactivity; use `toRefs(props)` or `toRef(() => props.x)`. To pass a destructured prop into a composable use a getter: `useThing(() => title)`.\n**Boolean casting:** `<Cmp disabled>` = `true`; absent = `false`. **Hyphen/camel:** pass `user-name`, read `userName`.\n### `defineEmits`\n```js\nconst emit = defineEmits(['select', 'close'])                                       // runtime\nconst emit = defineEmits({ select: id => typeof id === 'number' })                  // validator (returns false \u2192 dev warning)\nconst emit = defineEmits<{ select: [id: number]; close: [] }>()                     // typed (3.3 syntax)\n```\nDeclaring emits (a) documents the component, (b) removes the listener from `$attrs` so it isn't also bound natively to the root.\n### `defineModel` (stable in 3.4)\n```vue\n<script setup>\nconst model = defineModel()                                  // v-model            \u2192 modelValue / update:modelValue\nconst title = defineModel('title', { required: true })       // v-model:title\nconst [name, mods] = defineModel({ set(v) { return mods.trim ? v.trim() : v } })   // modifiers: <Cmp v-model.trim=\"x\">\nconst count = defineModel('count', { type: Number, default: 0 })\n<\/script>\n<template><input v-model=\"model\"><\/template>                 <!-- assigning model.value emits update:modelValue for you -->\n```\nMultiple models: `<UserForm v-model:name=\"n\" v-model:email=\"e\" />`. If the parent doesn't bind `v-model`, `defineModel` keeps **local state** (works uncontrolled).\n### `defineSlots` (3.3, type-only)\n```vue\n<script setup lang=\"ts\">\ndefineSlots<{ default(props: { item: Chat; index: number }): any; empty(): any }>()      // typed scoped slots for editors/vue-tsc\n<\/script>\n```\n### `defineOptions` (3.3)\n`defineOptions({ name: 'ChatItem', inheritAttrs: false })`: set component options without a second `<script>`.\n### `defineExpose`\n`<script setup>` components are **closed** by default: a parent's template ref sees nothing. Expose a deliberate API: `defineExpose({ focus, reset })`.\n### Also in `<script setup>`\nTop-level `await` (makes the component async: needs `<Suspense>`, see 68.9) \u00b7 `useSlots()`, `useAttrs()` \u00b7 `import` is auto-available in the template \u00b7 components are imported, not registered \u00b7 `<script setup>` + normal `<script>` block can coexist (rare) \u00b7 **`v-bind` in `<style>`:** `<style scoped>.box{ color: v-bind(color); width: v-bind('size.w') }<\/style>` (reactive CSS variables).\n**Mistakes:** macros inside a function/`if` \u00b7 destructuring props pre-3.5 and losing reactivity \u00b7 mutating `props.x` \u00b7 forgetting `defineExpose` and wondering why `child.value.focus` is undefined \u00b7 importing macros (`import { defineProps } \u2026` is unnecessary and warns).\n**\u25b6 VUE STEP 68.3:** convert `ChatItem` to type-based props with reactive destructure (if Vue \u2265 3.5), add a validated emit, and give `MessageComposer` a `defineExpose({ focus })` so `ChatRoomView` can focus it after sending.\n\n---\n\n## 68.4 Template refs, `useTemplateRef`, `useId` \ud83d\udfe1\n```vue\n<script setup>\nimport { ref, useTemplateRef, onMounted, nextTick } from 'vue'\n\nconst inputEl = ref(null)                       // classic: variable name must equal ref=\"inputEl\"\nconst list = useTemplateRef('list')             // 3.5+: explicit string key (works with composables & dynamic names)\nonMounted(() => { inputEl.value.focus() })      // available ONLY after mount (null before; null again if v-if removes it)\nasync function toBottom() { await nextTick(); list.value.scrollTop = list.value.scrollHeight }\n<\/script>\n<template><input ref=\"inputEl\"><div ref=\"list\" class=\"messages\"><\/div><\/template>\n```\n**Function refs** (dynamic): `<li :ref=\"el => { if (el) els[i] = el }\">`. **Refs in `v-for`** become an **array** (order not guaranteed to match the source: key by id if it matters). **Component refs** expose only `defineExpose`d members.\n**`useId()` (3.5):** unique, **SSR-stable** ids for label/input pairs without hand-rolled counters:\n```vue\n<script setup>import { useId } from 'vue'; const id = useId()<\/script>\n<template><label :for=\"id\">Email<\/label><input :id=\"id\"><p :id=\"`${id}-err`\" role=\"alert\">\u2026<\/p><\/template>\n```\n**Rule:** prefer props/events; use refs only for imperative DOM needs (focus, scroll, measure, third-party widgets).\n**\u25b6 VUE STEP 68.4:** replace the `Math.random()` ids in `BaseInput` with `useId()`; use `useTemplateRef` for the message list.\n\n---\n\n## 68.5 Advanced reactivity API \ud83d\udd34\n### Choosing the right primitive\n| API | Use when |\n|---|---|\n| `ref` / `reactive` | default deep reactivity |\n| `shallowRef` / `shallowReactive` | big data you **replace** rather than mutate (5,000-item arrays); only `.value` assignment triggers |\n| `triggerRef(ref)` | you mutated inside a `shallowRef` and want to force the update |\n| `markRaw(obj)` | never make this object reactive (class instance, chart, map library) |\n| `toRaw(proxy)` | get the original object (debugging, passing to non-Vue libs) |\n| `readonly(x)` | expose state that consumers can't mutate (`provide('theme', readonly(theme))`) |\n| `toRef(obj,'k')` / `toRefs(obj)` | link a property to a ref / all properties |\n| `toRef(() => props.x)` (3.3) | a ref from a getter (read-only) |\n| `toValue(x)` (3.3) | accept `value | ref | getter` in composables |\n| `isRef / unref / isReactive / isProxy` | checks/unwrapping |\n| `customRef` | a ref with custom get/set behaviour (debounce!) |\n| `effectScope` | group effects so you can stop them together (libraries, tests) |\n```js\n// shallowRef for a huge list\nconst rows = shallowRef([]); rows.value = await api.list()            // triggers (new array)\nrows.value.push(x); triggerRef(rows)                                    // mutation needs triggerRef\n\n// customRef: a debounced ref in 8 lines\nfunction debouncedRef(value, ms = 300) {\n  let t\n  return customRef((track, trigger) => ({\n    get() { track(); return value },\n    set(v) { clearTimeout(t); t = setTimeout(() => { value = v; trigger() }, ms) },\n  }))\n}\nconst q = debouncedRef('')               // <input v-model=\"q\"> only \"commits\" after 300 ms\n```\n### `watch` in depth\n```js\nwatch(source, cb, { immediate, deep, flush, once, onTrigger })\nwatch([a, b], ([na, nb], [oa, ob]) => {})              // multiple sources\nwatch(() => props.id, (id, old, onCleanup) => { const c = new AbortController(); onCleanup(() => c.abort()); load(id, c.signal) })\nwatch(() => state.user, cb, { deep: true })            // deep: true walks everything (can be costly); 3.5: deep: 2 limits depth\nwatch(src, cb, { once: true })                         // 3.4+: run once then stop\n```\n**`flush` timing:** `'pre'` (default: before the component updates), `'post'` (after the DOM updated: use when you read the DOM; same as `watchPostEffect`), `'sync'` (immediately, per change: rare, can be slow).\n**`onWatcherCleanup` (3.5):** import and call inside a watcher/effect from anywhere (even helper functions), instead of the `onCleanup` argument: `onWatcherCleanup(() => ctrl.abort())` (must be called synchronously before any `await`).\n**`watchEffect`** auto-tracks only what is read **synchronously** (before the first `await`): reads after an `await` aren't tracked.\n**Stop a watcher:** `const stop = watch(...); stop()`. Watchers created in `setup` stop automatically on unmount; ones created **asynchronously** (after an `await`, in a timeout) are not auto-stopped.\n### Computed details\nComputed is **lazy and cached**; it re-runs only when a dependency it read changes. **Don't mutate state inside a computed** (side effects). Writable computed: `computed({ get: () => a.value, set: v => (a.value = v) })`. 3.4+: a computed returns the **previous value if unchanged** (so downstream effects don't re-run needlessly).\n### Update scheduling (why `nextTick`)\nChanges are queued and flushed once per tick (a micro-task): `count.value++` \u00d710 \u2192 **one** re-render. DOM reads right after a write see the old DOM until `await nextTick()`.\n### Reactivity gotchas (extra to Module 33)\n`Set`/`Map` are reactive (use `.get/.set/.add`); class instances stored in `ref` are proxied (methods run on the proxy: use `markRaw` for non-Vue classes); `reactive` loses reactivity if you replace it or destructure; a `ref` inside `reactive` auto-unwraps, but **not** inside arrays/Maps (`arr[0].value`); watching a **getter** (`() => obj.nested.x`) is needed for non-reactive-root properties.\n**Mistakes:** `deep: true` everywhere (slow) \u00b7 `watch` for derived data (use `computed`) \u00b7 `watchEffect` with reads after `await` \u00b7 creating watchers after an `await` and never stopping them.\n**\u25b6 VUE STEP 68.5:** make the chat message list a `shallowRef` for very long threads (replace the array on update); expose the theme as `readonly` via provide; write `debouncedRef` for the search box.\n\n---\n\n## 68.6 Plugins, global configuration, `provide` at app level \ud83d\udd34\n### Writing a plugin: a toast service\n```js\n// plugins/toast.js\nimport { reactive, readonly } from 'vue'\nconst state = reactive({ items: [] })\nlet id = 0\nexport const toast = {\n  show(message, tone = 'info', ms = 4000) { const t = { id: ++id, message, tone }; state.items.push(t); setTimeout(() => this.dismiss(t.id), ms) },\n  dismiss(i) { state.items = state.items.filter(t => t.id !== i) },\n}\nexport default {\n  install(app, options = {}) {\n    app.provide('toast', toast); app.provide('toastState', readonly(state))         // available to every component via inject\n    app.component('ToastHost', ToastHost)                                           // global component\n    app.directive('focus', { mounted: el => el.focus() })                            // global directive\n    app.config.globalProperties.$toast = toast                                       // Options API compat (avoid in new code)\n  },\n}\n// main.js:  app.use(toastPlugin, { position: 'bottom-right' })\n// component: const toast = inject('toast'); toast.show('Saved', 'success')\n```\nA plugin is **an object with `install(app, options)`** (or a function). Use it to register components/directives, provide services, add global config, or install third-party libraries (Router, Pinia, i18n are plugins!).\n### App-level API\n```js\nconst app = createApp(App)\napp.use(plugin, opts) ; app.component('Name', C) ; app.directive('name', d) ; app.provide('key', value)\napp.config.errorHandler = (err, instance, info) => {}        // uncaught errors from render/watchers/handlers/lifecycle\napp.config.warnHandler = (msg, instance, trace) => {}         // dev warnings\napp.config.performance = true                                  // dev perf marks in DevTools\napp.mount('#app') ; app.unmount()                              // unmount cleans up\n```\n**Typed injection:** use a `Symbol` or `InjectionKey<T>` (`const ToastKey: InjectionKey<Toast> = Symbol('toast')`) to avoid string clashes and get types. Prefer `provide/inject` + composables (`useToast()` wrapping `inject`) over `globalProperties` (invisible to TypeScript and `<script setup>`).\n**Multiple apps on a page:** `createApp` can be called several times (micro-frontends, widgets): each app has its own plugins and config.\n**\u25b6 VUE STEP 68.6:** replace the Module 48 `ui` store toast with the plugin above and use it for \"Message failed to send: Retry\".\n\n---\n\n## 68.7 Vue Router in depth \ud83d\udd34\n### Route configuration features\n```js\n{ path: '/chats', component: ChatsLayout, children: [\n    { path: '', name: 'chats', component: ChatsEmpty },\n    { path: ':chatId(\\\\d+)', name: 'chat', component: ChatRoom, props: route => ({ chatId: Number(route.params.chatId), tab: route.query.tab ?? 'info' }) },   // props function + numeric regex\n] },\n{ path: '/settings', components: { default: Settings, sidebar: SettingsNav } },                     // named views: <RouterView name=\"sidebar\" />\n{ path: '/old-chats', redirect: to => ({ name: 'chats', query: to.query }) },\n{ path: '/c/:id', alias: '/chat/:id', component: ChatRoom },\n{ path: '/admin', component: Admin, meta: { roles: ['ADMIN'], title: 'Admin' }, beforeEnter: (to, from) => { /* per-route guard */ } },\n```\n### Guards and lifecycle of a navigation\n```\nnavigation triggered \u2192 onBeforeRouteLeave (leaving comp) \u2192 router.beforeEach (global) \u2192 beforeEnter (route)\n  \u2192 resolve lazy components \u2192 onBeforeRouteUpdate (reused comp) \u2192 router.beforeResolve \u2192 URL updated \u2192 router.afterEach \u2192 DOM updates\n```\nGuards return `undefined`/`true` (continue), `false` (cancel), a **route location** (redirect), or throw. They may be `async`.\n```js\n// component guard: unsaved changes\nonBeforeRouteLeave(() => (dirty.value ? window.confirm('Discard changes?') : true))\nrouter.afterEach((to, from, failure) => { if (!failure) document.title = to.meta.title ?? 'Seller Chat' })\nrouter.onError(err => { if (/Loading chunk|Failed to fetch dynamically imported module/.test(err.message)) window.location.reload() })\n```\n### Dynamic routes (RBAC at runtime)\n```js\nrouter.beforeEach(async to => {\n  const auth = useAuthStore()\n  if (auth.isLoggedIn && !auth.routesLoaded) { auth.permittedRoutes.forEach(r => router.addRoute(r)); auth.routesLoaded = true; return to.fullPath }   // re-run navigation\n})\nrouter.removeRoute('admin') ; router.hasRoute('admin') ; router.getRoutes()\n```\n### Scroll behaviour and navigation results\n```js\nscrollBehavior(to, from, saved) { return saved ?? (to.hash ? { el: to.hash, behavior: 'smooth' } : { top: 0 }) }\nconst failure = await router.push('/x'); if (isNavigationFailure(failure, NavigationFailureType.duplicated)) {}   // push returns a promise\nawait router.isReady()                                  // before mounting in SSR/tests\n```\n### Custom link and `useLink`\n```vue\n<RouterLink :to=\"{ name: 'chat', params: { chatId: 5 } }\" custom v-slot=\"{ href, navigate, isActive }\">\n  <a :href=\"href\" @click=\"navigate\" :class=\"{ on: isActive }\" :aria-current=\"isActive ? 'page' : undefined\">Chat 5<\/a>\n<\/RouterLink>\n```\n**Params vs query vs hash:** params identify *which resource* (`/chats/5`), query is optional *state* (`?tab=orders`), hash is an in-page anchor. Changing only a param **reuses the component**: watch it. Don't pass big objects through the router: pass an id and load it. Typed routes: `unplugin-vue-router` generates types from the file system.\n**Mistakes:** infinite redirect in `beforeEach` \u00b7 forgetting that `beforeEach` runs on the *initial* navigation too \u00b7 using `window.location` instead of the router \u00b7 not handling chunk-load failures after deploys.\n**\u25b6 VUE STEP 68.7:** add `onBeforeRouteLeave` to warn when a draft message exists, a `router.onError` reload for stale chunks, a `props` function that converts `chatId` to a number.\n\n---\n\n## 68.8 Pinia in depth \ud83d\udd34\n### Two store styles side by side\n```js\n// Setup store (recommended): mirrors <script setup>\nexport const useCartStore = defineStore('cart', () => { const items = ref([]); const total = computed(() => \u2026); function add(p) { \u2026 } return { items, total, add } })\n// Option store\nexport const useCartStore = defineStore('cart', { state: () => ({ items: [] }), getters: { total: s => \u2026 }, actions: { add(p) { this.items.push(p) } } })\n```\n**Return everything you want to expose** from a setup store (state, getters, actions); un-returned variables are private (and not in DevTools/SSR serialisation).\n### Mutating, subscribing, observing\n```js\nconst store = useCartStore()\nstore.$patch({ items: [] }) ; store.$patch(s => { s.items.push(x); s.count++ })        // batch several changes into one update\nstore.$subscribe((mutation, state) => localStorage.setItem('cart', JSON.stringify(state)), { detached: true })   // state changed (persist!)\nstore.$onAction(({ name, args, after, onError }) => {                                  // wraps every action (logging, timing, analytics)\n  const t = performance.now(); after(res => console.log(name, performance.now() - t)); onError(e => reportError(e))\n})\nstore.$reset()           // option stores only; in setup stores write your own reset()\n```\n### Plugins and persistence\n```js\nconst pinia = createPinia()\npinia.use(({ store }) => { store.$onAction(({ name, onError }) => onError(e => console.error(`[${store.$id}.${name}]`, e))) })   // runs for every store\n// pinia-plugin-persistedstate:  defineStore('cart', setup, { persist: { key: 'cart.v1', paths: ['items'] } })\n```\n### Composing stores and testing\n```js\n// a store may use other stores INSIDE actions/getters (not at module top level \u2192 circular imports)\nexport const useChatStore = defineStore('chat', () => { function reset() {} ; async function openChat(id) { const auth = useAuthStore() ; \u2026 } })\n// testing: setActivePinia(createPinia()) in beforeEach; or createTestingPinia({ stubActions: false, initialState }) from @pinia/testing\n```\n**Design rules:** one store per **domain**; business orchestration in actions, HTTP in services; derived data as getters; reset every store on logout; don't store form drafts or UI toggles; avoid two stores holding the same server data; keep state serialisable (no class instances/functions) if you persist or SSR.\n**Pinia vs Vuex vs composables:** a composable returning module-level refs (`const state = ref(); export const useX = () => state`) is a mini-singleton store but without DevTools, devtools time-travel, plugins or SSR safety: fine for tiny cases, use Pinia for shared app state.\n**Mistakes:** `const { items } = store` (loses reactivity: `storeToRefs`) \u00b7 using a store at module top level before Pinia is installed \u00b7 giant \"everything\" store \u00b7 mutating persisted state from many places \u00b7 forgetting to reset on logout.\n**\u25b6 VUE STEP 68.8:** add a Pinia plugin that logs failed actions with the request id; persist only the auth token (`paths: ['token']`) and not chat messages.\n\n---\n\n## 68.9 `Suspense`, async components, error boundaries (revisited) \ud83d\udd34\n```vue\n<Suspense>\n  <template #default><ChatRoom /><\/template>              <!-- component with top-level await in <script setup> -->\n  <template #fallback><BaseSpinner /><\/template>\n<\/Suspense>\n```\n```vue\n<script setup>   // ChatRoom.vue: async setup\nconst chat = await chatApi.get(id)        // makes the component async: needs a <Suspense> ancestor\n<\/script>\n```\n`<Suspense>` is still marked **experimental**: for production, prefer explicit `loading/error` states (Module 36). Combine with an error boundary (`onErrorCaptured`) because a rejected async setup would otherwise bubble. `defineAsyncComponent({ loader, loadingComponent, errorComponent, delay: 200, timeout: 8000, onError(err, retry, fail, attempts) { attempts < 3 ? retry() : fail() } })` gives lazy loading **with retry**.\n\n---\n\n## 68.10 SSR, hydration, Nuxt: overview \ud83d\udfe1\n**SPA:** the browser downloads JS, then renders. **SSR:** the server renders HTML first (fast first paint, SEO), then the browser **hydrates**: attaches Vue to the existing HTML so it becomes interactive. **SSG:** HTML generated at build time.\n**Rules for SSR-safe code:** no `window`/`document`/`localStorage` at module top level or in `setup` (they don't exist on the server): use them in `onMounted` or guard (`if (import.meta.client)` in Nuxt / `typeof window !== 'undefined'`) \u00b7 avoid state shared across requests (module-level singletons leak between users; Pinia handles this per request) \u00b7 `useId()` instead of random ids (random values break hydration) \u00b7 keep server and client output identical, or you get **hydration mismatch** warnings.\n**Nuxt** (the Vue meta-framework): file-based routing (`pages/`), auto-imports, `useFetch`/`useAsyncData` (SSR-aware data fetching), server routes (`server/api`), layouts, modules, rendering modes per route (SSR, SSG, SPA, ISR). Choose Nuxt for public, SEO-heavy sites; an internal tool like Seller Chat is fine as a plain SPA.\n\n---\n\n## 68.11 What changed across Vue 3.x (know your version) \ud83d\udfe1\n| Version | Notable additions |\n|---|---|\n| 3.0 | Composition API, Proxy reactivity, Teleport, Suspense, fragments, `emits` option |\n| 3.2 | `<script setup>`, `v-bind` in CSS, `useAttrs/useSlots`, `shallowRef` improvements |\n| 3.3 | `defineOptions`, `defineSlots`, generic components, typed emits syntax, `toValue`, `toRef(getter)`, `defineModel` (experimental) |\n| 3.4 | `defineModel` **stable**, faster parser/reactivity, `watch` `once`, hydration-mismatch details, v-bind same-name shorthand `:id` |\n| 3.5 | **reactive props destructure**, `useTemplateRef`, `useId`, `onWatcherCleanup`, `watch` `deep: number`, lazy hydration, `defer` on Teleport, big reactivity memory/perf improvements |\nVue 2 reached end of life on 31 Dec 2023; legacy projects migrate with `@vue/compat` (Module 58).\n\n---\n\n## 68.12 Interview questions for this module\n**Q1. How does `<Transition>` work internally?** it adds/removes `*-enter/leave-*` classes at the right frames and waits for `transitionend`/`animationend` before removing the leaving element. **Q2. `TransitionGroup` vs `Transition`?** lists vs single element; needs keys; supports `*-move`. **Q3. What are fallthrough attributes and `inheritAttrs`?** **Q4. Why doesn't a multi-root component inherit attrs?** Vue can't know which root. **Q5. `defineModel` vs props + emit?** **Q6. What does `defineExpose` do and why is it needed?** **Q7. When use `shallowRef`/`markRaw`/`customRef`?** **Q8. `flush: 'pre' | 'post' | 'sync'`?** **Q9. Why might `watchEffect` miss a dependency?** reads after `await` aren't tracked. **Q10. How do you write a Vue plugin and when?** **Q11. Why avoid `globalProperties`?** **Q12. Order of navigation guards?** (see 68.7). **Q13. How do you add routes dynamically for roles?** `router.addRoute` + re-navigate. **Q14. `$subscribe` vs `$onAction`?** state change vs action call. **Q15. What is hydration and what causes a mismatch?** **Q16. Which Vue 3.5 features have you used?** (reactive props destructure, `useTemplateRef`, `useId`).\n**Exercises:** build a `TransitionGroup` toast stack \u00b7 a `BaseInput` that forwards attrs correctly and passes axe \u00b7 a `debouncedRef` with tests (fake timers) \u00b7 a plugin that provides `useToast()` \u00b7 a router with `addRoute` for ADMIN only \u00b7 a Pinia plugin that logs action timings \u00b7 port one component to use `defineModel` with a `.trim` modifier.\n\n## \u25b6 VUE STEP 68: Seller Chat polish checklist\n\u2610 animated bubbles + modal fade (reduced-motion safe) \u00b7 \u2610 `BaseInput` forwards attrs and uses `useId` \u00b7 \u2610 typed props/emits, `defineExpose({ focus })` on the composer \u00b7 \u2610 toast plugin \u00b7 \u2610 router leave-guard for drafts, chunk-error reload \u00b7 \u2610 Pinia action-error plugin \u00b7 \u2610 `shallowRef` for long histories \u00b7 \u2610 `markRaw` for chart instances.\n\n---\n**Next \u2192 Part 7: professional engineering (Modules 44\u201348).**\n\n\n# PART 7 \u2014 PROFESSIONAL FRONTEND ENGINEERING\n\n---\n\n# MODULE 44 \u2014 FRONTEND PROJECT ARCHITECTURE \ud83c\udfed\n\n## 44.1 Why architecture matters \ud83d\udfe1\nA 3-file demo works with any structure. A company app has **50+ screens, 10+ developers, years of change**. Architecture = the rules that answer \"where does this code go?\" so nobody has to guess and nobody breaks someone else's feature.\n**Analogy:** a kitchen in a restaurant. Prep, grill and dishwashing stations are separate and ingredients move along a known path. Without stations, every cook does everything everywhere and the ki
