add to the end; accepts several nodes/strings\nlist.prepend(li)                  // to the start\nref.before(li)    ref.after(li)   // siblings\nref.replaceWith(newEl)\nli.remove()                       // remove itself\nlist.replaceChildren(...items)    // clear and set children in ONE step (great for re-rendering a list)\nconst copy = li.cloneNode(true)   // deep clone\nlist.insertAdjacentHTML('beforeend', '<li>\u2026<\/li>')   // faster than innerHTML +=, still HTML-parsing (trusted markup only)\n```\nAppending an element that's already on the page **moves** it. **Batching for performance:** each insertion into the live page can trigger layout. Build many elements first, add them once:\n```js\nconst frag = document.createDocumentFragment()\nmessages.forEach(m => { const p = document.createElement('p'); p.textContent = m.text; frag.append(p) })\nbox.append(frag)                  // one insertion \u2192 one layout\n```\nAvoid `innerHTML += html` in a loop: it re-parses everything and **destroys existing children and their event listeners**.\n\n## 26.6 Traversal \ud83d\udfe1\n```js\nel.parentElement    el.children    el.firstElementChild    el.lastElementChild\nel.nextElementSibling    el.previousElementSibling\n```\nThe \"Element\" variants skip text nodes (whitespace). `parentNode`, `childNodes`, `nextSibling` include them.\n\n## 26.7 Worked example: render the chat list from data \ud83d\udfe2\n```html\n<input id=\"q\" placeholder=\"Search chats\" />\n<ul id=\"chats\"><\/ul>\n<p id=\"empty\" hidden>No chats found<\/p>\n<script type=\"module\">\n  const chats = [\n    { id: 1, name: 'Ravi',  last: 'Is the red sneaker available?', unread: 2 },\n    { id: 2, name: 'Asha',  last: 'Thanks, received!',             unread: 0 },\n    { id: 3, name: 'Meena', last: 'Please send the price',         unread: 1 },\n  ]\n  const ul = document.getElementById('chats')\n  const empty = document.getElementById('empty')\n\n  function render(items) {\n    ul.replaceChildren(...items.map(c => {\n      const li = document.createElement('li')\n      li.dataset.id = c.id\n      li.classList.toggle('chat-item--unread', c.unread > 0)\n      const strong = Object.assign(document.createElement('strong'), { textContent: c.name })\n      const span = Object.assign(document.createElement('span'), { textContent: ' ' + c.last })\n      li.append(strong, span)\n      return li\n    }))\n    empty.hidden = items.length > 0\n  }\n  render(chats)\n\n  document.getElementById('q').addEventListener('input', e => {\n    const q = e.target.value.trim().toLowerCase()\n    render(chats.filter(c => c.name.toLowerCase().includes(q) || c.last.toLowerCase().includes(q)))\n  })\n<\/script>\n```\n**Line by line.** `render(items)` is a function from **data \u2192 DOM**: it rebuilds the list from an array each time. `map` turns every chat object into an `<li>`; `textContent` keeps it XSS-safe; `replaceChildren(...)` swaps all children in one go; `hidden` shows the empty state when no items match. The `input` listener filters the **data** (not the DOM) and calls `render` again.\n**Output:** typing \"me\" shows only Meena; typing \"zzz\" shows \"No chats found\"; clearing the box shows all three.\n**This manual \"state \u2192 DOM\" synchronisation is exactly what Vue automates.** In Vue you only change `chats`/`q`; Vue updates the list.\n\n## 26.8 Common mistakes (Module 26)\n| Mistake | Fix |\n|---|---|\n| querying before the DOM exists | `defer` / `type=\"module\"` |\n| `innerHTML` with user data | `textContent` |\n| no null check | guard or optional chaining |\n| `innerHTML +=` in loops | build once, `replaceChildren` |\n| treating NodeList as array | `Array.from` |\n| changing styles one property at a time in a loop | toggle a class |\n| mixing attribute and property for `value`/`checked` | use properties |\n\n## 26.9 Interview questions (Module 26)\n**Q1. `textContent` vs `innerText` vs `innerHTML`?** (table). **Q2. `querySelector` vs `getElementById`?** any CSS selector (first match) vs id only (fastest). **Q3. What is a DocumentFragment?** an off-page container to batch insertions. **Q4. Live vs static collections?** live ones update automatically when the DOM changes; `querySelectorAll` returns a snapshot. **Q5. What causes reflow and how do you minimise it?** DOM changes/geometry reads; batch writes, use fragments/classes, separate reads from writes. **Q6. Why is DOM manipulation \"slow\"?** each change can trigger style/layout/paint, and the DOM is a large object graph.\n\n## 26.10 Exercises (Module 26)\n1. Todo list with pure DOM: add, remove, toggle done. 2. Live character counter on a textarea. 3. Accordion built with classes. 4. A table sorter that re-renders rows from a data array. 5. Render nested comments recursively.\n\n## 26.11 Revision notes\nDOM = live tree \u00b7 `querySelector` + null checks \u00b7 `textContent` for user data \u00b7 create \u2192 fill \u2192 append (batch) \u00b7 toggle classes not styles \u00b7 attribute (initial) vs property (live) \u00b7 render functions turn data into DOM.\n\n## \u25b6 BUILD STEP 26 \u2014 render real chat data into the page\nIn `app.js` (the file linked from Part 1) replace hard-coded chat rows by data:\n```js\nimport { chats } from './data.js'               // the array from Code Step 12 (export it)\nconst list = document.querySelector('.chat-list')\n\nfunction chatRow(c) {\n  const li = document.createElement('li')\n  li.dataset.id = c.id\n  li.classList.toggle('chat-item--unread', c.unread > 0)\n  const name = Object.assign(document.createElement('strong'), { textContent: c.buyerName })\n  const preview = Object.assign(document.createElement('span'), { textContent: c.lastMessage })\n  const time = Object.assign(document.createElement('time'), { textContent: formatTime(c.lastMessageAt), dateTime: c.lastMessageAt })\n  li.append(name, preview, time)\n  if (c.unread) li.append(Object.assign(document.createElement('b'), { textContent: c.unread }))\n  return li\n}\nconst renderChats = items => list.replaceChildren(...items.map(chatRow))\nrenderChats(chats)\n```\n\n---\n\n# MODULE 27 \u2014 BROWSER EVENTS\n\n## 27.1 What are events? \ud83d\udfe2\nAn **event** is a signal that something happened: a click, a key press, a form submit, a page load, a timer. You register a **listener** (a callback function); the browser calls it with an **event object** describing what happened.\n**Analogy:** a doorbell. You don't stand at the door waiting (polling); you register what to do **when** someone rings.\n```js\nconst btn = document.querySelector('#send')\nfunction onSend(event) { console.log('clicked', event.type, event.target) }\nbtn.addEventListener('click', onSend)         // \u2705 preferred way\nbtn.removeEventListener('click', onSend)      // needs the SAME function reference (no anonymous functions)\nbtn.addEventListener('click', onSend, { once: true })    // run one time then auto-remove\n// legacy: btn.onclick = fn (only one handler) and inline onclick=\"\u2026\" (avoid)\n```\nPass the function (`onSend`), **don't call it** (`onSend()`).\n**Common events**\n| Group | Events |\n|---|---|\n| Mouse | `click` `dblclick` `mousedown` `mouseup` `mousemove` `mouseenter` `mouseleave` `contextmenu` |\n| Keyboard | `keydown` `keyup` (use `event.key`, `event.code`, `event.shiftKey`, `ctrlKey`) |\n| Forms | `input` (every change), `change` (on commit/blur), `submit`, `reset`, `focus`, `blur`, `focusin`, `focusout` |\n| Page/window | `DOMContentLoaded` `load` `beforeunload` `visibilitychange` `resize` `scroll` |\n| Pointer/touch | `pointerdown` `pointerup` `pointermove` `touchstart` |\n| Drag & drop | `dragstart` `dragover` `drop` |\n**The event object:** `type`, `target` (element where it happened), `currentTarget` (element the listener is attached to), `preventDefault()`, `stopPropagation()`, `timeStamp`, plus event-specific data (`key`, `clientX/Y`, `dataTransfer`).\n**`input` vs `change`:** `input` fires on each keystroke (search-as-you-type); `change` fires when the value is committed (blur for text; immediately for checkbox/select).\n**Keyboard shortcut:**\n```js\ntextarea.addEventListener('keydown', e => {\n  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }     // Enter sends, Shift+Enter = new line\n})\n```\n\n## 27.2 Propagation: capturing, target, bubbling \ud83d\udfe1\nWhen you click a button, the event travels through the tree in three phases:\n```\n1. CAPTURING   document \u2192 html \u2192 body \u2192 div#outer \u2192 button#inner        (top \u2192 down; rarely used)\n2. TARGET      button#inner\n3. BUBBLING    button#inner \u2192 div#outer \u2192 body \u2192 html \u2192 document        (bottom \u2192 up; the default for listeners)\n```\n```html\n<div id=\"outer\"><button id=\"inner\">Click<\/button><\/div>\n```\n```js\nouter.addEventListener('click', () => console.log('outer'))\ninner.addEventListener('click', () => console.log('inner'))\n// click the button \u2192 \"inner\" then \"outer\"   (bubbling)\nouter.addEventListener('click', () => console.log('outer (capture)'), true)   // capture: runs FIRST\n```\n- `stopPropagation()` stops the event going further (use sparingly: it breaks analytics and delegation).\n- `preventDefault()` cancels the browser's **default action** (form submit, link navigation) but does **not** stop propagation. They're independent.\n- Some events don't bubble (`focus`, `blur`, `mouseenter`); use `focusin`, `focusout`, `mouseover` when you need delegation.\n\n## 27.3 Event delegation \ud83d\udfe1 (an important pattern)\nInstead of attaching one listener to each of 1,000 rows, attach **one** to the parent and work out which child was clicked with `event.target`:\n```js\ndocument.getElementById('chats').addEventListener('click', e => {\n  const li = e.target.closest('li[data-id]')               // which row? (works even if you clicked an inner <strong>)\n  if (!li || !e.currentTarget.contains(li)) return\n  openChat(Number(li.dataset.id))                          // data-id is a string \u2192 convert\n})\n```\n**Benefits:** far fewer listeners (memory), works for rows **added later** (dynamic lists, infinite scroll), simpler cleanup. **Requires** the event to bubble. `closest()` handles clicks on child elements.\n\n## 27.4 Custom events \ud83d\udd34\n```js\nel.dispatchEvent(new CustomEvent('chat:selected', { detail: { id: 5 }, bubbles: true }))\ndocument.addEventListener('chat:selected', e => console.log(e.detail.id))   // \u2192 5\n```\nUsed to decouple pieces in vanilla JS. In Vue, component **`emit`** plays this role (Module 35).\n\n## 27.5 Worked example: an interactive message composer \ud83d\udfe2\n```html\n<form id=\"composer\">\n  <textarea id=\"msg\" rows=\"1\" maxlength=\"500\" aria-label=\"Message\"><\/textarea>\n  <span id=\"count\">0/500<\/span>\n  <button id=\"send\" disabled>Send<\/button>\n<\/form>\n<div id=\"log\" role=\"log\"><\/div>\n<script type=\"module\">\n  const form = document.getElementById('composer')\n  const msg = document.getElementById('msg')\n  const send = document.getElementById('send')\n  const count = document.getElementById('count')\n  const log = document.getElementById('log')\n\n  msg.addEventListener('input', () => {\n    count.textContent = `${msg.value.length}/500`\n    send.disabled = msg.value.trim() === ''             // enable only when there is real text\n  })\n  form.addEventListener('submit', e => {\n    e.preventDefault()                                  // stop the page reload\n    const p = document.createElement('p')\n    p.textContent = msg.value.trim()\n    log.append(p)\n    form.reset(); send.disabled = true; count.textContent = '0/500'; msg.focus()\n  })\n  msg.addEventListener('keydown', e => {\n    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit() }\n  })\n<\/script>\n```\n**Flow of the code:** an **event** (typing) \u2192 a **handler** \u2192 update **state/DOM** (counter, disabled button). Use `form.requestSubmit()` (runs validation and fires the `submit` event); `form.submit()` skips both.\n\n## 27.6 Cleanup and memory \ud83d\udfe1\nRemove listeners on things that outlive the page lifecycle (`window`, `document`, long-lived timers). `{ signal }` lets one `AbortController.abort()` remove many listeners at once:\n```js\nconst ac = new AbortController()\nwindow.addEventListener('resize', onResize, { signal: ac.signal })\nwindow.addEventListener('keydown', onKey, { signal: ac.signal })\nac.abort()        // removes both\n```\nIn Vue you do this in `onUnmounted` (Module 36).\n\n## 27.7 Common mistakes (Module 27)\n| Mistake | Fix |\n|---|---|\n| `addEventListener('click', fn())` | pass `fn`, not `fn()` |\n| anonymous function then trying to remove it | keep a named reference |\n| `stopPropagation` everywhere | use sparingly |\n| listeners added to many nodes in a loop | delegation |\n| forgetting `preventDefault` on submit | add it |\n| confusing `target` and `currentTarget` | target = origin, currentTarget = listener owner |\n| global listeners never removed | cleanup |\n\n## 27.8 Interview questions (Module 27)\n**Q1. Capturing vs bubbling?** **Q2. What is event delegation and why use it?** **Q3. `preventDefault` vs `stopPropagation`?** **Q4. `target` vs `currentTarget`?** **Q5. `input` vs `change`?** **Q6. How do you add a listener that fires once?** `{ once: true }`. **Q7. What does `passive: true` do?** promises you won't call `preventDefault`, letting the browser scroll smoothly. **Q8. A click handler on dynamically added buttons does nothing. Why?** listeners were attached only to elements that existed at the time; use delegation.\n\n## 27.9 Exercises (Module 27)\nDelegated todo list \u00b7 Ctrl+K command-palette shortcut \u00b7 drag-to-reorder list \u00b7 tiny event bus with `CustomEvent` \u00b7 debounced `resize` handler.\n\n## 27.10 Revision notes\nListener = callback \u00b7 pass the function \u00b7 `input` for live typing \u00b7 three phases, bubbling by default \u00b7 delegation with `closest` \u00b7 `preventDefault` \u2260 `stopPropagation` \u00b7 clean up global listeners.\n\n## \u25b6 BUILD STEP 27 \u2014 make the page interactive\nAdd to `app.js`:\n```js\nlet activeId = chats[0].id\nconst messagesByChat = { 1: [{ id: 10, sender: 'BUYER', text: 'Is the red sneaker available?' }], 2: [], 3: [] }\nconst box = document.querySelector('.messages')\n\nfunction bubble(m) {\n  const art = document.createElement('article')\n  art.className = `msg ${m.sender === 'SELLER' ? 'msg--mine' : 'msg--theirs'}`\n  art.append(Object.assign(document.createElement('p'), { textContent: m.text }))\n  return art\n}\nfunction renderMessages() {\n  box.replaceChildren(...(messagesByChat[activeId] ?? []).map(bubble))\n  box.scrollTop = box.scrollHeight\n}\nlist.addEventListener('click', e => {                               // delegation: one listener for all rows\n  const li = e.target.closest('li[data-id]'); if (!li) return\n  activeId = Number(li.dataset.id)\n  document.getElementById('room-title').textContent = chats.find(c => c.id === activeId).buyerName\n  renderMessages()\n})\ndocument.getElementById('composer').addEventListener('submit', e => {\n  e.preventDefault()\n  const input = document.getElementById('msg'); const text = input.value.trim(); if (!text) return\n  ;(messagesByChat[activeId] ??= []).push({ id: Date.now(), sender: 'SELLER', text })\n  input.value = ''; renderMessages()\n})\nrenderMessages()\n```\nResult: clicking a chat switches the room, sending adds a bubble, and the list scrolls to the bottom. The page now behaves like an app with **no framework**.\n\n---\n\n# MODULE 28 \u2014 BROWSER WEB APIs\n\n## 28.0 Overview\nBrowsers expose many built-in capabilities (\"Web APIs\"). You don't install them; they're on `window`.\n| API | What it does | Typical use |\n|---|---|---|\n| **fetch** | HTTP requests (Module 29) | call Spring Boot |\n| **XMLHttpRequest** | older HTTP API | legacy code, upload progress |\n| **FormData** | collect form fields/files | submit forms, uploads |\n| **URL / URLSearchParams** | build and parse URLs | query strings |\n| **localStorage / sessionStorage** | key-value storage (strings) | theme, drafts |\n| **Cookies** | small data sent with every request | sessions, preferences |\n| **IndexedDB** | large structured storage | offline data |\n| **History API** | change URL without reload | SPA routing |\n| **Clipboard** | copy text | \"copy order id\" |\n| **Geolocation** | user position (permission) | delivery |\n| **File API / Drag & Drop** | read local files / drop zones | uploads, previews |\n| **WebSocket** | two-way realtime connection | chat |\n| **Server-Sent Events** | server \u2192 client stream | notifications |\n| **Web Workers** | background threads | heavy computation |\n| **Service Workers** | offline caching, push | PWAs |\n| **Notifications** | OS notifications | new message alerts |\n| **IntersectionObserver** | tell me when an element is visible | lazy loading, infinite scroll |\n\n## 28.1 URL and URLSearchParams \ud83d\udfe2\n```js\nconst url = new URL('https://api.shop.com/orders?status=PAID&page=2')\nurl.searchParams.get('status')        // \u2192 'PAID'\nurl.searchParams.set('page', '3')\nurl.searchParams.append('sort', 'createdAt,desc')\nurl.toString()                        // \u2192 'https://api.shop.com/orders?status=PAID&page=3&sort=createdAt%2Cdesc'\n\nconst params = new URLSearchParams({ q: 'red shoes & socks', page: 1 })\n`/api/products?${params}`             // \u2192 '/api/products?q=red+shoes+%26+socks&page=1'   (encoding handled for you)\n```\nNever build query strings by string concatenation: spaces, `&` or accented characters break the URL.\n\n## 28.2 Storage and cookies \ud83d\udfe2\n```js\nlocalStorage.setItem('theme', 'dark')            // persists after the browser closes; ~5 MB; strings only; per origin\nlocalStorage.getItem('theme')                    // \u2192 'dark' (or null)\nlocalStorage.removeItem('theme');  localStorage.clear()\nlocalStorage.setItem('draft', JSON.stringify({ text: 'hi' }))                // store objects as JSON text\nconst draft = JSON.parse(localStorage.getItem('draft') ?? 'null')\nsessionStorage                                    // same API, cleared when the tab closes\ndocument.cookie = 'lang=en; max-age=31536000; path=/; SameSite=Lax'\n```\n- Storage is **synchronous** (blocks briefly) and readable by **any JavaScript on the page**. Don't store tokens/PII there if XSS is a risk: prefer **`HttpOnly` cookies set by Spring** (Module 45).\n- Always wrap in `try/catch` (private windows/blocked storage can throw). The `storage` event syncs other tabs.\n- Cookies are **sent with every request** to that site: keep them small.\n\n## 28.3 History API (how Vue Router works) \ud83d\udfe1\n```js\nhistory.pushState({ chatId: 5 }, '', '/chats/5')       // change the URL, no reload, adds a history entry\nhistory.replaceState(null, '', '/chats')               // replace the current entry\nwindow.addEventListener('popstate', () => render(location.pathname))   // back/forward buttons\n```\nVue Router intercepts link clicks, calls `pushState`, and swaps components. **The server must return `index.html` for unknown paths** (Spring forwards non-API routes to `index.html`; nginx `try_files`); otherwise refreshing `/chats/5` gives a 404.\n\n## 28.4 Clipboard, geolocation, files, drag & drop \ud83d\udfe1\n```js\nawait navigator.clipboard.writeText(orderId)        // needs HTTPS and a user gesture\n\nnavigator.geolocation.getCurrentPosition(\n  pos => console.log(pos.coords.latitude, pos.coords.longitude),\n  err => console.warn(err.message))\n\nfileInput.addEventListener('change', async () => {\n  const file = fileInput.files[0]                   // File { name, size, type }\n  if (file.size > 2 * 1024 * 1024) return showError('Max 2 MB')\n  img.src = URL.createObjectURL(file)               // instant preview; later URL.revokeObjectURL(img.src)\n})\n\ndropZone.addEventListener('dragover', e => e.preventDefault())          // REQUIRED to allow dropping\ndropZone.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files) })\n```\n**Upload:** `const fd = new FormData(); fd.append('file', file); await fetch('/api/upload', { method: 'POST', body: fd })` (don't set Content-Type; the browser adds the multipart boundary).\n\n## 28.5 WebSockets and Server-Sent Events \ud83d\udfe1 (real-time chat)\nHTTP is request/response: the client must ask. A **WebSocket** upgrades one connection into a persistent two-way channel, so the server can **push** messages.\n```js\nconst ws = new WebSocket('wss://chat.example.com/ws?chatId=5')    // wss = TLS\nws.onopen = () => ws.send(JSON.stringify({ type: 'join', chatId: 5 }))\nws.onmessage = e => addMessage(JSON.parse(e.data))\nws.onclose = () => scheduleReconnect()                            // implement reconnect with backoff\nws.onerror = console.error\nws.close()\n```\n**SSE:** one-way server\u2192client over plain HTTP, auto-reconnects: `const es = new EventSource('/api/notifications'); es.onmessage = e => \u2026`.\n| | Polling | SSE | WebSocket |\n|---|---|---|---|\n| Direction | client asks repeatedly | server \u2192 client | both |\n| Latency | high | low | lowest |\n| Complexity | simple | simple | highest |\n| Use | rare updates | notifications, feeds | chat, collaboration |\nSpring Boot: `spring-websocket`/STOMP or SSE (`SseEmitter`). Backend Kafka consumers often fan messages out to connected clients.\n\n## 28.6 Workers, notifications, observers \ud83d\udd34\n```js\n// worker.js\nself.onmessage = e => self.postMessage(heavyWork(e.data))\n// main\nconst w = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' })\nw.postMessage(bigArray); w.onmessage = e => render(e.data)      // workers have no DOM access\n```\n**Service worker:** `navigator.serviceWorker.register('/sw.js')` intercepts network requests for offline caching and push (a PWA); usually set up with `vite-plugin-pwa`.\n**Notifications:** `await Notification.requestPermission(); new Notification('New message', { body: 'Ravi: Is it available?' })`.\n```js\nconst io = new IntersectionObserver(entries => entries.forEach(e => e.isIntersecting && loadMore()), { rootMargin: '200px' })\nio.observe(sentinelElement)        // infinite scroll or lazy images without scroll listeners\n```\n\n## 28.7 Interview questions (Module 28)\n**Q1. localStorage vs sessionStorage vs cookies?** **Q2. How does a SPA change the URL without reloading?** History API. **Q3. WebSocket vs SSE vs polling?** **Q4. Why use URLSearchParams?** **Q5. Why use a Web Worker?** keep heavy work off the UI thread. **Q6. What does `dragover` + `preventDefault` do?** it's required to allow a drop. **Q7. Where should an auth token live?** (Module 45 trade-offs).\n\n## 28.8 Exercises (Module 28)\nPersist a theme choice \u00b7 copy-to-clipboard button \u00b7 avatar preview with `createObjectURL` \u00b7 WebSocket echo client with reconnect \u00b7 infinite scroll with `IntersectionObserver`.\n\n## \u25b6 BUILD STEP 28 \u2014 drafts and shareable state\n```js\nconst saveDraft = () => { try { localStorage.setItem(`draft:${activeId}`, document.getElementById('msg').value) } catch {} }\ndocument.getElementById('msg').addEventListener('input', saveDraft)\nconst loadDraft = () => { try { document.getElementById('msg').value = localStorage.getItem(`draft:${activeId}`) ?? '' } catch {} }\n// call loadDraft() inside the chat-switch handler; and keep the open chat in the URL:\nhistory.replaceState(null, '', `?chat=${activeId}`)\n```\nSwitching chats now restores each chat's unsent draft, and the URL records which chat is open.\n\n---\n\n# PART 5 \u2014 JAVASCRIPT AND REST API INTEGRATION\n\n# MODULE 29 \u2014 FETCH API AND HTTP REQUESTS\n\n## 29.1 What is fetch and how does it work? \ud83d\udfe2\n`fetch(url, options)` is the browser's built-in way to make an HTTP request. It returns a **Promise** that resolves to a `Response` object once the response **headers** arrive.\n**Remember:** `fetch` rejects only when the request **couldn't be made** (offline, DNS failure, CORS blocked, aborted). A **404 or 500 still resolves**: you must check `response.ok`.\n```\nJavaScript            Browser                          Server (Spring Boot)\nfetch(url) \u2500\u2500\u2500\u2500\u2500\u25ba  builds request \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba  Controller\n                   (adds headers/cookies)               \u25c4\u2500\u2500 response (status, headers, body)\nawait \u2026    \u25c4\u2500\u2500\u2500\u2500\u2500  Response {status, ok, headers, body stream}\nawait res.json()   reads & parses the body (ONCE)\n```\nReading the body: `.json()`, `.text()`, `.blob()`, `.formData()`. It can be read **only once** (use `res.clone()` to read twice).\n**HTTP methods \u2194 intent:** GET read \u00b7 POST create \u00b7 PUT replace \u00b7 PATCH partial update \u00b7 DELETE remove.\n**Status groups:** 2xx success (200 OK, 201 Created, 204 No Content) \u00b7 3xx redirect \u00b7 4xx client error (400 bad request, 401 unauthenticated, 403 forbidden, 404 not found, 409 conflict, 422 validation, 429 too many requests) \u00b7 5xx server error.\n\n## 29.2 CRUD against JSONPlaceholder \ud83d\udfe2\nJSONPlaceholder (https://jsonplaceholder.typicode.com) is a free fake REST API for practice. Writes are *simulated* (returned but not stored).\n```js\nconst BASE = 'https://jsonplaceholder.typicode.com'\nconst json = async (url, options) => {\n  const res = await fetch(url, options)\n  if (!res.ok) throw new Error(`HTTP ${res.status}`)\n  return res.json()\n}\n\n// READ\nconst posts   = await json(`${BASE}/posts`)                       // 100 posts\nconst post    = await json(`${BASE}/posts/1`)                     // \u2192 { userId: 1, id: 1, title: '\u2026', body: '\u2026' }\nconst mine    = await json(`${BASE}/posts?userId=1`)              // filter\nconst page2   = await json(`${BASE}/posts?_page=2&_limit=10`)     // pagination\nconst users   = await json(`${BASE}/users`)\nconst matches = await json(`${BASE}/posts?q=eum`)                 // full-text search\nconst comments= await json(`${BASE}/posts/1/comments`)            // nested resource\n\n// CREATE (POST)\nconst created = await json(`${BASE}/posts`, {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ title: 'Hello', body: 'World', userId: 1 }),\n})                                                                 // \u2192 { title: 'Hello', body: 'World', userId: 1, id: 101 }\n\n// UPDATE\nawait json(`${BASE}/posts/1`, { method: 'PUT',   headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: 1, title: 'New', body: 'B', userId: 1 }) })   // replace whole resource\nawait json(`${BASE}/posts/1`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title: 'Only title' }) })                    // change fields sent\n// DELETE\nawait fetch(`${BASE}/posts/1`, { method: 'DELETE' })              // 200 and {}\n```\n**Line by line (POST):** `method` sets the verb; `headers['Content-Type']` tells the server the body is JSON (Spring needs it for `@RequestBody`); `body` **must be a string**, so `JSON.stringify`; the response is parsed with `res.json()`. The helper `json()` checks `res.ok` and throws on HTTP errors so callers can use `try/catch`.\n\n## 29.3 A robust request function \ud83d\udfe1\n```js\nclass ApiError extends Error {\n  constructor(message, status, body) { super(message); this.name = 'ApiError'; this.status = status; this.body = body }\n}\n\nasync function request(path, { method = 'GET', body, headers = {}, signal, timeout = 10000 } = {}) {\n  const controller = new AbortController()\n  const timer = setTimeout(() => controller.abort(), timeout)\n  signal?.addEventListener('abort', () => controller.abort())      // also respect external cancellation\n  try {\n    const res = await fetch(`${BASE}${path}`, {\n      method,\n      headers: { Accept: 'application/json', ...(body ? { 'Content-Type': 'application/json' } : {}), ...headers },\n      body: body ? JSON.stringify(body) : undefined,\n      signal: controller.signal,\n    })\n    const isJson = res.headers.get('content-type')?.includes('application/json')\n    const data = res.status === 204 ? null : isJson ? await res.json() : await res.text()\n    if (!res.ok) throw new ApiError(data?.message ?? `HTTP ${res.status}`, res.status, data)    // HTTP errors\n    return data\n  } catch (e) {\n    if (e.name === 'AbortError') throw new ApiError('Request timed out or was cancelled', 0)\n    if (e instanceof ApiError) throw e\n    throw new ApiError('Network error. Check your connection.', 0)                                // fetch rejected\n  } finally {\n    clearTimeout(timer)\n  }\n}\n```\n**Why:** one place handles JSON, headers, status errors, timeouts and network errors, so every caller just does `await request('/posts')`.\n**Retry with backoff** (idempotent GETs only):\n```js\nasync function withRetry(fn, retries = 3, delay = 500) {\n  for (let i = 0; ; i++) {\n    try { return await fn() }\n    catch (e) {\n      const retriable = e.status === 0 || e.status >= 500\n      if (i >= retries || !retriable) throw e\n      await new Promise(r => setTimeout(r, delay * 2 ** i))        // waits 500, 1000, 2000 ms\n    }\n  }\n}\n```\nNever blindly retry a POST (you could create duplicates); use idempotency keys.\n\n## 29.4 Error categories and how to show them\n| Kind | Example | What the UI does |\n|---|---|---|\n| Network | offline, DNS, CORS-blocked | \"Can't reach the server\" + retry |\n| 400/422 | validation | show messages next to fields |\n| 401 | token missing/expired | clear session, go to login |\n| 403 | not allowed | \"You don't have permission\" |\n| 404 | not found | empty/not-found state |\n| 409 | conflict (duplicate) | explain the conflict |\n| 429 | rate limited | \"Slow down\", retry later |\n| 5xx | server bug/outage | generic message + retry + report |\n| Aborted | user navigated away | ignore silently |\nA Spring validation error typically arrives as `{ \"status\": 400, \"errors\": [{ \"field\": \"email\", \"message\": \"must be a well-formed email address\" }] }` \u2192 convert to `{ email: '\u2026' }` and show it under the right input.\n\n## 29.5 The four UI states \ud83d\udfe1\nEvery data-driven view has **four** states. Missing one is a classic junior bug.\n```js\nconst state = { status: 'idle', data: [], error: null }      // idle | loading | success | error\nasync function load() {\n  state.status = 'loading'; render()\n  try { state.data = await request('/posts?_limit=10'); state.status = 'success' }\n  catch (e) { state.error = e.message; state.status = 'error' }\n  render()\n}\nfunction render() {\n  if (state.status === 'loading') ui.textContent = 'Loading\u2026'               // spinner/skeleton\n  else if (state.status === 'error') showError(state.error)                 // message + [Retry]\n  else if (state.data.length === 0) ui.textContent = 'No posts yet'         // EMPTY state\n  else renderList(state.data)\n}\n```\nAlso: disable buttons while a request is running (prevent double submit), optimistic updates with rollback, cancel stale requests.\n\n## 29.6 Common mistakes (Module 29)\nNot checking `res.ok` \u00b7 missing `JSON.stringify` / `Content-Type` \u00b7 reading the body twice \u00b7 swallowing errors \u00b7 showing raw error objects to users \u00b7 sequential awaits for independent calls \u00b7 no loading/disabled state \u00b7 retrying non-idempotent requests \u00b7 hard-coded URLs.\n\n## 29.7 Interview questions (Module 29)\n**Q1. Does fetch reject on 500?** no. **Q2. PUT vs PATCH?** **Q3. How do you send JSON / files / form data?** **Q4. How to cancel or time out?** AbortController. **Q5. How do you handle 401?** clear session and redirect (interceptor). **Q6. Fetch vs Axios?** Axios: auto JSON, interceptors, throws on non-2xx, timeouts, upload progress; fetch: native, no dependency.\n\n## 29.8 Exercises (Module 29)\nPosts viewer with pagination \u00b7 user search using `?q=` with debounce + abort \u00b7 create/edit/delete posts with loading/error states \u00b7 a retry button \u00b7 compare sequential and `Promise.all` timing.\n\n## \u25b6 BUILD STEP 29 \u2014 load chats from the (mock \u2192 real) API\n```js\n// services/http.js is the `request` function above, using import.meta.env.VITE_API_BASE_URL\n// services/chatApi.js\nimport { request } from './http.js'\nexport const chatApi = {\n  list: params => request(`/chats?${new URLSearchParams(params)}`),\n  messages: id => request(`/chats/${id}/messages`),\n  send: (id, text) => request(`/chats/${id}/messages`, { method: 'POST', body: { text } }),\n}\n// app.js\nasync function loadChats() {\n  setListState('loading')\n  try { const page = await chatApi.list({ q: '', status: 'all' }); renderChats(page.content); setListState(page.content.length ? 'success' : 'empty') }\n  catch (e) { setListState('error', e.message) }\n}\n```\nStart with the mock `fakeApi` from Code Step 22 behind the same method names; when Spring Boot is ready only the import changes.\n\n---\n\n# MODULE 30 \u2014 API INTEGRATION ARCHITECTURE\n\n## 30.1 The complete frontend \u2194 backend lifecycle \ud83d\udfe1\n```\nUSER clicks \"Send\"\n  \u2192 Event handler (component)                  onSend()\n  \u2192 Frontend function / store action           chatStore.sendMessage(text)\n  \u2192 API service function                       chatApi.send(chatId, text)\n  \u2192 HTTP request (fetch/axios)                 POST /api/chats/5/messages  + Authorization header\n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 network: TLS, CORS preflight \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  \u2192 Spring Controller      @PostMapping  (JSON \u2192 DTO, @Valid)\n  \u2192 Service                business rules, authorisation\n  \u2192 Repository             JPA / Mongo / Firestore\n  \u2192 Database               INSERT      (+ Kafka event, + Redis cache update)\n  \u2190 Response               201 Created + JSON body\n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 network \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  \u2192 Response handling      parse JSON, normalise errors\n  \u2192 State update           messages.push(saved)\n  \u2192 UI re-render           bubble appears\n```\n**Debug by layer:** Did the handler fire (breakpoint)? Was the request sent (Network)? Status and response body? Backend logs? Is the response shape what the UI expects? Was state updated (Vue DevTools)? Rendered?\n**Spring counterpart**\n```java\n@RestController @RequestMapping(\"/api/chats/{chatId}/messages\")\npublic class MessageController {\n  private final MessageService service;\n  @PostMapping\n  public ResponseEntity<MessageDto> send(@PathVariable Long chatId,\n                                         @Valid @RequestBody SendMessageRequest req,\n                                         @AuthenticationPrincipal SellerPrincipal seller) {\n    MessageDto saved = service.send(chatId, seller.id(), req.text());\n    return ResponseEntity.status(HttpStatus.CREATED).body(saved);\n  }\n}\npublic record SendMessageRequest(@NotBlank @Size(max = 500) String text) {}\n```\nThe JSON `{ \"text\": \"hello\" }` maps to the record field `text`; a mismatched key (`message`) arrives as `null` and fails validation with a 400.\n\n## 30.2 A clean API service layer \ud83d\udfe1\n**Principle:** components never call `fetch` directly or hard-code URLs. One HTTP client + one module per resource.\n```\nsrc/services/\n  http.js          \u2190 base URL, headers, auth token, error normalisation (the ONE fetch/axios wrapper)\n  chatApi.js       \u2190 one function per endpoint\n  authApi.js\n  mock/\u2026           \u2190 same interface, fake data\n```\n```js\n// services/http.js\nconst BASE_URL = import.meta.env.VITE_API_BASE_URL ?? '/api'\nexport class HttpError extends Error { constructor(m, status, body) { super(m); this.status = status; this.body = body } }\n\nlet getToken = () => null;           export const setTokenProvider = fn => { getToken = fn }\nlet onUnauthorized = () => {};       export const setUnauthorizedHandler = fn => { onUnauthorized = fn }\n\nexport async function http(path, { method = 'GET', params, body, signal } = {}) {\n  const url = new URL(BASE_URL + path, window.location.origin)\n  if (params) Object.entries(params).forEach(([k, v]) => v != null && v !== '' && url.searchParams.set(k, v))\n  const token = getToken()\n  const res = await fetch(url, {                                      // \"request interceptor\": auth header added centrally\n    method, signal,\n    headers: { Accept: 'application/json', ...(body && { 'Content-Type': 'application/json' }), ...(token && { Authorization: `Bearer ${token}` }) },\n    body: body && JSON.stringify(body),\n  })\n  const data = res.status === 204 ? null : await res.json().catch(() => null)\n  if (res.status === 401) onUnauthorized()                            // \"response interceptor\": global 401 handling\n  if (!res.ok) throw new HttpError(data?.message ?? res.statusText, res.status, data)\n  return data\n}\n\n// services/chatApi.js\nexport const chatApi = {\n  list:        (params, signal) => http('/chats', { params, signal }),                  // GET  /api/chats?q=&status=&page=\n  get:         id => http(`/chats/${id}`),\n  messages:    (id, { before, limit = 30 } = {}) => http(`/chats/${id}/messages`, { params: { before, limit } }),\n  send:        (id, text) => http(`/chats/${id}/messages`, { method: 'POST', body: { text } }),\n  attachOrder: (id, orderId) => http(`/chats/${id}/orders`, { method: 'POST', body: { orderId } }),\n}\n```\n**With Axios** the same design is: `axios.create({ baseURL })`, `instance.interceptors.request.use(cfg => { cfg.headers.Authorization = \u2026; return cfg })`, `instance.interceptors.response.use(r => r.data, err => { if (err.response?.status === 401) logout(); throw err })`. **Interceptors** are hooks run on every request/response: the right place for auth, logging, error normalisation.\n**Environment config:** `VITE_API_BASE_URL` per environment (`.env.development` \u2192 `http://localhost:8080/api`; production \u2192 `/api` behind a reverse proxy). **CORS** matters only when the frontend and API origins differ: Spring `@CrossOrigin`/`addCorsMappings` must allow the exact frontend origin (and `allowCredentials` for cookies).\n\n## 30.3 Authorization tokens \ud83d\udfe1\n- `POST /api/auth/login` \u2192 `{ accessToken, expiresIn, user }` (a JWT) **or** a `Set-Cookie` session.\n- Send `Authorization: Bearer <token>` on each request. Store the token in memory (safest from XSS, lost on refresh) or in an `HttpOnly; Secure; SameSite` cookie (JS can't read it; use `credentials: 'include'`; needs CSRF protection).\n- **401** = missing/expired \u2192 try a refresh token once, else go to login. **403** = logged in but not allowed \u2192 show a permission message.\n- Route guards (Module 39) protect pages, but **real authorisation is on the server**.\n\n## 30.4 Duplicate requests, pagination, search, debouncing \ud83d\udfe1\n- **Duplicates:** disable the button while pending; keep an `isSending` flag; cancel or ignore stale responses; share one in-flight promise for identical GETs; cache with a short TTL.\n- **Pagination:** *page/size* (`?page=2&size=20`; Spring `Pageable` returns `{ content, totalPages, number, totalElements }`) vs *cursor* (`?before=<id>&limit=30`; best for chat history and infinite scroll; stable when new items arrive).\n- **Search and filters:** send them as params (`?q=ravi&status=OPEN`), reset page to 0 when filters change, debounce typing, abort the previous request, show a \"no results\" state, keep filters in the URL (`router.query`) for shareable links.\n```js\nlet ctrl\nconst search = debounce(async q => {\n  ctrl?.abort(); ctrl = new AbortController()\n  try { render(await chatApi.list({ q }, ctrl.signal)) }\n  catch (e) { if (e.name !== 'AbortError') showError(e) }\n}, 350)\n```\nSpring: `@GetMapping public Page<ChatDto> list(@RequestParam(required = false) String q, Pageable pageable)`.\n\n## 30.5 Centralised error handling\nMap `HttpError` to UX once: 400/422 \u2192 field errors from `body.errors`; 401 \u2192 login; 403 \u2192 permission message; 404 \u2192 not-found/empty; 409 \u2192 conflict explanation; 429 \u2192 \"slow down\"; 5xx/network \u2192 toast \"Something went wrong. Retry.\" with a correlation id header for support. Log unexpected errors to monitoring. Avoid scattering identical `try/catch` blocks: use a shared `handleError(e)` helper or store-level handling.\n\n## 30.6 Interview questions (Module 30)\n**Q1. Walk me through click \u2192 UI update.** (30.1). **Q2. Why an API service layer?** one place for URL/auth/errors, testable, replaceable (mock \u2194 real). **Q3. How do you handle token expiry?** **Q4. Offset vs cursor pagination?** **Q5. How do you prevent double submit?** **Q6. What do interceptors do?** **Q7. Where should the base URL live?** environment variables.\n\n## 30.7 Exercises (Module 30)\nBuild `http.js` + `postApi.js` against JSONPlaceholder \u00b7 add a fake 401 and a global handler \u00b7 create a mock service with the same interface and switch with an env flag \u00b7 add cursor pagination for a messages list \u00b7 write a Spring controller for `GET /api/chats` and call it from your service.\n\n## \u25b6 BUILD STEP 30 \u2014 wire everything together\nFinal structure of the plain-JavaScript Seller Chat:\n```\nseller-chat/\n\u251c\u2500 index.html  login.html  styles.css\n\u251c\u2500 .env.development      VITE_API_BASE_URL=/api   VITE_USE_MOCK=true\n\u2514\u2500 src/\n   \u251c\u2500 main.js            starts the app: loadChats(), event listeners\n   \u251c\u2500 services/ http.js chatApi.js mock/fakeApi.js\n   \u251c\u2500 state.js           chats, messagesByChat, activeId, status\n   \u251c\u2500 render.js          chatRow(), bubble(), renderChats(), renderMessages()\n   \u2514\u2500 utils/ format.js debounce.js\n```\nChecklist: list loads with spinner/error/empty states \u00b7 search is debounced and cancels stale requests \u00b7 sending a message appends an optimistic bubble and marks it failed with Retry on error \u00b7 switching chats loads messages \u00b7 token added by `http()` \u00b7 401 sends you to `login.html`. This is the exact feature set you will rebuild with Vue (Part 6) and extend in Module 48.\n\n---\n**Next \u2192 Part 6: Vue.js (Modules 31\u201343).**\n\n\n# PART 6 \u2014 VUE.JS (Vue 3, Composition API first; Options API explained for legacy code)\n\nOfficial docs: https://vuejs.org/guide/introduction.html\n\n**Running project:** you rebuild the plain-JavaScript Seller Chat from Parts 4\u20135 as a Vue 3 app. Each module ends with a **VUE STEP** showing how that piece looks in Vue. Keep the plain-JS version open next to it: you will see Vue replace every `document.querySelector`, `createElement` and `render()` call with a few lines of declarative code.\n\n---\n\n# MODULE 31 \u2014 INTRODUCTION TO VUE.JS\n\n## 31.1 What is Vue and why use it? \ud83d\udfe2\n**Vue** is a JavaScript **framework for building user interfaces**. You describe **what the screen should look like for the current data**, and Vue keeps the DOM in sync automatically.\n**The problem.** In Module 26 you wrote `render()` and manually touched the DOM whenever data changed. Real apps have dozens of pieces of state (chat list, unread badge, selected chat, loading flags, drafts). Updating each affected DOM piece by hand leads to bugs: a forgotten badge, a stale list, duplicated code.\n**The solution.** **Declarative rendering + reactivity**: you change the *data*; Vue updates exactly the DOM that depends on it.\n```html\n<!-- plain JavaScript -->\n<span id=\"n\">0<\/span><button id=\"b\">+<\/button>\n<script>\n  let n = 0\n  document.getElementById('b').onclick = () => { n++; document.getElementById('n').textContent = n }\n<\/script>\n\n<!-- Vue -->\n<button @click=\"count++\">{{ count }}<\/button>      <!-- no manual DOM code at all -->\n```\n**Analogy.** Plain JS is hand-writing a letter each time something changes. Vue is a spreadsheet: you change a cell and every formula that depends on it recalculates by itself.\n| | Vanilla JS | Vue |\n|---|---|---|\n| Updating the UI | find elements, change them | change data, UI follows |\n| Reuse | copy-paste / functions | components |\n| Structure | none enforced | SFCs, router, store conventions |\n| Learning curve | none | moderate |\n**Vue vs React (overview):** both are component based with a virtual DOM. Vue uses HTML-like **templates** and automatic fine-grained reactivity with official Router/Pinia; React uses JSX and explicit `setState`. Vue is generally considered easier to start with. Company projects pick one; you work with what the repo uses.\n\n## 31.2 SPA vs MPA \ud83d\udfe2\n| | MPA (multi-page) | SPA (single-page) |\n|---|---|---|\n| Navigation | every link loads a new HTML page from the server | one HTML page; JavaScript swaps views |\n| Feel | page flashes | app-like, instant |\n| Data | server renders HTML | JS fetches JSON and renders in the browser |\n| SEO / first paint | strong | needs SSR/prerender for public sites |\n| Examples | classic server-rendered sites | dashboards, chat, admin tools (**your company app**) |\n**SPA flow:** first visit downloads one HTML + a JS bundle \u2192 Vue mounts into `<div id=\"app\">` \u2192 the router shows the component for the URL \u2192 components call REST APIs for data.\n\n## 31.3 How Vue works internally (conceptual) \ud83d\udd34\n1. **Templates are compiled** (at build time by Vite) into **render functions** that return a lightweight JS tree of **virtual nodes (VNodes)**: `{ type: 'div', props: {...}, children: [...] }`.\n2. When reactive data changes, Vue builds a **new VNode tree**, **diffs** it against the old one and applies only the minimal **real DOM changes** (*patching*).\n3. Vue 3's compiler optimises: **static hoisting** (never re-created) and **patch flags** (it knows which parts are dynamic, so most diffing is skipped).\n4. **Reactivity** is built on JavaScript `Proxy` (Module 33): only components that actually **read** the changed data re-render.\n```\nstate change (count.value++)\n   \u2192 reactivity system notices which effects read `count`\n   \u2192 the component's render effect is queued (batched, flushed in a microtask)\n   \u2192 render function runs \u2192 new VNode tree \u2192 diff vs old \u2192 patch DOM\n```\nTakeaway: you never say \"update the DOM\". You change state.\n\n## 31.4 Creating a project with Vite \ud83d\udfe2\n```bash\nnpm create vue@latest         # choose: Router, Pinia, Vitest, ESLint, Prettier as needed\ncd seller-chat && npm install && npm run dev      # http://localhost:5173\n```\n```\nseller-chat/\n\u251c\u2500 index.html          \u2190 <div id=\"app\"><\/div> + <script type=\"module\" src=\"/src/main.js\">\n\u251c\u2500 package.json  vite.config.js  .env.*\n\u251c\u2500 public/             static files\n\u2514\u2500 src/\n   \u251c\u2500 main.js          entry point\n   \u251c\u2500 App.vue          root component\n   \u251c\u2500 router/index.js  stores/  views/  components/  services/  assets/\n```\n```js\n// src/main.js\nimport { createApp } from 'vue'\nimport { createPinia } from 'pinia'\nimport App from './App.vue'\nimport router from './router'\nimport './assets/styles/main.css'\n\nconst app = createApp(App)     // 1. create the application from the root component\napp.use(createPinia())         // 2. install plugins (global features)\napp.use(router)\napp.mount('#app')              // 3. mount: render App into <div id=\"app\">\n```\n```vue\n<!-- src/App.vue -->\n<script setup>\nimport { ref } from 'vue'\nconst count = ref(0)\n<\/script>\n<template>\n  <button @click=\"count++\">Clicked {{ count }} times<\/button>\n<\/template>\n<style scoped>\nbutton { padding: .5rem 1rem; }\n<\/style>\n```\n**Boot sequence:** browser loads `index.html` \u2192 runs `main.js` (an ES module) \u2192 `createApp(App)` \u2192 plugins \u2192 `mount('#app')` \u2192 Vue renders `App` and its children into `#app`. `npm run build` produces static files in `dist/`.\n**CDN quick try (no build):**\n```html\n<script src=\"https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js\"><\/script>\n<div id=\"app\">{{ message }}<\/div>\n<script>Vue.createApp({ data() { return { message: 'Hello Vue' } } }).mount('#app')<\/script>\n```\n\n## 31.5 Common mistakes and interview questions\n**Mistakes:** opening `index.html` directly (Vite needs the dev server) \u00b7 editing `dist/` \u00b7 forgetting `npm install` after pulling \u00b7 mixing Vue 2 and Vue 3 docs.\n**Q1. What problem does Vue solve?** **Q2. SPA vs MPA?** **Q3. What is the virtual DOM?** **Q4. What does `app.mount()` do?** **Q5. Vue 2 vs 3?** Composition API, Proxy reactivity, fragments, Teleport/Suspense, better TypeScript, faster; Vue 2 is end-of-life. **Q6. What is Vite?** a dev server + build tool using native ES modules.\n**Exercises:** scaffold a project, delete the boilerplate, build a counter \u00b7 add a plugin \u00b7 inspect `dist/` after `npm run build`.\n\n## \u25b6 VUE STEP 31\n```bash\nnpm create vue@latest seller-chat    # \u2714 Router \u2714 Pinia \u2714 Vitest \u2714 ESLint \u2714 Prettier\n```\nCopy your CSS files into `src/assets/styles/`, import them in `main.js`, and keep your plain-JS version for comparison.\n\n---\n\n# MODULE 32 \u2014 VUE TEMPLATE SYNTAX\n\nA Vue **template** is HTML plus **directives** (attributes starting with `v-`) and **interpolation** (`{{ }}`). Inside them you write a single **JavaScript expression** (no statements like `if` or `for`).\n\n## 32.1 Interpolation and `v-bind` \ud83d\udfe2\n```vue\n<script setup>\nimport { ref } from 'vue'\nconst name = ref('Ravi'); const imgUrl = ref('/a.png'); const isOff = ref(true); const unread = ref(3)\n<\/script>\n<template>\n  <p>Hello {{ name }} / {{ name.toUpperCase() }} / {{ unread + 1 }}<\/p>     <!-- text; HTML is ESCAPED (safe) -->\n  <img :src=\"imgUrl\" :alt=\"name\">                                          <!-- :attr is short for v-bind:attr -->\n  <button :disabled=\"isOff\" :data-id=\"unread\">Go<\/button>                  <!-- boolean attr is removed when false -->\n  <div v-html=\"trustedHtml\"><\/div>                                         <!-- raw HTML: ONLY for trusted/sanitised content -->\n<\/template>\n```\n- **Refs are unwrapped in templates**: write `{{ name }}` not `name.value`.\n- **Note the colon:** `<img src=\"imgUrl\">` passes the literal text \"imgUrl\"; `:src=\"imgUrl\"` passes the variable.\n- **Class and style binding**\n```html\n<li :class=\"{ active: isActive, 'chat-item--unread': unread > 0 }\" />\n<li :class=\"['chat', isActive && 'active']\" />\n<div :style=\"{ width: pct + '%', '--c': color }\" />\n```\n\n## 32.2 Events with `v-on` \ud83d\udfe2\n```vue\n<button @click=\"count++\">+<\/button>              <!-- inline expression -->\n<button @click=\"onSend\">Send<\/button>            <!-- method reference: Vue passes the event -->\n<button @click=\"remove(chat.id, $event)\">\u2715<\/button>   <!-- call with arguments; $event = the DOM event -->\n<form @submit.prevent=\"save\">                    <!-- .prevent = event.preventDefault() -->\n<input @keyup.enter=\"send\" @keydown.ctrl.k.prevent=\"openSearch\">    <!-- key modifiers -->\n<div @click.self=\"close\">                        <!-- only when the element ITSELF is clicked -->\n<button @click.once=\"track\"> <div @scroll.passive=\"onScroll\">\n```\n`@click` is shorthand for `v-on:click`. This replaces `addEventListener` and `preventDefault` from Module 27.\n\n## 32.3 Conditional rendering \ud83d\udfe2\n```vue\n<p v-if=\"status === 'loading'\">Loading\u2026<\/p>\n<p v-else-if=\"status === 'error'\">{{ error }}<\/p>\n<ul v-else-if=\"chats.length\"> \u2026 <\/ul>\n<p v-else>No chats yet<\/p>\n\n<div v-show=\"open\">Panel<\/div>              <!-- stays in the DOM; toggles CSS display -->\n<template v-if=\"user\"><h2>{{ user.name }}<\/h2><p>{{ user.email }}<\/p><\/template>   <!-- group without adding a wrapper element -->\n```\n| | `v-if` | `v-show` |\n|---|---|---|\n| DOM | element created/destroyed | element stays; `display:none` toggled |\n| Cost | cheaper first render when false; costlier toggling | always rendered; cheap toggling |\n| Supports `else`, `<template>` | yes | no |\n| Use | rarely changes, expensive content, guards (`v-if=\"user\"`) | frequent toggles (menus, tabs) |\n**Never** put `v-if` and `v-for` on the same element: filter with a `computed` instead.\n\n## 32.4 List rendering and `key` \ud83d\udfe2\n```vue\n<li v-for=\"chat in chats\" :key=\"chat.id\">{{ chat.buyerName }}<\/li>\n<li v-for=\"(chat, index) in chats\" :key=\"chat.id\">{{ index + 1 }}. {{ chat.buyerName }}<\/li>\n<li v-for=\"(value, key) in userObject\" :key=\"key\">{{ key }}: {{ value }}<\/li>\n<span v-for=\"n in 5\" :key=\"n\">{{ n }}<\/span>\n```\n**Why `key`?** When the list changes, Vue's diff reuses DOM elements by matching **keys**. With a **stable unique key** (the item id), Vue moves the right DOM node with its state. Without it (or with the array **index**) Vue patches by position, so typed text, focus or animations stick to the **wrong item** after sorting/filtering/deleting. **Never use index for changing lists; never use random keys** (forces re-creation every render).\n\n## 32.5 `v-model` (two-way binding) \ud83d\udfe2\n```vue\n<input v-model=\"q\">                       <!-- \u2248 :value=\"q\" + @input=\"q = $event.target.value\" -->\n<input v-model.trim=\"name\"> <input v-model.number=\"age\" type=\"number\"> <input v-model.lazy=\"note\">   <!-- .lazy = on change -->\n```\nDetails for every control type: Module 38.\n\n## 32.6 Choosing a directive\n| Need | Use |\n|---|---|\n| show text | `{{ }}` |\n| set an attribute/property | `:attr` |\n| react to an event | `@event` |\n| include/exclude | `v-if` / `v-else` |\n| toggle often | `v-show` |\n| repeat | `v-for` + `:key` |\n| form input | `v-model` |\n| raw HTML | `v-html` (trusted only) |\nOthers: `v-once` (render once), `v-pre` (skip compile), `v-memo` (performance), `v-slot`/`#` (slots, Module 35).\n\n## 32.7 Common mistakes\n`v-for` without key or with index key \u00b7 `v-if` + `v-for` together \u00b7 `v-html` with user data \u00b7 statements in templates \u00b7 heavy logic in templates (move to `computed`) \u00b7 forgetting `:` for variables.\n\n## 32.8 Interview questions\n**Q1. `v-if` vs `v-show`?** **Q2. Why is `key` required?** **Q3. What is the `:` shorthand?** `v-bind`. **Q4. How does `v-model` work internally?** **Q5. `{{ }}` vs `v-html`?** escaped vs raw.\n**Exercises:** todo list with filters \u00b7 tabs with `v-show` \u00b7 loading/error/empty/list conditional \u00b7 input with `.trim`/`.number` \u00b7 reproduce the index-as-key bug by sorting a list with inputs.\n\n## \u25b6 VUE STEP 32 \u2014 the chat list in a template\n```vue\n<script setup>\nimport { ref } from 'vue'\nconst chats = ref([\n  { id: 1, buyerName: 'Ravi',  lastMessage: 'Is the red sneaker available?', unread: 2 },\n  { id: 2, buyerName: 'Asha',  lastMessage: 'Thanks, received!', unread: 0 },\n  { id: 3, buyerName: 'Meena', lastMessage: 'Please send the price', unread: 1 },\n])\nconst activeId = ref(1)\n<\/script>\n<template>\n  <ul class=\"chat-list\">\n    <li v-for=\"c in chats\" :key=\"c.id\" :class=\"{ 'chat-item--unread': c.unread > 0, active: c.id === activeId }\" @click=\"activeId = c.id\">\n      <strong>{{ c.buyerName }}<\/strong>\n      <span>{{ c.lastMessage }}<\/span>\n      <b v-if=\"c.unread\">{{ c.unread }}<\/b>\n    <\/li>\n  <\/ul>\n<\/template>\n```\n**Compare with Build Step 26:** `chatRow()`, `createElement`, `classList.toggle`, `replaceChildren` and the click delegation are all replaced by four directives.\n\n---\n\n# MODULE 33 \u2014 VUE REACTIVITY SYSTEM \u2b50\n\n## 33.1 What is reactivity? \ud83d\udfe1\n**Reactivity** = automatically re-running code (including template rendering) when the data it **read** changes.\nIn plain JS: `let a = 1; let b = a * 2; a = 5` leaves `b === 2`. In Vue, `b` would follow `a`, like a spreadsheet formula.\n**How Vue 3 does it (Proxy):** state is wrapped in a `Proxy`.\n- **Tracking:** when an *effect* (a component's render function, a `computed`, a `watch`) runs and **reads** a reactive property, the `get` trap records \"this effect depends on this property\".\n- **Triggering:** when that property is **written**, the `set` trap finds all dependent effects and **schedules** them again.\n```\nrender effect runs \u2500 reads count.value \u2500\u2500\u25ba registry: count \u2192 { renderEffect }     \u2190 TRACK\ncount.value++      \u2500\u2500\u25ba set trap \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba finds { renderEffect } \u2192 queue it         \u2190 TRIGGER\nscheduler (batched) \u2500\u2500\u25ba re-run render \u2500\u2500\u25ba diff \u2500\u2500\u25ba patch the DOM\n```\nA tiny model (not the real code):\n```js\nlet activeEffect = null\nconst registry = new WeakMap()                          // target \u2192 key \u2192 Set of effects\nfunction reactive(obj) {\n  return new Proxy(obj, {\n    get(target, key, receiver) { track(target, key); return Reflect.get(target, key, receiver) },\n    set(target, key, value, receiver) { const ok = Reflect.set(target, key, value, receiver); trigger(target, key); return ok },\n  })\n}\n// track(): if (activeEffect) registry[target][key].add(activeEffect)\n// trigger(): registry[target][key].forEach(effect => effect())\n```\nVue 2 used `Object.defineProperty`, which can't detect **added/deleted properties or `arr[i] = x`**, so it needed `this.$set`. Vue 3's Proxy removes those limits.\n\n## 33.2 `ref` and `reactive` \ud83d\udfe2\n```js\nimport { ref, reactive } from 'vue'\nconst count = ref(0)                 // an object { value: 0 }; works for ANY value\ncount.value++                        // in JS code you need .value; in templates it is auto-unwrapped\nconst user = ref({ name: 'Ravi' })\nuser.value.name = 'Asha'             // deep reactive\n\nconst state = reactive({ count: 0, user: { name: 'Ravi' } })   // a Proxy of an object (objects/arrays/Map/Set only)\nstate.count++                        // no .value\n```\n**Why `.value`?** A primitive like a number can't be proxied, so Vue wraps it in an object with a getter/setter on `.value` that tracks reads and writes.\n| | `ref` | `reactive` |\n|---|---|---|\n| Accepts | any value | objects only |\n| Access | `.value` (script); auto-unwrap in template | direct properties |\n| Replace the whole value | \u2705 `x.value = newObj` stays reactive | \u274c reassigning loses the proxy link |\n| Destructuring | keep the ref | \u274c primitives lose reactivity (use `toRefs`) |\n| Recommended | **default** | grouped local objects (forms) |\n```js\nconst state = reactive({ a: 1 })\nlet { a } = state; a++                  // \u274c a is now a plain number, no longer reactive\nconst { a: aRef } = toRefs(state)       // \u2705 aRef.value stays linked to state.a\nconst list = ref([]); list.value = await api.list()    // \u2705 replacing the whole array is easy with ref\n```\n\n## 33.3 `computed` \ud83d\udfe2\nA **derived value** that updates automatically and is **cached** until its dependencies change.\n```js\nconst chats = ref([...]); const q = ref('')\nconst filtered = computed(() => chats.value.filter(c => c.buyerName.toLowerCase().includes(q.value.toLowerCase())))\nconst unreadTotal = computed(() => chats.value.reduce((n, c) => n + c.unread, 0))\n// writable form:\nconst full = computed({ get: () => `${first.value} ${last.value}`, set: v => { [first.value, last.value] = v.split(' ') } })\n```\n| | computed | method |\n|---|---|---|\n| Cached | \u2705 until dependencies change | \u274c runs on every call/render |\n| Use for | derived data | actions |\n**Rules:** a computed must be **pure** (no API calls, no mutations) and return a value. Computeds can depend on other computeds.\n\n## 33.4 `watch` and `watchEffect` \ud83d\udfe1\n```js\nwatch(q, (newVal, oldVal) => { console.log(newVal) })                     // runs when q changes (lazy)\nwatch(() => route.params.id, id => loadChat(id), { immediate: true })     // getter source; also run now\nwatch([a, b], ([na, nb]) => {})                                           // several sources\nwatch(state, cb, { deep: true })                                          // nested mutations\nwatch(q, async (val, _, onCleanup) => {                                   // cleanup: cancel the previous work\n  const ctrl = new AbortController(); onCleanup(() => ctrl.abort())\n  results.value = await chatApi.list({ q: val }, ctrl.signal)\n})\nconst stop = watchEffect(() => { console.log(q.value) })                  // runs immediately; auto-tracks what it READS\nstop()                                                                    // manual stop (auto-stopped on unmount in setup)\n```\n| | `computed` | `watch` | `watchEffect` |\n|---|---|---|---|\n| Purpose | derive a value | side effect for a specific source | side effect, automatic dependencies |\n| Returns | a ref | a stop function | a stop function |\n| Runs immediately | lazily | no (unless `immediate`) | yes |\n| Old value | no | yes | no |\nUse `computed` for derived data and `watch` for **side effects** (API calls, localStorage, resetting page when a filter changes). Don't compute derived state in a watcher.\n\n## 33.5 Utility APIs \ud83d\udfe1\n```js\nisRef(x); unref(x)                         // unref(x) = isRef(x) ? x.value : x\nconst nameRef = toRef(state, 'name')       // a ref linked to one property\nconst { a, b } = toRefs(state)             // all properties as linked refs (composables return these)\nisReactive(o); isReadonly(o); toRaw(proxy)\nconst ro = readonly(state)                 // read-only view: expose state without allowing writes\nshallowRef(big); shallowReactive(o)        // only .value / top-level props reactive (performance for big data)\nmarkRaw(obj); triggerRef(sRef)             // opt out of proxying / force update\n```\n\n## 33.6 `nextTick` and update batching \ud83d\udfe1\nVue updates the DOM **asynchronously and batched**: changing state ten times in one tick causes **one** render (flushed in a microtask, see Module 23).\n```js\ncount.value++\nconsole.log(el.textContent)       // OLD value: the DOM isn't updated yet\nawait nextTick()\nconsole.log(el.textContent)       // new value\n// real use: scroll to the bottom after adding a message\nmessages.value.push(m); await nextTick(); box.value.scrollTop = box.value.scrollHeight\n```\n\n## 33.7 Worked example with the full flow\n```vue\n<script setup>\nimport { ref, computed, watch } from 'vue'\nconst chats = ref([{ id: 1, name: 'Ravi', unread: 2 }, { id: 2, name: 'Asha', unread: 0 }])\nconst q = ref(''); const onlyUnread = ref(false)\nconst visible = computed(() => chats.value\n  .filter(c => c.name.toLowerCase().includes(q.value.trim().toLowerCase()))\n  .filter(c => !onlyUnread.value || c.unread > 0))\nconst totalUnread = computed(() => chats.value.reduce((n, c) => n + c.unread, 0))\nwatch(totalUnread, n => { document.title = n ? `(${n}) Chats` : 'Chats' })    // side effect\nconst markRead = c => { c.unread = 0 }                                           // mutation \u2192 UI updates\n<\/script>\n<template>\n  <input v-model=\"q\" placeholder=\"Search\"><label><input type=\"checkbox\" v-model=\"onlyUnread\"> Unread only<\/label>\n  <ul><li v-for=\"c in visible\" :key=\"c.id\" @click=\"markRead(c)\">{{ c.name }} <b v-if=\"c.unread\">{{ c.unread }}<\/b><\/li><\/ul>\n  <p v-if=\"!visible.length\">No chats match<\/p>\n<\/template>\n```\n**Flow 1 (typing):** input \u2192 `q.value` set \u2192 `visible` computed marked stale \u2192 the render effect (which read `visible`) is queued \u2192 re-run \u2192 diff \u2192 DOM patched.\n**Flow 2 (click):** `c.unread = 0` (deep reactive) \u2192 `totalUnread` recomputes \u2192 the watcher updates `document.title` and the template re-renders the badge away.\n\n## 33.8 Common reactivity bugs\n| Bug | Fix |\n|---|---|\n| destructuring a reactive object | `toRefs` / access via the object |\n| missing `.value` in script | add it |\n| replacing a `reactive` object variable | `Object.assign`, or use `ref` |\n| plain `let` variable | `ref` |\n| class instances/DOM nodes in deep refs | `markRaw` / `shallowRef` |\n| reading DOM right after a change | `await nextTick()` |\n| computed with side effects | move to `watch` |\n| watcher that modifies its own source \u2192 infinite loop | restructure |\n\n## 33.9 Interview questions\n**Q1. How does Vue 3 reactivity work?** (Proxy + track/trigger + scheduler). **Q2. ref vs reactive?** **Q3. computed vs method vs watch?** **Q4. Why `.value`?** **Q5. What is `nextTick`?** **Q6. Why did my UI not update after destructuring?** **Q7. When use `shallowRef`?** **Q8. Why doesn't Vue 3 need `Vue.set`?** Proxy traps additions/deletions.\n**Exercises:** shopping cart with computed totals \u00b7 debounced search watcher with cleanup \u00b7 reproduce and fix the destructuring bug \u00b7 log inside a computed to prove caching.\n\n## \u25b6 VUE STEP 33 \u2014 the chat store logic as reactive state\n```js\nconst chats = ref([...]); const filters = reactive({ q: '', status: 'all' })\nconst visibleChats = computed(() => sortedChats(filterChats(searchChats(chats.value, filters.q), filters.status)))\nconst totalUnread = computed(() => chats.value.reduce((n, c) => n + c.unread, 0))\n```\nThis is Code Step 15 (`searchChats`, `filterChats`, `sortedChats`) **reused unchanged**: pure functions you wrote in plain JS become `computed` values. Nothing calls `render()` any more.\n\n---\n\n# MODULE 34 \u2014 VUE COMPONENTS\n\n## 34.1 What and why \ud83d\udfe2\nA **component** is a reusable, self-contained piece of UI with its own markup, logic and styles. The page is a **tree** of components. Benefits: reuse (`ChatItem` \u00d7 100), isolation, testability, parallel teamwork.\n**Analogy:** LEGO bricks. Small bricks (button, badge) make bigger parts (chat item), which make the screen.\n```\nApp\n\u2514\u2500 ChatsView\n   \u251c\u2500 ChatSidebar \u2192 ChatItem \u00d7N\n   \u2514\u2500 ChatRoom \u2192 ChatHeader, MessageList \u2192 MessageBubble \u00d7N, MessageComposer\n```\n\n## 34.2 Single File Component (SFC) \ud83d\udfe2\n```vue\n<script setup>              // logic: runs for each component instance; top-level bindings are usable in the template\nimport { ref } from 'vue'\nconst count = ref(0)\n<\/script>\n\n<template>                  <!-- markup -->\n  <button class=\"counter\" @click=\"count++\">{{ count }}<\/button>\n<\/template>\n\n<style scoped>              /* styles for this component only (Module 11) */\n.counter { padding: .5rem 1rem }\n<\/style>\n```\nVue 3 allows several root elements (fragments). Naming: files and components `PascalCase` (`ChatItem.vue`); base components `BaseButton.vue`; single-use `TheHeader.vue`; in templates `<ChatItem />`.\n\n## 34.3 Registration \ud83d\udfe2\n```vue\n<script setup>\nimport ChatItem from './ChatItem.vue'     // in <script setup>, an import IS the local registration\n<\/script>\n<template><ChatItem /><\/template>\n```\n- **Local** (recommended): only where imported. **Global** (`app.component('BaseButton', BaseButton)` in `main.js`): available everywhere; use for a handful of base components (hurts tree shaking otherwise).\n- Options API: `components: { ChatItem }`.\n\n## 34.4 Parent\u2013child communication overview \ud83d\udfe1\n```\n          ChatsView (owns the data)\n   props \u2193 (data down)         \u2191 events (emit up)\n        ChatList \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n          \u2514\u2500 ChatItem   click \u2192 emit('select', id)\n```\n| Direction | Mechanism |\n|---|---|\n| parent \u2192 child | **props** |\n| child \u2192 parent | **emits** (custom events) |\n| both ways on one value | `v-model` (prop + emit) |\n| parent \u2192 child markup | **slots** |\n| ancestor \u2192 deep descendant | `provide` / `inject` |\n| any \u2194 any (shared) | **Pinia** store |\n| parent calls a child method | template ref + `defineExpose` (rare) |\n**One-way data flow:** data goes down through props, events go up. A child **must not mutate props** (Vue warns); it asks the parent to change the data by emitting an event. This keeps every change traceable.\n\n## 34.5 Build reusable components \ud83d\udfe1\n```vue\n<!-- components/chat/ChatItem.vue -->\n<script setup>\nconst props = defineProps({ chat: { type: Object, required: true }, active: Boolean })\nconst emit = defineEmits(['select'])\n<\/script>\n<template>\n  <li :class=\"['chat-item', { 'chat-item--active': active, 'chat-item--unread': chat.unread > 0 }]\" @click=\"emit('select', chat.id)\">\n    <strong class=\"chat-item__name\">{{ chat.buyerName }}<\/strong>\n    <span class=\"chat-item__last\">{{ chat.lastMessage }}<\/span>\n    <b v-if=\"chat.unread\" class=\"chat-item__badge\">{{ chat.unread }}<\/b>\n  <\/li>\n<\/template>\n```\n```vue\n<!-- components/chat/ChatList.vue -->\n<script setup>\nimport ChatItem from './ChatItem.vue'\ndefineProps({ chats: { type: Array, required: true }, activeId: Number })\nconst emit = defineEmits(['select'])\n<\/script>\n<template>\n  <ul class=\"chat-list\">\n    <ChatItem v-for=\"c in chats\" :key=\"c.id\" :chat=\"c\" :active=\"c.id === activeId\" @select=\"emit('select', $event)\" />\n  <\/ul>\n<\/template>\n```\n**Data movement:** `ChatsView` holds `chats` and `activeId` \u2192 passes them as props to `ChatList` \u2192 which passes each `chat` to `ChatItem`. The user clicks \u2192 `ChatItem` emits `select(id)` \u2192 `ChatList` re-emits \u2192 `ChatsView` updates `activeId` \u2192 everything re-renders with the new `active` flags.\n\n## 34.6 Options API (legacy company code) \ud83d\udfe1\n```vue\n<script>\nexport default {\n  name: 'ChatItem',\n  props: { chat: Object },\n  emits: ['select'],\n  data() { return { hovered: false } },                      // reactive local state: this.hovered\n  computed: { label() { return this.chat.buyerName.toUpperCase() } },\n  watch: { 'chat.unread'(n) { /* \u2026 */ } },\n  methods: { onClick() { this.$emit('select', this.chat.id) } },\n  mounted() { /* lifecycle */ },\n}\n<\/script>\n```\nMapping: `data` \u2192 `ref/reactive` \u00b7 `computed` \u2192 `computed()` \u00b7 `methods` \u2192 plain functions \u00b7 `watch` \u2192 `watch()` \u00b7 `mounted` \u2192 `onMounted` \u00b7 `this.$emit` \u2192 `emit` \u00b7 `this.$refs` \u2192 template refs \u00b7 mixins \u2192 composables. Both APIs can coexist in a project; don't mix them in one component. (Full legacy guide: Module 58.)\n\n## 34.7 Common mistakes and questions\n**Mistakes:** mutating props \u00b7 giant components \u00b7 passing data through many layers (prop drilling) \u00b7 no `:key` on component lists \u00b7 logic in templates.\n**Q1. What is an SFC?** **Q2. Local vs global registration?** **Q3. How do components communicate?** (table). **Q4. Why one-way data flow?** predictability/debugging. **Q5. Options vs Composition API?** **Q6. What does `scoped` do?**\n**Exercises:** build `BaseButton`, `ChatItem`, `ChatList` \u00b7 convert an Options API component to Composition API \u00b7 draw the component tree of a real screen from your company app.\n\n## \u25b6 VUE STEP 34 \u2014 split the screen into components\nCreate `ChatItem.vue`, `ChatList.vue` (above), then `ChatHeader.vue`, `MessageBubble.vue`, `MessageList.vue`, `MessageComposer.vue`. Your `ChatsView.vue` becomes thin:\n```vue\n<template>\n  <div class=\"layout\">\n    <aside class=\"sidebar\"><ChatList :chats=\"visibleChats\" :active-id=\"activeId\" @select=\"activeId = $event\" /><\/aside>\n    <main><ChatRoom v-if=\"activeChat\" :chat=\"activeChat\" /><\/main>\n  <\/div>\n<\/template>\n```\n\n---\n\n# MODULE 35 \u2014 PROPS, EMITS AND SLOTS\n\n## 35.1 Props \ud83d\udfe2\n```vue\n<script setup>\nconst props = defineProps({\n  title:    { type: String, required: true },\n  count:    { type: Number, default: 0 },\n  status:   { type: String, default: 'open', validator: v => ['open', 'closed'].includes(v) },\n  items:    { type: Array, default: () => [] },       // object/array defaults MUST be factory functions\n  user:     { type: Object, default: () => ({}) },\n  disabled: Boolean,                                  // <Comp disabled> \u2192 true (boolean casting)\n})\n// props.title = 'x'   \u2717 Vue warns: props are read-only\n<\/script>\n```\n- Pass: `<Card title=\"Hi\" :count=\"5\" :user=\"u\" v-bind=\"obj\" disabled />`. **Non-string values need `:`** (`count=\"5\"` passes the string `\"5\"`).\n- Naming: `camelCase` in script, `kebab-case` in templates is idiomatic (`:active-id`).\n- Type-only form `defineProps(['title'])`; TypeScript form `defineProps<{ title: string; count?: number }>()`.\n**Need an editable copy?** `const draft = ref({ ...props.user })` (and `watch(() => props.user, \u2026)` if it must stay in sync), or derive with `computed(() => props.x * 2)`. Mutating a **nested** object of a prop doesn't warn but breaks the contract: avoid it.\n\n## 35.2 Emits (custom events) \ud83d\udfe2\n```vue\n<script setup>\nconst emit = defineEmits({\n  select: id => typeof id === 'number',     // object form validates the payload\n  'update:modelValue': null,\n})\n// array form: defineEmits(['select', 'close'])   \u00b7   TS: defineEmits<{ select: [id: number] }>()\nfunction pick() { emit('select', 42) }       // payload(s) after the event name\n<\/script>\n<template><button @click=\"pick\">Pick<\/button><\/template>\n```\nParent: `<ChatItem @select=\"openChat\" />` or inline `@select=\"id => selected = id\"`. Declare emits so they're documented and not treated as native attributes.\n**`v-model` on a component**\n```vue\n<!-- BaseInput.vue -->\n<script setup>\nconst model = defineModel()                 // Vue 3.4+: a ref synced with the parent's v-model\n<\/script>\n<template><input v-model=\"model\" class=\"input\"><\/template>\n<!-- parent -->  <BaseInput v-model=\"email\" />\n```\n(Older form: prop `modelValue` + `emit('update:modelValue', v)`.) Several models: `defineModel('title')` \u2194 `<Comp v-model:title=\"t\" />`.\n\n## 35.3 Slots \ud83d\udfe1\nProps pass **data**; slots pass **markup**.\n```vue\n<!-- BaseCard.vue -->\n<template>\n  <section class=\"card\">\n    <header><slot name=\"header\">Default title<\/slot><\/header>   <!-- named slot with fallback content -->\n    <slot />                                                     <!-- default slot -->\n    <footer v-if=\"$slots.footer\"><slot name=\"footer\" /><\/footer>\n  <\/section>\n<\/template>\n<!-- usage -->\n<BaseCard>\n  <template #header><h3>Order #1001<\/h3><\/template>\n  <p>Main content goes in the default slot<\/p>\n  <template #footer><button>Close<\/button><\/template>\n<\/BaseCard>\n```\n**Scoped slots:** the child passes data **into** the parent's slot content.\n```vue\n<!-- DataList.vue -->\n<script setup>defineProps({ items: Array })<\/script>\n<template><ul><li v-for=\"(item, i) in items\" :key=\"item.id\"><slot :item=\"item\" :index=\"i\">{{ item.name }}<\/slot><\/li><\/ul><\/template>\n<!-- usage: the parent decides how each row looks -->\n<DataList :items=\"orders\"><template #default=\"{ item }\"><OrderCard :order=\"item\" /><\/template><\/DataList>\n```\nReal uses: tables with custom cell rendering (every UI library), modals (`#header/#body/#actions`), layout wrappers.\n\n## 35.4 Patterns summary \ud83d\udfe1\nParent \u2192 child: props \u00b7 child \u2192 parent: emits \u00b7 two-way: `v-model` \u00b7 content: slots \u00b7 siblings: **lift state up** to the common parent or use a store \u00b7 deep: provide/inject \u00b7 global: Pinia.\n**BaseModal (props + emits + slots + v-model)**\n```vue\n<script setup>\ndefineProps({ open: Boolean, title: String })\nconst emit = defineEmits(['update:open', 'confirm'])\nconst close = () => emit('update:open', false)\n<\/script>\n<template>\n  <Teleport to=\"body\">\n    <div v-if=\"open\" class=\"overlay\" @click.self=\"close\" @keydown.esc=\"close\">\n      <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" :aria-label=\"title\">\n        <header><h2>{{ title }}<\/h2><button aria-label=\"Close\" @click=\"close\">\u00d7<\/button><\/header>\n        <div class=\"body\"><slot /><\/div>\n        <footer><slot name=\"actions\"><button @click=\"close\">Cancel<\/button><button @click=\"emit('confirm')\">OK<\/button><\/slot><\/footer>\n      <\/div>\n    <\/div>\n  <\/Teleport>\n<\/template>\n<!-- usage -->  <BaseModal v-model:open=\"showAttach\" title=\"Attach order\" @confirm=\"attach\"><OrderList /><\/BaseModal>\n```\n\n## 35.5 Mistakes and questions\n**Q1. Props vs emits?** **Q2. Why can't a child mutate a prop?** **Q3. Default for object props?** factory. **Q4. Named vs scoped slots?** **Q5. How does `v-model` work on components?** **Q6. How do you validate props?**\n**Exercises:** `BaseButton` variants via props \u00b7 `BaseInput` with `defineModel` \u00b7 `BaseModal` with slots \u00b7 a generic `DataTable` with scoped slots.\n\n## \u25b6 VUE STEP 35 \u2014 the message components\n```vue\n<!-- MessageBubble.vue -->\n<script setup>\nimport { computed } from 'vue'\nconst props = defineProps({ message: { type: Object, required: true } })\nconst emit = defineEmits(['retry'])\nconst mine = computed(() => props.message.sender === 'SELLER')\n<\/script>\n<template>\n  <article :class=\"['msg', mine ? 'msg--mine' : 'msg--theirs']\">\n    <p>{{ props.message.text }}<\/p>                         <!-- {{ }} escapes user text: XSS-safe -->\n    <small v-if=\"message.status === 'sending'\">Sending\u2026<\/small>\n    <button v-if=\"message.status === 'failed'\" @click=\"emit('retry')\">Failed \u00b7 Retry<\/button>\n  <\/article>\n<\/template>\n```\n```vue\n<!-- MessageComposer.vue -->\n<script setup>\nimport { ref, computed } from 'vue'\nconst emit = defineEmits(['send']); const text = ref('')\nconst canSend = computed(() => text.value.trim().length > 0 && text.value.length <= 500)\nfunction submit() { if (!canSend.value) return; emit('send', text.value.trim()); text.value = '' }\n<\/script>\n<template>\n  <form class=\"composer\" @submit.prevent=\"submit\">\n    <label for=\"msg\" class=\"sr-only\">Message<\/label>\n    <textarea id=\"msg\" v-model=\"text\" rows=\"1\" maxlength=\"500\" @keydown.enter.exact.prevent=\"submit\"><\/textarea>\n    <button :disabled=\"!canSend\">Send<\/button>\n  <\/form>\n<\/template>\n```\nCompare with Build Step 27: the manual `input` listener, `disabled` toggling, `form.reset()` and `preventDefault` are replaced by `v-model`, a `computed` and `@submit.prevent`.\n\n---\n\n# MODULE 36 \u2014 VUE LIFECYCLE HOOKS\n\n## 36.1 The lifecycle \ud83d\udfe1\nEvery component instance goes through stages from creation to removal. **Hooks** let you run code at a stage.\n```\nsetup() / <script setup>      (\u2248 beforeCreate + created; no `this`; state is created here)\n   \u2193 onBeforeMount            template compiled, DOM NOT created yet\n   \u2193 [render \u2192 DOM created and inserted]\n   \u2193 onMounted                DOM exists and is in the document \u2192 fetch data, focus inputs, start timers/sockets\n   \u2193 (rea
