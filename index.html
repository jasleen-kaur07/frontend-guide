der function (HOF):** takes and/or returns functions.\n```js\nfunction repeat(times, action) { for (let i = 0; i < times; i++) action(i) }\nrepeat(3, i => console.log('tick', i))      // \u2192 tick 0 / tick 1 / tick 2\n\nsetTimeout(() => console.log('later'), 1000)    // the browser calls your callback after 1s\nconst withLog = fn => (...args) => { console.log('args:', args); return fn(...args) }   // returns a new function\nconst loggedAdd = withLog(add); loggedAdd(2, 3)   // \u2192 args: [2, 3]   then returns 5\n```\nYou use callbacks every day: `map/filter` callbacks, event handlers, `.then(...)`, Vue `computed(() => ...)`.\n\n## 14.6 IIFE, pure functions, recursion, composition \ud83d\udfe1\n```js\n(function () { const secret = 1; console.log('runs immediately') })()   // IIFE: private scope (older module pattern)\n```\n**Pure function:** same inputs \u2192 same output, no side effects (doesn't change outside data, no I/O).\n```js\nconst addTax = price => price * 1.18                 // pure\nlet total = 0; const addToTotal = n => { total += n }   // impure: changes outside state\n```\nPure functions are easy to test and reason about. Vue `computed`, Pinia getters and state reducers should be pure.\n**Recursion:** a function that calls itself; it needs a **base case** to stop.\n```js\nfunction factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1) }\n// factorial(4) = 4 * factorial(3) = 4 * (3 * factorial(2)) = \u2026 \u2192 24\n// Real use: counting nested comment replies\nconst countReplies = node => 1 + (node.replies ?? []).reduce((n, r) => n + countReplies(r), 0)\n```\nNo base case \u2192 `RangeError: Maximum call stack size exceeded`.\n**Composition:** build bigger functions from smaller ones.\n```js\nconst pipe = (...fns) => input => fns.reduce((value, fn) => fn(value), input)\nconst slugify = pipe(s => s.trim(), s => s.toLowerCase(), s => s.replace(/\\s+/g, '-'))\nslugify('  Seller Chat  ')   // \u2192 'seller-chat'\n```\n\n## 14.7 Common mistakes\nCalling instead of passing a callback (`onclick={fn()}`) \u00b7 arrow returning an object without parentheses \u00b7 relying on hoisting for expressions \u00b7 mutating arguments \u00b7 forgetting `return` in a braces-arrow \u00b7 using `arguments` in arrows.\n\n## 14.8 Interview questions\n**Q1. Declaration vs expression?** hoisting. **Q2. What is a higher-order function?** **Q3. Pure function and why useful?** **Q4. Arrow vs regular function?** `this`, `arguments`, `new`. **Q5. Default params with `null`?** not applied, only `undefined`. **Q6. Predict:** `const f = x => { x * 2 }; console.log(f(2))` \u2192 `undefined` (braces without return).\n\n## 14.9 Exercises\n`clamp(n, min, max)`, `capitalize`, `isPalindrome`, `once(fn)`, `pipe`, recursive `sumNested([1,[2,[3]]])`, `repeat(n, fn)`, a function that accepts an options object with defaults.\n\n## \u25b6 CODE STEP 14\n```js\nconst formatTime = iso => new Date(iso).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })\nconst preview = (text, max = 30) => text.length > max ? text.slice(0, max - 1) + '\u2026' : text\nconst describeChat = chat => `${chat.buyerName}: ${preview(chat.lastMessage)} (${formatTime(chat.lastMessageAt)})`\nconsole.log(describeChat(chats[0]))\n```\n\n---\n\n# MODULE 15 \u2014 ARRAYS\n\n## 15.1 What is an array? \ud83d\udfe2\nAn **array** is an ordered list of values. **Indexes start at 0.** Almost all lists in your app (chats, messages, orders, products) are arrays.\n```js\nconst users = ['Ravi', 'Asha', 'Meena']\nusers[0]                 // \u2192 'Ravi'\nusers[users.length - 1]  // \u2192 'Meena'     users.at(-1) // \u2192 'Meena'\nusers[1] = 'Aisha'       // update\nusers.length             // \u2192 3\nconst mixed = [1, 'a', true, { x: 1 }]\n```\nSome methods **mutate** the original array, others return a **new** one. In Vue/Pinia, know which you're using.\n\nSample data for this module:\n```js\nconst messages = [\n  { id: 1, from: 'buyer',  text: 'Is this available?', read: true,  ts: 1700000001 },\n  { id: 2, from: 'seller', text: 'Yes!',               read: true,  ts: 1700000050 },\n  { id: 3, from: 'buyer',  text: 'Send price',         read: false, ts: 1700000100 },\n]\nconst orders = [\n  { id: 'A1', total: 1200, status: 'PAID' },\n  { id: 'A2', total: 560,  status: 'PENDING' },\n  { id: 'A3', total: 899,  status: 'PAID' },\n]\n```\n\n## 15.2 Add / remove / change (these mutate) \ud83d\udfe2\n| Method | What it does | Returns | Mutates | Speed |\n|---|---|---|---|---|\n| `push(x)` | add to end | new length | \u2705 | O(1) |\n| `pop()` | remove last | removed item | \u2705 | O(1) |\n| `unshift(x)` | add to start | new length | \u2705 | O(n) |\n| `shift()` | remove first | removed item | \u2705 | O(n) |\n| `splice(start, deleteCount, ...items)` | remove/insert/replace anywhere | removed items | \u2705 | O(n) |\n| `sort(fn)` / `reverse()` | reorder in place | same array | \u2705 | O(n log n) / O(n) |\n```js\nconst a = [1, 2, 3]\na.push(4)           // a = [1,2,3,4]\na.pop()             // \u2192 4 ; a = [1,2,3]\na.unshift(0)        // a = [0,1,2,3]\na.shift()           // \u2192 0 ; a = [1,2,3]\na.splice(1, 1)      // remove 1 item at index 1 \u2192 returns [2] ; a = [1,3]\na.splice(1, 0, 'x') // insert 'x' at index 1    ; a = [1,'x',3]\nmessages.push({ id: 4, from: 'seller', text: 'Rs 500', read: true, ts: 1700000200 })   // new message arrives\n```\n**`delete arr[i]` leaves a hole**; use `splice` or `filter`.\n\n## 15.3 Copy and combine (non-mutating) \ud83d\udfe2\n```js\na.slice(1, 3)            // copy of items at index 1 and 2 (end excluded); a.slice() = shallow copy\na.concat(b)              // or [...a, ...b]\na.join(', ')             // \u2192 '1, 2, 3' (a string)\n[1, [2, [3]]].flat(Infinity)   // \u2192 [1,2,3]\nArray.from('abc')              // \u2192 ['a','b','c']\nArray.from({ length: 3 }, (_, i) => i)   // \u2192 [0,1,2]\nArray.isArray(x)         // reliable array check\n```\n`slice` copies; `splice` edits. ES2023 gives immutable twins: `toSorted()`, `toReversed()`, `toSpliced()`, `with(index, value)`.\n\n## 15.4 Searching \ud83d\udfe2\n```js\nusers.indexOf('Asha')                    // \u2192 1 (or -1)\nusers.includes('Asha')                   // \u2192 true\nmessages.find(m => !m.read)              // first match (the element) or undefined \u2192 { id: 3, \u2026 }\nmessages.findIndex(m => m.id === 2)      // \u2192 1 (or -1)\nmessages.some(m => !m.read)              // \u2192 true  (is there at least one?)\nmessages.every(m => m.read)              // \u2192 false (are all of them?)\n```\n`find` returns an **element**, `filter` returns an **array**, `some/every` return **booleans**. `find/some/every` stop early.\n\n## 15.5 The big three: map, filter, reduce \ud83d\udfe2\u2192\ud83d\udfe1\n**map**: transform every element \u2192 new array of the **same length**.\n```js\nmessages.map(m => m.text)                        // \u2192 ['Is this available?', 'Yes!', 'Send price']\nmessages.map(m => ({ ...m, read: true }))        // new objects (immutable update)\n```\n**filter**: keep elements that pass a test \u2192 new array (maybe shorter).\n```js\nconst unread = messages.filter(m => !m.read)             // \u2192 [ { id: 3, \u2026 } ]\nconst unreadCount = messages.filter(m => !m.read).length // \u2192 1   (the badge number)\n```\n**reduce**: fold the whole array into **one value**.\n```js\nconst revenue = orders.reduce((sum, o) => sum + o.total, 0)           // \u2192 2659\nconst byId = orders.reduce((acc, o) => { acc[o.id] = o; return acc }, {})   // \u2192 { A1:{\u2026}, A2:{\u2026}, A3:{\u2026} }\nconst byFrom = messages.reduce((acc, m) => { (acc[m.from] ||= []).push(m); return acc }, {})\n```\n**Reduce anatomy:** `(accumulator, current, index, array) => newAccumulator`, plus an **initial value** as the second argument. Trace of `revenue`:\n```\nstart sum = 0\no = A1 \u2192 sum = 0 + 1200 = 1200\no = A2 \u2192 sum = 1200 + 560 = 1760\no = A3 \u2192 sum = 1760 + 899 = 2659   \u2192 result 2659\n```\nAlways give an initial value; `[].reduce(fn)` without one throws.\n**Chaining:** `orders.filter(o => o.status === 'PAID').map(o => o.total).reduce((a, b) => a + b, 0)` \u2192 `2099`.\n`flatMap(fn)` = map then flatten one level: `threads.flatMap(t => t.messages)`.\n`forEach(fn)` runs a function per element and returns `undefined`; it can't `break` and it **does not wait for `async` callbacks**. Use `for...of` with `await` when order/waiting matters.\n\n## 15.6 sort \ud83d\udfe1\nThe default sort converts to **strings**: `[10, 9, 1].sort()` \u2192 `[1, 10, 9]` \u274c. Always pass a comparator: negative = a first, positive = b first.\n```js\nnums.sort((a, b) => a - b)                  // ascending numbers\nmessages.sort((a, b) => b.ts - a.ts)        // newest first\nusers.sort((a, b) => a.localeCompare(b))    // strings, language-aware\nconst sortedCopy = [...messages].sort((a, b) => a.ts - b.ts)   // copy first so state isn't mutated\n```\nSorting is stable (equal items keep their order).\n\n## 15.7 Iteration choices\n`for` (classic, supports break) \u00b7 `for...of` (values, works with `await`) \u00b7 `forEach` (side effects only) \u00b7 `map/filter/reduce` (data pipelines) \u00b7 `for (const [i, m] of messages.entries())` (index + value).\n\n## 15.8 Common mistakes\n| Mistake | Fix |\n|---|---|\n| `map` used only for side effects | use `forEach` |\n| forgot `return` inside braces callback | add `return` or use implicit arrow |\n| mutating state arrays directly | `[...arr]`, `map/filter` |\n| `sort()` without comparator | pass `(a,b)=>\u2026` |\n| `indexOf` with objects (reference compare) | `findIndex`/`find` |\n| `delete arr[i]` | `splice`/`filter` |\n| `forEach(async \u2026)` expecting waiting | `for...of` + `await` or `Promise.all(map(...))` |\n\n## 15.9 Interview questions\n**Q1. `map` vs `forEach`?** returns new array vs `undefined`. **Q2. `filter` vs `find`?** array vs first element. **Q3. Which methods mutate?** `push, pop, shift, unshift, splice, sort, reverse, fill`. **Q4. Why is `[10,9,1].sort()` wrong?** string comparison. **Q5. Implement `map`:** `Array.prototype.myMap = function (fn) { const out = []; for (let i = 0; i < this.length; i++) out.push(fn(this[i], i, this)); return out }`. **Q6. Output?** `[1,2,3].map(parseInt)` \u2192 `[1, NaN, NaN]` (map passes index as the 2nd argument, so `parseInt('2', 1)` is invalid). **Q7. Complexity of `includes` vs `Set.has`?** O(n) vs O(1).\n\n## 15.10 Exercises\nCount unread per sender \u00b7 group orders by status \u00b7 dedupe with `Set` \u00b7 sort chats by last message \u00b7 paginate with `slice(page*size, (page+1)*size)` \u00b7 flatten threads into one message list.\n\n## \u25b6 CODE STEP 15\n```js\nconst totalUnread = chats.reduce((n, c) => n + c.unread, 0)                      // header badge\nconst searchChats = (list, q) => list.filter(c =>\n  c.buyerName.toLowerCase().includes(q.trim().toLowerCase()) ||\n  c.lastMessage.toLowerCase().includes(q.trim().toLowerCase()))\nconst filterChats = (list, status) => status === 'unread' ? list.filter(c => c.unread > 0)\n                                     : status === 'open'   ? list.filter(c => c.status === 'OPEN') : list\nconst sortedChats = list => [...list].sort((a, b) => new Date(b.lastMessageAt) - new Date(a.lastMessageAt))\nconsole.log(totalUnread)                                          // \u2192 3\nconsole.log(sortedChats(filterChats(searchChats(chats, 'e'), 'open')).map(c => c.buyerName))\n```\n\n---\n\n# MODULE 16 \u2014 OBJECTS\n\n## 16.1 What is an object? \ud83d\udfe2\nAn **object** is a collection of **key: value** pairs: a \"record\" describing one thing. API responses (JSON) are made of objects and arrays.\n```js\nconst user = {\n  id: 7,\n  name: 'Ravi',\n  'home-city': 'Pune',                       // quote keys with special characters\n  address: { city: 'Pune', pin: '411001' },  // nested object\n  tags: ['vip'],\n  greet() { return `Hi ${this.name}` },      // method = function stored in a property\n}\nuser.name              // dot notation \u2192 'Ravi'\nuser['home-city']      // bracket notation \u2192 'Pune' (needed for odd keys and dynamic keys)\nconst key = 'name'; user[key]    // \u2192 'Ravi'\nuser.email = 'r@x.com'           // add\ndelete user.tags                 // remove\n'name' in user                   // \u2192 true      Object.hasOwn(user, 'name') // \u2192 true\n```\n**Computed keys** build objects dynamically (every form handler uses this):\n```js\nconst setField = (form, field, value) => ({ ...form, [field]: value })\nsetField({ name: '' }, 'name', 'Ravi')    // \u2192 { name: 'Ravi' }\n```\nShorthand: `{ name, age }` equals `{ name: name, age: age }`.\n\n## 16.2 Destructuring and spread \ud83d\udfe2\n```js\nconst { name, address: { city }, role = 'seller' } = user   // extract, go into nested, default value\nconst { name: userName } = user                              // rename\nconst [first, , third] = [1, 2, 3]                           // arrays: skip with a comma\nfunction show({ id, name }) { return `${id}:${name}` }       // in parameters\nconst { id, ...rest } = user                                 // rest: everything except id\nconst updated = { ...user, name: 'Asha' }                    // copy + override (the immutable-update pattern)\n```\n\n## 16.3 Object helper methods \ud83d\udfe1\n```js\nObject.keys(user)             // \u2192 ['id','name',\u2026]\nObject.values(user)\nObject.entries(user)          // \u2192 [['id',7],['name','Ravi'],\u2026]\nObject.fromEntries(entries)   // entries \u2192 object\nObject.assign({}, a, b)       // copy/merge (spread does the same)\nObject.freeze(obj)            // no add/remove/change (shallow); silently ignored (TypeError in strict mode)\nObject.seal(obj)              // values changeable, no add/remove\n```\nExamples: `Object.entries(counts).sort(([,a],[,b]) => b - a)`, `Object.fromEntries(Object.entries(o).filter(([k, v]) => v != null))`.\n\n## 16.4 Copying: shallow vs deep \ud83d\udfe1 (very common bug)\n```js\nconst a = { name: 'Ravi', address: { city: 'Pune' } }\nconst shallow = { ...a }              // copies the TOP level only\nshallow.address.city = 'Delhi'\nconsole.log(a.address.city)           // \u2192 'Delhi'  \u2190 the nested object is still SHARED\n```\n```\n a        \u2500\u25ba { name:'Ravi', address \u2500\u2510 }\n shallow  \u2500\u25ba { name:'Ravi', address \u2500\u2534\u2500\u25ba { city:'Delhi' } }    \u2190 one shared address object\n```\nDeep copy:\n```js\nconst deep = structuredClone(a)                 // modern; no functions/DOM; handles Date, Map, Set\nconst legacy = JSON.parse(JSON.stringify(a))    // loses Dates (\u2192 strings), undefined, functions\n```\nVue: edit forms on a **copy** of a row (draft), then save or discard. Reactive proxies may need `toRaw` before `structuredClone`.\n\n## 16.5 Property descriptors, getters and setters \ud83d\udd34\nEvery property has attributes: `value`, `writable`, `enumerable`, `configurable`.\n```js\nconst p = {}\nObject.defineProperty(p, 'id', { value: 1, writable: false, enumerable: true })\np.id = 5                                // ignored (TypeError in strict mode)\nObject.getOwnPropertyDescriptor(p, 'id')   // \u2192 { value: 1, writable: false, enumerable: true, configurable: false }\n\nconst account = {\n  _balance: 0,\n  get balance() { return this._balance },                          // looks like a property, runs a function\n  set balance(v) { if (v < 0) throw new RangeError('negative'); this._balance = v },\n}\naccount.balance = 50       // setter runs\naccount.balance            // \u2192 50 (getter runs)\n```\nVue 2 reactivity was built with getters/setters; **Vue 3 uses `Proxy`** (Module 33).\n\n## 16.6 Objects as API responses \ud83d\udfe1\n```json\n{ \"id\": 101, \"buyer\": { \"name\": \"Ravi\" }, \"items\": [{ \"sku\": \"S1\", \"qty\": 2 }], \"note\": null }\n```\n```js\nconst res = await (await fetch('/api/orders/101')).json()    // JSON text \u2192 JS object\nconst { buyer: { name }, items } = res\nconst totalQty = items.reduce((t, i) => t + i.qty, 0)        // \u2192 2\nconst note = res.note ?? 'No note'\nJSON.stringify(res)                                          // object \u2192 JSON text (to send)\n```\n**JSON rules:** keys and strings in double quotes, no comments, no `undefined`/functions; dates arrive as **strings** (convert with `new Date(str)`).\n**Java \u2194 JS mapping:** record/POJO \u2192 object \u00b7 `List<T>` \u2192 array \u00b7 `LocalDateTime`/`Instant` \u2192 ISO string \u00b7 `Long` \u2192 number (precision risk) \u00b7 enum \u2192 string \u00b7 `Optional.empty` \u2192 `null`.\n\n## 16.7 Common mistakes\nShallow vs deep copy confusion \u00b7 thinking `const` freezes \u00b7 `obj.key` with a variable (use `obj[key]`) \u00b7 `for...in` picks inherited keys \u00b7 reading nested values without `?.` \u00b7 comparing objects with `===` \u00b7 using `JSON.stringify(a) === JSON.stringify(b)` for deep equality (key order, undefined).\n\n## 16.8 Interview questions\n**Q1. Shallow vs deep copy; how to deep copy?** **Q2. `freeze` vs `seal` vs `const`?** **Q3. How do you iterate an object?** keys/values/entries. **Q4. Dot vs bracket?** **Q5. How do you check a key exists?** `in`, `Object.hasOwn`. **Q6. Output?** `const a = {x:1}; const b = a; b.x = 2; console.log(a.x)` \u2192 `2`.\n\n## 16.9 Exercises\nNormalise users into `{[id]: user}` \u00b7 deep-merge two config objects \u00b7 write `pick`/`omit` \u00b7 convert Spring errors `[{field, message}]` to `{field: message}` \u00b7 `groupBy(list, key)`.\n\n## \u25b6 CODE STEP 16 \u2014 messages, immutable updates and the API shape\n```js\nconst state = { chats, messagesByChat: { 1: [{ id: 10, sender: 'BUYER', text: 'Is the red sneaker available?' }] }, activeId: 1 }\n\nconst addMessage = (state, chatId, message) => ({\n  ...state,\n  messagesByChat: { ...state.messagesByChat, [chatId]: [...(state.messagesByChat[chatId] ?? []), message] },\n})\nconst markRead = (state, chatId) => ({\n  ...state,\n  chats: state.chats.map(c => c.id === chatId ? { ...c, unread: 0 } : c),\n})\n\nlet next = addMessage(state, 1, { id: 11, sender: 'SELLER', text: 'Yes, size 9 is in stock.' })\nnext = markRead(next, 1)\nconsole.log(state.messagesByChat[1].length, next.messagesByChat[1].length)   // \u2192 1 2   (old state untouched)\nconsole.log(next.chats[0].unread)                                            // \u2192 0\n```\nWhy this style: each function **returns a new state** instead of changing the old one. Vue and Pinia let you mutate directly, but this immutable thinking is exactly what prevents \"I changed a copy and the original changed\" bugs.\n\n---\n**Next \u2192 `03-js-2.md`: Modules 17\u201321 (Scope, Closures, this, Prototypes, ES6+).**\n\n\n# PART 3 (continued) \u2014 HOW JAVASCRIPT REALLY WORKS\n\n---\n\n# MODULE 17 \u2014 SCOPE, HOISTING AND EXECUTION CONTEXT\n\n## 17.1 Scope: where a variable is visible \ud83d\udfe1\n**Scope** is the region of code where a name can be used.\n**Analogy:** rooms in a building. A variable declared in a room is visible in that room and in any rooms **inside** it, but not outside.\n\n| Scope | Created by | Variables visible\u2026 |\n|---|---|---|\n| Global | top level of a script | everywhere |\n| Module | each ES module file | only in that file |\n| Function | a `function` body | only inside it |\n| Block | `{ }` of `if`, `for`, `while`, plain block | only inside (for `let`/`const`) |\n```js\nvar g = 'global'                 // in a classic script this becomes window.g (pollution!)\nfunction f() {\n  var a = 1                      // function scope\n  if (true) {\n    let b = 2                    // block scope\n    var c = 3                    // var ignores blocks \u2192 function scope\n  }\n  console.log(a, c)              // \u2192 1 3\n  console.log(b)                 // \u274c ReferenceError: b is not defined\n}\n```\n**The classic loop bug**\n```js\nfor (var i = 0; i < 3; i++) setTimeout(() => console.log(i))   // \u2192 3 3 3   (one shared i; the loop is finished before callbacks run)\nfor (let j = 0; j < 3; j++) setTimeout(() => console.log(j))   // \u2192 0 1 2   (a NEW j for each iteration)\n```\n\n## 17.2 Lexical scope and the scope chain \ud83d\udfe1\n**Lexical** means determined by **where the code is written**, not where it is called. When JS looks up a name it searches the current scope, then the surrounding scope, and so on up to global. First match wins (inner **shadows** outer). Not found \u2192 `ReferenceError`.\n```js\nconst x = 'global'\nfunction outer() {\n  const x = 'outer'\n  function inner() { console.log(x) }   // looks in inner \u2192 not found \u2192 outer \u2192 found 'outer'\n  return inner\n}\nouter()()    // \u2192 'outer'\n```\n```\ninner scope \u2500\u2500\u25ba outer scope \u2500\u2500\u25ba global scope \u2500\u2500\u25ba (not found) ReferenceError\n```\n\n## 17.3 Hoisting and the Temporal Dead Zone \ud83d\udfe1\n**Hoisting:** before running a scope, the engine **registers its declarations**, so they can seem to be used \"before\" their line.\n```js\nconsole.log(a)        // \u2192 undefined      var is hoisted and initialised with undefined\nvar a = 5\n\nsayHi()               // \u2192 'hi'           function declarations are hoisted WITH their body\nfunction sayHi() { console.log('hi') }\n\nconsole.log(b)        // \u274c ReferenceError: Cannot access 'b' before initialization\nlet b = 1             // b is in the TEMPORAL DEAD ZONE from the top of the block until this line\n\nhello()               // \u274c TypeError: hello is not a function   (var hoisted as undefined)\nvar hello = function () {}\n```\n`let`, `const` and `class` are hoisted but **not initialised** until their line; touching them earlier throws (the TDZ). That is safer than the silent `undefined` of `var`. Function expressions and arrow functions can't be called before their assignment.\n\n## 17.4 Execution context and the call stack \ud83d\udd34\nAn **execution context** is the environment where a piece of code runs. It holds:\n- a **variable environment** (var, function declarations),\n- a **lexical environment** (let/const, plus a pointer to the **outer** environment: this *is* the scope chain),\n- the value of **`this`**.\nTwo kinds: the **global execution context** (created once) and a **function execution context** (created on **every call**). Each has two phases: **creation** (hoist declarations, set up outer reference and `this`) then **execution** (run line by line).\nThe **call stack** is a last-in-first-out stack of contexts: calling a function **pushes**, returning **pops**.\n```js\nfunction third()  { console.log('third') }\nfunction second() { third() }\nfunction first()  { second() }\nfirst()\n```\n```\nstep 1  [global]\nstep 2  [global, first]\nstep 3  [global, first, second]\nstep 4  [global, first, second, third]   \u2192 prints \"third\"\nstep 5  third returns  \u2192 [global, first, second]\nstep 6  \u2026              \u2192 [global]\n```\n**Walk-through with data**\n```js\nlet total = 10\nfunction addTwice(n) { const doubled = n * 2; return doubled + total }\nconsole.log(addTwice(5))\n```\n1. **Global creation:** `total` registered (TDZ), `addTwice` stored as a function. 2. **Execution:** `total = 10`. 3. Call `addTwice(5)` \u2192 new function context: `n = 5`, `doubled` (TDZ), outer reference = global. 4. `doubled = 10`; `total` isn't local \u2192 follow the outer link to global \u2192 `10`; returns `20`. 5. Context is popped; `console.log` prints **20**.\n**Stack overflow:** infinite recursion keeps pushing \u2192 `RangeError: Maximum call stack size exceeded`. In DevTools \u2192 **Sources \u2192 Call Stack** you can see this live.\n\n## 17.5 Common mistakes and interview questions\n**Mistakes:** accidental globals (assigning to an undeclared name in sloppy mode) \u00b7 `var` in loops \u00b7 relying on hoisting.\n**Q1. What is hoisting?** Declarations are registered before execution; `var` \u2192 `undefined`, `let/const` \u2192 TDZ, function declarations \u2192 fully available. **Q2. What is the scope chain?** **Q3. What is the TDZ?** **Q4. Output?** `var x = 1; function f(){ console.log(x); var x = 2 } f()` \u2192 `undefined` (the local hoisted `x` shadows the outer). **Q5. What is the call stack?**\n**Exercises:** predict 8 hoisting snippets; draw the stack for three nested calls; reproduce and fix the `var` + `setTimeout` bug.\n\n## \u25b6 CODE STEP 17\nOpen `chat-logic.js` and put everything inside a module-style IIFE-free file using `const` only; confirm in DevTools **Sources \u2192 Scope** panel that `chats` shows under *Script* or *Module* scope, and step into `describeChat` with a breakpoint to watch the Call Stack and Local scope change.\n\n---\n\n# MODULE 18 \u2014 CLOSURES AND ADVANCED FUNCTIONS\n\n## 18.1 What is a closure? \ud83d\udfe1\nA **closure** is a function **together with the variables of the place where it was created**. It keeps using those variables even after the outer function has finished.\n**Analogy:** a backpack. The inner function carries the variables it needs wherever it goes.\n```js\nfunction makeCounter() {\n  let count = 0                 // lives in makeCounter's environment\n  return function () {          // the inner function \"closes over\" count\n    count++\n    return count\n  }\n}\nconst c1 = makeCounter()\nconsole.log(c1(), c1(), c1())   // \u2192 1 2 3\nconst c2 = makeCounter()\nconsole.log(c2())               // \u2192 1   (a separate environment, separate count)\n```\n**How it works internally:** every function object stores a hidden reference to the lexical environment in which it was defined. Normally an environment is garbage collected when its function returns, but `c1` still references it, so `count` stays alive.\n\n## 18.2 What closures are used for \ud83d\udfe1\n**Private data**\n```js\nfunction createWallet(initial) {\n  let balance = initial                         // no outside code can touch this\n  return { deposit: n => (balance += n), get: () => balance }\n}\nconst w = createWallet(100); w.deposit(50); w.get()   // \u2192 150\n```\n**Function factories**\n```js\nconst withPrefix = prefix => msg => `[${prefix}] ${msg}`\nconst apiLog = withPrefix('API'); apiLog('loaded')   // \u2192 '[API] loaded'\nconst authFetch = token => url => fetch(url, { headers: { Authorization: `Bearer ${token}` } })\n```\n**Handlers that remember context**\n```js\nchats.forEach(chat => row.addEventListener('click', () => openChat(chat.id)))   // each handler remembers its own chat\n```\n**Currying:** `const add = a => b => a + b; add(2)(3) // \u2192 5`.\n**Memoization** (cache results):\n```js\nfunction memoize(fn) {\n  const cache = new Map()\n  return (...args) => {\n    const key = JSON.stringify(args)\n    if (!cache.has(key)) cache.set(key, fn(...args))\n    return cache.get(key)\n  }\n}\n```\nVue's `computed` is memoization with automatic dependency tracking.\n\n## 18.3 Debounce and throttle \ud83d\udfe1 (search boxes, scroll handlers)\n**Debounce:** run only after the user **stops** triggering for N milliseconds.\n```js\nfunction debounce(fn, delay = 300) {\n  let timer                                   // closure variable shared by every call\n  return function (...args) {\n    clearTimeout(timer)                       // cancel the pending call\n    timer = setTimeout(() => fn.apply(this, args), delay)\n  }\n}\nconst onSearch = debounce(q => console.log('API call for', q), 400)\ninput.addEventListener('input', e => onSearch(e.target.value))\n```\nTyping \"ravi\": 4 keystrokes within 400 ms \u2192 the timer is reset each time \u2192 **one** call with `\"ravi\"` instead of four.\n**Throttle:** run at most once per interval.\n```js\nfunction throttle(fn, interval = 200) {\n  let last = 0\n  return (...args) => { const now = Date.now(); if (now - last >= interval) { last = now; fn(...args) } }\n}\nwindow.addEventListener('scroll', throttle(updateScrollButton, 100))\n```\n| | Debounce | Throttle |\n|---|---|---|\n| Fires | once, after calls stop | regularly while calls continue |\n| Use | search-as-you-type, autosave, validation | scroll, resize, mousemove |\n\n## 18.4 Common mistakes\n`var` in loops \u00b7 closures that keep huge objects/DOM nodes alive (leaks) \u00b7 **stale closures** (a callback capturing an old value; in Vue read `.value` at call time) \u00b7 forgetting to `clearTimeout`.\n\n## 18.5 Interview questions\n**Q1. What is a closure? Give a use case.** **Q2. Output?** `for (var i=0;i<3;i++){ setTimeout(()=>console.log(i),0) }` \u2192 `3 3 3`; fix with `let` or an IIFE. **Q3. Debounce vs throttle?** **Q4. Can closures cause memory leaks?** yes, by retaining large objects. **Q5. Implement `once(fn)`:** `const once = fn => { let done = false, r; return (...a) => done ? r : (done = true, r = fn(...a)) }`.\n**Exercises:** `makeCounter` with `reset`; memoised Fibonacci (time it); debounced search that logs; throttled scroll logger; `once`.\n\n## \u25b6 CODE STEP 18\n```js\nconst debouncedSearch = debounce(q => {\n  const result = sortedChats(filterChats(searchChats(chats, q), 'all'))\n  console.log('results for', q, '\u2192', result.map(c => c.buyerName))\n}, 300)\n// simulate typing\n;['r', 'ra', 'rav', 'ravi'].forEach((q, i) => setTimeout(() => debouncedSearch(q), i * 100))\n// \u2192 only ONE log, for 'ravi', about 300 ms after the last keystroke\n```\n\n---\n\n# MODULE 19 \u2014 THE `this` KEYWORD\n\n## 19.1 What is `this`? \ud83d\udfe1\n`this` is a special variable set **when a function is called**. It usually means **\"the object this function was called on.\"** (Arrow functions are the exception: they take `this` from where they were written.)\n**Rule of thumb: look at *how it is called*, not where it is written** (except arrows).\n| Call form | `this` is |\n|---|---|\n| `obj.method()` | `obj` (the object before the dot) |\n| `fn()` plain call | `undefined` (strict mode / modules) or `window` (sloppy) |\n| `new Fn()` | the new object |\n| `fn.call(x)`, `fn.apply(x)`, `fn.bind(x)()` | `x` |\n| arrow function | `this` of the surrounding scope |\n| DOM handler (regular function) | the element (`event.currentTarget`) |\n```js\nconst user = {\n  name: 'Ravi',\n  hello() { console.log(this.name) },\n  helloArrow: () => console.log(this.name),\n  later() {\n    setTimeout(function () { console.log(this.name) }, 0)   // \u2717 plain call \u2192 this lost\n    setTimeout(() => console.log(this.name), 0)             // \u2713 arrow keeps the outer this\n  },\n}\nuser.hello()        // \u2192 'Ravi'\nuser.helloArrow()   // \u2192 undefined   (arrow's this is the outer scope, not user)\nconst f = user.hello\nf()                 // \u2192 undefined / TypeError   (called without an object \u2192 this lost)\n```\n**Why `const f = user.hello; f()` fails:** the call has no object before the dot. This is the classic bug when passing methods as callbacks: `button.addEventListener('click', user.hello)` \u2192 `this` becomes the button.\n\n## 19.2 call, apply, bind \ud83d\udfe1\n```js\nfunction intro(greeting, punct) { return `${greeting}, I am ${this.name}${punct}` }\nconst p = { name: 'Asha' }\nintro.call(p, 'Hi', '!')       // \u2192 'Hi, I am Asha!'    (arguments listed)\nintro.apply(p, ['Hi', '!'])    // \u2192 same                (arguments as an array)\nconst bound = intro.bind(p, 'Hello')   // returns a NEW function with `this` fixed; doesn't call it\nbound('.')                     // \u2192 'Hello, I am Asha.'\n```\n`bind` fixes detached methods: `button.addEventListener('click', user.hello.bind(user))`.\n\n## 19.3 `this` in classes and in Vue \ud83d\udfe1\n```js\nclass Timer {\n  seconds = 0\n  tick = () => { this.seconds++ }          // arrow class field: always bound to the instance\n  start() { setInterval(this.tick, 1000) }\n}\n```\nIn **Vue 3 Composition API** (`<script setup>`) you hardly ever use `this`: no binding problems; that is one reason it's recommended. In **Options API** `this` is the component instance and Vue auto-binds `methods`, **but arrow functions inside `methods`/`computed` break it** (`this` isn't the component).\n\n## 19.4 Common mistakes and questions\n**Mistakes:** passing methods as callbacks \u00b7 arrow functions as object methods \u00b7 regular function inside a method \u00b7 `this` in a Vue Options API arrow.\n**Q1. How is `this` determined?** (table). **Q2. `call/apply/bind`?** **Q3. Arrow vs regular regarding `this`?** **Q4. Predict:** `const o = { n: 1, f() { return [1].map(() => this.n) } }; o.f()` \u2192 `[1]`.\n**Exercises:** fix four broken `this` snippets; implement your own `bind`; convert an Options API component's methods to Composition API.\n\n## \u25b6 CODE STEP 19\n```js\nclass ChatStore {\n  #chats = []\n  constructor(chats) { this.#chats = chats }\n  get unreadTotal() { return this.#chats.reduce((n, c) => n + c.unread, 0) }\n  markRead = (id) => { this.#chats = this.#chats.map(c => c.id === id ? { ...c, unread: 0 } : c) }   // arrow \u2192 safe as a callback\n}\nconst store = new ChatStore(chats)\nconst handler = store.markRead         // detached, but still works thanks to the arrow\nhandler(1); console.log(store.unreadTotal)   // \u2192 1\n```\n\n---\n\n# MODULE 20 \u2014 PROTOTYPES AND OBJECT-ORIENTED JAVASCRIPT\n\n## 20.1 Prototypes \ud83d\udd34\nEvery object has a hidden link, `[[Prototype]]`, to another object: its **prototype**. When you read a property JS looks on the object, then on its prototype, then that prototype's prototype\u2026 the **prototype chain**, ending at `null`.\n```js\nconst animal = { eats: true, speak() { return `${this.name} makes a sound` } }\nconst dog = Object.create(animal)     // dog's prototype is animal\ndog.name = 'Rex'\ndog.speak()                           // \u2192 'Rex makes a sound'   (found on animal via the chain)\ndog.hasOwnProperty('eats')            // \u2192 false  (inherited, not own)\nObject.getPrototypeOf(dog) === animal // \u2192 true   (`__proto__` is the old accessor)\n```\n```\ndog \u2500\u2500\u25ba animal \u2500\u2500\u25ba Object.prototype \u2500\u2500\u25ba null\narr \u2500\u2500\u25ba Array.prototype \u2500\u2500\u25ba Object.prototype \u2500\u2500\u25ba null     \u2190 map, push, filter live on Array.prototype and are SHARED\n```\n`prototype` (the property on **functions**) is the object that becomes the `[[Prototype]]` of instances created with `new`.\n\n## 20.2 Constructor functions and `new` \ud83d\udd34\n```js\nfunction User(name) { this.name = name }\nUser.prototype.hello = function () { return `Hi ${this.name}` }\nconst u = new User('Ravi')\n```\n`new` performs four steps: (1) create an empty object, (2) link its prototype to `User.prototype`, (3) call `User` with `this` = that object, (4) return it (unless the function returns another object). So `u.__proto__ === User.prototype`.\n\n## 20.3 Classes (ES6) \ud83d\udfe1\nClasses are **syntax on top of prototypes**.\n```js\nclass Person {\n  #secret = 'hidden'                   // private field (really inaccessible outside)\n  static count = 0                     // belongs to the class, not instances\n  constructor(name) { this.name = name; Person.count++ }\n  hello() { return `Hi ${this.name}` }               // placed on Person.prototype\n  get upper() { return this.name.toUpperCase() }     // getter\n  set upper(v) { this.name = v.toLowerCase() }       // setter\n  static create(n) { return new Person(n) }          // Person.create('x')\n  #helper() { return this.#secret }                  // private method\n}\nclass Seller extends Person {\n  constructor(name, shop) { super(name); this.shop = shop }    // super() must run before using this\n  hello() { return `${super.hello()} from ${this.shop}` }       // override and call the parent\n}\nnew Seller('Ravi', 'ShoeMart').hello()   // \u2192 'Hi Ravi from ShoeMart'\n```\n- **Encapsulation:** `#private` members.\n- **Inheritance:** `extends` / `super`.\n- **Polymorphism:** different classes implementing the same method; callers don't care which (`shape.area()`).\n- `typeof Person` is `'function'`; classes aren't hoisted like function declarations.\n\n### Java OOP vs JavaScript OOP\n| | Java | JavaScript |\n|---|---|---|\n| Model | class-based | prototype-based; classes are sugar |\n| Interfaces / abstract classes | yes | no (convention, or TypeScript) |\n| Access modifiers | public/private/protected | `#private` only; `_x` convention |\n| Overloading | yes | no (last definition wins) |\n| `this` | always the instance | depends on the call (Module 19) |\n| Typing | static | dynamic (TypeScript adds static) |\n**Prefer composition over inheritance** in frontend code: Vue uses components and composables, not class hierarchies.\n\n## 20.4 Mistakes and questions\n**Mistakes:** forgetting `super()` (ReferenceError) \u00b7 arrow vs method `this` in classes \u00b7 changing built-in prototypes \u00b7 using `__proto__` in new code.\n**Q1. What is the prototype chain?** **Q2. Class vs constructor function?** **Q3. What does `new` do?** **Q4. Where do array methods live?** `Array.prototype`. **Q5. Output?** `class A { static x = 1 } class B extends A {}; console.log(B.x)` \u2192 `1` (statics inherit).\n**Exercises:** `Shape \u2192 Circle/Rect` with polymorphic `area()` \u00b7 reimplement `new` as a function \u00b7 an `EventEmitter` class with a private listeners map.\n\n## \u25b6 CODE STEP 20\n```js\nclass Message {\n  constructor({ id, sender, text, createdAt = new Date().toISOString() }) { Object.assign(this, { id, sender, text, createdAt }) }\n  get isMine() { return this.sender === 'SELLER' }\n}\nclass OrderMessage extends Message {\n  constructor(data, order) { super(data); this.order = order }\n}\nconst m = new OrderMessage({ id: 5, sender: 'SELLER', text: '' }, { id: 'A1', total: 1200 })\nconsole.log(m.isMine, m.order.id)     // \u2192 true 'A1'\n```\n\n---\n\n# MODULE 21 \u2014 ES6+ AND MODERN JAVASCRIPT\n\n(`let/const`, arrows, template literals, destructuring, spread/rest are covered earlier. Here: the rest of modern JS.)\n\n## 21.1 Modules \ud83d\udfe1\nEach file is a **module** with its own scope; you share things with `export` and bring them in with `import`.\n```js\n// math.js\nexport const PI = 3.14                       // named export\nexport function add(a, b) { return a + b }\nexport default function multiply(a, b) { return a * b }    // one default per file\n\n// app.js\nimport multiply, { add, PI as pi } from './math.js'   // default (any name) + named (exact name, or renamed)\nimport * as math from './math.js'                      // everything under one name\nconst mod = await import('./heavy.js')                 // dynamic import \u2192 loads on demand (code splitting)\n```\nIn HTML: `<script type=\"module\" src=\"app.js\">`: deferred, strict mode, own scope. Named exports are preferred (auto-import, refactor-safe, tree-shakeable). Vue routes use dynamic imports to lazy-load pages. **CommonJS** (`require`, `module.exports`) is the older Node style you'll see in tooling configs.\n\n## 21.2 Set and Map; WeakMap and WeakSet \ud83d\udfe1\n```js\nconst ids = new Set([1, 2, 2, 3])          // unique values \u2192 {1,2,3}\nids.add(4); ids.has(2); ids.delete(1); ids.size\nconst unique = [...new Set(array)]         // dedupe\n\nconst m = new Map()                        // any type as key, keeps insertion order\nm.set('a', 1).set(obj, 'x'); m.get('a'); m.has('a'); m.size\nfor (const [k, v] of m) console.log(k, v)\n```\n| | Object | Map |\n|---|---|---|\n| Keys | strings/symbols | any type |\n| Size | manual | `.size` |\n| Frequent add/remove | slower | optimised |\n**WeakMap/WeakSet** hold **objects weakly**: if nothing else references the key it can be garbage collected; not iterable. Used for per-object private data and caches without leaks (Vue's reactivity registry uses a WeakMap).\n\n## 21.3 Symbols, iterators, generators \ud83d\udd34\n```js\nconst id = Symbol('id')            // always unique, even with the same description\nconst obj = { [id]: 1 }            // not visible to for...in / JSON\n\n// Iterable protocol: an object with [Symbol.iterator]() that returns { next() \u2192 { value, done } }\nconst range = { from: 1, to: 3, [Symbol.iterator]() {\n  let n = this.from, end = this.to\n  return { next: () => n <= end ? { value: n++, done: false } : { value: undefined, done: true } }\n} }\nconsole.log([...range])            // \u2192 [1, 2, 3]   (for...of and spread understand iterables)\n\nfunction* ids() { let i = 1; while (true) yield i++ }     // generator: pauses at yield, resumes on next()\nconst it = ids(); it.next().value; it.next().value        // \u2192 1, 2\n```\n`for...of` consumes any iterable (arrays, strings, Map, Set, NodeList, generators). You will rarely write generators in app code, but `async/await` is built on the same pause/resume idea.\n\n## 21.4 Other modern features worth knowing \ud83d\udfe2\n`Array.at(-1)`, `Object.hasOwn`, `structuredClone`, `replaceAll`, `padStart`, `toSorted/toReversed`, numeric separators `1_000_000`, logical assignment `||= &&= ??=`, top-level `await` in modules, optional catch binding `catch { }`, `Intl` for formatting:\n```js\nnew Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(1299)   // \u2192 '\u20b91,299.00'\nnew Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date())\n```\n**Strict mode** (`'use strict'`; automatic in modules and classes) turns silent mistakes into errors.\n\n## 21.5 Modern coding practices\n`const` by default \u00b7 named exports \u00b7 small pure functions \u00b7 immutable updates \u00b7 `async/await` over callbacks \u00b7 optional chaining for API data \u00b7 no globals \u00b7 descriptive names \u00b7 ESLint + Prettier.\n\n## 21.6 Questions and exercises\n**Q1. Named vs default export?** **Q2. Set vs array for uniqueness/lookup?** **Q3. Map vs object?** **Q4. Why WeakMap?** **Q5. Iterator vs iterable?** **Q6. Benefit of dynamic import?** load code on demand.\n**Exercises:** word-frequency counter with `Map` \u00b7 a `range()` generator \u00b7 split utilities into named exports and import them in `main.js` \u00b7 dynamic-import a heavy module on button click.\n\n## \u25b6 CODE STEP 21 \u2014 split the logic into modules\n```js\n// chat-utils.js\nexport const totalUnread = chats => chats.reduce((n, c) => n + c.unread, 0)\nexport const searchChats = (list, q) => { const s = q.trim().toLowerCase(); return list.filter(c => c.buyerName.toLowerCase().includes(s) || c.lastMessage.toLowerCase().includes(s)) }\nexport const sortedChats = list => [...list].sort((a, b) => new Date(b.lastMessageAt) - new Date(a.lastMessageAt))\n// main.js\nimport { totalUnread, searchChats, sortedChats } from './chat-utils.js'\n```\nLoad `main.js` with `<script type=\"module\">`. This is exactly how the project will be organised in Vue (`utils/`, `services/`, `stores/`).\n\n---\n**Next \u2192 `03-js-3.md`: Modules 22\u201325 (Async, Event Loop, Errors, Tooling).**\n\n\n# PART 3 (continued) \u2014 ASYNC JAVASCRIPT, EVENT LOOP, ERRORS, TOOLING\n\n---\n\n# MODULE 22 \u2014 ASYNCHRONOUS JAVASCRIPT \u2b50\n\n## 22.1 The problem: JavaScript has one thread \ud83d\udfe2\nJavaScript can do **one thing at a time**. But some tasks take a long time and are **not computed by your code**: network requests to your Spring Boot API, timers, reading files, waiting for a user click.\n- **Synchronous (blocking):** each line waits for the previous one to finish.\n- **Asynchronous (non-blocking):** start the slow task, keep running other code, handle the result **later**.\n**Analogy.** Synchronous: you stand at the caf\u00e9 counter until your coffee is ready; nobody behind you is served. Asynchronous: you receive a token number, sit down, and the barista calls it when ready.\n```js\nconsole.log('1 start')\nsetTimeout(() => console.log('2 timer'), 1000)\nconsole.log('3 end')\n// \u2192 1 start\n// \u2192 3 end\n// \u2192 (one second later) 2 timer\n```\nIf a network request were synchronous, the whole page would freeze (no scrolling, no clicking) until the server replied. Async keeps the UI alive. **Key idea:** JS asks the *browser* to do the waiting (timers, networking), and the browser calls your function back when it's done. Module 23 shows exactly how.\n\n## 22.2 Callbacks and callback hell \ud83d\udfe1\nA **callback** is a function you pass in to be called when the task finishes.\n```js\nfunction getUser(id, cb) { setTimeout(() => cb(null, { id, name: 'Ravi' }), 500) }\ngetUser(1, (err, user) => {\n  if (err) return console.error(err)\n  getOrders(user.id, (err, orders) => {\n    if (err) return console.error(err)\n    getItems(orders[0].id, (err, items) => {       // \u2190 \"pyramid of doom\"\n      console.log(items)\n    })\n  })\n})\n```\nProblems: deep nesting, error handling repeated at every level, hard to run steps in parallel, and \"inversion of control\" (you trust the other code to call back once). You will meet this style in older code (XHR, jQuery, old Node).\n\n## 22.3 Promises \ud83d\udfe1\nA **Promise** is an object representing a value that will exist **later** (or an error).\n**States:** `pending` \u2192 `fulfilled` (success, has a value) **or** `rejected` (failure, has a reason). Once settled it never changes.\n```js\nconst p = new Promise((resolve, reject) => {\n  setTimeout(() => {\n    const ok = true\n    ok ? resolve('data') : reject(new Error('failed'))\n  }, 500)\n})\np.then(value => console.log(value))      // runs when fulfilled\n .catch(error => console.error(error))   // runs when rejected (anywhere above in the chain)\n .finally(() => console.log('done'))     // always runs; receives no value\n```\n**Chaining:** `.then()` returns a **new promise**. What you `return` becomes the next step's value; returning a promise makes the chain wait for it; a thrown error skips to the next `.catch`.\n```js\ngetUserP(1)\n  .then(user => getOrdersP(user.id))      // returns a promise \u2192 chain waits for it\n  .then(orders => orders[0].id)           // returns a plain value\n  .then(id => console.log(id))\n  .catch(err => console.error('something above failed:', err))\n```\nFlat instead of a pyramid. **Common bug:** forgetting `return` inside `.then` \u2192 the next step receives `undefined`.\n\n### Combinators\n| Method | Fulfils when | Rejects when | Use it for |\n|---|---|---|---|\n| `Promise.all([...])` | **all** fulfil \u2192 array in the same order | **first** rejection | independent calls that must all succeed (load user + orders) |\n| `Promise.allSettled([...])` | all settle \u2192 `[{status, value|reason}]` | never | partial success is OK (dashboard widgets) |\n| `Promise.race([...])` | the first to settle | the first to reject | timeouts |\n| `Promise.any([...])` | first to **fulfil** | all reject (`AggregateError`) | fastest of several mirrors |\n```js\nconst [users, posts] = await Promise.all([ getJson('/users'), getJson('/posts') ])    // parallel\nconst results = await Promise.allSettled(ids.map(id => getJson(`/orders/${id}`)))\nconst failed = results.filter(r => r.status === 'rejected')\nconst timeout = ms => new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))\nconst data = await Promise.race([getJson('/slow'), timeout(5000)])\n```\n\n## 22.4 async / await \ud83d\udfe1 (the modern standard)\n- `async` marks a function that **always returns a Promise**.\n- `await` **pauses that function** (not the thread!) until the promise settles, then gives you the value (or throws the rejection).\nIt is syntax over promises: code that *reads* synchronous but *runs* asynchronously.\n```js\nasync function loadPost(id) {\n  try {\n    const res = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)   // (1)\n    if (!res.ok) throw new Error(`HTTP ${res.status}`)                            // (2)\n    const post = await res.json()                                                  // (3)\n    return post.title                                                              // (4)\n  } catch (err) {\n    console.error('failed:', err.message)                                          // (5)\n    return null\n  } finally {\n    console.log('cleanup: hide the spinner')                                       // (6)\n  }\n}\nloadPost(1).then(title => console.log(title))\n// \u2192 cleanup: hide the spinner\n// \u2192 sunt aut facere repellat provident occaecati excepturi optio reprehenderit\n```\n**Line by line:** (1) start the request; the function pauses, the rest of the program continues; it resumes with a `Response` once the **headers** arrive. (2) `fetch` only rejects on **network failure**, **not** on 404/500, so check `res.ok`. (3) reading the body is also async. (4) the returned value becomes the promise's result. (5) any rejected `await` or `throw` lands here. (6) `finally` always runs: stop the loading spinner here.\n`await` works only inside `async` functions (or at the top level of a module).\n\n### Sequential vs parallel \u26a0 (a very common performance bug)\n```js\n// \u274c sequential: ~2 s total even though the calls are independent\nconst a = await getA()     // 1 s\nconst b = await getB()     // 1 s\n\n// \u2705 parallel: ~1 s\nconst [a, b] = await Promise.all([getA(), getB()])\n\n// \u2705 start both, await later\nconst pa = getA(); const pb = getB()\nconst a2 = await pa; const b2 = await pb\n```\nUse sequential **only** when step 2 needs the result of step 1.\n```js\nitems.forEach(async i => await save(i))        // \u274c forEach does not wait: the code after it runs immediately\nfor (const i of items) await save(i)           // \u2705 one after another\nawait Promise.all(items.map(save))             // \u2705 all at once (limit concurrency for hundreds of items)\n```\n\n## 22.5 Error handling \ud83d\udfe1\n```js\nasync function safe(promise) { try { return [await promise, null] } catch (e) { return [null, e] } }\nconst [data, err] = await safe(getJson('/x'))\n```\nAn unhandled rejection prints `Uncaught (in promise)`. Always handle errors (`try/catch` with `await`, or `.catch`) and add a global handler for logging. Reject with `Error` objects. A `catch` that silently swallows errors hides bugs.\n\n## 22.6 Cancelling requests with AbortController \ud83d\udfe1\n**Problem:** the user types fast \u2192 many requests; an older response can arrive **after** a newer one (a *race condition*) and show stale results. **Fix:** cancel the previous request.\n```js\nlet controller\nasync function search(q) {\n  controller?.abort()                          // cancel the in-flight request\n  controller = new AbortController()\n  try {\n    const res = await fetch(`/api/chats?q=${encodeURIComponent(q)}`, { signal: controller.signal })\n    return await res.json()\n  } catch (e) {\n    if (e.name === 'AbortError') return        // expected, not a real error\n    throw e\n  }\n}\nfetch(url, { signal: AbortSignal.timeout(5000) })   // built-in timeout\n```\nAlso used to cancel when a Vue component unmounts or the route changes.\n\n## 22.7 A real API example (JSONPlaceholder)\n```js\nasync function loadDashboard() {\n  const base = 'https://jsonplaceholder.typicode.com'\n  const [users, posts] = await Promise.all([\n    fetch(`${base}/users`).then(r => r.json()),\n    fetch(`${base}/posts?_limit=3`).then(r => r.json()),\n  ])\n  return posts.map(p => ({ id: p.id, title: p.title.slice(0, 20), author: users.find(u => u.id === p.userId)?.name ?? 'Unknown' }))\n}\nloadDashboard().then(console.table)\n// \u2192 table with columns id | title | author  (3 rows, authors joined from /users)\n```\n\n## 22.8 Common mistakes\nNot checking `res.ok` \u00b7 forgetting `await` (you print `Promise { <pending> }`) \u00b7 sequential awaits for independent calls \u00b7 `await` inside `forEach` \u00b7 unhandled rejections \u00b7 no loading/error state in the UI \u00b7 not cancelling stale requests \u00b7 mixing `.then` chains and `await` in a confusing way.\n\n## 22.9 Interview questions\n**Q1. Callback vs promise vs async/await?** **Q2. Does `await` block the thread?** No; only the async function is suspended; the rest of the program runs. **Q3. What does an async function return?** always a promise (a thrown error \u2192 rejected promise). **Q4. all vs allSettled vs race vs any?** (table). **Q5. Why doesn't `fetch` reject on 404?** it resolves whenever an HTTP response is received; only network errors reject. **Q6. Three requests in parallel with individual failures handled?** `allSettled`. **Q7. How do you cancel a fetch?** AbortController.\n\n## 22.10 Exercises\n`sleep(ms)` helper \u00b7 fetch posts + comments in parallel \u00b7 `retry(fn, times)` with delay \u00b7 `timeout(promise, ms)` \u00b7 a search box with debounce + abort.\n\n## \u25b6 CODE STEP 22 \u2014 a mock API with delay and failures\n```js\nconst sleep = ms => new Promise(r => setTimeout(r, ms))\nconst fakeApi = {\n  async listChats({ q = '', status = 'all' } = {}) {\n    await sleep(400)\n    return { content: sortedChats(filterChats(searchChats(chats, q), status)), totalElements: chats.length }\n  },\n  async sendMessage(chatId, text) {\n    await sleep(300)\n    if (Math.random() < 0.2) { const e = new Error('Server error'); e.status = 500; throw e }\n    return { id: Date.now(), chatId, sender: 'SELLER', text, createdAt: new Date().toISOString() }\n  },\n}\nasync function main() {\n  const page = await fakeApi.listChats({ q: 'r' })\n  console.log(page.content.map(c => c.buyerName))\n  try { console.log(await fakeApi.sendMessage(1, 'Hello')) } catch (e) { console.error('failed', e.status) }\n}\nmain()\n```\nThe mock mirrors a Spring `Page` response (`content`, `totalElements`), so swapping to the real API later changes one import, not your UI code.\n\n---\n\n# MODULE 23 \u2014 THE JAVASCRIPT EVENT LOOP \u2b50\n\n## 23.1 The pieces \ud83d\udfe1\nThe JavaScript **language** is single-threaded. The **runtime** (the browser) provides the rest.\n```\n \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Browser \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n \u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510    \u2502\n \u2502  \u2502  CALL STACK    \u2502          \u2502  WEB APIs  (work OUTSIDE JS)      \u2502    \u2502\n \u2502  \u2502  your code     \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba \u2502  timers \u00b7 fetch/network \u00b7 DOM     \u2502    \u2502\n \u2502  \u2502  runs here     \u2502 hand off \u2502  events \u00b7 geolocation \u2026           \u2502    \u2502\n \u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25b2\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518    \u2502\n \u2502          \u2502  EVENT LOOP: \"is the stack empty?\"   \u2502 when finished        \u2502\n \u2502          \u2502  then take work from the queues      \u25bc                      \u2502\n \u2502          \u2502            \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510     \u2502\n \u2502          \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502 MICROTASK queue (priority; drained fully)\u2502     \u2502\n \u2502          \u2502            \u2502 promise .then/.catch/.finally, await     \u2502     \u2502\n \u2502          \u2502            \u2502 continuations, queueMicrotask            \u2502     \u2502\n \u2502          \u2502            \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524     \u2502\n \u2502          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502 TASK / MACROTASK queue (one per turn)    \u2502     \u2502\n \u2502                       \u2502 setTimeout, setInterval, DOM events, \u2026   \u2502     \u2502\n \u2502                       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2502\n \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n- **Call stack:** where synchronous code executes (Module 17).\n- **Web APIs:** browser features that do slow work **outside** your JS thread.\n- **Macrotask (task) queue:** callbacks from timers, UI events, etc.\n- **Microtask queue:** promise reactions (`.then`, `.catch`, code after `await`), `queueMicrotask`, `MutationObserver`.\n- **Event loop:** an endless loop that checks the stack and feeds it from the queues.\n\n## 23.2 The algorithm \ud83d\udfe1\n1. Run the current script/task until the **call stack is empty**.\n2. **Drain the entire microtask queue** (including microtasks added while draining).\n3. The browser **may render** (style \u2192 layout \u2192 paint; `requestAnimationFrame` callbacks run just before).\n4. Take **one** macrotask from the queue \u2192 go to step 1.\n**Why Promise callbacks run before `setTimeout(\u2026, 0)`:** after the current task finishes, the engine empties the microtask queue completely before it picks the next macrotask. A `setTimeout` callback is a macrotask; a `.then` callback is a microtask. Also `setTimeout(0)` isn't \"now\": it means \"after at least 0 ms, when the loop gets to it\" (browsers clamp nested timers to \u22654 ms).\n\n## 23.3 Execution order, with a full trace \ud83d\udfe1\n```js\nconsole.log('1')\nsetTimeout(() => console.log('2 timeout'), 0)\nPromise.resolve().then(() => console.log('3 promise'))\nqueueMicrotask(() => console.log('4 microtask'))\nconsole.log('5')\n```\n**Output:** `1`, `5`, `3 promise`, `4 microtask`, `2 timeout`.\n**Trace:**\n| Step | Stack | Microtasks | Macrotasks | Printed |\n|---|---|---|---|---|\n| run script | log 1 | | | `1` |\n| `setTimeout` | | | [timeout] | |\n| `.then` | | [promise] | [timeout] | |\n| `queueMicrotask` | | [promise, microtask] | [timeout] | |\n| log 5 | | | | `5` |\n| stack empty \u2192 drain microtasks | | | | `3 promise`, `4 microtask` |\n| next macrotask | | | | `2 timeout` |\n\n### async/await follows the same rules\n```js\nasync function f() {\n  console.log('A')\n  await null                 // everything after await is a microtask continuation\n  console.log('B')\n}\nconsole.log('start'); f(); console.log('end')\n// \u2192 start, A, end, B\n```\n`await x` is roughly `Promise.resolve(x).then(restOfTheFunction)`. Code **before** the first `await` runs synchronously.\n\n### A harder prediction\n```js\nconsole.log('a')\nsetTimeout(() => console.log('b'), 0)\nnew Promise(res => { console.log('c'); res() })\n  .then(() => { console.log('d'); setTimeout(() => console.log('e'), 0) })\n  .then(() => console.log('f'))\nconsole.log('g')\n```\n**Output:** `a c g d f b e`. Why: the `Promise` executor runs **synchronously** (`c`). The `.then` callbacks are microtasks (`d`, then the chained `f`). `b` was queued as a macrotask before `e`, so `b` runs before `e`.\n\n## 23.4 Blocking the loop \ud83d\udfe1\n```js\nbutton.onclick = () => { const end = Date.now() + 3000; while (Date.now() < end) {} }   // UI frozen for 3 s\n```\nWhile the stack is busy, **nothing else happens**: no clicks, no timers, no rendering. Fixes: split work into chunks (`setTimeout`/`requestIdleCallback`), move heavy computation to a **Web Worker**, paginate or virtualise data. An endless chain of microtasks (a promise that keeps scheduling itself) also starves rendering.\n\n## 23.5 Timers, rendering and Vue \ud83d\udfe1\n- `setInterval(fn, 1000)` can drift or pile up; for work that takes time prefer a recursive `setTimeout`. **Always** `clearInterval/clearTimeout` (in Vue: `onUnmounted`). Background tabs throttle timers (~1 s).\n- `requestAnimationFrame(cb)` runs before the next paint (smooth animation).\n- Several DOM changes in the same task produce **one** repaint at the end. To show a spinner before heavy synchronous work, yield first: `await new Promise(r => setTimeout(r))`.\n- Vue **batches** DOM updates in a microtask. That's why you need `await nextTick()` to read the updated DOM after changing state (Module 33).\n\n## 23.6 Interview questions and predictions\n**Q1. Explain the event loop.** (23.1\u201323.2). **Q2. Microtask vs macrotask?** **Q3. Why does `Promise.then` run before `setTimeout(0)`?** **Q4. Does `await` block?** no.\n**Q5. Output?**\n```js\nsetTimeout(() => console.log(1), 0)\nPromise.resolve().then(() => console.log(2))\n;(async () => { console.log(3); await 0; console.log(4) })()\nconsole.log(5)\n```\n\u2192 `3, 5, 2, 4, 1` (3 and 5 are synchronous; then microtasks in the order queued: `.then`\u21922, await continuation\u21924; then the timeout\u21921).\n**Q6. How keep a page responsive while processing 100,000 rows?** chunking, Web Worker, virtualisation, pagination.\n**Exercises:** predict 8 mixed snippets then verify in the Console \u00b7 write a blocking loop and watch the UI freeze \u00b7 convert it to chunked processing \u00b7 compare `requestAnimationFrame` and `setTimeout` for animation.\n\n## \u25b6 CODE STEP 23\nPredict the output order, then run:\n```js\nconsole.log('click')\nfakeApi.sendMessage(1, 'hi').then(() => console.log('response'))\nsetTimeout(() => console.log('timer'), 0)\nPromise.resolve().then(() => console.log('micro'))\nconsole.log('after')\n```\nExpected: `click`, `after`, `micro`, `timer`, and later `response` (after the 300 ms delay). Write down *why* for each line.\n\n---\n\n# MODULE 24 \u2014 ERROR HANDLING AND DEBUGGING\n\n## 24.1 Kinds of errors \ud83d\udfe2\n| Type | When | Example |\n|---|---|---|\n| **Syntax error** | code can't be parsed, nothing runs | `let = ;` \u2192 `SyntaxError: Unexpected token` |\n| **Runtime error** | thrown while running | `null.x` \u2192 `TypeError` |\n| **Logical error** | runs fine but gives the wrong result | `<` instead of `<=` |\nBuilt-in error types: `ReferenceError` (undeclared name), `TypeError` (wrong type / `undefined is not a function`), `RangeError` (out of range, stack overflow), `SyntaxError` (also `JSON.parse` of invalid text), `URIError`, `AggregateError`.\n**Reading an error:** *\"Cannot read properties of undefined (reading 'name') at ChatItem.vue:12\"* \u2192 the thing **before** `.name` is `undefined` on line 12. Find the first stack-trace line that is in **your** code.\n\n## 24.2 throw, try / catch / finally \ud83d\udfe2\n```js\nfunction parseJson(text) {\n  try {\n    return JSON.parse(text)                 // may throw\n  } catch (err) {                           // runs only if something above threw\n    console.error('Bad JSON:', err.message)\n    return null\n  } finally {\n    console.log('always runs')              // cleanup\n  }\n}\nfunction withdraw(balance, amount) {\n  if (amount > balance) throw new Error('Insufficient funds')\n  return balance - amount\n}\n```\n`try/catch` catches **synchronous** errors and errors from `await` inside it. It does **not** catch errors in callbacks that run later (`setTimeout`) or in promises you didn't await.\n**Custom errors**\n```js\nclass ApiError extends Error {\n  constructor(message, status, body) { super(message); this.name = 'ApiError'; this.status = status; this.body = body }\n}\ntry { throw new ApiError('Not found', 404) }\ncatch (e) { if (e instanceof ApiError && e.status === 404) showNotFound(); else throw e }    // rethrow what you can't handle\n```\nError objects have `name`, `message`, `stack`, and `cause` (`new Error('x', { cause: err })`).\n\n## 24.3 Debugging with Chrome DevTools \ud83d\udfe1\n- **Console:** `console.log`, `console.table(arr)`, `console.error/warn`, `console.group`, `console.time('x')`/`timeEnd`, `console.assert`, `console.dir(obj)`, `console.trace()`.\n- **Sources panel:** click a line number to set a **breakpoint**; trigger the code; execution pauses. Inspect **Scope** (local/closure/global variables) and **Call Stack**. Step: **Resume** (F8), **Step over** (F10), **Step into** (F11), **Step out** (Shift+F11). Extras: *conditional breakpoints* (right-click: `user.id === 7`), *logpoints*, the `debugger;` statement, *Pause on exceptions*, *XHR/fetch breakpoints*, *Event listener breakpoints*, **Watch** expressions.\n- **Network panel:** URL, method, payload, status, response and timing: half of \"frontend bugs\" are API problems you can see here.\n- **Source maps:** build tools minify/bundle your code; a `.map` file lets DevTools show your original `.vue`/`.js` source in errors. Don't publish private source maps; upload them to your error-monitoring service.\n**Debug loop:** reproduce \u2192 read the error and stack \u2192 check the data (breakpoint/log) \u2192 check Network \u2192 isolate the smallest failing case \u2192 fix \u2192 add a test.\n\n## 24.4 Production error handling \ud83c\udfed\n```js\nwindow.addEventListener('error', e => report(e.error))\nwindow.addEventListener('unhandledrejection', e => report(e.reason))\n// Vue: app.config.errorHandler = (err, instance, info) => report(err, info)\n```\n- Send errors to a monitoring service (Sentry, Datadog) with release version, route, a user id (no sensitive data) and breadcrumbs.\n- Show **friendly** messages (not stack traces) and offer a retry.\n- Separate expected errors (400 validation, 401 \u2192 login, 404) from unexpected ones (5xx, bugs).\n- Never log tokens or passwords.\n\n## 24.5 Mistakes and questions\n**Mistakes:** empty `catch {}` \u00b7 catching and not rethrowing \u00b7 throwing strings \u00b7 expecting `try/catch` to catch async callbacks \u00b7 logging secrets.\n**Q1. Syntax vs runtime errors?** **Q2. What does `finally` do if `try` has a `return`?** it still runs. **Q3. How do you catch async errors?** `await` inside `try/catch` or `.catch`. **Q4. What are source maps?** **Q5. How would you debug \"undefined is not a function\"?** read the stack, set a breakpoint, inspect the value's type, check imports/`this`.\n**Exercises:** debug the planted bugs in `buggy.js` using only breakpoints \u00b7 write `ApiError` and map status codes to messages \u00b7 add a global error handler.\n\n## \u25b6 CODE STEP 24\n```js\nclass ApiError extends Error {\n  constructor(message, status) { super(message); this.name = 'ApiError'; this.status = status }\n}\nconst userMessage = e => e.status === 401 ? 'Please log in again.' : e.status >= 500 ? 'Server problem. Please retry.' : e.message\nasync function sendWithRetry(chatId, text, tries = 2) {\n  for (let i = 0; ; i++) {\n    try { return await fakeApi.sendMessage(chatId, text) }\n    catch (e) { if (i >= tries) throw new ApiError(userMessage(e), e.status); await sleep(300 * 2 ** i) }\n  }\n}\nsendWithRetry(1, 'Hello').then(console.log).catch(e => console.error(e.name, e.message))\n```\n\n---\n\n# MODULE 25 \u2014 JAVASCRIPT MODULES AND TOOLING\n\n## 25.1 Why tooling? \ud83d\udfe1\nBrowsers can load modules, but real apps have hundreds of files, npm packages, `.vue` files, CSS preprocessing and performance needs. **Tooling transforms your source into optimised bundles** for the browser.\n\n## 25.2 Key concepts\n| Term | Meaning |\n|---|---|\n| **ES modules** | native `import/export` |\n| **CommonJS** | `require`/`module.exports` (Node legacy) |\n| **Bundler** | combines modules, removes unused code (**tree shaking**), splits into chunks (webpack, Rollup, esbuild) |\n| **Transpiler** | rewrites newer syntax for older targets (Babel, TypeScript, the Vue SFC compiler) |\n| **Vite** | dev server using native ES modules (instant start, fast HMR) + Rollup for production builds |\n| **HMR** | hot module replacement: edit code, the browser updates without a full reload |\n| **npm** | package manager and registry |\n\n## 25.3 npm and package.json \ud83d\udfe1\n```bash\nnpm create vue@latest my-app    # scaffold a Vue 3 + Vite project\ncd my-app && npm install        # install the dependencies listed in package.json\nnpm run dev                     # dev server (http://localhost:5173)\nnpm run build                   # production bundle \u2192 dist/\nnpm install axios               # add a dependency\nnpm install -D vitest           # add a dev-only dependency\n```\n```json\n{\n  \"name\": \"seller-chat\",\n  \"version\": \"1.0.0\",\n  \"type\": \"module\",\n  \"scripts\": { \"dev\": \"vite\", \"build\": \"vite build\", \"preview\": \"vite preview\", \"test\": \"vitest\", \"lint\": \"eslint .\" },\n  \"dependencies\": { \"vue\": \"^3.5.0\", \"pinia\": \"^2.2.0\", \"vue-router\": \"^4.4.0\" },\n  \"devDependencies\": { \"vite\": \"^5.4.0\", \"vitest\": \"^2.0.0\", \"eslint\": \"^9.0.0\", \"prettier\": \"^3.0.0\" }\n}\n```\n- **dependencies:** needed at runtime in the bundle. **devDependencies:** only for build/test/lint.\n- **Version ranges:** `^3.5.0` = any 3.x \u2265 3.5.0; `~3.5.0` = patch updates only; exact pins are safest.\n- **package-lock.json** records the *exact* installed tree: **commit it**; use `npm ci` in CI for reproducible installs. **Never commit `node_modules/`.**\n- Security: `npm audit`, keep dependencies updated, avoid abandoned packages (supply-chain risk).\n\n## 25.4 Builds, environments and env variables \ud83d\udfe1\n- **Development:** unminified, source maps, HMR, detailed Vue warnings.\n- **Production:** minified, tree-shaken, hashed filenames (`app.3f9a1c.js` for long-term caching), no dev warnings.\n- Vite loads `.env`, `.env.development`, `.env.production`; only variables starting with `VITE_` reach client code:\n```\nVITE_API_BASE_URL=http://localhost:8080/api\n```\n```js\nconst API_BASE = import.meta.env.VITE_API_BASE_URL\nimport.meta.env.MODE        // 'development' | 'production'\n```\n**These values are baked into the public bundle: never put secrets here.** Use them for per-environment URLs (local / staging / production).\n**Dev proxy** to avoid CORS during development (`vite.config.js`):\n```js\nexport default defineConfig({\n  plugins: [vue()],\n  server: { proxy: { '/api': { target: 'http://localhost:8080', changeOrigin: true } } },\n})\n```\nThe browser calls `/api/...` on the Vite server, which forwards to Spring Boot: the browser sees a same-origin request, so there's no CORS error.\n\n## 25.5 Linting and formatting \ud83d\udfe1\n- **ESLint** finds problems (unused variables, undefined names, `==`, Vue mistakes like a missing `:key`).\n- **Prettier** formats code (quotes, semicolons, line width). ESLint = correctness; Prettier = style. Run on save, in CI, and as a pre-commit hook (husky + lint-staged).\n```json\n{ \"semi\": false, \"singleQuote\": true, \"printWidth\": 100 }\n```\n\n## 25.6 How a modern frontend project is organised\n```\nmy-app/\n\u251c\u2500 index.html          package.json  package-lock.json  vite.config.js  .env.*  eslint.config.js\n\u251c\u2500 public/             static files copied as-is (favicon)\n\u2514\u2500 src/\n   \u251c\u2500 main.js          create app, plugins, mount\n   \u251c\u2500 App.vue\n   \u2514\u2500 assets/ components/ views/ router/ stores/ services/ composables/ utils/\n```\n(Detailed in Module 44.)\n\n## 25.7 Questions and exercises\n**Q1. dependencies vs devDependencies?** **Q2. Why commit package-lock.json?** **Q3. How is Vite's dev server different from webpack?** serves native ES modules on demand (with esbuild pre-bundling) instead of bundling everything up front. **Q4. What is tree shaking?** removing unused exports at build time (needs ES modules). **Q5. Why can't I put an API secret in `.env`?** it's embedded in client JavaScript. **Q6. What is a source map?**\n**Exercises:** scaffold a Vue app, add a dependency and a devDependency and read the diff of `package.json`/lock \u00b7 define `VITE_API_BASE_URL`, build for production and find it in `dist/` \u00b7 set up ESLint + Prettier and fix warnings \u00b7 configure the Vite proxy and call `/api/health` of your Spring Boot app.\n\n## \u25b6 CODE STEP 25 \u2014 turn the logic into a Vite project\n```bash\nnpm create vite@latest seller-chat-js -- --template vanilla\ncd seller-chat-js && npm install\n```\nCopy `chat-utils.js`, the mock API and `main.js` into `src/`, add `VITE_USE_MOCK=true` to `.env.development`, and render the chat list in `index.html` with the DOM code you'll learn in Module 26. Next, Part 4 shows how JavaScript talks to the page; Part 6 replaces that manual rendering with Vue.\n\n---\n\n## Part 3 \u2014 revision summary\nTypes & coercion (`===`, `??`, `?.`) \u00b7 functions are values (callbacks/HOFs) \u00b7 arrays: `map/filter/reduce/find/some/every` (know which mutate) \u00b7 objects: destructure/spread, shallow vs deep copy \u00b7 scope chain, hoisting, TDZ, call stack \u00b7 closures = function + remembered environment (debounce, memoize, factories) \u00b7 `this` follows the call site (arrows are lexical) \u00b7 classes are prototype sugar \u00b7 async: promises \u2192 async/await, `Promise.all` for parallel, `AbortController` \u00b7 event loop: stack \u2192 all microtasks \u2192 render \u2192 one macrotask \u00b7 errors: try/catch/finally, custom errors, DevTools breakpoints \u00b7 tooling: npm, Vite, env vars, ESLint/Prettier.\n\n**Next \u2192 `04-dom-and-api.md`: DOM, events, Web APIs, Fetch and API architecture.**\n\n\n# PART 4 \u2014 DOM AND BROWSER JAVASCRIPT\n\n**Running project:** you now connect the JavaScript logic from Part 3 to the HTML/CSS page from Parts 1\u20132. Each module ends with a **BUILD STEP** that makes the Seller Chat page work in plain JavaScript (no framework). In Part 6, Vue will automate exactly what you write by hand here, so understanding it makes Vue easy.\n\n---\n\n# MODULE 26 \u2014 DOM MANIPULATION\n\n## 26.1 What is the DOM? \ud83d\udfe2\nThe **DOM** (Document Object Model) is the browser's **live, in-memory tree of objects** built from your HTML. JavaScript reads and changes this tree; the browser then updates what you see.\n**Analogy:** HTML is the architect's blueprint (a file). The DOM is the actual building after construction. Using JavaScript, you walk through the building and move furniture. The blueprint file doesn't change, the building does.\n```\ndocument\n\u2514\u2500 html\n   \u251c\u2500 head\n   \u2502   \u2514\u2500 title\n   \u2514\u2500 body\n      \u251c\u2500 h1          \"Seller Chat\"\n      \u2514\u2500 ul#chats\n         \u251c\u2500 li       \"Ravi\"\n         \u2514\u2500 li       \"Asha\"\n```\n- **`window`**: the browser tab/global object (`window.location`, `window.localStorage`, `setTimeout`).\n- **`document`**: `window.document`, the root of the page tree and your entry point.\n- **Node types:** *element* (a tag), *text*, *comment*, *document*. Most of what you touch are **elements**.\n- **NodeList / HTMLCollection**: array-like lists returned by selectors. `NodeList` has `forEach` but not `map`; convert with `[...list]` or `Array.from(list)`.\n**Why it matters:** Vue, React and every framework are tools that update the DOM for you. When something looks wrong in a Vue app you still debug by inspecting the DOM.\n\n## 26.2 Selecting elements \ud83d\udfe2\n```html\n<ul id=\"chats\">\n  <li class=\"chat unread\" data-id=\"1\">Ravi<\/li>\n  <li class=\"chat\" data-id=\"2\">Asha<\/li>\n<\/ul>\n```\n```js\ndocument.getElementById('chats')              // the element with that id, or null\ndocument.querySelector('.chat.unread')        // FIRST element matching ANY CSS selector, or null\ndocument.querySelectorAll('#chats .chat')     // static NodeList of ALL matches (empty list if none)\ndocument.getElementsByClassName('chat')       // live HTMLCollection (older API)\ndocument.getElementsByTagName('li')           // live HTMLCollection (older API)\nli.closest('.chat')                           // nearest ancestor (or itself) that matches: great for events\nli.matches('.unread')                         // true/false\n```\n**Always null-check:** `const el = document.querySelector('#x'); if (!el) return`. A lookup that returns `null` then `.textContent = \u2026` throws `TypeError: Cannot set properties of null`.\n**Timing bug:** a script in `<head>` without `defer` runs before the body exists, so lookups return `null` (see Module 5.2). Use `defer` or `type=\"module\"`.\nPrefer `querySelector`/`querySelectorAll` because you already know CSS selectors.\n\n## 26.3 Reading and changing content \ud83d\udfe2\n```js\nconst li = document.querySelector('.chat')\nli.textContent = 'Ravi K.'          // sets plain text; safe (no HTML parsing)\nli.innerText                        // like textContent but aware of CSS (skips hidden text; triggers layout)\nli.innerHTML = '<b>Ravi<\/b>'        // PARSES HTML: dangerous with user data (XSS)\n```\n| | `textContent` | `innerText` | `innerHTML` |\n|---|---|---|---|\n| Treats value as | text | text (rendered) | **HTML** |\n| Safe with user input | \u2705 | \u2705 | \u274c |\n| Speed | fast | slower (layout) | slowest |\n**Rule:** user-provided text always goes through `textContent`.\n**Demo of the danger:**\n```js\nconst bad = '<img src=x onerror=\"alert(\\'hacked\\')\">'\nel.innerHTML = bad       // \u274c the onerror JavaScript RUNS\nel.textContent = bad     // \u2705 shows the literal text; nothing executes\n```\n\n## 26.4 Attributes, properties, classes and styles \ud83d\udfe2\n```js\na.getAttribute('href')   a.setAttribute('href', '/orders')   a.removeAttribute('target')   a.hasAttribute('download')\ninput.value = 'abc'      input.checked = true     button.disabled = true     img.src = 'x.png'   // PROPERTIES (live state)\nel.dataset.chatId        // reads data-chat-id (always a string)\nel.classList.add('active')        el.classList.remove('active')\nel.classList.toggle('open')       el.classList.toggle('open', isOpen)      // force on/off\nel.classList.contains('active')   el.classList.replace('a', 'b')\nel.style.backgroundColor = 'tomato'            // inline style, camelCase property names\nel.style.setProperty('--progress', '40%')      // set a CSS variable\ngetComputedStyle(el).width                     // final computed value\n```\n**Attribute vs property:** the *attribute* is what's written in the HTML (the initial value); the *property* is the live JavaScript state. Type in an input: `input.value` changes, the `value` attribute doesn't.\n**Prefer toggling classes over writing inline styles**, so the design stays in CSS.\n\n## 26.5 Creating, inserting and removing elements \ud83d\udfe2\n```js\nconst li = document.createElement('li')     // a detached element (not on the page yet)\nli.className = 'chat'\nli.textContent = 'Meena'\nlist.append(li, 'text too')       //
