const MD = "# START HERE \u2014 ABSOLUTE BEGINNER ONBOARDING\n\n# MODULE 0 \u2014 HOW TO LEARN THIS GUIDE, SET UP YOUR TOOLS, AND WORK LIKE A COMPANY DEVELOPER\n\n## 0.1 What a frontend developer actually does \ud83d\udfe2\nA frontend developer builds the part of a product the user **sees and touches** in the browser: pages, forms, lists, chat windows, buttons. Day to day you will:\n1. Take a **ticket** (e.g. \"show unread count on chat list\").\n2. Find the right component in a large codebase.\n3. Change HTML (structure), CSS (look) and JavaScript/Vue (behaviour).\n4. Call a backend **REST API** (your Spring Boot services) and show the result, including loading and error states.\n5. Test it in the browser, fix bugs with DevTools, open a **pull request**, respond to review comments.\nYou are **not** expected to memorise everything. You are expected to read code, find information, debug methodically and explain what you did.\n\n## 0.2 The big picture: how the pieces fit \ud83d\udfe2\n```\nYou write                 Browser/tool turns it into            User sees\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nHTML  (structure)   \u2500\u2510\nCSS   (appearance)  \u2500\u253c\u2500\u25ba  DOM + CSSOM \u2500\u25ba layout \u2500\u25ba paint \u2500\u25ba  the page\nJavaScript (logic)  \u2500\u2518        \u25b2\nVue (JS framework that writes the DOM for you)\n        \u2502 fetch/axios\n        \u25bc\nSpring Boot REST API \u2500\u25ba Service \u2500\u25ba Repository \u2500\u25ba PostgreSQL/MongoDB/Firestore\n```\nLearn in this order, because each layer depends on the previous one: **HTML \u2192 CSS \u2192 JavaScript \u2192 DOM/browser APIs \u2192 HTTP/fetch \u2192 Vue \u2192 Router/Pinia \u2192 architecture**. Skipping JavaScript and jumping to Vue is the #1 reason people \"can't understand the code\".\n\n## 0.3 Tools to install \ud83d\udfe2\n| Tool | What it is | Why |\n|---|---|---|\n| **Google Chrome** | browser with DevTools | main debugging tool (Elements, Console, Network, Sources) |\n| **VS Code** | code editor | edit files; extensions: *Vue - Official (Volar)*, ESLint, Prettier, Live Server, GitLens, Error Lens |\n| **Node.js (LTS)** | runs JavaScript outside the browser | needed by Vite/npm; check with `node -v` |\n| **npm** | package manager bundled with Node | installs libraries (`npm install`) |\n| **Git** | version control | every company uses it |\n| **Postman / curl** | send API requests without a UI | test your Spring Boot endpoints |\n| **Vue DevTools** | Chrome extension | inspect components and Pinia stores |\nInstall Node with **nvm** (Node Version Manager) so you can switch versions per project: `nvm install --lts`, `nvm use`. Company projects often pin a Node version (`.nvmrc`).\n\n## 0.4 Terminal survival guide (macOS/Linux; Windows PowerShell is similar) \ud83d\udfe2\n```bash\npwd                      # print where I am\nls -la                   # list files (including hidden)\ncd my-folder             # enter a folder        cd ..   # go up one\nmkdir demo && cd demo    # create a folder and enter it\ntouch index.html         # create an empty file   (rm file deletes it, no recycle bin!)\ncat file                 # print a file           code .  # open the folder in VS Code\nnpm install              # install dependencies listed in package.json\nnpm run dev              # run the project's \"dev\" script (see package.json \"scripts\")\nCtrl + C                 # stop a running process\n```\nRules: read error messages top to bottom; copy the **first** error line; \"command not found\" = tool not installed / not on PATH; never run commands you don't understand (especially `rm -rf`, `sudo`).\n\n## 0.5 Your first page in 5 minutes \ud83d\udfe2\n1. `mkdir hello && cd hello && code .`\n2. Create `index.html`:\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Hello<\/title>\n<link rel=\"stylesheet\" href=\"style.css\"><\/head>\n<body>\n  <h1 id=\"title\">Hello<\/h1>\n  <button id=\"btn\">Click me<\/button>\n  <script src=\"app.js\" defer><\/script>\n<\/body>\n<\/html>\n```\n3. `style.css`: `body{font-family:system-ui;padding:2rem} button{padding:.5rem 1rem}`\n4. `app.js`:\n```js\ndocument.getElementById('btn').addEventListener('click', () => {\n  document.getElementById('title').textContent = 'You clicked!'\n})\n```\n5. Open with the Live Server extension (or double-click `index.html`). Open **DevTools (Cmd+Option+I)** and watch the Elements panel change when you click.\n**What just happened:** HTML created elements; CSS styled them; JS found an element, registered a click listener, and changed text. Everything in this guide is an extension of this loop: **event \u2192 JavaScript \u2192 change the DOM**. Vue automates the \"change the DOM\" part.\n\n## 0.6 How to read code you don't understand \ud83d\udfe1\n1. **Find the entry point:** HTML \u2192 `<script>`, or Vue: `index.html` \u2192 `main.js` \u2192 `App.vue` \u2192 router.\n2. **Follow one user action.** Pick a button; find its handler (`@click=\"onSend\"`); read what it calls; follow into stores/services; find the URL; find the backend controller.\n3. **Name every piece:** is this *state* (ref/store), *derived* (computed), a *side effect* (watch/API), or *markup*?\n4. **Run it and watch:** add a `console.log`, set a breakpoint (Sources), look at Network and Vue DevTools.\n5. **Explain it in 3 sentences** (input \u2192 what changes \u2192 output). If you can't, you haven't understood it yet.\nTemplate for explaining a function: *\"`sendMessage(text)` takes the text, adds a temporary message to the store so the UI updates immediately, calls `chatApi.send`, and replaces the temporary message with the server response or marks it failed.\"*\n\n## 0.7 How to debug (the method) \ud83d\udfe1\nNever guess. Follow this loop:\n1. **Reproduce** the problem reliably. 2. **Read** the exact error (message, file, line). 3. **Locate the layer:** UI? state? request? response? backend? 4. **Check the data** at that layer (Console / breakpoint / Vue DevTools / Network). 5. **Form one hypothesis**, change **one** thing, re-test. 6. **Fix the cause**, not the symptom; add a test or a note.\nLayer checklist for \"the list is empty\":\n- Is the request sent? (Network tab) \u2192 status? \u2192 response body shape?\n- Is the response stored? (Vue DevTools \u2192 store/component state)\n- Does the template read the right variable? (`v-for` source, `v-if` condition)\n- Console errors/warnings? CORS? 401?\n\n## 0.8 Git and team workflow \ud83d\udfe1\n**Git** records snapshots of your project so you can undo changes and collaborate.\n```bash\ngit clone <url>                      # copy a repo\ngit status                           # what changed?\ngit checkout -b feature/unread-badge # new branch for your ticket\ngit add src/components/ChatItem.vue  # stage specific files (avoid `git add .` blindly)\ngit commit -m \"feat(chat): show unread badge on chat item\"\ngit push -u origin feature/unread-badge\ngit pull --rebase origin main        # bring in teammates' changes\ngit log --oneline --graph            # history\ngit diff                             # review before committing\ngit stash / git stash pop            # park changes temporarily\n```\nTypical company flow: **Jira ticket \u2192 branch \u2192 code \u2192 run lint/tests locally \u2192 commit \u2192 push \u2192 open Pull Request (PR) \u2192 CI pipeline (build, lint, tests, security scan) \u2192 code review \u2192 fix comments \u2192 merge \u2192 deploy.**\nGood commit messages: imperative, specific (`fix: prevent duplicate message on double click`). Good PRs: small, one purpose, screenshots/GIF for UI, description of what/why/how-to-test, link to ticket. **Never commit** secrets (`.env` with keys), `node_modules`, build output. Merge conflicts: open files, choose/merge between `<<<<<<<` markers, test, commit.\n**Reviewing/receiving review:** reviewers look for correctness, edge cases (loading/error/empty), naming, reuse, accessibility, tests, performance and security. Treat comments as learning, ask questions, don't take them personally.\n\n## 0.9 Working with tickets \ud83d\udfe1\nRead the acceptance criteria \u2192 ask clarifying questions early \u2192 find where in the code the feature lives \u2192 write a short plan (components, state, API) \u2192 implement in small commits \u2192 test happy path **and** error/empty/loading \u2192 self-review your diff \u2192 PR. If blocked for >30\u201345 minutes after honest debugging, ask a specific question (what you tried, error, expected vs actual).\n\n## 0.10 A realistic 16-week study plan \ud83d\udfe2\n| Weeks | Topic | Output |\n|---|---|---|\n| 1\u20132 | HTML + CSS (Modules 1\u201311) | responsive landing page + login/registration forms |\n| 3\u20136 | JavaScript (Modules 12\u201325) | solve J1\u2013J30; chat-list in plain JS |\n| 7 | DOM, events, Web APIs (26\u201328) | todo app + search filter |\n| 8 | fetch + API layer (29\u201330) | posts viewer with CRUD against JSONPlaceholder |\n| 9\u201311 | Vue (31\u201343) | V1\u2013V30; user-management app |\n| 12 | Architecture, security, performance (44\u201347) | refactor a project into layers |\n| 13\u201314 | Seller Chat capstone (48) | all 7 stages |\n| 15 | Company-stack modules (58\u201366) + read your company repo | trace 3 features end to end |\n| 16 | Interview bank + mock explain sessions | answer Module 49 aloud |\nDaily: 2\u20133 hours: **30% reading, 70% typing and debugging**. Rule: after each module, close the guide and rebuild the example from memory.\n\n## 0.11 How to study effectively \ud83d\udfe2\n- **Type every example** (no copy-paste) and then **break it on purpose** to see the error.\n- Predict the output **before** running code.\n- Keep a \"bug diary\": symptom \u2192 cause \u2192 fix.\n- Use MDN (https://developer.mozilla.org/) and Vue docs (https://vuejs.org/) as your reference; this guide is the map, they are the dictionary.\n- Teach it: explain each module aloud as if to your mentor.\n- Revisit weak topics with the assignments and interview bank.\n\n## 0.12 Interview Qs for Module 0\n**Q: What happens when you run `npm install` / `npm run dev`?** npm reads `package.json`, downloads dependencies into `node_modules`, writes/uses `package-lock.json`; `npm run dev` executes the `dev` script (usually starts Vite's dev server with hot reload).\n**Q: Walk me through your Git workflow.** branch from main \u2192 commits \u2192 push \u2192 PR \u2192 CI \u2192 review \u2192 merge; rebase/merge main regularly; resolve conflicts locally.\n**Q: How do you approach a bug?** the 6-step loop above.\n### Exercises\nSet up all tools; build the 5-minute page; create a GitHub repo, push it, open a PR to yourself and merge; write a 5-line explanation of `app.js`.\n\n\n# PART 1 \u2014 HTML: COMPLETE BEGINNER TO ADVANCED\n\nTags: \ud83d\udfe2 Beginner \u00b7 \ud83d\udfe1 Intermediate \u00b7 \ud83d\udd34 Advanced \u00b7 \ud83c\udfed Production-level\n\n**Running project for Parts 1\u20132:** you will build the static screen of a **Seller Chat** app (header, chat list, message area, order card, login form). Every HTML module ends with a **BUILD STEP** that adds to the same page. In Part 2 you will style that exact page. Type it yourself, one step at a time.\n\n**How each module is organised:** concept \u2192 analogy \u2192 why it exists \u2192 syntax \u2192 worked example with line-by-line explanation \u2192 what you will see \u2192 common mistakes (broken code, why, fix) \u2192 best practices \u2192 interview questions \u2192 exercises \u2192 revision notes \u2192 BUILD STEP.\n\n---\n\n# MODULE 1 \u2014 HTML FUNDAMENTALS\n\n## 1.1 What is HTML? \ud83d\udfe2\n\n**Definition.** HTML stands for **HyperText Markup Language**. It is a text format in which you wrap pieces of content in **tags** that tell the browser *what that content is*: a heading, a paragraph, a link, a button, an image.\n\nBreak the name into three words:\n- **HyperText**: text that can link to other text. Click a link, go to another page.\n- **Markup**: labels added around content. Like highlighting a book with coloured pens: yellow = important, green = definition.\n- **Language**: a fixed vocabulary (the tags) and grammar (how to write them) that every browser understands.\n\n**Analogy: a newspaper.** An editor receives raw text and marks it: \"this line is the headline, this is a sub-headline, this block is body, this is a photo caption.\" The printer then lays it out. In the same way:\n- **You** (the editor) mark what each piece is with HTML.\n- **The browser** (the printer) decides how to show it.\n\n**What problem does it solve?** A browser downloads plain text. Without markers it cannot tell a title from a sentence from a button. HTML supplies the *structure and meaning*.\n\n**Where is it used in real projects?** Everywhere. Even a Vue or React app ends up as HTML in the browser. In your company project, `.vue` files contain a `<template>` section that is HTML with extras. If you read HTML well, you can read any frontend.\n\n**Where does it come from?** In 1991 Tim Berners-Lee published a way for scientists to share linked documents. HTML + HTTP + URLs became the Web.\n\n## 1.2 HTML is not a programming language \ud83d\udfe2\n\n| Question | HTML | JavaScript |\n|---|---|---|\n| Can it store a value in a variable? | No | Yes |\n| Can it repeat steps (loop)? | No | Yes |\n| Can it make decisions (if/else)? | No | Yes |\n| What does it do? | **Describes** content | **Computes** and reacts |\n\nHTML says *\"here is a button labelled Send.\"* It does not say *what happens* when you click it. That is JavaScript's job.\n\n## 1.3 The three languages of the web \ud83d\udfe2\n\n```\n                \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n   HTML         \u2502  WHAT it is   (skeleton)                    \u2502   <button>Send<\/button>\n   CSS          \u2502  HOW it looks (skin, clothes)               \u2502   button { background: teal; }\n   JavaScript   \u2502  WHAT it DOES (muscles, brain)              \u2502   button.onclick = sendMessage\n                \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\nReal example: the **Send** button in a chat. HTML creates it. CSS makes it teal and rounded. JavaScript/Vue sends the message when you click it, and calls your Spring Boot API.\n\nIf you remove CSS the page still works but looks plain. If you remove JavaScript it still shows but isn't interactive. If you remove HTML there is nothing.\n\n## 1.4 Your first HTML document, in detail \ud83d\udfe2\n\nCreate a file called `index.html` and type:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Seller Chat<\/title>\n  <\/head>\n  <body>\n    <h1>Welcome, seller<\/h1>\n    <p>You have 3 unread chats.<\/p>\n  <\/body>\n<\/html>\n```\n\n**Open it** by double-clicking the file (or with the VS Code *Live Server* extension).\n\n**What you will see:** a white page with a large bold line \"Welcome, seller\" and, below it, normal text \"You have 3 unread chats.\" The browser tab reads \"Seller Chat\".\n\n**Line by line**\n\n| Line | What it does | Why |\n|---|---|---|\n| `<!DOCTYPE html>` | Tells the browser \"this is modern HTML5\". | Without it the browser switches to **quirks mode** and imitates 1990s behaviour, so layouts differ unpredictably. It is not a tag, it is an instruction. |\n| `<html lang=\"en\">` | Root element: everything lives inside it. `lang=\"en\"` states the page language. | Screen readers pick the right voice, translation tools know the source language, search engines classify the page. |\n| `<head>` | Container for **information about** the page. Nothing inside is displayed (except the `<title>` text in the tab). | Separates metadata from visible content. |\n| `<meta charset=\"UTF-8\" />` | Says which character set the file uses. UTF-8 handles every language and emoji. | Without it you may see broken characters like `\u00e2\u201a\u00b9` instead of `\u20b9`. Put it first in `<head>`. |\n| `<meta name=\"viewport\" ...>` | Tells phones to use the real screen width. | Without it, a phone pretends to be ~980px wide and shrinks your page. **Required for responsive design.** |\n| `<title>` | Text shown in the browser tab, bookmarks and search results. | Every page needs a unique, meaningful title. |\n| `<body>` | Everything visible lives here. | |\n| `<h1>` | The main heading of the page. | One per page: it names the page's topic. |\n| `<p>` | A paragraph. | |\n\n**Common mistakes (broken \u2192 fixed)**\n\n```html\n<!-- \u274c 1. no doctype \u2192 quirks mode -->\n<html><body>Hello<\/body><\/html>\n<!-- \u2705 -->\n<!DOCTYPE html><html lang=\"en\"><head><title>X<\/title><\/head><body>Hello<\/body><\/html>\n\n<!-- \u274c 2. content in head -->\n<head><h1>Hello<\/h1><\/head>      <!-- browser moves it to body; confusing -->\n<!-- \u2705 --> h1 inside <body>\n\n<!-- \u274c 3. forgot to close -->\n<p>Hello <p>World         <!-- works by luck; second p auto-closes the first -->\n<!-- \u2705 --> <p>Hello<\/p><p>World<\/p>\n```\n\n## 1.5 Tags, elements, attributes: the anatomy \ud83d\udfe2\n\n```\n        attribute name    attribute value\n              \u2502                 \u2502\n   <a  href=\"https://example.com\"  target=\"_blank\">  Visit shop  <\/a>\n   \u2514\u252c\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2518 \u2514\u252c\u2518\n opening tag       attributes (inside the opening tag)    content  closing tag\n   \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 the whole thing is an ELEMENT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n- **Tag**: the angle-bracket label: `<a>` opens, `<\/a>` closes (note the `/`).\n- **Element**: opening tag + content + closing tag.\n- **Attribute**: extra information as `name=\"value\"` inside the *opening* tag only.\n\n### Void (empty) elements\nSome elements have **no content**, so no closing tag: `<img>`, `<br>`, `<hr>`, `<input>`, `<meta>`, `<link>`.\n```html\n<img src=\"logo.png\" alt=\"Company logo\" />\n<br />   <!-- line break -->\n<hr />   <!-- horizontal line -->\n<input type=\"text\" name=\"q\" />\n```\nThe trailing `/` is optional in HTML (but harmless, and required in Vue templates for self-closing components).\n\n### Boolean attributes\nTheir **presence** means true; no value needed.\n```html\n<input required disabled checked />\n<!-- \u274c BUG: disabled=\"false\" is STILL disabled. Remove the attribute to enable. -->\n```\n\n### Attribute quoting\nAlways use double quotes: `class=\"card big\"`. Unquoted values break as soon as there is a space.\n\n## 1.6 Nesting and parent\u2013child relationships \ud83d\udfe2\n\nElements go inside other elements. The outer is the **parent**, the inner is the **child**, two children of the same parent are **siblings**.\n```html\n<ul>                    <!-- parent -->\n  <li>Chats<\/li>        <!-- child of ul; sibling of the next li -->\n  <li>Orders<\/li>\n<\/ul>\n```\nPicture it as a tree (this tree is called the **DOM**, you will use it constantly in JavaScript):\n```\nhtml\n\u251c\u2500\u2500 head\n\u2502   \u2514\u2500\u2500 title\n\u2514\u2500\u2500 body\n    \u251c\u2500\u2500 h1\n    \u2514\u2500\u2500 ul\n        \u251c\u2500\u2500 li  \"Chats\"\n        \u2514\u2500\u2500 li  \"Orders\"\n```\n**Rule: close tags in reverse order of opening.** `<b><i>text<\/i><\/b>` \u2705, `<b><i>text<\/b><\/i>` \u274c.\n**Invalid nesting examples:** `<p>` cannot contain `<div>`; `<li>` must be inside `<ul>`/`<ol>`; `<a>` inside `<a>` is not allowed. The browser **silently repairs** these mistakes, which makes the DOM differ from your file. Always verify in DevTools \u2192 **Elements** panel, not View Source.\n\n## 1.7 Block vs inline elements \ud83d\udfe2\n\n```\nBLOCK elements stack vertically, take the full width:        INLINE elements flow in a line, only as wide as content:\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510                      Hello <b>bold<\/b> and <a>a link<\/a> inside one line\n\u2502 <h1> Title                           \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 <p>  Paragraph                       \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 <div> Container                      \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n| | Block | Inline |\n|---|---|---|\n| New line before/after | Yes | No |\n| Width | full available | content width |\n| Can set `width`/`height` in CSS | Yes | No (ignored) |\n| Examples | `div p h1\u2013h6 ul ol li section header form table` | `span a strong em code img* button* input*` |\n\n\\* `img`, `button`, `input` are *inline-block*: they sit in a line but accept width/height.\n\n**Generic containers:** `<div>` (block) and `<span>` (inline) carry no meaning. They exist as hooks for CSS/JS when no meaningful element fits. Prefer meaningful (semantic) elements first (Module 3).\n\n## 1.8 Global attributes: id, class, data-*, and others \ud83d\udfe2\n\nValid on every element: `id`, `class`, `style`, `title`, `lang`, `hidden`, `tabindex`, `contenteditable`, `draggable`, `data-*`, `aria-*`, `role`.\n\n### id vs class\n```html\n<section id=\"chat-panel\" class=\"panel panel--active\">\u2026<\/section>\n```\n| | `id` | `class` |\n|---|---|---|\n| How many elements can share it | **one** (unique per page) | any number |\n| Elements can have | one id | many classes (space-separated) |\n| Used for | link targets (`#chat-panel`), `label for`, JS lookups | styling and grouping |\n\nAnalogy: `id` = a passport number (unique); `class` = a team jersey (many people wear it).\n**Best practice:** style with classes. Use ids sparingly for anchors/labels/JS.\n\n### data-* attributes\nStore small custom data on an element for JavaScript.\n```html\n<li class=\"chat-item\" data-chat-id=\"42\" data-unread=\"3\">Ravi<\/li>\n```\n```js\nconst li = document.querySelector('.chat-item')\nconsole.log(li.dataset.chatId)   // \"42\"   (data-chat-id \u2192 camelCase chatId)\nconsole.log(li.dataset.unread)   // \"3\"    (always a STRING; convert with Number())\n```\nReal use: when a chat row is clicked, read its `data-chat-id` to know which chat to open. Also used as test hooks (`data-testid=\"send-btn\"`). Never store secrets or big data.\n\n### Other useful globals\n`hidden` (hide element), `title` (tooltip), `tabindex=\"0\"` (make focusable), `contenteditable` (user can edit), `draggable=\"true\"`.\n\n## 1.9 Comments, entities, whitespace \ud83d\udfe2\n\n```html\n<!-- This comment is invisible on the page, but VISIBLE in \"View Source\". Never put secrets here. -->\n```\n**Entities** write characters that would otherwise be read as code:\n| Type | Shows | Why needed |\n|---|---|---|\n| `&lt;` | `<` | `<` starts a tag |\n| `&gt;` | `>` | |\n| `&amp;` | `&` | `&` starts an entity |\n| `&quot;` | `\"` | inside attribute values |\n| `&nbsp;` | non-breaking space | stop a line breaking there |\n| `&copy;` `&rupee;`/`\u20b9` | \u00a9 \u20b9 | symbols (UTF-8 lets you type \u20b9 directly) |\n\n**Whitespace collapses:** several spaces/newlines in HTML show as a single space.\n```html\n<p>Hello         World\n   again<\/p>        <!-- shows: Hello World again -->\n```\nUse `<br>` for a forced line break and `<pre>` to keep whitespace.\n\n**Security connection:** if user-typed text containing `<script>` is inserted into HTML without escaping, it will run (XSS, Module 45). Entities are how text is made safe.\n\n## 1.10 Working method: edit \u2192 refresh \u2192 inspect \ud83d\udfe2\n1. Edit in VS Code. 2. Save (Cmd/Ctrl+S). 3. Refresh the browser (Live Server auto-refreshes). 4. Right-click \u2192 **Inspect** to see the live DOM; hover elements to see their boxes; click an element in the **Elements** panel to see its attributes. Make this a habit: it is how you debug everything later.\n\n## 1.11 Best practices (Module 1)\nAlways include doctype, `lang`, charset, viewport, title \u00b7 lowercase tags \u00b7 double-quoted attributes \u00b7 2-space indentation \u00b7 one `<h1>` \u00b7 meaningful `alt`/labels \u00b7 ids unique \u00b7 comments for *why*, not *what*.\n\n## 1.12 Interview questions (Module 1)\n**Q1. Is HTML a programming language? Why?** No. It is declarative markup: it describes structure and meaning but has no variables, loops or conditions. JavaScript adds logic.\n**Q2. What does `<!DOCTYPE html>` do?** It tells the browser to render in standards mode. Without it, browsers fall back to quirks mode which emulates old non-standard behaviour (e.g. different box-model calculations).\n**Q3. Difference between tag, element and attribute?** A tag is the markup (`<p>`), an element is opening tag + content + closing tag, an attribute is `name=\"value\"` metadata inside the opening tag.\n**Q4. Block vs inline?** Block elements start a new line and take full width and accept width/height; inline flow within a line and ignore width/height (inline-block mixes both).\n**Q5. `id` vs `class`?** `id` is unique per page (anchors, label targets, JS hooks); `class` is reusable and is the main styling hook.\n**Q6. What are void elements? Name five.** Elements without content or closing tag: `br, hr, img, input, meta, link`.\n**Q7. Why is `disabled=\"false\"` still disabled?** Boolean attributes are true by presence; you must remove the attribute.\n**Q8. Why use `lang`?** Screen-reader pronunciation, translation, hyphenation, SEO.\n**Q9. Why does the Elements panel differ from View Source?** Source is the original response; the Elements panel is the live DOM after parser repairs and JavaScript changes.\n\n## 1.13 Exercises (Module 1)\n1. Create a page about yourself with a title, an `h1`, two paragraphs and a horizontal rule. Check it at 320px width in DevTools device mode.\n2. Deliberately break it (remove doctype, unclose a tag, add `<p><div><\/div><\/p>`). Compare View Source with the Elements panel and describe the differences.\n3. Add `data-user-id=\"7\"` to an element and read it with `document.querySelector(...).dataset.userId` in the Console.\n4. Show the text `<script>alert(1)<\/script>` literally on a page using entities.\n\n## 1.14 Revision notes (Module 1)\nHTML = structure/meaning, not logic \u00b7 head = metadata, body = visible \u00b7 element = open tag + content + close tag \u00b7 void elements have no close \u00b7 boolean attributes by presence \u00b7 ids unique, classes reusable \u00b7 data-* \u2192 `dataset` (strings) \u00b7 whitespace collapses \u00b7 browser repairs bad HTML, so inspect the DOM.\n\n## \u25b6 BUILD STEP 1 \u2014 the page skeleton\nCreate `seller-chat/index.html`:\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Seller Chat<\/title>\n<\/head>\n<body>\n  <h1>Seller Chat<\/h1>\n  <p>Manage your buyer conversations in one place.<\/p>\n\n  <!-- chat list will go here (Step 2) -->\n  <!-- chat room will go here (Step 3) -->\n<\/body>\n<\/html>\n```\nOpen it. You now have the foundation that every later step builds on.\n\n---\n\n# MODULE 2 \u2014 HTML ELEMENTS AND CONTENT\n\n## 2.1 Headings and paragraphs \ud83d\udfe2\n\n```html\n<h1>Seller Dashboard<\/h1>\n  <h2>Conversations<\/h2>\n    <h3>Unread<\/h3>\n    <h3>Archived<\/h3>\n  <h2>Orders<\/h2>\n<p>You have <strong>3<\/strong> unread conversations.<\/p>\n```\n**What it means:** `h1`\u2013`h6` are six levels of heading, forming an **outline** (like chapters and sub-chapters). Browsers show `h1` biggest by default, but **size is not the point**: screen-reader users jump between headings to scan a page, and search engines use them to understand it.\n**Rules:** one `h1` per page; never skip levels (`h1` \u2192 `h3`); choose the level by **structure**, then change size with CSS.\n```\nOutline of the example:      h1 Seller Dashboard\n                              \u251c\u2500 h2 Conversations\n                              \u2502   \u251c\u2500 h3 Unread\n                              \u2502   \u2514\u2500 h3 Archived\n                              \u2514\u2500 h2 Orders\n```\n**Mistake:** using `<h3>` because \"it looks the right size\". Fix: use the correct level and style it with CSS.\n\n## 2.2 Text-level elements \ud83d\udfe2\n\n| Element | Meaning | Typical look | Use when |\n|---|---|---|---|\n| `<strong>` | strong importance | bold | \"**Do not** share your password\" |\n| `<em>` | stress emphasis | italic | \"I *did* send it\" |\n| `<b>` / `<i>` | visual only, no extra meaning | bold/italic | product names, technical terms |\n| `<mark>` | highlighted (relevance) | yellow | search results highlight |\n| `<small>` | side comments/fine print | smaller | copyright, disclaimers |\n| `<code>` | computer code | monospace | `npm install` |\n| `<pre>` | preformatted block | monospace, keeps spaces | code samples |\n| `<kbd>` | keyboard input | | press <kbd>Ctrl<\/kbd>+<kbd>K<\/kbd> |\n| `<time datetime=\"2026-10-30T09:12\">` | machine-readable date/time | | message timestamps |\n| `<abbr title=\"Stock Keeping Unit\">SKU<\/abbr>` | abbreviation | dotted underline | |\n| `<del>` `<ins>` | removed/added text | strike/underline | price changes |\n| `<sub>` `<sup>` | sub/superscript | | H\u2082O, x\u00b2 |\n| `<blockquote>` `<q>` `<cite>` | quotations | | reviews |\n| `<br>` | line break | | addresses |\n\n**Rule: choose by meaning.** `<strong>` says \"this is important\" to a screen reader; `<b>` only makes text bold.\nReal example: a chat message row.\n```html\n<article>\n  <p><strong>Ravi:<\/strong> Is the <mark>red sneaker<\/mark> available in size 9?<\/p>\n  <p><small><time datetime=\"2026-10-30T09:12:00+05:30\">9:12 AM<\/time><\/small><\/p>\n<\/article>\n```\n`datetime` lets software (calendar tools, search engines, your own JS) read the exact time while humans read \"9:12 AM\".\n\n## 2.3 Lists \ud83d\udfe2\n\n```html\n<!-- unordered: order does not matter -->\n<ul><li>Sneakers<\/li><li>Socks<\/li><\/ul>\n\n<!-- ordered: order matters; attributes: start, reversed, type -->\n<ol start=\"1\"><li>Add item<\/li><li>Pay<\/li><li>Track<\/li><\/ol>\n\n<!-- description list: term + definition pairs -->\n<dl><dt>Status<\/dt><dd>Shipped<\/dd><dt>Total<\/dt><dd>\u20b91,299<\/dd><\/dl>\n\n<!-- nested -->\n<ul>\n  <li>Orders\n    <ul><li>Paid<\/li><li>Pending<\/li><\/ul>\n  <\/li>\n<\/ul>\n```\n**Why lists matter:** a chat list, a navigation menu, a product grid are all *lists* semantically. Screen readers announce \"list, 5 items\", which helps users. Only `<li>` may be a direct child of `ul`/`ol`. Nested lists go **inside** an `<li>`, not beside it.\n\n## 2.4 Links and navigation in depth \ud83d\udfe2\n\n```html\n<a href=\"https://example.com\">External site<\/a>\n<a href=\"/orders\">Same site, from the root<\/a>\n<a href=\"orders.html\">Relative to this file<\/a>\n<a href=\"../index.html\">One folder up<\/a>\n<a href=\"#reviews\">Jump to element with id=\"reviews\"<\/a>\n<a href=\"mailto:help@shop.com\">Email<\/a>\n<a href=\"tel:+911234567890\">Call<\/a>\n<a href=\"invoice.pdf\" download>Download<\/a>\n<a href=\"https://partner.com\" target=\"_blank\" rel=\"noopener noreferrer\">Open in new tab<\/a>\n```\n**URL types**\n| Type | Example | Resolves to |\n|---|---|---|\n| Absolute | `https://shop.com/orders` | exactly that |\n| Root-relative | `/orders` | `https://<current-site>/orders` |\n| Relative | `orders.html`, `../x.html` | relative to the current page's folder |\n| Fragment | `#reviews` | scroll to the id on the current page |\n\n**`target=\"_blank\"` + `rel=\"noopener noreferrer\"`** protects against the new tab controlling your page (`window.opener` attack) and hides the referrer.\n**Link vs button rule:**\n- Going somewhere (a URL) \u2192 `<a href>`.\n- Doing something on this page (send, open modal, save) \u2192 `<button>`.\nWrong choice breaks right-click \"open in new tab\", keyboard use, and screen-reader expectations.\n**Link text must make sense out of context:** \"View order #1001\" \u2705, \"Click here\" \u274c.\n**In Vue:** internal links use `<RouterLink to=\"/orders\">` which renders an `<a>` but avoids a full page reload.\n**Navigation menu pattern**\n```html\n<nav aria-label=\"Main\">\n  <ul>\n    <li><a href=\"/chats\" aria-current=\"page\">Chats<\/a><\/li>\n    <li><a href=\"/orders\">Orders<\/a><\/li>\n  <\/ul>\n<\/nav>\n```\n`aria-current=\"page\"` tells screen readers (and CSS) which link is the current page.\n\n## 2.5 Images \ud83d\udfe2\n\n```html\n<img src=\"/img/avatar-ravi.webp\" alt=\"Ravi Kumar's profile photo\" width=\"48\" height=\"48\" loading=\"lazy\" />\n```\n| Attribute | Purpose |\n|---|---|\n| `src` | file URL |\n| `alt` | text alternative (shown if image fails; read by screen readers) |\n| `width`/`height` | reserve space so the page doesn't jump when the image loads (CLS) |\n| `loading=\"lazy\"` | don't download until near the viewport |\n| `srcset`/`sizes` | give several sizes (Module 5) |\n\n**How to write `alt`**\n| Image is | `alt` |\n|---|---|\n| informative (product photo) | describe it: `alt=\"Red running shoes, side view\"` |\n| a link/button (logo linking home) | describe the **action/destination**: `alt=\"Seller Chat home\"` |\n| decorative (divider, background flourish) | `alt=\"\"` (empty, **present**) so assistive tech skips it |\n| contains text | repeat the text |\nA *missing* `alt` is different from `alt=\"\"`: with it missing, screen readers read the filename aloud.\n**Formats:** JPEG (photos), PNG (transparency/screenshots), **WebP/AVIF** (modern, much smaller), SVG (vector logos/icons), GIF (avoid; use video).\n`<figure>` + `<figcaption>` for captioned images:\n```html\n<figure><img src=\"shoe.webp\" alt=\"Red running shoe\" width=\"400\" height=\"300\"><figcaption>Model RX-9, red<\/figcaption><\/figure>\n```\n\n## 2.6 Audio and video \ud83d\udfe2\n\n```html\n<video controls width=\"480\" poster=\"thumb.jpg\" preload=\"metadata\">\n  <source src=\"demo.webm\" type=\"video/webm\" />\n  <source src=\"demo.mp4\"  type=\"video/mp4\" />\n  <track kind=\"captions\" src=\"en.vtt\" srclang=\"en\" label=\"English\" default />\n  Your browser does not support the video tag.\n<\/video>\n\n<audio controls src=\"voice-note.mp3\"><\/audio>\n```\n**How it works:** the browser tries each `<source>` and plays the first format it supports. `controls` shows play/pause UI. `poster` is the preview image. `autoplay` is blocked unless the video is `muted`. `<track>` adds captions (accessibility). JS can control playback (`video.play()`).\nReal use: voice notes or product videos attached in a chat.\n\n## 2.7 Tables \ud83d\udfe2/\ud83d\udfe1\n\n**Use a table only for tabular data** (rows \u00d7 columns of related values), never for page layout.\n```html\n<table>\n  <caption>Recent orders<\/caption>\n  <thead>\n    <tr><th scope=\"col\">Order<\/th><th scope=\"col\">Buyer<\/th><th scope=\"col\">Total<\/th><\/tr>\n  <\/thead>\n  <tbody>\n    <tr><td>#1001<\/td><td>Ravi<\/td><td>\u20b91,299<\/td><\/tr>\n    <tr><td>#1002<\/td><td>Asha<\/td><td>\u20b9399<\/td><\/tr>\n  <\/tbody>\n  <tfoot>\n    <tr><th scope=\"row\" colspan=\"2\">Total<\/th><td>\u20b91,698<\/td><\/tr>\n  <\/tfoot>\n<\/table>\n```\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u2190 thead / th (header cells)\n\u2502 Order   \u2502 Buyer  \u2502 Total  \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524   \u2190 tbody / tr (row) / td (data cell)\n\u2502 #1001   \u2502 Ravi   \u2502 \u20b91,299 \u2502\n\u2502 #1002   \u2502 Asha   \u2502 \u20b9399   \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524   \u2190 tfoot, colspan=\"2\" merges two columns\n\u2502 Total            \u2502 \u20b91,698 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n`caption` names the table; `th scope=\"col|row\"` tells screen readers which cells a header describes; `colspan`/`rowspan` merge cells. On phones, wrap a wide table in a scrollable container (CSS). In Vue: `<tr v-for=\"o in orders\" :key=\"o.id\">`.\n\n## 2.8 Buttons \ud83d\udfe2\n```html\n<button type=\"button\">Open<\/button>   <!-- does nothing on its own; JS handles click -->\n<button type=\"submit\">Save<\/button>   <!-- submits the surrounding form -->\n<button type=\"reset\">Reset<\/button>\n```\n**The classic bug:** a `<button>` inside a `<form>` defaults to `type=\"submit\"`. So a \"Cancel\" button reloads the page or posts the form. **Always write `type`.**\n`<button>` vs `<input type=\"button\">`: prefer `<button>` (can contain text, icons, other markup).\n\n## 2.9 iframe, SVG, canvas \ud83d\udfe1\n\n```html\n<iframe src=\"https://www.youtube.com/embed/ID\" title=\"Product demo\" loading=\"lazy\"\n        sandbox=\"allow-scripts allow-same-origin\" width=\"560\" height=\"315\"><\/iframe>\n```\n`iframe` embeds another page (maps, payments, videos). Always add `title`. `sandbox` restricts what the embedded page can do. Many sites forbid being framed (`X-Frame-Options` / CSP `frame-ancestors`) to prevent **clickjacking**: then the frame is blank.\n```html\n<svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" role=\"img\" aria-label=\"Success\">\n  <circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"seagreen\" />\n  <path d=\"M7 12l3 3 7-7\" stroke=\"white\" stroke-width=\"2\" fill=\"none\" />\n<\/svg>\n```\n**SVG** = vector graphics written as XML: crisp at any size, styleable with CSS (`fill: currentColor`), part of the DOM, ideal for icons/logos/simple charts. `viewBox` defines the internal coordinate system that scales to `width/height`.\n```html\n<canvas id=\"c\" width=\"300\" height=\"150\"><\/canvas>\n<script>\n  const ctx = document.getElementById('c').getContext('2d')\n  ctx.fillStyle = 'steelblue'\n  ctx.fillRect(10, 10, 100, 50)   // x, y, width, height\n<\/script>\n```\n**Canvas** = a pixel bitmap you draw with JavaScript (games, image editing, thousands of data points). Individual shapes aren't elements, so it isn't accessible by default. **SVG for a few shapes/icons; canvas for many dynamic pixels.**\n\n## 2.10 Common mistakes (Module 2)\n| Mistake | Why bad | Fix |\n|---|---|---|\n| Headings chosen for size | broken outline | pick level by structure, style with CSS |\n| Missing/poor `alt` | inaccessible, filename read aloud | write purposeful alt, or `alt=\"\"` for decoration |\n| Link used as button | not keyboard/semantic correct | `<button>` for actions |\n| `<br><br>` for spacing | layout in HTML | CSS margins |\n| Table for layout | confuses screen readers, not responsive | Grid/Flex |\n| Button without `type` in form | accidental submit | `type=\"button\"` |\n| Images without width/height | layout jump | set both |\n\n## 2.11 Interview questions (Module 2)\n**Q1. `<strong>` vs `<b>`?** strong = semantic importance (may change screen-reader tone); b = visual bold only.\n**Q2. When do you use `alt=\"\"`?** For purely decorative images so assistive technology ignores them. A missing alt is an error.\n**Q3. SVG vs canvas vs img?** img for static files; SVG for scalable vector DOM graphics; canvas for pixel drawing via JS.\n**Q4. Why does my Cancel button submit the form?** default type is submit.\n**Q5. Why use `<time datetime>`?** Provides a machine-readable value for search engines, tools and scripts.\n**Q6. Absolute vs relative URL?** Absolute includes protocol and host; relative resolves from the current page/site root.\n**Q7. Why `rel=\"noopener\"` on `_blank`?** Prevents the opened page from accessing `window.opener` and redirecting your page (tabnabbing).\n**Q8. When is a table appropriate?** Only for genuinely tabular data.\n\n## 2.12 Exercises (Module 2)\n1. Build a \"recipe\" page using headings, a list of ingredients, an ordered list of steps, an image with `alt`, and a `<time>` for cooking time.\n2. Build an orders table with caption, `thead/tbody/tfoot`, and a total row using `colspan`. Test with the keyboard and with a screen reader (VoiceOver: Cmd+F5).\n3. Write 5 images' `alt` text for: product photo, logo that links home, decorative line, avatar next to the name, chart.\n4. Create a form with Cancel and Save buttons; observe the bug with no `type`, then fix it.\n\n## 2.13 Revision notes\nHeadings = outline, not size \u00b7 choose text tags by meaning \u00b7 lists for any list-like content \u00b7 links navigate, buttons act \u00b7 alt rules \u00b7 set image width/height \u00b7 tables only for data \u00b7 always set button `type` \u00b7 SVG for icons, canvas for pixels.\n\n## \u25b6 BUILD STEP 2 \u2014 chat list, order table and content\nReplace the Step-1 comment `<!-- chat list ... -->` in `<body>` with:\n```html\n<h2>Conversations<\/h2>\n<ul>\n  <li>\n    <img src=\"https://i.pravatar.cc/48?img=12\" alt=\"\" width=\"48\" height=\"48\" />\n    <strong>Ravi<\/strong>\n    <span>Is the red sneaker available in size 9?<\/span>\n    <time datetime=\"2026-10-30T09:12:00+05:30\">9:12 AM<\/time>\n    <b>2<\/b>\n  <\/li>\n  <li>\n    <img src=\"https://i.pravatar.cc/48?img=32\" alt=\"\" width=\"48\" height=\"48\" />\n    <strong>Asha<\/strong>\n    <span>Thanks, received!<\/span>\n    <time datetime=\"2026-10-29T18:40:00+05:30\">Yesterday<\/time>\n  <\/li>\n<\/ul>\n\n<h2>Recent orders<\/h2>\n<table>\n  <caption>Orders attached to chats<\/caption>\n  <thead><tr><th scope=\"col\">Order<\/th><th scope=\"col\">Item<\/th><th scope=\"col\">Total<\/th><th scope=\"col\">Status<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>#1001<\/td><td>Red Sneakers \u00d7 1<\/td><td>\u20b91,299<\/td><td>Paid<\/td><\/tr>\n    <tr><td>#1002<\/td><td>Socks \u00d7 3<\/td><td>\u20b9399<\/td><td>Pending<\/td><\/tr>\n  <\/tbody>\n<\/table>\n```\nNote `alt=\"\"` on avatars: the name is already next to them, so the image is decorative. Check the Elements panel to see the tree.\n\n---\n\n# MODULE 3 \u2014 SEMANTIC HTML\n\n## 3.1 What is semantic HTML? Why does it matter? \ud83d\udfe2\n\n**Semantic** means the tag **names the role** of the content. `<nav>` says \"navigation\", `<div>` says nothing.\n\n**Analogy:** a building's signage. \"Exit\", \"Reception\", \"Lift\" are semantic signs; a row of identical grey doors (`<div>`s) is not.\n\n**The accessibility tree.** Browsers build a second tree from your DOM for assistive tech: it lists **landmarks** (banner, navigation, main, complementary, contentinfo), headings, lists, buttons, links, form fields. A screen-reader user can press a key to \"jump to main\" or \"list all headings\". With `<div>` soup there is nothing to jump to.\n\n```\nSemantic page \u2192 accessibility tree                 Div soup \u2192 accessibility tree\nbanner                                              generic\n  navigation \"Main\"                                   generic\nmain                                                    generic\n  heading level 1 \"Seller Chat\"                           generic \"Seller Chat\"   \u2190 no heading, no landmarks\n  region \"Conversations\"\ncontentinfo\n```\n**Benefits:** (1) accessibility, (2) SEO, (3) built-in behaviour (a `<button>` is focusable and works with Enter/Space; a `<details>` toggles) with zero JS, (4) readable code, (5) easier styling and testing.\n\n| Non-semantic | Semantic replacement |\n|---|---|\n| `<div class=\"header\">` | `<header>` |\n| `<div class=\"nav\">` | `<nav>` |\n| `<div class=\"main\">` | `<main>` |\n| `<div class=\"card\">` (self-contained item) | `<article>` |\n| `<div class=\"sidebar\">` | `<aside>` |\n| `<div class=\"footer\">` | `<footer>` |\n| `<div onclick=\"\u2026\">` | `<button>` |\n| `<span class=\"bold\">` | `<strong>` |\n\n## 3.2 The structural elements \ud83d\udfe2\n\n| Element | Role | Rules |\n|---|---|---|\n| `<header>` | introductory content (logo, title, nav) of a page **or** a section | may appear several times |\n| `<nav>` | major navigation links | label with `aria-label` if more than one |\n| `<main>` | the page's primary unique content | **only one** visible per page |\n| `<section>` | thematic group, normally with a heading | not a generic wrapper; use `div` for that |\n| `<article>` | self-contained, reusable item (post, product card, chat message) | makes sense alone |\n| `<aside>` | tangential content (sidebar, related links) | |\n| `<footer>` | footer of a page or section | |\n| `<figure>/<figcaption>` | media + caption | |\n| `<details>/<summary>` | native expand/collapse | no JS |\n| `<dialog>` | native modal/popup | `showModal()` gives backdrop, focus trap, Esc to close |\n| `<address>` | contact info | |\n\n**Choosing between `section`, `article`, `div`:** Could this chunk be syndicated/published alone? \u2192 `article`. A themed group with its own heading? \u2192 `section`. Neither, just a styling/layout wrapper? \u2192 `div`.\n\n### details and dialog in action\n```html\n<details>\n  <summary>Order #1001 details<\/summary>\n  <p>2 \u00d7 Red Sneakers, 1 \u00d7 Socks. Shipped via BlueDart.<\/p>\n<\/details>\n```\nClick the summary: it opens/closes, keyboard accessible, no JavaScript.\n```html\n<button id=\"open-attach\" type=\"button\">Attach order<\/button>\n<dialog id=\"attach-dialog\" aria-labelledby=\"attach-title\">\n  <form method=\"dialog\">\n    <h2 id=\"attach-title\">Attach order<\/h2>\n    <p>Select an order to send in this chat.<\/p>\n    <button value=\"cancel\">Cancel<\/button>\n    <button value=\"ok\">Attach<\/button>\n  <\/form>\n<\/dialog>\n<script>\n  const dlg = document.getElementById('attach-dialog')\n  document.getElementById('open-attach').addEventListener('click', () => dlg.showModal())\n  dlg.addEventListener('close', () => console.log('closed with', dlg.returnValue))\n<\/script>\n```\n**Line by line:** `showModal()` opens it as a modal: the rest of the page becomes inert, focus moves inside and is trapped, Esc closes it. A `<form method=\"dialog\">` closes the dialog on submit and stores the clicked button's `value` in `dlg.returnValue`. This is the same \"Attach order\" popup we build in the Seller Chat project (later as a Vue component).\n\n## 3.3 How professional pages are structured \ud83c\udfed\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 <header> (logo, <nav>) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 <aside>       \u2502 <main>                                                         \u2502\n\u2502 chat list     \u2502   <section> chat room                                          \u2502\n\u2502  <ul><li>\u2026    \u2502     <header> chat title <\/header>                              \u2502\n\u2502               \u2502     <article> message <\/article> \u2026                             \u2502\n\u2502               \u2502     <form> composer <\/form>                                    \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 <footer> \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n```html\n<body>\n  <a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n  <header>\n    <h1>Seller Chat<\/h1>\n    <nav aria-label=\"Main\"><ul><li><a href=\"/chats\" aria-current=\"page\">Chats<\/a><\/li><li><a href=\"/orders\">Orders<\/a><\/li><\/ul><\/nav>\n  <\/header>\n  <div class=\"layout\">\n    <aside aria-label=\"Conversations\">\u2026<\/aside>\n    <main id=\"main\">\n      <section aria-labelledby=\"room-title\">\n        <h2 id=\"room-title\">Chat with Ravi<\/h2>\n        \u2026\n      <\/section>\n    <\/main>\n  <\/div>\n  <footer><small>\u00a9 2026 Company<\/small><\/footer>\n<\/body>\n```\nThe **skip link** lets keyboard users jump past the navigation straight to the content (CSS hides it until focused).\n\n## 3.4 Refactor exercise walkthrough: div soup \u2192 semantic\n**Before**\n```html\n<div class=\"top\"><div class=\"logo\">Seller Chat<\/div><div class=\"links\"><div><a href=\"/chats\">Chats<\/a><\/div><\/div><\/div>\n<div class=\"content\"><div class=\"msg\"><div class=\"who\">Ravi<\/div><div class=\"text\">Hi<\/div><\/div><\/div>\n<div class=\"send\" onclick=\"send()\">Send<\/div>\n```\n**After**\n```html\n<header><h1>Seller Chat<\/h1><nav aria-label=\"Main\"><ul><li><a href=\"/chats\">Chats<\/a><\/li><\/ul><\/nav><\/header>\n<main>\n  <article><h2>Ravi<\/h2><p>Hi<\/p><\/article>\n  <button type=\"button\" onclick=\"send()\">Send<\/button>\n<\/main>\n```\nWhat changed and why: header/nav/main landmarks, a real heading, a real list for links, an `article` for the message, and a real **button** (focusable, Enter/Space activate it, announced as \"button\").\n\n## 3.5 Common mistakes (Module 3)\n| Mistake | Fix |\n|---|---|\n| `<div>` for everything | choose semantic elements |\n| Multiple `<main>` | exactly one visible |\n| `<section>` without a heading | use a heading, or use `div` |\n| `<div onclick>` as button | `<button type=\"button\">` |\n| Using headings to size text | CSS |\n| `<nav>` for every group of links | only major navigation blocks |\n| Forgetting accessible names on repeated landmarks | `aria-label` |\n\n## 3.6 Interview questions (Module 3)\n**Q1. What is semantic HTML and why use it?** Using elements by meaning; gives accessibility, SEO, built-in behaviour and maintainable code.\n**Q2. `section` vs `article` vs `div`?** See 3.2.\n**Q3. Why is `<div onclick>` a bad button?** Not focusable, no keyboard activation, no role; you'd rebuild what `<button>` provides.\n**Q4. What are landmarks?** Regions (banner, navigation, main, complementary, contentinfo, search, form, region) screen-reader users can jump between; created by `header/nav/main/aside/footer` etc.\n**Q5. Can there be more than one `<header>`?** Yes: one per page and one per sectioning element; only the page-level one is the \"banner\" landmark.\n**Q6. What does `<dialog>.showModal()` give you?** Backdrop, top-layer rendering, inert background, focus management, Esc to close.\n\n## 3.7 Exercises\n1. Convert any div-only page (find one in your company project) to semantic HTML and run Lighthouse Accessibility before/after.\n2. Open the page in Chrome DevTools \u2192 Elements \u2192 **Accessibility** pane and read the landmarks.\n3. Use only the keyboard (Tab, Shift+Tab, Enter, Space, Esc) to operate `details` and `dialog`.\n4. Add a skip link and verify it's the first tab stop.\n\n## 3.8 Revision notes\nSemantics = meaning + accessibility + free behaviour \u00b7 one `main` \u00b7 `article` is self-contained \u00b7 `button` for actions \u00b7 `dialog.showModal()` gives modal behaviour natively \u00b7 skip link.\n\n## \u25b6 BUILD STEP 3 \u2014 restructure the page semantically\nRewrite your `<body>` into this structure (move your Step-2 content into place):\n```html\n<body>\n  <a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n\n  <header>\n    <h1>Seller Chat<\/h1>\n    <nav aria-label=\"Main\">\n      <ul>\n        <li><a href=\"/chats\" aria-current=\"page\">Chats<\/a><\/li>\n        <li><a href=\"/orders\">Orders<\/a><\/li>\n      <\/ul>\n    <\/nav>\n  <\/header>\n\n  <div class=\"layout\">\n    <aside aria-label=\"Conversations\">\n      <h2>Conversations<\/h2>\n      <ul class=\"chat-list\"><!-- the two <li> chat rows from Step 2 --><\/ul>\n    <\/aside>\n\n    <main id=\"main\">\n      <section aria-labelledby=\"room-title\">\n        <header>\n          <h2 id=\"room-title\">Ravi<\/h2>\n          <button type=\"button\" id=\"open-attach\">Attach order<\/button>\n        <\/header>\n\n        <div class=\"messages\" role=\"log\" aria-live=\"polite\">\n          <article class=\"msg msg--theirs\">\n            <p>Is the red sneaker available in size 9?<\/p>\n            <p><time datetime=\"2026-10-30T09:12:00+05:30\">9:12 AM<\/time><\/p>\n          <\/article>\n          <article class=\"msg msg--mine\">\n            <p>Yes! We have size 9 in stock.<\/p>\n            <p><time datetime=\"2026-10-30T09:14:00+05:30\">9:14 AM<\/time><\/p>\n          <\/article>\n        <\/div>\n\n        <!-- composer form comes in Step 4 -->\n      <\/section>\n    <\/main>\n  <\/div>\n\n  <dialog id=\"attach-dialog\" aria-labelledby=\"attach-title\">\n    <form method=\"dialog\">\n      <h2 id=\"attach-title\">Attach order<\/h2>\n      <!-- the orders table from Step 2 can go here later -->\n      <button value=\"cancel\">Cancel<\/button>\n      <button value=\"ok\">Attach<\/button>\n    <\/form>\n  <\/dialog>\n\n  <footer><small>\u00a9 2026 Company<\/small><\/footer>\n<\/body>\n```\n`role=\"log\"` + `aria-live=\"polite\"` makes screen readers announce newly added messages (explained in Module 5).\n\n---\n\n# MODULE 4 \u2014 HTML FORMS\n\n## 4.1 What is a form and why does it exist? \ud83d\udfe2\nA **form** collects information from the user and sends it somewhere (usually a server). Every login, signup, search box, checkout and **chat composer** is a form.\n**Analogy:** a paper form at a bank: labelled boxes you fill in, then you hand it to the clerk. The browser is the clerk who carries it to the server.\n\n## 4.2 Anatomy \ud83d\udfe2\n```html\n<form action=\"/api/login\" method=\"post\">\n  <label for=\"email\">Email<\/label>\n  <input id=\"email\" name=\"email\" type=\"email\" required />\n  <button type=\"submit\">Log in<\/button>\n<\/form>\n```\n| Part | Meaning |\n|---|---|\n| `action` | URL that receives the data (default: current page) |\n| `method` | `get` or `post` |\n| `<label for=\"email\">` | text tied to the input with matching `id`; clicking it focuses the input; screen readers read it |\n| `id` | unique identifier (for the label and JS) |\n| **`name`** | **the key sent to the server.** An input without `name` is **not submitted** |\n| `type` | kind of input (affects keyboard, validation, UI) |\n| `required` | must be filled |\n**Never use `placeholder` instead of a label**: it disappears when typing and is poorly read by assistive tech.\n\n### GET vs POST: what the server actually receives\n**GET** (search): data goes in the URL.\n```\nGET /search?q=red+shoes&page=2 HTTP/1.1\nHost: shop.com\n```\n**POST** (login/create): data goes in the request body.\n```\nPOST /api/login HTTP/1.1\nHost: shop.com\nContent-Type: application/x-www-form-urlencoded\n\nemail=ravi%40shop.com&password=secret123\n```\n| | GET | POST |\n|---|---|---|\n| Purpose | read/search | create/change/login |\n| Where is data | URL query string | body |\n| Bookmarkable/cacheable | yes | no |\n| Visible in history/logs | **yes** (never put passwords here) | less |\n| Size | limited by URL | large |\n| Files | no | yes (`multipart/form-data`) |\nPOST is not \"secure\" by itself; **HTTPS** provides secrecy.\n\n## 4.3 Input types \ud83d\udfe2\n```html\n<input type=\"text\">  <input type=\"email\">   <input type=\"password\">  <input type=\"search\">\n<input type=\"tel\">   <input type=\"url\">     <input type=\"number\" min=\"1\" max=\"10\" step=\"1\">\n<input type=\"date\">  <input type=\"time\">    <input type=\"datetime-local\"> <input type=\"month\">\n<input type=\"range\" min=\"0\" max=\"100\">      <input type=\"color\">      <input type=\"file\">\n<input type=\"checkbox\"> <input type=\"radio\"> <input type=\"hidden\" name=\"csrf\" value=\"abc\">\n```\nChoosing the correct `type` gives you: browser validation (`email`), the right mobile keyboard (`tel`, `email`, `number`), pickers (`date`, `color`), password masking, and better autofill. Add `autocomplete` hints: `autocomplete=\"username\"`, `current-password`, `new-password`, `email`, `one-time-code`.\n\n## 4.4 Other controls \ud83d\udfe2\n```html\n<label for=\"note\">Note<\/label>\n<textarea id=\"note\" name=\"note\" rows=\"4\" maxlength=\"500\"><\/textarea>\n\n<label for=\"role\">Role<\/label>\n<select id=\"role\" name=\"role\" required>\n  <option value=\"\">-- choose --<\/option>\n  <optgroup label=\"Staff\">\n    <option value=\"admin\">Admin<\/option>\n    <option value=\"seller\" selected>Seller<\/option>\n  <\/optgroup>\n<\/select>\n\n<fieldset>\n  <legend>Notify me by<\/legend>\n  <label><input type=\"checkbox\" name=\"notify\" value=\"email\" checked> Email<\/label>\n  <label><input type=\"checkbox\" name=\"notify\" value=\"sms\"> SMS<\/label>\n<\/fieldset>\n\n<fieldset>\n  <legend>Account type<\/legend>\n  <label><input type=\"radio\" name=\"type\" value=\"seller\" checked> Seller<\/label>\n  <label><input type=\"radio\" name=\"type\" value=\"buyer\"> Buyer<\/label>\n<\/fieldset>\n\n<input list=\"cities\" name=\"city\"><datalist id=\"cities\"><option value=\"Pune\"><option value=\"Delhi\"><\/datalist>\n```\n**Rules to remember**\n- Radios in a group **share one `name`** \u2192 only one can be selected.\n- Checkboxes sharing a name submit **multiple values** (`notify=email&notify=sms`).\n- An **unchecked** checkbox/radio sends **nothing**. (Spring/JS must treat \"missing\" as false.)\n- `fieldset`/`legend` give a group a name for screen readers.\n- Option **value** is what's sent; option **text** is what's displayed.\n\n## 4.5 Validation \ud83d\udfe1\n```html\n<input name=\"username\" required minlength=\"3\" maxlength=\"20\" pattern=\"[A-Za-z0-9_]+\" title=\"Letters, digits and underscore only\">\n<input type=\"number\" name=\"qty\" min=\"1\" max=\"99\">\n<input type=\"email\" required>\n```\nAttributes: `required`, `minlength`/`maxlength`, `min`/`max`/`step`, `pattern` (regex), type rules. If invalid, the browser blocks submission, shows a message and focuses the first invalid field. CSS: `:invalid`, `:valid`, `:user-invalid`. JavaScript: `input.validity.valueMissing`, `input.checkValidity()`, `input.setCustomValidity('msg')`, `form.noValidate`/`novalidate` (turn off to show custom messages).\n> **Golden rule:** client-side validation is **user experience**, not security. Anyone can bypass it (DevTools, curl, Postman). **Spring Boot must validate again** (`@Valid`, `@NotBlank`, `@Email`, `@Size`).\n\n### disabled vs readonly\n| | `disabled` | `readonly` |\n|---|---|---|\n| Editable | no | no |\n| Focusable | no | yes |\n| **Sent on submit** | **no** | **yes** |\nUse `readonly` for values the user can't change but the server needs (e.g. an order id).\n\n## 4.6 File uploads \ud83d\udfe1\n```html\n<form action=\"/api/avatar\" method=\"post\" enctype=\"multipart/form-data\">\n  <label for=\"avatar\">Photo<\/label>\n  <input id=\"avatar\" type=\"file\" name=\"avatar\" accept=\"image/*\" />\n  <input type=\"file\" name=\"docs\" multiple />\n  <button>Upload<\/button>\n<\/form>\n```\nWithout `enctype=\"multipart/form-data\"` only the filename is sent. The body is split into **parts** separated by a boundary:\n```\nPOST /api/avatar HTTP/1.1\nContent-Type: multipart/form-data; boundary=----X1\n\n------X1\nContent-Disposition: form-data; name=\"avatar\"; filename=\"me.png\"\nContent-Type: image/png\n\n<binary bytes of the image>\n------X1--\n```\nSpring: `@PostMapping(\"/avatar\") ResponseEntity<?> upload(@RequestParam(\"avatar\") MultipartFile file)`. `accept` is only a hint: **validate type and size on the server**.\n\n## 4.7 The submission lifecycle (what really happens) \ud83d\udfe1\n```\nUser presses Enter / clicks submit\n   \u2502\n   \u251c\u2500\u25ba browser validates (required, pattern, type\u2026)\n   \u2502      \u2514\u2500 invalid \u2192 show message, focus field, STOP  (no \"submit\" event)\n   \u2502\n   \u251c\u2500\u25ba \"submit\" event fires on <form>   \u2190 JavaScript can call event.preventDefault() here\n   \u251c\u2500\u25ba browser collects named, enabled controls into a list of name=value pairs\n   \u251c\u2500\u25ba encodes them (urlencoded or multipart) \u2192 sends the request\n   \u2514\u2500\u25ba the PAGE NAVIGATES to the response (classic forms)\n```\n**Modern single-page apps** stop the navigation and use `fetch`:\n```html\n<form id=\"reg\">\n  <label>Name <input name=\"name\" required><\/label>\n  <label>Email <input name=\"email\" type=\"email\" required><\/label>\n  <button>Register<\/button>\n  <p id=\"status\" role=\"status\"><\/p>\n<\/form>\n<script>\n  const form = document.getElementById('reg')\n  const status = document.getElementById('status')\n  form.addEventListener('submit', async (event) => {\n    event.preventDefault()                         // 1) stop the normal page navigation\n    const data = Object.fromEntries(new FormData(form))   // 2) {name:'\u2026', email:'\u2026'}\n    status.textContent = 'Saving\u2026'\n    try {\n      const res = await fetch('/api/users', {      // 3) send JSON to Spring Boot\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(data),\n      })\n      if (!res.ok) throw new Error(`HTTP ${res.status}`)\n      status.textContent = 'Registered!'\n      form.reset()\n    } catch (err) {\n      status.textContent = 'Could not register: ' + err.message\n    }\n  })\n<\/script>\n```\n**Line by line:** `preventDefault` keeps the page from reloading; `FormData(form)` collects every named field; `Object.fromEntries` turns it into a plain object; `JSON.stringify` converts to text; `Content-Type: application/json` tells Spring to parse the body for `@RequestBody`; `res.ok` checks the HTTP status (fetch only throws on network failures); `status` is a live region (`role=\"status\"`) so screen readers announce progress.\nIf you pass a `FormData` object directly as `body`, the browser sends multipart and sets the `Content-Type` with boundary **itself**, so don't set it manually.\n**Spring side:**\n```java\npublic record RegisterRequest(@NotBlank String name, @Email @NotBlank String email) {}\n@PostMapping(\"/api/users\")\npublic ResponseEntity<UserDto> register(@Valid @RequestBody RegisterRequest req) { \u2026 }\n```\nKeys in the JSON must match the record fields, otherwise values arrive as `null`.\n\n## 4.8 Accessible error messages \ud83d\udfe1\n```html\n<label for=\"email\">Email<\/label>\n<input id=\"email\" name=\"email\" type=\"email\" required aria-invalid=\"true\" aria-describedby=\"email-err\">\n<p id=\"email-err\" role=\"alert\">Enter a valid email like name@shop.com<\/p>\n```\n`aria-describedby` connects the error to the input; `role=\"alert\"` makes screen readers announce it immediately; don't rely on colour alone, also show text/icon.\n\n## 4.9 Complete forms \ud83c\udfed\n\n**Login**\n```html\n<form class=\"card\" id=\"login\" novalidate>\n  <h1>Seller login<\/h1>\n  <div class=\"field\">\n    <label for=\"l-email\">Email<\/label>\n    <input id=\"l-email\" name=\"email\" type=\"email\" autocomplete=\"username\" required>\n    <p class=\"error\" id=\"l-email-err\" role=\"alert\"><\/p>\n  <\/div>\n  <div class=\"field\">\n    <label for=\"l-pass\">Password<\/label>\n    <input id=\"l-pass\" name=\"password\" type=\"password\" autocomplete=\"current-password\" required minlength=\"8\">\n    <p class=\"error\" id=\"l-pass-err\" role=\"alert\"><\/p>\n  <\/div>\n  <label><input type=\"checkbox\" name=\"remember\"> Remember me<\/label>\n  <button type=\"submit\">Log in<\/button>\n<\/form>\n```\n**Registration**\n```html\n<form action=\"/api/register\" method=\"post\">\n  <label>Full name <input name=\"fullName\" required autocomplete=\"name\"><\/label>\n  <label>Email <input name=\"email\" type=\"email\" required autocomplete=\"email\"><\/label>\n  <label>Password <input name=\"password\" type=\"password\" minlength=\"8\" required autocomplete=\"new-password\"><\/label>\n  <label>Date of birth <input name=\"dob\" type=\"date\" max=\"2010-12-31\"><\/label>\n  <fieldset><legend>Account type<\/legend>\n    <label><input type=\"radio\" name=\"type\" value=\"seller\" checked> Seller<\/label>\n    <label><input type=\"radio\" name=\"type\" value=\"buyer\"> Buyer<\/label>\n  <\/fieldset>\n  <label><input type=\"checkbox\" name=\"terms\" required> I accept the terms<\/label>\n  <button>Create account<\/button>\n<\/form>\n```\n**Search** (GET: bookmarkable)\n```html\n<form role=\"search\" action=\"/search\" method=\"get\">\n  <label for=\"q\" class=\"sr-only\">Search chats<\/label>\n  <input id=\"q\" name=\"q\" type=\"search\" placeholder=\"Search chats\u2026\">\n  <button>Search<\/button>\n<\/form>\n<!-- typing \"ravi\" and submitting goes to /search?q=ravi -->\n```\n**Employee form**\n```html\n<form id=\"emp\" method=\"post\" action=\"/api/employees\">\n  <input type=\"hidden\" name=\"id\" value=\"\">\n  <label>Name <input name=\"name\" required><\/label>\n  <label>Email <input name=\"email\" type=\"email\" required><\/label>\n  <label>Department\n    <select name=\"dept\" required><option value=\"\">Select<\/option><option>Engineering<\/option><option>Sales<\/option><\/select>\n  <\/label>\n  <label>Salary <input name=\"salary\" type=\"number\" min=\"0\" step=\"1000\"><\/label>\n  <label>Joining date <input name=\"joined\" type=\"date\"><\/label>\n  <label>Notes <textarea name=\"notes\" maxlength=\"300\"><\/textarea><\/label>\n  <label>Photo <input type=\"file\" name=\"photo\" accept=\"image/*\"><\/label>\n  <button>Save employee<\/button>\n<\/form>\n```\n**Chat message composer** (what Seller Chat needs)\n```html\n<form class=\"composer\" id=\"composer\">\n  <label for=\"msg\" class=\"sr-only\">Message<\/label>\n  <textarea id=\"msg\" name=\"text\" rows=\"1\" maxlength=\"500\" placeholder=\"Type a message\" required><\/textarea>\n  <button type=\"submit\">Send<\/button>\n<\/form>\n```\n\n## 4.10 Common mistakes (Module 4)\n| Mistake | Effect | Fix |\n|---|---|---|\n| input without `name` | not submitted | add `name` |\n| placeholder as label | inaccessible | real `<label>` |\n| button without `type` in form | accidental submit | set `type` |\n| files without `enctype` | only filename sent | `multipart/form-data` |\n| relying on client validation | bypassable | validate on server too |\n| password sent via GET | in URL/logs | POST over HTTPS |\n| radios with different names | multiple selectable | same `name` |\n| wrong `label for`/`id` | clicking label does nothing | match them |\n\n## 4.11 Interview questions (Module 4)\n**Q1. What is submitted for an input without a `name`?** Nothing; `name` is the key in the submitted data and in `FormData`.\n**Q2. GET vs POST?** (4.2 table).\n**Q3. `disabled` vs `readonly`?** (4.5 table).\n**Q4. Why use `<form>` instead of a `div` + button + JS?** Enter-to-submit, native validation, `FormData`, accessibility, password-manager support.\n**Q5. Is client-side validation enough?** No, it's UX only; the server must validate.\n**Q6. How do you send a file?** `multipart/form-data` (HTML form or `FormData` with `fetch`); don't set Content-Type manually with fetch.\n**Q7. What happens when you press Enter in a text input?** The browser triggers the form's submit (via the default submit button) if the form is valid.\n**Q8. What does `form.reset()` do vs `event.preventDefault()`?** reset restores default values; preventDefault cancels the browser's default action (navigation).\n\n## 4.12 Exercises (Module 4)\n1. Build the login and registration forms with all labels. Submit registration with GET and read the URL; change to POST and inspect the request in DevTools \u2192 Network \u2192 Payload.\n2. Add `required`, `minlength`, `pattern`; type invalid data and read `input.validity` in the Console.\n3. Make the employee form send JSON with `fetch` to `https://jsonplaceholder.typicode.com/users` and show the response `id`.\n4. Add accessible inline error messages with `aria-describedby`.\n\n## 4.13 Revision notes\n`name` = key \u00b7 `label for` = `id` \u00b7 correct `type` + `autocomplete` \u00b7 GET = URL, POST = body \u00b7 files need `enctype` \u00b7 client validation is UX only \u00b7 `preventDefault` + `FormData` + `fetch` = SPA form \u00b7 unchecked boxes send nothing.\n\n## \u25b6 BUILD STEP 4 \u2014 add the composer and a login page\nUnder the `.messages` div inside your chat `<section>`, add the composer form from 4.9. Create `login.html` with the login form from 4.9 (wrapped in `<main>` with the same head). Open both and test the validation attributes.\n\n---\n\n# MODULE 5 \u2014 HTML AND BROWSER INTEGRATION\n\n## 5.1 How the browser reads HTML \ud83d\udfe1\n```\nbytes \u2192 decode (UTF-8) \u2192 characters \u2192 TOKENIZER \u2192 tokens \u2192 TREE BUILDER \u2192 DOM\nCSS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba CSSOM\nDOM + CSSOM \u2192 RENDER TREE \u2192 LAYOUT \u2192 PAINT \u2192 COMPOSITE \u2192 pixels\n```\n- **Tokenizer:** turns `<p class=\"a\">` into tokens (start tag `p`, attribute `class`).\n- **Tree builder:** nests tokens into nodes. It is **forgiving**: it repairs bad HTML, so your file and the DOM can differ.\n- **DOM** (Document Object Model): the live tree of objects JavaScript can read and change.\n- **Streaming:** the browser starts building while bytes are still arriving, so the page can show before the whole file loads.\n- **Preload scanner:** while the parser waits on a blocking script, a helper scans ahead and starts downloading images/CSS/scripts.\n- **View Source** = original text; **Elements** = live DOM.\n\n## 5.2 Loading scripts: blocking, `async`, `defer`, modules \ud83d\udfe1\nA plain `<script src>` **pauses HTML parsing**: the browser downloads and runs it before continuing, because the script might change the DOM.\n```\nnormal  HTML \u2588\u2588\u2588\u2588\u2592\u2592\u2592\u2592\u2592\u2592\u2592\u2592\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588   (\u2592 = parsing paused: download + run)\nasync   HTML \u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2592\u2592\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588   download in parallel; RUN as soon as ready (pauses parser briefly), order not guaranteed\ndefer   HTML \u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2192 run (after parsing, in order)   download in parallel\nmodule  like defer, plus its own scope and import/export\n```\n| | normal | `async` | `defer` | `type=\"module\"` |\n|---|---|---|---|---|\n| Blocks parsing | download + run | run only | no | no |\n| Order kept | yes | **no** | yes | yes |\n| DOM ready when it runs | not guaranteed | maybe | **yes** | yes |\n| Best for | legacy | independent scripts (analytics) | app code | modern ES modules (Vite/Vue) |\nOld workaround: put scripts at the end of `<body>`. Modern: `defer` in `<head>`. Vite's `index.html` uses `<script type=\"module\" src=\"/src/main.js\"><\/script>`.\n**Experiment:** log `document.getElementById('x')` from a normal script in `<head>` \u2192 `null` (element not parsed yet); with `defer` \u2192 found.\n\n## 5.3 CSS and JS integration \ud83d\udfe2\n```html\n<link rel=\"stylesheet\" href=\"styles.css\">        <!-- external; render-blocking on purpose to avoid unstyled flash -->\n<style> /* small critical CSS only */ <\/style>\n<script src=\"app.js\" defer><\/script>\n<button onclick=\"save()\">Save<\/button>          <!-- inline handler: avoid; harder to maintain, blocks strict CSP -->\n```\nPrefer external files + `addEventListener`. Use `<link rel=\"preload\" as=\"font\" \u2026>` for key fonts.\n\n## 5.4 Accessibility and ARIA \ud83d\udfe1\n**Accessibility (a11y):** designing for people who use screen readers, keyboards only, voice control, zoom, or who have low vision, colour blindness, motor or cognitive difficulties, and for everyone in bad conditions (sunlight, one hand).\n**ARIA** (Accessible Rich Internet Applications): attributes that add meaning when native HTML can't express it.\n```html\n<button aria-label=\"Close chat\">\u2715<\/button>                        <!-- icon-only button needs a name -->\n<button aria-expanded=\"false\" aria-controls=\"menu\">Menu<\/button>   <!-- state of a toggle -->\n<ul id=\"messages\" role=\"log\" aria-live=\"polite\">\u2026<\/ul>             <!-- announce new chat messages -->\n<input aria-invalid=\"true\" aria-describedby=\"err\">\n<p id=\"err\" role=\"alert\">Email is required<\/p>                      <!-- announced immediately -->\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"t\">\u2026<\/div>    <!-- prefer <dialog> -->\n```\n**Five rules of ARIA:** (1) Use a native element if one exists. (2) Don't change native semantics. (3) All ARIA controls must be keyboard operable. (4) Don't hide focusable elements. (5) Interactive elements need accessible names.\nARIA only changes what is **announced**, never behaviour: you must still implement keyboard handling.\n**Checklist:** every image has `alt`; every input has a label; heading order logical; visible focus; Tab order follows reading order; no `tabindex` > 0; colour contrast \u2265 4.5:1; works at 200% zoom.\n**Test:** Tab through the page; use VoiceOver (macOS Cmd+F5) or NVDA; Lighthouse/axe DevTools.\n\n## 5.5 SEO basics \ud83d\udfe1\n- Unique `<title>` and `<meta name=\"description\">` per page.\n- One `h1`; semantic structure; meaningful link text.\n- `alt` on images; canonical link; `robots` meta; sitemap; structured data (JSON-LD).\n- Social previews: Open Graph `<meta property=\"og:title\">`.\n- **SPA caveat:** a Vue SPA ships an almost empty `<div id=\"app\">`; crawlers may see little. Fix with SSR/SSG (Nuxt) or prerendering. Internal tools behind login (like a seller dashboard) don't need SEO.\n```html\n<meta name=\"description\" content=\"Manage all your buyer chats and orders in one place.\">\n<link rel=\"canonical\" href=\"https://sellerchat.example.com/\">\n<meta property=\"og:title\" content=\"Seller Chat\"><meta property=\"og:image\" content=\"/preview.png\">\n<link rel=\"icon\" href=\"/favicon.ico\"><meta name=\"theme-color\" content=\"#0b6e75\">\n```\n\n## 5.6 Responsive images \ud83d\udfe1\n```html\n<img src=\"p-800.jpg\"\n     srcset=\"p-400.jpg 400w, p-800.jpg 800w, p-1600.jpg 1600w\"\n     sizes=\"(max-width: 600px) 100vw, 50vw\"\n     alt=\"Red sneakers\" width=\"800\" height=\"600\" loading=\"lazy\" decoding=\"async\">\n\n<picture>\n  <source type=\"image/avif\" srcset=\"p.avif\">\n  <source type=\"image/webp\" srcset=\"p.webp\">\n  <img src=\"p.jpg\" alt=\"Red sneakers\" width=\"800\" height=\"600\">\n<\/picture>\n```\n`srcset` lists candidate files with their real widths (`w`). `sizes` tells the browser how wide the image will be at each viewport. The browser then downloads the **smallest adequate** file (saves mobile data). `<picture>` gives format fallbacks (AVIF \u2192 WebP \u2192 JPEG) or art direction.\n\n## 5.7 HTML security \ud83d\udd34\n| Threat | How | Defence |\n|---|---|---|\n| **XSS** | user text inserted as HTML (`innerHTML`, `v-html`) runs scripts | insert as text (`textContent`, `{{ }}`), sanitise (DOMPurify), CSP |\n| **Clickjacking** | your page framed by an attacker's page | CSP `frame-ancestors 'none'` / `X-Frame-Options` |\n| **Tabnabbing** | `target=_blank` without noopener | `rel=\"noopener noreferrer\"` |\n| **Mixed content** | `http://` assets on `https://` page | use https |\n| **javascript: URLs** | `href=\"javascript:...\"` from user data | allow only http/https schemes |\n| **Leaked secrets** | in comments/hidden fields/source | never put secrets in client code |\n```js\nconst el = document.querySelector('#msg')\nel.innerHTML = userText      // \u274c <img src=x onerror=stealToken()> would run\nel.textContent = userText    // \u2705 shown as plain text\n```\n\n## 5.8 Production HTML practices \ud83c\udfed\n1. Valid markup (W3C validator, Lighthouse). 2. `lang`, charset, viewport, title on every page. 3. `width`/`height` on images; lazy-load below the fold. 4. `defer`/`module` scripts; no inline handlers. 5. Every iframe has a `title`; every control has an accessible name. 6. Consisten
