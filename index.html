clicked \"Pay\" must not charge twice. Disable the button while submitting; for critical writes send an `Idempotency-Key` header the backend can dedupe on.\n\n## 64.7 Mistakes and questions\n**Mistakes:** sending `application/x-www-form-urlencoded` when Spring expects JSON \u00b7 fixing CORS in the frontend \u00b7 assuming 0-based vs 1-based pages \u00b7 trusting `Long` ids above 2^53 \u00b7 blocking on read-after-write.\n**Q1. How does a JSON body reach a Spring controller?** **Q2. What do you do on 415?** missing/wrong `Content-Type`. **Q3. 400 vs 422 vs 409?** **Q4. Why might the UI show stale data?** cache/eventual consistency. **Q5. Who fixes a CORS error, and how?** **Q6. Offset vs cursor pagination?** **Q7. What is an idempotency key?**\n**Exercises:** call a public API and then your Spring endpoint with the same `chatApi` interface \u00b7 deliberately send a wrong field name and read the 400 body \u00b7 write the TypeScript interface for a Spring DTO from its Swagger entry \u00b7 simulate eventual consistency in the mock (list lags by 1 s) and make the UI cope.\n\n## \u25b6 COMPANY STEP 64\nWrite a one-page **API contract note** for Seller Chat (endpoints, params, request/response JSON, status codes, error shape) and review it against the real Swagger. Fix any mismatch in the mock.\n\n---\n\n# MODULE 65 \u2014 OTHER TOOLS YOU WILL MEET (overview) \ud83d\udfe1\n\nYou don't need to master these now: know what they are so a ticket or meeting doesn't lose you.\n| Tool / term | What it is | When you'll meet it |\n|---|---|---|\n| **Nuxt** | Vue meta-framework: server-side rendering, static generation, file-based routing | SEO-heavy public sites |\n| **SSR / SSG** | HTML rendered on the server / at build time instead of in the browser | faster first paint, SEO |\n| **Webpack / Vue CLI** | older bundler stack | legacy Vue 2 projects (`vue.config.js`) |\n| **Tailwind CSS** | utility-first CSS (`class=\"flex gap-2 p-4\"`) | some design systems |\n| **Sass / SCSS** | CSS preprocessor: variables, nesting, mixins | `<style lang=\"scss\">` in older code |\n| **Monorepo** (pnpm workspaces, Nx, Turborepo) | several packages/apps in one repo | shared UI libs + multiple apps |\n| **Micro-frontends** | independent frontends composed into one shell (module federation) | very large orgs |\n| **PWA / service worker** | installable, offline-capable web app | mobile-like experience |\n| **GraphQL** | query language: client asks exactly the fields needed | alternative to REST |\n| **WebSocket / SSE** | persistent connections for live data | chat, notifications |\n| **MSW** (Mock Service Worker) | intercepts requests at the network level for dev/tests | before the backend exists |\n| **Sentry / Datadog RUM** | error and performance monitoring | production |\n| **Husky + lint-staged** | git hooks that lint/format before commit | code-quality gates |\n| **Conventional Commits** | `feat:`, `fix:`, `chore:` message standard | changelogs, release automation |\n| **Feature flags** | runtime toggles | safe rollouts |\n| **Cypress / Playwright** | browser end-to-end tests | critical flows in CI |\n| **ESLint / Prettier** | linting / formatting | every project |\n**Sass in one minute (you will see this):**\n```scss\n$brand: #0b6e75;\n.chat-item { padding: 12px; &:hover { background: lighten($brand, 60%); } .badge { color: $brand; } }   // & = parent; nesting\n```\n**WebSocket in one minute** (inbound chat messages):\n```js\nlet ws\nonMounted(() => { ws = new WebSocket(`wss://${location.host}/ws/chat`); ws.onmessage = e => store.receive(JSON.parse(e.data)); ws.onclose = () => setTimeout(connect, 2000) })   // reconnect with backoff\nonUnmounted(() => { ws.onclose = null; ws.close() })\n```\n**Questions:** **Q1. SSR vs SPA?** **Q2. When would you choose Nuxt?** **Q3. REST vs GraphQL?** **Q4. WebSocket vs SSE vs polling?** **Q5. What are micro-frontends?**\n\n---\n\n# MODULE 66 \u2014 QUALITY DRILLS AND COMPANY CHECKLISTS \ud83c\udfed\n\n## 66.1 Pre-PR checklist (copy into your PR template)\n- [ ] Works at 320 px, tablet and desktop; keyboard-only; no console errors or warnings.\n- [ ] Loading, empty, error and success states handled; double-submit prevented.\n- [ ] API data guarded (`?.`, defaults); no unescaped user HTML.\n- [ ] Listeners, timers and sockets cleaned up; stale requests cancelled.\n- [ ] Accessible: labels, alt text, focus order, contrast, ARIA only when needed.\n- [ ] No hard-coded URLs, secrets or strings; env variables used; i18n keys if applicable.\n- [ ] Unit/component tests for new logic; lint and format pass; no `console.log` or dead code.\n- [ ] Screenshots/GIF and test steps in the PR description; Jira ticket linked.\n\n## 66.2 Code-review checklist (as reviewer) \ud83d\udfe1\nCorrectness \u00b7 edge cases (empty/null/slow/failed) \u00b7 naming \u00b7 duplication \u00b7 component size and responsibility \u00b7 state ownership (local vs store vs URL) \u00b7 performance (re-renders, large lists) \u00b7 security (XSS, tokens) \u00b7 accessibility \u00b7 tests \u00b7 API-contract compatibility \u00b7 is the diff small enough to review?\n**How to write a good review comment:** say what you see, why it matters, and suggest a fix; separate **blocking** from **nit**; ask questions instead of assuming. **How to receive one:** don't defend: understand, fix or discuss; thank the reviewer.\n\n## 66.3 Writing a good PR \ud83d\udfe1\nSmall and focused \u00b7 title in the team convention (`feat(chat): add retry for failed messages`) \u00b7 description answers **what changed, why, how to test** \u00b7 screenshots/GIF for UI \u00b7 link the ticket \u00b7 note risks and follow-ups \u00b7 self-review the diff before requesting review \u00b7 keep commits meaningful.\n\n## 66.4 Production-incident drill \ud83c\udfed\n```\nReport \u2192 check monitoring (error rate, release time) \u2192 reproduce with the SAME version\n  \u2192 Network/console \u2192 compare the API response with the contract \u2192 check feature flags/config\n  \u2192 decide: roll back or hotfix \u2192 verify \u2192 post-mortem (cause, fix, prevention test)\n```\n**Post-mortem template:** What happened \u00b7 Impact (who, how long) \u00b7 Timeline \u00b7 Root cause \u00b7 What went well \u00b7 What didn't \u00b7 Action items (owner, date) \u00b7 **no blame**.\n\n## 66.5 Estimating and communicating \ud83d\udfe1\nBreak a task into UI, state, API, tests, edge cases and review time; estimate in ranges; **say early when blocked** with what you tried; ask precise questions (\"`GET /chats` returns `buyer_name` but the contract says `buyerName`; which is right?\"); update the Jira ticket as you go.\n\n## 66.6 Questions\n**Q1. What do you check before opening a PR?** **Q2. How do you review a teammate's Vue component?** **Q3. A production bug appears after a release: what do you do?** **Q4. How do you handle a ticket you don't understand?**\n**Exercises:** apply the PR checklist to your Seller Chat project and fix everything that fails \u00b7 review a classmate's component using 66.2 and write three constructive comments \u00b7 write a mock post-mortem for \"messages stopped sending after deploy\".\n\n## \u25b6 COMPANY STEP 66\nCreate `PULL_REQUEST_TEMPLATE.md` from 66.1 and 66.3 in the Seller Chat repo, then raise a PR for one stage and self-review it using 66.2.\n\n\n# APPENDICES\n\n# APPENDIX A \u2014 ERROR MESSAGE DECODER (what the message means and what to check)\n\n| Message | Meaning | Check / fix |\n|---|---|---|\n| `Uncaught TypeError: Cannot read properties of undefined (reading 'x')` | you used `.x` on `undefined` | the thing **before** `.x` is not loaded yet or the field is missing; guard with `?.`, `v-if`, defaults; check API response shape |\n| `TypeError: x is not a function` | calling something that isn't a function | wrong import (default vs named), typo, `this` lost, var hoisted undefined |\n| `ReferenceError: x is not defined` | variable not declared in scope | typo, missing import, used before `let/const` (TDZ), wrong scope |\n| `SyntaxError: Unexpected token` | invalid code or `JSON.parse` of HTML/empty | missing bracket/comma; if from JSON.parse the server returned HTML (404/500 page) \u2014 inspect response |\n| `RangeError: Maximum call stack size exceeded` | infinite recursion / watcher loop | base case missing; watcher modifies its own source; computed depends on itself |\n| `Failed to fetch` / `NetworkError` | network failure, CORS block, mixed content, server down | Network tab (status \"(failed)\"), check URL/HTTPS, CORS headers, VPN |\n| `Access to fetch \u2026 blocked by CORS policy` | server didn't allow your origin | fix Spring CORS / use Vite proxy; check preflight `OPTIONS` |\n| `401 Unauthorized` | not authenticated / token expired | token present? header name/format? expiry; login again |\n| `403 Forbidden` | authenticated but not allowed | role/permission, CSRF token, CORS credentials |\n| `404 Not Found` | wrong URL/route | base URL, path, trailing slash, `/api` prefix, proxy config; SPA refresh fallback |\n| `400 Bad Request` | payload invalid | compare payload to DTO; read response `errors[]` |\n| `415 Unsupported Media Type` | wrong/missing `Content-Type` | `application/json` with stringified body |\n| `422/409` | validation/conflict | show server message |\n| `500` | server bug | backend logs by request id; send correct payload; not a frontend fix |\n| `[Vue warn]: Property \"x\" was accessed during render but is not defined` | template uses undefined variable | not returned/declared; typo; missing `ref` |\n| `[Vue warn]: Avoid mutating a prop directly` | child changed a prop | emit event or copy to local state |\n| `[Vue warn]: Duplicate keys / Missing required prop` | `v-for` keys not unique / prop not passed | use unique ids; pass the prop |\n| `[Vue warn]: Failed to resolve component` | component not registered/imported | import it; check name casing |\n| `[Vue warn]: Extraneous non-props attributes` | passing attrs a component doesn't declare | declare props/emits or use `inheritAttrs` |\n| `Hydration mismatch` | SSR HTML \u2260 client render | non-deterministic render (dates/random), browser-only code on server |\n| `Unhandled promise rejection` | async error not caught | add `try/catch`/`.catch` |\n| `Module not found: Can't resolve '@/\u2026'` | wrong path/alias | check `vite.config` alias, file name case (Linux CI is case-sensitive!) |\n| `npm ERR! ERESOLVE` | dependency version conflict | read which packages; align versions; `--legacy-peer-deps` only as last resort |\n| `EADDRINUSE :::5173` | port already used | stop other dev server or change port |\n| `Loading chunk failed` | stale cached build after deploy | reload; cache headers (Module 63.6) |\n| `ResizeObserver loop limit exceeded` | benign layout warning | usually ignore |\n\n# APPENDIX B \u2014 COMMON GOTCHAS BY LANGUAGE\n\n**HTML:** button defaults to submit \u00b7 missing `name` on inputs \u00b7 duplicate ids \u00b7 `<p>` can't contain `<div>` \u00b7 `disabled=\"false\"` still disabled.\n**CSS:** `height:100vh` on mobile (use `dvh`) \u00b7 flex child overflow needs `min-width:0` \u00b7 `z-index` needs positioning and stacking context awareness \u00b7 margin collapse \u00b7 `position:absolute` without positioned parent \u00b7 percentage heights need a parent height \u00b7 `overflow:hidden` breaks `position:sticky`.\n**JS:** `==` coercion \u00b7 `sort()` lexicographic \u00b7 `parseInt` radix with `map` \u00b7 float math \u00b7 mutating shared objects \u00b7 `for...in` on arrays \u00b7 `forEach(async)` not awaited \u00b7 `this` detached \u00b7 `var` in loops \u00b7 `JSON.stringify` drops undefined \u00b7 `typeof null`.\n**Async:** forgetting `await` \u00b7 sequential vs parallel \u00b7 unhandled rejections \u00b7 `fetch` doesn't reject on 404 \u00b7 race conditions in search \u00b7 stale closures.\n**Vue:** destructuring reactive/store \u00b7 missing `.value` \u00b7 replacing `reactive` object \u00b7 `v-for` key issues \u00b7 `v-if` + `v-for` \u00b7 mutating props \u00b7 `onMounted` not re-run on route param change \u00b7 forgetting cleanup \u00b7 calling hooks after `await` \u00b7 deep watch performance \u00b7 `watch` on non-reactive value \u00b7 using `computed` for side effects.\n**Pinia/Router:** `const { x } = store` \u00b7 circular store imports \u00b7 guard infinite redirect (redirect to a route that also redirects) \u00b7 history-mode refresh 404 \u00b7 reading `route.params` once instead of reactively.\n\n# APPENDIX C \u2014 GLOSSARY (plain-English definitions)\n\n| Term | Meaning |\n|---|---|\n| **API** | contract for programs to talk; REST API = URLs + HTTP methods returning JSON |\n| **Async** | doing something later without blocking the main thread |\n| **Bundler** | tool that combines/optimises files for browsers (Vite, webpack) |\n| **Callback** | function passed to be called later |\n| **Closure** | function that remembers variables from where it was created |\n| **Component** | reusable UI piece with its own markup, logic and styles |\n| **Composable** | Vue function (`useX`) that reuses reactive logic |\n| **Computed** | cached value derived from reactive state |\n| **CORS** | browser rule: cross-origin requests need server permission headers |\n| **CSR/SSR** | rendering in the browser / on the server |\n| **CSS selector** | pattern choosing which elements a rule applies to |\n| **DOM** | in-memory tree of the page the browser builds from HTML |\n| **Debounce/Throttle** | limit how often a function runs (after quiet / at intervals) |\n| **DTO** | Data Transfer Object: shape of JSON sent between layers/services |\n| **Event loop** | mechanism running callbacks when the call stack is empty |\n| **Event bubbling** | events travel from the target up through ancestors |\n| **Hoisting** | declarations registered before code runs |\n| **HMR** | hot module replacement: browser updates without full reload |\n| **Idempotent** | repeating the request has the same effect as doing it once (GET, PUT, DELETE) |\n| **Immutable** | not changed in place; create a new copy instead |\n| **JWT** | signed token proving identity, sent in `Authorization` header |\n| **Lazy loading** | load code/images only when needed |\n| **Lifecycle hook** | function Vue calls at a stage (mounted, unmounted) |\n| **Memoization** | caching a function's results by arguments |\n| **Middleware/Interceptor** | code that runs on every request/response |\n| **Mutation** | changing data in place (also Vuex state-change function) |\n| **Optimistic update** | show success immediately, roll back if the server fails |\n| **Pagination** | fetching data in pages (offset or cursor) |\n| **Payload** | the data in a request/response body |\n| **Polyfill** | code that adds a missing browser feature |\n| **Preflight** | automatic `OPTIONS` request browsers send before some cross-origin requests |\n| **Promise** | object representing a future value or failure |\n| **Props / Emits / Slots** | parent\u2192child data / child\u2192parent events / injected markup |\n| **Proxy** | JS object that intercepts operations; Vue 3's reactivity base; also dev-server forwarding |\n| **Reactive** | automatically updates dependants when data changes |\n| **Reflow / Repaint** | recalculating layout / redrawing pixels |\n| **REST** | style of HTTP APIs using resources and standard methods |\n| **Router / Route guard** | maps URL to view / code that allows or blocks navigation |\n| **SFC** | Single File Component (`.vue`) |\n| **Source map** | file mapping minified code back to original source |\n| **SPA** | single-page application |\n| **State** | data that changes over time and drives the UI |\n| **Store (Pinia)** | shared global reactive state |\n| **Tree shaking** | removing unused code at build time |\n| **Virtual DOM** | lightweight JS copy of the UI used to compute minimal DOM updates |\n| **WebSocket / SSE** | persistent two-way / one-way server push connections |\n| **XSS / CSRF** | script injection / forged cross-site requests |\n\n# APPENDIX D \u2014 DEBUGGING PLAYBOOKS (step by step)\n\n**D1 \"Button click does nothing.\"** (1) Console errors? (2) Is the handler attached (`@click` correct name, not `@click=\"fn()\"` mis-called)? (3) Add `console.log` / breakpoint at handler start. (4) Element covered by another element (inspect, z-index/overlay) or `disabled`/`pointer-events:none`? (5) Is the click event reaching the element (Event Listeners panel)?\n**D2 \"Data not showing.\"** Network request sent? \u2192 status/response \u2192 stored? (Vue DevTools) \u2192 template reading correct variable? \u2192 `v-if`/`v-for` conditions \u2192 key/shape mismatch (`data.content` vs `data`).\n**D3 \"UI doesn't update.\"** Is the value reactive (ref/reactive)? destructuring? replaced reactive? mutated non-reactive? updated a copy? reading before `nextTick`? component re-used by router without watching params?\n**D4 \"Request fails.\"** Network: URL right? method? headers (Content-Type, Authorization)? payload matches DTO? status? response body message? CORS/preflight? Does it work in Postman? \u2192 if yes, browser/CORS/auth-header issue; if no, backend issue.\n**D5 \"Layout broken.\"** Inspect \u2192 Computed \u2192 box model; toggle declarations; check `display` of parent, `box-sizing`, `min-width:0`, overflow, position context, media query active, specificity overridden (struck-through).\n**D6 \"Page slow.\"** Throttled Lighthouse \u2192 Network waterfall (big assets?) \u2192 Performance flame chart (long tasks, layout thrash) \u2192 Vue DevTools timeline (re-render storms) \u2192 fix largest cause first.\n**D7 \"Works locally, fails in prod.\"** env vars/URLs \u00b7 build vs dev differences (`npm run build && npm run preview`) \u00b7 caching/stale chunks \u00b7 CORS/CSP/HTTPS \u00b7 case-sensitive file names \u00b7 minification bugs (source maps) \u00b7 backend config differences.\n**D8 \"Memory grows.\"** Memory tab: take snapshot, repeat the action 10\u00d7, snapshot, compare: detached DOM nodes/listeners/timers/sockets not cleaned.\n\n# APPENDIX E \u2014 LEARNING RESOURCES (use alongside this guide)\nMDN Web Docs (https://developer.mozilla.org/) \u2014 HTML/CSS/JS reference \u00b7 javascript.info \u2014 deep JS tutorial \u00b7 Vue docs (https://vuejs.org/guide/introduction.html) + Vue Router/Pinia docs \u00b7 web.dev (performance, a11y) \u00b7 CSS-Tricks \"Complete Guide to Flexbox/Grid\" \u00b7 Chrome DevTools docs (developer.chrome.com/docs/devtools) \u00b7 JSONPlaceholder (https://jsonplaceholder.typicode.com/guide/) for practice APIs \u00b7 Frontend Mentor / your own company tickets for practice projects.\n\n# APPENDIX F \u2014 GUIDE COMPLETION MAP (every module and where it is)\n| Part | Modules |\n|---|---|\n| Start Here | 0 |\n| 1 HTML | 1\u20135 |\n| 2 CSS | 6\u201311 |\n| 3 JavaScript | 12\u201325 |\n| 4 DOM / Web APIs | 26\u201328 |\n| 5 REST integration | 29\u201330 |\n| 6 Vue | 31\u201343 |\n| 7 Professional engineering | 44\u201347 |\n| 8 Seller Chat build | 48 |\n| 9 Interview bank (265 Qs) + coaching, model answers, live coding, system design | 49 |\n| 10 Assignments (HTML 15, CSS 20, JS 30, Vue 30, integrated 15, company-stack 12) | 50\u201354, 67 |\n| 11 Projects | 55 |\n| 12 Cheat sheets (28 sheets) + job-readiness checklist | 56\u201357 |\n| 13 Company-stack gaps | 58\u201366 |\n| Appendices | A\u2013F |\n| Solutions workbooks 1\u20134 (HTML/CSS, JS, Vue, integrated + company stack) | end of the page |\n\n\n# SOLUTIONS WORKBOOK 1 \u2014 HTML AND CSS (full code, with explanations)\n\n> **Attempt the assignment first.** Each solution is *one valid answer*. After each: **What to notice** (the lesson) and often **Common wrong answer**. If yours passes every acceptance check, it's right even if it looks different.\n> **Untested note:** the code was written carefully but not executed here; run it, and tell me if something doesn't behave as described.\n\n---\n\n# HTML SOLUTIONS\n\n### H1: Personal profile page\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Asha Menon: Full-stack intern<\/title>\n<\/head>\n<body>\n  <a class=\"skip\" href=\"#main\">Skip to content<\/a>\n  <header>\n    <h1>Asha Menon<\/h1>\n    <nav aria-label=\"Main\">\n      <ul><li><a href=\"#about\">About<\/a><\/li><li><a href=\"#skills\">Skills<\/a><\/li><li><a href=\"#contact\">Contact<\/a><\/li><\/ul>\n    <\/nav>\n  <\/header>\n  <main id=\"main\">\n    <section id=\"about\" aria-labelledby=\"about-h\">\n      <h2 id=\"about-h\">About<\/h2>\n      <img src=\"asha.jpg\" alt=\"Asha smiling at her desk\" width=\"160\" height=\"160\">\n      <p>Full-stack intern learning Spring Boot and Vue 3.<\/p>\n    <\/section>\n    <section id=\"skills\" aria-labelledby=\"skills-h\">\n      <h2 id=\"skills-h\">Skills<\/h2>\n      <ul><li>Java / Spring Boot<\/li><li>PostgreSQL, MongoDB<\/li><li>HTML, CSS, JavaScript, Vue<\/li><\/ul>\n    <\/section>\n    <section id=\"contact\" aria-labelledby=\"contact-h\">\n      <h2 id=\"contact-h\">Contact<\/h2>\n      <p><a href=\"mailto:asha@example.com\">asha@example.com<\/a><\/p>\n      <p><a href=\"https://github.com/asha\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><\/p>\n    <\/section>\n  <\/main>\n  <footer><p><small>\u00a9 2026 Asha Menon<\/small><\/p><\/footer>\n<\/body>\n<\/html>\n```\n**What to notice:** one `h1`, sections labelled by their headings (`aria-labelledby`), `width/height` on the image prevents layout shift, `rel=\"noopener noreferrer\"` protects against `window.opener` abuse. **Common wrong answer:** `<div id=\"about\">` everywhere, `alt=\"photo\"`.\n\n### H2: Semantic article\n```html\n<article>\n  <header>\n    <h1>Seller chats go real-time<\/h1>\n    <p>By <address style=\"display:inline\">Ravi Kumar<\/address> \u00b7 <time datetime=\"2026-10-30\">30 Oct 2026<\/time><\/p>\n  <\/header>\n  <p>Lead paragraph\u2026<\/p>\n  <figure>\n    <img src=\"chart.png\" alt=\"Bar chart: replies within 5 minutes up 40%\" width=\"600\" height=\"300\">\n    <figcaption>Reply speed before and after the change.<\/figcaption>\n  <\/figure>\n  <blockquote cite=\"https://example.com/interview\"><p>\u201cSellers answer faster now.\u201d<\/p><\/blockquote>\n  <aside aria-label=\"Related articles\"><h2>Related<\/h2><ul><li><a href=\"/a\">Optimistic UI explained<\/a><\/li><\/ul><\/aside>\n  <footer><p>Filed under <a href=\"/tag/product\">Product<\/a><\/p><\/footer>\n<\/article>\n```\n**What to notice:** `<time datetime>` gives machines a stable date; `<figure>` ties image to caption; `<aside>` inside `<article>` means \"related to this article\". **Wrong:** `<div class=\"quote\">` for the quote.\n\n### H3: Orders table\n```html\n<table>\n  <caption>Orders: 28\u201330 Oct 2026<\/caption>\n  <thead><tr><th scope=\"col\">ID<\/th><th scope=\"col\">Buyer<\/th><th scope=\"col\">Status<\/th><th scope=\"col\">Total (\u20b9)<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><th scope=\"row\">A1001<\/th><td>Ravi<\/td><td>PAID<\/td><td>1,299<\/td><\/tr>\n    <tr><th scope=\"row\">A1002<\/th><td>Asha<\/td><td>PENDING<\/td><td>399<\/td><\/tr>\n    <tr><th scope=\"row\">A1003<\/th><td>Ravi<\/td><td>PAID<\/td><td>598<\/td><\/tr>\n    <tr><th scope=\"row\">A1004<\/th><td>Meera<\/td><td>CANCELLED<\/td><td>2,999<\/td><\/tr>\n    <tr><th scope=\"row\">A1005<\/th><td>Asha<\/td><td>PAID<\/td><td>499<\/td><\/tr>\n  <\/tbody>\n  <tfoot><tr><th scope=\"row\" colspan=\"3\">Total<\/th><td>5,794<\/td><\/tr><\/tfoot>\n<\/table>\n```\n**What to notice:** `scope` lets a screen reader say \"Total 5,794\" with the right headers; `colspan=\"3\"` makes the label span ID/Buyer/Status. 1299+399+598+2999+499 = **5,794**. (The \"revenue\" of *paid* orders only is 2,396: don't confuse them.)\n\n### H4: Navigation with skip link\n```html\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n<nav aria-label=\"Main\">\n  <ul>\n    <li><a href=\"/\" aria-current=\"page\">Home<\/a><\/li>\n    <li><a href=\"/chats\">Chats<\/a>\n      <ul><li><a href=\"/chats/open\">Open<\/a><\/li><li><a href=\"/chats/closed\">Closed<\/a><\/li><\/ul><\/li>\n    <li><a href=\"/orders\">Orders<\/a><\/li>\n  <\/ul>\n<\/nav>\n<main id=\"main\" tabindex=\"-1\">\u2026<\/main>\n<style>\n  .skip{position:absolute;left:-999px}\n  .skip:focus{left:8px;top:8px;background:#fff;padding:.5rem;z-index:10}\n<\/style>\n```\n**What to notice:** the skip link is the **first focusable element**; `tabindex=\"-1\"` on `main` lets it receive focus after the jump. `aria-current=\"page\"` tells assistive tech where you are.\n\n### H5: Login form\n```html\n<form action=\"/login\" method=\"post\">\n  <label for=\"e\">Email<\/label>\n  <input id=\"e\" name=\"email\" type=\"email\" autocomplete=\"username\" required>\n  <label for=\"p\">Password<\/label>\n  <input id=\"p\" name=\"password\" type=\"password\" autocomplete=\"current-password\" required minlength=\"8\">\n  <label><input type=\"checkbox\" name=\"remember\"> Remember me<\/label>\n  <button type=\"submit\">Log in<\/button>\n<\/form>\n```\n**What to notice:** `for`=`id` links label and input (click label \u2192 focus); `name` is what gets submitted; `autocomplete` values enable password managers. **Wrong:** `placeholder=\"Email\"` as the only label (disappears when typing, poor a11y).\n**Extra (show/hide):** `<button type=\"button\" aria-pressed=\"false\" aria-label=\"Show password\">` toggling `p.type` between `password`/`text` and updating `aria-pressed`.\n\n### H6: Registration form\n```html\n<form action=\"/register\" method=\"get\">\n  <fieldset><legend>Account<\/legend>\n    <label for=\"n\">Name<\/label><input id=\"n\" name=\"name\" required>\n    <label for=\"em\">Email<\/label><input id=\"em\" name=\"email\" type=\"email\" required>\n    <label for=\"pw\">Password<\/label><input id=\"pw\" name=\"password\" type=\"password\" minlength=\"8\" required>\n    <label for=\"dob\">Date of birth<\/label><input id=\"dob\" name=\"dob\" type=\"date\">\n  <\/fieldset>\n  <fieldset><legend>Plan<\/legend>\n    <label><input type=\"radio\" name=\"plan\" value=\"free\" checked> Free<\/label>\n    <label><input type=\"radio\" name=\"plan\" value=\"pro\"> Pro<\/label>\n  <\/fieldset>\n  <fieldset><legend>Interests<\/legend>\n    <label><input type=\"checkbox\" name=\"interest\" value=\"shoes\"> Shoes<\/label>\n    <label><input type=\"checkbox\" name=\"interest\" value=\"bags\"> Bags<\/label>\n  <\/fieldset>\n  <label for=\"c\">City<\/label>\n  <select id=\"c\" name=\"city\"><optgroup label=\"West\"><option value=\"pune\">Pune<\/option><option value=\"mumbai\">Mumbai<\/option><\/optgroup><optgroup label=\"South\"><option value=\"kochi\">Kochi<\/option><\/optgroup><\/select>\n  <label for=\"bio\">About you<\/label><textarea id=\"bio\" name=\"bio\" rows=\"3\"><\/textarea>\n  <label><input type=\"checkbox\" name=\"terms\" required> I accept the terms<\/label>\n  <button>Register<\/button>\n<\/form>\n```\n**What to notice:** submit with only \"Shoes\" ticked \u2192 URL has `interest=shoes`; with none \u2192 **no `interest` key at all**: an unchecked checkbox sends nothing (the browser only submits checked controls). Radios share `name=\"plan\"` so only one is selectable. With POST, the same data goes in the request **body** (Network \u2192 Payload).\n\n### H7: Constraint validation\n```html\n<form>\n  <input name=\"user\"  required minlength=\"3\" maxlength=\"12\" title=\"3\u201312 characters\">\n  <input name=\"pin\"   required pattern=\"\\d{6}\" title=\"Exactly 6 digits\">\n  <input name=\"age\"   type=\"number\" min=\"18\" max=\"99\" required>\n  <input name=\"mail\"  type=\"email\" required>\n<\/form>\n<style>input:user-invalid{border-color:#c0392b}<\/style>\n<script>\n  const f = document.forms[0]\n  console.log(f.checkValidity(), f.pin.validity.patternMismatch)   // false, true when the PIN is wrong\n<\/script>\n```\n**What to notice:** the browser blocks submit and shows a message per failing rule; `validity` exposes *why*. These checks are **UX only**: anyone can bypass them, so Spring must still validate (`@Pattern`, `@Min`\u2026).\n\n### H8: File upload\n```html\n<form action=\"/upload\" method=\"post\" enctype=\"multipart/form-data\">\n  <label for=\"f\">Photos<\/label>\n  <input id=\"f\" name=\"photos\" type=\"file\" accept=\"image/*\" multiple>\n  <button>Upload<\/button>\n<\/form>\n```\n**What to notice:** without `enctype=\"multipart/form-data\"` the browser sends only the **file names** as text, not the bytes. With it, the body is split by a `boundary` string (visible in the Network tab). Spring: `@RequestParam(\"photos\") MultipartFile[] files`.\n**Extra:** `input.onchange = () => img.src = URL.createObjectURL(input.files[0])` (call `URL.revokeObjectURL` later).\n\n### H9: Media page\n```html\n<video controls poster=\"p.jpg\" width=\"640\" height=\"360\">\n  <source src=\"v.webm\" type=\"video/webm\"><source src=\"v.mp4\" type=\"video/mp4\">\n  <track kind=\"captions\" src=\"en.vtt\" srclang=\"en\" label=\"English\" default>\n  Your browser can't play this video. <a href=\"v.mp4\">Download it<\/a>.\n<\/video>\n<audio controls src=\"a.mp3\">Your browser can't play audio.<\/audio>\n```\n**What to notice:** the browser picks the first `<source>` it supports; text between the tags is fallback; captions are a legal accessibility requirement in many places.\n\n### H10: Responsive images\n```html\n<img src=\"p-800.jpg\" srcset=\"p-400.jpg 400w, p-800.jpg 800w, p-1600.jpg 1600w\"\n     sizes=\"(max-width:600px) 100vw, 50vw\" width=\"800\" height=\"600\" alt=\"Red sneakers\" loading=\"lazy\">\n\n<picture>\n  <source type=\"image/webp\" srcset=\"p-400.webp 400w, p-800.webp 800w\" sizes=\"(max-width:600px) 100vw, 50vw\">\n  <img src=\"p-800.jpg\" alt=\"Red sneakers\" width=\"800\" height=\"600\" loading=\"lazy\">\n<\/picture>\n```\n**What to notice:** `srcset` lists candidates + their widths; `sizes` says how wide the image will *display*, so the browser can choose the smallest sufficient file. `width`/`height` reserve space \u2192 CLS 0. Don't lazy-load the hero image (it hurts LCP).\n\n### H11: Native dialog\n```html\n<button id=\"open\">Open<\/button>\n<dialog id=\"d\" aria-labelledby=\"t\">\n  <h2 id=\"t\">Delete chat?<\/h2>\n  <form method=\"dialog\"><button value=\"cancel\">Cancel<\/button><button value=\"ok\">OK<\/button><\/form>\n<\/dialog>\n<script>\n  const d = document.getElementById('d'), open = document.getElementById('open')\n  open.onclick = () => d.showModal()\n  d.addEventListener('close', () => { console.log(d.returnValue); open.focus() })\n<\/script>\n```\n**What to notice:** `showModal()` gives backdrop, inert background, Esc handling and focus trapping for free; `form method=\"dialog\"` closes it and sets `returnValue`. The browser usually returns focus to the trigger; the explicit `open.focus()` guarantees it.\n\n### H12: Accordion\n```html\n<details name=\"faq\" open><summary>What is Seller Chat?<\/summary><p>A messaging tool for sellers.<\/p><\/details>\n<details name=\"faq\"><summary>How do I attach an order?<\/summary><p>Use the \ud83d\udcce button.<\/p><\/details>\n<details name=\"faq\"><summary>Is it free?<\/summary><p>Yes.<\/p><\/details>\n<details name=\"faq\"><summary>Can I export chats?<\/summary><p>Soon.<\/p><\/details>\n```\n**What to notice:** same `name` = exclusive group (newer browsers; others just ignore it and behave as independent). Keyboard and screen-reader support are built in.\n\n### H13: Div-soup refactor (answer)\n```html\n<html lang=\"en\">\n<header>\n  <a href=\"/\" aria-label=\"ShopX home\">ShopX<\/a>\n  <nav aria-label=\"Main\"><ul><li><a href=\"/\">Home<\/a><\/li><li><a href=\"/cart\">Cart<\/a><\/li><\/ul><\/nav>\n<\/header>\n<main>\n  <h1>Today's deals<\/h1>\n  <p>Hand picked for you<\/p>\n  <article>\n    <img src=\"shoe.jpg\" alt=\"Red sneakers\" width=\"300\" height=\"200\">\n    <h2>Red Sneakers<\/h2>\n    <p><data value=\"1299\">\u20b91,299<\/data><\/p>\n    <button type=\"button\" id=\"buy\">Buy<\/button>\n  <\/article>\n  <form>\n    <label for=\"n\">Name<\/label><input id=\"n\" name=\"name\">\n    <label for=\"e\">Email<\/label><input id=\"e\" name=\"email\" type=\"email\">\n  <\/form>\n<\/main>\n<footer><small>\u00a9 ShopX<\/small><\/footer>\n<\/html>\n```\n**Ten changes:** (1) `lang` on `<html>`; (2) `div.top` \u2192 `<header>`; (3) menu `div`s \u2192 `<nav><ul><li><a>`; (4) clickable `div` \u2192 real links; (5) `div.big` \u2192 `<h1>`; (6) `div.small` \u2192 `<p>`; (7) image gets `alt` + dimensions; (8) item \u2192 `<article>` with `<h2>`; (9) `div.btn` \u2192 `<button type=\"button\">` (focusable, Enter/Space); (10) inputs get `<label for>`; (11) content wrapped in `<main>`; (12) `div.bottom` \u2192 `<footer>`. Inline `onclick` replaced by listeners.\n\n### H14: Metadata\n```html\n<!doctype html><html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Seller Chat: reply to buyers faster<\/title>\n<meta name=\"description\" content=\"Manage buyer conversations and orders in one place.\">\n<link rel=\"canonical\" href=\"https://app.example.com/\">\n<meta property=\"og:title\" content=\"Seller Chat\"><meta property=\"og:description\" content=\"Reply to buyers faster.\">\n<meta property=\"og:image\" content=\"https://app.example.com/og.png\"><meta property=\"og:type\" content=\"website\">\n<link rel=\"icon\" href=\"/favicon.svg\" type=\"image/svg+xml\">\n<\/head>\n```\n**Purpose of each:** `lang` (screen reader pronunciation, translation), `viewport` (mobile layout), `title` (tab, search result headline), `description` (search snippet), `canonical` (avoid duplicate-content split), `og:*` (link previews), `icon` (tab icon).\n\n### H15: Script loading (expected results)\n| Page | Script placement | `document.readyState` | `#target` found? |\n|---|---|---|---|\n| a | `<script src>` in head | `loading` | **null**: DOM not parsed yet |\n| b | `async` | `loading` or `interactive` (depends on download timing) | **varies** |\n| c | `defer` (or `type=module`) | `interactive` | **found**: runs after parsing, in document order |\n**Why:** plain scripts **block parsing** while they download and run; `async` runs as soon as downloaded (order not guaranteed between scripts); `defer` downloads in parallel and runs after parsing, in order. Default choice: `defer` or modules.\n\n---\n\n# CSS SOLUTIONS\n\n### C1: Selector drill\n```css\n.menu > li                       { list-style:none }                  /* direct children only */\na[target=\"_blank\"]::after        { content:\" \u2197\" }                      /* external links */\na[href$=\".pdf\"]::before          { content:\"\ud83d\udcc4 \" }                      /* file type by suffix */\nli.disabled a                    { pointer-events:none; opacity:.5 }\nli:has(> a.active)               { font-weight:700 }                   /* parent selector */\ntr:nth-child(even)               { background:#f3f5f8 }\nh2 + p                           { font-size:1.1rem }                  /* adjacent sibling */\np ~ p                            { margin-top:.5rem }                  /* all later siblings */\np:first-of-type                  { margin-top:0 }\np[lang=\"hi\"]                     { font-family:\"Noto Sans Devanagari\",sans-serif }\nbutton:not(:disabled)            { cursor:pointer }\nbutton:focus-visible             { outline:2px solid #0b6e75; outline-offset:2px }\ntd:last-child                    { text-align:right }\narticle > *:last-child           { margin-bottom:0 }\na:is(.active,:hover)             { text-decoration:underline }\n```\n**What to notice:** attribute selectors (`^=`, `$=`, `*=`), `:has()` for parent-based styling, `:is()` to shorten lists. None needed an extra class.\n\n### C2: Specificity (answer pattern)\n```html\n<p id=\"a\" class=\"b c\" style=\"\">text<\/p>\n```\n| Rule | Specificity | Wins? |\n|---|---|---|\n| `p {color:red}` | 0-0-1 | loses to class |\n| `.b {color:blue}` | 0-1-0 | beats type |\n| `.b.c {color:green}` | 0-2-0 | beats `.b` |\n| `p.b {color:teal}` | 0-1-1 | beats `.b`, loses to `.b.c` |\n| `#a {color:orange}` | 1-0-0 | beats all classes |\n| `p:not(#x) {color:pink}` | 1-0-1 (`:not` takes its argument's weight) | beats `.b.c`, loses to `#a`? No: `#a` is 1-0-0 < 1-0-1 \u2192 **pink wins over orange** |\n| `[id=\"a\"] {color:gold}` | 0-1-0 | attribute = class weight |\n| inline `style=\"color:black\"` | 1-0-0-0 | beats selectors |\n| `p {color:purple !important}` | `!important` | beats inline (non-important) |\n| same weight, later in file | order | **later wins** |\n**What to notice:** compare (a-b-c) left to right; `:where()` adds zero; **inheritance is the weakest**: any direct rule beats an inherited value.\n\n### C3: Box model\n```css\n.card{width:300px;padding:20px;border:5px solid;margin:20px}\n```\n| Mode | Rendered width | Why |\n|---|---|---|\n| `content-box` (default) | **350px** | 300 + 2\u00d720 padding + 2\u00d75 border |\n| `border-box` | **300px** | padding and border are *inside* the width |\nGlobal reset: `*,*::before,*::after{box-sizing:border-box}`.\n**Margin collapsing:** two stacked paragraphs with `margin:20px` are **20px apart, not 40px** (the larger vertical margin wins). Flex/grid items don't collapse.\n\n### C4: Typography system\n```css\n:root{\n  --font-body: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-head: Georgia, \"Times New Roman\", serif;\n  --step--1:.875rem; --step-0:1rem; --step-1:1.25rem; --step-2:1.563rem; --step-3:1.953rem;\n}\nhtml{font-size:100%}\nbody{font:var(--step-0)/1.5 var(--font-body)}\nh1,h2,h3{font-family:var(--font-head);line-height:1.2;text-wrap:balance}\nh1{font-size:clamp(1.75rem, 4vw, 3rem)}\np{max-width:65ch}\n```\n**What to notice:** `rem` respects the user's browser font-size setting; unitless `line-height` scales with each element's font-size; `65ch` is a readable line length.\n\n### C5: Colour tokens and themes\n```css\n:root{--bg:#fff;--fg:#17212b;--brand:#0b6e75;--surface:#f3f5f8}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f161d;--fg:#e4ebf1;--brand:#4cc3c9;--surface:#18222c;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0f161d;--fg:#e4ebf1;--brand:#4cc3c9;--surface:#18222c;color-scheme:dark}\nbody{background:var(--bg);color:var(--fg)}\n```\n```html\n<script>   /* in <head>, before CSS paints: avoids a flash of the wrong theme */\n  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t } catch {}\n<\/script>\n<button id=\"tg\">Toggle theme<\/button>\n<script>\n  tg.onclick = () => {\n    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)\n    const next = dark ? 'light' : 'dark'\n    document.documentElement.dataset.theme = next\n    try { localStorage.setItem('theme', next) } catch {}\n  }\n<\/script>\n```\n**What to notice:** every token is defined on bare `:root` first (so it exists in light mode); the media query respects the OS; the `data-theme` rule wins when the user chooses; the tiny head script prevents the flash.\n\n### C6: Centering six ways\n```css\n.box{width:200px;height:100px;background:#0b6e75}\n.a{display:flex;justify-content:center;align-items:center}                              /* flex: most common */\n.b{display:grid;place-items:center}                                                      /* grid: shortest */\n.c{margin:0 auto}                                                                        /* horizontal only, needs a width */\n.d{position:relative}.d .box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}   /* overlays */\n.e{position:relative}.e .box{position:absolute;inset:0;margin:auto}                      /* needs explicit width/height */\n.f{display:grid;place-content:center}                                                    /* centres the whole grid track */\n```\n**When:** flex/grid for layout; absolute + transform for overlays; `margin:auto` for centred page containers.\n\n### C7: Positioning\n```css\n.avatar{position:relative;width:48px;height:48px}\n.badge{position:absolute;top:-4px;right:-4px;min-width:18px;border-radius:999px;background:#c0392b;color:#fff;font-size:12px;text-align:center}\n.top{position:sticky;top:0;background:var(--bg)}\n.toast{position:fixed;right:16px;bottom:16px}\n```\n**What to notice:** an absolute child positions against its **nearest positioned ancestor**, which is why `.avatar` needs `position:relative`. `sticky` fails if an ancestor has `overflow:hidden/auto`.\n\n### C8: Stacking-context lab\n```html\n<header style=\"position:relative;z-index:10\">Header<\/header>\n<div class=\"wrap\" style=\"transform:translateZ(0)\">      <!-- creates a NEW stacking context -->\n  <div class=\"modal\" style=\"position:fixed;inset:0;z-index:9999\">Modal<\/div>\n<\/div>\n```\n**Why it breaks:** `.wrap`'s `transform` creates a stacking context (and also becomes the containing block for the fixed child!). Inside it, `z-index:9999` only competes with siblings; the whole context sits at z-index `auto` (0) in the root, below the header's 10.\n**Fix A:** render the modal as a child of `<body>` (Vue `<Teleport to=\"body\">`). **Fix B:** remove the transform from the ancestor.\n**Creators of stacking contexts:** `transform`, `opacity < 1`, `filter`, `position` + `z-index`, `isolation:isolate`, `will-change`, `contain`.\n\n### C9: Navbar\n```css\n.nav{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.75rem 1rem}\n.nav .logo{font-weight:700}\n.nav .links{display:flex;gap:1rem;list-style:none;margin:0 auto;padding:0}   /* auto margins centre the links */\n.nav .actions{margin-left:auto}\n```\n**What to notice:** `margin-left:auto` on a flex item pushes it (and everything after) to the right: the simplest alignment trick; `flex-wrap` handles small screens.\n\n### C10: Chat layout\n```css\nhtml,body,#app{height:100%;margin:0}\n.chat{display:flex;height:100dvh}\n.sidebar{width:300px;flex:none;border-right:1px solid var(--line);overflow-y:auto}\n.room{flex:1;min-width:0;display:flex;flex-direction:column}\n.room__header{flex:none}\n.messages{flex:1;min-height:0;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}\n.composer{flex:none;display:flex;gap:.5rem;padding:.5rem;border-top:1px solid var(--line)}\n@media (max-width:767px){.sidebar{display:none}}   /* mobile: router shows one pane at a time */\n```\n**Why `min-height:0`:** flex items default to `min-height:auto`, meaning they refuse to shrink below their content, so a long list would grow the room and the **page** would scroll. `min-height:0` lets `.messages` shrink and scroll internally. `min-width:0` on `.room` stops long text from pushing the layout wider.\n\n### C11: Message bubbles\n```css\n.msg{max-width:min(75%,520px);padding:.5rem .75rem;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}\n.msg--mine{align-self:flex-end;background:var(--mine)}\n.msg--theirs{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}\n.msg time{display:block;font-size:.75rem;opacity:.7;text-align:right}\n.msg--mine + .msg--mine{margin-top:-.25rem}          /* group consecutive messages */\n```\n**What to notice:** `align-self` positions each bubble inside the column flex container; `overflow-wrap:anywhere` breaks an unbroken 200-char string; `pre-wrap` keeps the user's newlines. Tail (extra): `.msg--mine::after{content:\"\";position:absolute;\u2026}` with the bubble `position:relative`.\n\n### C12: Product grid\n```css\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}\n.card{display:flex;flex-direction:column}\n.card img{aspect-ratio:4/3;width:100%;object-fit:cover}\n.card .btn{margin-top:auto}               /* pushes the button to the bottom: equal-height look */\n```\n**What to notice:** `auto-fill` + `minmax` adds/removes columns as space allows: no media queries.\n\n### C13: Holy-grail layout\n```css\n.page{display:grid;min-height:100dvh;grid-template-rows:auto 1fr auto;grid-template-areas:\"h\" \"m\" \"s\" \"f\"}\nheader{grid-area:h} main{grid-area:m} aside{grid-area:s} footer{grid-area:f}\n@media (min-width:768px){.page{grid-template-columns:240px 1fr;grid-template-areas:\"h h\" \"s m\" \"f f\"}}\n```\n**What to notice:** the template reads like a picture; `1fr` row keeps the footer at the bottom on short pages.\n\n### C14: Dashboard grid\n```css\n.dash{display:grid;gap:1rem;grid-template-columns:1fr}\n@media (min-width:600px){.dash{grid-template-columns:repeat(2,1fr)}}\n@media (min-width:1024px){.dash{grid-template-columns:repeat(4,1fr)}}\n.chart{grid-column:1 / -1}                                   /* full width on small */\n@media (min-width:1024px){.chart{grid-column:span 2}}\n.table-wrap{grid-column:1 / -1;overflow-x:auto}\n```\n\n### C15: Mobile-first page\n```css\n.container{width:min(100% - 2rem, 1100px);margin-inline:auto}\nh1{font-size:clamp(1.75rem,4vw+1rem,3rem)}\n.cols{display:grid;gap:1rem}\n@media (min-width:768px){.cols{grid-template-columns:repeat(2,1fr)}}\n@media (min-width:1024px){.cols{grid-template-columns:repeat(3,1fr)}}\nimg{max-width:100%;height:auto}\n.btn{min-height:44px;min-width:44px}\n```\n**What to notice:** base = mobile; only `min-width` queries *add* complexity as space grows.\n\n### C16: Container query card\n```css\n.slot{container-type:inline-size}\n.card{display:grid;gap:.5rem}\n@container (min-width:400px){.card{grid-template-columns:96px 1fr;align-items:center}}\n```\n```html\n<aside class=\"slot\" style=\"width:260px\"><div class=\"card\">\u2026<\/div><\/aside>\n<main class=\"slot\" style=\"width:600px\"><div class=\"card\">\u2026<\/div><\/main>\n```\n**What to notice:** same component, two layouts at the **same viewport**, because the query asks about the *container*, not the screen.\n\n### C17: Transitions and states\n```css\n.btn{background:var(--brand);color:#fff;border:0;padding:.6rem 1rem;border-radius:10px;transition:background-color .2s,transform .1s}\n.btn:hover{background:var(--brand-dark)}\n.btn:active{transform:scale(.97)}\n.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}\n.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n```\n**What to notice:** `:focus-visible` shows a ring for keyboard users only; never remove the outline without a replacement.\n\n### C18: Skeleton loader\n```css\n.sk{height:56px;border-radius:10px;background:linear-gradient(90deg,#e6e9ee 25%,#f3f5f8 37%,#e6e9ee 63%);background-size:400% 100%;animation:sh 1.4s ease infinite}\n@keyframes sh{to{background-position:-400% 0}}\n@media (prefers-reduced-motion:reduce){.sk{animation:none}}\n```\n**What to notice:** give the skeleton the **same height** as the real row so nothing jumps when data arrives.\n\n### C19: BEM refactor\n```css\n.chat-item__name{color:var(--c-text);font-weight:700}\n.chat-item--active .chat-item__name{color:var(--c-on-brand)}\n```\n```html\n<li class=\"chat-item chat-item--active\"><a class=\"chat-item__link\"><span class=\"chat-item__name\">Ravi<\/span><\/a><\/li>\n```\n**Why the original needed `!important`:** the second rule had an ID (1-x-x), so the first lost the cascade and the author used `!important` as a weapon. With flat BEM (0-1-0 / 0-2-0) specificity stays low and predictable.\n\n### C20: Reflow lab\n```css\n.a{position:absolute;left:0;animation:moveLeft 1s infinite alternate}\n.b{position:absolute;left:0;animation:moveTransform 1s infinite alternate}\n@keyframes moveLeft{to{left:300px}}\n@keyframes moveTransform{to{transform:translateX(300px)}}\n```\n**Expected findings (Performance panel, CPU 4\u00d7 slowdown):** `.a` shows **Layout + Paint** every frame (changing `left` forces the browser to recompute geometry); `.b` shows mostly **Composite** (the GPU just moves a layer). **Cheap to animate:** `transform`, `opacity` (and `filter` carefully). **Expensive:** `top/left/width/height/margin`.\n\n---\n**Next \u2192 Workbook 2: JavaScript solutions.**\n\n\n# SOLUTIONS WORKBOOK 2: JAVASCRIPT (full code, with explanations)\n\n> Attempt first. Data comes from `data.js` in Module 50's intro (`messages`, `orders`, `users`). Run each snippet in Node or the Console. Expected outputs are written next to the code so you can check yourself. *Code is written carefully but not executed here.*\n\n---\n\n### J1: Types and equality\n```js\nconst values = [42, '42', null, undefined, [], {}, () => {}, NaN, 10n, Symbol('s'), new Date(), /x/]\nconsole.table(values.map(v => ({ value: String(typeof v === 'symbol' ? v.toString() : v), type: typeof v })))\n```\n| Value | `typeof` | Note |\n|---|---|---|\n| `42`, `NaN` | number | `NaN` is a number! |\n| `'42'` | string | |\n| `null` | **object** | historical bug; test with `v === null` |\n| `undefined` | undefined | |\n| `[]`, `{}`, `new Date()`, `/x/` | object | use `Array.isArray`, `instanceof` |\n| `() => {}` | function | |\n| `10n` | bigint | |\n| `Symbol()` | symbol | |\n| Pair | `==` | `===` | Why |\n|---|---|---|---|\n| `0 == ''` | true | false | `''` \u2192 `0` |\n| `null == undefined` | true | false | special rule: equal only to each other |\n| `'1' == 1` | true | false | string \u2192 number |\n| `[] == false` | true | false | `[]` \u2192 `''` \u2192 `0`; `false` \u2192 `0` |\n| `NaN == NaN` | false | false | NaN is never equal to anything; use `Number.isNaN` |\n| `null == 0` | false | false | null only equals undefined |\n| `'0' == false` | true | false | both \u2192 `0` |\n| `[1] == 1` | true | false | `[1]` \u2192 `'1'` \u2192 `1` |\n**Lesson:** use `===` always, except the idiom `x == null` (null or undefined).\n\n### J2: `toNumber`\n```js\nconst toNumber = s => {\n  const str = String(s ?? '').trim()\n  if (str === '') return null                       // Number('') is 0: guard it first\n  const n = Number(str.replace(/[^\\d.-]/g, ''))     // strip \u20b9 , spaces\n  return Number.isNaN(n) ? null : n\n}\ntoNumber('\u20b91,299') // 1299      toNumber('') // null      toNumber('abc') // null (becomes '' \u2192 Number('') = 0!)\n```\n**Careful:** `'abc'.replace(/[^\\d.-]/g,'')` is `''` and `Number('')` is `0`, not `NaN`. So check the **cleaned** string too:\n```js\nconst toNumber = s => {\n  const cleaned = String(s ?? '').replace(/[^\\d.-]/g, '')\n  if (cleaned === '' || cleaned === '-' || cleaned === '.') return null\n  const n = Number(cleaned); return Number.isNaN(n) ? null : n\n}\nconsole.assert(toNumber('\u20b91,299') === 1299); console.assert(toNumber('abc') === null); console.assert(toNumber('12.5') === 12.5)\n```\n**Lesson:** conversions have silent edge cases (`Number('') === 0`, `Number(null) === 0`); validate the *cleaned* input.\n\n### J3: Optional chaining\n```js\nconst getPincode = o => o?.address?.pincode ?? 'N/A'\ngetPincode(users[0])  // '411001'\ngetPincode(users[1])  // 'N/A'  (no address)\ngetPincode(null)      // 'N/A'\n```\n**Why `??` not `||`:** `||` replaces *any falsy* value (`0`, `''`); `??` only replaces `null`/`undefined`.\n\n### J4: Loops\n```js\nfor (let i = 1; i <= 100; i++) console.log(i % 15 === 0 ? 'FizzBuzz' : i % 3 === 0 ? 'Fizz' : i % 5 === 0 ? 'Buzz' : i)\nfor (let r = 1; r <= 10; r++) console.log(Array.from({ length: 10 }, (_, c) => String(r * (c + 1)).padStart(4)).join(''))\n```\n**Notice:** test `15` **first** (divisible by both). `padStart` aligns columns.\n\n### J5: Control flow\n```js\nfunction stockLabel(q) { if (q === 0) return 'Out of stock'; if (q < 5) return 'Low stock'; return 'In stock' }\nconst stockLabel2 = q => { switch (true) { case q === 0: return 'Out of stock'; case q < 5: return 'Low stock'; default: return 'In stock' } }\nconst RULES = [[q => q === 0, 'Out of stock'], [q => q < 5, 'Low stock']]\nconst stockLabel3 = q => RULES.find(([t]) => t(q))?.[1] ?? 'In stock'     // data-driven: easy to extend\n```\n**Keep:** the first (clearest). Lookup tables shine when rules grow or come from config.\n\n### J6: Functions\n```js\nconst clamp = (n, min, max) => Math.min(Math.max(n, min), max)\nconst capitalize = s => (s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s)\nconst isPalindrome = s => { const t = s.toLowerCase().replace(/[^a-z0-9]/g, ''); return t === [...t].reverse().join('') }\nconst sum = (...nums) => nums.reduce((a, b) => a + b, 0)\nconsole.assert(clamp(15, 0, 10) === 10); console.assert(capitalize('rAVI') === 'Ravi')\nconsole.assert(isPalindrome('A man, a plan, a canal: Panama')); console.assert(sum() === 0 && sum(1, 2, 3) === 6)\n```\n**Notice:** `reduce(..., 0)` gives `0` for no args (no initial value would throw on an empty array); `capitalize('')` returns `''` safely.\n\n### J7: Higher-order functions\n```js\nconst repeat = (n, fn) => { for (let i = 0; i < n; i++) fn(i) }\nconst once = fn => { let called = false, result; return (...args) => (called ? result : ((called = true), (result = fn(...args)))) }\nconst pipe = (...fns) => x => fns.reduce((v, f) => f(v), x)\n\nconst trim = s => s.trim(), lower = s => s.toLowerCase(), slug = s => s.replace(/\\s+/g, '-')\npipe(trim, lower, slug)('  Hi There ')   // 'hi-there'\nconst init = once(() => { console.log('init'); return 42 }); init(); init()   // logs once; both return 42\n```\n**Notice:** `once` is a **closure**: `called` and `result` live on between calls.\n\n### J8: Recursion\n```js\nconst factorial = n => (n <= 1 ? 1 : n * factorial(n - 1))                         // base case n<=1\nconst flattenDeep = a => a.reduce((acc, x) => acc.concat(Array.isArray(x) ? flattenDeep(x) : x), [])\nconst countTree = nodes => nodes.reduce((n, c) => n + 1 + countTree(c.replies ?? []), 0)\n\nflattenDeep([1, [2, [3, [4]]]])   // [1,2,3,4]\ncountTree([{ id: 1, replies: [{ id: 2, replies: [{ id: 3 }] }] }, { id: 4 }])   // 4\n```\n**Call stack for `factorial(3)`:** `f(3)` waits for `f(2)` \u2192 waits for `f(1)` \u2192 returns 1 \u2192 `f(2)=2` \u2192 `f(3)=6`. Every recursion needs a base case or you get \"Maximum call stack size exceeded\".\n\n### J9: Array basics\n```js\nconst a = [1, 2, 3]\na.push(4)          // mutates \u2192 [1,2,3,4]      a.pop()        // mutates\na.unshift(0)       // mutates (front)          a.shift()      // mutates\na.splice(1, 0, 9)  // INSERT 9 at index 1 (mutates)   a.splice(1, 1) // remove index 1 (mutates)\nconst copy = a.slice()      // new array        const copy2 = [...a]\n```\n**Mutate:** `push, pop, shift, unshift, splice, sort, reverse, fill`. **Return new:** `map, filter, slice, concat, flat, toSorted, toReversed, with`. In Vue/React this matters: reactive systems and equality checks like new arrays.\n\n### J10: map/filter/reduce on messages\n```js\nconst unread = messages.filter(m => !m.read).length                       // 2\nconst texts = messages.map(m => m.text)\nconst perSender = messages.reduce((acc, m) => ((acc[m.from] = (acc[m.from] ?? 0) + 1), acc), {})   // { BUYER: 3, SELLER: 1 }\n```\n**Notice:** `reduce` with an object accumulator is the \"group/count\" workhorse; the comma operator returns `acc`.\n\n### J11: Orders analytics\n```js\nconst revenue = orders.filter(o => o.status === 'PAID').reduce((s, o) => s + o.total, 0)             // 2396\nconst byStatus = orders.reduce((acc, o) => ((acc[o.status] ??= []).push(o), acc), {})                // {PAID:[\u2026],PENDING:[\u2026],CANCELLED:[\u2026]}\nconst top3 = [...orders].sort((a, b) => b.total - a.total).slice(0, 3)                               // 2999, 1299, 598\nconst avg = orders.reduce((s, o) => s + o.total, 0) / orders.length                                  // 5794/5 = 1158.8\nconst perBuyer = orders.reduce((acc, o) => ((acc[o.buyer] = (acc[o.buyer] ?? 0) + 1), acc), {})      // {Ravi:2, Asha:2, Meera:1}\n```\n**Notice:** `[...orders].sort` copies first because `sort` mutates. `??=` creates the bucket on first use.\n\n### J12: Sorting\n```js\nconst byName = [...users].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }))   // Asha, meera, Ravi\nconst newest = [...messages].sort((a, b) => b.ts - a.ts)\n[10, 9, 1, 100].sort()                       // [1, 10, 100, 9]  \u2190 default sort is STRING order!\n[10, 9, 1, 100].sort((a, b) => a - b)        // [1, 9, 10, 100]\n```\n**Without `sensitivity:'base'`:** uppercase sorts before lowercase in plain `<`; `localeCompare` is correct for human text. **Original untouched** because we copied.\n\n### J13: find/some/every + Map\n```js\nconst hasUnread = msgs => msgs.some(m => !m.read)\nconst allPaid = os => os.every(o => o.status === 'PAID')\nconst findOrder = (os, id) => os.find(o => o.id === id)\n\nconst big = Array.from({ length: 10000 }, (_, i) => ({ id: i }))\nconsole.time('find'); for (let i = 0; i < 10000; i++) big.find(o => o.id === i); console.timeEnd('find')     // O(n) each \u2192 O(n\u00b2) total\nconst index = new Map(big.map(o => [o.id, o]))\nconsole.time('map');  for (let i = 0; i < 10000; i++) index.get(i);                console.timeEnd('map')      // O(1) each\n```\n**Lesson:** repeated lookups by id \u2192 build a `Map` once.\n\n### J14: De-duplicate\n```js\nconst latestPerId = items => [...new Map([...items].sort((a, b) => a.ts - b.ts).map(i => [i.id, i])).values()]\n// later entries overwrite earlier ones with the same key \u2192 latest by ts wins\n[...new Set([1, 2, 2, 3])]    // [1,2,3]  (primitives only: Sets compare objects by reference)\n```\n\n### J15: Objects and destructuring\n```js\nconst byId = list => Object.fromEntries(list.map(u => [u.id, u]))\nconst pick = (o, keys) => Object.fromEntries(keys.filter(k => k in o).map(k => [k, o[k]]))\nconst omit = (o, keys) => Object.fromEntries(Object.entries(o).filter(([k]) => !keys.includes(k)))\n\nconst response = { data: { content: [] } }\nconst { data: { content = [], totalElements = 0 } = {} } = response     // defaults at every level\n```\n**Notice:** the `= {}` after `data:` protects against `response.data` being `undefined`.\n\n### J16: Copying\n```js\nconst a = { name: 'Ravi', address: { city: 'Pune' } }\nconst shallow = { ...a }; shallow.address.city = 'X'; a.address.city        // 'X'  \u2190 shared nested object!\nconst deep = structuredClone(a); deep.address.city = 'Y'; a.address.city     // still 'X'\n\nJSON.parse(JSON.stringify({ d: new Date(), u: undefined, f() {}, m: new Map() }))\n// \u2192 { d: '2026-\u2026Z' (string!) }   undefined/function dropped, Map becomes {}\n```\n**Lesson:** spread copies **one level**; `structuredClone` handles Dates/Maps/Sets (but not functions).\n\n### J17: JSON \u2192 view-model\n```js\nconst toViewModel = page => ({\n  total: page.totalElements ?? 0,\n  chats: (page.content ?? []).map(c => {\n    const d = new Date(c.lastMessageAt)\n    return { id: c.id, name: c.buyerName ?? 'Unknown', lastAt: Number.isNaN(d.getTime()) ? null : d, unread: c.unread ?? 0 }\n  }),\n})\n```\n**Notice:** invalid dates become `null` instead of the confusing \"Invalid Date\"; `null` unread becomes `0`. The view-model protects the UI from backend surprises.\n\n### J18: Scope and hoisting (answers)\n```js\nconsole.log(a); var a = 1               // undefined   (var hoisted, value not)\nconsole.log(b); let b = 1               // ReferenceError (TDZ)\nfoo(); function foo() { console.log('hi') }        // works: declarations hoisted with body\nbar(); var bar = function () {}                    // TypeError: bar is not a function (var is undefined)\nlet x = 'outer'; { let x = 'inner'; console.log(x) }   // inner (block shadowing)\nfor (var i = 0; i < 3; i++) {} console.log(i)          // 3  (var leaks out of the loop)\n```\n**Stack drawing:** global \u2192 `foo()` frame pushed \u2192 logs \u2192 popped. Mention the TDZ (temporal dead zone) = the period between entering scope and the `let` line.\n\n### J19: Closures\n```js\nconst makeCounter = () => { let c = 0; return { inc: () => ++c, reset: () => (c = 0), get: () => c } }\nfunction wallet(initial = 0) { let balance = initial; return { deposit: n => (balance += n), balance: () => balance } }   // `balance` unreachable directly\nconst withPrefix = prefix => msg => `${prefix}${msg}`; const err = withPrefix('[ERR] '); err('boom')\n\nfor (var i = 0; i < 3; i++) setTimeout(() => console.log(i))   // BUG: prints 3,3,3 (one shared var)\nfor (let i = 0; i < 3; i++) setTimeout(() => console.log(i))   // FIX 1: 0,1,2 (new binding per iteration)\nfor (var i = 0; i < 3; i++) ((j) => setTimeout(() => console.log(j)))(i)   // FIX 2: IIFE captures a copy\n```\n\n### J20: Debounce and throttle\n```js\nconst debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } }\nconst throttle = (fn, ms) => { let last = 0; return (...a) => { const n = Date.now(); if (n - last >= ms) { last = n; fn(...a) } } }\n\nconst t0 = Date.now(), log = tag => v => console.log(tag, v, Date.now() - t0 + 'ms')\nconst d = debounce(log('debounce'), 200), th = throttle(log('throttle'), 200)\nlet i = 0; const id = setInterval(() => { d(i); th(i); if (++i === 20) clearInterval(id) }, 50)\n// debounce logs ONCE (\u2248 1200ms, after the last call); throttle logs about every 200ms (4\u20135 times)\n```\n**Extra (`cancel`):** `const debounced = (...a) => {\u2026}; debounced.cancel = () => clearTimeout(t)`.\n\n### J21: Memoize\n```js\nconst memoize = fn => { const cache = new Map(); return (...args) => { const k = JSON.stringify(args); if (!cache.has(k)) cache.set(k, fn(...args)); return cache.get(k) } }\nconst slowFib = n => (n < 2 ? n : slowFib(n - 1) + slowFib(n - 2))\nconst fastFib = memoize(n => (n < 2 ? n : fastFib(n - 1) + fastFib(n - 2)))\nconsole.time('slow'); slowFib(35); console.timeEnd('slow')   // ~50\u2013150ms+ and exponential growth\nconsole.time('fast'); fastFib(35); console.timeEnd('fast')   // ~0ms\n```\n**Limits:** `JSON.stringify` keys fail for functions/circular objects and `undefined`; the cache grows forever (memory): use `WeakMap` or an LRU for big inputs.\n\n### J22: `this`\n```js\nconst obj = { name: 'Ravi', hi() { return this.name } }\nconst f = obj.hi; f()                                  // BUG: this = undefined/global  \u2192 FIX: const f = obj.hi.bind(obj)\nconst o2 = { name: 'A', hi: () => this.name }          // BUG: arrow has no own this     \u2192 FIX: hi() { \u2026 }\nconst o3 = { name: 'B', run() { [1].forEach(function () { console.log(this.name) }) } }   // BUG \u2192 FIX: use an arrow function callback\nbtn.addEventListener('click', function () { console.log(this) })   // this = the button (but an arrow would NOT be)\n```\n**Rule:** for a normal function, `this` is decided by **how it's called** (`obj.m()` \u2192 obj; detached \u2192 none); arrow functions **inherit** `this` from where they're written.\n\n### J23: Classes\n```js\nclass Shape { area() { throw new Error('not implemented') } toString() { return `${this.constructor.name}(${this.area().toFixed(2)})` } }\nclass Circle extends Shape { #r; constructor(r) { super(); this.#r = r } area() { return Math.PI * this.#r ** 2 } }\nclass Rect extends Shape { constructor(w, h) { super(); this.w = w; this.h = h } area() { return this.w * this.h }\n  static from({ w, h }) { return new Rect(w, h) } }\nString(new Circle(2))   // 'Circle(12.57)'     new Circle(2).#r  // SyntaxError (truly private)\n```\n**Java comparison:** `abstract class Shape` \u2194 the throwing method (JS has no `abstract`); `private final double r` \u2194 `#r`; `static` factory is the same idea.\n\n### J24: EventEmitter\n```js\nclass Emitter {\n  #m = new Map()\n  on(e, f) { (this.#m.get(e) ?? this.#m.set(e, new Set()).get(e)).add(f); return () => this.off(e, f) }\n  off(e, f) { this.#m.get(e)?.delete(f) }\n  once(e, f) { const off = this.on(e, (...a) => { off(); f(...a) }); return off }\n  emit(e, ...a) { [...(this.#m.get(e) ?? [])].forEach(f => f(...a)) }      // iterate a COPY\n}\nconst bus = new Emitter(); const un = bus.on('x', v => console.log('got', v)); bus.emit('x', 1); un(); bus.emit('x', 2)   // only \"got 1\"\n```\n**Why the copy:** a listener removing itself (`once`) while we iterate the live `Set` could cause others to be skipped.\n\n### J25: Promises\n```js\nconst sleep = ms => new Promise(r => setTimeout(r, ms))\nconst timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))])\n\nconst ok = sleep(100).then(() => 'ok'), bad = Promise.reject(new Error('boom'))\nPromise.all([ok, bad]).catch(e => console.log('all \u2192', e.message))                  // fails fast: boom\nPromise.allSettled([ok, bad]).then(r => console.log(r))                              // [{status:'fulfilled',value:'ok'},{status:'rejected',reason:Error}]\nPromise.race([sleep(50).then(() => 'fast'), sleep(200).then(() => 'slow')])          // 'fast' (first to SETTLE)\nPromise.any([bad, ok]).then(v => console.log('any \u2192', v))                            // 'ok' (first to FULFIL)\n```\n**Notice:** `timeout` doesn't cancel the underlying work; it only stops waiting (use `AbortController` for real cancellation: J27).\n\n### J26: Async/await in parallel\n```js\nconst base = 'https://jsonplaceholder.typicode.com'\nconst json = async url => { const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json() }   // fetch doesn't reject on 404/500!\n\nconsole.time('parallel')\nconst [users, posts] = await Promise.all([json(`${base}/users`), json(`${base}/posts?_limit=5`)])\nconsole.timeEnd('parallel')\nconst rows = posts.map(p => ({ ...p, author: users.find(u => u.id === p.userId)?.name ?? 'Unknown' }))\n\nconsole.time('sequential'); await json(`${base}/users`); await json(`${base}/posts?_limit=5`); console.timeEnd('sequential')   // \u2248 sum of both\n```\n**Notice:** independent requests \u2192 `Promise.all` (time \u2248 the slower one); `await` one after another only when the second needs the first's result.\n\n### J27: Retry and abort\n```js\nconst sleep = ms => new Promise(r => setTimeout(r, ms))\nasync function retry(fn, { tries = 3, baseMs = 200 } = {}) {\n  let lastErr\n  for (let i = 0; i < tries; i++) {\n    try { return await fn(i) }\n    catch (e) {\n      lastErr = e\n      if (e.status >= 400 && e.status < 500) throw e                       // client error: retrying won't help\n      if (i < tries - 1) await sleep(baseMs * 2 ** i + Math.random() * 100) // 200, 400, 800 (+ jitter)\n    }\n  }\n  throw lastErr\n}\nconst fetchWithTimeout = (url, ms = 5000) => fetch(url, { signal: AbortSignal.timeout(ms) })\n\nconst c = new AbortController(); const p = fetch('/slow', { signal: c.signal }); c.abort()\np.catch(e => console.log(e.name))          // 'AbortError': the Network tab shows the request \"canceled\"\n```\n**Why jitter:** many clients retrying at the same instants would hammer a recovering server (thundering herd).\n\n### J28: Event-loop prediction\n```js\nconsole.log(1)\nsetTimeout(() => console.log(2))\nPromise.resolve().then(() => console.log(3))\n;(async () => { console.log(4); await null; console.log(5) })()\nconsole.log(6)\n```\n**Output: `1 4 6 3 5 2`.**\nTrace: sync code runs first \u2192 prints **1**; `setTimeout` goes to the macrotask queue; `.then` is queued as microtask A; the async function runs synchronously until its first `await` \u2192 prints **4**, and the rest becomes microtask B; then **6**. Stack empty \u2192 drain microtasks: A \u2192 **3**, B \u2192 **5**; only then the next macrotask \u2192 **2**.\nMore to practise:\n```js\nsetTimeout(() => console.log('t1'), 0); queueMicrotask(() => console.log('m1')); console.log('s')            // s m1 t1\nPromise.resolve().then(() => { console.log('a'); setTimeout(() => console.log('b')) }); setTimeout(() => console.log('c'))   // a c b\n```\n**Rule:** sync \u2192 all microtasks (promises, `queueMicrotask`, post-`await`) \u2192 one macrotask (timers, events) \u2192 microtasks again \u2192 \u2026\n\n### J29: DOM rendering (XSS-safe)\n```html\n<input id=\"q\" placeholder=\"Search\"><ul id=\"list\"><\/ul><p id=\"empty\" hidden>No chats found<\/p>\n<script type=\"module\">\n  const chats = [{ id: 1, name: 'Ravi' }, { id: 2, name: 'Asha' }, { id: 3, name: '<img src=x onerror=alert(1)>' }]\n  const list = document.getElementById('list'), empty = document.getElementById('empty')\n  function render(rows) {\n    list.replaceChildren(...rows.map(c => { const li = document.createElement('li'); li.textContent = c.name; return li }))   // textContent: never parses HTML\n    empty.hidden = rows.length > 0\n  }\n  q.addEventListener('input', () => render(chats.filter(c => c.name.toLowerCase().includes(q.value.trim().toLowerCase()))))\n  render(chats)\n<\/script>\n```\n**Notice:** the hostile name shows as literal text, no alert. `innerHTML = c.name` would execute the `onerror`. `replaceChildren` swaps the whole list in one update.\n\n### J30: Posts viewer (complete)\n```html\n<input id=\"q\" placeholder=\"Search title\"> <button id=\"prev\">Prev<\/button> <span id=\"pg\">1<\/span> <button id=\"next\">Next<\/button>\n<p id=\"status\" role=\"status\"><\/p><ul id=\"posts\"><\/ul>\n<script type=\"module\">\n  const API = 'https://jsonplaceholder.typicode.com/posts'\n  const state = { page: 1, q: '', ctrl: null }\n  async function http(url, opts) {\n    const r = await fetch(url, opts)\n    if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { status: r.status })\n    return r.status === 204 ? null : r.json()\n  }\n  async function load() {\n    state.ctrl?.abort(); state.ctrl = new AbortController()                    // cancel the previous request \u2192 no race\n    status.textContent = 'Loading\u2026'\n    try {\n      const params = new URLSearchParams({ _page: state.page, _limit: 10, ...(state.q && { q: state.q }) })\n      const rows = await http(`${API}?${params}`, { signal: state.ctrl.signal })\n      posts.replaceChildren(...rows.map(p => { const li = document.createElement('li'); li.textContent = p.title; return li }))\n      status.textContent = rows.length ? '' : 'No posts found'\n      pg.textContent = state.page\n    } catch (e) { if (e.name !== 'AbortError') status.textContent = `Error: ${e.message}. Try again.` }\n  }\n  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } }\n  q.addEventListener('input', debounce(() => { state.q = q.value.trim(); state.page = 1; load() }, 350))\n  prev.onclick = () => { if (state.page > 1) { state.page--; load() } }\n  next.onclick = () => { state.page++; load() }\n  load()\n<\/script>\n```\n**Race handled:** each `load()` aborts the previous request, so a slow answer for \"ab\" can never overwrite \"abc\"; `AbortError` is expected, not shown. Create/edit/delete follow the same `http()` with `method: 'POST'|'PUT'|'DELETE'`, `headers: {'Content-Type':'application/json'}` and `body: JSON.stringify(...)`; JSONPlaceholder pretends to save (returns a fake id, nothing persists).\n\n---\n**Next \u2192 Workbook 3: Vue solutions.**\n\n\n# SOLUTIONS WORKBOOK 3: VUE (full code, with explanations)\n\n> Attempt first. Each solution is one valid answer. All use `<script setup>`. *Code is written carefully but not executed here.*\n\n---\n\n## Reactivity and templates\n\n### V1: Counter\n```vue\n<script setup>\nimport { ref, computed } from 'vue'\nconst n = ref(0)\nconst parity = computed(() => (n.value % 2 === 0 ? 'even' : 'odd'))\n<\/script>\n<template>\n  <button @click=\"n--\" :disabled=\"n === 0\">\u2212<\/button>\n  <output>{{ n }} ({{ parity }})<\/output>\n  <button @click=\"n++\">+<\/button>\n  <button @click=\"n = 0\">Reset<\/button>\n<\/template>\n```\n**Notice:** in the template refs unwrap automatically (`n`, not `n.value`); in script you need `.value`. `parity` is derived data \u2192 `computed`.\n\n### V2: Directives tour\n```vue\n<script setup>\nimport { ref, reactive } from 'vue'\nconst status = ref('a'), open = ref(true), users = ref([{ id: 1, name: 'Ravi' }, { id: 2, name: 'Asha' }])\nconst obj = reactive({ city: 'Pune', pin: '411001' }), hasError = ref(false), w = ref(120)\nconst save = () => console.log('saved')\n<\/script>\n<template>\n  <p v-if=\"status === 'a'\">A<\/p><p v-else-if=\"status === 'b'\">B<\/p><p v-else>Other<\/p>\n  <!-- v-if REMOVES/creates the element (cheap to toggle rarely); v-show keeps it and toggles display:none (cheap to toggle often) -->\n  <div v-show=\"open\">visible when open<\/div>\n  <ul>\n    <li v-for=\"(u, i) in users\" :key=\"u.id\">{{ i }}: {{ u.name }}<\/li>\n    <li v-for=\"(v, k) in obj\" :key=\"k\">{{ k }} = {{ v }}<\/li>\n    <li v-for=\"n in 3\" :key=\"n\">#{{ n }}<\/li>\n  <\/ul>\n  <form @submit.prevent=\"save\">\n    <input @keyup.enter=\"save\" :class=\"{ bad: hasError }\" :style=\"{ width: w + 'px' }\">\n    <button @click.stop=\"open = !open\">toggle<\/button>\n  <\/form>\n<\/template>\n```\n**Notice:** `:key` is on every `v-for`; the `v-for` and `v-if` are never on the same element (use a `computed` filter instead).\n\n### V3: Todo list\n```vue\n<script setup>\nimport { ref, computed, watch } from 'vue'\nconst todos = ref(JSON.parse(localStorage.getItem('todos') ?? '[]'))\nconst text = ref(''), filter = ref('all')\nlet id = Math.max(0, ...todos.value.map(t => t.id)) + 1\nconst shown = computed(() => todos.value.filter(t => filter.value === 'all' || (filter.value === 'done') === t.done))\nconst left = computed(() => todos.value.filter(t => !t.done).length)\nfunction add() { const v = text.value.trim(); if (!v) return; todos.value.push({ id: id++, text: v, done: false }); text.value = '' }\nconst remove = t => (todos.value = todos.value.filter(x => x.id !== t.id))\nwatch(todos, v => localStorage.setItem('todos', JSON.stringify(v)), { deep: true })\n<\/script>\n<template>\n  <form @submit.prevent=\"add\"><input v-model=\"text\" aria-label=\"New todo\"><button>Add<\/button><\/form>\n  <button v-for=\"f in ['all', 'active', 'done']\" :key=\"f\" :aria-pressed=\"filter === f\" @click=\"filter = f\">{{ f }}<\/button>\n  <p v-if=\"!shown.length\">Nothing here<\/p>\n  <ul>\n    <li v-for=\"t in shown\" :key=\"t.id\">\n      <label><input type=\"checkbox\" v-model=\"t.done\"> <span :style=\"{ textDecoration: t.done ? 'line-through' : 'none' }\">{{ t.text }}<\/span><\/label>\n      <button @click=\"remove(t)\" :aria-label=\"`Delete ${t.text}`\">\u2715<\/button>\n    <\/li>\n  <\/ul>\n  <p>{{ left }} left<\/p>\n<\/template>\n```\n**Notice:** `(filter === 'done') === t.done` makes 'active' mean `done === false` and 'done' mean `done === true`. `deep: true` is needed because we mutate `t.done` inside the array.\n\n### V4: Reactivity bugs lab\n```js\nimport { reactive, ref, toRefs, nextTick } from 'vue'\n// 1. Destructuring reactive loses reactivity\nconst state = reactive({ n: 1 })\nlet { n } = state; n++                              // BUG: n is a plain number copy; state.n still 1\nconst { n: nRef } = toRefs(state); nRef.value++     // FIX: nRef is linked to state.n \u2192 state.n is 2\n\n// 2. Replacing a reactive variable breaks the link\nlet obj = reactive({ a: 1 }); obj = reactive({ a: 2 })   // BUG: template still tracks the OLD proxy\nconst o2 = reactive({ a: 1 }); Object.assign(o2, { a: 2 })   // FIX: mutate in place (or use ref and assign .value)\n\n// 3. Plain variable is not reactive\nlet plain = 0; plain++                              // BUG: no tracking\nconst count = ref(0); count.value++                 // FIX\n\n// 4. DOM isn't updated synchronously\ncount.value++; console.log(el.textContent)          // BUG: still old text\ncount.value++; await nextTick(); console.log(el.textContent)   // FIX: DOM updated\n```\n**Why:** Vue tracks reads/writes **through the Proxy**; copying a primitive out or swapping the Proxy bypasses it. DOM updates are batched to the next tick.\n\n### V5: `ref` vs `reactive`\n```js\nconst form = reactive({ name: '', email: '' })                    // one object: easy to pass, reset\nconst reset = () => Object.assign(form, { name: '', email: '' })\nconst name = ref(''), email = ref('')                              // separate refs: easy to destructure/return\nconst { name: n2, email: e2 } = toRefs(form)                       // best of both: refs that stay linked to form\n```\n| | `reactive` | `ref` |\n|---|---|---|\n| Access | `form.name` | `name.value` (script) |\n| Replace whole value | \u2717 breaks | \u2713 `r.value = {...}` |\n| Destructure | \u2717 (use `toRefs`) | \u2713 |\n| Works for primitives | \u2717 | \u2713 |\n**Rule of thumb:** default to `ref`; use `reactive` for a cohesive form object you never replace.\n\n### V6: Computed cart\n```vue\n<script setup>\nimport { ref, computed } from 'vue'\nconst items = ref([{ id: 1, name: 'Sneakers', price: 1299, qty: 1 }, { id: 2, name: 'Socks', price: 133, qty: 3 }])\nconst subtotal = computed(() => items.value.reduce((s, i) => s + i.price * i.qty, 0))\nconst tax = computed(() => Math.round(subtotal.value * 0.18))\nconst total = computed(() => subtotal.value + tax.value)\nconst count = computed(() => items.value.reduce((n, i) => n + i.qty, 0))\nconst inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' })\nconst dec = i => i.qty > 1 && i.qty--\n<\/script>\n<template>\n  <ul><li v-for=\"i in items\" :key=\"i.id\">{{ i.name }} \u00b7 {{ inr.format(i.price) }} \u00d7\n    <button @click=\"dec(i)\" :disabled=\"i.qty === 1\">\u2212<\/button> {{ i.qty }} <button @click=\"i.qty++\">+<\/button><\/li><\/ul>\n  <p>{{ count }} items \u00b7 Subtotal {{ inr.format(subtotal) }} \u00b7 GST {{ inr.format(tax) }} \u00b7 <strong>{{ inr.format(total) }}<\/strong><\/p>\n<\/template>\n```\n**Notice:** no arithmetic in the template; computeds are cached and chain (total depends on subtotal and tax). (In real money code keep integer paise.)\n\n### V7: Watchers\n```js\nimport { ref, watch } from 'vue'\nconst q = ref(''), id = ref(1), post = ref(null), err = ref(null)\nwatch(q, v => console.log('search:', v))                                     // (a)\nwatch(id, async (v, _old, onCleanup) => {                                    // (b)\n  const ctrl = new AbortController()\n  onCleanup(() => ctrl.abort())                                              // runs before the next run / on unmount\n  err.value = null\n  try { const r = await fetch(`https://jsonplaceholder.typicode.com/posts/${v}`, { signal: ctrl.signal }); post.value = await r.json() }\n  catch (e) { if (e.name !== 'AbortError') err.value = e.message }\n}, { immediate: true })                                                      // (c) also run once at setup\n```\n**Notice:** `onCleanup` guarantees a fast `id` change cancels the previous request, so you never show an old post.\n\n---\n\n## Components\n\n### V8: ChatItem + ChatList\n```vue\n<!-- ChatItem.vue -->\n<script setup>defineProps({ chat: { type: Object, required: true } }); const emit = defineEmits(['select'])<\/script>\n<template><li @click=\"emit('select', chat.id)\"><strong>{{ chat.name }}<\/strong> {{ chat.last }}<\/li><\/template>\n<!-- ChatList.vue -->\n<script setup>import ChatItem from './ChatItem.vue'; defineProps({ chats: Array }); defineEmits(['select'])<\/script>\n<template><ul><ChatItem v-for=\"c in chats\" :key=\"c.id\" :chat=\"c\" @select=\"$emit('select', $event)\" /><\/ul><\/template>\n```\n**Notice:** data flows down (props), events up (`select`); the child never mutates `chat`.\n\n### V9: Props validation\n```vue\n<script setup>\ndefineProps({\n  name: { type: String, required: true },\n  age: { type: Number, default: 18, validator: v => v >= 0 },\n  tags: { type: Array, default: () => [] },            // factory: each instance gets its own array\n  profile: { type: Object, default: () => ({}) },\n})\n<\/script>\n```\n**Try:** `<UserCard :age=\"-1\">` \u2192 validator warning; `<UserCard age=\"x\">` \u2192 type warning; missing `name` \u2192 \"Missing required prop\". Warnings appear only in dev.\n\n### V
