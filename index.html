t formatting via Prettier, 2-space indent. 7. No presentational HTML (`<font>`, `<center>`, spacer `<br>`). 8. Unique ids (careful with generated lists). 9. Keep HTML meaningful even without CSS/JS (progressive enhancement). 10. Performance: preconnect to API origins, preload critical fonts.\n\n## 5.9 Common mistakes (Module 5)\nScript in `<head>` without `defer` then querying the DOM \u00b7 using ARIA instead of native elements \u00b7 `innerHTML` with user input \u00b7 giant unoptimised images \u00b7 duplicated ids in lists \u00b7 forgetting the viewport meta.\n\n## 5.10 Interview questions (Module 5)\n**Q1. What happens from receiving bytes to seeing pixels?** (5.1).\n**Q2. `async` vs `defer`?** (5.2 table).\n**Q3. Why can `innerHTML` be dangerous?** Parses attacker-controlled markup that can execute JS (XSS).\n**Q4. When do you use ARIA?** Only when no native element provides the semantics: live regions, custom widgets, extra labels.\n**Q5. What is `srcset`/`sizes` for?** Let the browser choose an appropriately sized image for the viewport and pixel density.\n**Q6. Why doesn't a Vue SPA rank well by default and how do you fix it?** Content is rendered by JS after load; use SSR/SSG/prerender.\n**Q7. View Source vs Elements panel?** original vs live DOM.\n\n## 5.11 Exercises (Module 5)\n1. Create three pages loading the same script normally, with `async`, with `defer`; record the console order and whether an element lookup succeeds.\n2. Add `srcset/sizes` to an image and watch which file DevTools downloads at 400px vs 1200px width.\n3. Run Lighthouse on your Seller Chat page; fix every accessibility and SEO item.\n4. Write a one-paragraph explanation of how the browser turns your HTML into pixels.\n\n## 5.12 Revision notes\nParser builds DOM and repairs mistakes \u00b7 `defer`/module for scripts \u00b7 ARIA supplements, doesn't replace, native HTML \u00b7 `alt`, labels, focus, contrast \u00b7 `srcset` + lazy loading \u00b7 never inject user input as HTML.\n\n## \u25b6 BUILD STEP 5 \u2014 finish the HTML of the Seller Chat screen\nFinal `<head>` (add to Step 1): description, theme color, favicon, and the CSS/JS links (files you'll create next):\n```html\n<meta name=\"description\" content=\"Manage your buyer chats and orders in one place.\" />\n<meta name=\"theme-color\" content=\"#0b6e75\" />\n<link rel=\"stylesheet\" href=\"styles.css\" />\n<script src=\"app.js\" type=\"module\"><\/script>   <!-- deferred automatically -->\n```\n`app.js` (opens the dialog; plain JavaScript, Part 3 will explain every line):\n```js\nconst dialog = document.getElementById('attach-dialog')\ndocument.getElementById('open-attach').addEventListener('click', () => dialog.showModal())\ndocument.getElementById('composer').addEventListener('submit', (e) => {\n  e.preventDefault()\n  const input = document.getElementById('msg')\n  const text = input.value.trim()\n  if (!text) return\n  const article = document.createElement('article')\n  article.className = 'msg msg--mine'\n  const p = document.createElement('p')\n  p.textContent = text                       // textContent = XSS-safe\n  article.append(p)\n  document.querySelector('.messages').append(article)\n  input.value = ''\n})\n```\n**Result:** an unstyled but fully working, accessible, semantic chat screen: you can open the Attach dialog and send messages that appear in the list. In Part 2 (CSS) you will make it look like a real app, then in Parts 3\u20136 replace the manual DOM code with Vue and a real API.\n\n---\n## Part 1 \u2014 summary exercises (full workbook in Module 50)\n1. Rebuild the whole Seller Chat page from memory in 30 minutes.\n2. Convert a real page from your company codebase's rendered HTML to semantic HTML.\n3. Make the composer send JSON with `fetch` to JSONPlaceholder and show the response.\n\n**Next \u2192 `02-css.md` (Modules 6\u201311): style this same page.**\n\n\n# PART 2 \u2014 CSS: COMPLETE BEGINNER TO ADVANCED\n\nTags: \ud83d\udfe2 Beginner \u00b7 \ud83d\udfe1 Intermediate \u00b7 \ud83d\udd34 Advanced \u00b7 \ud83c\udfed Production-level\n\n**Running project:** in this part you style the **Seller Chat page** you built in Part 1. Each module ends with a **STYLE STEP** that adds CSS to `styles.css`. By Module 11 your page looks like a real app and you know how that CSS is organised in a Vue project.\n\n---\n\n# MODULE 6 \u2014 CSS FUNDAMENTALS\n\n## 6.1 What is CSS? \ud83d\udfe2\n\n**Definition.** CSS (**Cascading Style Sheets**) is a language of **rules** that say how HTML elements should **look and be laid out**: colours, fonts, sizes, spacing, positions, animations.\n\n**Analogy.** HTML is the house structure (walls, doors, windows). CSS is the interior design: paint colour, furniture position, lighting. You can repaint without rebuilding.\n\n**Why it exists.** Early HTML mixed looks into content (`<font color=\"red\">`). To restyle a site you had to edit every page. CSS separates **content (HTML)** from **presentation (CSS)**: change one file, the whole site changes.\n\n**\"Cascading\"** means: when several rules target the same element, the browser uses a defined algorithm to decide which wins (6.8).\n\n**Where used:** every website and every Vue project (`.css`, `.scss`, `<style>` in `.vue` files).\n\n## 6.2 Syntax: rules, selectors, declarations \ud83d\udfe2\n```css\n.chat-item {              /* selector: WHICH elements */\n  background-color: #f5f5f5;   /* declaration = property : value ; */\n  padding: 12px;\n}\n```\n```\n selector        property   value\n    \u2502               \u2502         \u2502\n .chat-item  {  padding :  12px ;  }\n              \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500 declaration \u2500\u2500\u2500\u2500\u2500\u2500\u2518\n \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 rule set \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n- Every declaration ends with `;`.\n- Property names are fixed words (`color`, `margin`); values depend on the property.\n- Comments: `/* like this */`.\n- An **invalid property or value is ignored silently** (DevTools shows it with a warning icon). One missing `;` can break the *next* declaration.\n\n## 6.3 Three ways to add CSS \ud83d\udfe2\n```html\n<!-- 1. External (standard): cacheable, reusable -->\n<link rel=\"stylesheet\" href=\"styles.css\" />\n\n<!-- 2. Internal: small demos / critical CSS -->\n<style> h1 { color: teal; } <\/style>\n\n<!-- 3. Inline: highest priority, not reusable (use for dynamic values from JS) -->\n<h1 style=\"color: teal\">Hello<\/h1>\n```\nIn Vue single-file components you write `<style scoped>` per component (Module 11).\n\n## 6.4 Selectors: choosing what to style \ud83d\udfe2\n\n| Selector | Syntax | Matches |\n|---|---|---|\n| Universal | `*` | everything |\n| Element/type | `p` | all `<p>` |\n| Class | `.card` | `class=\"card\"` |\n| ID | `#main` | `id=\"main\"` |\n| Group | `h1, h2, h3` | any of them |\n| Compound | `button.primary` | a `button` that also has class `primary` |\n| Descendant | `nav a` | any `<a>` anywhere inside `<nav>` |\n| Child | `ul > li` | `<li>` that are **direct** children of `<ul>` |\n| Adjacent sibling | `h2 + p` | the `<p>` immediately after an `<h2>` |\n| General sibling | `h2 ~ p` | all `<p>` siblings after an `<h2>` |\n| Attribute | `[disabled]` \u00b7 `[type=\"email\"]` \u00b7 `[href^=\"https\"]` \u00b7 `[href$=\".pdf\"]` \u00b7 `[class*=\"btn\"]` | by attribute (`^`=starts, `$`=ends, `*`=contains) |\n\n```html\n<nav>\n  <ul>\n    <li><a href=\"/chats\">Chats<\/a><\/li>\n    <li><a href=\"https://help.com\">Help<\/a><\/li>\n  <\/ul>\n<\/nav>\n```\n```css\nnav a { text-decoration: none; }                 /* both links */\nnav > a { }                                      /* none: a is not a DIRECT child of nav */\na[href^=\"https\"]::after { content: \" \u2197\"; }       /* adds \u2197 after external links only */\n```\n\n### Pseudo-classes (an element in a certain state/position) \u2014 single colon\n```css\na:hover { }           /* mouse over */\nbutton:focus-visible { }   /* keyboard focus (use this for focus rings) */\nbutton:active { }     /* while pressed */\ninput:disabled { }   input:checked + label { }   input:invalid { }\nli:first-child { }   li:last-child { }   li:nth-child(odd) { }   li:nth-child(3n+1) { }\nli:not(.active) { }  :is(h1, h2, h3) { }   .card:has(img) { }    /* :has = \"parent selector\" */\n```\n`:hover` doesn't exist on touch screens: never hide essential features behind hover.\n\n### Pseudo-elements (a virtual part of an element) \u2014 double colon\n```css\n.required::after { content: \" *\"; color: crimson; }   /* adds a red star after the label */\np::first-line { font-weight: 700; }\ninput::placeholder { color: #888; }\ndialog::backdrop { background: rgb(0 0 0 / .5); }\n::selection { background: gold; }\n```\n`::before`/`::after` need the `content` property (even `content: \"\"`), are decorative, and aren't part of the DOM.\n\n### How the browser matches selectors\nIt reads **right to left**. For `nav ul li a`, it takes every `<a>` then asks \"is there an `li` ancestor \u2026 a `ul` \u2026 a `nav`?\". Practical result: short, class-based selectors are fastest and easiest to override.\n\n## 6.5 Specificity: who wins when rules collide \ud83d\udfe1\n\nImagine a 3-digit score (IDs, classes, elements). Higher wins; compare left digit first.\n| Selector | (ID, CLASS, ELEMENT) |\n|---|---|\n| `p` | 0,0,1 |\n| `.note` | 0,1,0 |\n| `p.note` | 0,1,1 |\n| `#nav .item a:hover` | 1,2,1 (id=1; `.item`+`:hover`=2; `a`=1) |\n| inline `style=\"\"` | beats all selectors |\n| `!important` | beats inline (last resort) |\n- `*`, combinators (`>`, `+`) and `:where()` add **0**.\n- **Equal specificity \u2192 the later rule in the file wins** (source order).\n```html\n<p id=\"x\" class=\"note\">Text<\/p>\n```\n```css\np     { color: blue; }    /* 0,0,1 */\n.note { color: green; }   /* 0,1,0 */\n#x    { color: red; }     /* 1,0,0  \u2190 wins \u2192 red */\n```\n**Debug:** DevTools \u2192 Elements \u2192 **Styles** pane shows rules in priority order; losing declarations are struck through.\n**Strategy:** keep specificity low and flat (single classes), avoid ids and `!important`, order rules from general to specific.\n\n## 6.6 Common mistakes (Module 6)\n| Mistake | Fix |\n|---|---|\n| `!important` to win fights | lower the competing specificity / reorder |\n| Deep selectors `.a .b .c .d` | flat BEM class names (Module 10) |\n| Typos like `colour` | DevTools shows ignored property |\n| Missing `;` | next rule ignored |\n| Styling by id | use classes |\n| Hover-only features | add focus/touch alternatives |\n\n## 6.7 Interview questions (Module 6)\n**Q1. What is specificity? Rank selector types.** inline > id > class/attribute/pseudo-class > element; ties \u2192 later rule.\n**Q2. Descendant vs child selector?** `a b` any depth; `a > b` direct children only.\n**Q3. Pseudo-class vs pseudo-element?** state/position of an existing element (`:hover`) vs virtual element (`::before`).\n**Q4. Inline vs internal vs external?** Inline per element (highest priority), internal per page, external per site (cacheable, standard).\n**Q5. Why is `!important` discouraged?** It breaks the cascade, forcing future overrides to use it too.\n**Q6. How does the browser evaluate selectors?** Right to left.\n\n## 6.8 Exercises (Module 6)\n1. Style a list so odd rows are grey (`:nth-child(odd)`), first item bold, last item no border.\n2. Add a \"\u2197\" after every link starting with `https` using an attribute selector and `::after`.\n3. Predict the colour of 6 conflicting rules, then check in DevTools.\n\n## 6.9 Revision notes\nRule = selector + declarations \u00b7 three ways to add CSS \u00b7 combinators `space > + ~` \u00b7 pseudo-classes = states, pseudo-elements = virtual parts \u00b7 specificity id>class>element, then order \u00b7 keep selectors flat.\n\n## \u25b6 STYLE STEP 6 \u2014 start `styles.css`\n```css\n/* styles.css */\n/* 1. A tiny reset: remove default margin and make sizing predictable (Module 7 explains why) */\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; }\n\n/* 2. Base look */\nbody { font-family: system-ui, sans-serif; line-height: 1.5; }\n\n/* 3. Links */\na { color: #0b6e75; }\na:hover { text-decoration: underline; }\nnav a { text-decoration: none; }\nnav ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1rem; }\n```\nReload: the nav items now sit in a row. (You used `display:flex`; it's explained in Module 8.)\n\n---\n\n# MODULE 7 \u2014 CSS CORE PROPERTIES\n\n## 7.1 Colours \ud83d\udfe2\n```css\ncolor: red;                      /* named colour (140+ names) */\ncolor: #0b6e75;                  /* HEX #RRGGBB; shorthand #RGB; with alpha #RRGGBBAA */\ncolor: rgb(11 110 117);          /* red green blue, each 0\u2013255 */\ncolor: rgb(11 110 117 / 0.5);    /* 50% transparent */\ncolor: hsl(184 83% 25%);         /* hue 0\u2013360\u00b0 (colour wheel), saturation %, lightness % */\ncolor: currentColor;             /* same as the element's text colour (great for SVG icons) */\n```\n**Use HSL for design work:** keep the hue, change lightness to make hover/dark variants (`hsl(184 83% 25%)` \u2192 hover `hsl(184 83% 20%)`). Modern: `oklch()` for perceptually even colours.\nWhere colours go: `color` (text), `background-color`, `border-color`, `outline-color`, `fill` (SVG), `box-shadow`.\n\n## 7.2 Units \ud83d\udfe2\n| Unit | Relative to | Use |\n|---|---|---|\n| `px` | fixed CSS pixel | hairline borders, shadows |\n| `%` | parent's matching property | widths |\n| `em` | this element's font-size (for `font-size`: parent's) | spacing that scales with text; **compounds when nested** |\n| `rem` | root (`<html>`) font-size, default 16px | **font sizes and spacing** (predictable, respects user settings) |\n| `vw` / `vh` | 1% of viewport width/height | full-screen sections |\n| `dvh` | dynamic viewport height | mobile browsers with moving address bars (fixes the 100vh bug) |\n| `ch` | width of the character \"0\" | `max-width: 65ch` for readable lines |\n| `fr` | fraction of free space | Grid only |\nRule of thumb: **`rem` for type and spacing, `%`/`fr`/flex for layout, `px` for hairlines.** Never set the root font-size in px: users who raise their browser font size for accessibility would be ignored.\nWorked example: root 16px. `padding: 1.5rem` = 24px. Inside a `font-size: 20px` element `padding: 1.5em` = 30px.\n\n## 7.3 Typography \ud83d\udfe2\n```css\nbody {\n  font-family: system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;  /* fallback stack: first available font wins */\n  font-size: 1rem;         /* 16px */\n  font-weight: 400;        /* 100\u2013900; 700 = bold */\n  line-height: 1.5;        /* UNITLESS: 1.5 \u00d7 the element's font size; inherits correctly */\n  letter-spacing: 0.01em;\n}\nh1 { font-size: 2rem; line-height: 1.2; text-wrap: balance; }\n.muted { color: #5b6b7a; font-size: .875rem; }\n.uppercase { text-transform: uppercase; letter-spacing: .06em; }\n.preview {                 /* single-line truncation with \u2026 (chat preview text) */\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n```\nWeb fonts (Google Fonts or self-hosted):\n```css\n@font-face { font-family: \"Inter\"; src: url(\"/fonts/inter.woff2\") format(\"woff2\"); font-display: swap; }\n```\n`font-display: swap` shows fallback text immediately (no invisible text). Keep line length ~45\u201375 characters (`max-width: 65ch`). Use **unitless** line-height (a `line-height: 24px` on `body` is inherited as a fixed value even by large headings \u2192 overlaps).\n\n## 7.4 Backgrounds, borders, shadows, gradients \ud83d\udfe2\n```css\n.hero {\n  background-color: #eef2f6;\n  background-image: url(hero.webp);\n  background-size: cover;       /* fill and crop; `contain` = fit entirely */\n  background-position: center;\n  background-repeat: no-repeat;\n}\n.card {\n  border: 1px solid #dbe2e9;              /* width style colour */\n  border-radius: 12px;                    /* 50% on a square = circle (avatars) */\n  box-shadow: 0 2px 8px rgb(0 0 0 / .12); /* x  y  blur  colour ; add `inset` for inner shadow */\n  background: linear-gradient(135deg, #0b6e75, #17a2b8);\n}\n.radial { background: radial-gradient(circle at top, #fff, #cfd8e0); }\n```\n`border` vs `outline`: outline doesn't take layout space and is used for focus rings. **Never write `outline: none` without a replacement focus style.**\n\n## 7.5 The box model \ud83d\udfe2 (the most important CSS idea)\n\nEvery element is a rectangular box made of four layers:\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 margin \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  outside space (transparent; separates from neighbours)\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 border \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u2502\n\u2502  \u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 padding \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u2502  \u2502  inside space (shows the background)\n\u2502  \u2502  \u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 content \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u2502   \u2502  \u2502  text/children; `width` & `height` apply here by default\n\u2502  \u2502  \u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2502   \u2502  \u2502\n\u2502  \u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518   \u2502  \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n```css\n.box { width: 200px; padding: 20px; border: 5px solid; margin: 10px; }\n```\n- **`content-box` (default):** total width = 200 + 20\u00d72 + 5\u00d72 = **250px**. Surprising!\n- **`border-box`:** `width` includes padding and border \u2192 total = **200px**. \n\n**Professional reset (put at the top of every project):**\n```css\n*, *::before, *::after { box-sizing: border-box; }\n```\nShorthand order: `margin: top right bottom left` (clockwise). Two values: `vertical horizontal`. `margin: 0 auto` centres a block that has a width. Negative margins pull elements.\n**Margin collapsing:** vertical margins of adjacent block siblings merge into the **larger** one (`20px` + `30px` = `30px`, not 50). It does not happen inside flex/grid containers or when padding/border separate them.\n\n## 7.6 Display, visibility, overflow \ud83d\udfe2\n```css\ndisplay: block | inline | inline-block | none | flex | grid | contents;\n```\n| To hide an element | Space kept? | Read by screen readers? | Use |\n|---|---|---|---|\n| `display: none` | no | no | remove completely (Vue `v-show`) |\n| `visibility: hidden` | yes | no | keep layout stable |\n| `opacity: 0` | yes | **yes** | fade animations |\n| `.sr-only` (clip trick) | no | **yes** | visually hidden labels |\n```css\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n```\n```css\noverflow: visible | hidden | scroll | auto;   /* auto = scrollbar only when needed */\n.messages { height: 300px; overflow-y: auto; }   /* fixed height + scroll = chat message list */\n```\n`overscroll-behavior: contain` stops scrolling \"leaking\" to the page behind a scrolling panel.\n\n## 7.7 Common mistakes (Module 7)\n| Mistake | Fix |\n|---|---|\n| No `border-box` reset \u2192 widths overflow | add the reset |\n| `height: 100vh` on mobile (address bar) | `100dvh` |\n| All sizes in px | `rem` |\n| `line-height: 24px` | unitless `1.5` |\n| `outline: none` | style `:focus-visible` instead |\n| Vertical margin on inline elements has no effect | make them `inline-block`/`block` or use padding |\n| Expecting margins to add up | remember collapsing |\n\n## 7.8 Interview questions (Module 7)\n**Q1. Explain the box model and `box-sizing`.** (7.5).\n**Q2. `em` vs `rem`?** em relative to own/parent font-size and compounds; rem relative to root, predictable.\n**Q3. `display:none` vs `visibility:hidden` vs `opacity:0`?** (7.6 table).\n**Q4. What is margin collapsing?** adjacent vertical margins merge to the larger.\n**Q5. How do you truncate text with an ellipsis?** `white-space: nowrap; overflow: hidden; text-overflow: ellipsis` (and `min-width:0` if inside flex).\n**Q6. Why unitless `line-height`?** it's recalculated per element font size instead of inheriting a fixed length.\n\n## 7.9 Exercises\n1. Build a card (padding, border, radius, shadow); measure its width in DevTools with `content-box` then `border-box`.\n2. Create a colour palette with HSL: brand, brand-dark, brand-light, text, muted.\n3. Make a 2-line clamped product description and a single-line truncated chat preview.\n\n## 7.10 Revision notes\nHSL for palettes \u00b7 rem for type/spacing \u00b7 unitless line-height \u00b7 box = content+padding+border+margin \u00b7 always `border-box` \u00b7 margin collapsing \u00b7 hide techniques differ in layout and accessibility.\n\n## \u25b6 STYLE STEP 7 \u2014 tokens, typography, components\nAdd to the top of `styles.css` (design tokens = named values reused everywhere):\n```css\n:root {\n  --bg: #f4f7f9;  --surface: #ffffff;  --text: #17212b;  --muted: #5b6b7a;  --line: #dbe2e9;\n  --brand: #0b6e75;  --brand-dark: #08565b;  --mine: #d7f0ee;\n  --radius: 12px;  --space-1: .25rem; --space-2: .5rem; --space-3: 1rem; --space-4: 1.5rem;\n}\nbody { background: var(--bg); color: var(--text); }\nh1, h2 { line-height: 1.2; margin: 0; }\nsmall, time { color: var(--muted); font-size: .8125rem; }\nbutton { font: inherit; padding: .55rem 1rem; border: 1px solid transparent; border-radius: var(--radius);\n         background: var(--brand); color: #fff; cursor: pointer; }\nbutton:hover { background: var(--brand-dark); }\nbutton:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }\ninput, textarea { font: inherit; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: var(--radius); }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n.skip-link { position: absolute; left: -9999px; }\n.skip-link:focus { left: var(--space-3); top: var(--space-3); background: #fff; padding: var(--space-2); }\n```\n(`var(--name)` reads a **CSS variable**; explained fully in Module 10.)\n\n---\n\n# MODULE 8 \u2014 POSITIONING AND LAYOUT\n\n## 8.1 Normal flow \ud83d\udfe2\nBy default: block elements stack top to bottom; inline content flows left to right and wraps. Every layout tool below changes this default.\n\n## 8.2 `position` \ud83d\udfe2/\ud83d\udfe1\n| Value | Behaviour | Leaves the flow? |\n|---|---|---|\n| `static` | default; `top/left/...` ignored | no |\n| `relative` | stays in place; can be nudged; **becomes the anchor for absolute children** | no (its space remains) |\n| `absolute` | placed relative to the nearest **positioned ancestor** (any non-static), else the page | **yes** |\n| `fixed` | relative to the **viewport**; stays during scroll | yes |\n| `sticky` | normal until a scroll threshold, then sticks within its parent | no |\n```\n.avatar { position: relative }         \u2190 the anchor\n  \u2514\u2500 .badge { position: absolute; top:-4px; right:-4px }   \u2190 measured from the avatar's box\n```\n```css\n.avatar { position: relative; width: 48px; height: 48px; }\n.avatar .badge { position: absolute; top: -4px; right: -4px; }   /* unread count bubble */\n.topbar { position: sticky; top: 0; z-index: 10; }                /* header stays visible */\n.toast { position: fixed; right: 16px; bottom: 16px; }            /* notification in a corner */\n.overlay { position: fixed; inset: 0; }                           /* inset: 0 = top/right/bottom/left: 0 */\n```\n**Bug:** badge appears in the page corner \u2192 the parent isn't `position: relative`. **Sticky doesn't work** if an ancestor has `overflow: hidden/auto` or the parent is too short.\n\n## 8.3 z-index and stacking contexts \ud83d\udd34\n`z-index` sets which overlapping element is on top. It works on positioned elements (and flex/grid items). Higher = closer to the viewer.\nA **stacking context** is a self-contained \"layer group\". Created by: the root, positioned + `z-index`, `opacity < 1`, `transform`, `filter`, `will-change`, `isolation: isolate`. Inside a context, children compete only with each other, and the whole group is ordered as one unit against its siblings.\n```\nHeader   z-index: 10        \u2190 context A (order 10)\nWrapper  transform: ...      \u2190 context B (order auto/0)\n  \u2514\u2500 Modal z-index: 9999    \u2190 only wins INSIDE B, so Header (10) still sits above the whole of B!\n```\n**Classic bug:** \"My modal is behind the header even with z-index 9999.\" **Fix:** render the modal at the end of `<body>` (Vue `<Teleport to=\"body\">`, native `<dialog>`) and keep a z-index scale in variables (`--z-header: 100; --z-modal: 1000`).\n\n## 8.4 Float and clear (legacy) \ud83d\udfe1\n`float: left` was used for page layouts before Flex/Grid, and parents \"collapsed\" (needing clearfix hacks). Today use floats **only** to wrap text around an image. Recognise `float`/`clear: both` in old company CSS; replace with Flex/Grid when touching it.\n\n## 8.5 Flexbox \ud83d\udfe2\u2192\ud83d\udd34\n\n**Flexbox lays out items in one dimension (a row OR a column)** and distributes space between them.\n```css\n.row { display: flex; }   /* children (flex items) now sit side by side */\n```\nTwo axes:\n```\nflex-direction: row (default)                       flex-direction: column\n main axis  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba                         main axis\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   cross axis            \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u2502\n\u2502 item 1 \u2502 item 2 \u2502 item 3 \u2502      \u2502                  \u2502  item 1  \u2502   \u25bc\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518      \u25bc                  \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n                                                      \u2502  item 2  \u2502   cross axis \u2500\u2500\u2500\u25ba\n```\n### Container properties\n| Property | Values | Effect |\n|---|---|---|\n| `flex-direction` | row \u00b7 column \u00b7 row-reverse \u00b7 column-reverse | choose the main axis |\n| `justify-content` | flex-start \u00b7 center \u00b7 flex-end \u00b7 space-between \u00b7 space-around \u00b7 space-evenly | distribute along the **main** axis |\n| `align-items` | stretch (default) \u00b7 flex-start \u00b7 center \u00b7 flex-end \u00b7 baseline | align along the **cross** axis |\n| `flex-wrap` | nowrap \u00b7 wrap | allow multiple lines |\n| `gap` | `1rem` or `8px 16px` | space between items (use instead of margins) |\n| `align-content` | like justify-content | spacing of multiple wrapped lines |\n### Item properties\n| Property | Meaning |\n|---|---|\n| `flex-grow` | share of **extra** space (0 = don't grow) |\n| `flex-shrink` | share of **missing** space to give up (1 = shrink when cramped) |\n| `flex-basis` | starting size before growing/shrinking |\n| `flex: 1` | shorthand `1 1 0%`: equal share of the free space |\n| `align-self` | override `align-items` for one item |\n| `order` | visual order (careful: screen readers still read DOM order) |\n**How sizing works:** start from `flex-basis`; if there is leftover space, share it by `flex-grow`; if items overflow, shrink them by `flex-shrink`.\n**Worked example:** container 600px, three items with `flex: 1` \u2192 each 200px. Make the middle `flex: 2` \u2192 150 / 300 / 150.\n**Gotcha: `min-width: auto`.** A flex item won't shrink below its content width, so long text overflows. Fix: `min-width: 0` on the item (and `min-height: 0` for column layouts that must scroll).\n\n### Practical patterns\n```css\n/* centre anything */\n.center { display: flex; justify-content: center; align-items: center; min-height: 100dvh; }\n/* nav bar: logo left, links centre, actions right */\n.nav { display: flex; align-items: center; gap: 1rem; }\n.nav .actions { margin-left: auto; }          /* auto margin eats the free space, pushing items right */\n/* chat bubbles */\n.messages { display: flex; flex-direction: column; gap: .5rem; }\n.msg--mine { align-self: flex-end; } .msg--theirs { align-self: flex-start; }\n```\n### The chat layout (sidebar + room) \u2014 step by step\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 .sidebar   \u2502 .room (column)                       \u2502\n\u2502  (fixed    \u2502 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502\n\u2502   320px,   \u2502 \u2502 header           flex: none      \u2502 \u2502\n\u2502   scrolls) \u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502\n\u2502            \u2502 \u2502 .messages  flex: 1 + overflow    \u2502 \u2502 \u2190 grows to fill, scrolls inside\n\u2502            \u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502\n\u2502            \u2502 \u2502 composer         flex: none      \u2502 \u2502\n\u2502            \u2502 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n```css\n.layout  { display: flex; height: 100dvh; }\n.sidebar { flex: 0 0 320px; border-right: 1px solid var(--line); overflow-y: auto; }\n.room    { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.room > header { flex: none; }\n.messages { flex: 1; min-height: 0; overflow-y: auto; }   /* min-height:0 is REQUIRED so it can shrink and scroll */\n.composer { flex: none; display: flex; gap: .5rem; }\n.composer textarea { flex: 1; }\n```\n**Why it works:** `.layout` is a row with a fixed-height viewport (`100dvh`). The sidebar has fixed width (`0 0 320px`: no grow, no shrink, 320px). The room takes all the rest (`flex:1`). Inside the room (a column), header and composer keep their own height (`flex: none`) and the message list takes the remaining height and scrolls on its own. If you forget `min-height: 0`, the list grows with its content and the **whole page** scrolls.\n\n## 8.6 CSS Grid \ud83d\udfe1\u2192\ud83d\udd34\n\n**Grid lays out items in two dimensions (rows and columns at once).**\n```css\n.grid {\n  display: grid;\n  grid-template-columns: 200px 1fr 2fr;   /* 3 columns: fixed, 1 share, 2 shares */\n  grid-template-rows: auto 1fr auto;\n  gap: 1rem;\n}\n```\n`fr` = fraction of the **free** space after fixed sizes. Helpers: `repeat(3, 1fr)`, `minmax(200px, 1fr)`, `auto`, `fit-content()`.\n**Responsive grid with no media queries:**\n```css\n.products { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }\n```\nMeaning: \"make as many columns as fit, each at least 220px, sharing leftover space equally.\" `auto-fit` is the same but collapses empty tracks so items stretch.\n**Placement:** `grid-column: 1 / 3` (from line 1 to 3) \u00b7 `grid-column: span 2` \u00b7 `grid-row: 2`.\n**Named areas** (readable page layouts):\n```css\n.page { display: grid; min-height: 100dvh;\n  grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto;\n  grid-template-areas: \"header header\" \"side main\" \"footer footer\"; }\n.page > header { grid-area: header; } .page > aside { grid-area: side; }\n.page > main { grid-area: main; } .page > footer { grid-area: footer; }\n```\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 header \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 side  \u2502      main      \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 footer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n**Alignment:** `justify-items` / `align-items` (inside cells), `justify-content` / `align-content` (whole grid), `place-items: center`. **Implicit tracks:** `grid-auto-rows: minmax(100px, auto)`. **Subgrid** lets nested grids reuse the parent's tracks.\n\n### Flexbox vs Grid\n| | Flexbox | Grid |\n|---|---|---|\n| Dimension | 1D | 2D |\n| Sizing driven by | content | the container's tracks |\n| Best for | toolbars, nav, centring, card internals, chat column | page layouts, dashboards, card grids, forms |\nUse **both**: Grid for the page skeleton, Flex inside components.\n\n## 8.7 Quick recipes\n| Goal | Code |\n|---|---|\n| Centre both ways | `display:grid; place-items:center` |\n| Space between | `display:flex; justify-content:space-between` |\n| Equal gaps | `gap` (not margins) |\n| Centre a block horizontally | `max-width: 60rem; margin-inline: auto` |\n| Full-height page | `min-height: 100dvh` |\n\n## 8.8 Common mistakes (Module 8)\n`justify` vs `align` confusion (depends on direction) \u00b7 forgetting `min-width/min-height: 0` \u00b7 using absolute positioning for layout \u00b7 Grid for a simple row \u00b7 float layouts \u00b7 `height: 100vh` plus padding overflow \u00b7 forgetting `position: relative` on the anchor.\n\n## 8.9 Interview questions (Module 8)\n**Q1. Flexbox vs Grid?** (table). **Q2. What is `absolute` relative to?** nearest positioned ancestor. **Q3. Why doesn't z-index work?** element not positioned, or trapped in a lower stacking context. **Q4. What does `flex: 1` mean?** `1 1 0%`. **Q5. How do you centre a div?** several ways (8.7). **Q6. Why is my flex child not scrolling/truncating?** needs `min-width/height: 0`. **Q7. `auto-fill` vs `auto-fit`?** keep vs collapse empty tracks.\n\n## 8.10 Exercises\n1. Reproduce the chat layout from scratch; shrink the window and watch only `.messages` scroll.\n2. Build a holy-grail page with grid areas.\n3. Build a responsive product grid (`auto-fill, minmax`).\n4. Reproduce the \"modal behind header\" bug and fix it two ways.\n\n## 8.11 Revision notes\nFlex = 1D, Grid = 2D \u00b7 main vs cross axis \u00b7 `flex:1`, `gap`, `margin-left:auto` \u00b7 `min-height:0` for scrolling panes \u00b7 absolute needs a positioned parent \u00b7 stacking contexts trap z-index.\n\n## \u25b6 STYLE STEP 8 \u2014 layout of the whole screen\n```css\nheader[role], body > header { background: var(--surface); border-bottom: 1px solid var(--line);\n  padding: var(--space-3); display: flex; align-items: center; gap: var(--space-4); }\nbody > footer { padding: var(--space-3); text-align: center; }\n\n.layout   { display: flex; height: calc(100dvh - 140px); }      /* leave room for header + footer */\n.sidebar  { flex: 0 0 320px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: var(--space-3); }\nmain      { flex: 1; min-width: 0; display: flex; }\nmain > section { flex: 1; display: flex; flex-direction: column; min-width: 0; }\nmain > section > header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3); border-bottom: 1px solid var(--line); background: var(--surface); }\n.messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); }\n.composer { display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--line); background: var(--surface); }\n.composer textarea { flex: 1; resize: none; }\n\n/* chat list rows */\n.chat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }\n.chat-list li { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; grid-template-areas: \"avatar name time\" \"avatar preview badge\";\n  gap: 0 var(--space-2); align-items: center; padding: var(--space-2); border-radius: var(--radius); cursor: pointer; }\n.chat-list li:hover { background: var(--bg); }\n.chat-list img { grid-area: avatar; border-radius: 50%; }\n.chat-list strong { grid-area: name; }\n.chat-list span { grid-area: preview; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }\n.chat-list time { grid-area: time; }\n.chat-list b { grid-area: badge; justify-self: end; background: var(--brand); color: #fff; border-radius: 999px; padding: 0 .5rem; font-size: .75rem; }\n\n/* message bubbles */\n.msg { max-width: min(75%, 520px); padding: .5rem .75rem; border-radius: 16px; overflow-wrap: anywhere; }\n.msg p { margin: 0; }\n.msg--mine { align-self: flex-end; background: var(--mine); }\n.msg--theirs { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }\n```\nReload: you now have a real two-pane chat layout. Notice how each rule uses concepts from Modules 6\u20138.\n\n---\n\n# MODULE 9 \u2014 RESPONSIVE DESIGN\n\n## 9.1 What and why \ud83d\udfe2\n**Responsive design:** one page that adapts to any screen (phone, tablet, laptop). Over half of web traffic is mobile. Ingredients: (1) the viewport meta tag, (2) flexible layouts (`%`, `fr`, flex, grid), (3) flexible media (`max-width: 100%`), (4) **media queries**.\n\n## 9.2 Mobile-first vs desktop-first \ud83d\udfe2\n- **Mobile-first (recommended):** write base CSS for the smallest screen; add `min-width` queries to enhance for bigger screens. Benefits: lighter CSS for phones, forces you to prioritise content, easier to maintain.\n- **Desktop-first:** base is desktop; `max-width` queries scale down. Tends to need many overrides.\n```css\n/* mobile: stack */\n.layout { display: block; }\n.sidebar { width: 100%; }\n/* tablet and up: side-by-side */\n@media (min-width: 768px) {\n  .layout { display: flex; }\n  .sidebar { flex: 0 0 320px; }\n}\n```\n**Breakpoints** (typical): 480 / 768 / 1024 / 1280. Choose where **your content breaks**, not specific devices.\nOther media features: `(prefers-color-scheme: dark)`, `(prefers-reduced-motion: reduce)`, `(hover: hover)`, `(orientation: landscape)`, `print`.\n\n## 9.3 Fluid sizing functions \ud83d\udfe1\n```css\nfont-size: clamp(1rem, 0.9rem + 1vw, 1.5rem);   /* clamp(min, preferred, max): fluid type, no media query */\nwidth: min(100% - 2rem, 70rem);                  /* the smaller value: full width minus gutters, but capped */\npadding: max(1rem, 3vw);                         /* the larger value */\ngrid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));\naspect-ratio: 16 / 9;                            /* thumbnails/videos keep their shape */\nimg { max-width: 100%; height: auto; object-fit: cover; }\n```\n`clamp(a,b,c)` = `max(a, min(b, c))`.\n\n## 9.4 Container queries \ud83d\udd34\nMedia queries look at the **viewport**. A reusable component (a chat card) may sit in a narrow sidebar on a wide screen. Container queries style it by **its container's** width:\n```css\n.chat-panel { container-type: inline-size; }\n@container (min-width: 420px) { .chat-item { grid-template-columns: 48px 1fr auto; } }\n```\n\n## 9.5 Logical properties \ud83d\udfe1\nWrite direction-aware CSS (supports right-to-left languages): `margin-inline-start`, `padding-block`, `inset-inline`, `border-inline-end`, `inline-size` (\u2248 width).\n\n## 9.6 Responsive patterns\n| Component | Mobile | Desktop |\n|---|---|---|\n| Chat app | list screen **or** room screen (route/state decides) | list + room side by side |\n| Navigation | hamburger/drawer | inline links |\n| Table | scroll horizontally or turn rows into cards | normal table |\n| Images | `srcset`, `max-width: 100%` | larger variants |\n| Forms | single column, 16px+ inputs | multi-column grid |\nTouch targets \u2265 44\u00d744px; inputs \u226516px font (prevents iOS zoom).\n\n## 9.7 Testing\nDevTools \u2192 Device toolbar (Cmd+Shift+M): presets, throttling, rotate. Also test real phones, landscape, 200% zoom, large system font, slow network.\n\n## 9.8 Common mistakes\nNo viewport meta \u00b7 fixed pixel widths \u00b7 desktop-first overrides everywhere \u00b7 hiding content on mobile instead of redesigning \u00b7 tiny tap targets \u00b7 `100vh` instead of `100dvh` \u00b7 horizontal page scroll from an over-wide element (find it by outlining all elements).\n\n## 9.9 Interview Qs\n**Q1. Mobile-first vs desktop-first?** **Q2. Media vs container queries?** **Q3. What does `clamp()` do?** **Q4. How do you make images responsive?** `max-width:100%`, `srcset`, `aspect-ratio`, `object-fit`. **Q5. What is the viewport meta tag?** (Module 1). **Q6. How would you make a data table responsive?**\n\n## 9.10 Exercises\n1. Make the Seller Chat page work at 320px: show only the list or only the room.\n2. Use `clamp()` for headings and `min()` for the page container.\n3. Build a responsive card grid with no media queries.\n\n## \u25b6 STYLE STEP 9 \u2014 make Seller Chat responsive\nReplace the earlier `.layout` rules by this mobile-first version:\n```css\n.layout  { display: flex; flex-direction: column; min-height: 60dvh; }\n.sidebar { flex: none; max-height: 40dvh; overflow-y: auto; background: var(--surface); padding: var(--space-3); border-bottom: 1px solid var(--line); }\nmain     { flex: 1; min-width: 0; display: flex; }\n@media (min-width: 768px) {\n  .layout  { flex-direction: row; height: calc(100dvh - 140px); }\n  .sidebar { flex: 0 0 320px; max-height: none; border-bottom: 0; border-right: 1px solid var(--line); }\n}\nh1 { font-size: clamp(1.25rem, 1rem + 1.2vw, 1.75rem); }\n```\n(In the Vue version you will switch panes by route instead; see Module 48.)\n\n---\n\n# MODULE 10 \u2014 ADVANCED CSS\n\n## 10.1 Transitions \ud83d\udfe1\nAnimate smoothly between two states.\n```css\n.btn { background: var(--brand); transition: background-color .2s ease, transform .1s ease; }\n.btn:hover  { background: var(--brand-dark); }\n.btn:active { transform: scale(.97); }\n```\n`transition: property duration timing-function delay`. Only properties with numeric values animate (`display` doesn't: use `opacity`/`visibility`). Without a transition, the change is instant.\n\n## 10.2 Transforms and filters \ud83d\udfe1\n```css\ntransform: translate(10px, 20px) rotate(45deg) scale(1.2);   /* order matters: applied right to left */\nfilter: blur(4px) grayscale(1) brightness(.8);\nbackdrop-filter: blur(8px);\n```\n**Performance:** animate only `transform` and `opacity`: the browser does them on the GPU compositor without recalculating layout (Module 11.5).\n\n## 10.3 Keyframe animations \ud83d\udfe1\n```css\n@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }\n.skeleton { animation: pulse 1.2s ease-in-out infinite; background: #e4e9ee; border-radius: 8px; }   /* loading placeholder */\n@keyframes spin { to { transform: rotate(360deg) } }\n.spinner { width: 24px; height: 24px; border: 3px solid #cfd8e0; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n```\nAlways respect `prefers-reduced-motion` for accessibility.\n\n## 10.4 CSS variables (custom properties) \ud83d\udfe1\n```css\n:root { --brand: #0b6e75; --radius: 12px; }        /* define on :root = global */\n.btn { background: var(--brand); border-radius: var(--radius); }\n.card--danger { --brand: #c0392b; }                 /* override for this subtree */\n.x { color: var(--missing, black); }                /* fallback value */\n```\n- They **cascade and inherit**, work at runtime (unlike Sass variables), and JavaScript can change them: `el.style.setProperty('--progress', '40%')`.\n- **Dark mode:**\n```css\n:root { --bg: #fff; --text: #111; }\n@media (prefers-color-scheme: dark) { :root { --bg: #0f161d; --text: #e4ebf1; } }\n:root[data-theme=\"dark\"] { --bg: #0f161d; --text: #e4ebf1; }     /* manual toggle */\nbody { background: var(--bg); color: var(--text); }\n```\n- **Design tokens** = the named design decisions (colours, spacing, type scale, radii, z-index) kept in one place and shared with designers.\n- Functions: `calc(100% - 2rem)`, `var()`, `min() max() clamp()`, `attr()`, `color-mix(in srgb, red 30%, white)`.\n\n## 10.5 Cascade, inheritance, layers \ud83d\udd34\nThe cascade decides the winner in this order: (1) importance/origin, (2) **cascade layers**, (3) **specificity**, (4) **source order**.\n**Inheritance:** some properties pass from parent to child automatically (`color`, `font-*`, `line-height`, `cursor`, `visibility`); others don't (`margin`, `padding`, `border`, `background`, `width`). Force with `inherit`, `initial`, `unset`, `revert`.\n**Layers** make order explicit regardless of specificity:\n```css\n@layer reset, base, components, utilities;\n@layer components { .btn { padding: .5rem 1rem; } }\n@layer utilities  { .p-0 { padding: 0; } }      /* wins over components even with lower specificity */\n```\nUseful to tame third-party CSS (put the library in an early layer). **Native nesting:** `.card { & .title { \u2026 } &:hover { \u2026 } }`.\n\n## 10.6 CSS architecture: BEM, tokens, SCSS, and friends \ud83c\udfed\n**BEM** (Block__Element--Modifier): flat, predictable class names.\n```css\n.chat-item { }                /* Block: a standalone component */\n.chat-item__name { }          /* Element: part of the block */\n.chat-item--unread { }        /* Modifier: a variation/state */\n```\n```html\n<li class=\"chat-item chat-item--unread\"><span class=\"chat-item__name\">Ravi<\/span><\/li>\n```\nBenefits: low specificity, no collisions, the name documents the structure.\n\n| Approach | What | Pros | Cons | Used |\n|---|---|---|---|---|\n| **Plain CSS + variables + BEM** | native | no build step; standard | needs discipline | small/medium projects |\n| **Sass/SCSS** | preprocessor: variables, nesting, mixins, `@use` partials | mature, powerful | build step; much now native | many existing company codebases |\n| **CSS Modules** | class names scoped per file | no collisions | extra syntax | React-style projects |\n| **Vue scoped styles** | `<style scoped>` | zero config | `:deep()` needed for children | **Vue apps** |\n| **Tailwind** | utility classes in markup (`flex gap-2 p-4`) | fast, consistent, tiny output | long class lists, learning curve | product teams |\n| **Bootstrap** | ready-made components + grid | quick, familiar | generic look, hard to customise | admin tools |\n```scss\n// SCSS\n$brand: #0b6e75;\n@mixin center { display: flex; align-items: center; justify-content: center; }\n.btn { background: $brand; @include center;\n  &:hover { background: darken($brand, 8%); }   // & = parent selector\n  &--large { padding: 1rem 2rem; } }              // compiles to .btn--large\n```\n**Rule for a real job:** **follow the repo's existing convention**; don't mix three systems.\n\n## 10.7 Common mistakes\nAnimating layout properties \u00b7 transitions on `display` \u00b7 forgetting reduced motion \u00b7 variables defined only inside a media query (undefined elsewhere) \u00b7 deep SCSS nesting (specificity growth) \u00b7 mixing BEM with ids.\n\n## 10.8 Interview Qs\n**Q1. Which properties inherit?** **Q2. CSS vs Sass variables?** **Q3. Why animate `transform` instead of `left`?** **Q4. What is BEM and why?** **Q5. What are cascade layers?** **Q6. How do you implement dark mode?** **Q7. What's the cascade order?**\n\n## 10.9 Exercises\n1. Add hover/active/focus/disabled states with transitions to all buttons.\n2. Build a skeleton loader for the chat list.\n3. Implement light/dark theme with variables and a toggle button using `data-theme`.\n4. Refactor messy CSS to BEM and remove all `!important`.\n\n## \u25b6 STYLE STEP 10 \u2014 polish: states, loading, dark mode\n```css\n/* dark theme */\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { --bg:#0f161d; --surface:#151e27; --text:#e4ebf1; --muted:#92a1af; --line:#26323e; --brand:#2aa6ad; --brand-dark:#47bcc2; --mine:#12383a; }\n}\n:root[data-theme=\"dark\"] { --bg:#0f161d; --surface:#151e27; --text:#e4ebf1; --muted:#92a1af; --line:#26323e; --brand:#2aa6ad; --brand-dark:#47bcc2; --mine:#12383a; }\n\n/* transitions */\nbutton, .chat-list li { transition: background-color .15s ease, transform .1s ease; }\nbutton:active { transform: scale(.98); }\nbutton:disabled { opacity: .5; cursor: not-allowed; }\n\n/* unread modifier (BEM style) and skeleton */\n.chat-list li.chat-item--unread strong { font-weight: 700; }\n.skeleton { background: var(--line); border-radius: 8px; animation: pulse 1.2s ease-in-out infinite; height: 48px; }\n@keyframes pulse { 50% { opacity: .5; } }\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n\n/* native dialog */\ndialog { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); background: var(--surface); color: var(--text); max-width: min(92vw, 480px); }\ndialog::backdrop { background: rgb(0 0 0 / .5); }\n```\n\n---\n\n# MODULE 11 \u2014 CSS IN PRODUCTION AND IN VUE\n\n## 11.1 Component-level styling with `<style scoped>` \ud83d\udfe1\n```vue\n<template>\n  <li class=\"chat-item\" :class=\"{ 'chat-item--unread': chat.unread > 0 }\">\n    <span class=\"chat-item__name\">{{ chat.name }}<\/span>\n    <span v-if=\"chat.unread\" class=\"chat-item__badge\">{{ chat.unread }}<\/span>\n  <\/li>\n<\/template>\n<script setup>defineProps({ chat: { type: Object, required: true } })<\/script>\n<style scoped>\n.chat-item { display: flex; gap: .5rem; padding: .75rem; }\n.chat-item--unread .chat-item__name { font-weight: 700; }\n.chat-item__badge { background: var(--brand); color: #fff; border-radius: 999px; padding: 0 .5rem; }\n<\/style>\n```\n**How `scoped` works:** the compiler adds a unique attribute to every element of this component (`data-v-7ba5bd90`) and rewrites each selector to include it (`.chat-item[data-v-7ba5bd90]`). Styles therefore can't leak to other components. Escape hatches: `:deep(.child)` (style inside a child component), `:slotted(.x)` (slot content), `:global(.x)` (a global rule from within scoped).\nOther Vue options: `<style lang=\"scss\">`, `<style module>` (CSS Modules, `$style.btn`), and `v-bind()` inside CSS (`color: v-bind(textColor)` links a reactive value to a CSS variable).\n\n## 11.2 Dynamic classes and conditional styling\n```html\n<div :class=\"{ active: isActive, 'is-error': hasError }\">\n<div :class=\"['msg', mine ? 'msg--mine' : 'msg--theirs']\">\n<div :style=\"{ width: progress + '%' }\">                  <!-- dynamic number \u2192 inline style or CSS variable -->\n<div :style=\"{ '--unread': unread }\">\n```\nPrefer toggling **classes** (design stays in CSS); use inline style only for values that come from data.\n\n## 11.3 How CSS is organised in a real Vue application \ud83c\udfed\n```\nsrc/\n  assets/styles/\n    tokens.css      /* variables: colours, spacing, radius, z-index scale, type scale */\n    reset.css       /* box-sizing, margin reset */\n    base.css        /* body, headings, links, form controls */\n    utilities.css   /* .sr-only, .container, .stack */\n    main.css        /* @import the files above; imported once in main.js */\n  components/base/  BaseButton.vue BaseInput.vue BaseModal.vue \u2026   (scoped styles, variants via props)\n  components/chat/  ChatItem.vue MessageBubble.vue \u2026\n  views/            ChatView.vue (layout of the page only)\n```\n**Layers of CSS:** global (tokens/reset/base) \u2192 shared components (design system) \u2192 feature components \u2192 page layout. **Reusable component design:** a `BaseButton` takes `variant=\"primary|danger|ghost\"` and `size=\"sm|md\"` props that map to modifier classes; all colours come from tokens, so a rebrand changes one file.\n```vue\n<script setup>defineProps({ variant: { type: String, default: 'primary' }, size: { type: String, default: 'md' } })<\/script>\n<template><button :class=\"['btn', `btn--${variant}`, `btn--${size}`]\"><slot /><\/button><\/template>\n```\n\n## 11.4 Debugging CSS with Chrome DevTools \ud83d\udfe1\n1. **Inspect** the element \u2192 **Styles** pane: matched rules, crossed-out (overridden) declarations, file:line.\n2. **Computed** pane: final values and the box-model diagram (hover to highlight margin/padding in the page).\n3. **Layout** pane: toggle Flexbox/Grid overlays; see track sizes.\n4. Force a state (`:hov` \u2192 `:hover`, `:focus`).\n5. Click the checkbox next to a declaration to disable it; edit values live (changes aren't saved: copy back to code).\n6. \"Why isn't my style applying?\" checklist: typo/invalid value (warning icon)? overridden by specificity? selector doesn't match (scoped attribute! different class)? parent `display` type? wrong media query? stacking/position context?\n7. Visual trick: `* { outline: 1px solid red; }` temporarily shows every box.\n\n## 11.5 Reflow, repaint and performance \ud83d\udd34\nThe rendering pipeline: **Style \u2192 Layout (reflow) \u2192 Paint \u2192 Composite.**\n| Changing | Work triggered |\n|---|---|\n| `width`, `height`, `margin`, `padding`, `top/left`, `font-size`, adding/removing DOM | **Layout** + Paint + Composite (expensive) |\n| `color`, `background`, `box-shadow`, `visibility` | Paint + Composite |\n| `transform`, `opacity` | **Composite only** (cheap) |\nTips: animate `transform/opacity`; avoid **layout thrashing** (alternating reading `offsetHeight` and writing styles in a loop forces repeated layout); keep the DOM small; `content-visibility: auto` for long off-screen lists; `will-change` only briefly; reduce unused CSS; inline small critical CSS; avoid `@import` chains; compress.\n\n## 11.6 Accessibility in CSS\n- **Contrast** \u2265 4.5:1 (normal text), 3:1 (large text, UI components). Don't use colour alone (error = icon + text + colour).\n- **Visible focus** always: `:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }`.\n- Respect `prefers-reduced-motion`; use `rem` so text scales; tap targets \u2265 44px; don't rely on `:hover`.\n- `.sr-only` for visually hidden but readable labels; never `display:none` a label that should be read.\n\n## 11.7 Cross-browser compatibility\nCheck MDN/caniuse tables; use **Autoprefixer** (PostCSS + browserslist) for vendor prefixes (`-webkit-`); progressive enhancement with `@supports (display: grid) { \u2026 }`; test Chrome, Safari (strictest: `100vh`, `gap`, date inputs, `backdrop-filter`), Firefox; normalise with a reset.\n\n## 11.8 Common mistakes (Module 11)\nForgetting `:deep()` for child components \u00b7 overusing inline styles \u00b7 global styles accidentally leaking from unscoped `<style>` \u00b7 hard-coded colours instead of tokens \u00b7 too-high `z-index` numbers instead of a scale \u00b7 `outline: none` \u00b7 animating layout.\n\n## 11.9 Interview Qs\n**Q1. How does `scoped` work?** (11.1). **Q2. Style a child component from the parent?** `:deep()`. **Q3. Reflow vs repaint?** (11.5). **Q4. How do you debug a style that isn't applying?** (11.4). **Q5. Where do you define theme colours?** tokens on `:root`, overridden per theme. **Q6. Global vs scoped CSS \u2014 when?** global: tokens/reset/base/utilities; scoped: component specifics.\n\n## 11.10 Exercises\n1. Convert your Seller Chat CSS into Vue components with scoped styles and `Base*` components.\n2. Create `BaseButton` with variants/sizes driven by props and tokens.\n3. Record a Performance profile of a `left` animation vs a `transform` animation and compare.\n\n## 11.11 Revision notes\n`scoped` = attribute selectors \u00b7 `:deep()` for children \u00b7 tokens in `:root` \u00b7 BEM + low specificity \u00b7 animate transform/opacity \u00b7 always visible focus \u00b7 DevTools Styles/Computed/Layout.\n\n## \u25b6 STYLE STEP 11 \u2014 final CSS organisation\nSplit your `styles.css` into `tokens.css`, `base.css`, `layout.css`, `components.css`; import them from a `main.css`. Then lint it by reading each file and asking \"does this belong globally, to a component, or to a page layout?\" You now have the complete HTML+CSS of Seller Chat, ready to be turned into Vue components in Part 6 and wired to a Spring Boot API in Parts 5\u20138.\n\n---\n## Part 2 \u2014 summary exercises (workbook = Module 51)\n1. Rebuild the Seller Chat page's CSS from memory.\n2. Make it work at 320px, 768px and 1440px, in light and dark.\n3. Run Lighthouse; reach \u2265 95 in accessibility and best practices.\n\n**Next \u2192 `03-js-1.md`: JavaScript from zero.**\n\n\n# PART 3 \u2014 JAVASCRIPT: COMPLETE BEGINNER TO ADVANCED\n\nTags: \ud83d\udfe2 Beginner \u00b7 \ud83d\udfe1 Intermediate \u00b7 \ud83d\udd34 Advanced \u00b7 \ud83c\udfed Production-level\n\n**How to run the examples:** open Chrome \u2192 press `Cmd+Option+J` (Mac) / `Ctrl+Shift+J` (Windows) to open the **Console**, paste code, press Enter. Or save a file `test.js` and run `node test.js`. Lines starting with `// \u2192` show the output.\n\n**Running project for this part:** you will write the **logic** of the Seller Chat app in plain JavaScript (data, functions, search, unread counts, sending messages, calling an API). Each module ends with a **CODE STEP** that adds to `chat-logic.js`. In Part 6 the same logic moves into Vue.\n\n---\n\n# MODULE 12 \u2014 PROGRAMMING AND JAVASCRIPT FUNDAMENTALS\n\n## 12.1 What is programming? \ud83d\udfe2\n**Programming** means writing **precise instructions** that a computer follows step by step.\n**Analogy: a recipe.** Ingredients are *data*, steps are *instructions*, the cook is the *computer*. The cook never guesses: \"add some salt\" would fail. Code must be exact.\nA **programming language** is the agreed vocabulary and grammar for writing those instructions. An **interpreter/engine** reads your code and carries it out.\n\n## 12.2 What is JavaScript and why does it exist? \ud83d\udfe2\nJavaScript (JS) is the programming language of the web browser. HTML builds the page, CSS styles it, **JavaScript makes it do things**: react to clicks, validate forms, fetch data from your Spring Boot API, and update the screen without reloading.\n- Created in 1995 by Brendan Eich at Netscape (in about ten days) so pages could be interactive.\n- **Not related to Java** (the name was marketing). Compare:\n\n| | Java (your backend) | JavaScript |\n|---|---|---|\n| Typing | static: `int x = 5;` | dynamic: `let x = 5; x = \"hi\"` is allowed |\n| Runs on | JVM | browser engine or Node.js |\n| Threads | many | **one** thread + event loop |\n| OOP | classes always | prototypes (classes are sugar) |\n| Missing value | `null` | `null` **and** `undefined` |\n| Compiled | to bytecode ahead of time | parsed/JIT-compiled at runtime |\n\n## 12.3 Where JavaScript runs \ud83d\udfe2\n| | In the browser | In Node.js |\n|---|---|---|\n| Used for | UI behaviour | tooling (Vite, npm, ESLint), servers |\n| Global object | `window` | `global` / `globalThis` |\n| Has | DOM (`document`), `fetch`, `localStorage`, events | `fs`, `http`, `process` |\n| Lacks | file system | DOM |\nYour company frontend runs in the browser; `npm run dev` runs Node tooling.\n\n## 12.4 Engines and ECMAScript \ud83d\udfe1\n- An **engine** executes JS: **V8** (Chrome, Node), SpiderMonkey (Firefox), JavaScriptCore (Safari).\n- V8 pipeline: source \u2192 parse \u2192 AST \u2192 **Ignition** (bytecode interpreter) \u2192 hot functions get compiled by **TurboFan** to optimised machine code (**JIT**, just-in-time).\n- **ECMAScript (ES)** is the official specification; JavaScript is its implementation. **ES6/ES2015** modernised the language (let/const, arrow functions, classes, modules, promises). New features arrive yearly (ES2020 `?.` and `??`, ES2022 private fields, ES2023 `toSorted`). Build tools (Vite/Babel) convert modern syntax for older browsers.\n\n## 12.5 How JavaScript executes \ud83d\udfe2\nTop to bottom, **one statement at a time**, on **one thread**. Each scope first registers its declarations (hoisting, Module 17), then runs line by line. Slow work blocks everything, which is why async code exists (Module 22).\n\n## 12.6 Variables \ud83d\udfe2\nA **variable** is a named box in memory that holds a value.\n```js\nlet age = 25          // declare and assign\nage = 26              // reassign: allowed with let\nconst PI = 3.14159    // constant binding\n// PI = 3             // \u274c TypeError: Assignment to constant variable.\n```\n**Declaration vs assignment:** `let age` creates the box; `= 25` puts a value in.\n| | `var` | `let` | `const` |\n|---|---|---|---|\n| Scope | function | block `{ }` | block |\n| Reassign | yes | yes | **no** |\n| Redeclare in same scope | yes | no | no |\n| Hoisting | initialised to `undefined` | in TDZ | in TDZ |\n| Use today | **avoid** (legacy code) | value changes | **default** |\n**`const` does not freeze objects**, it only stops re-pointing the variable:\n```js\nconst user = { name: 'Ravi' }\nuser.name = 'Asha'     // \u2705 the object is mutated\n// user = {}           // \u274c re-pointing is not allowed\n```\n**Naming:** `camelCase` for variables/functions (`unreadCount`), `PascalCase` for classes/components (`ChatItem`), `UPPER_SNAKE_CASE` for true constants (`MAX_LENGTH`). Names are case-sensitive, can't start with a digit, can't be reserved words. Booleans read like questions: `isLoading`, `hasError`, `canSend`.\n\n## 12.7 Data types \ud83d\udfe2\n**Primitives** (single values, immutable, copied by value): `string`, `number`, `boolean`, `undefined`, `null`, `bigint`, `symbol`.\n**Reference types** (stored by reference): objects, arrays, functions, dates, Map, Set.\n```js\ntypeof 'hi'          // \u2192 'string'\ntypeof 42            // \u2192 'number'\ntypeof true          // \u2192 'boolean'\ntypeof undefined     // \u2192 'undefined'\ntypeof null          // \u2192 'object'     \u2190 historic bug; test with value === null\ntypeof 10n           // \u2192 'bigint'\ntypeof Symbol()      // \u2192 'symbol'\ntypeof {}            // \u2192 'object'\ntypeof []            // \u2192 'object'     \u2190 use Array.isArray(x)\ntypeof function(){}  // \u2192 'function'\n```\n| Type | Notes |\n|---|---|\n| String | `'a'` `\"a\"` `` `a` `` ; immutable; `'abc'.length // 3`; index `'abc'[0] // 'a'` |\n| Number | one 64-bit float for integers and decimals; `NaN`, `Infinity`; safe integer limit `Number.MAX_SAFE_INTEGER` = 2\u2075\u00b3\u22121 |\n| Boolean | `true` / `false` |\n| undefined | \"declared but no value\" (JS sets it) |\n| null | \"intentionally empty\" (you set it) |\n| BigInt | huge integers: `12345678901234567890n` |\n| Symbol | unique identifier, used for hidden/non-clashing keys |\n**Real-world trap:** a Java `Long` id like `9007199254740993` is larger than JS can represent exactly; `JSON.parse` silently rounds it. Backends often send big ids as **strings**.\n**Money:** `0.1 + 0.2 === 0.30000000000000004` (binary floating point). Store money as integer paise/cents (\u20b912.50 \u2192 `1250`) and format for display.\n\n### Value vs reference (the root of many bugs)\n```js\nlet a = 5\nlet b = a      // copy of the VALUE\nb = 10\nconsole.log(a, b)           // \u2192 5 10\n\nconst o1 = { count: 1 }\nconst o2 = o1               // copy of the ADDRESS, not the object\no2.count = 99\nconsole.log(o1.count)       // \u2192 99   (same object)\nconsole.log({} === {})      // \u2192 false (two different objects)\n```\n```\n let a = 5            a \u2500\u25ba [5]        b \u2500\u25ba [10]          (primitives live in the variable)\n const o1 = {\u2026}       o1 \u2500\u2500\u2510\n const o2 = o1        o2 \u2500\u2500\u2534\u2500\u2500\u25ba { count: 99 }            (both point to ONE object in memory)\n```\nThis is why \"I changed the copy and the original changed\" happens in Vue/Pinia state. Fix: copy properly (Module 16).\n\n## 12.8 Type conversion and coercion \ud83d\udfe1\n**Conversion** = you convert explicitly. **Coercion** = JS converts implicitly.\n```js\nNumber('42')        // \u2192 42        Number('')   // \u2192 0       Number('abc') // \u2192 NaN\nNumber(null)        // \u2192 0         Number(undefined) // \u2192 NaN\nparseInt('42px')    // \u2192 42        parseFloat('3.5kg') // \u2192 3.5\nString(123)         // \u2192 '123'     (123).toString()  // \u2192 '123'\nBoolean('')         // \u2192 false     Boolean('0') // \u2192 true\n+'5'                // \u2192 5         (unary plus converts to number)\n\n'5' + 3             // \u2192 '53'   + with a string concatenates\n'5' - 3             // \u2192 2      - * / force numbers\n'5' * '2'           // \u2192 10\ntrue + 1            // \u2192 2\n[] + {}             // \u2192 '[object Object]'\n```\n**Why:** `+` is overloaded (add or join strings); the other arithmetic operators always convert to numbers.\n**Real bug:** `input.value` is **always a string**: `'10' + '5'` is `'105'`. Convert first: `Number(input.value)`.\nCheck for NaN with `Number.isNaN(x)` (because `NaN === NaN` is false).\n\n## 12.9 Operators \ud83d\udfe2\n```js\n// arithmetic\n7 + 2   7 - 2   7 * 2   7 / 2 // 3.5   7 % 2 // 1 (remainder)   2 ** 3 // 8\nlet i = 0; i++; ++i; i--     // increment / decrement\n// assignment\nx = 5; x += 2; x -= 1; x *= 3; x /= 2; x ||= 1; x &&= 2; x ??= 3\n// comparison\n5 == '5'     // true  (loose, coerces) \u2190 avoid\n5 === '5'    // false (strict)         \u2190 always use\n5 !== '5'    5 > 3    5 >= 5\n// logical\ntrue && false   true || false   !true\n```\n**Always use `===` / `!==`.** The loose-equality rules (`0 == false`, `'' == false`, `null == undefined`) are impossible to remember reliably.\n\n### Ternary operator\n```js\nconst label = unread > 0 ? `${unread} new` : 'No new messages'\n```\n`condition ? valueIfTrue : valueIfFalse` is an **expression** (it produces a value), so it works inside templates and function arguments.\n\n### Nullish coalescing `??` and optional chaining `?.` \ud83d\udfe1\n```js\nconst name = user.nickname ?? 'Guest'    // fallback only for null/undefined\nconst n2   = user.nickname || 'Guest'    // fallback for ANY falsy value ('' , 0, false)\n\nconst city = user?.address?.city         // undefined instead of crashing if user/address is missing\nuser.getName?.()                         // call only if the method exists\nconst first = list?.[0]\n```\n`count || 10` turns a real `0` into 10; `count ?? 10` keeps `0`.\n**Why `?.` matters:** API data is often incomplete. Without it you get `TypeError: Cannot read properties of undefined (reading 'city')`, the most common frontend runtime error.\n\n### Template literals\n```js\nconst name = 'Ravi', n = 3\nconsole.log(`Hello ${name}, you have ${n * 2} messages`)   // \u2192 Hello Ravi, you have 6 messages\nconst html = `\n  <li>${name}<\/li>`                                         // multi-line strings\n```\n\n## 12.10 Common mistakes (Module 12)\n| Mistake | Why | Fix |\n|---|---|---|\n| `==` | coercion surprises | `===` |\n| thinking `const` makes objects immutable | only the binding is constant | `Object.freeze` / copy |\n| string/number mix-up from inputs | `.value` is a string | `Number()` |\n| float money maths | `0.1 + 0.2` | integer minor units |\n| `typeof x === 'object'` for null/array | both are 'object' | `x === null`, `Array.isArray` |\n| using `var` | hoisting/scope surprises | `let`/`const` |\n| `||` default with 0/'' | falsy values replaced | `??` |\n\n## 12.11 Interview questions (Module 12)\n**Q1. var vs let vs const?** (12.6 table; mention scope, hoisting/TDZ, reassignment).\n**Q2. `==` vs `===`?** Loose compares after coercion; strict compares type and value.\n**Q3. null vs undefined?** `undefined` = not assigned/missing; `null` = deliberate empty. `null == undefined` is true; `===` false.\n**Q4. What does `typeof null` return?** `'object'`: a historic bug preserved for compatibility.\n**Q5. `??` vs `||`?** `??` only for null/undefined; `||` for all falsy values.\n**Q6. Primitive vs reference copy?** value is copied vs address is copied.\n**Q7. Output?** `console.log(1 + '2' + 3)` \u2192 `'123'`; `console.log(1 + 2 + '3')` \u2192 `'33'` (left to right).\n\n## 12.12 Exercises (Module 12)\n1. Predict then verify: `[] == false`, `null == 0`, `null >= 0`, `'b' + 'a' + +'a' + 'a'`.\n2. Write code that converts the string `'\u20b91,299'` to the number `1299`.\n3. Use `?.` and `??` to read `order.buyer.address.pincode` safely with fallback `'N/A'`.\n4. Show with code that copying an object with `=` does not create a copy.\n\n## 12.13 Revision notes\nJS = browser language, single thread \u00b7 `const` by default \u00b7 7 primitives, rest are objects \u00b7 `===` always \u00b7 `.value` is a string \u00b7 `?.` and `??` for API data \u00b7 primitives copy values, objects copy references.\n\n## \u25b6 CODE STEP 12 \u2014 the chat data\nCreate `chat-logic.js` and start with the data a backend would send:\n```js\nconst chats = [\n  { id: 1, buyerName: 'Ravi',  lastMessage: 'Is the red sneaker available?', unread: 2, status: 'OPEN',   lastMessageAt: '2026-10-30T09:12:00Z' },\n  { id: 2, buyerName: 'Asha',  lastMessage: 'Thanks, received!',             unread: 0, status: 'CLOSED', lastMessageAt: '2026-10-29T18:40:00Z' },\n  { id: 3, buyerName: 'Meena', lastMessage: 'Please send the price',         unread: 1, status: 'OPEN',   lastMessageAt: '2026-10-30T08:05:00Z' },\n]\nconst label = (chat) => chat.unread > 0 ? `${chat.unread} new` : 'No new messages'\nconsole.log(chats[0].buyerName, '-', label(chats[0]))   // \u2192 Ravi - 2 new\n```\n\n---\n\n# MODULE 13 \u2014 CONTROL FLOW AND LOOPS\n\n## 13.1 Truthy and falsy \ud83d\udfe2\nConditions convert any value to true/false. The **only falsy values** are: `false, 0, -0, 0n, '', null, undefined, NaN`. **Everything else is truthy**, including `'0'`, `'false'`, `[]`, `{}`.\n```js\nif ([]) console.log('an empty array is truthy')      // prints!\nif (list.length) { /* check length to test \"has items\" */ }\n```\n\n## 13.2 if / else if / else \ud83d\udfe2\n```js\nfunction stockLabel(qty) {\n  if (qty === 0) return 'Out of stock'\n  else if (qty < 5) return 'Low stock'\n  else return 'In stock'\n}\nstockLabel(3)   // \u2192 'Low stock'\n```\n**Flow:** the first true condition runs; the rest are skipped. Prefer **early returns** (guard clauses) over deep nesting:\n```js\nfunction send(text) {\n  if (!text) return                 // guard 1\n  if (text.trim() === '') return    // guard 2\n  postMessage(text)                 // the main path stays flat and readable\n}\n```\n\n## 13.3 switch \ud83d\udfe2\n```js\nswitch (order.status) {\n  case 'PENDING':   label = 'Awaiting payment'; break\n  case 'SHIPPED':\n  case 'DELIVERED': label = 'On its way or done'; break    // two cases share code\n  default:          label = 'Unknown'\n}\n```\n**Without `break` it falls through** to the next case. Often a lookup object is cleaner: `const LABELS = { PENDING: 'Awaiting payment' }; LABELS[order.status] ?? 'Unknown'`.\n\n## 13.4 Loops \ud83d\udfe2\n```js\nfor (let i = 0; i < 3; i++) console.log(i)        // \u2192 0 1 2\n//   init ; condition (before each pass) ; update (after each pass)\n\nlet n = 3\nwhile (n > 0) { console.log(n); n-- }              // \u2192 3 2 1   (checks first)\ndo { console.log('runs at least once') } while (false)\n\nfor (const chat of chats) console.log(chat.buyerName)   // for...of: VALUES of an iterable (arrays, strings, Map, Set)\nfor (const key in user) console.log(key, user[key])     // for...in: enumerable KEYS of an object (not for arrays)\n```\n`break` exits the whole loop; `continue` skips to the next iteration. A labelled break exits nested loops: `outer: for (\u2026) { for (\u2026) { if (x) break outer } }`.\n**Infinite loops** (`while (true)` with no exit) freeze the tab because the single thread never gets free.\nIn everyday code you'll use array methods (`map`, `filter`) far more than manual loops (Module 15).\n\n## 13.5 Short-circuit evaluation \ud83d\udfe1\n`&&` returns the first falsy operand (or the last); `||` returns the first truthy (or the last). Evaluation **stops early**.\n```js\nisAdmin && showPanel()            // call only if true\nconst port = config.port || 3000  // default\nconst user2 = user && user.name   // guard\n```\nIn Vue templates the same idea appears as `v-if=\"user && user.isAdmin\"`.\n\n## 13.6 Common mistakes\n`if (x = 5)` (assignment instead of comparison) \u00b7 missing `break` \u00b7 `for...in` on arrays \u00b7 off-by-one (`<=` vs `<`) \u00b7 modifying an array while looping it \u00b7 `forEach` can't `break`.\n\n## 13.7 Interview questions\n**Q1. List the falsy values.** (8 above). **Q2. `for...of` vs `for...in`?** values of iterables vs enumerable keys. **Q3. What does `a || b` return?** the first truthy operand, not necessarily a boolean. **Q4. Output?** `console.log(0 || 'x', 0 ?? 'x', '' && 'y')` \u2192 `x 0 ''`.\n\n## 13.8 Exercises\nFizzBuzz 1\u2013100 \u00b7 print a multiplication table \u00b7 find the first negative number using `break` \u00b7 sum the digits of a number with `while` \u00b7 count vowels in a string.\n\n## \u25b6 CODE STEP 13\n```js\nfunction statusBadge(chat) {\n  if (chat.status === 'CLOSED') return 'closed'\n  if (chat.unread > 0) return 'unread'\n  return 'open'\n}\nfor (const chat of chats) console.log(chat.buyerName, statusBadge(chat))\n// \u2192 Ravi unread / Asha closed / Meena unread\n```\n\n---\n\n# MODULE 14 \u2014 FUNCTIONS\n\n## 14.1 What is a function and why? \ud83d\udfe2\nA **function** is a named, reusable block of code: you give it **inputs** (parameters), it does work and may give back an **output** (return value).\n**Why:** avoid repeating code (DRY: Don't Repeat Yourself), give names to ideas, test pieces separately, and let other code reuse them.\n**Analogy:** a coffee machine: beans and water in, coffee out. You don't need to know the inside to use it.\n\n## 14.2 Three ways to write a function \ud83d\udfe2\n```js\n// 1. Declaration: hoisted (callable before it appears in the file)\nfunction add(a, b) { return a + b }\n\n// 2. Expression: stored in a variable (exists only after that line)\nconst add2 = function (a, b) { return a + b }\n\n// 3. Arrow function (ES6)\nconst add3 = (a, b) => a + b          // implicit return (no braces)\nconst square = x => x * x             // one parameter: parentheses optional\nconst makeUser = name => ({ name })   // returning an object literal needs ( )\nconst log = () => { console.log('hi') }   // with braces you must write `return`\n```\n**Call** a function by adding parentheses: `add(2, 3) // \u2192 5`. Passing a function **without** parentheses passes the function itself: `button.addEventListener('click', handleClick)`. Writing `handleClick()` would call it immediately.\nArrow functions differ: no own `this`, no `arguments`, can't be used with `new` (Module 19). Use arrows for short callbacks; declarations or methods when you need hoisting or `this`.\n\n## 14.3 Parameters, arguments, defaults, rest, spread \ud83d\udfe2\n- **Parameter**: variable in the definition. **Argument**: the actual value passed in.\n```js\nfunction greet(name = 'Guest', punctuation = '!') {\n  return `Hello ${name}${punctuation}`\n}\ngreet()                 // \u2192 'Hello Guest!'\ngreet('Ravi', '.')      // \u2192 'Hello Ravi.'\ngreet(undefined, '?')   // \u2192 'Hello Guest?'   defaults apply for undefined (not for null)\n\nfunction sum(...nums) { return nums.reduce((t, n) => t + n, 0) }   // rest: gather extra args into an array\nsum(1, 2, 3)            // \u2192 6\n\nconst parts = [1, 2, 3]\nMath.max(...parts)      // spread: expand an array into separate arguments \u2192 3\nconst copy = [...parts, 4]            // new array\nconst merged = { ...a, ...b }         // objects: later keys win\n```\nJS does not check argument counts: extras are ignored, missing ones become `undefined`.\n**Options-object pattern** (very common):\n```js\nfunction createUser({ name, role = 'seller', active = true } = {}) { return { name, role, active } }\ncreateUser({ name: 'Ravi' })   // \u2192 { name: 'Ravi', role: 'seller', active: true }\n```\nObjects are passed **by sharing**: a function that mutates an object parameter mutates the caller's object.\n\n## 14.4 Return values \ud83d\udfe2\nNo `return` \u2192 returns `undefined`. Code after `return` never runs. Return several values by wrapping: `return { ok: true, data }`.\n**Trap:** `return` followed by a line break returns `undefined` (automatic semicolon):\n```js\nreturn\n  { ok: true }        // \u274c never reached\nreturn { ok: true }   // \u2705 keep the value on the same line\n```\n\n## 14.5 Callbacks and higher-order functions \ud83d\udfe1\nFunctions are **values**: store them, pass them, return them.\n- **Callback:** a function passed to another function to be called later.\n- **Higher-or
