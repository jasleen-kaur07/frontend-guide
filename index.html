.chats__list{display:block}.is-room .chats__list{display:none}.chats:not(.is-room) .chats__room{display:none}}\n@media (min-width:768px){.chats{grid-template-columns:320px 1fr}}\n<\/style>\n```\n**Unread tab title:** `watch(unreadTotal, n => (document.title = n ? `(${n}) Seller Chat` : 'Seller Chat'))`. **Keyboard shortcuts:** `/` focuses search, `Esc` closes the modal, `Ctrl+Enter` sends. **Monitoring:** `app.config.errorHandler` + `window 'unhandledrejection'` \u2192 `reportError({ message, release, route, requestId })`, with no tokens or message bodies.\n**API integration:** Spring `ChatController`/`MessageController`/`OrderController`; WebSocket (STOMP or raw) fed by Kafka consumers; Redis for unread counters and presence; Firestore/RTDB if your company fans out realtime that way (the frontend contract stays the same behind `chatApi`).\n**Tests:** store (optimistic send, failed \u2192 retry, dedupe by `clientId`, resync appends exactly once, unread increments only for inactive chats) \u00b7 components (`MessageComposer`, `MessageBubble`, `OrderCard`, `AttachOrderModal`) \u00b7 composables (`useInfiniteHistory` with a fake IntersectionObserver; `useRealtime` backoff) \u00b7 E2E (login \u2192 search \u2192 open \u2192 send \u2192 attach) \u00b7 contract test running the same suite against mock and real service.\n**Performance:** virtualise very long threads, `shallowRef` for huge arrays, throttle unread updates, lazy-load the modal/orders, lazy images, **verify cleanup** (heap snapshot after navigating 10 times).\n**Documentation deliverables:** README (run, env vars, architecture diagram, decisions) \u00b7 API contract note \u00b7 \"How a message travels\" sequence diagram \u00b7 known limitations.\n**Common mistakes:** duplicate bubbles after reconnect \u00b7 losing scroll position when prepending \u00b7 counting unread for the open chat \u00b7 no cleanup for the socket \u00b7 optimistic bubble never reconciled \u00b7 exposing tokens in logs.\n**Final evaluation (50 pts):** features/flows 12 \u00b7 architecture & code quality 10 \u00b7 state/data-flow clarity 6 \u00b7 error/edge handling 6 \u00b7 UX/responsive/a11y 6 \u00b7 tests 5 \u00b7 performance & cleanup 5. **Explain-it test:** walk a mentor through one message's journey and any function in the project, line by line.\n\n---\n## Project progression map\n```\nP1 DOM + CSS + fetch  \u2192  P2 Vue + CRUD + pagination  \u2192  P3 Router + Pinia + persistence + checkout\n   \u2192  P4 RBAC + realtime + charts + generic components  \u2192  P5 production chat (everything together)\n```\n**Portfolio tip:** pin P2, P3 and P5 on GitHub with screenshots, a live demo link and a short \"what I'd improve\" section. That section shows maturity.\n\n**Next \u2192 Part 12: Revision (cheat sheets + job-readiness checklist, Modules 56\u201357).**\n\n\n# PART 12 \u2014 REVISION AND JOB READINESS\n\n# MODULE 56 \u2014 COMPLETE FRONTEND CHEAT SHEETS\n\n## 56.1 HTML\n| Need | Syntax |\n|---|---|\n| Skeleton | `<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>\u2026<\/title><\/head><body>\u2026<\/body><\/html>` |\n| Semantic | `header nav main section article aside footer figure details dialog` |\n| Text | `h1\u2013h6 p strong em mark code pre time blockquote` |\n| Link/image | `<a href target=\"_blank\" rel=\"noopener\">` `<img src alt width height loading=\"lazy\" srcset sizes>` |\n| List/table | `ul ol li dl` \u00b7 `table thead tbody tr th td caption` |\n| Form | `<form action method><label for><input id name type required minlength pattern min max><select><option><textarea><button type>` |\n| Types | `text email password number tel url search date time range color file checkbox radio hidden` |\n| Scripts | `<script src defer>` \u00b7 `async` \u00b7 `type=\"module\"` |\n| Attrs | `id class data-* aria-* role hidden tabindex lang` |\n| Entities | `&lt; &gt; &amp; &quot; &nbsp;` |\n\n## 56.2 CSS\n```css\n/* Selectors */ * p .c #i [a=b] a b  a>b  a+b  a~b  a:hover  a:not(.x)  li:nth-child(2n)  a::after  .c:has(img)\n/* Box */ box-sizing:border-box; margin:0 auto; padding:1rem; border:1px solid; border-radius:8px; overflow:auto;\n/* Display */ display:block|inline|inline-block|none|flex|grid\n/* Flex */ display:flex; flex-direction:row|column; justify-content:center|space-between; align-items:center; gap:1rem; flex-wrap:wrap; flex:1; min-width:0;\n/* Grid */ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; grid-column:span 2; place-items:center; grid-template-areas:\"h h\" \"s m\";\n/* Position */ position:relative|absolute|fixed|sticky; inset:0; top:0; z-index:10;\n/* Units */ px rem em % vw vh dvh ch fr ; clamp(1rem,2vw,2rem) min() max() calc()\n/* Responsive */ @media (min-width:768px){\u2026} @container (min-width:400px){\u2026} @media (prefers-color-scheme:dark){\u2026} @media (prefers-reduced-motion:reduce){\u2026}\n/* Vars */ :root{--brand:#0b6e75} .a{color:var(--brand,#000)}\n/* Animation */ transition:transform .2s ease; @keyframes x{to{opacity:1}} animation:x 1s infinite; transform:translate() rotate() scale();\n/* Text */ font:400 1rem/1.5 system-ui; text-overflow:ellipsis; white-space:nowrap; overflow-wrap:anywhere;\n```\nSpecificity: inline > #id > .class/[attr]/:pseudo > element. Equal \u2192 later wins.\nVue: `<style scoped>` \u00b7 `:deep(.x)` \u00b7 `:slotted()` \u00b7 `:global()` \u00b7 `v-bind(color)` in CSS.\n\n## 56.3 JavaScript\n```js\n// Variables/types      const let ; typeof ; === ; ?. ; ?? ; `${x}` ; Number() String() Boolean() ; Number.isNaN\n// Functions            function f(a=1,...r){} ; const f=(a)=>a*2 ; (()=>{})() ; f.call(t,a) f.apply(t,[a]) f.bind(t)\n// Destructure/spread   const {a,b:c=1,...rest}=o ; const [x,,z]=arr ; {...o,k:v} ; [...a,...b]\n// Control              if/else ; switch ; for ; for(const x of arr) ; for(const k in obj) ; while ; break ; continue\n// Classes              class A extends B{ #p=1; static s; constructor(){super()} get x(){} method(){} }\n// Modules              export const a ; export default fn ; import fn,{a as b} from './x.js' ; await import('./x.js')\n// Misc                 structuredClone(o) ; Object.hasOwn(o,k) ; arr.at(-1) ; new Set(arr) ; new Map() ; Intl.NumberFormat\n```\n## 56.4 Array methods\n| Method | Mutates | Returns | Example |\n|---|---|---|---|\n| `push/pop` | \u2705 | length/removed | `a.push(x)` |\n| `unshift/shift` | \u2705 | length/removed | |\n| `splice(i,n,...x)` | \u2705 | removed[] | `a.splice(1,1)` |\n| `sort(cmp)` `reverse` | \u2705 | same array | `a.sort((x,y)=>x-y)` |\n| `slice(s,e)` | \u274c | copy | `a.slice(0,3)` |\n| `concat` `flat` `flatMap` | \u274c | new array | |\n| `map(fn)` | \u274c | new (same length) | `a.map(x=>x*2)` |\n| `filter(fn)` | \u274c | new (subset) | `a.filter(x=>x>1)` |\n| `reduce(fn,init)` | \u274c | single value | `a.reduce((s,x)=>s+x,0)` |\n| `find` `findIndex` `findLast` | \u274c | element/index | |\n| `some` `every` `includes` `indexOf` | \u274c | boolean/index | |\n| `join(sep)` | \u274c | string | |\n| `forEach` | \u274c | undefined | side effects only |\n| `toSorted` `toReversed` `with` `toSpliced` | \u274c | new array | immutable twins |\n| `Array.from` `Array.isArray` `Array.of` | \u2014 | | `Array.from({length:3},(_,i)=>i)` |\n\n## 56.5 Object methods\n`Object.keys/values/entries(o)` \u00b7 `Object.fromEntries(e)` \u00b7 `Object.assign(t,...s)` \u00b7 `Object.freeze/seal/isFrozen` \u00b7 `Object.create(proto)` \u00b7 `Object.getPrototypeOf` \u00b7 `Object.defineProperty(o,k,desc)` \u00b7 `Object.hasOwn(o,k)` \u00b7 `JSON.stringify/parse` \u00b7 `structuredClone`.\n\n## 56.6 Async cheat sheet\n```js\nconst p = new Promise((res, rej) => \u2026)      p.then(v=>\u2026).catch(e=>\u2026).finally(()=>\u2026)\nawait Promise.all([a,b])        // all succeed, parallel, rejects on first failure\nawait Promise.allSettled([a,b]) // [{status,value|reason}]\nawait Promise.race([a,b])       // first settled\nawait Promise.any([a,b])        // first fulfilled\nasync function f(){ try{ const x=await g() }catch(e){} finally{} }\nconst c=new AbortController(); fetch(url,{signal:c.signal}); c.abort(); AbortSignal.timeout(5000)\nsetTimeout(fn,ms) clearTimeout ; setInterval clearInterval ; queueMicrotask(fn) ; requestAnimationFrame(fn)\n```\nEvent loop order: **sync \u2192 all microtasks (promises/await) \u2192 render \u2192 one macrotask (timers/events) \u2192 repeat.**\n\n## 56.7 DOM\n```js\ndocument.getElementById(id)  querySelector(sel)  querySelectorAll(sel)  el.closest(sel)  el.matches(sel)\nel.textContent  el.innerHTML(\u26a0)  el.value  el.checked  el.dataset.fooBar  el.getAttribute/setAttribute/removeAttribute\nel.classList.add/remove/toggle/contains  el.style.prop  getComputedStyle(el)\ndocument.createElement('div')  parent.append/prepend/before/after  el.remove()  el.replaceWith(n)  parent.replaceChildren(...n)  el.cloneNode(true)\nel.addEventListener('click', fn, {once, passive, capture, signal})  el.removeEventListener  e.preventDefault()  e.stopPropagation()  e.target  e.currentTarget\nel.dispatchEvent(new CustomEvent('x',{detail,bubbles:true}))\n```\n\n## 56.8 Browser APIs\n`fetch` \u00b7 `FormData` \u00b7 `URL`/`URLSearchParams` \u00b7 `localStorage/sessionStorage` (strings; JSON) \u00b7 `document.cookie` \u00b7 `history.pushState` \u00b7 `navigator.clipboard.writeText` \u00b7 `navigator.geolocation` \u00b7 `File/FileReader/URL.createObjectURL` \u00b7 `WebSocket` \u00b7 `EventSource` \u00b7 `Worker` \u00b7 `IntersectionObserver` \u00b7 `ResizeObserver` \u00b7 `Notification` \u00b7 `AbortController` \u00b7 `structuredClone`.\n\n## 56.9 Vue directives\n| Directive | Use |\n|---|---|\n| `{{ }}` | text interpolation (escaped) |\n| `:attr` / `v-bind` | bind attribute/prop; `:class` `:style` |\n| `@event` / `v-on` | handler; `.prevent .stop .once .self .enter .ctrl` |\n| `v-if / v-else-if / v-else` | conditional render (creates/destroys) |\n| `v-show` | toggle display |\n| `v-for=\"x in list\" :key=\"x.id\"` | list render (stable key) |\n| `v-model` | two-way; `.trim .number .lazy` |\n| `v-html` | raw HTML (\u26a0 XSS) |\n| `v-slot` / `#name` | slots; scoped `#default=\"{ item }\"` |\n| `v-once` `v-memo` `v-pre` `v-cloak` | perf/compile control |\n\n## 56.10 Vue Composition API\n```js\nimport { ref, reactive, computed, watch, watchEffect, toRef, toRefs, unref, toValue, shallowRef, readonly, nextTick, provide, inject, onMounted, onUnmounted } from 'vue'\nconst n = ref(0); n.value++                        // ref\nconst s = reactive({ a: 1 })                       // reactive object\nconst d = computed(() => n.value * 2)              // cached derived\nwatch(n, (nv, ov) => {}, { immediate: true, deep: true, flush: 'post' })\nwatch(() => s.a, v => {})                          // getter source\nwatchEffect(onCleanup => { /* auto-track */ })\nconst { a } = toRefs(s)                            // keep reactivity when destructuring\nawait nextTick()                                   // after DOM flush\nconst props = defineProps({ x: { type: Number, default: 0 } })\nconst emit = defineEmits(['change']); emit('change', v)\nconst model = defineModel()                        // v-model on component\ndefineExpose({ focus })                            // template ref API\n```\n## 56.11 Lifecycle hooks\n| Phase | Composition | Options |\n|---|---|---|\n| init | `setup()` / script | `beforeCreate/created` |\n| before DOM | `onBeforeMount` | `beforeMount` |\n| DOM ready | **`onMounted`** | `mounted` |\n| before/after update | `onBeforeUpdate / onUpdated` | `beforeUpdate / updated` |\n| teardown | `onBeforeUnmount / **onUnmounted**` | `beforeUnmount / unmounted` |\n| errors | `onErrorCaptured` | `errorCaptured` |\n| KeepAlive | `onActivated / onDeactivated` | `activated / deactivated` |\n\n## 56.12 Props & emits\n```vue\n<Child title=\"x\" :count=\"5\" :user=\"u\" v-model=\"val\" v-model:open=\"show\" @save=\"onSave\" @update:open=\"show=$event\" />\n<script setup>\nconst props = defineProps({ title: String, user: { type: Object, default: () => ({}) } })\nconst emit = defineEmits(['save'])\n<\/script>\n```\nRules: props down, events up; never mutate props; object defaults are factories; non-string props need `:`.\n\n## 56.13 Pinia\n```js\nexport const useXStore = defineStore('x', () => { const a = ref(0); const dbl = computed(() => a.value*2); function inc(){ a.value++ } return { a, dbl, inc } })\nconst store = useXStore(); const { a, dbl } = storeToRefs(store); const { inc } = store\nstore.$patch({ a: 5 }); store.$subscribe((mut, state) => {}); store.$reset()   // $reset: option stores only\n```\n## 56.14 Vue Router\n```js\ncreateRouter({ history: createWebHistory(), routes: [{ path:'/u/:id', name:'user', component:()=>import('./U.vue'), props:true, meta:{requiresAuth:true}, children:[] }, { path:'/:pathMatch(.*)*', component:NotFound }] })\nrouter.beforeEach((to,from)=>{ if(to.meta.requiresAuth && !auth.ok) return { name:'login', query:{ redirect: to.fullPath } } })\nconst route=useRoute(); route.params.id; route.query.q ; const router=useRouter(); router.push({name:'user',params:{id:1},query:{tab:'a'}}); router.replace(...)\n<RouterLink :to=\"{name:'user',params:{id:1}}\">  <RouterView />\n```\n## 56.15 Fetch\n```js\nconst res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${t}`}, body: JSON.stringify(data), signal })\nif (!res.ok) throw new Error(`HTTP ${res.status}`)\nconst data = await res.json()        // body readable once\n```\nStatus groups: 2xx ok (200, 201, 204) \u00b7 3xx redirect \u00b7 400 bad request \u00b7 401 unauthenticated \u00b7 403 forbidden \u00b7 404 not found \u00b7 409 conflict \u00b7 422 validation \u00b7 429 too many \u00b7 5xx server.\n\n## 56.16 Chrome DevTools\n| Panel | Use |\n|---|---|\n| Elements | live DOM, edit CSS, box model, `:hov`, Layout (flex/grid overlays) |\n| Console | logs/errors, run JS, `$0` selected element, `console.table`, filter |\n| Sources | breakpoints, step (F8/F10/F11), scope, call stack, watch, logpoints, XHR/event breakpoints |\n| Network | request/response/headers/payload/timing, throttling, preserve log, copy as cURL |\n| Application | storage, cookies, service workers, cache |\n| Performance | record flame chart, long tasks |\n| Memory | heap snapshots (leaks) |\n| Lighthouse | perf/a11y/SEO audits |\n| Vue DevTools | components, props/state, Pinia, router, timeline |\nShortcuts: `Cmd+Opt+I` open \u00b7 `Cmd+Shift+C` inspect \u00b7 `Cmd+Shift+M` device mode \u00b7 `Cmd+P` open file \u00b7 `Cmd+Shift+P` commands.\n\n## 56.17 Axios and API service layer (Modules 29\u201330, 41)\n```js\nconst http = axios.create({ baseURL: import.meta.env.VITE_API_BASE_URL, timeout: 10000 })\nhttp.interceptors.request.use(cfg => { cfg.headers.Authorization = `Bearer ${token}`; cfg.headers['X-Request-Id'] = crypto.randomUUID(); return cfg })\nhttp.interceptors.response.use(r => r.data, e => Promise.reject({ status: e.response?.status ?? 0, message: e.response?.data?.message ?? 'Network error', body: e.response?.data, canceled: axios.isCancel(e) }))\nhttp.get('/chats', { params: { q, page }, signal }) ; http.post('/chats/1/messages', { text }) ; http.delete(`/orders/${id}`)\n```\n| | `fetch` | Axios |\n|---|---|---|\n| Non-2xx | resolves (check `res.ok`) | **rejects** |\n| JSON | `await res.json()` | automatic (`.data`) |\n| Interceptors / timeout | write a wrapper / `AbortSignal.timeout` | built in |\nEnv: `VITE_*` only (public, baked at build). Dev proxy: `server.proxy['/api'] \u2192 http://localhost:8080`.\n\n## 56.18 Vue 2 / Options API / Vuex (Module 58)\n| Vue 2 / Options | Vue 3 Composition |\n|---|---|\n| `data() { return { n: 0 } }` | `const n = ref(0)` |\n| `computed: { d() {} }` | `const d = computed(() => \u2026)` |\n| `watch: { n(v) {} }` | `watch(n, v => {})` |\n| `methods: { f() {} }` | `function f() {}` |\n| `mounted()` / `beforeDestroy()` / `destroyed()` | `onMounted` / `onBeforeUnmount` / `onUnmounted` |\n| `this.$emit('x')` / `this.$refs.r` / `this.$router` | `emit('x')` / template ref / `useRouter()` |\n| `mixins: [m]` | composable |\n| `this.$set(o,'k',v)` | not needed (Proxy) |\n| `new Vue({ router, store })` | `createApp(App).use(router).use(pinia)` |\n```\nVuex flow:  component \u2500dispatch\u2192 action \u2500commit\u2192 mutation(sync) \u2192 state \u2192 getters \u2192 render\nthis.$store.state.chat.chats \u00b7 this.$store.getters['chat/unread'] \u00b7 this.$store.commit('chat/SET', x) \u00b7 await this.$store.dispatch('chat/fetch')\nmapState / mapGetters (computed) \u00b7 mapMutations / mapActions (methods)\n```\nArrow function in `methods` breaks `this` \u00b7 `data` must be a function \u00b7 find a mixin's origin by searching the property name.\n\n## 56.19 TypeScript for Vue (Module 60)\n```ts\ntype Sender = 'BUYER' | 'SELLER' ; interface Msg { id: number; text: string; sender: Sender; order?: Order | null }\nconst ids: number[] = [] ; const pair: [string, number] = ['a', 1] ; function first<T>(a: T[]): T | undefined { return a[0] }\nPartial<T> Pick<T,'a'> Omit<T,'a'> Record<string,number> ReturnType<typeof f> Readonly<T>\nconst props = defineProps<{ chat: Chat; active?: boolean }>() ; const emit = defineEmits<{ select: [id: number] }>()\nconst chats = ref<Chat[]>([]) ; const el = ref<HTMLInputElement | null>(null) ; http.get<Page<Chat>>('/chats')\n```\n`any` = checking off \u00b7 `unknown` = must check first \u00b7 `as` = you promise (use sparingly) \u00b7 types are erased at runtime (validate API data, e.g. Zod) \u00b7 `vue-tsc --noEmit` in CI \u00b7 `\"strict\": true`.\n\n## 56.20 Firebase on the frontend (Module 59)\n```js\nconst unsub = onSnapshot(query(collection(db,'chats',id,'messages'), orderBy('createdAt'), limit(50)), s => rows.value = s.docs.map(d => ({ id: d.id, ...d.data() })))\nonUnmounted(() => unsub())                                     // ALWAYS unsubscribe (leaks + billed reads)\nawait addDoc(collection(db,'chats',id,'messages'), { text, createdAt: serverTimestamp() })   // createdAt null locally until confirmed\n```\nWeb config is **not** secret; **Security Rules + Auth** protect data \u00b7 no joins (denormalise) \u00b7 composite queries need indexes \u00b7 pagination `startAfter(lastDoc)` \u00b7 REST for writes, listeners for realtime reads.\n\n## 56.21 Testing (Module 43)\n```js\nimport { mount, flushPromises } from '@vue/test-utils' ; import { describe, it, expect, vi, beforeEach } from 'vitest' ; import { setActivePinia, createPinia } from 'pinia'\nconst w = mount(Comp, { props: { chat }, global: { plugins: [router, pinia] } })\nw.find('.badge').text() ; await w.find('button').trigger('click') ; w.emitted('select')[0] ; await w.setValue('x') ; await flushPromises()\nvi.mock('@/services/chatApi', () => ({ chatApi: { list: vi.fn().mockResolvedValue({ content: [] }) } })) ; vi.useFakeTimers() ; vi.setSystemTime(new Date('2026-10-30T10:00:00'))\nbeforeEach(() => setActivePinia(createPinia()))\n```\nPyramid: unit (Vitest) \u2192 component (Vue Test Utils) \u2192 integration (MSW) \u2192 E2E (Playwright). Test what the **user sees**; mock the network, not Vue. Playwright: `page.getByLabel('Email').fill()` \u00b7 `page.getByRole('button',{name:'Log in'}).click()` \u00b7 `expect(page).toHaveURL('/chats')`.\n\n## 56.22 Security quick sheet (Module 45)\n| Threat | One-line defence |\n|---|---|\n| XSS | `{{ }}` / `textContent`; never `v-html`/`innerHTML` on user data; DOMPurify; CSP; validate URL schemes |\n| Token theft | short-lived in-memory access token + `HttpOnly; Secure; SameSite` refresh cookie |\n| CSRF | `SameSite`, CSRF token for cookie sessions; Bearer APIs not auto-sent |\n| Open redirect | accept only `/path` (not `//host`) in `?redirect=` |\n| Broken authz / IDOR | server checks every endpoint and ownership; guards are UX |\n| Supply chain | lockfile, `npm ci`, `npm audit`, Renovate |\n| Secrets | `VITE_*` is public; no secrets client-side |\n| CORS | allow-list exact origins; no `*` with credentials |\n\n## 56.23 Performance quick sheet (Module 46)\nCore Web Vitals: **LCP \u2264 2.5 s \u00b7 INP \u2264 200 ms \u00b7 CLS \u2264 0.1.** Measure first (Lighthouse, Performance, Network).\nBundle: route `() => import()`, `defineAsyncComponent`, named imports, drop moment \u2192 `Intl`/dayjs \u00b7 Images: WebP/AVIF, `srcset`, `loading=lazy`, width/height \u00b7 Rendering: stable keys, `computed`, `v-show` for frequent toggles, `v-memo`, `shallowRef`, virtual scroll for thousands of rows \u00b7 Network: debounce, abort stale, cache GETs, `Promise.all`, cursor pagination \u00b7 Leaks: clear timers, remove listeners, close sockets, abort fetches in `onUnmounted`; verify with heap snapshots.\n\n## 56.24 Accessibility quick sheet (Module 47)\nSemantic first (`button`, `nav`, `main`, labels) \u00b7 keyboard for everything + visible `:focus-visible` + skip link \u00b7 SPA: move focus to the new `<h1>` after route change \u00b7 modal: focus in, trap, Esc, restore focus (`<dialog>.showModal()`) \u00b7 `aria-live=\"polite\"` for new messages, `role=\"alert\"` for errors \u00b7 `aria-expanded/controls/pressed/current/describedby/invalid` \u00b7 contrast 4.5:1 (3:1 large/UI) \u00b7 touch targets \u2265 44px \u00b7 `prefers-reduced-motion` \u00b7 test: keyboard-only, VoiceOver (`Cmd+F5`), axe.\n\n## 56.25 Dates, i18n, regex (Module 62)\n```js\nnew Date('2026-10-30')            // date-only = UTC midnight \u2192 may show Oct 29 locally\nnew Date('2026-10-30T09:12:00Z')  // instant; store/transmit UTC ISO, convert only for display\nnew Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short'}).format(d) ; new Intl.RelativeTimeFormat('en',{numeric:'auto'}).format(-2,'hour')\nnew Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(1299)         // money: integer minor units\nt('chat.unread', { n }, n)        // vue-i18n plural \u00b7 whole sentences, no concatenation \u00b7 logical CSS for RTL\n/^\\S+@\\S+\\.\\S+$/.test(s)  \u00b7  s.match(/\\d+/g)  \u00b7  /(?<y>\\d{4})-(?<m>\\d{2})/.exec(s).groups.y   // beware nested quantifiers (ReDoS)\n```\n\n## 56.26 Build, Docker, nginx, CI (Module 63)\n```bash\nnpm ci            # exact lockfile install (CI/Docker)      npm run build  # \u2192 dist/      npm run preview  # test the prod build\ndocker build -t app:1.0 . ; docker run -p 8081:80 app:1.0\n```\n```nginx\nlocation /assets/ { expires 1y; add_header Cache-Control \"public, immutable\"; }   # hashed filenames\nlocation = /index.html { add_header Cache-Control \"no-store\"; }\nlocation /api/ { proxy_pass http://backend:8080; }                                  # same origin \u2192 no CORS\nlocation / { try_files $uri /index.html; }                                          # history-mode fallback\n```\nPipeline: `npm ci \u2192 lint \u2192 test \u2192 build \u2192 audit/Trivy \u2192 Sonar gate \u2192 image \u2192 deploy dev \u2192 smoke/E2E \u2192 promote`. Read CI logs from the **first** error. Linux is **case-sensitive** (`ChatItem.vue` \u2260 `chatitem.vue`). \"Loading chunk failed\" after deploy \u2192 `vite:preloadError` reload + no-cache `index.html`.\n\n## 56.27 Spring Boot \u2194 frontend mapping (Module 64)\n| Frontend sends | Spring reads |\n|---|---|\n| `?status=PAID` (`params`) | `@RequestParam` |\n| `/orders/5` | `@PathVariable` |\n| JSON body + `Content-Type: application/json` | `@RequestBody` |\n| `Authorization: Bearer \u2026` | Security filter \u2192 `@AuthenticationPrincipal` |\n| `FormData` file | `@RequestParam MultipartFile` |\n| `page=0&size=20&sort=a,desc` | `Pageable` (0-based pages) |\nErrors: **400** bad/validation `{errors:[{field,message}]}` \u00b7 **401** not logged in \u00b7 **403** not allowed \u00b7 **404** \u00b7 **409** conflict \u00b7 **415** wrong `Content-Type` \u00b7 **429** rate limit \u00b7 **5xx** server. CORS is fixed on the **backend** (or use a proxy). Eventual consistency (Redis/Kafka): a just-written item may appear slightly later \u2192 optimistic UI.\n\n## 56.28 Git and npm daily commands (Module 0)\n```bash\ngit switch -c feat/chat-retry ; git status ; git add -p ; git commit -m \"feat(chat): retry failed messages\" ; git push -u origin HEAD\ngit pull --rebase ; git stash / git stash pop ; git log --oneline -10 ; git diff --staged ; git restore <file>\nnpm ci ; npm run dev|build|lint|test ; npm i pkg ; npm i -D pkg ; npm outdated ; npm audit\n```\nBranch \u2192 small commits \u2192 PR with screenshots + test steps \u2192 address review \u2192 squash/merge. Never commit `.env` with real secrets or `node_modules`.\n\n---\n\n# MODULE 57 \u2014 PROFESSIONAL FRONTEND JOB-READINESS CHECKLIST\n\nTick each item only when you can do it **without looking** and explain it aloud.\n\n## \ud83d\udfe2 BEGINNER \u2014 before building applications\n- [ ] Explain the DOM and the page-load pipeline (HTML \u2192 DOM, CSS \u2192 CSSOM \u2192 render \u2192 paint).\n- [ ] Write a semantic page with correct head/meta and an accessible form.\n- [ ] Explain the box model, display types, specificity, Flexbox basics.\n- [ ] Use `let/const`, all primitive types, `===`, `??`, `?.`, template literals.\n- [ ] Write functions (declaration/arrow/default/rest) and explain callbacks.\n- [ ] Use arrays (`map/filter/reduce/find/some/every/sort`) and objects (destructure/spread/keys/entries).\n- [ ] Select/modify the DOM, attach events, explain bubbling and delegation.\n- [ ] Read a stack trace; use `console` and DevTools breakpoints.\n\n## \ud83d\udfe1 INTERMEDIATE \u2014 work independently on frontend tickets\n- [ ] Layout with Grid + Flex; build responsive (mobile-first) UIs.\n- [ ] Explain scope chain, hoisting, closures, `this`, prototypes/classes.\n- [ ] Use promises, `async/await`, `Promise.all`; handle errors; cancel with `AbortController`.\n- [ ] Predict event-loop output (sync \u2192 microtasks \u2192 macrotasks).\n- [ ] Call REST APIs with fetch/axios; handle loading/empty/error/success; map Spring validation errors.\n- [ ] Build Vue 3 SFCs with `ref/reactive/computed/watch`, props/emits/slots/`v-model`.\n- [ ] Use lifecycle hooks and clean up listeners/timers/requests.\n- [ ] Use Vue Router (params, query, guards, lazy routes) and Pinia (`storeToRefs`, async actions).\n- [ ] Debug with Vue DevTools + Network tab; read warnings.\n- [ ] Use git, npm scripts, env variables, ESLint/Prettier.\n\n## \ud83d\udd34 ADVANCED \u2014 large production applications\n- [ ] Design folder/component architecture; container vs presentational; composables vs stores.\n- [ ] Explain Vue reactivity internals (Proxy, track/trigger, scheduler, `nextTick`).\n- [ ] Build an API service layer with interceptors, auth, error normalisation, mock/real switch.\n- [ ] Implement optimistic updates, pagination (offset/cursor), infinite scroll, debounced search, real-time (WebSocket/SSE) with reconnect.\n- [ ] Performance: code splitting, lazy loading, virtualisation, memory-leak hunting, Lighthouse/Core Web Vitals.\n- [ ] Security: XSS/CSRF/CSP, token storage trade-offs, dependency hygiene, authz is server-side.\n- [ ] Accessibility: keyboard/focus management, ARIA live regions, contrast, reduced motion.\n- [ ] Testing: Vitest unit/component tests, mocks, Playwright E2E for critical flows.\n- [ ] Production debugging: source maps, error monitoring, correlation ids, build vs dev differences.\n\n## \ud83c\udfed COMPANY LEVEL \u2014 real codebases (Modules 58\u201366)\n- [ ] Recognise Vue 2 vs Vue 3 from `package.json`/`main.js`; read an Options API component and a Vuex module; translate both ways.\n- [ ] Trace a feature through router \u2192 component \u2192 store/action \u2192 service \u2192 backend controller.\n- [ ] Write a realtime composable (Firestore `onSnapshot` or WebSocket) with cleanup, reconnect and dedupe.\n- [ ] Type props/emits/services/stores in TypeScript with `strict`; explain `any` vs `unknown` and why types vanish at runtime.\n- [ ] Use the company UI library (scoped slots in tables, theming via tokens) and wrap it in your own components.\n- [ ] Add i18n without hard-coded strings; store/display dates in UTC \u2192 local; avoid float money.\n- [ ] Write a multi-stage Dockerfile and an nginx config (proxy, history fallback, caching); triage a failing CI log.\n- [ ] Read Swagger/DTOs; map 400/401/403/404/409/415/CORS errors to the correct fix on the correct side.\n- [ ] Open a PR with the Module 66 checklist, screenshots and test steps; review a teammate's PR constructively.\n\n## \ud83d\udcbc JOB LEVEL \u2014 explain confidently in interviews / to your mentor\n- [ ] Walk through **click \u2192 UI update** across Vue \u2194 REST \u2194 Spring Boot \u2194 DB with failure points.\n- [ ] Explain any function in your company codebase **line by line** (inputs, state touched, side effects, outputs, errors, callers).\n- [ ] Justify decisions: local vs global state, ref vs reactive, computed vs watch, v-if vs v-show, Options vs Composition API.\n- [ ] Answer \u2265 80% of the Module 49 questions aloud without notes (especially **[OUT]** and **[DBG]**).\n- [ ] Present your Seller Chat project: architecture, data flow, trade-offs, what you'd improve.\n\n## Daily-use concepts & most-used functions\n**JS:** `map filter reduce find some every includes sort slice splice push` \u00b7 `Object.keys/entries/assign` \u00b7 spread/destructure \u00b7 `?.` `??` \u00b7 `JSON.parse/stringify` \u00b7 `async/await` `Promise.all` \u00b7 `fetch` \u00b7 `addEventListener` \u00b7 `setTimeout` \u00b7 `Date/Intl`.\n**Vue:** `ref computed watch onMounted onUnmounted` \u00b7 `v-if v-for :key v-model @click :class` \u00b7 `defineProps defineEmits` \u00b7 `useRoute useRouter` \u00b7 `defineStore storeToRefs`.\n**Debugging:** Console errors \u2192 stack trace \u2192 breakpoint \u2192 Network \u2192 Vue DevTools \u2192 backend logs.\n**API skills:** build URLs with params, auth header, parse errors, status handling, cancellation, pagination, retry.\n\n## Common junior mistakes (avoid)\n1. `==` / forgetting `await` / not checking `res.ok`. 2. Mutating props or state copies incorrectly. 3. `v-for` without stable `:key`. 4. Destructuring reactive/store state (use `toRefs/storeToRefs`). 5. No loading/error/empty states. 6. API calls inside templates/computed. 7. Missing cleanup (leaks, duplicate listeners). 8. Calling APIs on every keystroke. 9. Trusting client validation/guards for security. 10. Giant components mixing fetching, logic and markup. 11. Using `v-html` with user data. 12. `console.log` debugging only (no breakpoints/Network). 13. Hard-coded URLs/secrets. 14. Ignoring accessibility. 15. Not reading error messages carefully.\n\n## What you should implement independently\nResponsive layouts \u00b7 validated forms \u00b7 searchable paginated tables \u00b7 modals/dropdowns \u00b7 authenticated CRUD with Vue+Pinia+Router \u00b7 API service layer \u00b7 composables (`useFetch`, debounce) \u00b7 optimistic UI \u00b7 tests for components/stores.\n## What you should explain line by line\nAny Vue component in your project (script, template bindings, props/emits, lifecycle) \u00b7 any store action \u00b7 any API service function \u00b7 any async function (order of execution, errors) \u00b7 any CSS layout rule (why it works).\n\n## Self-assessment rubric (rate 0\u20133: 0 = can't, 1 = with help, 2 = alone, 3 = can teach)\n| Area | Skills | Score |\n|---|---|---|\n| HTML | semantics, forms, a11y, script loading | |\n| CSS | box model, flex/grid, responsive, specificity, debugging | |\n| JS core | types, functions, arrays, objects, scope, closures, this | |\n| Async | promises, async/await, event loop, AbortController | |\n| DOM/Web APIs | DOM, events, storage, History, WebSocket | |\n| API integration | fetch/axios, errors, auth, pagination, Spring contracts | |\n| Vue core | directives, reactivity, components, props/emits/slots | |\n| Vue ecosystem | Router, Pinia, composables, lifecycle | |\n| Architecture | structure, state ownership, services, reuse | |\n| Quality | testing, security, performance, accessibility, debugging | |\n| Legacy & realtime | Vue 2/Options/Vuex reading, Firebase listeners, WebSocket | |\n| TypeScript & UI libraries | typed props/services, scoped-slot tables, wrapping libraries | |\n| i18n, dates & forms at scale | vue-i18n, UTC dates, validation/server errors | |\n| Delivery | Docker, nginx, CI triage, Git/PR workflow, Spring contracts | |\n**Interpretation (14 areas, max 42):** 0\u201320 foundation phase (repeat Parts 1\u20133) \u00b7 21\u201330 can follow tickets with guidance \u00b7 31\u201337 independent contributor \u00b7 38\u201342 ready to mentor and interview confidently. Re-score every two weeks; a single 0 or 1 in HTML/CSS/JS core caps your level: fix those first.\n**Next steps after finishing:** go deeper on TypeScript with Vue, Nuxt (SSR), Vitest + Playwright, design systems and web performance, then deepen the backend/system side (Spring Security, Kafka, Redis) to become a strong full-stack engineer. Keep building: pick one real ticket in your company repo each week and explain it line by line to a teammate.\n\n\n# PART 13 \u2014 COMPANY-STACK MODULES (what real codebases contain beyond the basics)\n\nModules 58\u201366 cover what your company project likely uses that earlier modules only touched: legacy Vue 2 code, Vuex, Firebase, TypeScript, UI libraries, i18n and dates, deployment, Spring Boot contracts, and the checklists teams use daily. Each module ends with a **COMPANY STEP** that applies it to Seller Chat.\n\n---\n\n# MODULE 58 \u2014 VUE 2, OPTIONS API AND VUEX (LEGACY CODE) \ud83d\udfe1\ud83c\udfed\n\n## 58.1 Why you must learn this \ud83d\udfe2\nMany company projects were started on **Vue 2** years ago, or on Vue 3 using the **Options API**. Your first tickets will probably be in code that looks different from what you learned in Modules 31\u201343. The concepts are identical (state, computed, events, lifecycle); only the *shape* differs.\n**Analogy:** Options API is a form with fixed boxes (`data`, `computed`, `methods`); Composition API is a blank page where you group code by feature. Same information, different layout.\n\n## 58.2 Recognising Vue 2 vs Vue 3 \ud83d\udfe1\n| Clue | Vue 2 | Vue 3 |\n|---|---|---|\n| Entry (`main.js`) | `new Vue({ router, store, render: h => h(App) }).$mount('#app')` | `createApp(App).use(router).mount('#app')` |\n| Build tool | Vue CLI + webpack (`vue-cli-service serve`) | Vite (`vite`) |\n| Store | **Vuex** `new Vuex.Store(...)` | Pinia (or Vuex 4) |\n| Router | `vue-router@3`, `new VueRouter({ mode: 'history' })` | `vue-router@4`, `createRouter` |\n| Template | single root element; filters; `.sync` | multiple roots; no filters; `v-model:prop` |\n| Events | `this.$on/$off` event bus | removed (use mitt/Pinia/props+emits) |\n| `package.json` | `\"vue\": \"^2.x\"` | `\"vue\": \"^3.x\"` |\n**First thing to do in any new repo:** open `package.json`, check the Vue version and whether `vuex` or `pinia` is installed. That tells you which half of this module you need.\n\n## 58.3 The Options API in full: read every section \ud83d\udfe1\n```vue\n<script>\nimport ChatItem from './ChatItem.vue'\nimport { mapState, mapGetters, mapActions } from 'vuex'\nimport searchMixin from '@/mixins/searchMixin'\n\nexport default {\n  name: 'ChatList',\n  components: { ChatItem },\n  mixins: [searchMixin],                        // injects data/methods from another file (hidden dependency!)\n  props: { status: { type: String, default: 'all' } },\n  data() { return { loading: false, q: '' } },  // local reactive state \u2192 this.q\n  computed: {\n    ...mapState('chat', ['chats']),             // this.chats \u2190 store.state.chat.chats\n    ...mapGetters('chat', ['unreadTotal']),\n    visible() { return this.chats.filter(c => c.name.includes(this.q)) },\n  },\n  watch: {\n    status: { handler(v) { this.load() }, immediate: true },\n    'filters.q'(v) { /* watching a nested path */ },\n  },\n  methods: {\n    ...mapActions('chat', ['fetchChats', 'select']),\n    async load() { this.loading = true; try { await this.fetchChats({ status: this.status }) } finally { this.loading = false } },\n    onSelect(id) { this.select(id); this.$emit('selected', id); this.$router.push({ name: 'chat', params: { chatId: id } }) },\n  },\n  created() { /* data/computed/watch ready; DOM NOT yet */ },\n  mounted() { this.$refs.search.focus() },      // DOM ready; $refs = template refs\n  beforeDestroy() { /* Vue 2 name; Vue 3: beforeUnmount */ },\n  destroyed() { /* Vue 2 name; Vue 3: unmounted */ },\n}\n<\/script>\n```\n**How to read this file, top to bottom:**\n| Option | Meaning | Composition API equivalent |\n|---|---|---|\n| `name` | component name (DevTools, recursion) | file name / `defineOptions({ name })` |\n| `components` | child components registered locally | `import` in `<script setup>` |\n| `props` | inputs from the parent | `defineProps` |\n| `data()` | local reactive state (a **function**, so each instance gets its own copy) | `ref` / `reactive` |\n| `computed` | derived, cached values | `computed()` |\n| `watch` | run code when a value changes | `watch()` |\n| `methods` | functions | plain functions |\n| `created` / `mounted` / `beforeDestroy` | lifecycle hooks | `onMounted` / `onUnmounted` |\n| `mixins` | borrow code from another object | composables |\n**`this` is the component instance.** Everything (data, computed, methods, props, `$emit`, `$refs`, `$router`, `$route`, `$store`, `$nextTick`) hangs off `this`. So `this.q` could be data, a prop, a computed or from a mixin: that ambiguity is the main reading difficulty.\n**Arrow functions break `this`:** `methods: { f: () => this.x }` is wrong; `this` isn't the component. Use `f() { ... }`.\n**Vue 2 reactivity limits** (it uses `Object.defineProperty`): adding a **new** property to an object, or `arr[i] = x`, or changing `arr.length` is **not** reactive.\n```js\nthis.user.age = 30                    // \u274c if `age` wasn't declared up front: no update\nthis.$set(this.user, 'age', 30)       // \u2705 Vue 2\nthis.items.splice(i, 1, newItem)      // \u2705 array replace (not items[i] = newItem)\n// Vue 3 (Proxy) has no such limitation\n```\n**Option order convention:** `name, components, mixins, props, data, computed, watch, lifecycle hooks, methods`.\n**Template differences you'll meet:** exactly one root element per template; `<template slot=\"x\">`/`slot-scope` (old slot syntax); `.sync` modifier; `{{ price | currency }}` filters; `v-bind:value` + `@input` for custom `v-model`.\n\n## 58.4 Mixins, event bus, filters: and why they were replaced \ud83d\udfe1\n```js\n// mixins/searchMixin.js\nexport default { data: () => ({ q: '' }), methods: { clearSearch() { this.q = '' } } }\n```\n**Problems with mixins:** two mixins can define the same name and silently collide; the origin of `this.x` is hidden; hard to trace; can't take parameters. **Replaced by composables** (Module 36), which are explicit about inputs and outputs.\n**Finding where `this.clearSearch` comes from:** search the project for `clearSearch`; the `mixins: [...]` array in the component tells you which files to check.\n**Event bus:** `const bus = new Vue(); bus.$emit('chat-read', id); bus.$on('chat-read', fn)`: any component can talk to any other, so data flow becomes impossible to follow (and listeners leak if you forget `$off`). Replaced by Pinia or props/emits. To debug: search for `bus.$emit('event-name'` and `bus.$on('event-name'`.\n**Filters** (`{{ price | currency }}`) were removed: use a method, a computed, or `Intl.NumberFormat`.\n**Vue 2 \u2192 3 template changes:** `.sync` \u2192 `v-model:propName` \u00b7 `$listeners` merged into `$attrs` \u00b7 `Vue.use(Plugin)` \u2192 `app.use(Plugin)` \u00b7 `slot=\"x\"`/`slot-scope` \u2192 `v-slot`/`#x` \u00b7 `.native` removed \u00b7 `destroyed` \u2192 `unmounted`.\n\n## 58.5 Vuex: the legacy store \ud83d\udfe1\n```js\n// store/modules/chat.js (namespaced module)\nexport default {\n  namespaced: true,\n  state: () => ({ chats: [], loading: false }),\n  getters: { unreadTotal: s => s.chats.reduce((n, c) => n + c.unread, 0) },\n  mutations: {                              // ONLY place state changes: must be SYNCHRONOUS\n    SET_CHATS(state, chats) { state.chats = chats },\n    SET_LOADING(state, v) { state.loading = v },\n  },\n  actions: {                                // async work; commits mutations\n    async fetchChats({ commit }, params) {\n      commit('SET_LOADING', true)\n      try { commit('SET_CHATS', await chatApi.list(params)) } finally { commit('SET_LOADING', false) }\n    },\n  },\n}\n```\n```js\n// usage in a component\nthis.$store.state.chat.chats                         // read state\nthis.$store.getters['chat/unreadTotal']              // read getter\nthis.$store.commit('chat/SET_CHATS', x)              // mutation (sync)\nawait this.$store.dispatch('chat/fetchChats', params)   // action (async)\n```\n**The Vuex flow:**\n```\ncomponent \u2500\u2500dispatch\u2500\u2500\u25b6 action (API call) \u2500\u2500commit\u2500\u2500\u25b6 mutation \u2500\u2500\u25b6 state \u2500\u2500\u25b6 getters \u2500\u2500\u25b6 component re-renders\n```\n**Why mutations must be synchronous:** DevTools records each mutation as a snapshot you can time-travel through; async changes would make that trace unreliable.\n**Strings are the weak point:** `'chat/SET_CHATS'` typos fail silently. When tracing, search for the exact string.\n| Vuex | Pinia equivalent |\n|---|---|\n| state / getters | state (`ref`) / getters (`computed`) |\n| mutations + actions | actions only (change state directly inside) |\n| modules + `namespaced` | one store per domain |\n| `mapState / mapGetters / mapActions` | `storeToRefs` / destructure actions |\n| `this.$store.dispatch('chat/fetchChats')` | `useChatStore().fetchChats()` |\n**Migration approach:** convert one module at a time into a Pinia store, keeping action names; replace `commit` with direct assignment; leave components alone until the module is done; both stores can run side by side.\n\n## 58.6 Reading a Vue 2 + Vuex feature end to end \ud83d\udfe1\nTicket: \"the unread badge doesn't clear when I open a chat.\" Method:\n1. Router: find the `chat` route \u2192 `ChatRoom.vue`.\n2. In its `mounted`/`watch`, find what it dispatches (`this.openChat(id)` via `mapActions`).\n3. Open `store/modules/chat.js` \u2192 `openChat` action \u2192 which mutation does it commit? Is there one that sets `unread = 0`?\n4. Check the API call it makes (Network tab): does the backend mark it read?\n5. Check where the badge reads from (`mapGetters('chat', ['unreadTotal'])`): is the getter derived from the same state?\n6. Use **Vue DevTools \u2192 Vuex** tab: watch the mutation log as you click.\nYou found it when you can say: \"action `openChat` never commits `MARK_READ`.\"\n\n## 58.7 Migration cheat sheet (Vue 2 \u2192 3) \ud83d\udd34\n`new Vue` \u2192 `createApp` \u00b7 `Vue.extend`/global API \u2192 app instance \u00b7 `this.$set` unnecessary \u00b7 component `v-model`: `value`/`input` \u2192 `modelValue`/`update:modelValue` \u00b7 `emits` option now declares custom events \u00b7 `.native` removed \u00b7 `destroyed/beforeDestroy` \u2192 `unmounted/beforeUnmount` \u00b7 `Vue.observable` \u2192 `reactive` \u00b7 transition classes `v-enter` \u2192 `v-enter-from` \u00b7 Vue CLI/webpack \u2192 Vite \u00b7 multiple root nodes allowed \u00b7 `@vue/compat` migration build for gradual upgrades.\n\n## 58.8 Mistakes and questions\n**Mistakes:** arrow function in `methods` \u00b7 `data` as an object instead of a function \u00b7 mutating state outside Vuex mutations (strict mode warns) \u00b7 using `arr[i] = x` and wondering why Vue 2 doesn't update \u00b7 forgetting `$off` for event-bus listeners \u00b7 searching for a method in the component when it's in a mixin.\n**Q1. Explain the Vuex flow.** **Q2. Why must mutations be synchronous?** **Q3. Why did mixins fall out of favour?** **Q4. Why was `this.$set` needed in Vue 2?** **Q5. Vue 2 vs Vue 3: five differences?** **Q6. Why is `data` a function?** each instance needs its own copy. **Q7. `created` vs `mounted`?**\n**Exercises:** rewrite the Options API `ChatList` above with `<script setup>` + a Pinia store \u00b7 find the origin of each `this.` property in a mixin-heavy component \u00b7 convert a Vuex module to Pinia and make the old and new store pass the same tests.\n\n## \u25b6 COMPANY STEP 58\nTake your Composition-API `ChatItem` from Module 32 and write the Options API version beside it. Say each line aloud with its equivalent. If you can translate both ways, legacy code stops being scary.\n\n---\n\n# MODULE 59 \u2014 FIREBASE FIRESTORE / REALTIME DATABASE ON THE FRONTEND \ud83d\udfe1\ud83c\udfed\n\n## 59.1 What it is and why chat apps use it \ud83d\udfe2\nYour stack includes **Firebase**. Frontends often read it **directly** for realtime features: new messages, presence (\"typing\u2026\"), unread counts. The database **pushes** changes to the browser, so the UI updates without polling.\n**Analogy:** REST is calling the restaurant to ask \"is my order ready?\" every minute. Firebase listeners are the buzzer that vibrates when it is.\n| | **Firestore** | **Realtime Database (RTDB)** |\n|---|---|---|\n| Data model | collections \u2192 documents \u2192 subcollections | one big JSON tree |\n| Queries | rich: `where`, `orderBy`, `limit`, compound (need indexes) | limited: `orderByChild`, `limitToLast` |\n| Realtime | `onSnapshot` | `onValue` / `onChildAdded` |\n| Cost model | per document read/write/delete | bandwidth + storage |\n| Good for | most apps, structured data | very low-latency, simple data (presence, typing) |\nBoth keep a persistent connection (WebSocket/long-polling) to the server.\n\n## 59.2 Setup (modular SDK v9+) \ud83d\udfe1\n```js\n// src/firebase.js\nimport { initializeApp } from 'firebase/app'\nimport { getFirestore } from 'firebase/firestore'\nimport { getDatabase } from 'firebase/database'\nimport { getAuth } from 'firebase/auth'\nconst app = initializeApp({\n  apiKey: import.meta.env.VITE_FB_API_KEY,\n  authDomain: import.meta.env.VITE_FB_AUTH_DOMAIN,\n  projectId: import.meta.env.VITE_FB_PROJECT_ID,\n  databaseURL: import.meta.env.VITE_FB_DB_URL,\n})\nexport const db = getFirestore(app), rtdb = getDatabase(app), auth = getAuth(app)\n```\n**The web config values are NOT secrets.** They identify the project. Security comes from **Firebase Auth + Security Rules** (server-side), never from hiding the config.\n\n## 59.3 Reading and writing Firestore \ud83d\udfe1\n```js\nimport { collection, query, where, orderBy, limit, startAfter, onSnapshot,\n         addDoc, doc, updateDoc, getDocs, serverTimestamp } from 'firebase/firestore'\n\n// one-time read\nconst snap = await getDocs(query(collection(db, 'chats'), where('sellerId', '==', uid), orderBy('lastMessageAt', 'desc'), limit(20)))\nconst chats = snap.docs.map(d => ({ id: d.id, ...d.data() }))      // doc id is NOT inside data(): add it\n\n// realtime listener \u2192 returns an UNSUBSCRIBE function\nconst unsub = onSnapshot(\n  query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt'), limit(50)),\n  snapshot => { messages.value = snapshot.docs.map(d => ({ id: d.id, ...d.data() })) },   // fires now, and on every change\n  error => console.error(error))\n\n// write\nawait addDoc(collection(db, 'chats', chatId, 'messages'), { text, sender: 'SELLER', createdAt: serverTimestamp() })\nawait updateDoc(doc(db, 'chats', chatId), { lastMessage: text, lastMessageAt: serverTimestamp() })\n```\nRTDB equivalents: `ref(rtdb, 'chats/123/messages')`, `onValue(ref, cb)`, `push`, `set`, `update`, and unsubscribe with the function `onValue` returns.\n\n## 59.4 A Vue composable with correct cleanup \ud83d\udd34\n```js\n// composables/useChatMessages.js\nimport { ref, watch, onUnmounted } from 'vue'\nimport { collection, query, orderBy, onSnapshot } from 'firebase/firestore'\nimport { db } from '@/firebase'\n\nexport function useChatMessages(chatIdRef) {\n  const messages = ref([]), loading = ref(true), error = ref(null)\n  let unsub = null\n  watch(chatIdRef, id => {\n    unsub?.(); unsub = null                                // 1. stop the OLD listener first\n    messages.value = []; loading.value = true\n    if (!id) { loading.value = false; return }\n    unsub = onSnapshot(\n      query(collection(db, 'chats', id, 'messages'), orderBy('createdAt')),\n      s => { messages.value = s.docs.map(d => ({ id: d.id, ...d.data() })); loading.value = false },\n      e => { error.value = e; loading.value = false })\n  }, { immediate: true })\n  onUnmounted(() => unsub?.())                             // 2. stop on leaving: otherwise leak + billed reads\n  return { messages, loading, error }\n}\n```\n**Line by line:** the watcher re-subscribes whenever the open chat changes \u00b7 `unsub?.()` ends the old subscription so you never listen to two chats at once \u00b7 `onSnapshot` calls the success callback immediately and again on each change \u00b7 `onUnmounted` is the safety net.\n**Gotchas to know:**\n| Gotcha | Detail |\n|---|---|\n| Every active listener costs reads | always unsubscribe; limit the query |\n| `serverTimestamp()` is `null` locally until the server confirms | handle `createdAt?.toDate?.()` |\n| Timestamps are objects | convert with `.toDate()` before formatting |\n| Composite queries need indexes | the console error includes a link to create it |\n| No joins | denormalise (store `buyerName` on the chat) |\n| 1 MiB document limit | don't embed unbounded arrays |\n| Pagination | `startAfter(lastDoc)` + `limit` |\n| Offline persistence | cached data shown even offline; writes queue |\n| Access control | **Security Rules** are the real protection |\n```\n// Security Rules (server-side, not in your Vue code)\nmatch /chats/{chatId}/messages/{id} {\n  allow read:  if request.auth != null && get(/databases/$(database)/documents/chats/$(chatId)).data.sellerId == request.auth.uid;\n  allow create: if request.auth != null && request.resource.data.text.size() <= 500;\n}\n```\n\n## 59.5 The hybrid pattern used in companies \ud83c\udfed\n```\nCommands (send message, attach order):   Vue \u2192 REST \u2192 Spring Boot (validate, authorise, save, Kafka)\nRealtime reads (new messages, unread):   Firestore/RTDB listener \u2192 Vue\n```\nSpring stays the **authority** for writes and business rules; Firebase delivers **fast reads**. Your `chatApi` service can hide this: `send()` calls REST; `subscribeToMessages()` wraps `onSnapshot`. The UI doesn't care.\n**Typical bug:** the REST write succeeds but the Firestore document hasn't been written yet by the backend \u2192 the message appears late. Design for eventual consistency: show the optimistic bubble (Module 48 stage 5) and reconcile when the snapshot arrives (match by client-generated id to avoid duplicates).\n\n## 59.6 Mistakes and questions\n**Mistakes:** forgetting to unsubscribe \u00b7 subscribing inside a component that re-renders (use `watch`/`onMounted` once) \u00b7 trusting the client with security instead of rules \u00b7 reading entire collections without `limit` \u00b7 formatting a Timestamp object as a string \u00b7 no error callback in `onSnapshot`.\n**Q1. Firestore vs RTDB?** **Q2. How do you stop a realtime listener, and why?** **Q3. How are Firebase apps secured?** Auth + Security Rules. **Q4. Why is the `apiKey` in a web app OK?** **Q5. Why combine REST and Firestore?** **Q6. How do you avoid duplicate messages from an optimistic bubble plus a snapshot?**\n**Exercises:** `useChatMessages` with `onSnapshot` + cleanup \u00b7 pagination with `startAfter` \u00b7 optimistic send showing \"pending\" until `serverTimestamp` resolves \u00b7 write Security Rules for \"a seller only reads their chats\".\n\n## \u25b6 COMPANY STEP 59\nAdd `subscribeToMessages(chatId, cb)` to `chatApi` (mock version uses `setInterval`; real version uses `onSnapshot`) returning an unsubscribe function. Call it from `ChatRoomView` with cleanup in `onUnmounted`.\n\n---\n\n# MODULE 60 \u2014 TYPESCRIPT FOR VUE DEVELOPERS \ud83d\udd34\ud83c\udfed\n\n## 60.1 Why TypeScript \ud83d\udfe2\nTypeScript = JavaScript + **static types** checked at **build time** (types are erased; browsers run plain JS). It catches `order.totall` before you run the app, gives autocomplete, makes refactors safe and documents API contracts.\n**Java parallel:** interfaces, generics and compile errors will feel familiar. Key differences: TS types are **structural** (matching shape is enough; no `implements` needed) and **erased at runtime** (so you still must validate real API data).\n\n## 60.2 Essentials \ud83d\udfe1\n```ts\nlet name: string = 'Ravi'; let n: number = 1; let ok: boolean = true\nconst ids: number[] = [1, 2]; const pair: [string, number] = ['a', 1]     // array, tuple\ntype Sender = 'BUYER' | 'SELLER'                                           // union of literals: like a tiny enum\ninterface Message { id: number; text: string; sender: Sender; createdAt: string; order?: Order | null }   // ? = optional\ntype ChatPage = { content: Chat[]; totalElements: number }\nfunction format(m: Message): string { return `${m.sender}: ${m.text}` }\nconst add = (a: number, b: number): number => a + b\nasync function getChat(id: number): Promise<Chat> { return http.get<Chat>(`/chats/${id}`) }\nfunction first<T>(arr: T[]): T | undefined { return arr[0] }              // generics\nconst x = value as string                                                   // assertion: you promise; use sparingly\nfunction isHttpError(e: unknown): e is HttpError { return typeof e === 'object' && e !== null && 'status' in e }   // type guard\n```\nUtility types: `Partial<T>` (all optional), `Pick<T,'a'|'b'>`, `Omit<T,'a'>`, `Record<string, number>`, `ReturnType<typeof fn>`, `Readonly<T>`.\n| Concept | Rule |\n|---|---|\n| `any` | turns checking off: avoid |\n| `unknown` | \"I don't know yet\": forces a check before use |\n| `null`/`undefined` | with `strict`, you must handle them (`order?.id`) |\n| `interface` vs `type` | both describe shapes; interfaces can be extended/merged; unions/tuples need `type` |\n| `enum` vs union of literals | prefer unions (no runtime code) |\nAlways enable `\"strict\": true` in `tsconfig.json`.\n**Reading compiler errors:** read the *last* line first; it says what was expected vs received. `Type 'string | undefined' is not assignable to type 'string'` means you must handle `undefined`.\n\n## 60.3 TypeScript in Vue 3 \ud83d\udd34\n```vue\n<script setup lang=\"ts\">\nimport { ref, computed } from 'vue'\nimport type { Chat } from '@/types/chat'\n\nconst props = defineProps<{ chat: Chat; active?: boolean }>()          // type-only props\nconst emit = defineEmits<{ select: [id: number]; close: [] }>()        // typed events\nconst chats = ref<Chat[]>([])                                          // typed ref\nconst total = computed<number>(() => chats.value.reduce((n, c) => n + c.unread, 0))\nconst el = ref<HTMLInputElement | null>(null)                          // template ref type\nfunction onSelect() { emit('select', props.chat.id) }                  // wrong payload type = compile error\n<\/script>\n```\n```ts\n// types/chat.ts: contracts mirror the Spring DTOs\nexport interface Chat { id: number; buyerName: string; lastMessage: string; lastMessageAt: string; unread: number; status: 'OPEN' | 'CLOSED' }\nexport interface Page<T> { content: T[]; totalElements: number; totalPages: number; number: number }\n// services/chatApi.ts\nexport const chatApi = { list: (params?: { q?: string; status?: string }) => http.get<Page<Chat>>('/chats', { params }) }\n```\nPinia stores and composables are typed mostly by inference. Run `vue-tsc --noEmit` in CI (the normal `tsc` doesn't understand `.vue`).\n**Don't trust types at runtime:** `http.get<Chat>()` only *claims* the shape. If the backend changes, TS can't know. For critical data validate with **Zod**: `ChatSchema.parse(data)`.\n**Keep types in sync with Spring:** generate TS types from the OpenAPI spec (`openapi-typescript`) so DTO changes surface as compile errors in the frontend.\n\n## 60.4 Mistakes and questions\n**Mistakes:** `any` everywhere (defeats the point) \u00b7 `as` assertions to silence errors \u00b7 typing things TypeScript already infers \u00b7 ignoring `strict` \u00b7 assuming types validate API data.\n**Q1. `interface` vs `type`?** **Q2. `any` vs `unknown`?** **Q3. Are types checked at runtime?** No. **Q4. How do you type props/emits in `<script setup>`?** **Q5. What is a generic and where would you use one?** `Page<T>`. **Q6. How do you keep TS types in sync with the backend?**\n**Exercises:** add TypeScript to your user-management app: DTOs, services, store, props/emits; fix every compiler error \u00b7 make `Page<T>` generic and reuse it for chats and orders \u00b7 validate an API response with Zod.\n\n## \u25b6 COMPANY STEP 60\nCreate `types/chat.ts` and `types/order.ts` from the Module 48 contracts. Type `chatApi`, the `chat` store and `ChatItem` props. Turn on `strict` and fix what it finds.\n\n---\n\n# MODULE 61 \u2014 UI COMPONENT LIBRARIES AND DESIGN SYSTEMS \ud83d\udfe1\ud83c\udfed\n\n## 61.1 Why companies use them \ud83d\udfe2\nNobody hand-writes every table, date picker and dialog. A **component library** gives accessible, tested building blocks. A **design system** is the company's shared rules: tokens (colours, spacing), components, usage docs.\n**Common Vue libraries:** **Element Plus** (Vue 3) / **Element UI** (Vue 2), **Vuetify**, **PrimeVue**, **Ant Design Vue**, **Naive UI**, **Bootstrap 5**, **Tailwind CSS + Headless UI** (unstyled behaviour + your styles).\nYour work will mostly be **using** the company's library, not building a new one.\n\n## 61.2 How to work with a library \ud83d\udfe1\n1. Open the library docs page for the component: read **props, events, slots, methods**.\n2. Use its table/form/dialog components instead of reinventing.\n3. Theme through **tokens/CSS variables** (`--el-color-primary`), not `!important` overrides.\n4. **Wrap** them in your own `Base*` components to isolate the dependency and set company defaults.\n5. Import only what you use (`unplugin-vue-components` auto-imports and tree-shakes).\n```vue\n<el-table :data=\"rows\" v-loading=\"loading\" @sort-change=\"onSort\">\n  <el-table-column prop=\"buyerName\" label=\"Buyer\" sortable />\n  <el-table-column label=\"Status\">\n    <template #default=\"{ row }\"><el-tag :type=\"row.status === 'OPEN' ? 'success' : 'info'\">{{ row.status }}<\/el-tag><\/template>\n  <\/el-table-column>\n  <el-table-column label=\"Actions\">\n    <template #default=\"{ row }\"><el-button size=\"small\" @click=\"edit(row)\">Edit<\/el-button><\/template>\n  <\/el-table-column>\n<\/el-table>\n```\n**Notice `#default=\"{ row }\"`:** that's the **scoped slot** from Module 35. The table owns the loop; it hands each `row` back to your template so you decide how a cell looks. Every library customises cells this way.\n```vue\n<!-- Wrapping: components/base/AppButton.vue isolates Element Plus -->\n<script setup>\ndefineProps({ loading: Boolean })\n<\/script>\n<template><el-button type=\"primary\" :loading=\"loading\" v-bind=\"$attrs\"><slot /><\/el-button><\/template>\n```\nIf the library changes or is replaced, you edit one wrapper, not 200 files.\n\n## 61.3 Customising styles safely \ud83d\udfe1\n| Need | Do | Don't |\n|---|---|---|\n| Brand colour | set the library's CSS variables once in `:root` | override every class with `!important` |\n| Tweak one internal element | `:deep(.el-input__inner) { \u2026 }` inside a `scoped` style | remove `scoped` to \"make it work\" |\n| Spacing/layout | your own wrapper div with flex/grid | patch library internals |\n| Dark mode | the library's dark class/tokens + your tokens | invert colours with filters |\n**Check accessibility of what you use:** a library button is usually accessible; a custom icon-only wrapper still needs `aria-label`.\n\n## 61.4 Design systems and Storybook \ud83c\udfed\nA **design system** = tokens + components + guidelines + docs. **Storybook** renders each component in isolation with all its states (default, loading, error, empty, disabled) so designers, developers and QA review them without running the whole app; it also supports **visual regression tests** (screenshots compared on each PR).\n```js\n// BaseButton.stories.js\nexport default { component: BaseButton, title: 'Base/BaseButton' }\nexport const Primary = { args: { variant: 'primary' }, render: a => ({ components: { BaseButton }, setup: () => ({ a }), template: '<BaseButton v-bind=\"a\">Send<\/BaseButton>' }) }\nexport const Loading = { ...Primary, args: { loading: true } }\n```\n**Figma \u2192 code:** designers specify tokens (colour, 8 px spacing scale, radius, type scale); you map them to CSS variables and never type a hex value in a component.\n\n## 61.5 Mistakes and questions\n**Mistakes:** `!important` wars \u00b7 importing the entire library (huge bundle) \u00b7 copy-pasting library markup instead of the component \u00b7 forgetting that some props are named differently between Element UI (Vue 2) and Element Plus (Vue 3).\n**Q1. Why wrap a library component?** **Q2. How do you theme a library component?** **Q3. What is a design system?** **Q4. What is a scoped slot, and where do UI libraries use it?** **Q5. What is Storybook for?**\n**Exercises:** build a user table with Element Plus (or PrimeVue), a status tag column, and an Actions column \u00b7 wrap `el-button` as `AppButton` \u00b7 write three Storybook stories for `BaseButton` (default, loading, disabled).\n\n## \u25b6 COMPANY STEP 61\nPick one library and rebuild the Seller Chat Orders screen as a table with sort and a status tag, wrapped in your own `OrdersTable` component.\n\n---\n\n# MODULE 62 \u2014 INTERNATIONALISATION (i18n), DATES, NUMBERS, REGEX \ud83d\udfe1\n\n## 62.1 i18n with vue-i18n \ud83d\udfe1\n**i18n** = building the app so text, dates and numbers adapt to the user's language/region. Seller Chat sells in India and Indonesia: users may need English, Hindi, Bahasa.\n```js\nimport { createI18n } from 'vue-i18n'\nexport const i18n = createI18n({\n  legacy: false, locale: 'en', fallbackLocale: 'en',\n  messages: {\n    en: { chat: { title: 'Chats', unread: 'No unread | {n} unread message | {n} unread messages' } },\n    id: { chat: { title: 'Obrolan', unread: 'Tidak ada | {n} pesan belum dibaca | {n} pesan belum dibaca' } },\n  },\n})\napp.use(i18n)\n```\n```vue\n<script setup>\nimport { useI18n } from 'vue-i18n'\nconst { t, locale } = useI18n()\n<\/script>\n<template>\n  <h1>{{ t('chat.title') }}<\/h1>\n  <p>{{ t('chat.unread', { n: count }, count) }}<\/p>                  <!-- 3rd arg picks the plural form -->\n  <select v-model=\"locale\"><option value=\"en\">English<\/option><option value=\"id\">Bahasa<\/option><\/select>\n<\/template>\n```\n**Rules:**\n- **No hard-coded user-facing strings** in templates: everything is a key.\n- Keys grouped by feature (`chat.title`), not by page position.\n- Translate **whole sentences**, never concatenate fragments (`t('hello') + name + t('welcome')`): word order differs by language.\n- Use placeholders: `'Hello {name}'`.\n- Plan **text expansion**: German is ~30% longer; don't fix button widths.\n- **RTL languages** (Arabic): use logical CSS (`margin-inline-start`, not `margin-left`).\n- Load languages **lazily** (dynamic `import()` per locale) to keep the bundle small.\n- Format dates/numbers with the locale, not by hand.\n\n## 62.2 Dates and times: the frequent bug source \ud83d\udd34\n**Golden rules:** the backend sends and stores **instants in UTC, ISO-8601** (`2026-10-30T09:12:00Z`); the frontend converts to the user's time zone **only for display**.\n```js\nconst d = new Date('2026-10-30T09:12:00Z')                       // an absolute instant\nnew Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short' }).format(d)   // \"30 Oct 2026, 2:42 pm\" (IST)\nnew Intl.RelativeTimeFormat('en', { numeric: 'auto' }).format(-2, 'hour')                 // \"2 hours ago\"\n```\n| Pitfall | What happens | Fix |\n|---|---|---|\n| `new Date('2026-10-30')` (date only) | parsed as **UTC midnight** \u2192 may show Oct 29 in US zones | keep date-only values as strings; or append `T00:00:00` for local |\n| `new Date('30/10/2026')` | invalid/browser-dependent | never parse non-ISO strings |\n| Adding `24*60*60*1000` for \"tomorrow\" | wrong across DST changes | use a date library |\n| Comparing date strings | `'9' > '10'` as strings | compare timestamps/`Date` values |\n| Server in one zone, user in another | shifted times | UTC in API, local at display |\nLibraries: **dayjs** (small), **date-fns**, **Luxon** (best time-zone support). Avoid **moment** (deprecated, large).\n**Money:** keep amounts as integers in minor units (paise/cents) or strings from the backend; never do float math on money (`0.1 + 0.2`).\n```js\nnew Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(1299)       // \"\u20b91,299.00\"\n```\n\n## 62.3 Regular expressions: practical basics \ud83d\udfe1\n```js\n/^\\S+@\\S+\\.\\S+$/.test(email)                                    // rough email shape (the server validates properly)\n'a1b22'.match(/\\d+/g)                                           // ['1','22']\n'2026-10-30'.replace(/(\\d+)-(\\d+)-(\\d+)/, '$3/$2/$1')           // '30/10/2026'\nconst m = /(?<y>\\d{4})-(?<m>\\d{2})/.exec('2026-10'); m.groups.y // named groups: '2026'\n```\n| Token | Meaning | Token | Meaning |\n|---|---|---|---|\n| `.` | any char | `\\d \\w \\s` | digit / word char / whitespace |\n| `^ $` | start / end | `* + ?` | 0+, 1+, 0 or 1 |\n| `{n,m}` | n to m times | `[abc]` | any of a, b, c |\n| `(a\\|b)` | a or b | `(?:\u2026)` | non-capturing group |\n**Cautions:** nested quantifiers like `(a+)+` can hang the browser on crafted input (ReDoS); don't try to fully validate emails/URLs/phone numbers with regex; always test with real samples (regex101.com).\n\n## 62.4 Mistakes and questions\n**Mistakes:** hard-coded strings \u00b7 concatenated translations \u00b7 formatting dates with `getMonth()+1` templates \u00b7 using `toFixed` for money logic \u00b7 parsing non-ISO dates.\n**Q1. How do you store and display dates?** **Q2. Why is `new Date('2026-10-30')` risky?** **Q3. How do you pluralise in i18n?** **Q4. Why avoid concatenating translated fragments?** **Q5. Why not use floats for money?**\n**Exercises:** add English + Bahasa to Seller Chat with a language switcher stored in `localStorage` \u00b7 show \"2 hours ago\" for message times \u00b7 write a regex that extracts an order id (`#A1001`) from message text and link it \u00b7 write tests for a `formatPrice` util.\n\n## \u25b6 COMPANY STEP 62\nReplace every hard-coded string in `ChatSidebar`/`LoginView` with `t(...)` keys; format `lastMessageAt` with `Intl`; format `order.total` with `Intl.NumberFormat`.\n\n---\n\n# MODULE 63 \u2014 BUILD, DEPLOY AND RUN IN PRODUCTION (Docker, nginx, CI/CD) \ud83c\udfed\n\n## 63.1 What actually gets deployed \ud83d\udfe2\n`npm run build` runs Vite, which produces a `dist/` folder: `index.html` + hashed JS/CSS (`app.3f9a1c.js`) + assets. That's it: **static files**. A Vue SPA needs only:\n1. a **static file server** (nginx),\n2. a **fallback to `index.html`** for client-side routes,\n3. a **reverse proxy** to the Spring API (so browser and API share one origin \u2192 no CORS).\n```\nBrowser \u2500\u2500\u25b6 nginx \u2500\u252c\u2500 /assets/*, /index.html  \u2192 static files from dist/\n                   \u251c\u2500 /api/*                  \u2192 proxy_pass \u2192 Spring Boot service\n                   \u2514\u2500 any other path          \u2192 index.html (Vue Router takes over)\n```\n\n## 63.2 nginx configuration \ud83d\udfe1\n```nginx\nserver {\n  listen 80;\n  root /usr/share/nginx/html;\n  index index.html;\n\n  location /assets/ { expires 1y; add_header Cache-Control \"public, immutable\"; }   # hashed names: cache forever\n  location = /index.html { add_header Cache-Control \"no-store\"; }                    # always fetch the newest shell\n  location /api/ {\n    proxy_pass http://backend:8080;\n    proxy_set_header Host $host;\n    proxy_set_header X-Request-Id $request_id;                                        # correlate with backend logs\n  }\n  location / { try_files $uri /index.html; }                                          # history-mode fallback\n\n  add_header X-Frame-Options DENY;\n  add_header X-Content-Type-Options nosniff;\n  add_header Content-Security-Policy \"default-src 'self'; connect-src 'self' https://api.company.com; frame-ancestors 'none'\";\n  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;\n}\n```\n**Why two caching rules:** JS/CSS filenames contain a content hash, so a new release has new names; old ones can be cached for a year. `index.html` has a fixed name and points at the current hashed files, so it must never be cached.\n\n## 63.3 Docker: multi-stage build \ud83d\udfe1\n```dockerfile\n# stage 1: build with Node\nFROM node:20-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci                          # exact versions from package-lock.json (reproducible)\nCOPY . .\nRUN npm run build                   # \u2192 /app/dist\n\n# stage 2: tiny runtime image with only nginx + static files\nFROM nginx:alpine\nCOPY --from=build /app/dist /usr/share/nginx/html\nCOPY nginx.conf /etc/nginx/conf.d/default.conf\nEXPOSE 80\n```\n**Concepts:** an **image** is a recipe/snapshot, a **container** is a running instance \u00b7 each instruction is a cached **layer** (copying `package*.json` before the source means dependencies are reinstalled only when they change) \u00b7 **multi-stage** keeps Node and `node_modules` out of the final image (smaller, safer: fewer CVEs for Trivy to find).\n```bash\ndocker build -t seller-chat-ui:1.4.0 .\ndocker run -p 8081:80 seller-chat-ui:1.4.0        # open http://localhost:8081\n```\n`.dockerignore`: `node_modules`, `dist`, `.git`, `.env*`.\n`npm ci` vs `npm install`: `ci` installs exactly the lockfile (fails if out of sync), deletes `node_modules` first: use it in CI and Docker.\n\n## 63.4 CI/CD: the pipeline \ud83c\udfed\n```\npush / PR \u2500\u25b6 checkout \u2500\u25b6 npm ci \u2500\u25b6 lint \u2500\u25b6 unit tests + coverage \u2500\u25b6 build\n          \u2500\u25b6 security scan (npm audit, Trivy on the image) \u2500\u25b6 SonarQube quality gate\n          \u2500\u25b6 build & push image \u2500\u25b6 deploy to dev \u2500\u25b6 smoke / E2E tests \u2500\u25b6 promote staging \u2500\u25b6 prod\n```\n**Common failures and what they mean:**\n| Failure | Cause | Fix |\n|---|---|---|\n| Lint error | style/rule violation | `npm run lint -- --fix`, then fix manually |\n| Test failure | broken or flaky test | reproduce locally with the same Node version |\n| Coverage below threshold | new code untested | add tests |\n| Vulnerable dependency (`npm audit`/Trivy HIGH) | outdated package/base image | upgrade package or pin patched version; update base image |\n| Build OOM / `JavaScript heap out of memory` | big bundle | `NODE_OPTIONS=--max-old-space-size=4096`; split chunks |\n| `Cannot find module` | lockfile out of sync / case-sensitive path on Linux | `npm ci`; fix import path casing |\n| Env variable missing | not set in the pipeline | add to CI config |\n| Node version mismatch | local 20, CI 16 | `.nvmrc` / `engines` field |\n**Read CI logs from the first red line upward**, not from the bottom: the first error is the cause; the rest is fallout.\n\n## 63.5 Environments, config and feature flags \ud83c\udfed\n- `VITE_*` variables are **baked into the bundle at build time**: so one build per environment, **or** load a runtime `config.json` (fetched on startup or generated by nginx) so the **same image** runs in dev/staging/prod.\n- They're **public**: never put secrets in them (Module 45).\n- **Feature flags** switch features on/off without redeploying: gradual rollout (5% \u2192 100%), per-company enablement, and a **kill switch** if a release misbehaves.\n```js\nconst flags = await fetch('/config/flags.json').then(r => r.json())\nconst showAttachOrder = flags.attachOrder === true\n```\n\n## 63.6 Release problems you'll actually hit \ud83c\udfed\n**\"Loading chunk failed\" / blank page after deploy:** the user's open tab still has the old `index.html`, which requests old hashed chunks that the new deploy deleted. Mitigations: keep previous assets for a while, `index.html` no-cache, and handle it in code:\n```js\nwindow.addEventListener('vite:preloadError', () => window.location.reload())   // new version exists \u2192 reload\n```\nAlso show a **\"New version available: Refresh\"** banner (poll `/version.json`). **Rollback plan:** keep the previous image tag; rolling back = redeploy it. **Smoke test after deploy:** open the app, log in, load chats.\n\n## 63.7 Mistakes and questions\n**Mistakes:** forgetting the `try_files` fallback (refresh = 404) \u00b7 caching `index.html` \u00b7 `npm install` in CI \u00b7 committing `.env.production` with real values \u00b7 one huge image with Node inside \u00b7 deploying without a rollback.\n**Q1. How do you serve a Vue SPA in production?** **Q2. Why hashed filenames and long cache?** **Q3. `npm ci` vs `npm install`?** **Q4. What is a multi-stage Docker build?** **Q5. How do you run the same build in all environments?** runtime config. **Q6. What causes \"Loading chunk failed\" after a deploy?** **Q7. How do you read a failed CI log?**\n**Exercises:** write the Dockerfile + nginx.conf for Seller Chat and run it locally \u00b7 break it (remove `try_files`) and observe the 404 on refresh \u00b7 add a `/version.json` and a \"new version\" banner \u00b7 write the CI stages for your repo as a checklist.\n\n## \u25b6 COMPANY STEP 63\nContainerise Seller Chat: Dockerfile, `nginx.conf` with `/api` proxy and history fallback, `docker run`, then log in against the Spring backend through nginx (no CORS config needed).\n\n---\n\n# MODULE 64 \u2014 SPRING BOOT FOR FRONTEND DEVELOPERS \ud83d\udfe1\ud83c\udfed\n\nYou already write Spring Boot, so this module is about seeing the **same endpoint from the other side**: what the frontend sends, how Spring reads it, and why requests fail.\n\n## 64.1 Mapping HTTP \u2194 Spring \ud83d\udfe1\n```java\n@RestController @RequestMapping(\"/api/orders\")\nclass OrderController {\n  @GetMapping                    Page<OrderDto> list(@RequestParam(required=false) String status, Pageable p)           // GET /api/orders?status=PAID&page=0&size=20&sort=createdAt,desc\n  @GetMapping(\"/{id}\")           OrderDto get(@PathVariable Long id)                                                       // GET /api/orders/5\n  @PostMapping                   ResponseEntity<OrderDto> create(@Valid @RequestBody CreateOrderRequest r)                 // JSON body \u2192 record\n  @PutMapping(\"/{id}\")           OrderDto replace(@PathVariable Long id, @Valid @RequestBody OrderRequest r)\n  @PatchMapping(\"/{id}/status\")  OrderDto status(@PathVariable Long id, @RequestBody StatusRequest r)\n  @DeleteMapping(\"/{id}\")        ResponseEntity<Void> delete(@PathVariable Long id)                                        // 204 No Content\n}\n```\n| Frontend sends | Spring reads it with |\n|---|---|\n| `?status=PAID` (Axios `params`) | `@RequestParam` |\n| `/orders/5` | `@PathVariable` |\n| JSON body (`Content-Type: application/json`) | `@RequestBody` |\n| `Authorization: Bearer \u2026` | Spring Security filter \u2192 `@AuthenticationPrincipal` |\n| `multipart/form-data` (`FormData`) | `@RequestParam MultipartFile` |\n| `page=0&size=20&sort=createdAt,desc` | `Pageable` |\n| cookie | `@CookieValue` / security session |\n\n## 64.2 Reading a contract \ud83d\udfe1\n**Start at Swagger/OpenAPI** (`/swagger-ui.html`): lists endpoints, request/response schemas and example payloads. Then check the DTO class.\n| Java | JSON on the wire | Frontend note |\n|---|---|---|\n| `String` | string | |\n| `Long` / `Integer` | number | very large `Long` loses precision in JS (> 2^53): send as string |\n| `BigDecimal` | number | don't do float math on it |\n| `LocalDateTime` / `Instant` | ISO string (if configured) | check timezone meaning (Module 62) |\n| `enum` | string name | mirror it as a TS union |\n| `null` / `Optional.empty` | `null` or omitted | guard with `?.` / defaults |\n| `List<T>` | array | may be empty, never assume `[0]` exists |\n| `Page<T>` | `{content, totalElements, totalPages, number, size}` | |\nUnknown JSON fields are ignored or rejected depending on `FAIL_ON_UNKNOWN_PROPERTIES`: if you send an extra field and get 400, that's why.\n\n## 64.3 Status codes and error bodies \ud83d\udfe1\n`@RestControllerAdvice` turns exceptions into responses. Agree with the backend on **one** error shape.\n| Status | Meaning | UI reaction |\n|---|---|---|\n| 200/201/204 | OK / created / no content | success |\n| 400 | malformed or invalid input (`MethodArgumentNotValidException`) | show field errors from `errors[]` |\n| 401 | not authenticated / token expired | clear session \u2192 login |\n| 403 | authenticated but not allowed | \"no permission\" message |\n| 404 | not found | empty/not-found state |\n| 409 | conflict (duplicate, version clash) | explain and offer refresh |\n| 415 | unsupported media type | you sent the wrong/missing `Content-Type` |\n| 422 | semantically invalid (used by some teams instead of 400) | field errors |\n| 429 | rate limited | back off and retry later |\n| 500/502/503 | server error / gateway / unavailable | generic message + retry; include request id |\n```json\n{ \"status\": 400, \"message\": \"Validation failed\", \"errors\": [ { \"field\": \"email\", \"message\": \"must be a well-formed email address\" } ], \"traceId\": \"9b2c\u2026\" }\n```\n**Debug mapping:** 415 \u2192 check headers \u00b7 400 \u2192 compare your payload to the DTO field names/types \u00b7 401 \u2192 token missing/expired \u00b7 403 \u2192 permission/role or CSRF \u00b7 CORS error with no status \u2192 preflight failed (backend CORS config) \u00b7 404 on only POST \u2192 wrong path or method.\n\n## 64.4 CORS and cookies \ud83d\udfe1\n**CORS** = the browser asks the API \"may a page from origin X call you?\" (a preflight `OPTIONS` request for non-simple calls). The **backend** answers; frontend code can't fix it.\n```java\nregistry.addMapping(\"/api/**\").allowedOrigins(\"https://app.company.com\").allowedMethods(\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\").allowedHeaders(\"*\").allowCredentials(true);\n```\n`allowedOrigins(\"*\")` cannot be combined with credentials. In dev, avoid CORS entirely with the Vite proxy; in production use nginx same-origin. For cookie auth the frontend must send `withCredentials: true` (Axios) / `credentials: 'include'` (fetch), and the cookie needs correct `SameSite`/`Secure`.\n\n## 64.5 Pagination, sorting, search contracts \ud83d\udfe1\nSpring `Pageable` accepts `page` (0-based!), `size`, `sort=field,asc|desc`. Your UI usually shows pages 1-based: convert. For large, changing data (chat history) prefer **cursor pagination** (`before=<lastId>&limit=30`): stable when new rows arrive, unlike offset pages.\n\n## 64.6 What sits behind your UI \ud83c\udfed\n**Redis** caches hot reads (unread counts, sessions, rate limits): data may be seconds stale. **Kafka** carries events between services (message sent \u2192 notification service, analytics): processing is **asynchronous**. **PostgreSQL/MongoDB** persist data. Consequence: **eventual consistency**: after `POST` succeeds, the list endpoint may not reflect it for a moment. Design the UI to tolerate it: optimistic update, refetch with a short delay or on focus, \"pull to refresh\", and never block the user waiting for a read-after-write guarantee that the system doesn't offer.\n**Idempotency:** a double-
