ors to include it. Child component internals are not matched; use `:deep(.child-class)`. Use `:global()` for global rules.\n\n**Q40 \ud83d\udfe1 BEM and why?**\nBlock__Element--Modifier naming gives flat, low-specificity, collision-free class names that document structure (`.chat-item__badge--unread`).\n\n---\n## C. JavaScript fundamentals (Q41\u2013Q70)\n\n**Q41 \ud83d\udfe2 `var`, `let`, `const`?**\nvar: function-scoped, hoisted as undefined, redeclarable. let/const: block-scoped, in the temporal dead zone until declared; const can't be reassigned (object contents can still mutate). Default to const.\n\n**Q42 [OUT] \ud83d\udfe2**\n```js\nconsole.log(typeof null, typeof [], typeof undefined, typeof NaN)\n```\n`\"object\" \"object\" \"undefined\" \"number\"` (historic null bug; arrays are objects; NaN is a number).\n\n**Q43 \ud83d\udfe2 `==` vs `===`?**\n`==` coerces types (`0 == \"0\"` true, `null == undefined` true); `===` compares value and type with no coercion. Use `===`.\n\n**Q44 [OUT] \ud83d\udfe1**\n```js\nconsole.log(1 + \"2\", \"3\" - 1, [] + [], true + 1, \"5\" * \"2\")\n```\n`\"12\"  2  \"\"  2  10` \u2014 `+` concatenates when a string is involved; `-`/`*` convert to numbers.\n\n**Q45 \ud83d\udfe2 `null` vs `undefined`?**\n`undefined`: declared but unassigned / missing property / no return value; `null`: explicit \"no value\". `null == undefined` true, `===` false.\n\n**Q46 \ud83d\udfe1 `??` vs `||`?**\n`||` falls back on any falsy (0, \"\", false); `??` only on null/undefined. `count ?? 10` preserves 0.\n\n**Q47 \ud83d\udfe2 List falsy values.**\n`false, 0, -0, 0n, \"\", null, undefined, NaN`. Everything else (including `[]`, `{}`, `\"0\"`) is truthy.\n\n**Q48 [OUT] \ud83d\udfe1**\n```js\nconsole.log(0.1 + 0.2 === 0.3, 9007199254740993)\n```\n`false` (binary floating point: 0.30000000000000004) and `9007199254740992` (beyond MAX_SAFE_INTEGER, precision lost). For money use integer minor units; for big IDs use strings/BigInt.\n\n**Q49 \ud83d\udfe2 Primitive vs reference types behaviour on copy?**\nPrimitives are copied by value; objects/arrays copy the reference, so two variables point to the same object and mutations are shared.\n\n**Q50 \ud83d\udfe1 Shallow vs deep copy, how to deep copy?**\nSpread/`Object.assign`/`slice` copy only the top level; nested objects remain shared. Use `structuredClone` (modern), or JSON round-trip (loses Dates/functions/undefined/Map/Set).\n\n**Q51 \ud83d\udfe1 What is optional chaining and why use it?**\n`a?.b?.c` short-circuits to `undefined` when a link is null/undefined rather than throwing `TypeError: Cannot read properties of undefined`. Essential for partially present API data.\n\n**Q52 \ud83d\udfe2 `for...of` vs `for...in` vs `forEach`?**\n`for...of` iterates values of iterables (supports `break`/`await`); `for...in` iterates enumerable keys (including inherited; don't use on arrays); `forEach` calls a callback per element (no `break`, ignores returned promises).\n\n**Q53 \ud83d\udfe2 Function declaration vs expression vs arrow?**\nDeclarations are hoisted fully; expressions/arrows exist only after assignment. Arrows have no own `this`, `arguments`, can't be constructors and allow concise implicit return.\n\n**Q54 [OUT] \ud83d\udfe1**\n```js\nconsole.log(add(1,2)); function add(a,b){return a+b}\nconsole.log(sub(1,2)); var sub = (a,b)=>a-b\n```\n`3`, then `TypeError: sub is not a function` (var hoisted as undefined; the assignment hasn't run).\n\n**Q55 \ud83d\udfe1 What are higher-order functions? Examples.**\nFunctions that take and/or return functions: `map/filter/reduce`, `setTimeout`, event handlers, `debounce(fn)`, Vue `computed(() => \u2026)`.\n\n**Q56 \ud83d\udfe1 Pure function and why it matters?**\nSame input \u2192 same output with no side effects. Easy to test, cache, reason about; required for `computed`, reducers, memoisation.\n\n**Q57 \ud83d\udfe1 Rest vs spread?**\nSame `...`; rest collects (parameters/destructuring: `(...args)`, `{a, ...others}`), spread expands (`[...arr]`, `{...obj}`, `fn(...args)`).\n\n**Q58 [OUT] \ud83d\udfe1**\n```js\n[1,2,3].map(parseInt)\n```\n`[1, NaN, NaN]`: map passes (value,index), so `parseInt('2',1)` and `parseInt('3',2)` are invalid radixes.\n\n**Q59 \ud83d\udfe1 Which array methods mutate?**\n`push, pop, shift, unshift, splice, sort, reverse, fill, copyWithin`. Non-mutating: `map, filter, slice, concat, flat, find, includes, toSorted, toReversed`...\n\n**Q60 \ud83d\udfe1 Why does `[10,9,1].sort()` give `[1,10,9]`?**\nDefault comparator converts to strings and compares UTF-16 order. Pass `(a,b)=>a-b`.\n\n**Q61 [IMP] \ud83d\udfe1 Group orders by status with reduce.**\n```js\nconst byStatus = orders.reduce((acc, o) => { (acc[o.status] ??= []).push(o); return acc }, {})\n```\nAccumulator starts as `{}`; each iteration pushes the order into its status bucket (creating it with `??=`).\n\n**Q62 [IMP] \ud83d\udfe1 Remove duplicates from an array of ids.**\n`[...new Set(ids)]`; for objects by key: `[...new Map(items.map(i => [i.id, i])).values()]`.\n\n**Q63 \ud83d\udfe1 `map` vs `forEach`; `find` vs `filter`; `some` vs `every`?**\nmap returns new array; forEach returns undefined. find returns first element/undefined; filter returns array of all matches. some = any; every = all (both short-circuit).\n\n**Q64 \ud83d\udfe1 Time complexity of `includes`, `Set.has`, `shift`, `push`?**\n`includes` O(n), `Set.has` O(1) average, `shift` O(n) (re-index), `push` O(1) amortised. For repeated lookups convert to Map/Set.\n\n**Q65 \ud83d\udfe1 `Object.freeze` vs `const` vs `seal`?**\n`const` prevents rebinding; `freeze` (shallow) prevents adding/removing/changing properties; `seal` prevents adding/removing but allows value changes.\n\n**Q66 \ud83d\udfe1 Dot vs bracket notation, computed keys?**\nDot for static identifiers; bracket for dynamic/special keys (`obj[field]`, `obj['home-city']`). Computed keys `{ [field]: value }` build objects dynamically (form handlers).\n\n**Q67 \ud83d\udfe1 Destructuring and common uses?**\nPull values from arrays/objects into variables, with defaults/renames/nesting: `const { data, error = null } = res`, `const [a, b] = pair`, function parameters `({ id, name })`.\n\n**Q68 \ud83d\udfe1 What does `JSON.stringify` drop?**\n`undefined`, functions, symbols (omitted); Dates become strings; Map/Set become `{}`; NaN/Infinity \u2192 null; circular refs throw.\n\n**Q69 \ud83d\udfe1 How are Java types represented in JSON/JS?**\nPOJO/record \u2192 object; List \u2192 array; `LocalDateTime/Instant` \u2192 ISO string (parse with `new Date`); Long \u2192 number (precision issue > 2^53, so sometimes string); enum \u2192 string; `Optional.empty`/null \u2192 null/omitted.\n\n**Q70 \ud83d\udfe2 What is template literal and what can it do?**\nBacktick strings with `${expr}` interpolation and multi-line support; also tagged templates.\n\n---\n## D. Advanced JavaScript (Q71\u2013Q100)\n\n**Q71 \ud83d\udfe1 Explain scope chain and lexical scope.**\nScope is determined by where code is written. When a variable is referenced, the engine looks in the current scope, then each enclosing scope outward to global; first match wins, none \u2192 ReferenceError.\n\n**Q72 [OUT] \ud83d\udfe1**\n```js\nvar x = 1; function f(){ console.log(x); var x = 2 } f()\n```\n`undefined`: local `x` is hoisted (undefined) and shadows the outer.\n\n**Q73 \ud83d\udfe1 What is hoisting and the TDZ?**\nDeclarations are registered at scope creation. `var` \u2192 initialised to undefined; functions \u2192 fully; `let/const/class` \u2192 registered but uninitialised until their line (TDZ) so access throws ReferenceError.\n\n**Q74 \ud83d\udd34 What is an execution context?**\nThe environment for running code: variable environment, lexical environment (with outer reference), and `this`. Global context is created once; a function context is created per call, pushed on the call stack and popped on return; two phases: creation (hoisting) and execution.\n\n**Q75 \ud83d\udfe1 What is a closure? Give a practical use.**\nA function bundled with the lexical environment where it was created, so it can access those variables even after the outer function returned. Uses: private state, function factories, debounce/throttle, memoisation, event handlers remembering context.\n\n**Q76 [OUT] \ud83d\udfe1**\n```js\nfor (var i=0;i<3;i++) setTimeout(()=>console.log(i),0)\nfor (let j=0;j<3;j++) setTimeout(()=>console.log(j),0)\n```\n`3 3 3` then `0 1 2`: `var` has one shared binding; `let` creates a new binding per iteration captured by each closure.\n\n**Q77 [IMP] \ud83d\udfe1 Implement debounce.**\n```js\nconst debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } }\n```\nThe closure holds `t`; every call cancels the pending timer, so `fn` fires only after `ms` of silence.\n\n**Q78 \ud83d\udfe1 Debounce vs throttle with use cases?**\nDebounce: run after calls stop (search-as-you-type, autosave, resize end). Throttle: run at most once per interval (scroll, mousemove, window resize updates).\n\n**Q79 [IMP] \ud83d\udfe1 Implement memoize and `once`.**\nCache by serialised args in a Map; `once` keeps a `done` flag and stored result in the closure.\n\n**Q80 \ud83d\udfe1 How is `this` determined?**\nBy call site: `obj.fn()` \u2192 obj; plain call \u2192 undefined (strict)/window; `new` \u2192 new object; `call/apply/bind` \u2192 given; arrow \u2192 lexical `this` from definition.\n\n**Q81 [OUT] \ud83d\udfe1**\n```js\nconst o = { n: 'a', f() { return this.n }, g: () => this.n }\nconst h = o.f\nconsole.log(o.f(), h(), o.g())\n```\n`\"a\"`, `undefined` (detached: this is undefined/global \u2192 `undefined.n` throws in strict; in sloppy gives undefined), `undefined` (arrow's `this` is outer scope). Know both strict/sloppy results.\n\n**Q82 \ud83d\udfe1 call vs apply vs bind?**\n`call(thisArg, a, b)` invokes now with listed args; `apply(thisArg, [a,b])` with array; `bind(thisArg, ...)` returns a new function with fixed `this` (and partial args) for later.\n\n**Q83 \ud83d\udd34 Explain the prototype chain.**\nObjects have an internal `[[Prototype]]` link; property lookup walks object \u2192 prototype \u2192 \u2026 \u2192 `null`. Methods like `map` live on `Array.prototype` and are shared. `Object.create(p)` sets the link; `class extends` wires prototypes.\n\n**Q84 \ud83d\udfe1 Are JS classes real classes?**\nThey're syntax over prototypes/constructor functions; `typeof Class === 'function'`; methods go on the prototype; `#private` fields and `static` exist; no interfaces/abstract/overloading (unlike Java).\n\n**Q85 \ud83d\udd34 What does `new` do?**\nCreates an empty object, links its prototype to `Constructor.prototype`, calls the constructor with `this` = that object, returns it (unless the constructor returns another object).\n\n**Q86 \ud83d\udfe1 `Map` vs object; `Set` vs array?**\nMap: any key type, ordered, `.size`, better for frequent add/remove. Set: unique values with O(1) `has`. Objects are better for fixed-shape records/JSON.\n\n**Q87 \ud83d\udd34 WeakMap use cases?**\nKeys are objects held weakly (GC'd when unreferenced), not iterable. Used for private data per object and caches/metadata without leaks; Vue's reactivity registry uses a WeakMap target\u2192deps.\n\n**Q88 \ud83d\udd34 Iterators and generators?**\nAn iterable has `[Symbol.iterator]()` returning an iterator with `next() \u2192 {value, done}`; `for...of`/spread consume it. Generators (`function*` + `yield`) are functions that pause/resume and are an easy way to write iterators; async/await is built on the same pause-resume idea.\n\n**Q89 \ud83d\udfe1 ES modules vs CommonJS?**\nESM: static `import/export`, live bindings, async-loadable, tree-shakeable, browser-native. CJS: `require()`/`module.exports`, synchronous, dynamic, Node legacy.\n\n**Q90 \ud83d\udfe1 Named vs default exports?**\nDefault: one per file, import under any name. Named: many, imported by exact name (better for refactoring/auto-import/tree-shaking). Many teams prefer named.\n\n**Q91 \ud83d\udd34 What is tree shaking?**\nBuild-time removal of unused exports, relying on static ES module structure and side-effect-free code (`\"sideEffects\": false`). Import `{ debounce } from 'lodash-es'`, not the whole lodash CJS.\n\n**Q92 \ud83d\udfe1 Strict mode?**\nOpt-in (and default in modules/classes) stricter semantics: undeclared variable assignment throws, `this` undefined in plain functions, duplicate params prohibited.\n\n**Q93 [IMP] \ud83d\udd34 Implement `Promise.all`.**\n```js\nconst all = ps => new Promise((res, rej) => { const out = []; let n = 0\n  if (!ps.length) return res(out)\n  ps.forEach((p, i) => Promise.resolve(p).then(v => { out[i] = v; if (++n === ps.length) res(out) }, rej)) })\n```\nIndex-preserving results; rejects on first failure.\n\n**Q94 [IMP] \ud83d\udd34 Implement a simple EventEmitter.**\nKeep a `Map<string, Set<fn>>`; `on` adds, `off` removes, `emit` calls each with args; return an unsubscribe from `on`.\n\n**Q95 \ud83d\udd34 How would you implement `bind`?**\n```js\nFunction.prototype.myBind = function (ctx, ...pre) { const fn = this; return function (...a) { return fn.apply(ctx, [...pre, ...a]) } }\n```\n(Full version handles `new`.)\n\n**Q96 \ud83d\udfe1 Immutability in JS: why and how?**\nPredictable state, easy change detection and undo. Use spread, `map/filter`, `toSorted`, `structuredClone`, `Object.freeze` in dev. In Vue you may mutate reactive state, but never props.\n\n**Q97 \ud83d\udfe1 What are Symbols used for?**\nUnique property keys (no collisions), well-known protocols (`Symbol.iterator`), hidden metadata; also used as inject keys.\n\n**Q98 \ud83d\udd34 What are property descriptors / getters & setters?**\nEach property has `value/writable/enumerable/configurable` (or `get/set`). `Object.defineProperty` customises them; getters/setters compute on access/assignment. Vue 2 reactivity used them; Vue 3 uses Proxy.\n\n**Q99 \ud83d\udd34 What is a Proxy and how does it relate to Vue 3?**\n`new Proxy(target, { get, set, deleteProperty, has })` intercepts operations on an object. Vue 3 wraps state in proxies: `get` tracks the active effect, `set` triggers dependents, so adds/deletes/array index changes are detected (unlike Vue 2).\n\n**Q100 \ud83d\udfe1 What are common sources of memory leaks in JS apps?**\nUn-cleared timers/intervals, global listeners, WebSocket/observers never closed, closures retaining large objects/DOM nodes, ever-growing caches/arrays, detached DOM nodes. Fix with cleanup in `onUnmounted`, WeakMap, bounded caches; verify with heap snapshots.\n\n---\n## E. DOM and events (Q101\u2013Q115)\n\n**Q101 \ud83d\udfe2 `getElementById` vs `querySelector`?**\n`getElementById` is faster but id-only; `querySelector` accepts any CSS selector and returns the first match; `querySelectorAll` returns a static NodeList.\n\n**Q102 \ud83d\udfe2 `textContent` vs `innerText` vs `innerHTML`?**\ntextContent: raw text, fast, safe. innerText: rendered text respecting CSS/hidden content, triggers layout. innerHTML: parses HTML (XSS risk, destroys child listeners).\n\n**Q103 \ud83d\udfe1 Event bubbling vs capturing?**\nEvents travel capture (root \u2192 target) then bubble (target \u2192 root). Listeners default to the bubbling phase; `{capture:true}` listens during capture.\n\n**Q104 \ud83d\udfe1 What is event delegation and its benefits?**\nOne listener on a parent uses `event.target.closest(selector)` to handle events of many/dynamic children: fewer listeners, less memory, works for later-added elements.\n\n**Q105 \ud83d\udfe1 `preventDefault` vs `stopPropagation`?**\nThe first cancels the browser's default action (submit, navigation); the second stops the event from propagating to ancestors. They're independent.\n\n**Q106 \ud83d\udfe1 `target` vs `currentTarget`?**\n`target` is the element that triggered the event (deepest); `currentTarget` is the element the handler is attached to.\n\n**Q107 \ud83d\udfe1 `input` vs `change` events?**\n`input` fires on each value change (typing); `change` fires when committed (blur for text, immediately for checkbox/select).\n\n**Q108 \ud83d\udfe1 How to remove an event listener?**\nSame function reference + options: `removeEventListener('click', handler)`; anonymous functions can't be removed; or use `{ signal }` with AbortController, or `{ once: true }`.\n\n**Q109 [DBG] \ud83d\udfe1 Clicking dynamically added buttons does nothing.**\nListeners were attached to the existing elements only (e.g. `querySelectorAll(...).forEach(add)`). Use delegation on a stable parent.\n\n**Q110 \ud83d\udfe1 How do you batch DOM updates for performance?**\nDocumentFragment, `replaceChildren`, build strings once, toggle classes instead of many styles, separate reads from writes, `requestAnimationFrame` for visual updates.\n\n**Q111 \ud83d\udfe1 What is a `NodeList` vs `HTMLCollection` vs array?**\nBoth are array-like, not arrays; NodeList from `querySelectorAll` is static (and has forEach); HTMLCollection from `getElementsBy*` is live. Convert with `Array.from`/spread.\n\n**Q112 \ud83d\udfe1 localStorage vs sessionStorage vs cookies vs IndexedDB?**\nlocalStorage persistent per origin, ~5MB, sync strings. sessionStorage per tab. Cookies are sent with every request (use for session ids with HttpOnly/Secure/SameSite). IndexedDB is async, large structured data.\n\n**Q113 \ud83d\udfe1 How does a SPA change the URL without reload?**\nHistory API (`pushState/replaceState` + `popstate`); Vue Router intercepts link clicks and renders components; the server must serve `index.html` for unknown paths.\n\n**Q114 \ud83d\udfe1 WebSocket vs SSE vs polling?**\nPolling: repeated requests (simple, wasteful, latency). SSE: one-way server\u2192client streaming over HTTP with auto-reconnect. WebSocket: persistent two-way channel (chat); needs reconnect/backoff logic and `wss://`.\n\n**Q115 \ud83d\udd34 What is IntersectionObserver for?**\nAsynchronously observing element visibility; used for lazy loading images, infinite scroll sentinels, analytics, without scroll handlers.\n\n---\n## F. Asynchronous JavaScript and event loop (Q116\u2013Q140)\n\n**Q116 \ud83d\udfe2 Synchronous vs asynchronous?**\nSync code runs line by line, each waiting for the previous. Async starts a long task (network/timer) and continues; the result is handled later via callback/promise. Prevents freezing the single thread.\n\n**Q117 \ud83d\udfe1 What is callback hell and how do promises fix it?**\nDeeply nested callbacks with repeated error handling. Promises chain flat (`.then`), propagate errors to a single `.catch`, and compose (`all`, `race`).\n\n**Q118 \ud83d\udfe1 Promise states?**\npending \u2192 fulfilled or rejected (settled); immutable once settled; `.then` always runs asynchronously (microtask).\n\n**Q119 \ud83d\udfe1 What does `.then()` return?**\nA new promise resolved with the callback's return value (or the promise it returns); a thrown error rejects it. That's what enables chaining. Forgetting `return` yields `undefined` downstream.\n\n**Q120 \ud83d\udfe1 `Promise.all` vs `allSettled` vs `race` vs `any`?**\nall: all fulfil (rejects on first rejection). allSettled: always fulfils with each outcome. race: first to settle. any: first to fulfil (rejects with AggregateError if all reject).\n\n**Q121 \ud83d\udfe2 What does `async` do and what does `await` do?**\n`async` makes a function return a promise (and allows `await`). `await` pauses that function until the promise settles, returning the value or throwing the rejection, without blocking the thread.\n\n**Q122 [DBG] \ud83d\udfe1 Why are these slow?**\n```js\nconst a = await getA(); const b = await getB()   // independent\n```\nSequential awaits double the latency. Use `await Promise.all([getA(), getB()])`.\n\n**Q123 [DBG] \ud83d\udfe1 `console.log` shows `[object Promise]` / `Promise {<pending>}`.**\nYou forgot `await` (or `.then`) on an async call.\n\n**Q124 [DBG] \ud83d\udfe1 `items.forEach(async i => await save(i))` doesn't wait.**\n`forEach` ignores returned promises. Use `for...of` with await (sequential) or `await Promise.all(items.map(save))` (parallel).\n\n**Q125 \ud83d\udfe1 Does `fetch` reject on HTTP 404/500?**\nNo; it rejects only on network errors/abort. Check `response.ok`/status and throw yourself.\n\n**Q126 \ud83d\udfe1 How do you cancel a fetch?**\n`AbortController`: `fetch(url, { signal })`, call `controller.abort()`; catch `AbortError`. Used for stale search requests, unmount cleanup, timeouts (`AbortSignal.timeout(ms)`).\n\n**Q127 \ud83d\udfe1 How do you handle errors in async/await?**\n`try/catch/finally` around awaited calls; or `.catch` on the promise; handle unhandled rejections globally. Distinguish expected errors (400/401) from unexpected.\n\n**Q128 \ud83d\udd34 Explain the event loop.**\nJS runs on one call stack. Async work is delegated to Web APIs; completed callbacks wait in the task (macrotask) queue or microtask queue. When the stack is empty the loop drains **all** microtasks, may render, then takes **one** macrotask, repeating.\n\n**Q129 \ud83d\udd34 Microtask vs macrotask?**\nMicrotasks: promise reactions, `await` continuations, `queueMicrotask`, MutationObserver; run right after the current task, before rendering. Macrotasks: `setTimeout/Interval`, UI events, MessageChannel; one per loop iteration.\n\n**Q130 [OUT] \ud83d\udd34**\n```js\nconsole.log('A')\nsetTimeout(() => console.log('B'), 0)\nPromise.resolve().then(() => console.log('C'))\nconsole.log('D')\n```\n`A D C B`: sync first; promise microtask before the timer macrotask.\n\n**Q131 [OUT] \ud83d\udd34**\n```js\nasync function f(){ console.log(1); await null; console.log(2) }\nconsole.log(0); f(); console.log(3)\n```\n`0 1 3 2`: code before the first `await` is synchronous; the continuation is a microtask.\n\n**Q132 [OUT] \ud83d\udd34**\n```js\nsetTimeout(()=>console.log('t1'),0)\nPromise.resolve().then(()=>{ console.log('p1'); setTimeout(()=>console.log('t2'),0) }).then(()=>console.log('p2'))\nsetTimeout(()=>console.log('t3'),0)\nconsole.log('s')\n```\n`s p1 p2 t1 t3 t2`: microtasks (p1, p2) first; t1 and t3 were queued earlier than t2.\n\n**Q133 [OUT] \ud83d\udd34**\n```js\nnew Promise(r => { console.log(1); r(); console.log(2) }).then(() => console.log(3)); console.log(4)\n```\n`1 2 4 3`: the executor runs synchronously (and continues after `resolve`); `.then` is a microtask.\n\n**Q134 [OUT] \ud83d\udd34**\n```js\nPromise.reject('x').catch(e => console.log('c', e)).then(() => console.log('t')).finally(() => console.log('f'))\n```\n`c x`, `t`, `f`: `catch` returns a resolved promise so `then` runs; `finally` runs last.\n\n**Q135 \ud83d\udd34 Why can a long loop freeze the UI?**\nIt occupies the call stack; the event loop can't process events or render until it ends. Fix: chunk work (`setTimeout`/`requestIdleCallback`), Web Worker, virtualise/paginate.\n\n**Q136 \ud83d\udd34 Does `setTimeout(fn, 0)` run immediately?**\nNo: it queues a macrotask to run after the current stack and all microtasks, with \u2265~1\u20134 ms clamping (and throttling in background tabs).\n\n**Q137 \ud83d\udd34 Why does Vue need `nextTick`?**\nVue batches DOM updates into a microtask. Right after changing state the DOM is stale; `await nextTick()` resolves after the flush so you can read updated DOM.\n\n**Q138 \ud83d\udfe1 `requestAnimationFrame` vs `setTimeout` for animation?**\nrAF runs before the next paint, synced to the display refresh, paused in background tabs: smoother and cheaper.\n\n**Q139 [IMP] \ud83d\udfe1 Write `sleep` and `retry`.**\n```js\nconst sleep = ms => new Promise(r => setTimeout(r, ms))\nasync function retry(fn, n = 3) { for (let i = 0; ; i++) { try { return await fn() } catch (e) { if (i >= n) throw e; await sleep(2 ** i * 300) } } }\n```\n**Q140 [IMP] \ud83d\udfe1 Run at most N requests concurrently.**\nUse a worker-pool: spawn N async loops that pull the next index from a shared counter until done, then `await Promise.all(workers)`. Prevents overwhelming the backend.\n\n---\n## G. Fetch API and API integration (Q141\u2013Q155)\n\n**Q141 \ud83d\udfe2 How do you POST JSON with fetch?**\n```js\nfetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})\n```\nContent-Type tells Spring to parse the body as JSON for `@RequestBody`.\n\n**Q142 \ud83d\udfe1 PUT vs PATCH vs POST?**\nPOST creates (non-idempotent), PUT replaces the entire resource (idempotent), PATCH partial update.\n\n**Q143 \ud83d\udfe1 How do you send files?**\n`FormData` with `append('file', file)`; don't set Content-Type manually (the browser adds `multipart/form-data; boundary=\u2026`). Spring: `@RequestParam MultipartFile`.\n\n**Q144 \ud83d\udfe1 How do you handle 401 and 403?**\n401: unauthenticated/expired \u2192 clear session, redirect to login (try refresh token once). 403: authenticated but not allowed \u2192 show a permission message. Implement centrally via interceptor.\n\n**Q145 \ud83d\udfe1 What's CORS and why do I see it only in the browser?**\nBrowsers enforce the same-origin policy; cross-origin API calls require server headers (`Access-Control-Allow-Origin`, etc.), with a preflight `OPTIONS` for non-simple requests. curl/Postman don't enforce it. Fix on the server (allow-list the origin) or use a dev proxy.\n\n**Q146 \ud83d\udfe1 Where do you store the JWT?**\nTrade-offs: localStorage is easy but readable by XSS; HttpOnly+Secure+SameSite cookie is unreadable by JS but needs CSRF protection; memory + refresh cookie is a strong hybrid. Short expiry and refresh tokens.\n\n**Q147 \ud83d\udfe1 Offset vs cursor pagination?**\nOffset (`page`/`size`) is simple but shifts when data changes and is slow deep in large tables; cursor (`before=<id>`) is stable and efficient, ideal for chat history/infinite scroll.\n\n**Q148 [ARCH] \ud83d\udfe1 How do you design the API layer in a frontend?**\nOne HTTP client (base URL from env, auth header, error normalisation, 401 handling), one service module per resource returning plain data, components/stores call services; mock-able; no URLs in components.\n\n**Q149 \ud83d\udfe1 How to prevent duplicate submissions?**\nDisable the button / `submitting` flag, ignore re-entry in the handler, debounce, idempotency keys for POST, server-side uniqueness constraints.\n\n**Q150 \ud83d\udfe1 How to prevent stale search results?**\nCancel the previous request with AbortController or compare a request id/sequence before applying results; debounce input.\n\n**Q151 [DBG] \ud83d\udfe1 Spring returns 400 for my POST.**\nCompare the request payload in Network with the DTO: field names/types, missing Content-Type, validation annotations, enum values, date format. Read the response body (`errors[]`) and backend log.\n\n**Q152 [DBG] \ud83d\udfe1 JSON shows `id: 9007199254740992` instead of the real id.**\nJS number precision; the backend should send big Longs as strings (`@JsonSerialize(using = ToStringSerializer.class)`).\n\n**Q153 \ud83d\udfe1 What states must a data-driven UI handle?**\nidle, loading, success (with data), empty, error (with retry); plus partial/refreshing and offline.\n\n**Q154 \ud83d\udfe1 Retry strategy?**\nRetry only idempotent requests, only for network/5xx/429, with exponential backoff + jitter and a max count; never retry validation (4xx) or non-idempotent POSTs without idempotency keys.\n\n**Q155 [ARCH] \ud83d\udd34 Explain the complete flow from clicking \"Send\" to the message in the DB and back.**\nClick \u2192 handler \u2192 store action (optimistic UI) \u2192 service \u2192 HTTP POST + auth header \u2192 (CORS/TLS) \u2192 Spring Controller (deserialise/validate) \u2192 Service (authorisation, business rules) \u2192 Repository \u2192 DB; maybe Kafka event/Redis; response 201 JSON \u2192 interceptor \u2192 store replaces temp message \u2192 reactivity re-renders \u2192 auto-scroll. Failures: status failed + retry.\n\n---\n**Continue \u2192 `07-interview-2.md` (Vue, Pinia, Router, architecture, performance, security, accessibility, scenario and debugging questions).**\n\n\n# MODULE 49 (continued) \u2014 INTERVIEW BANK: VUE, ARCHITECTURE, SCENARIOS\n\n## H. Vue fundamentals (Q156\u2013Q170)\n\n**Q156 \ud83d\udfe2 What is Vue and what problem does it solve?**\nA progressive framework for building UIs. It replaces manual DOM updates with declarative templates and reactive state: you change data and Vue updates exactly the affected DOM. It also gives component structure, routing and state tools.\n\n**Q157 \ud83d\udfe2 What is the Virtual DOM and does Vue use it?**\nA lightweight JS tree representing the UI. On change Vue builds a new tree, diffs it with the old, and patches the real DOM minimally. Vue 3's compiler additionally marks dynamic parts (patch flags, static hoisting), so most diffing is skipped.\n\n**Q158 \ud83d\udfe2 SPA vs MPA?**\nSPA loads one HTML shell and swaps views with JS + API calls (fast navigation, app feel, SEO needs SSR/prerender); MPA loads a new server-rendered page per navigation.\n\n**Q159 \ud83d\udfe2 Explain `v-if` vs `v-show`.**\n`v-if` creates/destroys the element (cheaper initial render if false, costlier toggling, supports `else`); `v-show` keeps it in the DOM and toggles `display:none` (cheap toggling).\n\n**Q160 \ud83d\udfe1 Why is `key` required in `v-for`?**\nIt gives each item a stable identity so the diff algorithm can move/reuse the correct DOM nodes and component state. Index keys on changing lists cause state to attach to the wrong item; random keys force re-creation.\n\n**Q161 [DBG] \ud83d\udfe1 Typing in one row's input moves to another row after sorting.**\nRows use index as `key` (or none). Use a unique stable id.\n\n**Q162 \ud83d\udfe1 Why not `v-if` and `v-for` on the same element?**\nPrecedence/ambiguity (Vue 3: `v-if` runs first and can't see the loop variable). Filter with a computed property or wrap in `<template v-for>`.\n\n**Q163 \ud83d\udfe1 How does `v-model` work?**\nSugar for `:value=\"x\"` + `@input=\"x = $event.target.value\"` on native inputs (checkbox: `checked`/`change`). On components: `modelValue` prop + `update:modelValue` emit (or `defineModel()`). Modifiers `.trim .number .lazy`.\n\n**Q164 \ud83d\udfe1 `{{ }}` vs `v-html`?**\nInterpolation escapes HTML (safe); `v-html` inserts raw HTML (XSS risk), only for trusted/sanitised content.\n\n**Q165 \ud83d\udfe1 How do you bind classes and styles conditionally?**\nObject syntax `:class=\"{ active: isActive }\"`, array syntax, ternaries; `:style=\"{ width: pct + '%' }\"`; prefer classes and CSS variables.\n\n**Q166 \ud83d\udfe1 Options API vs Composition API?**\nOptions organises code by option type (`data/methods/computed/watch`) using `this`; Composition organises by logical concern with `ref/computed/watch` functions, enabling extraction into composables, better TypeScript and less `this` confusion. Both are supported; legacy company code often uses Options.\n\n**Q167 \ud83d\udfe1 What's `<script setup>`?**\nCompile-time sugar for the Composition API in SFCs: top-level variables/imports are exposed to the template, components auto-registered, `defineProps/defineEmits/defineExpose/defineModel` macros, less boilerplate and better performance.\n\n**Q168 \ud83d\udfe1 Vue 2 vs Vue 3 differences?**\nVue 3: Composition API, Proxy-based reactivity (detects add/delete/index changes), fragments (multiple roots), Teleport, Suspense, better TS, smaller/faster; Vue 2 is end-of-life.\n\n**Q169 \ud83d\udfe1 Which Vite things do you configure in a Vue project?**\nPlugins (`@vitejs/plugin-vue`), aliases (`@` \u2192 `src`), dev server proxy to Spring Boot, env variables (`VITE_*`), build options (chunking, source maps), test config (Vitest).\n\n**Q170 \ud83d\udfe2 What does `app.mount('#app')` do?**\nRenders the root component into the DOM element matching `#app`, replacing its contents and starting the reactive rendering.\n\n---\n## I. Vue reactivity (Q171\u2013Q185)\n\n**Q171 \ud83d\udd34 How does Vue 3 reactivity work internally?**\n`reactive()` returns a Proxy; `ref` wraps a value in an object with `.value` getter/setter. When an effect (render, computed, watch) runs it reads reactive properties \u2014 the `get` trap **tracks** (records effect as dependent). When a property is written, the `set` trap **triggers** all dependent effects, which are queued by the scheduler and flushed asynchronously (batched), re-rendering the component.\n\n**Q172 \ud83d\udfe1 `ref` vs `reactive`?**\n`ref`: any type, `.value` in script (auto-unwrapped in templates), reassignable. `reactive`: objects only, no `.value`, but replacing the object or destructuring primitives loses reactivity. Docs recommend `ref` as default.\n\n**Q173 [DBG] \ud83d\udfe1 UI doesn't update after `const { count } = reactive(state); count++`.**\nDestructuring copied a primitive; it's no longer linked. Use `toRefs(state)`/`toRef`, or access `state.count`.\n\n**Q174 \ud83d\udfe1 `computed` vs method vs `watch`?**\n`computed`: cached derived value that re-evaluates only when dependencies change (pure). Method: runs on every call/render. `watch`: perform side effects in response to changes (API calls, storage, resetting state).\n\n**Q175 \ud83d\udfe1 `watch` vs `watchEffect`?**\n`watch` names its sources, is lazy, gives old/new values; `watchEffect` runs immediately and auto-tracks whatever it reads. Prefer `watch` for explicit triggers/side effects, `watchEffect` for simple dependent effects.\n\n**Q176 \ud83d\udfe1 How do you cancel an in-flight request inside a watcher?**\nUse the `onCleanup` argument: `watch(src, async (v, _, onCleanup) => { const c = new AbortController(); onCleanup(() => c.abort()); await fetch(url, { signal: c.signal }) })`.\n\n**Q177 \ud83d\udfe1 What is `nextTick`?**\nReturns a promise that resolves after Vue flushes pending DOM updates. Needed to read updated DOM (scroll, focus, measure) right after a state change.\n\n**Q178 \ud83d\udd34 Why does Vue batch updates?**\nMultiple state changes in one tick would cause redundant renders; Vue queues component update jobs (deduplicated) and flushes them in a microtask so each component renders once.\n\n**Q179 \ud83d\udd34 `shallowRef`/`shallowReactive` and when to use?**\nOnly `.value` (or top-level props) are reactive; nested data isn't proxied. Use for large immutable data or third-party class instances; update by replacing the value. Cuts proxy overhead.\n\n**Q180 \ud83d\udfe1 What does `toRefs` do?**\nConverts a reactive object's properties into refs linked to the source; lets you return/destructure state from composables without losing reactivity.\n\n**Q181 \ud83d\udfe1 Can a computed property have side effects? Can it be writable?**\nIt shouldn't (pure getter). It can be writable with `{ get, set }` for two-way derived values.\n\n**Q182 \ud83d\udd34 How can a computed re-run unexpectedly or never?**\nIt tracks only properties actually read; reading non-reactive data, conditional reads (a branch not executed isn't tracked until it runs), or replacing a non-ref value breaks tracking. Large reactive objects deep-tracked can cause over-triggering.\n\n**Q183 \ud83d\udfe1 Why do mutations to nested objects in a `ref` trigger updates?**\n`ref` values that are objects are deeply converted to reactive proxies, so nested property writes trigger.\n\n**Q184 \ud83d\udfe1 Props changed by the parent \u2014 how do you react inside the child?**\n`watch(() => props.x, ...)` or use a computed; never mutate the prop. To copy for editing: `const draft = ref({ ...props.user })` and sync via watch if needed.\n\n**Q185 [DBG] \ud83d\udd34 Adding a key to a plain `let obj = {}` doesn't update the template.**\n`obj` isn't reactive. Make it `ref`/`reactive`. (Vue 2 needed `Vue.set`; Vue 3 Proxy detects new keys but only on reactive objects.)\n\n---\n## J. Components, props, emits, slots, lifecycle (Q186\u2013Q200)\n\n**Q186 \ud83d\udfe2 How do parent and child communicate?**\nParent \u2192 child via props; child \u2192 parent via emitted events; two-way via `v-model`; content via slots; deep sharing via `provide/inject`; global via Pinia; template refs + `defineExpose` for imperative calls (rare).\n\n**Q187 \ud83d\udfe1 Why can't a child mutate props? What do you do instead?**\nOne-way data flow keeps state changes traceable: the owner of the data changes it. The child emits an event (or uses `v-model`) and the parent updates the value.\n\n**Q188 \ud83d\udfe1 Default values for object/array props?**\nMust be factory functions (`default: () => ({})`) so instances don't share one object.\n\n**Q189 \ud83d\udfe1 How do you validate props?**\n`type`, `required`, `default`, custom `validator`; or TypeScript generics with `defineProps<T>()`.\n\n**Q190 \ud83d\udfe1 What are slots and scoped slots?**\nSlots let the parent inject markup into a child (default/named). Scoped slots let the child pass data to the parent's slot content (`<slot :item=\"item\">` \u2192 `#default=\"{ item }\"`), so the parent controls rendering per item (tables, lists).\n\n**Q191 [IMP] \ud83d\udfe1 Build a reusable `BaseModal`.**\nProps `open`, `title`; emit `update:open`; slots for body and `#actions`; wrap in `<Teleport to=\"body\">`; Esc/overlay click closes; `role=\"dialog\" aria-modal`; focus management.\n\n**Q192 \ud83d\udfe1 Lifecycle hooks order?**\nsetup \u2192 onBeforeMount \u2192 (render) \u2192 onMounted \u2192 [onBeforeUpdate \u2192 onUpdated]* \u2192 onBeforeUnmount \u2192 onUnmounted. Parent `beforeMount` \u2192 child `beforeMount/mounted` \u2192 parent `mounted` (children mount first).\n\n**Q193 \ud83d\udfe1 Where to fetch data, and what about route param changes?**\nIn `setup` or `onMounted`; but when only the param changes the component instance is reused, so `onMounted` doesn't rerun \u2014 `watch(() => route.params.id, load, { immediate: true })`.\n\n**Q194 \ud83d\udfe1 What must you clean up in `onUnmounted`?**\nTimers, global/DOM listeners, WebSockets/EventSource, observers, pending fetches (abort), third-party widget instances.\n\n**Q195 \ud83d\udfe1 Why can't you use `onMounted` after an `await` in `setup`?**\nLifecycle hooks must register synchronously during `setup` so Vue knows the active component instance; after an await it's lost (with `<script setup>` the compiler preserves context for the first await only).\n\n**Q196 \ud83d\udfe1 What's a template ref and when is it available?**\n`ref=\"el\"` + `const el = ref(null)`; populated after mount (null before and after unmount). Use for focus, scrolling, measuring, third-party libs.\n\n**Q197 \ud83d\udfe1 `provide/inject` vs props vs Pinia?**\nProps for direct parent-child, `provide/inject` for subtree-scoped dependencies (themes, form context) avoiding drilling, Pinia for app-wide shared/server state with devtools support.\n\n**Q198 \ud83d\udfe1 What is `KeepAlive` and when to use?**\nCaches inactive component instances to preserve state/scroll when switching (tabs, list\u2194detail). Costs memory; use `include/max`; `onActivated` for refresh.\n\n**Q199 \ud83d\udfe1 `Teleport` use case?**\nRender modals/toasts/dropdowns at `<body>` to escape stacking-context/overflow issues while keeping logical ownership in the component.\n\n**Q200 \ud83d\udd34 What are custom directives for?**\nReusable low-level DOM behaviour (`v-focus`, `v-click-outside`, `v-tooltip`) with hooks `mounted/updated/unmounted`; not for state logic (use composables).\n\n---\n## K. Composition API, composables (Q201\u2013Q206)\n\n**Q201 \ud83d\udfe1 What is a composable?**\nA function (`useX`) using Vue reactivity/lifecycle to encapsulate reusable stateful logic and return refs/functions (`useFetch`, `useDebouncedRef`, `usePagination`). New state per call.\n\n**Q202 \ud83d\udfe1 Composable vs mixin vs utility vs store?**\nMixins (Options API) cause name clashes and hidden dependencies. Utilities are stateless pure functions. Composables create per-call reactive state with explicit inputs/outputs. Stores are shared singletons.\n\n**Q203 [IMP] \ud83d\udfe1 Write `useDebouncedRef`.**\n```js\nexport function useDebouncedRef(src, ms = 300) { const d = ref(src.value); let t\n  watch(src, v => { clearTimeout(t); t = setTimeout(() => (d.value = v), ms) }); onUnmounted(() => clearTimeout(t)); return d }\n```\n**Q204 [IMP] \ud83d\udfe1 Write `useEventListener(target, event, cb)`.**\nAdd the listener in `onMounted`, remove in `onUnmounted` (or `watch` the target ref); guarantees cleanup.\n\n**Q205 \ud83d\udfe1 Why return refs from composables?**\nCallers can destructure without losing reactivity; unwrapped values would be plain snapshots.\n\n**Q206 \ud83d\udfe1 How do you accept either a value or a ref in a composable?**\nNormalise with `toValue()`/`unref()` and track inside `watchEffect`/`computed`.\n\n---\n## L. Pinia (Q207\u2013Q214)\n\n**Q207 \ud83d\udfe1 Why state management? What is prop drilling?**\nShared state across distant components becomes messy via props/events: values pass through components that don't use them (prop drilling). A store provides a single source of truth that any component reads/updates.\n\n**Q208 \ud83d\udfe1 Pinia state, getters, actions?**\nState = reactive data (refs); getters = computed; actions = functions (sync/async, can call APIs/other stores). No mutations (unlike Vuex).\n\n**Q209 [DBG] \ud83d\udfe1 After `const { items } = useStore()` the list no longer updates.**\nDestructuring broke reactivity. Use `storeToRefs(store)` for state/getters; actions can be destructured directly.\n\n**Q210 \ud83d\udfe1 When should state live in a store vs locally?**\nLocal by default; use a store when many unrelated components need it, it must survive navigation, or it's cached server data. Form drafts and transient UI state stay local.\n\n**Q211 \ud83d\udfe1 How do you persist Pinia state?**\n`pinia-plugin-persistedstate` or manual `localStorage/sessionStorage` writes via `$subscribe`; avoid persisting sensitive tokens carelessly; handle hydration and versioning.\n\n**Q212 \ud83d\udfe1 How do you reset stores on logout?**\nOption stores: `$reset()`; setup stores: write a `reset` action; also clear persisted storage and cancel requests. Avoid leaking another user's data.\n\n**Q213 \ud83d\udd34 How do you implement optimistic updates in a store?**\nUpdate state immediately with a temp item/status, call the API, replace with the server response on success; on failure rollback or mark failed with retry; keep ids/temp keys stable.\n\n**Q214 \ud83d\udfe1 Pinia vs composables for sharing state?**\nA module-level `ref` in a composable can act as shared state but lacks devtools, SSR safety, plugins and structure; a store is the standard.\n\n---\n## M. Vue Router (Q215\u2013Q222)\n\n**Q215 \ud83d\udfe1 `route` vs `router`?**\n`useRoute()` = current reactive route (params, query, meta); `useRouter()` = navigation API (`push`, `replace`, `back`).\n\n**Q216 \ud83d\udfe1 History mode vs hash mode?**\nHistory mode gives clean URLs but needs server fallback to `index.html` (else refresh \u2192 404); hash mode (`/#/x`) works without server config.\n\n**Q217 [DBG] \ud83d\udfe1 Navigating from /chats/1 to /chats/2 doesn't reload data.**\nThe component is reused; `onMounted` doesn't re-run. Watch `route.params.chatId` (or use `:key=\"route.fullPath\"` on `RouterView` to force remount).\n\n**Q218 \ud83d\udfe1 How do navigation guards work, and implement an auth guard?**\n`router.beforeEach((to) => \u2026)` runs before each navigation; return `false`, a route location to redirect, or nothing to continue. Check `to.meta.requiresAuth && !auth.isLoggedIn` \u2192 `{ name:'login', query:{ redirect: to.fullPath } }`. Guards are UX; the API enforces security.\n\n**Q219 \ud83d\udfe1 Lazy-loaded routes?**\n`component: () => import('./views/X.vue')` creates a separate chunk downloaded on first visit, reducing initial bundle.\n\n**Q220 \ud83d\udfe1 `push` vs `replace`?**\n`push` adds a history entry (back button returns); `replace` swaps the current one (after login/redirects).\n\n**Q221 \ud83d\udfe1 Where do you keep filters/pagination: store or URL?**\nIn URL query when they should be shareable/bookmarkable and survive refresh; store/local state for transient ones.\n\n**Q222 \ud83d\udfe1 How do nested routes work?**\nChild routes render inside the parent's `<RouterView>`; parent is a layout (sidebar/header) and children are pages.\n\n---\n## N. Architecture, performance, security, accessibility (Q223\u2013Q245)\n\n**Q223 [ARCH] \ud83d\udfe1 Structure a large Vue application.**\n`views` (routes), `components` (base + feature), `layouts`, `composables`, `services` (HTTP), `stores`, `router`, `utils`, `constants`, `tests`; or feature-based folders. Rules: props down/events up, API only via services, shared state via stores, pure helpers in utils.\n\n**Q224 \ud83d\udfe1 Container vs presentational components?**\nContainers (views) fetch data and coordinate; presentational components are pure UI (props in, events out) \u2014 reusable and easily tested.\n\n**Q225 \ud83d\udfe1 When do you extract a component or composable?**\nWhen markup/logic repeats, a component exceeds ~200 lines or mixes concerns, or you need isolated tests. Avoid premature abstraction (rule of three).\n\n**Q226 [ARCH] \ud83d\udfe1 How would you onboard onto an unfamiliar frontend repo?**\n`package.json` \u2192 `main.js` \u2192 router \u2192 page view \u2192 follow imports (components/stores/services) \u2192 Network tab/Vue DevTools to trace data \u2192 read tests \u2192 add breakpoints.\n\n**Q227 \ud83d\udfe1 How do you avoid prop drilling?**\nPinia for shared state, `provide/inject` for subtree context, slots/composition to reshape the tree, or lift state sensibly.\n\n**Q228 \ud83d\udd34 How do you improve performance of a slow Vue list of 5,000 items?**\nPaginate, virtual scrolling, stable keys, avoid heavy work in render (move to computed), `shallowRef` for the array, `v-memo`, split row components, avoid inline object props, debounce filters, lazy images.\n\n**Q229 \ud83d\udfe1 What are Core Web Vitals?**\nLCP (loading, \u22642.5 s), INP (interaction latency, \u2264200 ms), CLS (layout stability, \u22640.1). Measured via Lighthouse/Chrome field data.\n\n**Q230 \ud83d\udfe1 How do you reduce bundle size?**\nRoute-level code splitting, lazy components, tree shaking, replace heavy libs, analyse with visualizer, compress, avoid importing whole libraries, remove unused dependencies, image optimisation.\n\n**Q231 \ud83d\udfe1 How do you find and fix a memory leak?**\nPerformance/Memory tab: repeat navigation, take heap snapshots, look for growing detached DOM nodes/listeners; fix missing cleanup in `onUnmounted`, unbounded caches, closures retaining nodes.\n\n**Q232 \ud83d\udfe1 Explain XSS and how Vue helps/doesn't.**\nInjected script executes in your origin. Vue escapes `{{ }}` and attribute bindings, but `v-html`, `:href=\"userUrl\"` (javascript: URLs), `innerHTML` in custom code, and third-party libs are risks; sanitise with DOMPurify, validate URLs, CSP.\n\n**Q233 \ud83d\udfe1 CSRF and SPAs?**\nCSRF exploits automatic cookie sending; cookie-session SPAs need SameSite cookies + CSRF tokens; Bearer-header token APIs aren't automatically sent cross-site and aren't vulnerable (but token storage then matters for XSS).\n\n**Q234 \ud83d\udfe1 Is hiding a button/route enough for authorization?**\nNo. Client checks are UX; the server must authorise every request (roles, ownership). Attackers can call APIs directly.\n\n**Q235 \ud83d\udfe1 What is CSP?**\nA response header restricting where scripts/styles/images/connections can load from, mitigating XSS impact; e.g. `script-src 'self'`, no inline scripts.\n\n**Q236 \ud83d\udfe1 What do you do about vulnerable dependencies?**\n`npm audit`, Dependabot/Renovate, lockfiles + `npm ci`, minimal dependencies, review changelogs, avoid abandoned packages.\n\n**Q237 \ud83d\udfe1 How do you make a modal accessible?**\nUse `<dialog>` or `role=\"dialog\" aria-modal`, label it, move focus in, trap Tab, Esc closes, restore focus to the trigger, make background inert, ensure close button has a name.\n\n**Q238 \ud83d\udfe1 What is `aria-live` and where used?**\nMarks a region whose updates are announced by screen readers (`polite`/`assertive`): chat messages, toasts, form errors (`role=\"alert\"`).\n\n**Q239 \ud83d\udfe1 Accessible forms checklist?**\nVisible `<label for>`, error messages linked with `aria-describedby`, `aria-invalid`, don't rely on color only, correct `type`/`autocomplete`, logical order, keyboard operable.\n\n**Q240 \ud83d\udfe1 Colour contrast requirements?**\nWCAG AA: 4.5:1 for normal text, 3:1 for large text and UI components; check with DevTools/axe.\n\n**Q241 \ud83d\udfe1 How do you handle browser compatibility?**\nBrowserslist target, Autoprefixer/Babel via Vite, feature detection and fallbacks, caniuse/MDN checks, cross-browser testing (esp. Safari), polyfills only where needed.\n\n**Q242 \ud83d\udfe1 What do you log/monitor in production?**\nUnhandled errors/rejections with release, route, user id (no PII/tokens), network failures, performance metrics; correlate with backend via request id; source maps uploaded privately.\n\n**Q243 \ud83d\udfe1 How do you debug a bug that only occurs in production?**\nReproduce with `build + preview`, check env variables/API URLs/feature flags, use source maps and error monitoring, examine Network and backend logs by request id, compare versions, check caching (stale bundle), CORS/CSP differences.\n\n**Q244 \ud83d\udfe1 Why environment variables with `VITE_` prefix, and what must never go in them?**\nOnly prefixed vars are exposed to client code; they're embedded in the public bundle, so no secrets/API keys that grant privileges.\n\n**Q245 \ud83d\udfe1 What are source maps and risks?**\nFiles mapping minified code to original source for debugging; publicly exposing them reveals source, so upload to monitoring only or restrict access.\n\n---\n## O. Scenario-based, debugging and practical questions (Q246\u2013Q265)\n\n**Q246 [ARCH] \ud83d\udd34 Design a search box that calls an API as the user types.**\nControlled input (`v-model`) \u2192 debounce 300\u2013400 ms \u2192 min length \u2192 abort previous request \u2192 set loading state \u2192 render results/empty/error \u2192 reset pagination on new query \u2192 sync `q` to URL query \u2192 accessible (`role=search`, live region for result count). Backend: indexed query + pagination.\n\n**Q247 [ARCH] \ud83d\udd34 Design infinite scroll for chat history.**\nCursor pagination `before=<oldestId>&limit=30`; `IntersectionObserver` on a top sentinel; prepend older messages while preserving scroll position (record `scrollHeight` before, adjust `scrollTop` after `nextTick`); guard against concurrent loads; stop when fewer than `limit` results; error/retry row.\n\n**Q248 [ARCH] \ud83d\udd34 How would you add real-time messages to the chat?**\nWebSocket (or SSE) opened after login, authenticated (token/cookie), messages dispatched into the chat store (dedupe by id, update unread counts, notify), reconnect with exponential backoff, resync missed messages on reconnect using last id, close on logout/unmount; backend fan-out via Kafka consumers/Redis pub-sub.\n\n**Q249 [ARCH] \ud83d\udfe1 Handle form validation across client and server.**\nClient-side validation for fast UX; server (Bean Validation) is the authority and returns structured `errors[{field,message}]`; map to fields, show inline + summary, keep entered data, focus the first invalid field.\n\n**Q250 [ARCH] \ud83d\udfe1 Implement login and protected routes.**\nLogin form \u2192 auth store \u2192 token in memory/cookie \u2192 router guard checks `requiresAuth`, redirect with `?redirect` \u2192 axios interceptor adds token, handles 401 \u2192 logout clears stores/storage \u2192 guard re-evaluates.\n\n**Q251 [DBG] \ud83d\udfe1 \"Cannot read properties of undefined (reading 'name')\" in template.**\nData not loaded yet or missing field. Use `v-if` loading guard, optional chaining `user?.name`, default empty objects; confirm with Network response shape.\n\n**Q252 [DBG] \ud83d\udfe1 Component renders twice / API called twice.**\nBoth `onMounted` and `watch immediate` fire; hook registered in parent and child; StrictMode-like double mounts from route key; duplicate listeners without cleanup. Inspect with logs and Network.\n\n**Q253 [DBG] \ud83d\udfe1 State changed but UI not updating.**\nNon-reactive variable, destructured reactive, replaced `reactive` object, mutation of a `shallowRef` inner value, reading before `nextTick`, wrong key, mutating a copy.\n\n**Q254 [DBG] \ud83d\udfe1 CORS error in console but request works in Postman.**\nBrowser-enforced; check preflight `OPTIONS` response, allowed origin/methods/headers, credentials (`allowCredentials` + explicit origin not `*`), or use dev proxy.\n\n**Q255 [DBG] \ud83d\udfe1 Page refresh on `/chats/5` gives 404 in production.**\nHistory-mode SPA without fallback. Configure server (nginx `try_files \u2026 /index.html`, Spring forward controller) .\n\n**Q256 [DBG] \ud83d\udfe1 Scroll doesn't stick to bottom after sending.**\nDOM not yet updated when setting `scrollTop`; `await nextTick()` first; also ensure the container has `min-height:0` and fixed/flexible height with `overflow-y:auto`.\n\n**Q257 [DBG] \ud83d\udd34 The UI freezes when processing a big array.**\nLong synchronous work blocks the event loop. Chunk, use a Web Worker, reduce reactivity (`shallowRef`/`markRaw`), paginate.\n\n**Q258 [DBG] \ud83d\udfe1 The same request returns stale data (from cache).**\nHTTP caching headers/ETag, browser cache, service worker, CDN; add cache-control or query/versioning; disable cache in DevTools to test.\n\n**Q259 [DBG] \ud83d\udfe1 `this` is undefined in my handler.**\nDetached method passed as callback or arrow function used as method; use arrow/ `bind`, or Composition API.\n\n**Q260 [DBG] \ud83d\udfe1 Styles of a child component don't apply from the parent's `<style scoped>`.**\nScoped styles don't reach child internals; use `:deep()` or props/slots/classes on the child root.\n\n**Q261 [IMP] \ud83d\udfe1 Build a debounced, abortable search composable.**\nSee Module 41 `useUsers`: debounce watcher on `q`, abort previous controller, set loading/error, reset page, cleanup on unmount.\n\n**Q262 [IMP] \ud83d\udfe1 Implement a toast system.**\nPinia `ui` store with `toasts[]` and `push/dismiss` (auto-dismiss timers); a `ToastHost` in `App.vue` using `<TransitionGroup>`, `role=\"status\"/aria-live`; API error handler pushes toasts.\n\n**Q263 [IMP] \ud83d\udd34 Implement optimistic \"mark as read\".**\nStore action sets `unread=0` immediately, calls `PATCH /chats/{id}/read`, on failure restores previous count and shows a toast; guard concurrent calls.\n\n**Q264 [ARCH] \ud83d\udd34 Mock API \u2192 Spring Boot switch: how do you structure the code?**\nService interface with two implementations selected via env flag; mock mirrors real response shapes (Spring `Page`, error body); UI unchanged; contract tests; later remove mocks or keep for tests (MSW).\n\n**Q265 [ARCH] \ud83d\udd34 How would you explain your component architecture to a mentor?**\nDraw the component tree; for each component state props in/events out and who owns each piece of state; show the data flow for one user action end to end (event \u2192 store \u2192 service \u2192 API \u2192 state \u2192 render) and where errors/loading are handled; justify local vs store state.\n\n---\n**Question count:** 265 (HTML 15, CSS 25, JS fundamentals 30, advanced JS 30, DOM 15, async/event loop 25, Fetch/API 15, Vue fundamentals 15, reactivity 15, components 15, composables 6, Pinia 8, Router 8, architecture/perf/security/a11y 23, scenario/debugging 20).\n**How to practise:** cover the answer, answer aloud in 60\u201390 seconds, then compare; for **[OUT]** questions predict before running in the Console.\n\n**Next \u2192 Part 10: Assignments (Modules 50\u201354).**\n\n\n# MODULE 49 (continued) \u2014 INTERVIEW COACHING: HOW TO ANSWER, MODEL ANSWERS, LIVE CODING, DESIGN, BEHAVIOURAL\n\nThe question bank (Q1\u2013Q265) tells you **what** to know. This section teaches you **how to say it**, with spoken-style model answers, the follow-ups interviewers use to probe, live-coding drills with solutions, frontend system-design practice and behavioural answers for interns.\n\n---\n\n## 49.A The answer framework \ud83d\udfe2\nInterviewers are not grading memory; they're checking **whether you understand and can explain**. Use this shape for any concept question (30\u201390 seconds):\n1. **Definition in one sentence** (plain words).\n2. **Why it exists / the problem it solves.**\n3. **A tiny example** (code or real scenario: use Seller Chat).\n4. **A pitfall or trade-off** (shows experience).\n5. **Stop.** Let them ask the follow-up.\n**If you don't know:** say what you *do* know, reason aloud, then: \"I haven't used that directly; I'd check the docs for X and test Y.\" Never bluff; interviewers detect it fast and it costs trust.\n**For \"debug this\" questions:** reproduce \u2192 read the error \u2192 narrow down (Network/console/DevTools) \u2192 hypothesis \u2192 test \u2192 fix \u2192 prevent.\n**For coding questions:** restate the problem, ask about edge cases, state your approach, code it, test it with an example, state complexity.\n**As an intern:** show learning speed, curiosity and ownership; mention your Spring Boot background: \"I understand the API side, so I can reason about contracts end to end.\"\n\n---\n\n## 49.B Model answers: 30 questions you will almost certainly get \ud83d\udfe1\nFormat: **Say this** (spoken answer) \u00b7 **Go deeper** (if they probe) \u00b7 **Trap** (what interviewers listen for).\n\n**1. What is a closure?**\n*Say this:* \"A closure is a function that remembers the variables from the place where it was created, even after that outer function has finished. For example, `makeCounter` returns an `inc` function that still updates `count` from its parent scope.\"\n*Go deeper:* used for private state, `once`, memoize, debounce (the timer id lives in the closure). Each call to the outer function creates a new, independent environment. A downside: closures can retain large objects and cause memory leaks.\n*Trap:* the `var` in a loop with `setTimeout` printing 3,3,3; fix with `let` (new binding per iteration).\n\n**2. Explain the event loop.**\n*Say this:* \"JavaScript runs one thing at a time on the call stack. Async work (timers, network, events) is handed to the browser; when it's ready its callback goes into a queue. When the stack is empty, the event loop moves callbacks in. Promise callbacks go in the **microtask** queue, which is fully drained before the next **macrotask** like a `setTimeout`.\"\n*Go deeper:* order: sync code \u2192 all microtasks \u2192 one macrotask \u2192 microtasks again; rendering happens between macrotasks, so long synchronous work freezes the UI. `await x` schedules the rest of the function as a microtask.\n*Trap:* \"what prints first: `setTimeout(0)` or `Promise.then`?\" \u2192 the promise (microtask).\n\n**3. `var`, `let`, `const`?**\n*Say this:* \"`var` is function-scoped and hoisted as `undefined`; `let` and `const` are block-scoped and live in the temporal dead zone until declared. `const` prevents reassignment, not mutation of objects. I use `const` by default and `let` when I must reassign.\"\n*Trap:* `const arr = []; arr.push(1)` is fine.\n\n**4. `==` vs `===`?**\n*Say this:* \"`===` compares value and type; `==` converts types first, which gives surprises like `'' == 0` and `[] == false`. I always use `===`, except `x == null` to check null or undefined together.\"\n\n**5. How does `this` work?**\n*Say this:* \"For normal functions `this` is decided by how it's called: `obj.method()` \u2192 `obj`; a plain call \u2192 undefined in strict mode; `new` \u2192 the new object; `call/apply/bind` set it explicitly. Arrow functions don't have their own `this`; they use the one from where they were defined.\"\n*Trap:* passing `obj.method` as a callback loses `this` \u2192 `bind` or an arrow.\n\n**6. Promises vs async/await?**\n*Say this:* \"A promise represents a future value with states pending, fulfilled or rejected. `async/await` is syntax on top of promises that lets me write async code like sync code, with `try/catch` for errors. For independent requests I use `Promise.all`, not sequential awaits.\"\n*Go deeper:* `all` fails fast; `allSettled` waits for all; `race` first to settle; `any` first to fulfil. `fetch` doesn't reject on 404/500; I check `res.ok`.\n*Trap:* `await` in a `forEach` doesn't wait; use `for...of` or `Promise.all(map())`.\n\n**7. Debounce vs throttle?**\n*Say this:* \"Debounce waits until the user stops: good for a search box. Throttle runs at most once per interval while events continue: good for scroll or resize. Both are built with a closure holding a timer or last-run time.\"\n*Go deeper:* mention cancelling previous requests as well, since debounce alone doesn't prevent a slow earlier response from arriving late.\n\n**8. Explain the CSS box model.**\n*Say this:* \"Every element is a box: content, padding, border, margin. By default width is the content width, so padding and border add to it; with `box-sizing: border-box` the width includes them, which is easier to reason about, so I reset it globally.\"\n*Trap:* margin collapsing between vertical siblings.\n\n**9. How does CSS specificity work?**\n*Say this:* \"When rules conflict, the browser compares specificity: inline style, then IDs, then classes/attributes/pseudo-classes, then element selectors; if equal, the later rule wins. `!important` overrides, so I avoid it and keep selectors flat, using BEM.\"\n\n**10. Flexbox vs Grid?**\n*Say this:* \"Flexbox is one-dimensional: a row or a column; great for navbars and aligning items. Grid is two-dimensional: rows and columns together; great for page layouts and card grids. They combine: grid for the page, flex inside components.\"\n*Go deeper:* `min-height:0` fix for the chat scroll area; `auto-fill, minmax()` for responsive grids without media queries.\n\n**11. What is semantic HTML and why does it matter?**\n*Say this:* \"Using elements for their meaning: `button`, `nav`, `main`, headings. It gives keyboard support, accessibility, SEO and maintainability for free; a clickable `div` needs ARIA and key handlers to approach what `<button>` gives automatically.\"\n\n**12. How do you make a page accessible?**\n*Say this:* \"Start with semantic HTML, labels for inputs, alt text, keyboard operability with visible focus, sufficient contrast, focus management in a SPA (modals and route changes), and `aria-live` for dynamic updates. I test with keyboard only, a screen reader and axe.\"\n\n**13. What is the virtual DOM?**\n*Say this:* \"Vue keeps a lightweight JavaScript description of the UI. When state changes it builds a new description, diffs it against the old one, and applies only the minimal real DOM changes. Vue 3 also uses compile-time hints to skip static parts, so it's even faster.\"\n*Trap:* don't say \"the virtual DOM is always faster than the DOM\"; it's about making updates declarative and reasonably efficient.\n\n**14. How does Vue 3 reactivity work?**\n*Say this:* \"Vue wraps objects in a `Proxy`. When an effect (render, computed, watcher) reads a property, Vue records that dependency; when the property is set, Vue re-runs the effects that depend on it. `ref` wraps primitives in an object with a `.value` the same way.\"\n*Go deeper:* why destructuring `reactive` loses reactivity (you copy the value out of the proxy); updates are batched and the DOM updates on the next tick.\n\n**15. `ref` vs `reactive`?**\n*Say this:* \"`ref` holds any value and I access it with `.value` in script (auto-unwrapped in templates). `reactive` makes an object deeply reactive but can't hold primitives and breaks if I destructure or replace it. I default to `ref`.\"\n\n**16. `computed` vs `watch` vs `watchEffect`?**\n*Say this:* \"`computed` derives a value and caches it; no side effects. `watch` runs a side effect when a specific source changes, such as fetching when an id changes. `watchEffect` runs immediately and tracks whatever it reads automatically.\"\n*Trap:* using `watch` to compute derived state: should be `computed`.\n\n**17. `v-if` vs `v-show`?**\n*Say this:* \"`v-if` adds or removes the element from the DOM and is lazy; `v-show` always renders and toggles `display:none`. Use `v-show` for frequent toggles and `v-if` when it's rarely shown or expensive.\"\n\n**18. Why do lists need `key`?**\n*Say this:* \"`key` lets Vue identify each item across re-renders, so it moves/reuses the right DOM nodes and component state instead of patching in place. I use a stable id, not the index, otherwise inputs or state can jump between rows on insert/delete.\"\n\n**19. How do components communicate?**\n*Say this:* \"Props down, events up. `v-model` for two-way, slots for passing markup, `provide/inject` for subtree context, and Pinia for global shared state. I keep state as local as possible.\"\n\n**20. Why can't you mutate a prop?**\n*Say this:* \"Data flows one way; the parent owns the value. If a child mutated it, you'd lose track of who changed what. The child emits an event and the parent updates. If the child needs an editable copy it creates a local draft.\"\n\n**21. Composition API vs Options API?**\n*Say this:* \"Options groups code by type (data, methods); Composition groups it by feature and makes reuse easy through composables, with better TypeScript support. Options API is still everywhere in legacy code, so I can read both.\"\n\n**22. What is a composable?**\n*Say this:* \"A function that uses Vue's reactivity and lifecycle to encapsulate reusable stateful logic, like `useFetch` or `useDebouncedRef`. Unlike a mixin, inputs and outputs are explicit, and there are no name clashes.\"\n\n**23. Pinia: when and how?**\n*Say this:* \"For state shared across distant components or that must survive navigation: the logged-in user, cart, chat list. A store has state, getters (computed) and actions. I use `storeToRefs` when destructuring state, and keep local UI state out of the store.\"\n\n**24. How do route guards work?**\n*Say this:* \"`router.beforeEach` runs before every navigation; I check `to.meta.requiresAuth` and the auth store, and return a redirect with `?redirect=` if needed. Guards are UX only: the server must enforce authorisation.\"\n\n**25. What is XSS and how do you prevent it?**\n*Say this:* \"Attacker-controlled text running as script in my page. Vue escapes `{{ }}` by default, so the risks are `v-html`, `innerHTML`, `javascript:` URLs and third-party scripts. I render text only, sanitise with DOMPurify when HTML is needed, and use a CSP.\"\n\n**26. Where do you store the JWT?**\n*Say this:* \"`localStorage` is readable by any XSS, so I prefer a short-lived access token in memory with a refresh token in an `HttpOnly; Secure; SameSite` cookie. If the project uses `sessionStorage` or `localStorage`, I mitigate with strict CSP and never rendering untrusted HTML.\"\n\n**27. What is CORS?**\n*Say this:* \"A browser rule that blocks a page from reading responses from a different origin unless the server allows it with `Access-Control-Allow-*` headers. Non-simple requests send a preflight `OPTIONS` first. The fix is on the backend (allowed origins), or use a dev proxy / same-origin deployment.\"\n*Trap:* \"Postman works\": Postman isn't a browser.\n\n**28. How do you optimise a slow page?**\n*Say this:* \"Measure first with Lighthouse and the Performance panel, find the biggest bottleneck, then fix: lazy-load routes, shrink the bundle, optimise images, debounce and cancel requests, virtualise long lists, and clean up listeners. Then re-measure.\"\n\n**29. SPA vs SSR?**\n*Say this:* \"An SPA renders in the browser after loading JavaScript: great interactivity, but slower first paint and weaker SEO by default. SSR renders HTML on the server first (Nuxt), improving first paint and SEO, at the cost of server complexity. Internal tools like Seller Chat don't need SSR; public marketing pages might.\"\n\n**30. Optimistic updates?**\n*Say this:* \"Update the UI immediately assuming success, then reconcile with the server response; on failure roll back or mark the item failed with a retry. It makes the app feel instant. I generate a client id to match the server's echo and avoid duplicates.\"\n\n---\n\n## 49.C Live-coding drills with solutions \ud83d\udd34\nWrite each on paper or an online editor, **talking aloud**. Time yourself: 15\u201320 min each.\n\n**D1: Implement `debounce(fn, ms)` with `cancel` and `flush`.**\n```js\nfunction debounce(fn, ms) {\n  let t, lastArgs\n  const d = (...args) => { lastArgs = args; clearTimeout(t); t = setTimeout(() => { t = null; fn(...lastArgs) }, ms) }\n  d.cancel = () => { clearTimeout(t); t = null }\n  d.flush = () => { if (t) { clearTimeout(t); t = null; fn(...lastArgs) } }\n  return d\n}\n```\n*Probe:* preserve `this`? (use `function` and `fn.apply(this, args)`). Leading edge? (call immediately if no timer, then block).\n\n**D2: `deepClone` (objects, arrays, Date, Map, Set, circular).**\n```js\nfunction deepClone(v, seen = new WeakMap()) {\n  if (v === null || typeof v !== 'object') return v\n  if (seen.has(v)) return seen.get(v)                          // circular reference\n  if (v instanceof Date) return new Date(v)\n  if (v instanceof Map) { const m = new Map(); seen.set(v, m); v.forEach((x, k) => m.set(deepClone(k, seen), deepClone(x, seen))); return m }\n  if (v instanceof Set) { const s = new Set(); seen.set(v, s); v.forEach(x => s.add(deepClone(x, seen))); return s }\n  const out = Array.isArray(v) ? [] : Object.create(Object.getPrototypeOf(v)); seen.set(v, out)\n  for (const k of Reflect.ownKeys(v)) out[k] = deepClone(v[k], seen)\n  return out\n}\n```\n*Say:* in real code I'd use `structuredClone`; this shows I understand the traps (cycles, Dates, prototypes).\n\n**D3: Implement `Promise.all`.**\n```js\nfunction promiseAll(items) {\n  return new Promise((resolve, reject) => {\n    const list = [...items]; if (!list.length) return resolve([])\n    const out = new Array(list.length); let left = list.length\n    list.forEach((p, i) => Promise.resolve(p).then(v => { out[i] = v; if (--left === 0) resolve(out) }, reject))\n  })\n}\n```\n*Probe:* keeps **order** by index; rejects on first failure; handles non-promise values via `Promise.resolve`.\n\n**D4: `flatten(arr, depth)` without `.flat`.**\n```js\nconst flatten = (a, d = 1) => d < 1 ? a.slice() : a.reduce((acc, x) => (Array.isArray(x) ? acc.concat(flatten(x, d - 1)) : (acc.push(x), acc)), [])\n```\n\n**D5: LRU cache (O(1)).**\n```js\nclass LRU { #cap; #m = new Map()\n  constructor(cap) { this.#cap = cap }\n  get(k) { if (!this.#m.has(k)) return undefined; const v = this.#m.get(k); this.#m.delete(k); this.#m.set(k, v); return v }   // move to most-recent\n  set(k, v) { this.#m.delete(k); this.#m.set(k, v); if (this.#m.size > this.#cap) this.#m.delete(this.#m.keys().next().value) }   // evict oldest\n}\n```\n*Say:* a `Map` keeps insertion order, so the first key is the least recently used.\n\n**D6: Run async tasks with a concurrency limit.**\n```js\nasync function pool(tasks, limit) {\n  const results = []; let i = 0\n  const worker = async () => { while (i < tasks.length) { const idx = i++; results[idx] = await tasks[idx]() } }\n  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker))\n  return results\n}\n```\n*Use case:* uploading 50 images, 3 at a time.\n\n**D7: `useFetch` composable (Vue).** See Module 37 / V19: reactive URL, `loading/error/data`, abort previous request, cleanup.\n\n**D8: Event emitter, `once`, `off`.** See J24; mention iterating over a copy.\n\n**D9: Group by + count (real task).**\n```js\nconst groupBy = (arr, fn) => arr.reduce((acc, x) => ((acc[fn(x)] ??= []).push(x), acc), {})\ngroupBy(orders, o => o.status)        // { PAID:[\u2026], PENDING:[\u2026], CANCELLED:[\u2026] }\n```\n\n**D10: Build a typeahead component (Vue), 20 minutes.** Requirements: debounce, abort stale, keyboard arrows/Enter/Esc, `aria-activedescendant`, empty and error states. Skeleton:\n```vue\n<script setup>\nimport { ref, computed, watch } from 'vue'\nconst q = ref(''), items = ref([]), active = ref(-1), open = ref(false), loading = ref(false), error = ref(null)\nlet t, ctrl\nwatch(q, v => { clearTimeout(t); if (v.trim().length < 2) { items.value = []; open.value = false; return }\n  t = setTimeout(async () => { ctrl?.abort(); ctrl = new AbortController(); loading.value = true; error.value = null\n    try { items.value = await api.search(v, ctrl.signal); open.value = true; active.value = -1 }\n    catch (e) { if (e.name !== 'AbortError') error.value = 'Search failed' } finally { loading.value = false } }, 300) })\nconst onKey = e => { if (e.key === 'ArrowDown') { e.preventDefault(); active.value = (active.value + 1) % items.value.length }\n  else if (e.key === 'ArrowUp') { e.preventDefault(); active.value = (active.value - 1 + items.value.length) % items.value.length }\n  else if (e.key === 'Enter' && active.value >= 0) { q.value = items.value[active.value].name; open.value = false }\n  else if (e.key === 'Escape') open.value = false }\n<\/script>\n```\n*Talk through:* debounce + abort, min length, ARIA combobox roles, closing on outside click, why results aren't set via `v-html`.\n\n---\n\n## 49.D Frontend system design (whiteboard) \ud83d\udd34\nUse this structure: **clarify requirements \u2192 data model/API \u2192 component tree \u2192 state \u2192 key flows \u2192 edge cases \u2192 performance/accessibility \u2192 trade-offs.**\n\n**S1: Design the Seller Chat web app.**\n*Clarify:* number of chats/messages, realtime needed? mobile? attachments? offline? *API:* the Module 48 contracts. *Components:* the hierarchy from Module 48. *State:* `auth`, `chat`, `orders` stores; draft text and modal state local; selected chat in the URL. *Flows:* send message (optimistic + retry), receive (WebSocket \u2192 dedupe by id/clientId \u2192 unread), history (cursor pagination, scroll-preserving prepend), reconnect (backoff + resync with last id). *Edge cases:* duplicate delivery, out-of-order messages (sort by server time/id), failed uploads, token expiry mid-session. *Perf:* virtualise long threads, lazy-load orders modal, cap in-memory messages per chat. *A11y:* `aria-live` log, focus management. *Trade-offs:* WebSocket vs SSE (SSE simpler for server\u2192client only), Firestore for realtime vs own WebSocket (less infra vs vendor lock-in/cost per read).\n\n**S2: Design a typeahead search.**\n*Requirements:* fast, accurate, accessible. *Client:* debounce 250\u2013300 ms, min length, abort stale requests, cache recent queries (`Map`/LRU), keyboard navigation, highlight matches safely (text segments + `<mark>`, not `v-html`). *Server:* prefix index, limit 8\u201310 results, rate limiting. *Edge cases:* race conditions, IME composition (don't search mid-composition), offline. *Metrics:* time to first suggestion, keystrokes per selection.\n\n**S3: Design an infinite feed / long list.**\n*Choose:* pagination vs infinite scroll (infinite hurts footer access and accessibility; offer \"Load more\" for keyboard users). *Technique:* cursor pagination, `IntersectionObserver` sentinel, virtual scrolling past ~1000 items, preserve scroll on back navigation (`scrollBehavior`/saved position), skeletons, stale data refresh strategy. *Memory:* cap or windowing.\n\n**S4: Design file upload for large files.**\n*Client:* validate type/size, chunking (e.g. 5 MB parts), parallelism limit (pool of 3), per-chunk retry with backoff, progress, pause/cancel, resume using an upload id. *Server (Spring):* multipart endpoint, size limits, virus scan, store to object storage via presigned URLs. *UI:* per-file states, accessible progress (`<progress>`/`aria-valuenow`).\n\n---\n\n## 49.E Behavioural questions for an intern: answer templates \ud83d\udfe1\nUse **STAR**: **S**ituation (1 sentence) \u00b7 **T**ask (your goal) \u00b7 **A**ction (what *you* did, specifically) \u00b7 **R**esult (outcome, learning).\n\n**Tell me about yourself.** \"I'm a full-stack intern working with Java and Spring Boot, PostgreSQL, MongoDB, Kafka and Redis. I realised frontend was my gap, so I've been building Seller Chat in Vue 3 end to end: mock API first, then integrated with Spring. I enjoy tracing a request from the UI through the controller to the database, and I'm looking to grow on the frontend side.\"\n**Why frontend / why this team?** Link to ownership of the full flow; mention something specific about their product.\n**Tell me about a bug you debugged.** *Example:* \"A message list jumped to the top after loading older messages. I reproduced it, saw `scrollTop` reset because the content height changed, and fixed it by recording `scrollHeight` before prepending and restoring the offset after `nextTick`. I added a test and noted it in the README.\"\n**Tell me about a time you were stuck.** Show method: reproduce, isolate, read docs, ask a precise question with what you tried, then document the answer.\n**How do you handle feedback in code review?** \"I read the comment for the intent, ask if unclear, fix or discuss with reasoning, and add the learning to my own checklist.\"\n**A tight deadline and an unclear requirement?** \"I list assumptions, ask one clear question to the owner, build the smallest useful slice, and show it early.\"\n**What's a weakness?** Be honest and show action: \"Frontend fundamentals were weak, so I followed a structured plan: HTML \u2192 CSS \u2192 JS \u2192 Vue, and shipped five projects.\"\n**Questions to ask them:** team structure and review process; how releases/rollbacks work; how frontend and backend agree on contracts; what a successful first 3 months looks like; what they'd like interns to learn.\n\n---\n\n## 49.F Mock-interview practice plan and rubric \ud83d\udfe1\n**Two-week plan (1.5 h/day):**\n| Days | Focus | Output |\n|---|---|---|\n| 1\u20133 | JS core: closures, `this`, event loop, promises (49.B 1\u20137) | say each answer aloud, record yourself |\n| 4\u20135 | CSS/HTML/a11y (8\u201312) + 3 CSS layout builds | Seller Chat layout from memory |\n| 6\u20138 | Vue reactivity, components, composables, Pinia, Router (13\u201324) | explain Seller Chat's data flow without notes |\n| 9\u201310 | Security, CORS, performance (25\u201328) | one-page cheat sheet |\n| 11\u201312 | Live-coding drills D1\u2013D10 | each under 20 min |\n| 13 | System design S1\u2013S2 | whiteboard it |\n| 14 | Full mock interview with a friend/mentor | feedback notes |\n**Self-rubric for a spoken answer (0\u20132 each):** correct \u00b7 clear structure (definition \u2192 why \u2192 example \u2192 pitfall) \u00b7 concrete example \u00b7 mentions a trade-off \u00b7 concise (< 90 s). **Aim for \u2265 8/10.**\n**Mock interview script (45 min):** 5 intro \u00b7 10 JS concepts \u00b7 10 Vue concepts \u00b7 15 live coding (D1 or D10) \u00b7 5 your questions. Ask the interviewer to interrupt with follow-ups.\n**Day-before checklist:** review your project's data flow \u00b7 re-read 49.B \u00b7 prepare 3 stories (a bug, a challenge, a learning) \u00b7 test your setup (camera, editor, internet) \u00b7 sleep.\n\n---\n**Next \u2192 Part 12: Revision (cheat sheets + job-readiness checklist, Modules 56\u201357).**\n\n\n# PART 10 \u2014 ASSIGNMENTS AND PRACTICE\n\n## How to use this part \ud83d\udfe2\nReading teaches you to *recognise* code; **writing it from a blank file teaches you to produce it**, and that is what interviews and tickets demand.\n1. **Attempt without looking at solutions.** Struggle for at least 20 minutes (use the hints first, not the solution).\n2. **Every assignment has:** *Problem* (what and why) \u00b7 *Requirements* (must do) \u00b7 *Acceptance checks* (how you know it's right: testable, so you can self-grade) \u00b7 *Hints* \u00b7 *Pitfalls* (what beginners get wrong) \u00b7 *Extra* (stretc
