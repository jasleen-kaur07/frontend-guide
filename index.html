h).\n3. **Then compare** with the solutions workbook (Modules 98\u201399 at the end of the page). Solutions include an *explanation* and *what to notice*. If yours differs but passes every acceptance check, yours is also valid.\n4. **Explain it aloud.** If you can't explain every line, redo the assignment.\n5. **Order matters** inside a module: later ones build on earlier ones.\n6. **Time guide:** HTML 20\u201340 min each \u00b7 CSS 30\u201360 min \u00b7 JS 15\u201340 min \u00b7 Vue 30\u201360 min \u00b7 Integrated 2\u20136 hours \u00b7 Company stack 1\u20134 hours.\n7. Keep a `practice/` folder with one sub-folder per assignment and commit each one: it becomes your portfolio and your revision material.\n\n**Shared datasets (copy once, reuse in many assignments):**\n```js\n// data.js: used by J-series, V-series and integrated assignments\nexport const messages = [\n  { id: 1, from: 'BUYER',  text: 'Is this available?',           ts: 1730278800000, read: true  },\n  { id: 2, from: 'SELLER', text: 'Yes, in stock.',               ts: 1730278860000, read: true  },\n  { id: 3, from: 'BUYER',  text: 'Can you ship to Pune today?',  ts: 1730279400000, read: false },\n  { id: 4, from: 'BUYER',  text: 'Also do you have size 9?',     ts: 1730279460000, read: false },\n]\nexport const orders = [\n  { id: 'A1001', buyer: 'Ravi', title: 'Red Sneakers \u00d7 1', total: 1299, status: 'PAID',    createdAt: '2026-10-28T10:00:00Z' },\n  { id: 'A1002', buyer: 'Asha', title: 'Socks \u00d7 3',        total: 399,  status: 'PENDING', createdAt: '2026-10-29T08:30:00Z' },\n  { id: 'A1003', buyer: 'Ravi', title: 'Cap \u00d7 2',          total: 598,  status: 'PAID',    createdAt: '2026-10-29T12:15:00Z' },\n  { id: 'A1004', buyer: 'Meera',title: 'Jacket \u00d7 1',       total: 2999, status: 'CANCELLED', createdAt: '2026-10-30T09:00:00Z' },\n  { id: 'A1005', buyer: 'Asha', title: 'Belt \u00d7 1',         total: 499,  status: 'PAID',    createdAt: '2026-10-30T09:45:00Z' },\n]\nexport const users = [\n  { id: 1, name: 'Ravi Kumar',  email: 'ravi@example.com',  city: 'Pune',   address: { pincode: '411001' } },\n  { id: 2, name: 'Asha Menon',  email: 'asha@example.com',  city: 'Kochi' },\n  { id: 3, name: 'meera shah',  email: 'meera@example.com', city: 'Mumbai', address: { pincode: '400001' } },\n]\n```\n\n---\n\n# MODULE 50 \u2014 HTML ASSIGNMENTS (15)\n\n*Tools:* a code editor, the browser, DevTools, and the W3C validator (validator.w3.org). *Rule:* **no CSS needed** unless stated; look is irrelevant, **structure** is the goal.\n\n### H1 \u2014 Personal profile page \ud83d\udfe2\n**Problem:** build the page recruiters would open first: who you are, skills, how to reach you. **Requirements:** `<header>` (name as the only `h1`, `<nav>` with anchor links), `<main>` with sections *About*, *Skills*, *Contact*, `<footer>`; a photo (`<img>` with meaningful `alt`), skills as `<ul>`, contact as `mailto:` and `https://` links (external ones `target=\"_blank\" rel=\"noopener noreferrer\"`).\n**Acceptance checks:** \u2610 validator: 0 errors \u00b7 \u2610 exactly one `h1`, headings never skip levels \u00b7 \u2610 nav links jump to section `id`s \u00b7 \u2610 Lighthouse accessibility \u2265 95 \u00b7 \u2610 no `<div>` used where a semantic element exists.\n**Hints:** each `<section>` gets `aria-labelledby` pointing at its heading `id`. **Pitfalls:** using `<br>` for spacing \u00b7 `alt=\"image\"` \u00b7 `<h3>` chosen because it \"looks smaller\". **Extra:** add `<details>` FAQs.\n\n### H2 \u2014 Semantic blog article \ud83d\udfe2\n**Problem:** mark up a news article so a screen reader announces its parts. **Req:** `<article>` containing `<header>` (title, `<time datetime>`), body paragraphs, `<figure>` + `<figcaption>`, `<blockquote cite>`, an `<aside>` of related links, `<footer>` with author in `<address>`.\n**Acceptance:** \u2610 DevTools \u2192 Accessibility tree shows landmarks (main, complementary, contentinfo) \u00b7 \u2610 `<time>` has a machine-readable `datetime` \u00b7 \u2610 every element chosen for meaning, not looks.\n**Hints:** `<aside>` inside `<article>` = related to the article; outside = related to the page. **Pitfalls:** wrapping everything in `<div class=\"article\">`. **Extra:** JSON-LD `Article` schema in `<head>`.\n\n### H3 \u2014 Orders data table \ud83d\udfe2\n**Problem:** show the `orders` dataset as an accessible table with a total row. **Req:** `<caption>`, `<thead>/<tbody>/<tfoot>`, `<th scope=\"col\">` and `<th scope=\"row\">`, a footer row using `colspan` for the label and the computed total.\n**Acceptance:** \u2610 5 body rows + footer \u00b7 \u2610 headers have `scope` \u00b7 \u2610 total cell is right (\u20b95,794) \u00b7 \u2610 not used for layout.\n**Hints:** a `<td>` spanning 3 columns = `colspan=\"3\"`. **Pitfalls:** header cells written as bold `<td>`. **Extra:** wrap in a `div` with `overflow-x:auto` so it scrolls on mobile.\n\n### H4 \u2014 Navigation with skip link \ud83d\udfe2\n**Problem:** navigation usable by keyboard users. **Req:** `<nav aria-label=\"Main\">` with nested `<ul>`, `aria-current=\"page\"` on the current link, a **skip link** as the first focusable element pointing to `<main id=\"main\">`.\n**Acceptance:** \u2610 first `Tab` focuses \"Skip to content\" \u00b7 \u2610 Enter jumps to main \u00b7 \u2610 whole nav operable by keyboard \u00b7 \u2610 current page announced.\n**Hints:** hide the skip link visually until focused (needs CSS: `:focus` moves it on-screen). **Extra:** dropdown using `<details>` inside a list item.\n\n### H5 \u2014 Login form \ud83d\udfe2\n**Problem:** a login form browsers and password managers understand. **Req:** email, password, \"remember me\", submit; each control has a `<label for>`; `required`, `autocomplete=\"username\"` / `\"current-password\"`, `type=\"email\"`.\n**Acceptance:** \u2610 empty submit is blocked with a browser message \u00b7 \u2610 clicking a label focuses its input \u00b7 \u2610 password manager offers to fill.\n**Pitfalls:** `placeholder` used instead of a label \u00b7 missing `name` attributes (nothing is submitted). **Extra:** show/hide password button with `aria-label` and `aria-pressed`.\n\n### H6 \u2014 Registration form \ud83d\udfe2\n**Problem:** collect structured data with the right controls. **Req:** text, email, password, date, **radio group** (gender or plan), **checkbox group** (interests), `<select>` with `<optgroup>`, `<textarea>`, terms checkbox; group related fields with `<fieldset><legend>`. Submit via **GET** first.\n**Acceptance:** \u2610 radios share one `name` \u00b7 \u2610 after submit, inspect the URL query string and **explain why an unchecked checkbox is absent** \u00b7 \u2610 then switch to POST and view the body in the Network tab.\n**Hints:** values come from `name`+`value`, not from the visible label. **Pitfalls:** radios with different `name`s (all selectable at once).\n\n### H7 \u2014 Constraint validation \ud83d\udfe2\n**Problem:** validate in HTML only, with no JS. **Req:** one field per rule: `required`, `minlength`, `maxlength`, `pattern` (Indian PIN `\\d{6}`), `min`/`max` on a number, `type=email` and a custom `title` explaining the pattern.\n**Acceptance:** \u2610 six rules each produce a message \u00b7 \u2610 style invalid fields with `:user-invalid` (or `:invalid`) \u00b7 \u2610 in the console `form.checkValidity()` and `input.validity.patternMismatch` match what you see.\n**Pitfalls:** validation messages are UX only; the server must revalidate.\n\n### H8 \u2014 File upload form \ud83d\udfe2\n**Problem:** upload photos correctly. **Req:** `<form method=\"post\" enctype=\"multipart/form-data\">`, `<input type=\"file\" accept=\"image/*\" multiple>`, label, submit.\n**Acceptance:** \u2610 Network tab shows `Content-Type: multipart/form-data; boundary=\u2026` \u00b7 \u2610 remove `enctype` and note what is sent instead (only the file *names*) \u00b7 \u2610 explain why.\n**Extra:** preview the chosen image with `URL.createObjectURL`.\n\n### H9 \u2014 Media page \ud83d\udfe2\n**Problem:** embed video/audio that degrades gracefully. **Req:** `<video controls poster>` with two `<source>` formats, a captions `<track kind=\"captions\" srclang=\"en\" label=\"English\" default>`, fallback text inside, plus an `<audio controls>`.\n**Acceptance:** \u2610 plays \u00b7 \u2610 captions toggle \u00b7 \u2610 fallback shown when the tag is unsupported.\n**Extra:** custom play button via the `HTMLMediaElement` API.\n\n### H10 \u2014 Responsive images \ud83d\udfe1\n**Problem:** serve the right image size per device without layout shift. **Req:** one `<img srcset sizes>` and one `<picture>` with a WebP `<source>` and JPEG fallback; `width`/`height` set; `loading=\"lazy\"` below the fold.\n**Acceptance:** \u2610 DevTools Network shows a different file at 400px vs 1200px viewport \u00b7 \u2610 no layout shift while loading (Performance/Lighthouse CLS 0) \u00b7 \u2610 `alt` present.\n**Pitfalls:** `sizes` missing (browser assumes 100vw).\n\n### H11 \u2014 Native dialog \ud83d\udfe1\n**Problem:** an accessible modal without a library. **Req:** `<dialog>` opened with `showModal()`, closed by Esc and by a Cancel button; a `<form method=\"dialog\">` with OK/Cancel.\n**Acceptance:** \u2610 backdrop dims the page, background not clickable \u00b7 \u2610 focus moves into the dialog and returns to the trigger on close \u00b7 \u2610 `dialog.returnValue` logs `\"ok\"`/`\"cancel\"`.\n**Pitfalls:** using `show()` (not modal) \u00b7 `display:none` hacks.\n\n### H12 \u2014 Accordion without JavaScript \ud83d\udfe2\n**Problem:** FAQ that works with the keyboard. **Req:** 4 `<details><summary>` items, the first `open`; then make them **exclusive** with the shared `name` attribute.\n**Acceptance:** \u2610 Enter/Space toggles \u00b7 \u2610 opening one closes the others \u00b7 \u2610 screen reader announces expanded/collapsed.\n\n### H13 \u2014 Div-soup refactor \ud83d\udfe1\n**Problem:** fix this inaccessible page (starter below). **Req:** replace non-semantic wrappers, correct heading levels, add labels, `alt`, a `lang`, a real `<button>`.\n```html\n<div class=\"top\"><div class=\"logo\">ShopX<\/div><div class=\"menu\"><div onclick=\"go('home')\">Home<\/div><div onclick=\"go('cart')\">Cart<\/div><\/div><\/div>\n<div class=\"content\"><div class=\"big\">Today's deals<\/div><div class=\"small\">Hand picked for you<\/div>\n  <img src=\"shoe.jpg\"><div class=\"item\"><div class=\"name\">Red Sneakers<\/div><div class=\"price\">\u20b91,299<\/div><div class=\"btn\" onclick=\"buy()\">Buy<\/div><\/div>\n  Name <input> Email <input><\/div><div class=\"bottom\">\u00a9 ShopX<\/div>\n```\n**Acceptance:** \u2610 list **10 changes** each with a one-line reason \u00b7 \u2610 Lighthouse accessibility score before vs after recorded \u00b7 \u2610 keyboard can reach and activate every control.\n\n### H14 \u2014 Metadata and SEO \ud83d\udfe2\n**Problem:** make a page shareable and indexable. **Req:** `lang`, `<title>`, `meta description`, `viewport`, canonical `link`, Open Graph (`og:title/description/image`), favicon.\n**Acceptance:** \u2610 each tag's purpose explained in a comment \u00b7 \u2610 pasting the URL into a social preview debugger (or reading the tags) shows correct data.\n\n### H15 \u2014 Script loading experiment \ud83d\udfe1\n**Problem:** understand how scripts block parsing. **Req:** three pages loading the same `app.js` (a) in `<head>` plain, (b) with `async`, (c) with `defer`; the script logs `document.readyState` and whether `#target` exists (`document.getElementById('target')`).\n**Acceptance:** \u2610 a results table (page \u00d7 readyState \u00d7 element found) \u00b7 \u2610 correct explanation of why (a) finds `null` \u00b7 \u2610 run (b) 5 times and note the order can vary with two scripts.\n**Extra:** `type=\"module\"` (deferred by default).\n\n---\n\n# MODULE 51 \u2014 CSS ASSIGNMENTS (20)\n\n*Use* `index.html` starter files you write yourself; commit each assignment. *Rule:* **no frameworks**, DevTools open the whole time.\n\n### C1 \u2014 Selector drill \ud83d\udfe2\n**Problem:** style elements using *only* selectors (no new classes in the HTML). **Starter HTML (use as is):**\n```html\n<ul class=\"menu\"><li><a href=\"/home\" class=\"active\">Home<\/a><\/li><li><a href=\"https://x.com\" target=\"_blank\">X<\/a><\/li><li><a href=\"/files/a.pdf\">PDF<\/a><\/li><li class=\"disabled\"><a>Soon<\/a><\/li><\/ul>\n<article><h2>T<\/h2><p>First<\/p><p>Second<\/p><p lang=\"hi\">\u0924\u0940\u0938\u0930\u093e<\/p><button>One<\/button><button disabled>Two<\/button><\/article>\n<table><tr><td>1<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>4<\/td><\/tr><\/table>\n```\n**Req (15 rules):** external links (`[target=_blank]`), PDF links (`[href$=\".pdf\"]`), every second row (`:nth-child(even)`), the paragraph right after `h2` (`h2 + p`), all paragraphs after the first (`p ~ p`), buttons that are not disabled (`button:not(:disabled)`), `li` containing an `a.active` (`li:has(> a.active)`), direct-child only (`.menu > li`), `:first-child`/`:last-child`, `:focus-visible`, `p[lang=\"hi\"]`, etc.\n**Acceptance:** \u2610 15 distinct selectors, each commented with what it matches \u00b7 \u2610 no change to the HTML \u00b7 \u2610 DevTools shows the intended elements matched.\n\n### C2 \u2014 Specificity quiz \ud83d\udfe1\n**Problem:** predict before you check. **Req:** write 10 conflicting rules targeting one `<p id=\"a\" class=\"b c\">` (type, class, id, attribute, `:not()`, inline style, `!important`, same-specificity-later-wins, inherited vs direct), **write your predicted colour next to each**, then verify in DevTools \u2192 Styles.\n**Acceptance:** \u2610 \u2265 9/10 correct \u00b7 \u2610 each answer cites the specificity tuple (a,b,c) or the rule (order, `!important`, inheritance).\n**Hints:** `0-1-0` class, `1-0-0` id, `0-0-1` type; `:where()` adds 0.\n\n### C3 \u2014 Box model card \ud83d\udfe2\n**Req:** a `.card` with `width:300px; padding:20px; border:5px solid; margin:20px`; measure the **rendered width** with DevTools under `content-box` and `border-box`.\n**Acceptance:** \u2610 table of measurements (350px vs 300px) \u00b7 \u2610 switch globally with `*,*::before,*::after{box-sizing:border-box}` \u00b7 \u2610 explain margin collapsing with two stacked paragraphs.\n\n### C4 \u2014 Typography system \ud83d\udfe2\n**Req:** root `font-size:100%`; scale in `rem` (`--step-0:1rem` \u2026 `--step-4`); unitless `line-height:1.5`; two font families with fallbacks; paragraphs `max-width:65ch`; fluid heading via `clamp(1.75rem, 4vw, 3rem)`.\n**Acceptance:** \u2610 every size is a variable \u00b7 \u2610 zoom to 200% and text reflows without horizontal scroll \u00b7 \u2610 no `px` font sizes.\n\n### C5 \u2014 Colour tokens and themes \ud83d\udfe1\n**Req:** light/dark themes with CSS variables; a toggle button that sets `data-theme` on `<html>`; default from `prefers-color-scheme`; persisted in `localStorage`.\n**Acceptance:** \u2610 zero literal colours outside the token blocks \u00b7 \u2610 contrast \u2265 4.5:1 in both themes \u00b7 \u2610 works with no JS (system preference) \u00b7 \u2610 no flash of wrong theme on reload.\n**Pitfall:** defining a token only inside `[data-theme=\"dark\"]` (it's undefined in light).\n\n### C6 \u2014 Centre it six ways \ud83d\udfe2\n**Req:** centre a 200\u00d7100 box in a 400\u00d7300 container using: flex, grid `place-items`, `margin:auto` (horizontal), absolute + `transform`, absolute + `inset:0; margin:auto`, grid `place-content`.\n**Acceptance:** \u2610 six working demos \u00b7 \u2610 one sentence each on when you'd use it (flex/grid for layout; transform for overlays).\n\n### C7 \u2014 Positioning: badge, sticky header, toast \ud83d\udfe1\n**Req:** avatar with an absolutely positioned unread badge in its corner; a `position:sticky; top:0` header over a long page; a `position:fixed` toast bottom-right.\n**Acceptance:** \u2610 badge stays anchored when the avatar moves (parent is `position:relative`) \u00b7 \u2610 sticky works (no `overflow:hidden` on ancestors) \u00b7 \u2610 toast stays during scroll.\n**Pitfall:** forgetting the positioned parent: the badge flies to the page corner.\n\n### C8 \u2014 z-index / stacking-context lab \ud83d\udd34\n**Req:** reproduce a modal (`z-index:9999`) hidden **behind** a header (`z-index:10`) because the modal sits inside a wrapper with `transform: translateZ(0)`. Fix it two ways.\n**Acceptance:** \u2610 explain **which property created the stacking context** \u00b7 \u2610 fix A: move modal to `<body>` \u00b7 \u2610 fix B: remove the transform/restructure \u00b7 \u2610 list five properties that create contexts (`transform`, `opacity<1`, `filter`, `position+z-index`, `isolation:isolate`).\n\n### C9 \u2014 Navbar with flexbox \ud83d\udfe2\n**Req:** logo left, links centre, actions right (`margin-left:auto`); wraps gracefully on mobile; gap via `gap`.\n**Acceptance:** \u2610 no fixed widths \u00b7 \u2610 works at 320px \u00b7 \u2610 keyboard focus visible. **Extra:** hamburger (checkbox hack or small JS toggling `aria-expanded`).\n\n### C10 \u2014 Chat layout \ud83d\udfe1\n**Problem:** the layout of Seller Chat: sidebar + room; header / message list / composer; **only the message list scrolls**.\n**Acceptance:** \u2610 no page-level scrollbar at 320 \u2192 1440 px \u00b7 \u2610 composer always visible \u00b7 \u2610 works with 200 messages \u00b7 \u2610 explain why `min-height:0` is needed on the scrolling flex child.\n**Hints:** `height:100dvh`, `display:flex; flex-direction:column`, `.messages{flex:1; min-height:0; overflow-y:auto}`.\n\n### C11 \u2014 Message bubbles \ud83d\udfe1\n**Req:** mine (right, tinted) vs theirs (left, bordered), `max-width`, long words/URLs wrap, timestamp inside, consecutive messages grouped.\n**Acceptance:** \u2610 a 200-character unbroken string doesn't overflow (`overflow-wrap:anywhere`) \u00b7 \u2610 newlines preserved (`white-space:pre-wrap`). **Extra:** tails with `::after`.\n\n### C12 \u2014 Product grid \ud83d\udfe2\n**Req:** responsive card grid with `repeat(auto-fill, minmax(220px,1fr))`, equal-height cards, image with `aspect-ratio`.\n**Acceptance:** \u2610 columns change with width **without a single media query** \u00b7 \u2610 cards align when titles have different lengths (flex column with `margin-top:auto` on the button).\n\n### C13 \u2014 Holy-grail layout \ud83d\udfe1\n**Req:** header, footer, sidebar, main using `grid-template-areas`; single column on mobile, two columns \u2265 768px; footer sticks to the bottom on short pages.\n**Acceptance:** \u2610 area names in the CSS read like a map \u00b7 \u2610 `min-height:100dvh` works with little content.\n\n### C14 \u2014 Dashboard grid \ud83d\udfe1\n**Req:** four stat cards, a chart area spanning 2 columns, a full-width table row; `grid-column: span 2`; reorder on mobile.\n**Acceptance:** \u2610 4 \u2192 2 \u2192 1 columns across breakpoints \u00b7 \u2610 no horizontal page scroll (tables scroll inside their wrapper).\n\n### C15 \u2014 Mobile-first responsive page \ud83d\udfe1\n**Req:** base styles for mobile; `@media (min-width:768px)` and `(min-width:1024px)` enhance; fluid type with `clamp`; fluid spacing; images `max-width:100%`.\n**Acceptance:** \u2610 test at 320, 768, 1024, 1440 \u00b7 \u2610 no `max-width` queries \u00b7 \u2610 touch targets \u2265 44px.\n\n### C16 \u2014 Container-query card \ud83d\udd34\n**Req:** a card that switches from stacked to side-by-side **based on its container**, shown in a narrow sidebar and a wide main area simultaneously.\n**Acceptance:** \u2610 same component, two layouts at the same viewport width \u00b7 \u2610 uses `container-type:inline-size` and `@container (min-width:400px)`.\n\n### C17 \u2014 Transitions and states \ud83d\udfe2\n**Req:** a button with hover, `:active`, `:focus-visible`, `:disabled` states, transitions on `background-color` and `transform`, and `prefers-reduced-motion` respected.\n**Acceptance:** \u2610 focus ring visible with the keyboard only \u00b7 \u2610 disabled button doesn't animate \u00b7 \u2610 reduced-motion users get no motion.\n\n### C18 \u2014 Skeleton loader \ud83d\udfe1\n**Req:** shimmering placeholder rows for a chat list using `@keyframes` on `background-position`.\n**Acceptance:** \u2610 only `transform`/`opacity`/`background-position` animated \u00b7 \u2610 respects reduced motion \u00b7 \u2610 matches the real item's dimensions (no layout shift when data arrives).\n\n### C19 \u2014 BEM refactor \ud83d\udfe1\n**Problem:** tame this CSS:\n```css\n.sidebar .list ul li a span.name { color:#333 !important; font-weight:bold }\n#app .sidebar .list ul li.active a span.name { color:#fff !important }\n```\n**Req:** rewrite with BEM (`.chat-item`, `.chat-item__name`, `.chat-item--active`), specificity \u2264 0-2-0, no `!important`, no IDs.\n**Acceptance:** \u2610 same visual result \u00b7 \u2610 selector depth \u2264 2 \u00b7 \u2610 explain why the original forced `!important`.\n\n### C20 \u2014 Reflow lab \ud83d\udd34\n**Req:** animate a box with `left` vs `transform: translateX`; record both in DevTools **Performance**; compare *Layout / Paint / Composite* activity; try on a throttled CPU (4\u00d7).\n**Acceptance:** \u2610 screenshots of both flame charts \u00b7 \u2610 conclusion: `left` triggers Layout+Paint each frame, `transform` only Composite \u00b7 \u2610 list five other cheap-to-animate properties (`opacity`, `filter` with care\u2026).\n\n---\n\n# MODULE 52 \u2014 JAVASCRIPT ASSIGNMENTS (30)\n\n*Run in Node (`node file.js`) or the browser Console.* Use `data.js` above. Test with `console.assert(actual === expected, 'message')`. Each task lists **Spec (examples)** so you know the exact contract.\n\n### Fundamentals\n**J1 Types & equality \ud83d\udfe2.** *Spec:* predict then verify `typeof` for `42, '42', null, undefined, [], {}, () => {}, NaN, 10n, Symbol(), new Date(), /x/` and `==` vs `===` for 10 pairs (`0 == ''`, `null == undefined`, `'1' == 1`, `[] == false`\u2026). *Acceptance:* every result has a one-line coercion/typeof reason. *Pitfall:* `typeof null === 'object'`.\n**J2 Type conversion \ud83d\udfe2.** *Spec:* `toNumber('\u20b91,299') \u2192 1299`, `toNumber('') \u2192 null`, `toNumber('abc') \u2192 null`, `toNumber('12.5') \u2192 12.5`. *Hints:* strip non-digits except `.`/`-`, check empty first, `Number.isNaN`.\n**J3 Optional chaining \ud83d\udfe2.** *Spec:* `getPincode(users[1]) \u2192 'N/A'`, `getPincode(users[0]) \u2192 '411001'`, `getPincode(null) \u2192 'N/A'` using `?.` and `??`. *Pitfall:* `||` would also replace `0`/`''`.\n**J4 Loops \ud83d\udfe2.** *Spec:* FizzBuzz 1\u2013100; a formatted multiplication table 1\u201310 (aligned columns with `padStart`).\n**J5 Control flow \ud83d\udfe2.** *Spec:* `stockLabel(0)='Out of stock'`, `(3)='Low stock'`, `(50)='In stock'`; write it with if/else, with a `switch(true)`, and with a lookup table; say which you'd keep.\n**J6 Functions \ud83d\udfe2.** *Spec:* `clamp(15,0,10)=10`, `capitalize('rAVI')='Ravi'`, `isPalindrome('A man, a plan, a canal: Panama')=true`, `sum()=0`, `sum(1,2,3)=6`. *Acceptance:* edge cases (empty string, negative, no args) handled.\n**J7 Higher-order functions \ud83d\udfe1.** *Spec:* `repeat(3, i => log(i))` runs 3\u00d7; `once(fn)` runs once and returns the cached result; `pipe(trim, lower, slug)('  Hi There ') \u2192 'hi-there'`.\n**J8 Recursion \ud83d\udfe1.** *Spec:* `factorial(5)=120`; `flattenDeep([1,[2,[3,[4]]]]) \u2192 [1,2,3,4]`; `countTree` over nested comments `{id, replies:[\u2026]}` returns total comments. *Acceptance:* base case stated; explain the call stack for `factorial(3)`.\n\n### Arrays and objects\n**J9 Array basics \ud83d\udfe2.** Add/remove/insert with `push/pop/shift/unshift/splice`; copy with `slice`/spread; **list which methods mutate** (`push, pop, splice, sort, reverse`) and which return new arrays (`map, filter, slice, concat, toSorted`).\n**J10 map/filter/reduce \ud83d\udfe1.** From `messages`: unread count (2), array of texts, messages per sender `{BUYER:3, SELLER:1}`.\n**J11 Orders analytics \ud83d\udfe1.** From `orders`: revenue of PAID (`1299+598+499 = 2396`), group by status, top 3 by total, average order value, orders per buyer.\n**J12 Sorting \ud83d\udfe1.** Sort users by name with `localeCompare` (note `'meera shah'` lowercase: use `{sensitivity:'base'}`), messages newest first, numbers ascending (default `sort` is **string** order!). *Acceptance:* original array unchanged (`[...arr].sort` or `toSorted`).\n**J13 find/some/every \ud83d\udfe2.** `hasUnread`, `allPaid`, `findOrder(id)`; then build a `Map` index and compare lookup cost for 10,000 items (`console.time`).\n**J14 De-duplicate \ud83d\udfe1.** Given messages with duplicate ids from a flaky network, keep the **latest by `ts`** using `Map`; also show a `Set` for primitives.\n**J15 Objects & destructuring \ud83d\udfe1.** `byId(users)` \u2192 `{1:{\u2026},2:{\u2026}}`; `pick(o, keys)`, `omit(o, keys)`; destructure `const { data: { content = [], totalElements = 0 } = {} } = response` safely.\n**J16 Copying \ud83d\udfe1.** Demonstrate the shallow-copy bug (`{...a}` shares `address`), fix with `structuredClone`; show what `JSON.parse(JSON.stringify())` does to `Date`, `undefined`, `Map`.\n**J17 JSON and API shape \ud83d\udfe1.** Parse this Spring page into a view-model with `Date` objects and safe defaults:\n```json\n{ \"content\": [ { \"id\": 1, \"buyerName\": \"Ravi\", \"lastMessageAt\": \"2026-10-30T09:12:00Z\", \"unread\": null } ], \"totalElements\": 1 }\n```\n*Acceptance:* `unread: null \u2192 0`; invalid date \u2192 `null` not \"Invalid Date\".\n\n### Scope, closures, this, classes\n**J18 Scope and hoisting \ud83d\udd34.** Predict output for 8 snippets (`var`/`let`/TDZ, function declaration vs expression hoisting, shadowing); draw the call stack for one.\n**J19 Closures \ud83d\udfe1.** `makeCounter()` with `inc/reset/get`; a private wallet (`deposit/balance` with no direct access); `withPrefix('[ERR] ')`; fix the classic `for (var i\u2026) setTimeout` bug two ways.\n**J20 Debounce and throttle \ud83d\udfe1.** Implement both; simulate 20 keystrokes 50 ms apart; log timestamps proving debounce fires once and throttle fires every N ms. *Extra:* `leading`/`trailing` options, `cancel()`.\n**J21 Memoize \ud83d\udfe1.** `memoize(fn)` with a `Map`; naive `fib(35)` vs memoised timing; explain why keys from `JSON.stringify(args)` have limits.\n**J22 `this` \ud83d\udd34.** Fix four broken snippets: a detached method (`const f = obj.m`), an arrow function as an object method, a nested callback losing `this`, a DOM event handler. Use `bind`, arrow functions, or `call`.\n**J23 Classes \ud83d\udfe1.** `Shape \u2192 Circle/Rect` with `area()` and `toString()`; a private field `#id`; a `static from(json)` factory; compare with the Java equivalent in comments.\n**J24 EventEmitter \ud83d\udd34.** `on/off/once/emit`; `on` returns an unsubscribe function; calling `off` during `emit` must not skip listeners.\n\n### Async\n**J25 Promises \ud83d\udfe1.** `sleep(ms)`; `timeout(promise, ms)` rejecting with `Error('timeout')`; demo `Promise.all` vs `allSettled` vs `race` vs `any` with mixed success/failure; print each result.\n**J26 Async/await \ud83d\udfe1.** Using JSONPlaceholder, load `/users` and `/posts?_limit=5` **in parallel**, join author names, handle `!res.ok`, and print sequential vs parallel timing.\n**J27 Retry and abort \ud83d\udd34.** `retry(fn, {tries:3, baseMs:200})` with exponential backoff + jitter, no retry on 4xx; `fetchWithTimeout` via `AbortController`; prove the request is actually cancelled (Network tab shows \"canceled\").\n**J28 Event-loop prediction \ud83d\udd34.** Predict the output order of 10 snippets mixing `setTimeout`, `Promise.then`, `await`, `queueMicrotask`, nested timers. *Acceptance:* \u2265 9/10 with the queue trace for each. Example:\n```js\nconsole.log(1); setTimeout(() => console.log(2)); Promise.resolve().then(() => console.log(3)); (async () => { console.log(4); await null; console.log(5) })(); console.log(6)\n// predict, then run\n```\n\n### Browser and API\n**J29 DOM rendering \ud83d\udfe1.** Render `chats` from data with `createElement`/`replaceChildren`; live search filter; empty state; **XSS-safe** (`textContent`): test with a name `<img src=x onerror=alert(1)>`.\n**J30 Posts viewer \ud83d\udd34.** Fetch JSONPlaceholder posts: pagination (`_page`, `_limit`), debounced search, create/edit/delete (it fakes persistence), loading + error + empty states, using a small `http()` wrapper. *Acceptance:* typing \"ab\" then quickly \"abc\" never shows results for \"ab\" last (race handled).\n\n**Evaluation (each):** \u2610 correct on the spec examples \u2610 edge cases handled \u2610 readable names \u2610 inputs not mutated unless intended \u2610 complexity noted where relevant \u2610 you can explain every line.\n**Extra challenge:** write Vitest tests for J6\u2013J15 and J19\u2013J21.\n\n---\n**Continue \u2192 Vue, integrated, and company-stack assignments.**\n\n\n# MODULE 53 \u2014 VUE ASSIGNMENTS (30)\n\n*Setup:* `npm create vue@latest practice-vue` (Router, Pinia, Vitest). Use `<script setup>`. Datasets are in `data.js` (Module 50 intro). Each assignment: **Req \u00b7 Acceptance checks \u00b7 Hints \u00b7 Pitfalls \u00b7 Extra**. Do V1\u2013V7 before components, V8\u2013V15 before composables, etc.\n\n### Reactivity and templates\n**V1 Counter \ud83d\udfe2.** *Req:* +, \u2212, Reset; \u2212 disabled at 0; show \"even\"/\"odd\". *Acceptance:* \u2610 no `document.querySelector` anywhere \u2610 parity is a `computed` \u2610 `:disabled` bound. *Pitfall:* writing `count` without `.value` in script.\n**V2 Directives tour \ud83d\udfe2.** *Req:* one page demonstrating `v-if/else-if/else`, `v-show`, `v-for` over an array, an object and a range, `:class`/`:style` bindings, `@click.stop`, `@submit.prevent`, `@keyup.enter`. *Acceptance:* \u2610 every `v-for` has a stable `:key` \u2610 a comment explains `v-if` vs `v-show` (DOM removal vs `display:none`) \u2610 never `v-if` and `v-for` on the same element.\n**V3 Todo list \ud83d\udfe1.** *Req:* add, toggle, delete, filter (all/active/done), remaining counter, empty state. *Acceptance:* \u2610 filtered list is a `computed` \u2610 ids not indexes as keys \u2610 blank input ignored. *Extra:* persist to `localStorage` via `watch`.\n**V4 Reactivity bugs lab \ud83d\udd34.** *Req:* reproduce and fix four bugs: (1) destructured `reactive`, (2) replaced a `reactive` variable, (3) plain `let` not reactive, (4) reading the DOM before `nextTick`. *Acceptance:* \u2610 each bug has a \"before\" demo, a \"why\", and an \"after\".\n**V5 `ref` vs `reactive` \ud83d\udfe1.** *Req:* the same form state written both ways; use `toRefs`; reset the form. *Acceptance:* \u2610 short written trade-off \u2610 both reset correctly.\n**V6 Computed cart \ud83d\udfe1.** *Req:* items with price/qty; subtotal, 18% tax, total, item count as `computed`; INR formatting via `Intl`. *Acceptance:* \u2610 no arithmetic in the template \u2610 qty cannot go below 1 \u2610 totals update instantly.\n**V7 Watchers \ud83d\udfe1.** *Req:* (a) watch search text and log; (b) watch an `id` ref and fetch `/posts/:id` with `onCleanup` aborting the previous request; (c) `immediate: true`. *Acceptance:* \u2610 rapid id changes never show an old post \u2610 no unhandled `AbortError`.\n\n### Components\n**V8 Components basics \ud83d\udfe2.** Extract `ChatItem` and `ChatList`. *Acceptance:* \u2610 parent owns data, child receives props \u2610 no prop mutation.\n**V9 Props validation \ud83d\udfe1.** `UserCard` with typed, required, default, validator props; trigger each warning on purpose and read it. *Pitfall:* object/array defaults must be factories (`() => ({})`).\n**V10 Emits \ud83d\udfe1.** `QuantityStepper` using `update:modelValue` (+ `change`); parent keeps the cart in sync. *Acceptance:* \u2610 child never mutates a prop \u2610 works with `v-model`.\n**V11 `defineModel` and `BaseInput` \ud83d\udfe1.** Label, error text, `v-model`, `aria-describedby`. *Acceptance:* \u2610 label click focuses input \u2610 error announced (`role=\"alert\"`) \u2610 unique ids.\n**V12 Slots \ud83d\udfe2.** `BaseCard` with `header`, default, `footer` slots + fallback content; footer hidden when not provided (`$slots.footer`).\n**V13 Scoped slots \ud83d\udd34.** `DataList` exposing `{ item, index }`; use it for orders and users with different renderings. *Acceptance:* \u2610 one component, two looks \u2610 explain who owns the data and who owns the markup.\n**V14 BaseModal \ud83d\udd34.** Teleported, `v-model:open`, Esc and overlay close, focus return, actions slot. *Acceptance:* \u2610 keyboard-only usable \u2610 page scroll locked while open \u2610 no z-index fight.\n**V15 Lifecycle logger \ud83d\udfe1.** Parent + child logging every hook; toggle the child with `v-if`; record the exact order. *Acceptance:* \u2610 order table for mount, update, unmount \u2610 explain why `mounted` of child runs before parent's.\n\n### Composables and async\n**V16 Fetch on mount \ud83d\udfe1.** Posts list with loading / error / empty / success + retry; abort on unmount. *Acceptance:* \u2610 leaving the page mid-request logs no error.\n**V17 Cleanup \ud83d\udfe1.** A live clock + window-resize listener; toggle the component 20\u00d7 and check (Performance Monitor) that listener count doesn't grow. *Acceptance:* \u2610 screenshot before/after fixing a deliberately leaky version.\n**V18 Composables \ud83d\udfe1.** `useCounter`, `useToggle`, `useLocalStorage(key, default)`; use two of them in two components. *Acceptance:* \u2610 each returns refs \u2610 `useLocalStorage` survives refresh and tolerates storage errors.\n**V19 `useFetch` \ud83d\udd34.** Reactive URL (ref or getter), `data/loading/error`, `refetch`, abort. *Acceptance:* \u2610 changing the id refetches automatically \u2610 stale responses ignored.\n**V20 Debounced search \ud83d\udd34.** `useDebouncedRef` + `?q=` search with abort and \"no results\". *Acceptance:* \u2610 one request per pause \u2610 clearing the box shows the full list.\n\n### Forms\n**V21 Form validation \ud83d\udfe1.** Registration: `touched`, `errors` computed, disabled-while-submitting, mapping `{errors:[{field,message}]}` from a mock 400 to fields. *Acceptance:* \u2610 no error before the user leaves a field \u2610 all errors on submit \u2610 server errors under the right inputs.\n**V22 Dynamic form \ud83d\udfe1.** Add/remove phone rows with stable `uid`s; validate each; payload preview. *Pitfall:* index keys make inputs swap values on delete.\n\n### Router, state, API\n**V23 Router basics \ud83d\udfe2.** Three pages, `RouterLink` nav with active class, 404 catch-all, lazy-loaded views (confirm separate chunks in Network).\n**V24 Dynamic routes \ud83d\udfe1.** `/users/:id` reacting to param changes via `watch`, plus `?tab=posts|todos` synced to the URL. *Acceptance:* \u2610 Back/Forward restores the tab \u2610 going `/users/1 \u2192 /users/2` refetches.\n**V25 Guards \ud83d\udfe1.** Login + protected routes with `meta.requiresAuth`, redirect-back, logout, and a safe-redirect check. *Acceptance:* \u2610 refreshing a protected URL when logged out returns you there after login \u2610 `?redirect=https://evil.com` is ignored.\n**V26 Pinia store \ud83d\udfe1.** `useCartStore` (state/getters/actions), shared by two components, `storeToRefs`, persisted. *Acceptance:* \u2610 destructuring state without `storeToRefs` demonstrated as a bug.\n**V27 Async store \ud83d\udd34.** `useUsersStore` with `fetchUsers`, status/error, and caching (skip refetch if loaded < 60 s unless `force`).\n**V28 API service layer \ud83d\udfe1.** `http.js` (env base URL, auth header, error normaliser) + `userApi`; mock/real switch via `VITE_USE_MOCK`. *Acceptance:* \u2610 no component imports axios/fetch \u2610 switching the env var needs no component change.\n**V29 Pagination + search page \ud83d\udd34.** Users table with server-style pagination (mock `Page`), debounced search, skeleton rows, URL query sync. *Acceptance:* \u2610 page resets to 0 when search changes \u2610 reload keeps the state.\n**V30 Communication map \ud83d\udd34.** Build one small app using props, emits, `v-model`, slots, provide/inject and Pinia; draw the data-flow diagram and justify each choice. *Acceptance:* \u2610 every mechanism used where it fits best (not everything through Pinia).\n\n**Evaluation (each):** works as specified \u00b7 correct reactivity \u00b7 clean component boundaries \u00b7 loading/error/empty handled \u00b7 accessible labels and keyboard \u00b7 no console warnings. **Extra:** Vitest tests for V6, V10, V21, V26.\n\n---\n\n# MODULE 54 \u2014 INTEGRATED FRONTEND ASSIGNMENTS (15)\n\nEach combines HTML + CSS + JS + Vue (+ API). *Format:* **Problem \u00b7 Requirements \u00b7 Acceptance checks \u00b7 Hints \u00b7 Pitfalls \u00b7 Extra.** Budget 2\u20136 hours each. Commit as you go with meaningful messages.\n\n### I1 \u2014 Contact form end-to-end \ud83d\udfe1\n**Problem:** the same form twice (vanilla, then Vue) posting to JSONPlaceholder `/posts`. **Req:** labels, validation, loading/error/success states, disabled submit, accessible alerts. **Acceptance:** \u2610 success shows the returned id (101) \u2610 identical behaviour in both versions \u2610 a table comparing lines of DOM code vs Vue \u2610 errors announced with `role=\"alert\"`. **Hints:** `preventDefault`, `FormData` vs `reactive`. **Pitfall:** double submit. **Extra:** map a mocked Spring 400 to fields.\n\n### I2 \u2014 Live search with filters \ud83d\udfe1\n**Req:** products (mock API), debounced search, category filter, sort, empty state, URL query sync. **Acceptance:** \u2610 back/forward restores filters \u2610 no stale results \u2610 query in the URL is shareable. **Extra:** highlight matches with `<mark>` **without** `v-html`.\n\n### I3 \u2014 Dropdown and modal toolkit \ud83d\udd34\n**Req:** accessible custom dropdown (arrows/Home/End/Esc, `aria-expanded`) and modal (focus trap), first vanilla then as Vue components. **Acceptance:** \u2610 axe DevTools reports 0 violations \u2610 fully keyboard operable \u2610 focus returns to trigger.\n\n### I4 \u2014 Data table with pagination \ud83d\udfe1\n**Req:** employees table: sortable columns, pagination, page-size select, loading skeleton, empty state. **Acceptance:** \u2610 sorting doesn't mutate source \u2610 page resets on sort/filter change \u2610 screen reader announces sort (`aria-sort`). **Extra:** server-driven pagination with a `Page` mock.\n\n### I5 \u2014 File upload with preview \ud83d\udd34\n**Req:** drag-and-drop zone, type/size validation, previews via `createObjectURL` (revoked after use), progress bar (XHR), cancel, error states. **Acceptance:** \u2610 rejected files explain why \u2610 cancel aborts the request \u2610 no memory leak from object URLs. **Extra:** multiple files with per-file status.\n\n### I6 \u2014 Login and authentication flow \ud83d\udd34\n**Req:** login form, auth store, token handling, route guard, 401 interceptor, logout, remember redirect. **Acceptance:** \u2610 refresh keeps the session (document your storage choice and its XSS trade-off) \u2610 no token in logs or URLs \u2610 logout clears every store.\n\n### I7 \u2014 Chat message list \ud83d\udd34\n**Req:** bubbles, auto-scroll only when near bottom, optimistic send with failed/retry, timestamps, date separators (\"Today\"). **Acceptance:** \u2610 sending feels instant \u2610 failure shows Retry and keeps the text \u2610 reading old messages isn't interrupted by new ones. **Extra:** infinite scroll upward with `IntersectionObserver`.\n\n### I8 \u2014 Reusable component library \ud83d\udd34\n**Req:** `BaseButton`, `BaseInput`, `BaseSelect`, `BaseModal`, `BaseBadge`, `BaseToast` with tokens, variants, slots, and a docs page showing every state. **Acceptance:** \u2610 consistent prop names \u2610 a11y roles \u2610 theming only through tokens.\n\n### I9 \u2014 Dashboard with API data \ud83d\udd34\n**Req:** stat cards, SVG or Chart.js chart, recent orders table, date-range filter, loading/error **per widget**. **Acceptance:** \u2610 `Promise.allSettled` so one failing widget doesn't blank the page \u2610 skeletons \u2610 auto-refresh with cleanup.\n\n### I10 \u2014 Multi-step form wizard \ud83d\udfe1\n**Req:** 3 steps, per-step validation, progress indicator, back/next, summary, submit, data preserved across steps. **Acceptance:** \u2610 can't skip ahead with invalid data \u2610 browser Back moves a step (router or history) \u2610 draft saved to `localStorage`.\n\n### I11 \u2014 Notification center (real-time) \ud83d\udd34\n**Req:** WebSocket mock (`setInterval` emitter) \u2192 store \u2192 toast + badge + list, mark read, reconnect with backoff. **Acceptance:** \u2610 leaving the page closes the socket \u2610 no duplicate listeners after navigation \u2610 unread badge correct. **Extra:** SSE variant.\n\n### I12 \u2014 Theme switcher + responsive shell \ud83d\udfe1\n**Req:** light/dark/system with tokens, sidebar collapses on mobile, preference persisted, `useTheme` composable. **Acceptance:** \u2610 no flash of wrong theme \u2610 contrast \u2265 4.5:1 both themes \u2610 keyboard-operable drawer.\n\n### I13 \u2014 E-commerce cart flow \ud83d\udd34\n**Req:** product list \u2192 detail (dynamic route) \u2192 cart (Pinia) \u2192 checkout form \u2192 confirmation; persisted cart; loading/error handling. **Acceptance:** \u2610 out-of-stock handled \u2610 checkout double-submit prevented \u2610 order total computed once (store getter).\n\n### I14 \u2014 Error and resilience lab \ud83d\udd34\n**Req:** a mock API that can simulate offline, 500, 401, timeout and malformed JSON; global error handler, toast, retry, error-boundary component. **Acceptance:** \u2610 the user never sees a raw stack trace \u2610 each scenario has a distinct, helpful message \u2610 errors reach a (stub) monitoring function with request id.\n\n### I15 \u2014 Frontend \u2194 Spring Boot integration \ud83c\udfed\n**Req:** take any earlier app; switch from mock to your real Spring service; Vite proxy/CORS, DTO contract, validation-error mapping, auth. **Acceptance:** \u2610 a written trace of one request: browser \u2192 controller \u2192 service \u2192 repository \u2192 DB \u2192 UI \u2610 contract document \u2610 at least one real bug found and fixed using the Network tab + backend logs.\n\n---\n## Self-check rubric for every assignment\n| Criterion | 0 | 1 | 2 |\n|---|---|---|---|\n| Works as specified | broken | mostly | fully |\n| Edge, error, empty and loading states | none | some | all |\n| Code clarity and structure | tangled | ok | clean, small units |\n| Accessibility | ignored | partial | keyboard + labels + contrast |\n| Can I explain every line aloud? | no | partly | yes |\nScore \u2265 8/10 \u2192 move on; otherwise redo using the hints.\n\n---\n\n# MODULE 67 \u2014 COMPANY-STACK ASSIGNMENTS (12)\n\nPractice for Modules 58\u201366: the things you will meet in a real company repo. *Format:* **Req \u00b7 Acceptance checks \u00b7 Pitfalls.**\n\n**K1 Read a Vue 2 + Vuex feature \ud83d\udfe1.** *Req:* given any Vue 2 repo (or the Options API snippet in Module 58), write a one-page \"reading note\": entry point, router, the component, the Vuex module, the API call, and where one `this.` property comes from (mixin?). *Acceptance:* \u2610 a diagram of component \u2192 dispatch \u2192 mutation \u2192 state \u2192 getter \u2610 you located the API endpoint in the backend controller.\n**K2 Options \u2192 Composition \ud83d\udfe1.** *Req:* rewrite the Module 58 `ChatList` with `<script setup>` + a Pinia store. *Acceptance:* \u2610 same behaviour \u2610 no mixin (replace with a composable) \u2610 explain each mapping aloud.\n**K3 Vuex \u2192 Pinia migration \ud83d\udd34.** *Req:* convert a Vuex module (state/getters/mutations/actions) into a Pinia store, keeping action names; migrate one component. *Acceptance:* \u2610 both stores can coexist during migration \u2610 mutations removed \u2610 tests pass.\n**K4 Firestore realtime composable \ud83d\udd34.** *Req:* `useChatMessages(chatIdRef)` with `onSnapshot`, re-subscribe on id change, cleanup on unmount, error state (use the Firebase emulator or a mock). *Acceptance:* \u2610 only one listener active at a time \u2610 unsubscribed on unmount \u2610 `serverTimestamp()` null handled.\n**K5 Security rules + hybrid design \ud83d\udd34.** *Req:* write Firestore Security Rules for \"a seller reads only their chats\" and a design note on REST for writes + Firestore for realtime reads. *Acceptance:* \u2610 rules tested in the emulator \u2610 the note explains how an optimistic bubble reconciles with the snapshot without duplicates.\n**K6 TypeScript for the contracts \ud83d\udfe1.** *Req:* add types for the Seller Chat DTOs, `Page<T>`, typed service functions, typed props/emits, typed Pinia store; turn on `strict`; run `vue-tsc --noEmit`. *Acceptance:* \u2610 zero `any` \u2610 a wrong event payload fails to compile \u2610 optional fields handled.\n**K7 Wrap a UI library \ud83d\udfe1.** *Req:* pick Element Plus/PrimeVue/Vuetify; build an Orders table (sort, status tag via scoped slot, actions column) and wrap the button as `AppButton`. *Acceptance:* \u2610 theme via CSS variables, no `!important` \u2610 imports are tree-shaken \u2610 a Storybook story per state (optional).\n**K8 i18n \ud83d\udfe1.** *Req:* English + Bahasa with a language switcher (persisted), pluralised unread text, `Intl` dates and money. *Acceptance:* \u2610 no hard-coded strings left \u2610 no concatenated fragments \u2610 a 30%-longer string doesn't break layout.\n**K9 Date bug hunt \ud83d\udd34.** *Req:* reproduce `new Date('2026-10-30')` showing Oct 29 in a US time zone (set the OS/`TZ=America/Los_Angeles`), then fix; write `formatMessageTime` that shows \"Today 14:05 / Yesterday / 28 Oct\". *Acceptance:* \u2610 tests with fixed clock (`vi.setSystemTime`) in two time zones \u2610 no manual millisecond math across DST.\n**K10 Containerise \ud83c\udfed.** *Req:* multi-stage `Dockerfile`, `nginx.conf` with `/api` proxy + `try_files` fallback + caching headers; run it locally. *Acceptance:* \u2610 refresh on `/chats/1` works \u2610 `index.html` not cached, assets cached a year \u2610 image has no `node_modules` \u2610 break the fallback on purpose and observe the 404.\n**K11 CI pipeline design + failure triage \ud83c\udfed.** *Req:* write the pipeline stages for your repo (install \u2192 lint \u2192 test \u2192 build \u2192 scan \u2192 image \u2192 deploy) and triage three provided failures: (a) `Cannot find module './chatitem.vue'` on Linux only, (b) Trivy HIGH CVE in a base image, (c) `heap out of memory`. *Acceptance:* \u2610 each failure has cause + fix + prevention \u2610 you read logs from the first error.\n**K12 Spring contract review \ud83c\udfed.** *Req:* given a Swagger entry and a failing request (400, 415, CORS), find the cause for each: wrong field name, missing `Content-Type`, missing `allowedOrigins`. Write the contract note for Seller Chat (endpoints, JSON, status codes, error shape). *Acceptance:* \u2610 every error mapped to a fix on the correct side (frontend vs backend) \u2610 cursor vs offset pagination decision justified.\n\n**Evaluation:** same rubric as above. **Capstone:** apply the PR checklist (Module 66) to Seller Chat and open a pull request for one stage with screenshots and test steps.\n\n---\n**Next \u2192 Part 11: Final projects (Module 55).**\n\n\n# PART 11 \u2014 FINAL PROJECTS\n\n# MODULE 55 \u2014 COMPLETE FRONTEND PROJECTS\n\n## How to run a project like a company ticket \ud83d\udfe2\nA project is not \"write code until it works\". Treat each one like a real piece of work:\n1. **Read the requirements as user stories** and turn each into acceptance checks (given/when/then).\n2. **Plan milestones** (below). Each milestone ends with something runnable and a commit.\n3. **Create a Git branch per milestone**, open a pull request, and self-review it with the Module 66 checklist.\n4. **Write the contracts first** (JSON shapes). Build against a mock; swap to Spring when ready.\n5. **Test as you go**, not at the end.\n6. **Write a README** (what, how to run, decisions, screenshots). Interviewers read it.\n7. **Do the explain-it test:** walk a friend or mentor through one request's journey and any function line by line.\n\n| # | Project | Stack | Level | Time |\n|---|---|---|---|---|\n| 1 | Personal portfolio | HTML, CSS, vanilla JS | \ud83d\udfe2 | 1\u20132 days |\n| 2 | Employee management dashboard | Vue 3, Router, Pinia, REST | \ud83d\udfe1 | 4\u20136 days |\n| 3 | E-commerce frontend | Vue 3, Router, Pinia, REST | \ud83d\udfe1 | 5\u20137 days |\n| 4 | Admin dashboard | Vue 3, charts, RBAC, WebSocket | \ud83d\udd34 | 6\u20138 days |\n| 5 | Seller Chat (capstone) | Vue 3, Router, Pinia, REST/WebSocket (Module 48) | \ud83d\udd34\ud83c\udfed | 8\u201312 days |\n\n**Universal Definition of Done (every project):** \u2610 runs from a clean clone with the README steps \u2610 loading, empty, error and success states \u2610 keyboard-only usable \u2610 no console errors/warnings \u2610 responsive at 320 / 768 / 1440 px \u2610 no secrets, no `v-html` on user text \u2610 timers/listeners/sockets cleaned up \u2610 at least 5 meaningful tests \u2610 Lighthouse accessibility \u2265 90 \u2610 screenshots in the README.\n\n---\n## PROJECT 1: Personal Portfolio (HTML + CSS + JS)\n\n**Goal:** a page a recruiter can scan in 30 seconds. **Skills:** semantics, CSS layout, responsive design, DOM, forms, accessibility, performance.\n**User stories and acceptance:**\n| Story | Acceptance (Given / When / Then) |\n|---|---|\n| As a recruiter I see who you are quickly | Given the page loads, then the h1 (your name), a one-line role and a \"Contact\" button are visible without scrolling at 375px |\n| I can reach each section | When I press Tab then Enter on a nav link, then focus/scroll moves to that section; a skip link exists |\n| I can browse projects | Given `projects.js` has 6 items, then 6 cards render; clicking a card link opens the project in a new tab with `rel=\"noopener noreferrer\"` |\n| I can switch theme | When I click the toggle, the theme changes, persists on reload, and defaults to my OS setting |\n| I can contact you | When I submit invalid data, errors appear next to fields; when valid, a success message shows |\n**Milestones:** (1) semantic skeleton + metadata \u00b7 (2) tokens, reset, typography \u00b7 (3) layout (flex nav, grid projects) \u00b7 (4) responsive + fluid type \u00b7 (5) JS: render cards, theme, form \u00b7 (6) a11y + performance pass \u00b7 (7) deploy (GitHub Pages/Netlify) and README.\n```\nportfolio/\n\u251c\u2500 index.html\n\u251c\u2500 css/ tokens.css base.css layout.css components.css\n\u251c\u2500 js/  main.js theme.js projects.js contact.js\n\u251c\u2500 data/projects.js           (export const projects = [{ title, summary, url, tags }])\n\u2514\u2500 assets/ img/ (webp + srcset)\n```\n```html\n<!-- index.html (skeleton) -->\n<!doctype html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Asha Menon: Full-stack developer<\/title>\n<meta name=\"description\" content=\"Portfolio of Asha Menon: Java, Spring Boot and Vue.\">\n<link rel=\"stylesheet\" href=\"css/tokens.css\"><link rel=\"stylesheet\" href=\"css/base.css\">\n<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}<\/script>\n<script type=\"module\" src=\"js/main.js\"><\/script><\/head>\n<body>\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n<header class=\"site-header\"><a href=\"#\" class=\"brand\">Asha<\/a>\n  <nav aria-label=\"Main\"><ul><li><a href=\"#about\">About<\/a><\/li><li><a href=\"#projects\">Projects<\/a><\/li><li><a href=\"#contact\">Contact<\/a><\/li><\/ul><\/nav>\n  <button id=\"theme\" type=\"button\" aria-label=\"Toggle theme\">\u25d0<\/button><\/header>\n<main id=\"main\" tabindex=\"-1\">\n  <section id=\"hero\"><h1>Asha Menon<\/h1><p>Full-stack developer \u00b7 Java \u00b7 Spring Boot \u00b7 Vue<\/p><a class=\"btn\" href=\"#contact\">Contact me<\/a><\/section>\n  <section id=\"projects\" aria-labelledby=\"p-h\"><h2 id=\"p-h\">Projects<\/h2><div id=\"project-grid\" class=\"grid\"><\/div><\/section>\n  <section id=\"contact\" aria-labelledby=\"c-h\"><h2 id=\"c-h\">Contact<\/h2>\n    <form id=\"contact-form\" novalidate>\n      <label for=\"n\">Name<\/label><input id=\"n\" name=\"name\" autocomplete=\"name\" required><p class=\"err\" data-for=\"name\" role=\"alert\"><\/p>\n      <label for=\"e\">Email<\/label><input id=\"e\" name=\"email\" type=\"email\" autocomplete=\"email\" required><p class=\"err\" data-for=\"email\" role=\"alert\"><\/p>\n      <label for=\"m\">Message<\/label><textarea id=\"m\" name=\"message\" rows=\"4\" minlength=\"10\" required><\/textarea><p class=\"err\" data-for=\"message\" role=\"alert\"><\/p>\n      <button class=\"btn\" id=\"send\">Send<\/button><p id=\"status\" role=\"status\"><\/p>\n    <\/form><\/section>\n<\/main>\n<footer><small>\u00a9 2026 Asha Menon<\/small><\/footer><\/body><\/html>\n```\n```css\n/* css/base.css (core) */\n:root{--bg:#fff;--fg:#17212b;--muted:#5b6876;--brand:#0b6e75;--surface:#f3f5f8;--line:#dde3ea;--r:12px}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f161d;--fg:#e4ebf1;--muted:#9aa8b6;--brand:#4cc3c9;--surface:#18222c;--line:#2a3745;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0f161d;--fg:#e4ebf1;--muted:#9aa8b6;--brand:#4cc3c9;--surface:#18222c;--line:#2a3745;color-scheme:dark}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;font:1rem/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}\n.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--bg);padding:.5rem;z-index:10}\n:focus-visible{outline:2px solid var(--brand);outline-offset:2px}\n.site-header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.75rem 1rem;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}\n.site-header nav{margin-inline:auto}.site-header ul{display:flex;gap:1rem;list-style:none;margin:0;padding:0}\nmain{width:min(100% - 2rem,1000px);margin-inline:auto}\nh1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;text-wrap:balance}\n.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.5rem}\n.card a{margin-top:auto}\n.btn{display:inline-block;background:var(--brand);color:var(--bg);padding:.6rem 1rem;border:0;border-radius:var(--r);text-decoration:none;cursor:pointer;font:inherit}\nform{display:grid;gap:.5rem;max-width:520px}input,textarea{padding:.6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}\n.err{color:#c0392b;margin:0;min-height:1.2em}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n```\n```js\n// js/contact.js : validation + submit with states\nconst form = document.querySelector('#contact-form'), statusEl = document.querySelector('#status'), send = document.querySelector('#send')\nconst rules = {\n  name: v => (v.trim().length < 2 ? 'Please enter your name.' : ''),\n  email: v => (/^\\S+@\\S+\\.\\S+$/.test(v) ? '' : 'Enter a valid email.'),\n  message: v => (v.trim().length < 10 ? 'Message must be at least 10 characters.' : ''),\n}\nconst show = (field, msg) => { form.querySelector(`[data-for=\"${field}\"]`).textContent = msg; form.elements[field].setAttribute('aria-invalid', !!msg) }\nform.addEventListener('blur', e => { const f = e.target.name; if (rules[f]) show(f, rules[f](e.target.value)) }, true)    // validate on leaving a field\nform.addEventListener('submit', async e => {\n  e.preventDefault()\n  const data = Object.fromEntries(new FormData(form))\n  const errors = Object.fromEntries(Object.keys(rules).map(k => [k, rules[k](data[k] ?? '')]))\n  Object.entries(errors).forEach(([k, m]) => show(k, m))\n  const firstBad = Object.keys(errors).find(k => errors[k]); if (firstBad) { form.elements[firstBad].focus(); return }\n  send.disabled = true; statusEl.textContent = 'Sending\u2026'\n  try {\n    const r = await fetch('https://jsonplaceholder.typicode.com/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: data.name, body: data.message, userId: 1 }) })\n    if (!r.ok) throw new Error(`HTTP ${r.status}`)\n    statusEl.textContent = 'Thanks! I will reply soon.'; form.reset()\n  } catch { statusEl.textContent = 'Could not send. Please try again.' }\n  finally { send.disabled = false }\n})\n```\n**Tests (manual + automated):** keyboard-only pass (skip link, nav, form) \u00b7 axe DevTools 0 violations \u00b7 Lighthouse \u2265 90 all four \u00b7 320/768/1440 px \u00b7 Chrome + Firefox + Safari \u00b7 invalid form shows errors and focuses the first bad field \u00b7 offline \u2192 friendly error. **Performance:** WebP + `srcset`, `loading=\"lazy\"` below the fold, width/height on images, `type=\"module\"` (deferred), system fonts or one preloaded font.\n**Common mistakes:** missing `alt`; theme flash on load (put the tiny head script first); forgetting `rel=\"noopener\"`; `100vh` on mobile (use `dvh`); color contrast below 4.5:1.\n**Evaluation (20 pts):** semantics 4 \u00b7 responsive 4 \u00b7 accessibility 4 \u00b7 performance 4 \u00b7 code quality & README 4.\n\n---\n## PROJECT 2: Employee Management Dashboard (Vue 3)\n\n**Goal:** a CRUD admin screen with real-world touches. **Skills:** Router + guards, Pinia, composables, forms, pagination, RBAC, API layer, tests.\n**User stories and acceptance:**\n| Story | Acceptance |\n|---|---|\n| HR logs in | wrong password \u2192 \"Wrong email or password\"; success \u2192 `/employees` (or `?redirect`) |\n| I search and filter | typing waits 350 ms then queries; dept filter and sort update the list; page resets to 1; URL keeps `q/dept/page` |\n| I page through results | page size 10/25; Prev/Next disabled at ends; \"Showing 11\u201320 of 87\" |\n| I create/edit an employee | modal form validates inline; server 400 errors appear under the right field; 409 duplicate email shows a message; list refreshes |\n| I delete safely | confirm dialog; failure keeps the row and shows a toast |\n| Viewers can't edit | role `VIEWER` sees no Edit/Delete buttons; the API still rejects (403) if called directly |\n**Backend contract (Spring Boot, mock first):**\n```\nPOST /api/auth/login {email,password} \u2192 200 {accessToken,user:{id,name,role}} | 401\nGET  /api/employees?q=&dept=&page=0&size=10&sort=name,asc \u2192 200 Page<EmployeeDto>\nGET/POST/PUT/DELETE /api/employees/{id}      \u2192 400 {errors:[{field,message}]} | 403 | 404 | 409\nEmployeeDto: { id, name, email, dept, role, salary, joinedAt(ISO) }\n```\n**Milestones:** (1) scaffold + tokens + base UI \u00b7 (2) `http`, auth store, router guard, login \u00b7 (3) `useEmployees` composable + mock service \u00b7 (4) table, filters, pagination, 4 UI states \u00b7 (5) form modal with validation + server-error mapping \u00b7 (6) delete confirm + toasts \u00b7 (7) detail route `/employees/:id` \u00b7 (8) RBAC (`auth.can('edit')`) \u00b7 (9) tests \u00b7 (10) swap mock \u2192 Spring, proxy, CORS.\n```\nsrc/\n\u251c\u2500 main.js App.vue router/index.js\n\u251c\u2500 layouts/AppLayout.vue\n\u251c\u2500 views/ LoginView.vue EmployeesView.vue EmployeeDetailView.vue NotFoundView.vue\n\u251c\u2500 components/ base/(BaseButton BaseInput BaseSelect BaseModal BaseSpinner BaseEmptyState BasePagination BaseToastHost)\n\u2502              employees/(EmployeeTable EmployeeRow EmployeeFilters EmployeeForm)\n\u251c\u2500 composables/ useEmployees.js useDebouncedRef.js\n\u251c\u2500 services/ http.js employeeApi.js authApi.js mock/employees.mock.js\n\u251c\u2500 stores/ auth.js ui.js        utils/ format.js validators.js\n```\n```\nEmployeesView\n\u251c\u2500 EmployeeFilters (v-model q, dept)\n\u251c\u2500 EmployeeTable \u2192 EmployeeRow \u00d7N   (props: employee, canEdit; emits: edit, delete)\n\u251c\u2500 BasePagination (v-model:page)\n\u2514\u2500 BaseModal \u2192 EmployeeForm (props: employee|null; emits: saved, cancel)\n```\n```js\n// services/mock/employees.mock.js : behaves like Spring (same shapes, same errors)\nconst db = Array.from({ length: 87 }, (_, i) => ({ id: i + 1, name: `Employee ${i + 1}`, email: `e${i + 1}@corp.com`, dept: ['ENG', 'OPS', 'HR'][i % 3], role: 'STAFF', salary: 30000 + i * 311, joinedAt: '2024-04-01T00:00:00Z' }))\nconst sleep = ms => new Promise(r => setTimeout(r, ms))\nconst err = (status, body) => Object.assign(new Error('mock'), { status, body })\nexport const employeeApiMock = {\n  async list({ q = '', dept = '', page = 0, size = 10, sort = 'name,asc' }) {\n    await sleep(300); const [k, d] = sort.split(',')\n    let rows = db.filter(e => e.name.toLowerCase().includes(q.toLowerCase()) && (!dept || e.dept === dept))\n    rows = [...rows].sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * (d === 'desc' ? -1 : 1))\n    return { content: rows.slice(page * size, page * size + size), totalElements: rows.length, totalPages: Math.ceil(rows.length / size), number: page }\n  },\n  async save(emp) {\n    await sleep(400)\n    if (!/^\\S+@\\S+\\.\\S+$/.test(emp.email)) throw err(400, { errors: [{ field: 'email', message: 'must be a well-formed email address' }] })\n    if (db.some(e => e.email === emp.email && e.id !== emp.id)) throw err(409, { message: 'Email already in use' })\n    if (emp.id) { Object.assign(db.find(e => e.id === emp.id), emp); return emp }\n    const created = { ...emp, id: Math.max(...db.map(e => e.id)) + 1 }; db.push(created); return created\n  },\n  async remove(id) { await sleep(300); db.splice(db.findIndex(e => e.id === id), 1) },\n}\n```\n```js\n// composables/useEmployees.js\nimport { reactive, toRefs, watch, onUnmounted } from 'vue'\nexport function useEmployees() {\n  const state = reactive({ rows: [], total: 0, loading: false, error: null })\n  const query = reactive({ q: '', dept: '', page: 0, size: 10, sort: 'name,asc' })\n  let ctrl, t\n  async function load() {\n    ctrl?.abort(); ctrl = new AbortController(); state.loading = true; state.error = null\n    try { const p = await employeeApi.list({ ...query }, ctrl.signal); state.rows = p.content; state.total = p.totalElements }\n    catch (e) { if (!e.canceled) state.error = e.message } finally { state.loading = false }\n  }\n  watch(() => query.q, () => { query.page = 0; clearTimeout(t); t = setTimeout(load, 350) })\n  watch(() => [query.dept, query.sort, query.size], () => { query.page = 0; load() })\n  watch(() => query.page, load)\n  onUnmounted(() => { ctrl?.abort(); clearTimeout(t) })\n  return { ...toRefs(state), query, load }\n}\n```\n```vue\n<!-- EmployeeForm.vue (create/edit on a draft copy, server errors mapped to fields) -->\n<script setup>\nimport { reactive, ref, watch, computed } from 'vue'\nconst props = defineProps({ employee: Object }), emit = defineEmits(['saved', 'cancel'])\nconst draft = reactive({ name: '', email: '', dept: 'ENG', salary: 30000 })\nwatch(() => props.employee, e => Object.assign(draft, { name: '', email: '', dept: 'ENG', salary: 30000 }, e ?? {}), { immediate: true })\nconst touched = reactive({}), serverErrors = ref({}), saving = ref(false), formError = ref('')\nconst local = computed(() => ({ name: draft.name.trim().length < 2 ? 'Enter a name' : '', email: /^\\S+@\\S+\\.\\S+$/.test(draft.email) ? '' : 'Enter a valid email', salary: draft.salary > 0 ? '' : 'Must be positive' }))\nconst msg = f => (touched[f] && (local.value[f] || serverErrors.value[f])) || ''\nasync function save() {\n  Object.keys(local.value).forEach(k => (touched[k] = true))\n  if (Object.values(local.value).some(Boolean) || saving.value) return\n  saving.value = true; serverErrors.value = {}; formError.value = ''\n  try { await employeeApi.save({ ...draft, id: props.employee?.id }); emit('saved') }\n  catch (e) {\n    if (e.status === 400 && e.body?.errors) serverErrors.value = Object.fromEntries(e.body.errors.map(x => [x.field, x.message]))\n    else formError.value = e.status === 409 ? e.body?.message ?? 'Conflict' : 'Could not save. Please retry.'\n  } finally { saving.value = false }\n}\n<\/script>\n```\n**RBAC:** `auth.can = perm => ({ ADMIN: ['edit','delete'], HR: ['edit','delete'], VIEWER: [] })[user.role]?.includes(perm)`; table passes `:can-edit=\"auth.can('edit')\"`; the router guard checks `meta.roles`; **the server enforces too** (UX is not security).\n**Error matrix:** 400 \u2192 field errors \u00b7 401 \u2192 logout + redirect \u00b7 403 \u2192 toast \"No permission\" \u00b7 404 (detail) \u2192 not-found state \u00b7 409 \u2192 inline message \u00b7 5xx/offline \u2192 retry banner with request id.\n**Tests:** unit: `validators`, `useEmployees` (fake timers: typing 3 chars \u2192 one request; changing `q` resets page); component: `EmployeeForm` (inline errors, emits `saved`, shows server error), `EmployeeTable` (loading/empty/rows, hides actions for viewers); E2E: login \u2192 create \u2192 edit \u2192 delete.\n**Performance:** debounce + abort, lazy routes, skeleton rows, `shallowRef` for rows if thousands.\n**Common mistakes:** fetching in both `onMounted` and an immediate watcher (double request) \u00b7 not resetting `page` on search \u00b7 editing the store's row directly (use a draft) \u00b7 hiding buttons but not handling 403 \u00b7 forgetting `finally` for `saving`.\n**Evaluation (30 pts):** features 8 \u00b7 architecture 6 \u00b7 states/errors 6 \u00b7 a11y 4 \u00b7 tests 3 \u00b7 API contract doc 3.\n\n---\n## PROJECT 3: E-commerce Frontend (Vue 3)\n\n**Goal:** the classic shopping flow with URL-driven filters and persisted cart. **Skills:** URL state, cart store, checkout forms, idempotency, edge cases.\n**User stories and acceptance:**\n| Story | Acceptance |\n|---|---|\n| Browse and filter | filters (category, price range, sort) and search live in the URL; refresh/back/forward restore them |\n| Product detail | `/products/:id` loads on param change; gallery switches images; out-of-stock disables Add |\n| Cart | add/remove/change qty; badge shows count; survives refresh; qty never < 1 |\n| Checkout | validated address form; double-click doesn't create two orders; server 409 (stock) shows which item |\n| Orders | `/orders` requires login; lists my orders newest first |\n**Contracts:**\n```\nGET  /api/products?q=&category=&minPrice=&maxPrice=&sort=&page=&size=   \u2192 Page<ProductDto{id,title,pricePaise,images[],stock,category}>\nGET  /api/products/{id}\nPOST /api/orders { items:[{productId,qty}], address:{\u2026} }  Header: Idempotency-Key: <uuid>   \u2192 201 {id,totalPaise} | 409 {message,items:[{productId,available}]}\nGET  /api/orders/me   (auth)\n```\n**Milestones:** (1) tokens/base UI \u00b7 (2) catalog with URL-synced filters (`useQuerySync`) \u00b7 (3) product detail (watch on id, skeleton) \u00b7 (4) cart store + persistence (versioned key) \u00b7 (5) checkout form + idempotency + server errors \u00b7 (6) orders + guard \u00b7 (7) a11y/perf polish \u00b7 (8) tests + Playwright flow.\n```js\n// composables/useQuerySync.js: two-way sync between refs and the URL\nimport { watch } from 'vue'\nimport { useRoute, useRouter } from 'vue-router'\nexport function useQuerySync(filters, defaults) {\n  const route = useRoute(), router = useRouter()\n  Object.keys(defaults).forEach(k => { if (route.query[k] !== undefined) filters[k] = typeof defaults[k] === 'number' ? Number(route.query[k]) : route.query[k] })\n  watch(filters, f => router.replace({ query: Object.fromEntries(Object.entries(f).filter(([k, v]) => v !== defaults[k] && v !== '')) }), { deep: true })\n  watch(() => route.query, q => Object.keys(defaults).forEach(k => (filters[k] = q[k] !== undefined ? (typeof defaults[k] === 'number' ? Number(q[k]) : q[k]) : defaults[k])))\n}\n```\n```js\n// stores/cart.js (integer paise, versioned persistence)\nexport const useCartStore = defineStore('cart', () => {\n  const read = () => { try { return JSON.parse(localStorage.getItem('cart.v1') ?? '[]') } catch { return [] } }\n  const items = ref(read())\n  const count = computed(() => items.value.reduce((n, i) => n + i.qty, 0))\n  const subtotal = computed(() => items.value.reduce((s, i) => s + i.pricePaise * i.qty, 0))\n  const add = (p, qty = 1) => { const x = items.value.find(i => i.id === p.id); x ? (x.qty = Math.min(p.stock, x.qty + qty)) : items.value.push({ id: p.id, title: p.title, pricePaise: p.pricePaise, stock: p.stock, qty }) }\n  const setQty = (id, qty) => { const x = items.value.find(i => i.id === id); if (x) x.qty = Math.min(x.stock, Math.max(1, qty)) }\n  const remove = id => (items.value = items.value.filter(i => i.id !== id))\n  const clear = () => (items.value = [])\n  watch(items, v => { try { localStorage.setItem('cart.v1', JSON.stringify(v)) } catch {} }, { deep: true })\n  return { items, count, subtotal, add, setQty, remove, clear }\n})\n```\n```js\n// checkout submit: idempotency + server truth\nconst key = ref(crypto.randomUUID())                               // one key per checkout attempt, reused on retry\nasync function placeOrder() {\n  if (placing.value) return; placing.value = true; error.value = ''\n  try {\n    const order = await orderApi.create({ items: cart.items.map(({ id, qty }) => ({ productId: id, qty })), address: form }, { headers: { 'Idempotency-Key': key.value } })\n    cart.clear(); router.replace({ name: 'order-done', params: { id: order.id } })\n  } catch (e) { error.value = e.status === 409 ? 'Some items changed. Review your cart.' : 'Could not place the order. Try again.'; if (e.status === 409) stockIssues.value = e.body.items }\n  finally { placing.value = false }\n}\n```\n**Never trust client prices:** send ids + qty; the server recalculates totals. **Money:** integer paise; format with `Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(p/100)`.\n**Tests:** cart store (add caps at stock, qty min 1, totals, persistence); `ProductCard` (renders price, emits add); `useQuerySync` (URL \u2194 state); Playwright: browse \u2192 add \u2192 checkout \u2192 confirmation.\n**Performance:** `srcset` + lazy images, route splitting, debounced search, skeletons, cache list responses for a minute.\n**Common mistakes:** float prices \u00b7 cart in memory only \u00b7 double order on double click \u00b7 filters in component state (lost on refresh) \u00b7 using index as key in the cart list.\n**Evaluation (30 pts):** UX flow 8 \u00b7 state management 6 \u00b7 responsiveness 4 \u00b7 errors/edge cases 5 \u00b7 a11y 3 \u00b7 tests/perf 4.\n\n---\n## PROJECT 4: Admin Dashboard (Vue 3)\n\n**Goal:** a multi-role console with real-time updates. **Skills:** RBAC, generic components (scoped slots), WebSocket with reconnect, charts, `allSettled`, CSV export.\n**User stories and acceptance:**\n| Story | Acceptance |\n|---|---|\n| Roles | ADMIN sees all; MANAGER can't delete users; VIEWER is read-only; forbidden route \u2192 `/forbidden` |\n| Overview | 4 KPI cards + 2 charts; if one widget fails, others still show; each has loading/error/retry |\n| Users | generic `DataTable` (sort, paginate, scoped-slot cells); create/edit/delete gated by permission |\n| Activity feed | new events appear within a second without refresh; shows \"Reconnecting\u2026\" if the socket drops, resumes after |\n| Audit log | filter by user/date/action; CSV export of the filtered rows |\n| Settings | theme + profile persisted |\n```\nsrc/\n\u251c\u2500 layouts/AdminLayout.vue (sidebar, topbar, breadcrumbs)\n\u251c\u2500 router/ (routes with meta.roles + guard)\n\u251c\u2500 views/ OverviewView UsersView AuditLogView SettingsView ForbiddenView\n\u251c\u2500 components/ KpiCard LineChart BarChart DataTable FilterBar ActivityFeed PermissionGate\n\u251c\u2500 composables/ usePermissions useRealtime useTheme useCsvExport useDataTable useWidget\n\u251c\u2500 stores/ auth ui metrics notifications     services/ metricsApi usersApi auditApi\n```\n```js\n// composables/usePermissions.js + PermissionGate\nconst MATRIX = { ADMIN: ['users:read', 'users:write', 'users:delete', 'audit:read'], MANAGER: ['users:read', 'users:write', 'audit:read'], VIEWER: ['users:read'] }\nexport const can = perm => MATRIX[useAuthStore().user?.role]?.includes(perm) ?? false\n// <PermissionGate perm=\"users:delete\"><button @click=\"remove\">Delete<\/button><\/PermissionGate>\n//   \u2192 <slot v-if=\"can(perm)\" /><slot v-else name=\"fallback\" />\n// router: { path: '/audit', meta: { roles: ['ADMIN', 'MANAGER'] } } \u2192 guard sends others to { name: 'forbidden' }\n```\n```vue\n<!-- components/DataTable.vue : generic, cell rendering via scoped slots -->\n<script setup>\ndefineProps({ columns: Array, rows: Array, sort: Object, loading: Boolean })\ndefineEmits(['sort'])\n<\/script>\n<template>\n  <table>\n    <thead><tr><th v-for=\"c in columns\" :key=\"c.key\" scope=\"col\" :aria-sort=\"sort?.key === c.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'\">\n      <button v-if=\"c.sortable\" @click=\"$emit('sort', c.key)\">{{ c.label }}<\/button><template v-else>{{ c.label }}<\/template><\/th><\/tr><\/thead>\n    <tbody>\n      <template v-if=\"loading\"><tr v-for=\"n in 5\" :key=\"n\" class=\"sk\"><td :colspan=\"columns.length\">&nbsp;<\/td><\/tr><\/template>\n      <tr v-else-if=\"!rows.length\"><td :colspan=\"columns.length\">No data<\/td><\/tr>\n      <tr v-else v-for=\"(r, i) in rows\" :key=\"r.id ?? i\"><td v-for=\"c in columns\" :key=\"c.key\"><slot :name=\"`cell-${c.key}`\" :row=\"r\" :value=\"r[c.key]\">{{ r[c.key] }}<\/slot><\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/template>\n<!-- <DataTable :columns=\"cols\" :rows=\"users\"><template #cell-role=\"{ value }\"><BaseBadge>{{ value }}<\/BaseBadge><\/template><\/DataTable> -->\n```\n```js\n// composables/useRealtime.js : backoff reconnect + resync + cleanup\nexport function useRealtime(url, onMessage, { onResync } = {}) {\n  let ws, tries = 0, closed = false, timer, lastId = null\n  const status = ref('connecting')\n  const connect = () => {\n    ws = new WebSocket(lastId ? `${url}?since=${lastId}` : url)\n    ws.onopen = () => { status.value = 'open'; if (tries) onResync?.(lastId); tries = 0 }       // after a drop, fetch what we missed\n    ws.onmessage = e => { const m = JSON.parse(e.data); lastId = m.id ?? lastId; onMessage(m) }\n    ws.onclose = () => { status.value = 'reconnecting'; if (!closed) timer = setTimeout(connect, Math.min(1000 * 2 ** tries++, 15000) + Math.random() * 300) }\n  }\n  onMounted(connect)\n  onUnmounted(() => { closed = true; clearTimeout(timer); ws?.close() })\n  return { status }\n}\n```\n```js\n// composables/useCsvExport.js : (downloads are done by the browser in your own app; escape properly)\nexport const toCsv = (rows, cols) => [cols.map(c => c.label).join(','), ...rows.map(r => cols.map(c => `\"${String(r[c.key] ?? '').replace(/\"/g, '\"\"')}\"`).join(','))].join('\\n')\nexport const download = (name, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; a.click(); URL.revokeObjectURL(a.href) }\n```\n**Dashboard loading:** `Promise.allSettled([stats.run(), series.run(), top.run()])` with a `useWidget` per card (Module 54 I9). **Charts:** a `LineChart` wrapper component that creates the chart in `onMounted`, updates in a `watch` on data, and **destroys it in `onUnmounted`**; lazy-load the chart library with `defineAsyncComponent`. **Throttle** feed updates (e.g. batch every 500 ms) so a burst doesn't re-render per message.\n**Tests:** permission matrix (unit), router guard (`meta.roles` redirects), `DataTable` (slots, aria-sort, empty/loading), `useRealtime` (fake WebSocket: reconnect schedule, cleanup), E2E role access.\n**Common mistakes:** treating route guards as security \u00b7 chart not destroyed (memory leak) \u00b7 unbounded activity list (cap at 200) \u00b7 reconnect storms (no backoff/jitter) \u00b7 CSV without quote-escaping.\n**Evaluation (35 pts):** RBAC 6 \u00b7 dashboard widgets 7 \u00b7 realtime 6 \u00b7 reusable components 6 \u00b7 errors/states 5 \u00b7 tests/perf 5.\n\n---\n## PROJECT 5: Seller Chat Application (capstone)\n\n**Goal:** everything together in one production-style app. Follow **Module 48** (Stages 1\u20137), then add the hardening below.\n**Extra requirements:** WebSocket inbound with reconnect + resync \u00b7 unread counts \u00b7 cursor-paginated history (infinite scroll upward) \u00b7 image/file attachments with progress \u00b7 message status (sending/sent/failed) \u00b7 tab-title unread badge + optional sound \u00b7 keyboard shortcuts \u00b7 single-pane mobile mode \u00b7 accessibility (live region, focus management) \u00b7 error-monitoring hook.\n**User stories and acceptance (additional):**\n| Story | Acceptance |\n|---|---|\n| New message arrives | appears within a second; bubble not duplicated if I also sent it; unread badge increments only for chats not open |\n| I scroll up | older messages load in 30s; my viewport doesn't jump; stops when none left |\n| Connection drops | banner \"Reconnecting\u2026\"; sending is queued or shows Retry; after reconnect, missed messages appear exactly once |\n| Attach a file | progress bar, cancel, error state; max size/type validated |\n| Mobile | `/chats` shows the list only; `/chats/:id` shows the room with a Back link |\n| Accessibility | new messages announced politely; focus moves to the room heading on navigation; all actions keyboard-reachable |\n**Implementation order:** Module 48 stages \u2192 `useChatSocket` \u2192 dedupe/resync \u2192 infinite history \u2192 attachments \u2192 mobile pane routing \u2192 a11y pass \u2192 tests \u2192 performance pass \u2192 docs.\n```js\n// composables/useChatSocket.js: dedupe by id AND by clientId (optimistic bubbles)\nexport function useChatSocket(store) {\n  const { status } = useRealtime(import.meta.env.VITE_WS_URL, m => store.receive(m), { onResync: id => store.resync(id) })\n  return { status }\n}\n// store\nfunction receive(m) {\n  const list = (messagesByChat.value[m.chatId] ??= [])\n  const i = list.findIndex(x => x.id === m.id || (m.clientId && x.clientId === m.clientId))\n  if (i >= 0) Object.assign(list[i], m, { status: 'sent' })            // replace optimistic bubble, no duplicate\n  else { list.push(m); if (m.chatId !== activeId.value) bumpUnread(m.chatId) }\n}\nasync function resync(lastId) {                                          // fetch anything after the last id we have\n  const missed = await chatApi.messages(activeId.value, { after: lastId }); missed.forEach(receive)\n}\n```\n```js\n// composables/useInfiniteHistory.js: scroll-preserving prepend with IntersectionObserver\nexport function useInfiniteHistory({ box, sentinel, load }) {\n  const loading = ref(false), done = ref(false); let io\n  async function loadOlder() {\n    if (loading.value || done.value) return\n    loading.value = true; const prev = box.value.scrollHeight\n    try { const older = await load(); if (older.length < 30) done.value = true; await nextTick(); box.value.scrollTop = box.value.scrollHeight - prev }\n    finally { loading.value = false }\n  }\n  onMounted(() => { io = new IntersectionObserver(([e]) => e.isIntersecting && loadOlder(), { root: box.value }); io.observe(sentinel.value) })\n  onUnmounted(() => io?.disconnect())\n  return { loading, done }\n}\n```\n```vue\n<!-- mobile single-pane via routes (Module 39): ChatsView -->\n<template>\n  <div class=\"chats\" :class=\"{ 'is-room': route.name === 'chat' }\">\n    <ChatSidebar class=\"chats__list\" />\n    <RouterView class=\"chats__room\" />\n  <\/div>\n<\/template>\n<style scoped>\n.chats{display:grid;height:100%}\n@media (max-width:767px){
